          model: "[A] Yes, right now I'm working towards two goals: getting a summer internship and learning Spanish. [R] The internship will give me real work experience, and Spanish will help me in my future career, because I want to work for an international company. [E] For example, I've already updated my résumé and applied to five companies. For Spanish, I study with an app for twenty minutes every morning and take a conversation class on Thursdays. I'm **making** good **progress** — I can already have simple conversations. [C] So these two goals keep me busy, but they're very important to me.",
          model5: "[A] Yes, at the moment I'm working towards two specific goals: landing a summer internship and reaching an intermediate level in Spanish. [R] Both are closely tied to my long-term plans, since I'm hoping to work for an international company, where practical experience and a second foreign language would set me apart. [E] For the internship, I've rewritten my résumé and applied to five companies so far. As for Spanish, I practice with an app for twenty minutes every morning and attend a conversation class on Thursdays, and I'm genuinely **making progress** — last week I managed a ten-minute conversation without switching to English. [C] So although they keep me busy, these goals give my everyday routine a real sense of direction." },
        { q: "Can you describe some steps you can take to achieve these goals or to achieve goals in general? What are the challenges you face when taking these steps?",
          lx: ["break it down", "track your progress", "lose motivation"],
          model: "[A] The most important step for me is to break a big goal into small daily tasks. [R] A big goal can feel scary, but small tasks are easy to start. I also **track my progress**, so I can see that I'm moving forward. [E] For example, with Spanish, my goal is twenty minutes a day, not \"become fluent\". I mark every day in my calendar. The biggest challenge is **losing motivation**, especially during exams, when I'm tired and want to skip days. When that happens, I just do five minutes instead of twenty. [C] So small, regular steps are the key for me.",
          model5: "[A] For me, the crucial step is breaking a big goal down into small, concrete daily tasks. [R] A goal like \"become fluent in Spanish\" is so vague that it's almost paralyzing, whereas twenty minutes of practice a day feels perfectly manageable. I also **track my progress**, because seeing a chain of completed days is surprisingly motivating. [E] I mark each study session in my calendar, for instance, and try never to break the chain. The main challenge, admittedly, is **losing motivation** during busy periods like exam season. Rather than giving up altogether, though, I lower the bar and do just five minutes. [C] Consistency, in short, matters far more to me than intensity." },
        { q: "Can you describe an accomplishment that holds special meaning for you? What did you achieve and why is it significant to you?",
          lx: ["sense of accomplishment", "perseverance", "set a goal"],
          model: "[A] The accomplishment I'm most proud of is finishing my first half marathon last spring. [R] It's special because two years ago I couldn't run more than ten minutes, and many people, even my friends, didn't believe I could do it. [E] I **set a goal**, found a training plan online and ran four times a week for six months. I had a knee injury in the middle, but I didn't give up. When I crossed the finish line, I almost cried. [C] It showed me that with **perseverance**, I can do things I thought were impossible.",
          model5: "[A] The accomplishment that means the most to me is completing my first half marathon last spring. [R] What makes it so significant is how far I'd come: just two years earlier, I couldn't run for more than ten minutes, and even some of my friends doubted I'd make it. [E] I followed a six-month training plan, running four times a week, and halfway through I suffered a knee injury that cost me three weeks. Instead of quitting, I adjusted the plan and kept going. Crossing the finish line gave me a **sense of accomplishment** I'd never felt before. [C] More than anything, it proved to me that **perseverance** matters far more than natural talent." },
        { q: "Some people believe that setting and working towards individual goals is crucial for self-improvement and personal growth. Do you agree or disagree with this idea? Why?",
          lx: ["personal growth", "set a goal", "sense of direction"],
          model: "[A] I agree with this idea. [R] Goals give you direction. Without them, it's easy to do the same things every day and never improve. When you **set a goal**, you push yourself out of your comfort zone, and that's how you grow. [E] For example, before I decided to run a half marathon, I didn't exercise at all. The goal changed my habits — I started sleeping better, eating healthier and feeling more confident. [C] So I think goals are one of the best tools for **personal growth**, as long as they're realistic.",
          model5: "[A] I strongly agree that goals are crucial for personal growth. [R] Without them, it's all too easy to drift through life repeating the same routines; a clear goal, by contrast, pushes you out of your comfort zone, which is precisely where growth happens. [E] Before I committed to running a half marathon, for instance, I barely exercised. That single goal ended up transforming my habits far beyond running: I began sleeping better, eating more healthily and, perhaps most importantly, trusting myself to finish what I start. [C] So I'd say goals are among the most powerful tools for self-improvement, provided they're challenging but realistic." }
      ]},
    { id: "s089", badge: "official", title: "Setting Personal Goals", src: "Official TOEFL · 089",
      scenario: "You have agreed to participate in a research study about people's experiences with setting personal goals. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, think of a time, recent or not, when you had something you wanted to achieve. What was it?",
          lx: ["achieve", "set a goal", "milestone"],
          model: "[A] Last year, I really wanted to get into a summer exchange program in Spain. [R] I'd never lived abroad, and I wanted to improve my Spanish and become more independent. But the program was very competitive — only ten students were accepted. [E] To get in, I needed a good language test score and a strong motivation letter. So I studied Spanish every day for four months and rewrote my letter five times with my teacher's help. In the end, I was accepted. [C] It was one of the most important goals I've ever **achieved**.",
          model5: "[A] Last year, I was determined to get into a highly competitive summer exchange program in Spain. [R] I'd never lived abroad before, and I saw it as a chance not only to improve my Spanish but also to become more independent. Only ten places were available, however, so I knew it wouldn't be easy. [E] I needed a strong language test score and a convincing motivation letter, so for four months I studied Spanish every single day and rewrote my letter five times with my teacher's feedback. Each draft felt like a small **milestone**. In the end, to my delight, I was accepted. [C] It remains one of the goals I'm proudest of having **achieved**." },
        { q: "In general, how do you handle difficulties or obstacles that come up while working toward what you want to achieve?",
          lx: ["setback", "get back on track", "take it one step at a time"],
          model: "[A] When I have a difficulty, I first take a short break, and then I make a new plan. [R] If I try to continue when I'm angry or tired, I usually make things worse. After a break, I can see the problem more clearly. [E] For example, during my half marathon training, I hurt my knee and couldn't run for three weeks. At first I was very upset. But then I talked to a coach, did exercises for my knee and changed my plan. I **got back on track** and finished the race. [C] So for me, a **setback** is a reason to change the plan, not to give up.",
          model5: "[A] My approach is to step back briefly and then adapt my plan rather than abandon it. [R] Pushing on while frustrated rarely helps, whereas a short pause usually lets me see the obstacle more clearly and find a way around it. [E] During my half marathon training, for instance, I injured my knee and couldn't run for three weeks. Initially, I was devastated and seriously considered quitting. Instead, I consulted a coach, focused on strengthening exercises and rebuilt my schedule, **taking it one step at a time**. Within two months, I was fully **back on track**, and I finished the race. [C] So I see **setbacks** as signals to adjust the route, not to change the destination." },
        { q: "In your opinion, how important is goal setting for personal growth?",
          lx: ["personal growth", "sense of direction", "comfort zone"],
          model: "[A] I think goal setting is very important for personal growth. [R] Goals give you a direction and make you try new things. Without goals, many people stay in their **comfort zone** and don't change. [E] For example, my older brother was shy and never spoke in public. Last year, he **set a goal** to give one presentation at work every month. At first it was terrible, but now he's confident and even got a promotion. [C] So goals help us become better versions of ourselves.",
          model5: "[A] I'd say goal setting is essential for personal growth. [R] Goals provide a **sense of direction** and, crucially, force us to attempt things we'd otherwise avoid; without them, most people stay comfortably where they are. [E] My older brother, for example, was painfully shy and dreaded public speaking. Last year, he deliberately set himself the goal of giving one presentation at work every month. The first few were, by his own admission, disastrous, yet a year later he speaks confidently in meetings and has even been promoted. [C] So while growth can happen by accident, a clear goal makes it far more likely to happen." },
        { q: "Do you think children should be taught to set personal goals from an early age? Why or why not?",
          lx: ["set a goal", "self-discipline", "pressure"],
          model: "[A] Yes, I think children should learn this early, but in a fun way. [R] If kids learn to set small goals, they understand that effort leads to results. This helps them later at school and in life. But the goals should be simple, not stressful. [E] For example, my little sister's teacher asks every child to choose one goal a month, like reading three books or learning to ride a bike. When they achieve it, they get a sticker. My sister loves it and is very proud of herself. [C] So goal setting is good for kids, if there's no **pressure**.",
          model5: "[A] I believe they should, as long as it's done in a playful, pressure-free way. [R] Learning to set small goals teaches children early on that effort leads to results, which builds **self-discipline** and confidence that will serve them throughout school and beyond. The goals, however, must be simple and genuinely their own. [E] My little sister's teacher, for instance, asks each child to choose one monthly goal, such as reading three books or learning to ride a bike, and rewards them with a sticker when they succeed. My sister takes it incredibly seriously and is visibly proud of herself. [C] So early goal setting is valuable, provided it builds confidence rather than **pressure**." }
      ]},
    { id: "s061", badge: "official", title: "Time Management", src: "Official TOEFL · 061",
      scenario: "You received an email from your university inviting you to join a research study about time management. You have scheduled a short online interview with a researcher to answer a few questions.",
      questions: [
        { q: "First, do you use any tools or techniques to manage your time effectively? Please give some examples.",
          lx: ["to-do list", "set a reminder", "manage your time"],
          model: "[A] Yes, I use two main tools: a calendar app and a paper **to-do list**. [R] The calendar helps me remember fixed things like classes and work shifts, and the list helps me focus on what I need to do today. [E] For example, every Sunday evening I put all my deadlines in the calendar and **set reminders** two days before each one. Then every morning I write three main tasks on a sticky note and put it on my laptop. Crossing them off feels great. [C] So these simple tools help me **manage my time** without stress.",
          model5: "[A] Yes, I rely on two tools in particular: a digital calendar and a handwritten **to-do list**. [R] The calendar takes care of fixed commitments such as lectures and work shifts, while the list keeps me focused on what genuinely matters each day. [E] Every Sunday evening, for instance, I enter all upcoming deadlines into my calendar and **set reminders** two days before each one. Then, every morning, I write my three priorities for the day on a sticky note and stick it to my laptop. Limiting myself to three prevents me from overcommitting, and crossing them off is oddly satisfying. [C] These simple habits, I find, help me **manage my time** without feeling controlled by it." },
        { q: "Can you describe a typical day's events for you and how you organize your time?",
          lx: ["routine", "schedule", "make time for"],
          model: "[A] On a typical weekday, my day is very busy, so I plan it carefully. [R] I have classes, a part-time job and the gym, and without a plan, I'd forget something. [E] I wake up at seven, have breakfast and review my to-do list. From nine to two I have classes. In the afternoon I study in the library for two hours, and three times a week I work at a café from five to nine. I always **make time for** the gym in the morning or on weekends. [C] So my **schedule** is full, but having a clear **routine** helps me get everything done.",
          model5: "[A] My weekdays are fairly packed, so I organize them quite carefully. [R] Between lectures, a part-time job and training, my **schedule** would quickly fall apart without a clear structure. [E] I usually get up at seven, have breakfast and glance over my priorities for the day. Lectures take up most of the time between nine and two, after which I spend a couple of hours studying in the library, as I concentrate far better there than in my dorm. Three evenings a week, I work at a café, so I deliberately **make time for** the gym in the mornings on the other days. [C] It's a demanding **routine**, but having one means I rarely feel lost." },
        { q: "Tell me about a time when you had to manage multiple tasks or responsibilities at once. How did you handle it?",
          lx: ["prioritize", "race against the clock", "bite off more than you can chew"],
          model: "[A] At the end of last semester, I had to manage many tasks at the same time. [R] I had two exams, a group presentation and extra shifts at work, all in one week. Honestly, I'd **bitten off more than I could chew**. [E] First, I wrote down every task with its deadline. Then I **prioritized** — exams first, then the presentation. I asked my manager to give one of my shifts to a coworker, and I divided the presentation work with my group. It was a **race against the clock**, but I finished everything on time. [C] I learned that it's important to prioritize and ask for help.",
          model5: "[A] The most stressful example was the final week of last semester. [R] I had two exams, a group presentation and extra shifts at work, all within five days — I'd clearly **bitten off more than I could chew**. [E] Rather than panicking, I listed every task alongside its deadline and **prioritized** ruthlessly: exams came first, the presentation second. I then asked my manager to reassign one of my shifts and split the remaining presentation work more evenly within my group. The whole week was a **race against the clock**, yet I met every deadline and even did well on both exams. [C] Above all, it taught me that prioritizing and asking for help aren't signs of weakness but of good judgment." },
        { q: "Some people believe that managing your time wisely can lead to higher productivity, while others think it can cause unnecessary stress and prefer a looser schedule. What is your opinion on this? Why?",
          lx: ["productivity", "flexible", "time management"],
          model: "[A] I think good **time management** increases **productivity**, but only if your plan is **flexible**. [R] When you plan your day, you don't waste time deciding what to do next. But if you plan every minute, you feel stressed when something goes wrong. [E] For example, last year I tried to plan my whole day in thirty-minute blocks. After a week, I felt like a robot, and one small delay ruined my whole plan. Now I only plan my three main tasks, and I get more done. [C] So a simple plan is better than a strict one.",
          model5: "[A] In my view, managing your time wisely does boost **productivity**, but only when the plan leaves room for flexibility. [R] A clear plan saves you from constantly deciding what to do next, which is surprisingly draining. Overly rigid schedules, however, turn every small delay into a source of stress. [E] Last year, for instance, I experimented with planning my entire day in thirty-minute blocks. Within a week, I felt like a machine, and a single late bus could derail everything. Nowadays I plan only my three main priorities and leave the rest **flexible**, and, paradoxically, I accomplish far more. [C] So the key, I think, is structure without rigidity." }
      ]},
    { id: "s114", badge: "official", title: "Personal Organization Habits", src: "Official TOEFL · 114",
      scenario: "You have volunteered for a research study at your university about personal organization habits. You will have a short online interview with a researcher.",
      questions: [
        { q: "Do you consider yourself to be an organized person? Why or why not?",
          lx: ["organized", "keep track of", "plan ahead"],
          model: "[A] Yes, I'd say I'm quite **organized**, at least with my time. [R] I have a lot of responsibilities — classes, a job, sports — so I can't just remember everything. I need a system. [E] For example, I **keep track of** all my deadlines in a calendar app, and I always **plan ahead** for exams, so I never study the night before. But my room is another story — my desk is usually covered with papers and coffee cups. [C] So I'm organized with my schedule, but not so much with my things.",
          model5: "[A] I'd describe myself as organized, at least as far as my time is concerned. [R] Juggling lectures, a part-time job and training means I simply can't rely on memory; I need a system. [E] I **keep track of** every deadline in a calendar app, for example, and I always **plan ahead** for exams, so I haven't crammed the night before in over a year. My physical space, on the other hand, is a different story: my desk is usually buried under notes and empty coffee cups. My roommate jokes that I'm organized everywhere except where it's visible. [C] So I'm highly organized with my schedule, but there's definitely room for improvement with my belongings." },
        { q: "Would you say that your organization habits have changed or stayed the same over time? Why do you think that is?",
          lx: ["get organized", "responsibilities", "habit"],
          model: "[A] My organization habits have changed a lot. [R] In high school, my parents and teachers reminded me about everything, so I didn't need to be organized. At university, nobody does that, and I have many more **responsibilities**. [E] For example, in my first semester, I missed an important deadline because I forgot about it. That was a wake-up call. After that, I started using a calendar and a to-do list every day, and now it's a **habit**. [C] So I **got organized** because I had to, and I'm happy I did.",
          model5: "[A] They've changed dramatically, mostly out of necessity. [R] In high school, my parents and teachers reminded me about almost everything, so I never really needed a system of my own. University, however, brought far more **responsibilities** and nobody to remind me of them. [E] In my very first semester, for instance, I completely forgot about an essay deadline and lost a significant portion of my grade. It was an unpleasant but valuable wake-up call. Since then, I've used a calendar and a daily to-do list without fail, and what started as an effort has become an automatic **habit**. [C] So I **got organized** because I had no choice, and I'm genuinely grateful I did." },
        { q: "Do you think organizational skills should be taught in schools? Why or why not?",
          lx: ["time management", "plan ahead", "life skills"],
          model: "[A] Yes, I definitely think schools should teach organizational skills. [R] Many students are smart, but they get bad grades because they forget deadlines or start studying too late. These skills are also useful later at work and in life. [E] For example, when I started university, many of my classmates struggled in the first semester, not because the classes were hard, but because nobody had taught them how to **plan ahead**. A short course in high school could have helped them a lot. [C] So schools should teach **time management** just like math or history.",
          model5: "[A] I'm convinced they should. [R] Plenty of capable students underperform not because they lack ability but because they lose track of deadlines or start revising far too late. Organizational skills are, moreover, **life skills** that matter just as much at work as at school. [E] When I started university, for example, a surprising number of my classmates struggled during the first semester, not because the content was too difficult, but because nobody had ever shown them how to **plan ahead** or break down a big assignment. A short course in high school could easily have spared them that stress. [C] So **time management** deserves a place in the curriculum alongside traditional subjects." },
        { q: "Some people believe that being organized can significantly reduce stress. Do you agree or disagree with this viewpoint? Why?",
          lx: ["overwhelmed", "keep track of", "last-minute"],
          model: "[A] I completely agree. [R] When you're organized, you know what you need to do and when, so you don't worry about forgetting things. Most stress comes from **last-minute** surprises. [E] For example, before I started using a planner, I often felt **overwhelmed** — I'd suddenly remember an assignment due the next day and panic. Now I can see all my deadlines for the month, and even exam week feels calm. My friend who never plans is always stressed and running around. [C] So being organized doesn't remove all stress, but it reduces it a lot.",
          model5: "[A] I completely agree with this viewpoint. [R] A great deal of everyday stress comes not from the work itself but from uncertainty — the nagging feeling that you've forgotten something or that a deadline is about to ambush you. Being organized eliminates much of that uncertainty. [E] Before I started using a planner, for instance, I frequently felt **overwhelmed**, suddenly remembering an assignment due the next morning and spending the night in a panic. Now that I can see every deadline weeks in advance, even exam season feels manageable. A friend of mine who refuses to plan, by contrast, lurches from one **last-minute** crisis to the next. [C] So organization won't remove stress entirely, but it dramatically reduces it." }
      ]},
    { id: "spg", badge: "platform", title: "Personal Goals", src: "Практика платформы",
      scenario: "We're conducting a study to better understand what motivates people to set and pursue personal goals. I'd like to ask you a few questions about your current priorities and experiences.",
      questions: [
        { q: "To start off, what are one or two personal goals that are important to you right now? These could be related to your career, education, health, or even personal development. Why are those goals meaningful to you?",
          lx: ["set a goal", "priority", "personal growth"],
          model: "[A] Right now, my two most important goals are getting a good internship and taking better care of my health. [R] The internship is meaningful because it's the first real step in my career. Health matters because last year I was always tired and stressed, and I don't want to feel like that again. [E] For example, I've **set a goal** to apply to two companies every week. For my health, I go to bed before midnight and run three times a week. I already feel much more energetic. [C] So one goal is about my future, and the other is about feeling good today.",
          model5: "[A] At the moment, my two top **priorities** are securing a good internship and looking after my health. [R] The internship matters because it would be the first concrete step towards the career I want, whereas my health goal stems from last year, when I was constantly exhausted and anxious and realized I couldn't go on like that. [E] So I've **set** myself **a goal** of applying to two companies every week, and, on the health side, I'm in bed before midnight and run three times a week. The difference is already striking: I have far more energy, which, in turn, makes the job search less draining. [C] One goal, in short, is about my future, and the other is about enjoying the present." },
        { q: "Some people stay motivated by creating detailed plans, setting deadlines, or breaking their goals into small, manageable tasks. Others might use vision boards, apps, or reward systems. What specific strategies or habits help you stay focused on your goals over time? Why do you think those work for you?",
          lx: ["break it down", "track your progress", "accountability"],
          model: "[A] Two strategies help me the most: small tasks and a study partner. [R] Small tasks are easy to start, so I don't **procrastinate**. And a partner gives me **accountability** — I don't want to let someone else down. [E] For example, for my Spanish goal, I study twenty minutes a day with an app, and I meet a classmate every Thursday to practice speaking. If I skip a day, she notices and asks me why! I also **track my progress** in the app, and seeing my streak motivates me. [C] So for me, small steps and other people keep me going.",
          model5: "[A] What works best for me is a combination of tiny daily tasks and a partner who holds me accountable. [R] Small tasks lower the barrier to getting started, so I rarely **procrastinate**, while a partner adds **accountability**, since letting someone else down feels far worse than letting myself down. [E] For my Spanish, for instance, I do twenty minutes a day on an app and meet a classmate every Thursday for conversation practice; if I skip a session, she's quick to ask why. I also **track my progress** with the app's streak counter, which, admittedly, is a simple trick, yet it works remarkably well on me. [C] So small steps combined with a bit of social pressure keep me consistently on course." },
        { q: "Of course, it's common to face setbacks or lose motivation—whether from external distractions, lack of time, or self-doubt. When that happens, how do you usually respond? Are there any techniques you use to bounce back and stay on track?",
          lx: ["setback", "get back on track", "self-doubt"],
          model: "[A] When I lose motivation, I try not to be too hard on myself, and I start again with something very small. [R] If I feel guilty, I usually lose even more motivation. A small step helps me feel that I'm moving again. [E] For example, last month I stopped running for two weeks because I had too much work. Instead of trying to run ten kilometers right away, I went for a fifteen-minute jog. The next day I did twenty minutes. Within a week, I was **back on track**. [C] So my technique is simple: forgive yourself and restart small.",
          model5: "[A] My first rule is not to be too hard on myself; my second is to restart with something ridiculously small. [R] Guilt, I've noticed, only deepens the slump, whereas a tiny success quickly rebuilds momentum and quiets the **self-doubt**. [E] Last month, for example, I didn't run for two whole weeks because of a heavy workload. Rather than forcing myself straight back into a ten-kilometer run, I went for a fifteen-minute jog, then twenty minutes the following day. Within a week, I was fully **back on track**, and, crucially, I didn't associate running with failure. [C] So my technique is essentially to forgive the **setback** quickly and restart with a step too small to fail." },
        { q: "Many people believe that setting goals is an essential part of personal growth, helping us stay purposeful and driven. Others argue that too much focus on goals can lead to stress or unrealistic expectations. What's your opinion? Do you think setting goals generally helps people grow, or can it sometimes create unnecessary pressure? Why?",
          lx: ["realistic", "pressure", "personal growth"],
          model: "[A] I think goals usually help people grow, but too many goals can create **pressure**. [R] Goals give you direction and motivation. But if your goals are not **realistic**, you feel like a failure all the time. [E] For example, last January I set ten New Year's resolutions — gym every day, two books a week, perfect grades. By February, I'd given up on all of them and felt terrible. This year I chose just two realistic goals, and I'm still working on them. [C] So goals are helpful, as long as they're realistic and not too many.",
          model5: "[A] On balance, I believe goals help people grow, although setting too many can certainly backfire. [R] Goals give us direction and a reason to push ourselves; unrealistic ones, however, turn into a constant source of guilt and disappointment. [E] Last January, for example, I made ten ambitious resolutions — the gym every day, two books a week, top grades in every course. By February, I'd abandoned all of them and felt like a failure. This year, by contrast, I chose just two **realistic** goals, and eleven months later I'm still pursuing both. [C] So goals are a powerful tool for **personal growth**, as long as we choose them carefully and treat them as guides rather than tests." }
      ]},
    { id: "stm", badge: "platform", title: "Time Management", src: "Практика платформы",
      scenario: "I'm conducting a study on time management and how people structure their days to stay productive and balanced. I'd like to ask you a few questions about how you approach planning and organization.",
      questions: [
        { q: "To start, how do you usually plan or organize your day? Do you follow a set routine, or do you take things as they come?",
          lx: ["routine", "take things as they come", "plan ahead"],
          model: "[A] On weekdays I follow a set **routine**, but on weekends I **take things as they come**. [R] During the week, I have classes, work and the gym, so I need structure. On weekends, I want to relax and be spontaneous. [E] For example, from Monday to Friday, I get up at seven, check my to-do list and plan my evening the night before. But on Saturdays I don't set an alarm, and I decide what to do after breakfast — sometimes I meet friends, sometimes I just read. [C] So I need both structure and freedom.",
          model5: "[A] I follow a fairly fixed **routine** on weekdays, whereas at weekends I prefer to **take things as they come**. [R] With lectures, a part-time job and training, my weekdays simply wouldn't work without structure. At weekends, however, I deliberately let go of plans, because that's how I recharge. [E] From Monday to Friday, for example, I'm up at seven, review my priorities over breakfast and usually **plan** the next day the night before. On Saturdays, by contrast, I don't even set an alarm, and I decide what to do as the day unfolds — sometimes meeting friends, sometimes just reading in a café. [C] So for me, the right balance is structure during the week and freedom at the weekend." },
        { q: "Everyone has their own style—some people rely on digital tools like apps, while others prefer pen-and-paper methods or mental checklists. What kinds of tools, methods, or strategies do you personally use to stay on track with your tasks? And why do you think those approaches work well for you?",
          lx: ["to-do list", "set a reminder", "keep track of"],
          model: "[A] I use a mix of a phone calendar and a paper notebook. [R] The calendar is great for dates and **reminders**, because my phone is always with me. But writing tasks by hand helps me remember them and think more clearly. [E] For example, all my classes, shifts and deadlines are in my calendar, and it **sets** automatic **reminders**. Every morning I also write a short **to-do list** in my notebook, and I love crossing things off with a pen. [C] So digital tools help me remember, and paper helps me focus.",
          model5: "[A] I use a hybrid system: a digital calendar alongside a paper notebook. [R] The calendar is unbeatable for **keeping track of** dates and sending **reminders**, given that my phone is always with me. Writing tasks down by hand, on the other hand, forces me to think about what really matters, and I remember handwritten tasks far better. [E] Every class, shift and deadline goes into my calendar with automatic alerts, for instance, while each morning I jot down a short **to-do list** in my notebook. Physically crossing items off gives me a small but genuine sense of accomplishment. [C] In short, technology handles my memory, while paper handles my focus." },
        { q: "One of the biggest challenges people mention today is staying focused—especially with constant notifications, social media, or the pressure to multitask. How do you personally deal with distractions during your day? Are there specific things you do to create a more focused or productive environment?",
          lx: ["distraction", "stay focused", "multitask"],
          model: "[A] My biggest **distraction** is my phone, so I keep it away when I study. [R] If my phone is next to me, I check it every few minutes, and then it takes a long time to concentrate again. I also don't try to **multitask**, because it makes me slower. [E] For example, when I study in the library, I put my phone in my bag on silent mode and use a timer: twenty-five minutes of work, then a five-minute break. During the break, I can check messages. This way I **stay focused** much longer. [C] So I just remove distractions instead of fighting them.",
          model5: "[A] My biggest **distraction**, by far, is my phone, so my main strategy is to put it out of reach. [R] If it's within arm's length, I'll check it every few minutes almost unconsciously, and each interruption costs me several minutes of concentration. I've also stopped trying to **multitask**, since it only creates the illusion of productivity. [E] When I study in the library, for instance, my phone goes into my bag on silent, and I work in twenty-five-minute blocks followed by five-minute breaks, during which I'm allowed to check messages. It sounds simple, but it's doubled the amount I can **stay focused**. [C] So rather than relying on willpower, I simply design my environment so that distractions aren't an option." },
        { q: "Some companies and even schools are now testing shorter workdays or four-day work weeks as a way to boost focus and reduce burnout. Do you think working fewer hours could actually help people get more done, or do you think it might backfire? Why or why not?",

        { q: "Everyone approaches their routine a little differently—some people follow a strict schedule, while others like to keep things more flexible. How would you describe your preferred style? Do you find that having more structure or more flexibility works better for you, and why?",

        { q: "In recent years, a lot of people have had to adjust their routines—because of remote work, changing school schedules, or shifts in lifestyle. Have you noticed any changes in your daily routine compared to, say, a few years ago? What caused those changes, and how have they affected your day-to-day life?",

          model5: "[A] My routine has changed enormously over the past few years. [R] The main cause was moving away from home for university, which suddenly made me responsible for everything — cooking, cleaning, finances and, above all, my own schedule. [E] In high school, for instance, every day looked identical: classes from eight to three, homework, then dinner that my mother had prepared. Now no two days are the same, and nobody tells me when to study or sleep. The first semester was admittedly chaotic, but it forced me to develop **self-discipline** and a system for organizing my time. [C] So although the transition was challenging, it's made me far more **independent** and, I think, more mature." },
        { q: "Some people believe that having a stable daily routine can improve mental health, increase productivity, and even reduce stress. Others feel that strict routines can be limiting or stressful. In your opinion, do you think maintaining a consistent daily routine improves overall quality of life? Why or why not?",

          model5: "[A] I believe a consistent routine generally improves quality of life, provided it isn't too rigid. [R] When the basics — sleep, meals, exercise — happen at regular times, both body and mind feel more stable, and you save mental energy for decisions that actually matter. A life with no room for surprises, however, quickly becomes dull. [E] Since I started going to bed at the same time every night, for example, I sleep noticeably better and my morning **productivity** has improved. At the same time, I deliberately keep weekends open for **spontaneous** plans, which are often the most memorable moments of my week. [C] So routines work best as a foundation, not a cage." }
