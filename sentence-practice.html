<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build a Sentence Trainer — Writing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (!window.lucide || typeof window.lucide.createIcons !== 'function') window.lucide = { createIcons: function () {} };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="i18n.js"></script>
    <script src="auth.js"></script>
    <script src="sentence-trainer-items.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Цвета раздела Writing — как на странице раздела */
        :root { --w-bg: #f2f6fe; --w-line: #dce6fb; --w-chip: #dfe8fc; --w-ink: #2f56b8; --w-bar: #7f9fe6; --w-deep: #213f8a; }
        .w-ink { color: var(--w-ink); } .w-bg { background: var(--w-bg); } .w-chip { background: var(--w-chip); }
        .w-btn { background: var(--w-deep); color: #fff; } .w-btn:hover { background: var(--w-ink); }
        .w-btn:disabled { opacity: .4; cursor: not-allowed; }
        .w-ring { border-color: var(--w-line); }
        .sp-card { transition: box-shadow .15s, transform .15s; }
        .sp-card:hover { box-shadow: 0 6px 18px rgba(15, 23, 42, .08); transform: translateY(-1px); }
        button:focus-visible, a:focus-visible { outline: 2px solid var(--w-ink); outline-offset: 2px; }
        /* Предложение с пропусками */
        .sp-line { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 6px; }
        .sp-fixed { font-weight: 700; color: #0f172a; padding: 0 2px 9px; font-size: 16px; }
        .sp-slot { min-width: 84px; min-height: 46px; border-bottom: 2px solid #cbd5e1; display: inline-flex; align-items: flex-end; justify-content: center; padding: 0 2px 4px; cursor: pointer; border-radius: 6px 6px 0 0; transition: background .15s, border-color .15s; }
        .sp-slot.is-target { border-bottom-color: var(--w-ink); background: var(--w-bg); }
        .sp-slot.is-right { border-bottom-color: #16a34a; background: #f0fdf4; }
        .sp-slot.is-wrong { border-bottom-color: #dc2626; background: #fef2f2; }
        .sp-tail { display: inline-flex; align-items: flex-end; gap: 2px; white-space: nowrap; }
        .sp-end { font-size: 24px; font-weight: 800; color: #94a3b8; line-height: 1; padding-bottom: 8px; }
        .sp-chip { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #e2e8f0; background: #fff; font-weight: 700; font-size: 15px; color: #334155; cursor: pointer; user-select: none; transition: transform .1s, border-color .15s, box-shadow .15s; }
        .sp-chip:hover { border-color: var(--w-bar); box-shadow: 0 2px 8px rgba(47, 86, 184, .12); }
        .sp-chip:active { transform: scale(.97); }
        .sp-slot .sp-chip { border-color: var(--w-line); background: var(--w-bg); color: var(--w-deep); }
        .sp-slot.is-right .sp-chip { border-color: #86efac; background: #dcfce7; color: #14532d; }
        .sp-slot.is-wrong .sp-chip { border-color: #fca5a5; background: #fee2e2; color: #7f1d1d; }
        .sp-chip.is-extra { border-style: dashed; color: #94a3b8; }
        .sp-ex { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .sp-ex span { background: var(--w-chip); color: var(--w-deep); border-radius: 8px; padding: 3px 9px; font-weight: 700; font-size: 14px; }
        .sp-rule li { counter-increment: r; display: flex; gap: 12px; }
        .sp-rule li::before { content: counter(r); display: inline-flex; align-items: center; justify-content: center; width: 1.6rem; height: 1.6rem; border-radius: 999px; background: var(--w-chip); color: var(--w-deep); font-weight: 800; font-size: .78rem; flex: none; margin-top: .1rem; }
        .sp-rule b { color: #0f172a; }
        @media (max-width: 640px) { .sp-slot { min-width: 56px; } .sp-ava { width: 2.25rem !important; height: 2.25rem !important; font-size: 1rem !important; } .sp-chip { font-size: 14px; padding: 0 12px; } }
        @media (prefers-reduced-motion: reduce) { .sp-card { transition: none; } .sp-card:hover { transform: none; } }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <div id="app-sidebar"></div>
    <script src="nav.js"></script>

    <main class="flex-1 min-w-0 overflow-y-auto pb-28 md:pb-10">
        <div class="max-w-5xl mx-auto px-4 sm:px-8 pt-5 sm:pt-10" id="sp" data-i18n-skip>
            <p class="text-sm text-slate-400">Loading…</p>
        </div>
    </main>

<script>
(function () {
    'use strict';
    // =====================================================================
    // Тренажёр Build a Sentence (Sentence Preparation).
    //
    // Задания — в sentence-trainer-items.js: 13 уровней, построенных по
    // реальным заданиям Build a Sentence (is_real_toefl). Формат как на
    // экзамене: реплика собеседника, предложение с пропусками и уже
    // вписанными словами, кусочки по 1–3 слова, иногда один лишний.
    //
    // Слово ставится нажатием: в выбранный пропуск (нажмите на пропуск)
    // или в первый пустой; нажатие на слово в предложении возвращает его.
    //
    // Прогресс — в браузере (localStorage), отдельно для каждой ученицы.
    // Гостю открыты первые FREE_LEVELS уровней.
    // =====================================================================
    const LEVELS = window.SENTENCE_TRAINER || [];
    const FREE_LEVELS = 2;
    const RU = (function () { try { return localStorage.getItem('appLang') !== 'en'; } catch (e) { return true; } })();
    const TXT = {
        back: ['Writing', 'Writing'],
        title: ['Build a Sentence Trainer', 'Тренажёр Build a Sentence'],
        lead: ['Thirteen levels built on real Build a Sentence tasks: from basic word order to indirect questions. Each level starts with a short rule.',
               'Тринадцать уровней по реальным заданиям Build a Sentence: от порядка слов до косвенных вопросов. Перед каждым уровнем — короткое правило.'],
        level: ['Level', 'Уровень'], of: ['of', 'из'],
        notStarted: ['Not started', 'Не начат'], inProgress: ['In progress', 'В процессе'], done: ['Done', 'Пройден'],
        correct: ['correct', 'верно'], locked: ['Full version', 'В полной версии'],
        allLevels: ['All levels', 'Все уровни'], rule: ['Rule', 'Правило'], examples: ['Examples', 'Примеры'],
        start: ['Start', 'Начать'], resume: ['Continue', 'Продолжить'], restart: ['Start over', 'Начать заново'],
        mistakes: ['Practise mistakes', 'Повторить ошибки'],
        instr: ['Make an appropriate sentence.', 'Составьте подходящее предложение.'],
        hint: ['Tap a word to put it in the sentence. Tap a gap to choose where it goes. Tap a placed word to take it back.',
               'Нажмите на слово — оно встанет в предложение. Нажмите на пропуск, чтобы выбрать, куда его поставить. Нажмите на слово в предложении, чтобы вернуть его.'],
        clear: ['Clear', 'Очистить'], check: ['Check', 'Проверить'], next: ['Next', 'Дальше'], finish: ['Finish', 'Завершить'],
        retry: ['Try again', 'Ещё раз'],
        right: ['Correct!', 'Верно!'], wrong: ['Not quite', 'Неверно'], answer: ['Correct sentence', 'Правильное предложение'],
        extraLeft: ['The extra word', 'Лишний кусочек'],
        summary: ['Level complete', 'Уровень пройден'], score: ['{a} of {b} correct on the first try', 'С первой попытки верно {a} из {b}'],
        review: ['Mistakes', 'Ошибки'], noMistakes: ['No mistakes — great job!', 'Ни одной ошибки — отлично!'],
        nextLevel: ['Next level', 'Следующий уровень'],
        unlock: ['Get full access', 'Получить полный доступ'],
        local: ['Your progress is saved in this browser.', 'Прогресс сохраняется в этом браузере.'],
        q: ['Question {a} of {b}', 'Вопрос {a} из {b}'], mistakeSet: ['Mistakes', 'Работа над ошибками']
    };
    const t = (k, v) => { let s = TXT[k] ? TXT[k][RU ? 1 : 0] : k; if (v) Object.keys(v).forEach(x => { s = s.replace('{' + x + '}', v[x]); }); return s; };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    const icons = () => { try { lucide.createIcons(); } catch (e) { /* */ } };
    const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const root = document.getElementById('sp');

    let uid = 'anon', guest = false;
    let P = {};                 // прогресс: { levelId: { pos, res: {itemId: bool}, done } }
    let S = null;               // текущая сессия

    // ---------- Прогресс ----------
    const key = () => 'sentenceTrainer:v2:' + uid;
    function loadP() { try { P = JSON.parse(localStorage.getItem(key()) || '{}') || {}; } catch (e) { P = {}; } }
    function saveP() { try { localStorage.setItem(key(), JSON.stringify(P)); } catch (e) { /* приватный режим */ } }
    const lp = id => (P[id] = P[id] || { pos: 0, res: {}, done: false });
    function levelStats(L) {
        const p = P[L.id] || { res: {} };
        const right = L.items.filter(it => p.res[it.id] === true).length;
        const answered = L.items.filter(it => p.res[it.id] !== undefined).length;
        const wrong = L.items.filter(it => p.res[it.id] === false);
        return { right, answered, wrong, done: !!p.done, pos: p.pos || 0 };
    }
    const lockedIdx = i => guest && i >= FREE_LEVELS;

    // ---------- Экран 1: уровни ----------
    function showLevels() {
        S = null;
        history.replaceState(null, '', location.pathname);
        const cards = LEVELS.map((L, i) => {
            const st = levelStats(L), n = L.items.length, locked = lockedIdx(i);
            const pct = Math.round(st.right / n * 100);
            const status = locked ? `<span class="text-[11px] font-bold text-slate-400 flex items-center gap-1 whitespace-nowrap"><i data-lucide="lock" class="w-3.5 h-3.5"></i>${esc(t('locked'))}</span>`
                : st.done ? `<span class="text-[11px] font-bold text-emerald-700 bg-emerald-50 rounded-full px-2 py-0.5 whitespace-nowrap">✓ ${esc(t('done'))}</span>`
                : st.answered ? `<span class="text-[11px] font-bold text-amber-700 bg-amber-50 rounded-full px-2 py-0.5 whitespace-nowrap">${esc(t('inProgress'))} · ${st.answered}/${n}</span>`
                : `<span class="text-[11px] font-bold text-slate-400 whitespace-nowrap">${esc(t('notStarted'))}</span>`;
            return `<button type="button" data-lv="${i}" class="sp-card text-left bg-white border border-slate-200 rounded-2xl p-5 flex flex-col gap-3 ${locked ? 'opacity-70' : ''}">
                <div class="flex items-start justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                        <span class="w-10 h-10 rounded-xl w-chip w-ink flex items-center justify-center shrink-0"><i data-lucide="${esc(L.icon || 'layers')}" class="w-5 h-5"></i></span>
                        <div class="min-w-0"><p class="text-[11px] font-bold text-slate-400">${esc(t('level'))} ${i + 1}</p>
                        <p class="font-bold text-slate-900 leading-snug">${esc(L.title)}</p></div>
                    </div>${status}
                </div>
                ${RU ? `<p class="text-sm font-semibold text-slate-600 -mt-1">${esc(L.ru)}</p>` : ''}
                <p class="text-sm text-slate-500 leading-relaxed">${esc(L.sum)}</p>
                <div class="mt-auto">
                    <div class="flex justify-between text-[11px] font-semibold text-slate-400 mb-1"><span>${n} ${RU ? 'предложений' : 'sentences'}</span>${st.answered ? `<span class="w-ink">${pct}% ${esc(t('correct'))}</span>` : ''}</div>
                    <div class="h-1.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:var(--w-bar)"></div></div>
                </div>
            </button>`;
        }).join('');
        root.innerHTML = `<a href="writing.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800"><i data-lucide="arrow-left" class="w-4 h-4"></i>${esc(t('back'))}</a>
            <h1 class="mt-3 text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">${esc(t('title'))}</h1>
            <p class="mt-2 text-slate-500 max-w-2xl leading-relaxed">${esc(t('lead'))}</p>
            ${guest ? `<div class="mt-4 max-w-2xl rounded-xl border border-slate-200 bg-white p-4 flex flex-wrap items-center justify-between gap-3">
                <p class="text-sm text-slate-600">${RU ? 'Бесплатная версия: открыты первые два уровня.' : 'Free version: the first two levels are open.'}</p>
                <button type="button" data-act="unlock" class="text-sm font-bold w-ink hover:underline">${esc(t('unlock'))}</button></div>` : ''}
            <div class="mt-7 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${cards}</div>
            <p class="mt-6 text-xs text-slate-400">${esc(t('local'))}</p>`;
        icons();
    }

    // ---------- Экран 2: правило уровня ----------
    function exampleHtml(ex) {
        return `<span class="sp-ex">${ex.split('|').map(p => `<span>${esc(p.trim())}</span>`).join('')}</span>`;
    }
    function ruleHtml(L) {
        return `<ol class="sp-rule mt-4 space-y-3 list-none p-0">${L.rule.map(r => `<li class="text-slate-700 leading-relaxed"><span>${md(r)}</span></li>`).join('')}</ol>
            <p class="mt-5 text-xs font-bold uppercase tracking-wide text-slate-400">${esc(t('examples'))}</p>
            <div class="mt-2 space-y-2">${L.examples.map(exampleHtml).join('')}</div>`;
    }
    function showLevel(i) {
        if (lockedIdx(i)) { if (typeof authShowUpsell === 'function') authShowUpsell(); return; }
        const L = LEVELS[i];
        history.replaceState(null, '', '?level=' + encodeURIComponent(L.id));
        const st = levelStats(L), n = L.items.length;
        const canResume = !st.done && st.pos > 0 && st.pos < n;
        root.innerHTML = `<button type="button" data-act="levels" class="inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800"><i data-lucide="arrow-left" class="w-4 h-4"></i>${esc(t('allLevels'))}</button>
            <section class="mt-4 bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 max-w-3xl">
                <p class="text-xs font-bold w-ink">${esc(t('level'))} ${i + 1} ${esc(t('of'))} ${LEVELS.length}</p>
                <h1 class="mt-1 text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">${esc(L.title)}</h1>
                ${RU ? `<p class="text-slate-500 mt-1 font-semibold">${esc(L.ru)}</p>` : ''}
                <h2 class="mt-6 font-bold text-slate-900">${esc(t('rule'))}</h2>
                ${ruleHtml(L)}
                <div class="mt-8 flex flex-wrap gap-2.5">
                    ${canResume ? `<button type="button" data-act="resume" data-arg="${i}" class="w-btn rounded-xl px-5 py-3 font-bold text-sm">${esc(t('resume'))} · ${st.pos + 1}/${n}</button>
                        <button type="button" data-act="start" data-arg="${i}" class="rounded-xl px-5 py-3 font-bold text-sm border border-slate-200 bg-white text-slate-700 hover:bg-slate-50">${esc(t('restart'))}</button>`
                    : `<button type="button" data-act="start" data-arg="${i}" class="w-btn rounded-xl px-5 py-3 font-bold text-sm">${esc(st.done ? t('restart') : t('start'))} · ${n}</button>`}
                    ${st.wrong.length ? `<button type="button" data-act="mistakes" data-arg="${i}" class="rounded-xl px-5 py-3 font-bold text-sm border w-ring w-bg w-ink">${esc(t('mistakes'))} · ${st.wrong.length}</button>` : ''}
                </div>
            </section>`;
        icons(); window.scrollTo(0, 0);
    }

    // ---------- Экран 3: задание ----------
    function startSession(i, mode) {
        const L = LEVELS[i], p = lp(L.id);
        let items = L.items, pos = 0;
        if (mode === 'mistakes') items = L.items.filter(it => p.res[it.id] === false);
        else if (mode === 'resume') pos = Math.min(p.pos || 0, items.length - 1);
        else { p.pos = 0; p.done = false; saveP(); }
        S = { li: i, L, items, i: pos, mode, firstTry: {}, cur: null };
        showItem();
    }
    function newState(it) {
        const slots = it.structure.map((x, k) => x.type === 'slot' ? k : null).filter(k => k !== null);
        return { slots, filled: {}, bank: shuffle(it.bank.map((w, k) => ({ k, w }))), target: null, checked: false, ok: null };
    }
    function showItem() {
        const it = S.items[S.i];
        S.cur = newState(it);
        renderItem();
        window.scrollTo(0, 0);
    }
    function endMark(it) { const c = it.sample_answer.trim().slice(-1); return '.?!'.includes(c) ? c : '.'; }

    function renderItem() {
        const it = S.items[S.i], c = S.cur, n = S.items.length;
        const used = new Set(Object.values(c.filled).map(x => x.k));
        let slotNo = 0;
        const parts = it.structure.map((x, k) => {
            if (x.type === 'text') return `<span class="sp-fixed">${esc(x.value)}</span>`;
            const f = c.filled[k], idx = slotNo++;
            const cls = c.checked ? (f && f.w === it.answer[idx] ? 'is-right' : 'is-wrong') : (c.target === k ? 'is-target' : '');
            return `<span class="sp-slot ${cls}" data-slot="${k}" role="button" aria-label="gap ${idx + 1}">${f ? `<span class="sp-chip" data-back="${k}">${esc(f.w)}</span>` : ''}</span>`;
        });
        // знак в конце не отрывается от последнего слова при переносе строки
        const lastPart = parts.pop();
        const line = parts.join('') + `<span class="sp-tail">${lastPart}<span class="sp-end">${esc(endMark(it))}</span></span>`;
        const bank = c.bank.filter(b => !used.has(b.k)).map(b => `<button type="button" class="sp-chip" data-chip="${b.k}" ${c.checked ? 'disabled' : ''}>${esc(b.w)}</button>`).join('');
        const allFilled = c.slots.every(k => c.filled[k]);
        const last = S.i === n - 1;
        const extraWord = it.bank.length > it.answer.length ? it.bank[it.bank.length - 1] : null;
        root.innerHTML = `<div class="flex flex-wrap items-center justify-between gap-3">
                <button type="button" data-act="level" data-arg="${S.li}" class="inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800"><i data-lucide="arrow-left" class="w-4 h-4"></i>${esc(S.L.title)}</button>
                <div class="flex items-center gap-3">
                    <span class="text-sm font-semibold text-slate-500">${S.i + 1} / ${n}</span>
                    <div class="w-28 h-1.5 rounded-full bg-slate-200 overflow-hidden"><div class="h-full rounded-full" style="width:${Math.round((S.i + 1) / n * 100)}%;background:var(--w-bar)"></div></div>
                    <button type="button" data-act="ruleToggle" class="inline-flex items-center gap-1.5 text-sm font-semibold w-ink border w-ring rounded-lg px-3 py-1.5 bg-white"><i data-lucide="book-open" class="w-4 h-4"></i>${esc(t('rule'))}</button>
                </div>
            </div>
            <div id="spRule" class="hidden mt-3 w-bg border w-ring rounded-2xl p-5">${ruleHtml(S.L)}</div>
            ${S.mode === 'mistakes' ? `<p class="mt-3 text-xs font-bold text-amber-700">${esc(t('mistakeSet'))}</p>` : ''}
            <section class="mt-4 bg-white border border-slate-200 rounded-2xl p-5 sm:p-8">
                <p class="text-center font-bold text-slate-800">${esc(t('instr'))}</p>
                <div class="mt-6 bg-[#f8f9fa] border border-slate-100 rounded-2xl p-5 sm:p-7 space-y-6">
                    <div class="flex items-start gap-3">
                        <span class="sp-ava w-11 h-11 rounded-full bg-sky-50 border border-sky-100 flex items-center justify-center text-xl shrink-0">🧑‍🎓</span>
                        <div class="bg-white border border-slate-100 rounded-2xl px-4 py-3 text-[15px] font-medium text-slate-700 max-w-xl">${esc(it.prompt_context)}</div>
                    </div>
                    <div class="flex items-start gap-3 pt-5 border-t border-dashed border-slate-200">
                        <span class="sp-ava w-11 h-11 rounded-full w-chip border w-ring flex items-center justify-center text-xl shrink-0">👩‍🏫</span>
                        <div class="sp-line flex-1 pt-1">${line}</div>
                    </div>
                </div>
                ${c.checked && !bank ? '' : `<div class="mt-6">
                    ${c.checked ? '' : `<p class="text-[11px] text-center text-slate-400 mb-3">${esc(t('hint'))}</p>`}
                    <div class="flex flex-wrap justify-center gap-2.5 bg-slate-50 border border-slate-200 rounded-2xl p-4 min-h-[72px]">${bank}</div>
                </div>`}
                <div id="spFeedback">${c.checked ? feedback(it, extraWord) : ''}</div>
                <div class="mt-6 flex flex-wrap justify-end gap-2.5">
                    ${c.checked
                        ? `${!c.ok ? `<button type="button" data-act="retry" class="rounded-xl px-5 py-2.5 font-bold text-sm border border-slate-200 bg-white text-slate-700 hover:bg-slate-50">${esc(t('retry'))}</button>` : ''}
                           <button type="button" data-act="next" class="w-btn rounded-xl px-5 py-2.5 font-bold text-sm">${esc(last ? t('finish') : t('next'))}</button>`
                        : `<button type="button" data-act="clear" class="rounded-xl px-5 py-2.5 font-bold text-sm border border-slate-200 bg-white text-slate-700 hover:bg-slate-50" ${Object.keys(c.filled).length ? '' : 'disabled'}>${esc(t('clear'))}</button>
                           <button type="button" data-act="check" class="w-btn rounded-xl px-5 py-2.5 font-bold text-sm" ${allFilled ? '' : 'disabled'}>${esc(t('check'))}</button>`}
                </div>
            </section>`;
        icons();
    }

    function feedback(it, extraWord) {
        const ok = S.cur.ok;
        return `<div class="mt-6 rounded-2xl border ${ok ? 'border-emerald-200 bg-emerald-50' : 'border-rose-200 bg-rose-50'} p-5">
            <p class="font-bold ${ok ? 'text-emerald-800' : 'text-rose-800'}">${esc(ok ? t('right') : t('wrong'))}</p>
            ${ok ? '' : `<p class="mt-2 text-sm text-slate-700"><span class="font-semibold">${esc(t('answer'))}:</span> ${esc(it.sample_answer)}</p>`}
            <p class="mt-2 text-sm text-slate-700 leading-relaxed">${esc(it.explanation)}</p>
            ${extraWord ? `<p class="mt-2 text-xs text-slate-500">${esc(t('extraLeft'))}: <b>${esc(extraWord)}</b></p>` : ''}
        </div>`;
    }

    function place(k) {
        const c = S.cur; if (c.checked) return;
        const chip = c.bank.find(b => b.k === k); if (!chip) return;
        let slot = c.target != null && !c.filled[c.target] ? c.target : c.slots.find(s => !c.filled[s]);
        if (slot == null) return;
        c.filled[slot] = chip;
        // следующий выбранный пропуск — следующий пустой
        c.target = c.slots.find(s => !c.filled[s] && s > slot);
        if (c.target == null) c.target = c.slots.find(s => !c.filled[s]);
        if (c.target == null) c.target = null;
        renderItem();
    }
    function takeBack(slot) { const c = S.cur; if (c.checked) return; delete c.filled[slot]; c.target = slot; renderItem(); }
    function selectSlot(slot) { const c = S.cur; if (c.checked) return; if (c.filled[slot]) return takeBack(slot); c.target = slot; renderItem(); }

    function check() {
        const it = S.items[S.i], c = S.cur;
        const placed = c.slots.map(k => c.filled[k] && c.filled[k].w);
        c.ok = placed.every((w, idx) => w === it.answer[idx]);
        c.checked = true;
        if (!(it.id in S.firstTry)) {
            S.firstTry[it.id] = c.ok;
            const p = lp(S.L.id);
            // в работе над ошибками верный ответ снимает ошибку; ошибка в обычном проходе — записывается
            p.res[it.id] = c.ok;
            if (S.mode !== 'mistakes') p.pos = S.i + 1;
            saveP();
        }
        renderItem();
        const f = document.getElementById('spFeedback'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    function next() {
        if (S.i < S.items.length - 1) { S.i++; showItem(); return; }
        finish();
    }

    // ---------- Экран 4: итог ----------
    function finish() {
        const L = S.L, p = lp(L.id);
        if (S.mode !== 'mistakes') { p.done = true; p.pos = 0; }
        saveP();
        const ids = S.items.map(it => it.id);
        const right = ids.filter(id => S.firstTry[id] === true).length;
        const wrongItems = S.items.filter(it => S.firstTry[it.id] === false);
        const pct = Math.round(right / ids.length * 100);
        const nextIdx = S.li + 1 < LEVELS.length ? S.li + 1 : null;
        root.innerHTML = `<section class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center gap-6">
                <div class="relative w-28 h-28 shrink-0">
                    <svg viewBox="0 0 36 36" class="w-28 h-28 -rotate-90"><circle cx="18" cy="18" r="15.5" fill="none" stroke="#eef2f7" stroke-width="3.5"/>
                    <circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--w-ink)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${(pct * 0.974).toFixed(1)} 100"/></svg>
                    <span class="absolute inset-0 flex items-center justify-center text-2xl font-extrabold text-slate-900">${pct}%</span>
                </div>
                <div class="min-w-0">
                    <p class="text-xs font-bold w-ink">${esc(L.title)}</p>
                    <h1 class="mt-1 text-2xl font-extrabold text-slate-900">${esc(t('summary'))}</h1>
                    <p class="mt-1 text-slate-600">${esc(t('score', { a: right, b: ids.length }))}</p>
                    <div class="mt-4 flex flex-wrap gap-2.5">
                        ${wrongItems.length ? `<button type="button" data-act="mistakes" data-arg="${S.li}" class="w-btn rounded-xl px-5 py-2.5 font-bold text-sm">${esc(t('mistakes'))} · ${wrongItems.length}</button>` : ''}
                        ${nextIdx !== null ? `<button type="button" data-act="level" data-arg="${nextIdx}" class="${wrongItems.length ? 'border border-slate-200 bg-white text-slate-700 hover:bg-slate-50' : 'w-btn'} rounded-xl px-5 py-2.5 font-bold text-sm">${esc(t('nextLevel'))}</button>` : ''}
                        <button type="button" data-act="levels" class="rounded-xl px-5 py-2.5 font-bold text-sm border border-slate-200 bg-white text-slate-700 hover:bg-slate-50">${esc(t('allLevels'))}</button>
                    </div>
                </div>
            </section>
            <h2 class="mt-8 font-bold text-slate-900">${esc(t('review'))}</h2>
            ${wrongItems.length ? `<div class="mt-3 grid gap-3">${wrongItems.map(it => `<div class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5">
                <p class="text-xs text-slate-400">${esc(it.prompt_context)}</p>
                <p class="mt-1 font-bold text-slate-900">${esc(it.sample_answer)}</p>
                <p class="mt-1.5 text-sm text-slate-600 leading-relaxed">${esc(it.explanation)}</p></div>`).join('')}</div>`
            : `<p class="mt-3 text-sm text-slate-500">${esc(t('noMistakes'))}</p>`}`;
        icons(); window.scrollTo(0, 0);
    }

    // ---------- Действия ----------
    root.addEventListener('click', e => {
        const chip = e.target.closest('[data-chip]');
        if (chip) { place(Number(chip.dataset.chip)); return; }
        const back = e.target.closest('[data-back]');
        if (back) { takeBack(Number(back.dataset.back)); return; }
        const slot = e.target.closest('[data-slot]');
        if (slot) { selectSlot(Number(slot.dataset.slot)); return; }
        const lv = e.target.closest('[data-lv]');
        if (lv) { showLevel(Number(lv.dataset.lv)); return; }
        const b = e.target.closest('[data-act]');
        if (!b || b.disabled) return;
        const a = b.dataset.act, arg = b.dataset.arg != null ? Number(b.dataset.arg) : null;
        if (a === 'levels') showLevels();
        else if (a === 'level') showLevel(arg);
        else if (a === 'start') startSession(arg, 'all');
        else if (a === 'resume') startSession(arg, 'resume');
        else if (a === 'mistakes') startSession(arg, 'mistakes');
        else if (a === 'ruleToggle') { const r = document.getElementById('spRule'); if (r) r.classList.toggle('hidden'); }
        else if (a === 'clear') { S.cur.filled = {}; S.cur.target = null; renderItem(); }
        else if (a === 'check') check();
        else if (a === 'retry') { const keep = S.cur; S.cur = newState(S.items[S.i]); S.cur.bank = keep.bank; renderItem(); }
        else if (a === 'next') next();
        else if (a === 'unlock') { if (typeof authShowUpsell === 'function') authShowUpsell(); }
    });

    async function init() {
        if (typeof requireAuth === 'function') {
            const user = await requireAuth();
            if (!user) return;
            uid = user.id || 'anon';
        }
        try { guest = typeof authIsGuest === 'function' ? await authIsGuest() : false; } catch (e) { guest = false; }
        loadP();
        if (!LEVELS.length) { root.innerHTML = '<p class="text-rose-600">Не удалось загрузить задания. Обновите страницу.</p>'; return; }
        const want = new URLSearchParams(location.search).get('level');
        const idx = LEVELS.findIndex(L => L.id === want);
        if (idx >= 0) showLevel(idx); else showLevels();
    }
    init();
})();
</script>
</body>
</html>
