<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — TOEFL Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f8f9fa] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-3xl p-8 border border-gray-100 shadow-sm relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 via-indigo-400 to-emerald-400"></div>

        <div class="text-center mb-8 mt-2">
            <div class="font-bold text-3xl tracking-tighter flex items-center justify-center space-x-2 mb-2">
                <span>TOEFL</span><span class="w-2 h-2 bg-indigo-600 rounded-full mt-2"></span>
            </div>
            <p class="text-sm text-gray-500">Welcome back! Please enter your details.</p>
        </div>

        <form id="authForm" class="space-y-5" onsubmit="event.preventDefault();">
            
            <div id="errorMsg" class="hidden bg-rose-50 text-rose-600 text-sm p-3 rounded-xl border border-rose-100 text-center font-medium">
                Error message goes here
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Email</label>
                <input type="email" id="email" required 
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 transition text-slate-700 bg-gray-50 focus:bg-white" 
                       placeholder="student@example.com">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Password</label>
                <input type="password" id="password" required 
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 transition text-slate-700 bg-gray-50 focus:bg-white" 
                       placeholder="••••••••">
            </div>

            <div class="pt-2 space-y-3">
                <button onclick="handleLogin()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-2xl transition text-sm flex justify-center items-center">
                    <span id="loginText">Sign In</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                </button>
                
                <div class="text-center">
                    <span class="text-sm text-gray-400">Don't have an account?</span>
                    <button type="button" id="signupBtn" onclick="handleSignup()" class="text-sm font-bold text-indigo-600 hover:text-indigo-700 ml-1 transition">Sign Up</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        lucide.createIcons();

        // Проверяем сессию при загрузке
        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                window.location.href = 'index.html';
            }
        };

        function showError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.innerText = msg;
            errorDiv.classList.remove('hidden');
            
            // Сбрасываем текст на кнопках, если произошла ошибка
            document.getElementById('loginText').innerText = "Sign In";
            const signupBtn = document.getElementById('signupBtn');
            if(signupBtn) {
                signupBtn.innerText = "Sign Up";
                signupBtn.disabled = false;
            }
        }

        async function handleSignup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(!email || !password) return showError("Please fill in both fields (min 6 chars for password)");

            // Показываем процесс регистрации
            const signupBtn = document.getElementById('signupBtn');
            signupBtn.innerText = "Creating account...";
            signupBtn.disabled = true;

            // Команда Supabase создать нового пользователя
            const { data, error } = await _supabase.auth.signUp({
                email: email,
                password: password,
            });

            if (error) {
                showError(error.message);
            } else {
                // Если регистрация успешна — логиним автоматически
                const { error: loginError } = await _supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });
                
                if (loginError) {
                    showError("Account created. Please sign in manually.");
                } else {
                    window.location.href = 'index.html';
                }
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(!email || !password) return showError("Please fill in both fields");
            
            const btnText = document.getElementById('loginText');
            btnText.innerText = "Signing in...";

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                showError("Invalid email or password.");
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
