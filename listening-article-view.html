<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article View — TOEFL</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <div id="app-sidebar"></div>
    <script src="nav.js"></script>

    <main class="flex-1 p-6 overflow-y-auto bg-[#f8f9fa] pb-24 md:pb-6">
        <div class="max-w-3xl mx-auto py-4">
            
            <a href="listening-articles.html" class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-teal-600 transition mb-8 bg-white px-4 py-2 rounded-xl border border-gray-100 shadow-sm">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to Articles
            </a>
            
            <div class="bg-white p-8 md:p-12 rounded-3xl border border-gray-100 shadow-sm">
                <div class="flex items-center gap-3 mb-4">
                    <span id="article-category" class="text-[10px] font-bold text-teal-700 uppercase tracking-widest bg-teal-50 border border-teal-100 px-3 py-1 rounded-full inline-block"></span>
                    <span id="article-time" class="text-[11px] font-medium text-gray-400 flex items-center"></span>
                </div>
                
                <h1 id="article-title" class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-8 tracking-tight"></h1>
                
                <hr class="border-gray-100 mb-8">

                <article id="article-content" class="prose prose-slate prose-teal max-w-none prose-headings:font-bold prose-headings:tracking-tight prose-a:text-teal-600">
                    </article>
            </div>
        </div>
    </main>

    <script src="listening-articles-data.js"></script>
    <script>
        lucide.createIcons();

        // Раньше статья открывалась без проверки входа и доступа к Listening
        (async () => { if (typeof requireAuth === 'function') await requireAuth(); })();

        // 1. Получаем параметр ID из URL
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        // 2. Ищем статью в объекте
        const article = listeningArticles[articleId];

        // 3. Вставляем данные
        if (article) {
            document.getElementById('article-title').textContent = article.title;
            document.getElementById('article-category').textContent = article.category;
            document.getElementById('article-time').innerHTML = `<i data-lucide="clock" class="w-3 h-3 mr-1"></i> ${article.readTime}`;
            document.getElementById('article-content').innerHTML = article.content;
            
            // Заново рендерим иконки, если они были внутри текста
            lucide.createIcons();
            document.title = article.title + " — TOEFL";
        } else {
            // Ошибка, если ID не найден
            document.getElementById('article-content').innerHTML = `
                <div class="text-center py-10">
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">Article not found</h2>
                    <p class="text-gray-500">The article you are looking for does not exist or has been moved.</p>
                </div>
            `;
            document.getElementById('article-title').style.display = 'none';
            document.getElementById('article-category').style.display = 'none';
            document.getElementById('article-time').style.display = 'none';
        }
    </script>
</body>
</html>
