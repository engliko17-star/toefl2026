        { q: "One important part of traveling is deciding to go alone or with a group. Thinking about a place you would like to visit, would you prefer to go there alone or with a group? Why?",
          lx: ["solo travel", "travel companion", "self-reliant"],
          model: "[A] I'd like to visit Japan, and I'd prefer to go with one or two friends, not alone and not with a big group. [R] Japan is very different from my culture, and the language is difficult, so it would be nice to have someone to share the experience and solve problems with. But a big group is slow, and it's hard to agree on plans. [E] For example, on my trip to Portugal with two friends, we made decisions quickly and still had time to do our own things. But on a school trip with thirty people, we spent hours waiting for everyone. When I flew to Canada alone, it was exciting, but I sometimes felt lonely at dinner. [C] So a small group is perfect for me.",
          model5: "[A] I'd love to visit Japan, ideally with one or two friends rather than alone or in a large group. [R] Since its culture and language are so different from mine, having someone to share the experience and solve problems with would be invaluable; large groups, however, move slowly and rarely agree on anything. [E] On my Portugal trip with two friends, for instance, we made decisions quickly yet still had time to do our own thing, whereas a school trip with thirty classmates involved endless waiting around. And when I flew to Canada on my own, it was exhilarating, though eating dinner alone did get lonely at times. [C] So a small group strikes the perfect balance for me." },
        { q: "If you were going to select a place to travel, how would you go about making a list of potential places? Please describe your process.",
          lx: ["destination", "read reviews", "travel on a budget"],
          model: "[A] I usually make a list based on three things: my interests, my budget and recommendations from people I trust. [R] I love hiking and food, so I look for places with nature and good local cuisine. But as a student, money is important, so I check prices first. [E] For example, I start by asking friends and reading travel blogs, and I save interesting places in a list on my phone. Then I use a flight search website to see which places are cheap from my city. Finally, I check the weather for that season and read reviews of hostels. That's how we chose Portugal — cheap flights, great hiking and amazing food. [C] So my process is: dream first, then check the budget.",
          model5: "[A] I filter destinations through three lenses: my interests, my budget and trusted recommendations. [R] Since I love hiking and food, I gravitate toward places with dramatic scenery and a strong culinary culture, but as a student, cost inevitably narrows the options. [E] I begin, for instance, by collecting ideas from friends and travel blogs in a running list on my phone. I then use a flight search site to see which of them are affordable from my city, check the typical weather for that season and read hostel reviews. That's precisely how Portugal won last year: cheap flights, superb hiking and incredible food. [C] So my process is to dream broadly first, then let practicalities decide." },
        { q: "Popular places have so many tourists visiting at one time that the sites are unable to allow all the people to visit who want to. As a result, virtual travel experiences are becoming more common compared to real-life travel. Do you think a virtual travel experience is worthwhile? Why or why not?",
          lx: ["virtual tour", "over-tourism", "immerse yourself in"],
          model: "[A] I think virtual travel can be worthwhile, but it can't replace real travel. [R] Virtual tours are great for learning, for planning a trip, or for people who can't travel because of money or health. But real travel is about feelings — the smells, the food, the people — and you can't get that from a screen. [E] For example, before my trip to Lisbon, I took a virtual tour of a famous monastery, which helped me decide what to see. My grandmother can't fly anymore, so she enjoys virtual tours of museums around the world. But nothing online could give me the feeling of standing on a cliff above the ocean. [C] So virtual travel is a good extra, not a replacement.",
          model5: "[A] It has real value, but as a supplement to travel rather than a substitute. [R] Virtual tours are excellent for learning, for planning trips and for people who can't travel because of cost or health; travel itself, however, is a sensory and human experience — smells, flavors, conversations — that no screen can reproduce. [E] Before visiting Lisbon, for instance, I took a virtual tour of a famous monastery, which helped me plan my visit. My grandmother, who can no longer fly, thoroughly enjoys virtual museum tours from her armchair. Yet nothing online could replicate standing on a windswept cliff above the Atlantic. [C] So virtual travel is a worthwhile extra, but never the real thing." }
      ]
    },
    { id: "s104", badge: "official", title: "Travel Habits", src: "Official TOEFL · 104",
      scenario: "You have volunteered for a research study about travel habits. You will have a short online interview with a researcher. The researcher will ask you some questions.",
      questions: [
        { q: "First, have your family or friends ever traveled to see a sporting event? For example, have they traveled to see a football game, basketball game, or other types of sports? Why or why not?",
          lx: ["atmosphere", "go on a trip", "fan"],
          model: "[A] Yes, my uncle and my cousin often travel to see football matches. [R] They're huge fans of our local team, and for them, going to away games is a way to spend time together and visit new cities. [E] For example, last season they traveled to four different cities to watch our team play. They took long bus rides with other fans, sang songs all the way and explored each city before the match. My cousin says those trips are his favorite memories with his dad. [C] So for them, sports travel is about family as much as football.", model5: "[A] Yes, my uncle and cousin regularly travel to see our local football team play away. [R] For them, it's about far more than the match itself: it's a chance to spend quality time together while exploring new places. [E] Last season, for instance, they followed the team to four different cities, traveling on overnight buses packed with fellow fans who sang for most of the journey. They always arrive early to explore the city, and my cousin says these trips have given him his best memories with his father, regardless of whether the team **won** or lost. [C] So, for them, traveling to sporting events is as much about family bonding as about football." },
        { q: "When you travel, do you prefer to plan the details of your trip in advance, or do you prefer to be spontaneous and explore your destination without sticking to a plan? Why?",
          lx: ["plan an itinerary", "go with the flow", "spontaneous"],
          model: "[A] I prefer to plan the basics in advance and be spontaneous with the rest. [R] I need to know where I'm sleeping and how I'm getting there, because last-minute bookings are expensive and stressful. But if I plan every hour, I miss the unexpected moments that make a trip special. [E] For example, in Portugal, we booked our hostels and buses before the trip, but we didn't plan our days. One afternoon, a local fisherman told us about a hidden beach, and it became the best day of the trip. On the other hand, a friend once arrived in Barcelona without a booking and spent half a day looking for a bed. [C] So a little planning gives me freedom.",
          model5: "[A] I plan the essentials in advance and leave everything else open. [R] Securing accommodation and transport early saves money and stress, whereas planning every hour would rule out the unexpected moments that make a trip memorable. [E] In Portugal, for instance, we booked our hostels and buses beforehand but kept the days entirely flexible. One afternoon, a local fisherman told us about a hidden cove, and it turned out to be the highlight of the entire trip. A friend of mine, by contrast, once arrived in Barcelona with nothing booked and wasted half a day hunting for a bed. [C] So a light framework of planning is what gives me the freedom to be spontaneous." },
        { q: "In recent years, there has been a trend towards eco-friendly travel, where people try to minimize their environmental impact while traveling, like using public transportation instead of taking a taxi. Do you think that in the future, more people will adopt eco-friendly travel habits? Why or why not?",
          lx: ["carbon footprint", "sustainable tourism", "eco-friendly"],
          model: "[A] Yes, I think more people will adopt eco-friendly travel habits, especially young people. [R] People are more aware of climate change, and trains and public transport are getting faster and more comfortable. But cheap flights are still very attractive, so change will be slow unless trains become cheaper. [E] For example, on my trip last summer, we traveled between cities by bus and train, used public transport everywhere and stayed in small family hostels. It was cheaper and more interesting than taxis. Many of my friends now choose night trains instead of short flights. But when a flight costs twenty euros and the train costs eighty, most people still fly. [C] So eco-friendly travel will grow, but prices must help.",
          model5: "[A] I believe they will, particularly younger travelers, although progress will depend heavily on price. [R] Awareness of climate change is growing, and trains and public transport are becoming faster and more comfortable; however, ultra-cheap flights remain a powerful temptation. [E] Last summer, for instance, my friends and I traveled between cities by bus and train, relied on public transport everywhere and stayed in small family-run hostels, which proved both cheaper and more rewarding than taxis. Several friends now choose night trains over short-haul flights. Still, when a flight costs twenty euros and the train eighty, most people will fly. [C] So eco-friendly travel will spread, but only as fast as prices allow." },
        { q: "Some people believe that traveling is essential for building confidence and independence. Do you agree with this idea? Or do you think there are other ways to develop these qualities? Explain why you think so.",
          lx: ["self-reliant", "step out of your comfort zone", "confidence"],
          model: "[A] I agree that travel is a great way to build confidence and independence, but it's not the only way. [R] When you travel, you have to solve problems on your own, talk to strangers and deal with the unexpected, which makes you stronger. But you can also become independent by moving out, working or volunteering. [E] For example, when I flew alone to Canada, my connecting flight was cancelled, and I had to find a new flight and a hotel by myself, in English. I was stressed, but afterwards I felt I could handle anything. But I learned just as much independence from my first year living in a dorm and working at a café. [C] So travel helps a lot, but life at home can teach the same things.",
          model5: "[A] Travel is an excellent way to build both, though certainly not the only one. [R] Traveling forces you to solve problems independently, approach strangers and cope with the unexpected, which builds resilience quickly; moving out, working or volunteering, however, can teach the same lessons. [E] When I flew to Canada alone, for instance, my connecting flight was cancelled, and I had to rebook and find a hotel entirely by myself, in English. It was stressful, yet afterwards I felt I could handle almost anything. That said, my first year in a dorm, juggling studies and a café job, taught me just as much about independence. [C] So travel accelerates personal growth, but everyday challenges at home can achieve the same." }
      ]
    },
    { id: "sth", badge: "platform", title: "Travel & What It Means", src: "Практика платформы",
      scenario: "We're exploring how people travel and what travel means to them. I'll ask you a few questions to learn more about your experiences and opinions.",
      questions: [
        { q: "When was the last time you traveled somewhere—either within your country or abroad—and what was the purpose of the trip?",
          lx: ["abroad", "go on a trip", "catch up with"],
          model: "[A] The last time I traveled was in August, when I flew to Canada to visit my best friend. [R] She moved there two years ago with her family, and although we video call every week, I really missed seeing her in person. It was also my first trip outside Europe. [E] For example, I saved money from my café job for six months to buy the plane ticket. We spent a week together — she showed me her new city, we went hiking by a huge lake surrounded by mountains, and we talked late into the night like when we were kids. I also spent three days exploring alone before she finished work. [C] So the purpose was friendship, but it also became a big adventure.",
          model5: "[A] Most recently, I flew to Canada in August to visit my best friend. [R] She emigrated there two years ago, and although we video call weekly, I was desperate to see her in person; it was also my first trip beyond Europe. [E] I'd saved my café wages for six months to afford the ticket, for instance. Over the week, she showed me her new city, we hiked around a vast glacier lake ringed by mountains, and we stayed up talking into the night just as we did as children. I also had three days exploring alone before she finished work. [C] So the purpose was friendship, but it turned into a genuine adventure as well." },
        { q: "Travel can be relaxing, educational, or even life-changing. What do you enjoy most about traveling? And do you prefer visiting familiar places or exploring new and unfamiliar destinations? Why?",
          lx: ["explore", "immerse yourself in", "catch the travel bug"],
          model: "[A] What I enjoy most is meeting people and discovering how they live, and I definitely prefer new destinations. [R] Seeing a new place makes me curious and helps me understand the world and myself better. Familiar places are relaxing, but I don't learn much there. [E] For example, in Lisbon, an old man in a café taught us a few Portuguese words and told us about the city's history for an hour — that's my favorite memory, not the famous monuments. My parents go to the same beach every summer, and they love it, but I would get bored. I caught the travel bug after my first trip abroad. [C] So for me, new places and new people are the best part.",
          model5: "[A] Above all, I love meeting people and discovering how they live, and I'm firmly drawn to unfamiliar destinations. [R] New places spark my curiosity and teach me about the world, and about myself, whereas familiar destinations, relaxing though they are, rarely surprise me. [E] In Lisbon, for instance, an elderly man in a café spent an hour teaching us Portuguese phrases and recounting the city's history, and that conversation, rather than any monument, is my most treasured memory. My parents return to the same beach every summer and adore it, but I'd be restless within days. Ever since my first trip abroad, I've well and truly **caught the travel bug**. [C] So for me, the unfamiliar is precisely the point." },
        { q: "These days, more people are thinking about sustainable tourism—like supporting local businesses, minimizing environmental impact, or avoiding over-tourism. Is that something you consider when planning a trip? Why or why not?",
          lx: ["sustainable tourism", "over-tourism", "a tourist trap"],
          model: "[A] Yes, I consider it, although I can't always afford the most eco-friendly option. [R] I want my money to help local people, not only big international companies, and I don't want to add to the crowds in places that are already full. [E] For example, in Portugal, we stayed in small family hostels, ate in local restaurants instead of chains and traveled by bus and train. We also visited a small fishing town instead of the most famous tourist spots. In Barcelona, I saw signs from locals saying \"Tourists go home,\" and it made me think about how tourism affects people who live there. [C] So I try to travel responsibly, as much as my budget allows.",
          model5: "[A] I do, although my student budget doesn't always allow the most sustainable choice. [R] I'd rather my money supported local families than international chains, and I'm reluctant to add to the crowds in places already overwhelmed by visitors. [E] In Portugal, for instance, we stayed in small family-run hostels, ate in local restaurants rather than chains, and traveled by bus and train, even choosing a quiet fishing town over the most famous resorts. In Barcelona, meanwhile, I saw residents' banners urging tourists to go home, which really made me reflect on how tourism affects the people who actually live there. [C] So I try to travel responsibly, within the limits of my budget." },
        { q: "As technology changes the way we plan and experience travel—through apps, virtual tours, or online reviews—do you think the meaning of travel is changing? Why or why not?",
          lx: ["read reviews", "virtual tour", "authentic"],
          model: "[A] Yes, I think technology is changing the meaning of travel a little. [R] Apps and reviews make travel easier and safer, but they also make it more predictable. Many people now visit the same places because of the same photos, and they spend a lot of time on their phones instead of looking around. [E] For example, in Lisbon, there was a famous viewpoint from social media where hundreds of people waited to take the same photo. But when we turned off our phones and just walked, we found a quiet garden with an even better view and no tourists. Maps and translation apps also helped me a lot in Canada. [C] So technology helps, but we should use it less to keep travel exciting.",
          model5: "[A] I think it is, in subtle ways. [R] Apps and reviews make travel easier and safer, but also more predictable: people increasingly visit identical spots because of identical photos, and spend much of the trip looking at screens rather than at their surroundings. [E] In Lisbon, for instance, hundreds of visitors queued at a viewpoint made famous on social media just to reproduce the same photograph. When we put our phones away and simply wandered, we stumbled on a quiet garden with an even better view and not a tourist in sight. That said, maps and translation apps were invaluable during my solo days in Canada. [C] So technology makes travel easier, but used too much, it risks making it less of an adventure." }
      ]
    },
    { id: "svh", badge: "platform", title: "Vacation Habits", src: "Практика платформы",
      scenario: "I'm conducting a study about how people plan and experience vacations. I'd like to ask you a few questions.",
      questions: [
        { q: "When was the last time you took a vacation, and where did you go? Was it a short weekend trip, or something more extended?",
          lx: ["take time off", "go on a trip", "get away from it all"],
          model: "[A] My last real vacation was in August, when I spent a week in Canada visiting my best friend. [R] It was a longer trip than usual, because flights are expensive and I wanted to make it worth it. Before that, in July, I also had a two-week trip to Portugal and Spain with friends. [E] For example, in Canada, we spent a few days in the city and three days in the mountains, hiking and swimming in a cold lake. I didn't check my university email once! Usually during the semester, I only have short weekend trips, like going hiking with my club or visiting my grandmother's village. [C] So this summer was special, with two big trips.",
          model5: "[A] My last proper vacation was a week in Canada in August, visiting my best friend. [R] It was longer than my usual breaks, partly because long-haul flights are expensive and I wanted to make the most of it; I'd also had a two-week trip through Portugal and Spain in July. [E] In Canada, for instance, we split our time between her city and three days in the mountains, hiking and braving a freezing glacier lake, and I didn't open my university email once. During the semester, by contrast, my getaways are short weekends: hiking trips with the club or visits to my grandmother's village. [C] So this summer was exceptional, with two substantial trips back to back." },
        { q: "People go on vacation for many different reasons—some want to relax and unwind, others seek adventure, and some are looking to spend time with family or discover new cultures. What does an ideal vacation look like for you, and why do you think that kind of break appeals to you?",
          lx: ["get away from it all", "adventure", "local culture"],
          model: "[A] My ideal vacation is a mix of adventure in nature and discovering a new culture. [R] During the semester, I spend most of my time in the city and in front of a laptop, so I want to be active outdoors and see something completely different. But I also get bored if I only hike, so I need some city time and good food. [E] For example, a perfect vacation for me would be a week in a country like Japan or Norway — a few days hiking in the mountains, then a few days in a city, visiting markets, trying local dishes and talking to people. I'd stay in small guesthouses and travel by train. [C] So my ideal vacation is active, cultural and a little adventurous.",
          model5: "[A] My ideal vacation blends outdoor adventure with discovering a new culture. [R] Since my semester is spent largely in the city and in front of a laptop, I crave physical activity and a complete change of scenery; yet pure hiking eventually leaves me restless, so I also need a dose of city life and good food. [E] My perfect trip, for instance, would be a week in somewhere like Japan or Norway: several days trekking in the mountains, followed by a few days exploring a city's markets, sampling local dishes and chatting with residents, all while staying in small guesthouses and traveling by train. [C] So it would be active, cultural and just adventurous enough." },
        { q: "Some people enjoy planning every detail—booking activities in advance, researching places to eat—while others prefer to take it day by day. How do you usually plan your vacations, and how does that approach affect your experience?",
          lx: ["plan an itinerary", "go with the flow", "spontaneous"],
          model: "[A] I plan the important things, but I leave a lot of time free. [R] If I plan nothing, I waste time and money, but if I plan every hour, the trip feels like work. [E] For example, when I went to Barcelona with friends, we booked the hotel, the flights and one museum in advance. Everything else we decided each morning. Because of that, we found a small local festival that wasn't in any guidebook, and it was the best day of the trip. [C] So for me, a vacation needs a basic plan and lots of freedom.", model5: "[A] I plan the essentials in advance and deliberately leave the rest open. [R] Planning nothing tends to waste both time and money, whereas scheduling every hour turns a holiday into a to-do list. [E] When I visited Barcelona with friends, for instance, we booked our flights, accommodation and one museum that sells out early, but decided everything else over breakfast each morning. Thanks to that freedom, we stumbled upon a local street festival that wasn't in any guidebook, and it turned out to be the highlight of the trip. [C] So, for me, the ideal vacation combines a light structure with plenty of room for **spontaneous** discoveries." },
        { q: "People often say that vacations aren't just a luxury but a way to maintain good mental health and work-life balance. Do you agree that taking time off is essential? Why or why not—and what do you think would happen if people didn't take breaks?",
          lx: ["take time off", "burn out", "recharge"],
          model: "[A] Yes, I strongly agree that taking time off is essential. [R] Our brains need rest. If people work all the time without breaks, they become tired, stressed and less productive, and finally they **burn out**. [E] For example, my father didn't **take** any **time off** for two years. He was always tired and angry. Last summer, he finally went on a two-week vacation, and he came back calm and full of energy, and he said he worked better after that. [C] So vacations are not a luxury; they're a necessity.", model5: "[A] I wholeheartedly agree that taking time off is essential. [R] Just like our bodies, our minds need recovery time; people who work for long periods without a break become exhausted, irritable and, ironically, far less productive, until eventually they **burn out**. [E] My father, for example, didn't **take** a single day **off** for two years, and he grew increasingly tense and short-tempered. When he finally went on a two-week vacation last summer, he returned relaxed and full of energy, and he admitted that he worked more efficiently afterward. [C] So vacations shouldn't be seen as a luxury, but as a basic investment in people's health and performance." }
      ]
    },
    { id: "sst", badge: "platform", title: "Solo Travel", src: "Практика платформы",
      scenario: "This study is focused on solo travel and how people experience independence while exploring new places.",
      questions: [
        { q: "Have you ever traveled alone before? If yes, what made you decide to do it, and where did you go? If not, is it something you've ever considered doing in the future—and what appeals to you about the idea?",
          lx: ["solo travel", "self-reliant", "step out of your comfort zone"],
          model: "[A] Yes, this summer I traveled alone for the first time, when I flew to Canada. [R] I was going to visit my best friend, but she had to work for the first three days, so I decided to explore the city on my own. I was nervous, but I also wanted to test myself. [E] For example, I flew alone for ten hours with a connection, which was already an adventure. In the city, I walked around different neighborhoods, visited a big park and a museum and ate in small cafés. I even joined a free walking tour, where I met two other solo travelers from Germany and had dinner with them. [C] So it started by accident, but I loved it.",
          model5: "[A] Yes, this summer, for the first time, on my trip to Canada. [R] I was visiting my best friend, but since she had to work for the first three days, I decided to explore on my own; I was nervous, but I also wanted to see whether I could manage it. [E] The ten-hour journey with a connection was already an adventure in itself, for instance. In the city, I wandered through different neighborhoods, spent a morning in an enormous park and an afternoon in a museum, and even joined a free walking tour, where I met two German solo travelers who invited me to dinner. [C] So it began almost by accident, but I absolutely loved it." },
        { q: "Some travelers describe solo trips as empowering, offering a deep sense of freedom and self-discovery. Others find the experience isolating or logistically challenging. How do you personally feel about traveling alone? What are the greatest rewards—and the most common difficulties?",
          lx: ["freedom", "self-discovery", "lonely"],
          model: "[A] I really liked traveling alone, although it was sometimes lonely. [R] The biggest reward was freedom — I could go wherever I wanted, change plans anytime and listen to my own thoughts. The difficulties were loneliness, especially at dinner, and solving every problem by myself. [E] For example, one afternoon I spent three hours in a bookshop just because I wanted to, and nobody was waiting for me. I also felt proud when I fixed problems with my transport card on my own. But eating dinner alone in a restaurant felt strange, so I usually bought food and ate in a park. [C] So solo travel was empowering, but I wouldn't want to do it for a long time.",
          model5: "[A] I found it genuinely empowering, if occasionally lonely. [R] The greatest reward was freedom: I could go wherever I liked, change plans on a whim and actually hear my own thoughts. The difficulties were loneliness, particularly at mealtimes, and the need to solve every problem single-handedly. [E] One afternoon, for instance, I spent three hours in a bookshop simply because I could, with nobody waiting for me, and I felt quietly proud after sorting out a problem with my transport card entirely on my own. Eating dinner alone in restaurants, however, felt awkward, so I usually bought food and ate in a park. [C] So solo travel was liberating, though I'd prefer it in short doses." },
        { q: "Traveling solo often means handling everything from transportation to safety on your own. When you travel by yourself—or imagine doing so—how do you prepare to feel secure, confident, and ready for the unexpected? Are there specific habits, tools, or routines you use?",
          lx: ["keep your wits about you", "travel light", "be prepared"],
          model: "[A] I prepare carefully, especially for safety and money, but I keep my plans simple. [R] When you're alone, nobody can help you if something goes wrong, so a few good habits make me feel calm and confident. [E] For example, before my trip to Canada, I downloaded offline maps, saved my hostel address in screenshots and shared my location with my mom. I always carry two bank cards in different places and some cash, and I travel light, so I can move easily. In the evenings, I avoid empty streets and keep my wits about me. When my flight was cancelled, I already had travel insurance, which saved me a lot of stress. [C] So good preparation gives me freedom to relax.",
          model5: "[A] I prepare thoroughly where safety and money are concerned, while keeping the itinerary itself simple. [R] Traveling alone means there's no one to fall back on, so a handful of reliable habits allow me to feel calm and confident. [E] Before Canada, for instance, I downloaded offline maps, screenshotted my accommodation details and shared my live location with my mother. I always carry two bank cards stored separately plus some cash, and I **travel light** so I can move easily. After dark, I avoid deserted streets and **keep my wits about me**. When my flight was cancelled, my travel insurance spared me enormous stress. [C] So careful preparation is precisely what lets me relax once I'm there." },
        { q: "Many people say everyone should try solo travel at least once to build independence and expand their perspective. Do you agree with that? How might experiencing a place alone change the way someone understands the world and themselves?",
          lx: ["self-discovery", "broaden your horizons", "self-reliant"],
          model: "[A] Yes, I agree that everyone should try solo travel at least once, even for a short trip. [R] When you're alone, you notice more, talk to more people and learn what you really like, not what your friends want. You also discover that you can deal with problems yourself. [E] For example, alone in Canada, I talked to strangers much more than when I'm with friends — a woman on the bus recommended a hiking trail, and two travelers invited me to dinner. I also learned that I enjoy museums more than I thought! When I came home, I felt more confident at university and at work. [C] So solo travel teaches you about the world and about yourself.",
          model5: "[A] I'd agree, even if it's just a short trip. [R] Alone, you notice more, engage with more people and discover what you genuinely enjoy rather than deferring to friends, and you also learn that you're capable of handling problems yourself. [E] Traveling solo in Canada, for instance, I spoke to far more strangers than I ever do with friends: a woman on the bus recommended a stunning trail, and two fellow travelers invited me to dinner. I also discovered, to my surprise, that I love museums. Back home, I noticed a new confidence in seminars and at work. [C] So solo travel broadens your understanding of the world while quietly revealing who you are." }
      ]
    },
    { id: "scx", badge: "platform", title: "Cultural Exchanges", src: "Практика платформы",
      scenario: "This study looks at how travel can lead to cultural exchange and mutual understanding. I'd like to ask you a few questions about your experiences.",
      questions: [
        { q: "Have you ever traveled to a place where the culture was very different from your own? If so, what stood out to you the most during that visit?",
          lx: ["culture shock", "experience a new culture", "hospitality"],
          model: "[A] Yes, two years ago I traveled to Morocco with my family, and the culture was very different from mine. [R] What stood out most was the hospitality of the people and how busy and colorful everyday life was. [E] For example, in the old markets, there were hundreds of small shops, the smell of spices everywhere and people shouting prices. At first, it was a bit of a culture shock. But one day, a shop owner invited us for mint tea, even though we didn't buy anything, and talked to us for an hour about his family. We were also invited to a family dinner by our guesthouse owner, and everyone ate from one big plate. [C] So the warmth of the people impressed me most.",
          model5: "[A] Yes; two years ago, my family and I traveled to Morocco, which felt worlds away from home. [R] What stood out most was the extraordinary hospitality, along with the sheer energy and color of everyday life. [E] The old markets, for instance, were a maze of tiny shops, with the scent of spices hanging in the air and traders calling out prices, which was initially a real **culture shock**. Yet one shopkeeper invited us in for mint tea despite our not buying anything and chatted for an hour about his family, and our guesthouse owner later welcomed us to a family dinner where everyone shared food from one large dish. [C] So it was the warmth of the people that left the deepest impression." },
        { q: "One of the powerful aspects of travel is learning how other people live, think, and celebrate. Can you share an example of something new you learned—whether it was a tradition, a value, or even a different way of doing everyday things?",
          lx: ["customs", "values", "broaden your horizons"],
