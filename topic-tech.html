    coll:      { icon: "link",       time: "8 мин",  steps: ["Учи сочетание целиком", "Цветной кубик — то, что чаще путают", "Опиши свой день онлайн с 5 сочетаниями"] },
    idioms:    { icon: "quote",      time: "6 мин",  steps: ["Посмотри картинку — запомни образ", "Плашка «Можно» — смело в ответы", "Выбери 2 идиомы на сегодня"] },
    expr:      { icon: "megaphone",  time: "5 мин",  steps: ["Послушай интонацию", "По 1 фразе из каждой группы", "Запомни шкалу 45 секунд"] },
    check:     { icon: "puzzle",     time: "10 мин", steps: ["4 мини-игры", "Цель — 100% в Matching и Gap-fill", "Карточки — пока не узнаёшь все"] },
    repeat:    { icon: "headphones", time: "5 мин",  steps: ["Слушай, не читая", "Повтори слово в слово", "Включи запись и сравни"] },

  warmup: [

    "Which app do you use the most?",
    "Do you post on social media, or do you mostly scroll?",
    "Could you live without the internet for a week?"

  /* Телефон в руке: равные ветки, вместо процента — tag */

    icon: "phone",
    title: "Телефон в руке: друг или ловушка?",

    branches: [
      { title: "Connect", ru: "общаться", sub: "close, even far away", tag: "Связь", color: "#0ea5e9", words: ["keep in touch", "a video call", "a group chat", "long-distance"] },
      { title: "Get things done", ru: "решать задачи", sub: "a tool in my pocket", tag: "Польза", color: "#8b5cf6", words: ["look things up", "online banking", "a navigation app", "productivity"] },
      { title: "Get lost", ru: "залипнуть", sub: "where the hours go", tag: "Ловушка", color: "#ec4899", words: ["doomscrolling", "endless notifications", "screen time", "FOMO"] }

    notes: [

  scale: {

    says: [

      { max: 50,  t: "I use my phone a lot, but I've set **screen-time limits**, so I only **check it now and then**." },
      { max: 75,  t: "I'll admit I'm a **heavy user** — I'm pretty much **glued to my phone**." },
      { max: 101, t: "Honestly, I'm **chronically online**. I lose hours **doomscrolling** every night." }
    ]
  },

  vocab: [

    { en: "app", pos: "n", ru: "приложение", ex: "I deleted two apps that wasted my time.", level: "core" },
    { en: "notification", pos: "n", ru: "уведомление", ex: "I turned off most notifications on my phone.", level: "core" },
    { en: "screen time", pos: "n", ru: "экранное время", ex: "My screen time is about five hours a day.", level: "core" },
    { en: "scroll through", pos: "phr v", ru: "листать (ленту)", ex: "I scroll through Instagram on the bus.", level: "core" },

    { en: "video call", pos: "n", ru: "видеозвонок", ex: "I have a video call with my parents every Sunday.", level: "core" },
    { en: "group chat", pos: "n", ru: "групповой чат", ex: "Our class has a group chat for homework questions.", level: "core" },
    { en: "privacy", pos: "n", ru: "конфиденциальность, приватность", ex: "I worry about my privacy online.", level: "core" },
    { en: "update", pos: "n / v", ru: "обновление; обновлять", ex: "My phone needs an update again.", level: "core" },
    { en: "upload", pos: "v", ru: "загружать (в сеть)", ex: "I uploaded the photos from the trip.", level: "core" },
    { en: "online / offline", pos: "adj / adv", ru: "в сети / не в сети", ex: "I try to stay offline on Sunday mornings.", level: "core" },

    { en: "tech-savvy", pos: "adj", ru: "хорошо разбирающийся в технологиях", ex: "My grandmother is surprisingly tech-savvy.", level: "adv" },
    { en: "digital native", pos: "n", ru: "«цифровой абориген» (вырос с интернетом)", ex: "As a digital native, I can't imagine life without the internet.", level: "adv" },
    { en: "algorithm", pos: "n", ru: "алгоритм (ленты)", ex: "The algorithm shows me more of what I already like.", level: "adv" },
    { en: "misinformation", pos: "n", ru: "дезинформация, ложные сведения", ex: "Misinformation spreads faster than the truth online.", level: "adv" },
    { en: "cyberbullying", pos: "n", ru: "травля в интернете", ex: "Schools need clear rules against cyberbullying.", level: "adv" },
    { en: "addictive", pos: "adj", ru: "вызывающий зависимость", ex: "Many apps are designed to be addictive.", level: "adv" },
    { en: "FOMO (fear of missing out)", pos: "n", ru: "страх что-то пропустить", ex: "FOMO makes me check my phone all the time.", level: "adv" },
    { en: "doomscrolling", pos: "n", ru: "бесконечное листание плохих новостей", ex: "Doomscrolling before bed ruins my sleep.", level: "adv" },
    { en: "digital divide", pos: "n", ru: "цифровое неравенство", ex: "The pandemic made the digital divide very visible.", level: "adv" },
    { en: "overreliance", pos: "n", ru: "чрезмерная зависимость", ex: "Overreliance on GPS has ruined my sense of direction.", level: "adv" },
    { en: "face-to-face interaction", pos: "n", ru: "живое общение", ex: "Nothing replaces face-to-face interaction.", level: "adv" },
    { en: "artificial intelligence (AI)", pos: "n", ru: "искусственный интеллект", ex: "AI is changing the way we study and work.", level: "adv" }
  ],

  collocations: [
    { icon: "phone", group: "Телефон", items: [
      { en: "_check_ your phone", ru: "проверять телефон", ex: "I check my phone about a hundred times a day." },
      { en: "_turn off_ notifications", ru: "выключить уведомления", ex: "Turning off notifications changed my life." },
      { en: "_download_ an app", ru: "скачать приложение", ex: "I downloaded an app to track my screen time." },
      { en: "_charge_ your phone", ru: "зарядить телефон", ex: "I charge my phone outside my bedroom." },
      { en: "_go_ online / offline", ru: "выйти в сеть / из сети", ex: "I go offline completely on Sunday mornings." }
    ]},
    { icon: "users", group: "Соцсети", items: [
      { en: "_post_ a photo / _post_ on Instagram", ru: "выложить фото (post on, не post in)", ex: "I posted a photo from my trip on Instagram." },
      { en: "_follow_ someone", ru: "подписаться на кого-то", ex: "I follow a few cooking accounts." },
      { en: "_share_ a post", ru: "поделиться постом", ex: "Think before you share a post." },
      { en: "_leave_ a comment", ru: "оставить комментарий", ex: "I never leave comments on strangers' posts." },
      { en: "_go_ viral", ru: "стать вирусным", ex: "The video went viral within hours." }
    ]},
    { icon: "chat", group: "Общение", items: [
      { en: "_keep in touch_ with", ru: "поддерживать связь с", ex: "I keep in touch with my school friends online." },
      { en: "_text_ someone", ru: "написать кому-то (сообщение)", ex: "I'll text you when I arrive." },
      { en: "_make_ a video call", ru: "позвонить по видео", ex: "We make a video call every Sunday." },
      { en: "_reply to_ a message", ru: "ответить на сообщение (reply to!)", ex: "Sorry, I forgot to reply to your message." },
      { en: "_misread_ the tone", ru: "неправильно понять тон", ex: "It's easy to misread the tone of a text." }
    ]},
    { icon: "bulb", group: "Последствия", items: [
      { en: "_spend_ time _on_ your phone", ru: "проводить время в телефоне (on!)", ex: "I spend too much time on my phone." },
      { en: "_be addicted to_ sth", ru: "быть зависимым от", ex: "Many teenagers are addicted to short videos." },
      { en: "_rely on_ technology", ru: "полагаться на технологии", ex: "We rely on technology for almost everything." },
      { en: "_protect_ your privacy", ru: "защищать личные данные", ex: "Use strong passwords to protect your privacy." },
      { en: "_spread_ misinformation", ru: "распространять ложь", ex: "Bots are often used to spread misinformation." }
    ]}
  ],

  idioms: [
    { art: "glued", lit: "буквально: «приклеенный к телефону»", en: "be glued to your phone", ru: "не отрываться от телефона", meaning: "постоянно смотреть в экран", ex: "My little brother is glued to his phone all day.", reg: "ok", note: "Самая нужная идиома темы — подходит почти к любому вопросу." },
    { art: "rabbit", lit: "буквально: «провалиться в кроличью нору»", en: "go down a rabbit hole", ru: "залипнуть, «провалиться» в тему", meaning: "начать с одного видео и потерять часы", ex: "I opened one video and went down a rabbit hole until 2 a.m.", reg: "ok", note: "Живая фраза про бесконечный скроллинг." },
    { art: "loop", lit: "буквально: «вне петли»", en: "be out of the loop", ru: "быть не в курсе", meaning: "не знать последних новостей в своём кругу", ex: "Without the group chat, I'd be totally out of the loop.", reg: "ok", note: "Отлично объясняет FOMO и групповые чаты." },
    { art: "sword", lit: "буквально: «обоюдоострый меч»", en: "a double-edged sword", ru: "палка о двух концах", meaning: "то, что одновременно полезно и вредно", ex: "Social media is a double-edged sword.", reg: "ok", note: "Идеальная фраза для opinion-вопросов «plus or minus»." },
    { art: "translation", lit: "буквально: «потерялось при переводе»", en: "get lost in translation", ru: "исказиться, не дойти до адресата", meaning: "смысл или тон теряется при передаче", ex: "Sarcasm often gets lost in translation in a text.", reg: "ok", note: "Лучшая фраза для вопросов о недопонимании в переписке." },
    { art: "posted", lit: "буквально: «держать в курсе (по почте)»", en: "keep someone posted", ru: "держать в курсе", meaning: "сообщать новости по мере появления", ex: "I'll keep you posted about the trip.", reg: "ok", note: "Игра слов с «post» — легко запомнить." },
    { art: "behind", lit: "буквально: «позади времени»", en: "be behind the times", ru: "отстать от жизни", meaning: "быть старомодным, не следить за новым", ex: "My dad still prints his emails — he's a bit behind the times.", reg: "ok", note: "Удобно про пожилых людей и цифровое неравенство." },
    { art: "plug", lit: "буквально: «выдернуть вилку»", en: "pull the plug (on sth)", ru: "прекратить, «отключить»", meaning: "решительно остановить что-то", ex: "I finally pulled the plug on TikTok — I deleted it.", reg: "ok", note: "Сильная фраза для истории про цифровой детокс." },
    { art: "bigbrother", lit: "буквально: «Большой Брат следит за тобой» (Оруэлл)", en: "Big Brother is watching (you)", ru: "за тобой следят", meaning: "ощущение тотальной слежки", ex: "With all these cameras and apps, it feels like Big Brother is watching.", reg: "careful", note: "Драматично и клишированно. Только с иронией или в теме приватности." }

  expressions: [

    { icon: "bulb", fn: "Причина", items: [

          lx: ["rely on technology", "device", "app"],
          model: "[A] Technology is extremely important in my daily life — I use it for almost everything. [R] As a student, I need my laptop for studying and my phone for communication, banking, maps and even paying for coffee. [E] For example, this morning my phone woke me up, showed me the weather and the bus schedule, and I paid for my breakfast with it. Then I attended an online lecture on my laptop and sent my essay by email. Without these **devices**, I honestly don't know how I'd organize my day. [C] So I **rely on technology** a lot, maybe even too much.",
          model5: "[A] It's absolutely central; I **rely on technology** for almost every part of my day. [R] As a student, my laptop is essentially my classroom and library, while my phone handles everything from communication and banking to navigation and payments. [E] This morning alone, for instance, my phone woke me up, told me whether to take an umbrella, showed me when the next bus was due and paid for my coffee. By lunchtime, I'd attended a lecture, submitted an essay and messaged three classmates, all through screens. Honestly, if my **devices** disappeared tomorrow, I'd struggle to organize even a basic day. [C] So technology isn't just important to me; it's practically invisible because it's everywhere." },
        { q: "Have you ever felt frustrated while using technology? What happened?",
          lx: ["update", "back up", "crash"],
          model: "[A] Yes, many times, but one situation was really stressful. [R] Technology is great when it works, but when it fails at the wrong moment, it can be a disaster. [E] For example, last semester, my laptop suddenly installed an **update** ten minutes before an online exam. It took twenty minutes, and I was sure I would miss the exam. I had to call my professor in panic. Luckily, she gave me extra time. Since then, I always check for updates the night before important deadlines. [C] So technology can be very frustrating when you depend on it.",
          model5: "[A] Plenty of times, but one incident stands out. [R] Technology is wonderful when it works, but precisely because we depend on it so heavily, a failure at the wrong moment can feel catastrophic. [E] Last semester, for instance, ten minutes before an online exam, my laptop decided to install a mandatory **update** that took nearly twenty minutes. I sat there watching the progress bar crawl, convinced I'd fail, before calling my professor in a complete panic. Fortunately, she was understanding and gave me extra time. Ever since, I check for updates and **back up** my files the night before any important deadline. [C] So my frustration taught me a useful lesson: never trust technology blindly." },
        { q: "Some people believe technology will replace many jobs, while others think it will create more opportunities. What is your opinion and why?",
          lx: ["automate", "replace", "develop new skills"],
          model: "[A] I think technology will replace some jobs, but it will create even more new ones. [R] This always happens with new technology. Old jobs disappear, but people start doing new work that didn't exist before. [E] For example, twenty years ago, nobody worked as a social media manager or an app developer. Now millions of people have these jobs. Of course, some people, like cashiers, are losing jobs to machines, so they need help to learn new skills. [C] So overall, technology creates opportunities, but the change can be painful.", model5: "[A] I believe technology will eliminate some jobs but create even more opportunities overall. [R] History shows that every major technological shift destroys certain roles while generating entirely new ones that nobody could have predicted. [E] Twenty years ago, for example, jobs like social media manager or app developer simply didn't exist, yet today millions of people earn a living from them. **That said**, the transition is painful for those whose jobs disappear, such as cashiers replaced by self-checkout machines, so governments and companies need to help them retrain. [C] So technology is, on balance, a source of opportunity, provided nobody is left behind along the way." },
        { q: "Some people believe that reliance on technology is reducing our ability to think independently and solve problems. Do you agree or disagree with this belief? Why or why not?",
          lx: ["overreliance", "look things up", "think for yourself"],
          model: "[A] I partly agree. [R] When we can find any answer in seconds, we don't try to think or remember things ourselves. But technology can also help us learn and solve more complex problems. [E] For example, I can't find my way anywhere without GPS anymore, and I don't remember any phone numbers except my mom's. On the other hand, I use online tools to learn statistics, and I understand it better than before. [C] So technology can make us lazy thinkers, but only if we use it instead of thinking, not to help our thinking.",
          model5: "[A] I partly agree, although I think the problem lies in how we use technology rather than technology itself. [R] When any answer is a few seconds away, we're tempted to **look things up** instead of reasoning them out, and skills we don't use inevitably weaken. Used well, however, technology can sharpen our thinking. [E] I'm a good example of both sides: thanks to my **overreliance** on GPS, I can barely navigate my own city without it, and I couldn't tell you a single phone number other than my mother's. Yet online tools have also helped me understand statistics far more deeply than any textbook did. [C] So technology makes us lazy thinkers only when we use it to replace thinking rather than support it." }
      ]},
    { id: "s115", badge: "official", title: "Digital Device Usage", src: "Official TOEFL · 115",
      scenario: "You received an email from your university inviting you to join a research study about digital device usage. You have scheduled a short online interview with a researcher.",
      questions: [
        { q: "First, how many hours a day do you typically spend using electronics like smartphones, tablets, or computers?",
          lx: ["screen time", "spend time on", "device"],
          model: "[A] Honestly, I spend about eight or nine hours a day on electronic **devices**. [R] Most of this time is for studying — my lectures, books and assignments are all online. But I also **spend** about four hours **on** my phone, which is too much. [E] For example, I study on my laptop for around five hours a day. My phone's **screen time** report says I use it for four hours, mostly for messages, social media and videos in the evening. Last month I set a limit for social media apps, and now it's a little better. [C] So my screen time is high, but I'm working on it.",
          model5: "[A] If I'm honest, somewhere between eight and nine hours a day. [R] A large part of that is unavoidable, since my lectures, readings and assignments are all digital. The part I'm less proud of is the four or so hours I **spend on** my phone, much of it on things I couldn't even remember afterwards. [E] On a typical day, for instance, I study on my laptop for about five hours, while my phone's weekly report shows an average of four hours of **screen time**, mostly messaging, social media and videos late in the evening. Since I introduced daily limits on social apps last month, that figure has started to fall. [C] So my overall screen time is high, but I'm trying to make the non-study part more intentional." },
        { q: "What types of activities do you usually do on your digital devices? For example, do you use them for work, entertainment, or socializing?",
          lx: ["keep in touch with", "stream", "productivity"],
          model: "[A] I use my devices for three main things: studying, communicating and entertainment. [R] My laptop is mainly for work, and my phone is for everything else. [E] For example, on my laptop, I attend online lectures, write essays and do research. On my phone, I text my friends, make video calls with my parents and **keep in touch with** classmates in group chats. In the evening, I watch series or YouTube videos to relax. I also use apps for practical things, like banking and maps. [C] So my devices are my office, my phone book and my cinema at the same time.",
          model5: "[A] My devices serve three main purposes: studying, staying connected and relaxing. [R] I keep a fairly clear division between them, using my laptop mainly for work and my phone for almost everything else. [E] On my laptop, for instance, I attend online lectures, write essays and research assignments. My phone, meanwhile, is how I **keep in touch with** friends through group chats and with my parents through weekly video calls. In the evenings, I unwind by streaming series or watching videos, and throughout the day I rely on practical apps for banking, navigation and train tickets. [C] So, in a sense, my devices function as my office, my social life and my cinema all at once." },
        { q: "Can you tell me about a time when you needed to take a break from using digital tools? How did it affect you?",
          lx: ["take a break from", "pull the plug", "recharge"],
          model: "[A] Last summer, I took a break from digital tools during a three-day hiking trip. [R] I felt very tired from screens after exams, and my eyes and head hurt. Also, there was no signal in the mountains. [E] On the first day, I kept reaching for my phone, and I felt a bit anxious. But on the second day, I started to enjoy the views and long conversations with my friends, and I slept much better. When I came back, I had two hundred messages, and almost none were important. [C] So the break helped me **recharge** and use my phone less afterwards.",
          model5: "[A] Last summer, after an exhausting exam period, I effectively **pulled the plug** for three days during a hiking trip. [R] I'd been staring at screens for weeks, my eyes were strained and I felt mentally foggy, so the lack of signal in the mountains came as a welcome excuse. [E] The first day was surprisingly uncomfortable; I kept instinctively reaching for my phone. By the second day, however, I was absorbed in the scenery and long conversations with friends, and I slept more deeply than I had in months. When I returned, two hundred unread messages were waiting, and, tellingly, almost none of them mattered. [C] So the break not only helped me **recharge** but also permanently changed how often I reach for my phone." },
        { q: "Some people believe that spending too much time on personal technology can negatively impact face-to-face social interactions. Do you agree or disagree with this viewpoint? Why?",
          lx: ["face-to-face interaction", "be glued to your phone", "be present"],
          model: "[A] I agree. [R] When people look at their phones all the time, they don't really listen to each other, and conversations become shorter and less deep. Also, some people feel more comfortable texting than talking, so they avoid real conversations. [E] For example, last month I went to dinner with five friends, and almost everyone was **glued to their phone**. We sat together, but nobody really talked. Now my friends and I have a rule: phones go in the middle of the table, and the first person who checks theirs pays for dessert. [C] So technology can hurt **face-to-face interaction** if we're not careful.",
          model5: "[A] I agree, though I'd add that it's a habit we can control. [R] When phones are constantly within reach, people listen with only half their attention, conversations lose depth, and some, particularly younger people, start to feel more comfortable texting than speaking in person. [E] Last month, for instance, I had dinner with five friends, and for long stretches almost everyone was **glued to their phone**; we were together physically, yet hardly connecting. Since then, our group has adopted a simple rule: phones go in a pile in the middle of the table, and whoever checks theirs first pays for dessert. Our dinners have become noticeably livelier. [C] So technology can certainly weaken **face-to-face interaction**, but only if we let it." }
      ]},
    { id: "s108", badge: "official", title: "Social Media Use", src: "Official TOEFL · 108",
      scenario: "You have volunteered for a research study about social media use. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, if you were to choose a social media platform to use most regularly, which one would you choose and why?",
          lx: ["follow", "scroll through", "keep in touch with"],
          model: "[A] I would choose Instagram. [R] It's where most of my friends are, it's visual, and I can use it both for fun and for learning. I can see what my friends are doing and also follow interesting accounts. [E] For example, I **follow** my friends, a few photographers and some accounts about marketing, which is my field of study. I use it to **keep in touch with** school friends who live in other cities. I also share photos from my trips, but not very often. [C] So Instagram is the platform that fits my life best.",
          model5: "[A] I'd choose Instagram, mainly because it combines staying in touch with genuine inspiration. [R] Most of my friends are active there, it's highly visual, which suits me, and with a bit of curation it can be educational as well as entertaining. [E] Alongside friends, for instance, I **follow** several photographers and a handful of accounts on marketing, which happens to be my field of study, so my feed is a mix of social updates and professional ideas. It's also how I **keep in touch with** school friends who've moved to other cities, and occasionally I share photos from my travels. [C] So Instagram is the platform that fits my life best, as long as I control the feed rather than letting the algorithm control me." },
        { q: "Do you think social media is more beneficial for younger people or older people? Why?",
          lx: ["lonely", "keep in touch", "vulnerable"],
          model: "[A] I think social media is more beneficial for older people. [R] Many older people live alone and feel lonely, and social media helps them **keep in touch** with family and friends. Young people, on the other hand, can become addicted and compare themselves with others, which is bad for their self-esteem. [E] For example, my grandmother joined Facebook two years ago. Now she sees photos of her grandchildren every day and chats with her old school friends. My younger sister, however, often feels bad after scrolling through perfect pictures of influencers. [C] So older people get more benefits and fewer risks.",
          model5: "[A] On balance, I'd argue older people benefit more. [R] For many older people, especially those living alone, social media offers a lifeline against loneliness, connecting them with family and old friends. Younger users, by contrast, are more **vulnerable** to its downsides — addictive design, constant comparison and pressure to present a perfect image. [E] My grandmother, for instance, joined Facebook two years ago and now sees photos of her grandchildren daily and has even reconnected with classmates from sixty years ago. My younger sister, meanwhile, often comes away from scrolling through influencers' flawless photos feeling worse about herself. [C] So older people tend to gain more and risk less, although both groups need to use it wisely." },
        { q: "Some people believe that social media can help people stay connected, while others think it can lead to feelings of isolation. What are your thoughts on this? Do you agree or disagree? Why?",
          lx: ["a double-edged sword", "FOMO", "stay connected"],
          model: "[A] I think both are true — social media can connect us and isolate us. [R] It helps us **stay connected** with people far away. But when we only see other people's best moments, we can feel left out and lonely. Also, online contact can't replace real meetings. [E] For example, when I moved to university, social media helped me stay close to my school friends. But one weekend, I stayed home alone and saw photos of all my friends at a party. I felt terrible and very isolated, even though I was \"connected\". [C] So social media is **a double-edged sword**.",
          model5: "[A] I'd say both are true; social media is **a double-edged sword**. [R] It's an invaluable way to **stay connected** across distances, yet it also exposes us to an endless stream of other people's highlights, which can trigger **FOMO** and loneliness. Moreover, likes and comments can easily become a substitute for real contact. [E] When I moved away for university, for instance, social media helped me remain close to my school friends. Yet one weekend, stuck alone in my dorm with a cold, I scrolled through photos of friends at a party and felt more isolated than if I'd seen nothing at all. [C] So whether it connects or isolates us depends largely on whether it complements real relationships or replaces them." },
        { q: "Looking to the future, do you think social media use will continue to grow? Or will people start to limit their usage? What factors do you think will most affect future usage of social media? Explain your thoughts.",
          lx: ["screen time", "regulation", "digital detox"],
          model: "[A] I think social media will continue to grow overall, but many people will start to limit it. [R] New platforms and technologies like AI and virtual reality will attract more users. But people are becoming more aware of the negative effects on mental health and sleep. Governments may also make new rules, especially for children. [E] For example, many of my friends now use screen-time limits or delete apps during exams, and some countries are discussing age limits for social media. At the same time, my grandmother and her friends joined social media only recently. [C] So usage will grow, but people will use it more carefully.",
          model5: "[A] I expect overall usage to keep growing, while individual users become increasingly deliberate about limiting it. [R] New features, from AI-generated content to virtual reality, will continue to draw people in, and older generations are still joining. At the same time, awareness of the impact on mental health and sleep is rising, and governments are starting to intervene. [E] Many of my friends, for instance, now set **screen-time** limits or delete apps entirely during exam periods, and several countries are debating minimum ages for social media. Meanwhile, my grandmother and her friends have only just discovered it. [C] So the biggest factors, I think, will be **regulation** and awareness, which will shape not whether we use social media, but how." }
      ]},
    { id: "s078", badge: "official", title: "Social Media", src: "Official TOEFL · 078",
      scenario: "You received an email from your university inviting you to join a research study about social media. You have scheduled a short online interview with a researcher.",
      questions: [
        { q: "To start, how often do you use social media platforms and for what purposes? Or, if you don't use them, why not?",
          lx: ["scroll through", "keep in touch with", "post"],
          model: "[A] I use social media every day, about two hours in total. [R] I use it mainly to stay in contact with friends, to follow news and to relax. [E] For example, in the morning, I check messages and news on the bus. During the day, I use group chats to organize study meetings with classmates. In the evening, I **scroll through** Instagram or watch short videos to relax. I don't **post** very often — maybe once a month, usually photos from trips. [C] So social media is a daily habit for me, but I'm more of a viewer than a creator.",
          model5: "[A] I use it daily, for roughly two hours in total, although it's spread across the day in short bursts. [R] My main purposes are staying in contact with friends, keeping up with news and, admittedly, switching off in the evenings. [E] On my morning commute, for instance, I catch up on messages and headlines; during the day, our class group chat is essential for organizing study sessions; and in the evening, I **scroll through** Instagram or watch short videos to unwind. I rarely **post** anything myself — perhaps once a month, usually photos from a trip. [C] So social media is very much part of my routine, but I'm far more of an observer than a creator." },
        { q: "In your opinion, what makes social media either enjoyable or difficult to deal with?",
          lx: ["algorithm", "negative comments", "compare yourself"],
          model: "[A] Social media is enjoyable because it's fun and connects people, but it's difficult because of comparison and negativity. [R] I love seeing my friends' news, funny videos and new ideas. But people show only perfect moments, and some comments are rude and aggressive. [E] For example, I enjoy following a travel photographer who shows amazing places, and it inspires me. But once I posted my opinion about a film, and strangers wrote very rude comments. I deleted the post. Also, after scrolling, I sometimes **compare myself** with others and feel bad. [C] So it's fun, but it can also be stressful.",
          model5: "[A] What makes it enjoyable is the connection and inspiration; what makes it difficult is comparison and hostility. [R] I genuinely love seeing friends' news, discovering creative ideas and laughing at the occasional absurd video. Yet the constant stream of carefully curated perfection, along with the aggressive tone of some comment sections, can quickly turn the experience sour. [E] Following a travel photographer, for instance, regularly inspires me to plan new trips. On the other hand, when I once shared a fairly harmless opinion about a film, strangers responded with such rude comments that I deleted the post within an hour. And, if I'm honest, scrolling sometimes leaves me **comparing myself** unfavorably with others. [C] So social media can enrich my day or drain it, depending largely on what I choose to engage with." },
        { q: "What kinds of things do you think are appropriate to share on social media, and why?",
          lx: ["privacy", "post", "digital footprint"],
          model: "[A] I think it's fine to share positive, general things, but not private or personal information. [R] What we post stays online forever, and anyone — employers, strangers or even criminals — can see it. [E] For example, I share photos of nature, food or events, and sometimes good news, like passing an exam. But I never post my address, my travel plans while I'm away, or photos of other people without asking them. A friend once posted that her family was on vacation, and her apartment was robbed. [C] So I think we should share carefully and protect our **privacy**.",
          model5: "[A] In my view, general, positive content is fine, whereas anything that compromises **privacy** — yours or other people's — is not. [R] Everything we post contributes to a **digital footprint** that's almost impossible to erase, and it may be seen by future employers, strangers or even criminals. [E] I happily share photos of landscapes, meals or events, for instance, and occasionally good news, such as passing a difficult exam. However, I never post my address, real-time travel plans or photos of friends without their permission. A friend once announced online that her family was abroad, and their apartment was burgled while they were away. [C] So the rule I follow is simple: if I wouldn't tell it to a stranger, I don't post it." },
        { q: "Some believe that social media has more negative effects than positive ones on society in general. Do you agree or disagree with this viewpoint? Explain why.",
          lx: ["misinformation", "a double-edged sword", "raise awareness"],
          model: "[A] I partly agree — I think the negative effects are a little bigger today. [R] Social media spreads fake news very quickly, divides people into groups that hate each other, and hurts young people's mental health. But it also helps people find information, support each other and fight for good causes. [E] For example, during the pandemic, a lot of false information about health spread online, and some people believed it. But social media also helped my city collect money for a family who lost their house in a fire in just two days. [C] So it's both, but the negative side needs more control.",
          model5: "[A] I'd partly agree; at present, the negative effects arguably outweigh the positive ones, though that isn't inevitable. [R] Social media has accelerated the spread of **misinformation**, deepened political polarization and harmed many young people's mental health. At the same time, it has given a voice to the voiceless and helped communities **raise awareness** and mobilize remarkably quickly. [E] During the pandemic, for instance, dangerous health myths spread online faster than official advice. Yet in my city, a social media campaign raised enough money in just two days to rehouse a family whose home had burned down. [C] So social media is **a double-edged sword**, and whether it does more good or harm depends largely on how platforms are regulated and how responsibly we use them." }
      ]},
    { id: "sdc", badge: "platform", title: "Digital Communication", src: "Практика платформы",
      scenario: "We're discussing how relationships—whether with friends, family members, or even coworkers—are influenced by digital forms of communication. I'd like to ask you a few questions about how you stay in touch with the people in your life.",
      questions: [
        { q: "How often do you communicate with friends or family through digital channels like text messages, voice calls, social media, or messaging apps? Would you say this is your primary form of communication?",
          lx: ["keep in touch with", "group chat", "voice message"],
          model: "[A] I communicate digitally every day, and for family and old friends, it's my main way of communication. [R] I live far from my hometown, so messaging apps and video calls are the easiest way to **keep in touch with** my parents and school friends. With university friends, I talk more face-to-face. [E] For example, I text my mom almost every day, and we have a video call every Sunday. I also have a **group chat** with my school friends, where we send photos and **voice messages**. But with my roommate and classmates, I mostly talk in person. [C] So digital communication is my main way for people who are far away.",
          model5: "[A] Every single day, and for family and old friends it's undoubtedly my primary form of communication. [R] Since I moved several hundred kilometers away for university, messaging apps and video calls have become the only practical way to **keep in touch with** my parents and school friends. With people on campus, by contrast, most of my communication happens face to face. [E] I exchange messages with my mother almost daily, for instance, and we have a standing video call every Sunday evening. My school friends and I share a lively **group chat** full of photos, memes and rambling **voice messages**. My roommate and classmates, however, I mostly just talk to in person. [C] So whether digital communication dominates depends entirely on the distance." },
        { q: "Some people believe that digital communication makes it much easier to maintain relationships across long distances and busy schedules. Others feel it doesn't have the same depth or emotional connection as face-to-face conversations. What's your view? Do you think online communication strengthens or weakens personal connections—and why?",
          lx: ["face-to-face interaction", "keep in touch", "shallow"],
          model: "[A] I think online communication strengthens relationships over distance, but it can't fully replace face-to-face conversations. [R] Without messaging apps, I would probably lose contact with many friends. But text messages are often short, and it's hard to share real feelings or support someone through a screen. [E] For example, my best friend moved to Canada two years ago, and we still talk every week thanks to video calls. But when she visited last summer, one long walk together felt more meaningful than months of messages. [C] So digital communication keeps relationships alive, but real meetings make them deep.",
          model5: "[A] I'd say it strengthens relationships across distance, but it can't fully replace the depth of meeting in person. [R] Without digital tools, many friendships would simply fade when people move away. Text-based communication, however, tends to be brief and fragmented, and comforting someone or sharing something difficult through a screen rarely feels quite the same. [E] My best friend, for instance, moved to Canada two years ago, and thanks to weekly video calls, we're still close. Yet when she visited last summer, a single long walk together felt more meaningful than months of messages. [C] So digital communication is what keeps relationships alive, while **face-to-face interaction** is what keeps them deep." },
        { q: "Have you ever experienced a misunderstanding or conflict because of something written in a text, post, or email? If so, how did you handle the situation or try to clarify things afterward?",
          lx: ["misread the tone", "get lost in translation", "clear things up"],
          model: "[A] Yes, I had a misunderstanding with a close friend because of a text message. [R] In writing, you can't hear the tone of voice or see the face, so jokes can look rude. [E] For example, my friend sent me a photo of her new haircut, and I replied \"Wow, brave choice\". I meant it as a compliment, but she **misread the tone** and thought I was laughing at her. She didn't reply for two days. Finally, I called her and explained what I meant, and we laughed about it. [C] Now, for important things, I call instead of texting.",
          model5: "[A] Yes, a seemingly innocent text once caused a real rift with a close friend. [R] In writing, there's no tone of voice or facial expression to soften a message, so a playful comment can easily come across as sarcastic. [E] When she sent me a photo of her dramatic new haircut, for instance, I replied, \"Wow, brave choice,\" intending it as admiration. She, however, **misread the tone** entirely, assumed I was mocking her and went silent for two days. Eventually, I realized something was wrong and called her; within five minutes we'd **cleared things up** and were laughing about it. [C] Since then, whenever a topic is even slightly sensitive, I pick up the phone rather than type, because humor so easily **gets lost in translation**." },
        { q: "As more and more of our communication happens online, do you think people should be more mindful about the way they express themselves digitally—such as thinking about tone, timing, or word choice? Why or why not, and what difference do you think that awareness could make in our relationships?",
          lx: ["mindful", "misread the tone", "think before you post"],
          model: "[A] Yes, I think people should be more careful about how they write online. [R] A short or late reply can look rude, even when the person didn't mean it. Also, messages sent when we're angry can hurt people and can't be taken back. [E] For example, my sister once sent an angry message to her boss late at night, and the next morning she really regretted it. Now I have a rule: if I'm angry, I wait an hour before I reply. I also add a few friendly words or an emoji so my message doesn't sound cold. [C] So a little awareness can prevent many conflicts.",
          model5: "[A] Absolutely; a little more mindfulness online could prevent a great deal of unnecessary conflict. [R] Because written messages lack tone and facial cues, a brief or delayed reply can easily be read as coldness, and words typed in anger are both permanent and impossible to take back. [E] My sister, for instance, once fired off a furious message to her manager late at night and spent the following morning deeply regretting it. Since hearing that story, I've adopted a simple rule: whenever I'm annoyed, I wait at least an hour before replying. I also make a point of adding a warm phrase to short messages, so they don't sound abrupt. [C] So being **mindful** about tone and timing costs very little, yet it can protect relationships that matter." }
      ]},
    { id: "soc", badge: "platform", title: "Online Communication", src: "Практика платформы",
      scenario: "We're conducting a study on how people use digital platforms to communicate in their everyday lives. I'd like to ask you a few questions about your habits and thoughts around online interaction.",
      questions: [
        { q: "How often do you use online platforms—like messaging apps, email, or social media—to stay in touch with friends, family, or coworkers? And how does that compare to the amount of face-to-face communication in your life?",
          lx: ["keep in touch with", "face-to-face", "group chat"],
          model: "[A] I use online platforms many times every day, but I still have a lot of face-to-face communication. [R] At university, I see my classmates and roommate in person all the time. But my family and old friends live in another city, so with them I mostly communicate online. [E] For example, I write in my class **group chat** to organize study sessions, I email my professors, and I text my mom every day. But I also have lunch with friends every day and go out on weekends. [C] So I'd say it's about half online and half **face-to-face**.",
          model5: "[A] Online platforms are part of my day from morning to night, yet face-to-face communication still makes up a substantial part of my life. [R] On campus, I see classmates and my roommate in person constantly, whereas my family and school friends live in another city, so with them almost everything happens online. [E] On a typical day, for instance, I coordinate study sessions in our class **group chat**, email a professor or two and exchange messages with my mother. At the same time, I have lunch with friends daily and spend weekends with them in person. [C] So I'd estimate my communication is roughly half online and half **face-to-face**, with distance being the deciding factor." },
        { q: "Some people feel that texting and messaging apps make it easier to stay connected—especially over long distances. Others feel that digital communication can be shallow or less personal. What's your opinion? Do you think online messaging strengthens your relationships, or do you feel it lacks something important?",
          lx: ["shallow", "keep in touch", "voice message"],
          model: "[A] I think messaging helps my relationships, but it lacks something important — real emotion. [R] It's easy to send a quick message every day, so I feel close to people who are far away. But short texts and emojis can't show real feelings, and it's easy to hide how you really are. [E] For example, I message my grandmother every week, and it makes her happy. But once, she wrote that everything was fine, and when I called her, I could hear in her voice that she was sad and lonely. [C] So I use messages for everyday contact, but calls for real conversations.",
          model5: "[A] Messaging certainly strengthens my relationships, though it lacks one crucial ingredient: genuine emotional nuance. [R] Because it's so effortless, it allows regular contact that would otherwise be impossible across distance. Yet brief texts and emojis make it remarkably easy to hide how we really feel, which can make communication feel **shallow**. [E] I message my grandmother weekly, for instance, which she loves. Once, though, she wrote that everything was fine, but when I called her that evening, I could hear immediately in her voice that she was lonely and low. That conversation mattered far more than any text could have. [C] So I rely on messages for everyday connection, but I pick up the phone whenever it really counts." },
        { q: "Have you ever experienced confusion or miscommunication in a text or email? If so, how did you handle it—and are there things you do now to make sure your messages are understood clearly?",
          lx: ["misread the tone", "clear things up", "proofread"],
          model: "[A] Yes, once I had a miscommunication with a professor because of an email. [R] I wrote too quickly and too informally, and my message sounded rude, even though I didn't mean it. [E] For example, I asked for a deadline extension and wrote just: \"I need more time for the essay. Can I send it next week?\" The professor replied very coldly. I wrote a second email, apologized, explained my situation politely, and she agreed. Now I always read important emails twice and start with a polite greeting. [C] So I learned that clear and polite writing really matters.",
          model5: "[A] I have, most memorably with a professor. [R] I'd dashed off an email far too quickly and informally, so a request I considered perfectly reasonable came across as demanding. [E] Asking for a deadline extension, for instance, I wrote simply, \"I need more time for the essay. Can I send it next week?\" Her reply was noticeably cool. I immediately sent a second, properly worded email, apologizing for my tone and explaining my circumstances, and she agreed to the extension. Since then, I always **proofread** important emails, open with a polite greeting and ask myself how the message would sound if I received it. [C] So that small embarrassment taught me that, in writing, tone is something you have to build deliberately." },
        { q: "With the rise of video calls and virtual meetings, many parts of our lives—like school, work, and even medical appointments—have moved online. Do you think video communication will continue to grow and become a normal part of everyday life in the future? Why or why not?",
          lx: ["video call", "convenient", "face-to-face"],
          model: "[A] Yes, I think video communication will keep growing, but it won't replace everything. [R] Video calls save time and money, and they make it possible to talk to anyone, anywhere. But for some things, like serious medical exams or close friendships, people still need to meet in person. [E] For example, last year I had a doctor's appointment by **video call** for a simple question about my medicine, and it took ten minutes instead of two hours. My parents also have video calls with my grandmother every week. But for a real health check, you still need to see the doctor. [C] So video will be normal, but not for everything.",
          model5: "[A] I'm confident it will keep growing and become an entirely normal part of life, though it won't replace in-person contact altogether. [R] Video calls save enormous amounts of time and money and make expertise accessible regardless of distance. However, some situations — physical examinations, difficult conversations, or simply building trust — still require being in the same room. [E] Last year, for instance, I had a **video call** with a doctor about a simple question regarding my medication, and it took ten minutes instead of the usual two-hour round trip. My grandmother, meanwhile, now sees her grandchildren weekly on screen. Yet for a proper check-up, nothing replaces an actual visit. [C] So video will become the default for convenience, while in-person contact becomes the choice for what matters most." }
      ]},
    { id: "smp", badge: "platform", title: "Mobile Phone Use", src: "Практика платформы",
      scenario: "I'm conducting a study on how mobile phones are used in everyday life and the effects they have on people's routines and well-being. I'd like to ask you a few questions.",
      questions: [
        { q: "To start, how much time do you typically spend on your phone during an average day? And what kinds of activities do you use it for most—messaging, social media, work, entertainment, or something else?",
          lx: ["screen time", "spend time on", "scroll through"],
          model: "[A] I spend about four hours a day on my phone. [R] My phone is my calendar, my bank, my map and my way to talk to friends, so I use it for many different things. But part of the time is just entertainment. [E] For example, my **screen time** report shows that I use messaging apps for about an hour, social media for an hour and a half, and the rest is for maps, music, banking and study apps. Most of the social media time is in the evening, when I'm tired. [C] So my phone is useful, but I could use it less in the evenings.",
          model5: "[A] My phone tells me I average about four hours a day, which is somewhat more than I'd like. [R] It serves as my calendar, wallet, map and main channel for staying in touch, so a fair share of that time is genuinely useful; the rest, admittedly, is entertainment. [E] According to my **screen time** report, for instance, roughly an hour goes on messaging and around ninety minutes on social media, with the remainder spread across maps, music, banking and study apps. Tellingly, most of the social media time is concentrated in the evenings, when I'm tired and least able to resist **scrolling**. [C] So my phone is undeniably useful, but the evening hours are where I could reclaim a lot of time." },
        { q: "How do you feel when you're away from your phone—either by choice or when you forget it? Does it make you feel anxious, free, or something else? Why do you think that is?",
          lx: ["screen time", "anxiety", "take a break from"],
          model: "[A] At first I feel anxious, but after an hour I feel free and relaxed. [R] I'm used to checking my phone all the time, so without it I'm afraid I'll miss something important. But then I realize nothing bad happens. [E] For example, last month I forgot my phone at home for a whole day. In the morning, I kept reaching into my pocket. But by the afternoon, I was really enjoying my lecture and lunch with friends, and I noticed things around me I usually miss. [C] So my phone gives me anxiety and being without it gives me freedom.", model5: "[A] Initially I feel uneasy, but surprisingly quickly that turns into a sense of freedom. [R] I'm so used to checking my phone constantly that its absence triggers a nagging fear of missing something important. Once I realize that nothing terrible happens, however, the **anxiety** gives way to relief. [E] Last month, for example, I left my phone at home for an entire day. All morning, I kept instinctively reaching for my pocket, but by the afternoon I was fully absorbed in a lecture and a long, uninterrupted lunch with friends, noticing details I'd normally scroll past. [C] Ironically, it seems the phone creates much of the anxiety it promises to relieve." },
        { q: "Many of today's apps are designed to catch your attention and keep you scrolling or tapping. Some people see their phone as a helpful tool for staying connected and productive, while others say it's a major source of distraction and even stress. Where do you fall on that spectrum? Do you think smartphones make life easier overall, or do they sometimes get in the way of being present?",
          lx: ["distraction", "attention span", "stay focused"],
          model: "[A] I think smartphones make life easier, but they also take away a lot of our attention. [R] My phone helps me organize everything — my calendar, reminders, maps and messages. But social media apps are designed to keep us scrolling, and it's very easy to lose an hour. [E] For example, I once checked my screen time and saw that I spent four hours a day on my phone, mostly on short videos. After that, I deleted two apps and turned off notifications. Now I use it about two hours a day and feel calmer. [C] So phones are useful tools, but only if we control them.", model5: "[A] Overall, smartphones make life easier, but they come at a real cost to our attention. [R] My phone is essentially my organizer, holding my calendar, reminders and maps. Many apps, however, are deliberately designed to keep us scrolling, so it's remarkably easy to lose an hour without noticing. [E] When I first checked my screen time, for instance, I was shocked to see I averaged four hours a day, mostly on short videos. I deleted two apps and switched off most notifications, and within a month my daily usage had halved, while I felt noticeably calmer and more present with friends. [C] So phones are excellent servants but terrible masters." },
        { q: "Some people believe schools, workplaces, or even governments should do more to help people develop healthier digital habits—like setting limits or promoting phone-free spaces. Do you think society should play a role in helping people manage their screen time more effectively? Why or why not, and what kind of support or change would you find helpful?",
          lx: ["screen time", "attention span", "self-discipline"],
          model: "[A] I think society can help, but mostly through education, not strict rules. [R] Many apps are designed to keep us scrolling, so it's not fair to say it's only a personal problem. But adults don't like being controlled. [E] For example, my university created a phone-free study room, and it's always full, because people want help to focus. I also think schools should teach children how social media works and how to set limits. But I don't want the government to decide how many hours I use my phone. [C] So I support phone-free spaces and education, not bans.", model5: "[A] I believe society has a role to play, though more through support and education than through restrictions. [R] Since many apps are deliberately engineered to be addictive, treating excessive screen time purely as a matter of personal willpower seems unfair. At the same time, adults rightly resist being told how to live. [E] My university, for instance, opened a phone-free study room last year, and it's permanently full, which suggests people actively want help to focus. Similarly, I think schools should teach children how algorithms capture their attention. A government-imposed time limit for adults, however, would feel intrusive. [C] So phone-free spaces and digital literacy, yes; bans, no." }
      ]},
    { id: "srt", badge: "platform", title: "The Role of Technology", src: "Практика платформы",
      scenario: "We're exploring how people use and think about technology in their daily lives. I'll ask you a few questions.",
      questions: [
        { q: "To start with, what types of technology do you use most often during a typical day?",

          model: "[A] I mostly use my smartphone and my laptop, and also some smart devices at home. [R] My phone helps me with communication and everyday tasks, and my laptop is for studying. [E] For example, I use my phone for messages, maps, music and paying for things. My laptop is for online lectures, writing essays and research. I also use wireless headphones every day and a smartwatch that counts my steps and reminds me about my classes. [C] So technology is with me from morning to night.",
          model5: "[A] My smartphone and laptop dominate my day, supported by a few smaller **devices**. [R] Broadly speaking, my phone handles communication and everyday logistics, while my laptop is essentially my workplace. [E] On my phone, for instance, I message friends, navigate the city, listen to music and pay for almost everything; on my laptop, I attend lectures, write essays and research assignments. On top of that, my wireless headphones are practically attached to my ears, and my smartwatch counts my steps and nudges me ten minutes before each class. [C] So technology accompanies me from the moment I wake up until I fall asleep, often without my even noticing it." },
        { q: "Many people believe that technology makes our lives more convenient and efficient. Others think it can be distracting and lead to overdependence. How do you feel about your own use of technology? Do you see it as more helpful or more harmful in your daily routine?",
          lx: ["overreliance", "distraction", "a double-edged sword"],
          model: "[A] For me, technology is more helpful than harmful, but I know I depend on it too much. [R] It saves me a lot of time every day and helps me study and stay in contact with people. But sometimes it distracts me, and I feel lost without it. [E] For example, apps help me plan my week, pay bills in seconds and learn languages. But when my phone died during a trip last month, I couldn't find my hotel or call anyone, and I felt completely helpless. [C] So technology helps me a lot, but I should learn to manage without it sometimes.",
          model5: "[A] On balance, it's far more helpful than harmful in my routine, although I'm aware of a worrying degree of **overreliance**. [R] It saves me hours every week, supports my studies and keeps me connected, yet it can also be a serious **distraction**, and I've lost some basic self-sufficiency along the way. [E] Apps let me plan my week, pay bills in seconds and practice Spanish on the bus, for instance. But when my phone battery died during a trip last month, I couldn't find my hotel, call anyone or even pay for a taxi, and I felt surprisingly helpless. [C] So technology is clearly **a double-edged sword**, and that episode convinced me to keep a few low-tech skills alive." },
        { q: "Some people argue that the constant presence of smartphones and social media is changing the way we communicate. Do you think these changes are mostly positive or mostly negative? Why?",
          lx: ["face-to-face interaction", "attention span", "keep in touch"],
          model: "[A] I think the changes are both positive and negative, but slightly more negative. [R] On the positive side, we can communicate with anyone, anywhere, instantly. On the negative side, people talk less face-to-face, write shorter messages and pay less attention to each other. [E] For example, my grandparents wrote long letters to each other when they were young, and they still keep them. Today, my friends and I send hundreds of short messages and emojis every day, but we rarely have long, deep conversations. And when we meet, everyone checks their phones. [C] So we communicate more, but not always better.",
          model5: "[A] I'd describe them as mixed, though slightly more negative than positive. [R] On the plus side, we can now reach anyone, anywhere, instantly, which has transformed long-distance relationships. On the minus side, communication has become faster but shallower, and our **attention spans** in conversation seem to be shrinking. [E] My grandparents, for instance, exchanged long, thoughtful letters during their engagement, which they still treasure. My friends and I, by contrast, exchange hundreds of fragments and emojis every day, yet rarely have genuinely deep conversations, and when we do meet, phones inevitably interrupt. [C] So we're communicating more than ever, but not necessarily better, and the challenge is to use technology to enrich conversation rather than replace it." },
        { q: "As technology continues to evolve, governments and communities are discussing how to ensure equal access to digital tools and internet connectivity. Do you think ensuring digital access for everyone is important? Why or why not?",
          lx: ["digital divide", "access", "fall behind"],
          model: "[A] Yes, I think ensuring digital access for everyone is very important. [R] Today, you need the internet for school, work, banking and even seeing a doctor. People without access **fall behind** and have fewer opportunities. [E] For example, during the pandemic, all classes moved online, and some students in my brother's school didn't have a laptop or good internet. They missed many lessons, and their grades went down. The city later gave free tablets to these students, which helped a lot. [C] So internet access is not a luxury anymore; it's a basic need.",
          model5: "[A] I believe it's essential; internet access has effectively become a basic necessity. [R] Education, employment, banking and even healthcare increasingly assume that everyone is online, so those without reliable access inevitably **fall behind**, and the **digital divide** deepens existing inequalities. [E] During the pandemic, for instance, when all classes moved online, several students at my brother's school had no laptop and only a weak mobile connection. They missed lesson after lesson, and their grades suffered noticeably until the city distributed free tablets and data packages. [C] So guaranteeing digital access isn't about luxury; it's about giving everyone a fair chance to participate in modern society." }
