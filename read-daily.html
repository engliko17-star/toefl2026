<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read in Daily Life — TOEFL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 px-4 py-6 h-screen sticky top-0">
        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span><span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>
        <nav class="flex-1 space-y-1">
            <a href="index.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition"><i data-lucide="home" class="w-5 h-5"></i><span class="text-sm font-medium">Dashboard</span></a>
            <a href="vocabulary.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition"><i data-lucide="book-open" class="w-5 h-5"></i><span class="text-sm font-medium">Vocabulary</span></a>
            <div class="pt-6 pb-2 px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider">Practice</div>
            <a href="reading.html" class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900 text-white font-medium shadow-sm"><i data-lucide="book-text" class="w-5 h-5"></i><span class="text-sm">Reading</span></a>
        </nav>
    </aside>

    <main class="flex-1 p-6 overflow-y-auto bg-[#f8f9fa] pb-24 md:pb-6">
        <div class="max-w-4xl mx-auto">
            <a href="reading.html" class="inline-flex items-center text-xs font-bold text-gray-400 hover:text-indigo-600 mb-6 transition uppercase tracking-wider">
                <i data-lucide="arrow-left" class="w-3 h-3 mr-1"></i> Back to Reading
            </a>

            <div class="mb-8 flex items-end justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Read in Daily Life</h1>
                    <p class="text-sm text-gray-500 mt-1">Short passages from everyday situations. Select a test to practice.</p>
                </div>
            </div>

            <div id="testList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p id="loadingMsg" class="text-sm font-medium text-gray-500">Loading tests from database...</p>
            </div>
        </div>
    </main>

    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around py-2 z-40">
        <a href="index.html" class="flex flex-col items-center text-gray-400"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[9px] mt-1 font-medium">Home</span></a>
        <a href="reading.html" class="flex flex-col items-center text-slate-900"><i data-lucide="book-text" class="w-5 h-5"></i><span class="text-[9px] mt-1 font-bold">Reading</span></a>
    </nav>

    <script>
        lucide.createIcons();

        const testListContainer = document.getElementById('testList');
        const loadingMsg = document.getElementById('loadingMsg');

        const mockDailyTests = [
            { id: 1, title: "Library Notice & Room Booking", category: "Daily Life", questions_count: 4 },
            { id: 2, title: "Online Shopping Habits", category: "Daily Life", questions_count: 3 },
            { id: 3, title: "Campus Cafeteria Changes", category: "Daily Life", questions_count: 3 }
        ];

        // 1. Функция получения безопасного клиента базы данных
        function getDatabaseClient() {
            if (typeof supabaseClient !== 'undefined') return supabaseClient;
            if (typeof window !== 'undefined' && window.supabaseClient) return window.supabaseClient;
            
            const fallbackUrl = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
            const fallbackKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
            return window.supabase.createClient(fallbackUrl, fallbackKey);
        }

        const db = getDatabaseClient();
        let currentUser = null;

        // 2. Инициализация страницы и проверка авторизации
        async function initPage() {
            try {
                if (typeof requireAuth !== 'function') {
                    throw new Error("Функция requireAuth не найдена. Убедитесь, что auth.js подключен.");
                }
                currentUser = await requireAuth();
                if (currentUser) {
                    await loadTests();
                }
            } catch (err) {
                console.error("Initialization error:", err);
                if (loadingMsg) {
                    loadingMsg.innerHTML = `<span class="text-red-600 font-bold">Authorization required.</span> Please log in.`;
                }
            }
        }

        // 3. Безопасный сброс результатов повседневного теста в базе данных
        window.resetDailyTest = async function(id, title) {
            if (!currentUser || !db) return;
            
            if (confirm(`Are you sure you want to reset the results for "${title}"?`)) {
                try {
                    // Удаляем запись из таблицы результатов именно для этого пользователя и типа 'daily'
                    const { error } = await db
                        .from('reading_results')
                        .delete()
                        .eq('task_id', id)
                        .eq('task_type', 'daily')
                        .eq('user_id', currentUser.id);

                    if (error) throw error;
                    
                    await loadTests(); // Перезагружаем карточки тестов на экране
                } catch (err) {
                    console.error("Error resetting daily test:", err.message);
                    alert("Failed to reset progress. Please try again.");
                }
            }
        };

        // 4. Загрузка тестов и сопоставление с личными результатами
        async function loadTests() {
            try {
                let tests = [];
                let userResults = {}; // Будем складывать сюда результаты вида { task_id: { score_earned, score_total } }

                if (db) {
                    // Шаг А: Тянем список всех доступных тестов daily
                    const { data: tasksData, error: tasksError } = await db
                        .from('daily_life_tasks')
                        .select('id, title, category, questions_count')
                        .order('id', { ascending: true });
                    
                    if (!tasksError && tasksData && tasksData.length > 0) {
                        tests = tasksData;
                    } else {
                        tests = mockDailyTests;
                    }

                    // Шаг Б: Тянем результаты только текущего авторизованного пользователя
                    if (currentUser) {
                        const { data: resultsData, error: resultsError } = await db
                            .from('reading_results')
                            .select('task_id, score_earned, score_total')
                            .eq('user_id', currentUser.id)
                            .eq('task_type', 'daily');

                        if (!resultsError && resultsData) {
                            // Сохраняем в объект для быстрого O(1) поиска при рендере карточек
                            resultsData.forEach(res => {
                                userResults[res.task_id] = res;
                            });
                        }
                    }
                } else {
                    tests = mockDailyTests;
                }

                testListContainer.innerHTML = '';

                // Шаг В: Отрисовка карточек
                tests.forEach(test => {
                    const matchedResult = userResults[test.id];
                    let savedScore = null;

                    // Если результат в БД есть, высчитываем процент правильных ответов
                    if (matchedResult && matchedResult.score_total > 0) {
                        savedScore = Math.round((matchedResult.score_earned / matchedResult.score_total) * 100);
                    }

                    let actionButton = '';
                    let scoreDisplay = '';

                    if (savedScore !== null) {
                        const scoreNum = savedScore;
                        
                        let strokeColor = 'stroke-emerald-500';
                        if (scoreNum < 50) strokeColor = 'stroke-rose-500';
                        else if (scoreNum < 75) strokeColor = 'stroke-amber-500';

                        scoreDisplay = `
                            <div class="relative flex items-center justify-center w-10 h-10 shrink-0">
                                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                    <path class="stroke-slate-100" stroke-width="3" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path class="${strokeColor} transition-all duration-500" stroke-width="3" stroke-dasharray="${scoreNum}, 100" stroke-linecap="round" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <span class="absolute text-[10px] font-black text-slate-800">${scoreNum}%</span>
                            </div>
                        `;

                        actionButton = `
                            <a href="read-daily-task.html?id=${test.id}&mode=review" class="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-100 px-4 py-2 rounded-xl hover:bg-emerald-100 transition flex items-center justify-center w-full mt-auto shadow-xs">
                                Review Results <i data-lucide="eye" class="w-3.5 h-3.5 ml-1.5"></i>
                            </a>
                        `;
                    } else {
                        scoreDisplay = `
                            <span class="text-[9px] font-bold text-emerald-600 uppercase tracking-widest bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100/40">
                                ${test.category || 'Daily Life'}
                            </span>
                        `;

                        actionButton = `
                            <a href="read-daily-task.html?id=${test.id}" class="text-xs font-bold text-white bg-slate-900 px-4 py-2 rounded-xl hover:bg-emerald-600 transition flex items-center justify-center w-full mt-auto shadow-sm">
                                Start Practice <i data-lucide="arrow-right" class="w-3.5 h-3.5 ml-1.5"></i>
                            </a>
                        `;
                    }

                    // Экранирование кавычек для передачи параметров в onClick
                    const escapedTitle = test.title.replace(/'/g, "\\'").replace(/"/g, '\\"');

                    testListContainer.innerHTML += `
                        <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col group hover:border-emerald-200 hover:shadow-md transition relative overflow-hidden">
                            <div class="flex justify-between items-start mb-4">
                                ${savedScore !== null ? `
                                    <div class="flex flex-col">
                                        <span class="text-[9px] font-bold text-emerald-600 uppercase tracking-widest bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100/40 self-start mb-1">${test.category || 'Daily Life'}</span>
                                        <div class="flex items-center space-x-2 mt-0.5">
                                            <span class="text-[10px] font-bold text-emerald-600 flex items-center"><i data-lucide="check" class="w-3 h-3 mr-0.5"></i> Completed</span>
                                            <button onclick="resetDailyTest(${test.id}, '${escapedTitle}')" class="text-gray-400 hover:text-rose-500 transition p-0.5 rounded-md hover:bg-gray-50" title="Reset results">
                                                <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                                            </button>
                                        </div>
                                    </div>
                                ` : scoreDisplay}
                                
                                <div class="flex items-center space-x-2">
                                    ${savedScore !== null ? scoreDisplay : ''}
                                    <span class="text-[10px] font-medium text-gray-400 bg-gray-50 px-1.5 py-0.5 rounded-md border border-gray-100">Test #${test.id}</span>
                                </div>
                            </div>
                            
                            <h3 class="text-sm font-bold text-slate-900 mb-1 group-hover:text-emerald-600 transition tracking-tight">${test.title}</h3>
                            <p class="text-[11px] text-gray-500 mb-5">${test.questions_count || 4} Questions • 1 answer type</p>
                            
                            ${actionButton}
                        </div>
                    `;
                });
                lucide.createIcons();

            } catch (err) {
                if (loadingMsg) {
                    loadingMsg.innerHTML = `<span class="text-red-600 font-bold">System Error:</span> ${err.message}`;
                }
            }
        }

        // Запуск проверки и рендера
        initPage();
    </script>
</body>
</html>
