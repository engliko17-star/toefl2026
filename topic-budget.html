    { en: "trade-off", pos: "n", ru: "компромисс: что-то получаешь, чем-то жертвуешь", ex: "Living off campus is cheaper, but the trade-off is a long commute.", level: "adv" },
    { en: "delayed gratification", pos: "n", ru: "отложенное удовольствие", ex: "Saving money is really all about delayed gratification.", level: "adv" },
    { en: "recurring costs", pos: "n", ru: "регулярные, повторяющиеся расходы", ex: "I underestimated how fast recurring costs like phone bills add up.", level: "adv" },
    { en: "emergency fund", pos: "n", ru: "подушка безопасности", ex: "Even a small emergency fund can save you a lot of stress.", level: "adv" },
    { en: "budget-conscious", pos: "adj", ru: "следящий за бюджетом, экономный", ex: "Budget-conscious students usually buy second-hand textbooks.", level: "adv" }

      { en: "_keep track of_ your spending", ru: "отслеживать свои траты", ex: "Banking apps help you keep track of your spending." }

  idioms: [

      scenario: "You have signed up for a study run by a university research group that is investigating spending habits and budgeting. You will have a short video interview with one of the researchers.",
      questions: [
        { q: "Can you tell me about a recent purchase you or someone in your family made and why you decided to buy it?", model5: "[A] The most recent purchase I'm genuinely proud of is a second-hand bike I bought this semester. [R] I'd been spending a surprising amount on bus tickets and the occasional taxi, and once I added it all up, it was obvious those **small purchases** were quietly **adding up**. [E] So, rather than buying a new bike, I **shopped around** online for a couple of weeks and eventually found one in excellent condition for roughly a third of the retail price. Not only do I save money on transport now, but I also get some exercise without having to think about it. [C] All things considered, it's a purchase that has more than paid for itself — I'm definitely **getting my money's worth**.",
          lx: ["shop around", "small purchases add up", "get my money's worth"],
          model: "[A] Recently I bought a second-hand bike, and honestly, it's one of the best decisions I've made this semester. [R] I was spending a lot on bus tickets and the occasional taxi, and those **small purchases** were really **adding up**. [E] So I **shopped around** online for a couple of weeks, compared prices, and found a used bike in great condition for about a third of the price of a new one. Now I ride it to campus every day, so I'm saving money and getting some exercise at the same time. [C] So it was a practical purchase, and I'm definitely **getting my money's worth**." },
        { q: "When you make a purchase, do you usually plan ahead, or do you buy things spontaneously? Why?", model5: "[A] It really depends on the price: with anything substantial I plan carefully, whereas with small things I tend to be more spontaneous. [R] When I'm about to spend a lot, I want to be sure the item is genuinely worth it, so I compare reviews and **set aside** money for a few months beforehand. [E] Small purchases are a different story. Just last week, for instance, I picked up a notebook I didn't actually need, simply because the design caught my eye at the checkout. Admittedly, it's those little decisions that slip past my usual caution. [C] In short, I'm disciplined about big purchases, but my **impulse purchases** are still a work in progress.",
          lx: ["plan ahead", "set aside", "impulse purchase"],
          model: "[A] For bigger things, I definitely plan ahead, but for small things I'm a bit more spontaneous. [R] If something is expensive, like a phone or a laptop, I want to make sure it's worth the money, so I read reviews and **set aside** money for a few months. [E] But with small things — snacks, coffee, a book I see in a store — I sometimes buy on a whim. Last week, for example, I bought a notebook I didn't really need just because the design was nice. [C] So I'd say I'm careful with big purchases, but I'm still working on my **impulse purchases**." },
        { q: "Some people believe that creating a monthly or weekly budget is essential for managing finances effectively. When budgeting for your next purchase, which is more important: quality for the money or spending less overall? Why?", model5: "[A] For me, getting quality for the money matters far more than simply spending less. [R] If you always go for the cheapest option, you often end up paying twice, because low-quality products tend to wear out quickly. **In the long run**, a well-made product usually turns out to be the more **budget-friendly option**. [E] Shoes are a perfect example. I used to buy cheap sneakers every few months, but last year I finally **splurged** on a decent pair, and they still look almost new. [C] **That said**, quality isn't the same as the most expensive brand — what I'm really after is the best value, not the highest price tag.",
          lx: ["value for money", "budget-friendly option", "in the long run"],
          model: "[A] For me, quality for the money is more important. [R] When you always choose the cheapest option, you often end up paying twice, because cheap things break quickly. **In the long run**, a good product is actually the more **budget-friendly option**. [E] Take shoes, for example. I used to buy cheap sneakers every few months, but last year I **splurged** on a good pair, and they still look new. [C] **That said**, quality doesn't always mean the most expensive brand — it's about finding the best value, not the highest price." },
        { q: "Do you think people will increasingly rely on financial apps and online tools to manage their money, or will people prefer to hire personal financial managers? Explain your thoughts.", model5: "[A] I'm fairly convinced that people will rely more and more on apps rather than personal financial managers. [R] For one thing, most apps are free or very cheap, whereas a professional advisor is something the majority of young people simply **can't afford**. What's more, apps let you **keep track of your spending** in real time. [E] My own banking app, for example, automatically sorts every purchase into categories, which is how I discovered I was spending a ridiculous amount on food delivery. [C] Having said that, when it comes to major decisions like buying a home, I suspect many people will still want the reassurance of a human expert.",
          lx: ["afford", "keep track of your spending", "that said"],
          model: "[A] I think people will rely more and more on apps. [R] First of all, apps are free or very cheap, while a personal financial manager is something most young people simply **can't afford**. Apps also make it easy to **keep track of your spending** in real time. [E] For example, my banking app automatically sorts my purchases into categories, so I can see right away that I spend too much on food delivery. [C] **That said**, for really big decisions, like buying a home, I think many people will still want advice from a real human expert." }
      ]},
    { id: "s120", badge: "official", title: "Personal Finances", src: "Official TOEFL · 120",
      scenario: "As part of a university research project, you have agreed to take part in a short interview about personal finances. A graduate student conducting the research will ask you some questions.",
      questions: [
        { q: "To start off, do you typically keep a budget for your expenses, or do you manage them informally?", model5: "[A] I'd say I keep a budget, though it's far more relaxed than a spreadsheet would suggest. [R] **Living on a tight budget**, I genuinely need to know where my money goes, but tracking every single coffee felt exhausting and, frankly, counterproductive. [E] What works for me instead is a simple rule: on the first of the month, I **set aside** money for rent, transport and groceries, and whatever's left is mine to spend freely. Last month, that rule stopped me from **going over budget** when friends suggested a spontaneous weekend trip — I could see instantly that it wasn't affordable. [C] In other words, it's a light system, but it gives me real peace of mind.", model: "[A] I keep a simple budget, but it's not very strict. [R] As a student on a **tight budget**, I need to know where my money goes, but I really hate spreadsheets. [E] So at the start of each month I write down my fixed costs — rent, phone, transport — and I **set aside** a fixed amount for food. Whatever is left is for fun. Last month, that system stopped me from **going over budget** when my friends planned an expensive weekend trip. [C] So it's a light budget, but it really keeps me on track.", lx: ["draw up a budget", "keep track of", "go over budget"] },
        { q: "Everyone has different spending habits. Who or what would you say most influences the way you make money-related choices? Your family, your friends, or your own experience? Why?", model5: "[A] Without a doubt, my mother has shaped my money habits more than anyone else. [R] Having raised three children on a single salary, she's remarkably **thrifty** and always thinks two steps ahead. [E] When I was a teenager, she gave me a monthly **allowance** with one firm rule: if I spent it all in the first week, I'd simply have to wait. I only made that mistake once, and it taught me to budget faster than any lecture could have. Even now, whenever I'm tempted by something expensive, I can almost hear her asking whether I really need it. [C] It's fair to say that most of my financial instincts come straight from her.", model: "[A] I'd say my mom has influenced me the most. [R] She raised three kids on one salary, so she's incredibly **thrifty** and always plans ahead. [E] When I was a teenager, she gave me a monthly **allowance** and told me that if I spent it all in the first week, I'd simply have to wait. That happened to me exactly once — I learned to budget very quickly. Even now, before I buy something big, I hear her voice asking, 'Do you really need it?' [C] So most of my money habits come straight from her.", lx: ["influence", "thrifty", "budget-conscious"] },
        { q: "If you were to receive extra money, like as a gift, how would you decide what to do with it? For instance, would you spend it or save it, and why?", model5: "[A] My instinct would be to save the larger part and allow myself to enjoy a smaller portion. [R] I've learned the hard way that unexpected expenses tend to appear at the worst possible moment, so **saving for a rainy day** always comes first. **That said**, I don't believe in treating every dollar as untouchable. [E] When my grandparents gave me two hundred dollars for my birthday, for instance, I put three quarters of it into my **emergency fund** and used the rest to **splurge** on a concert ticket I'd been eyeing for months. I didn't feel the slightest bit guilty, precisely because most of it was safe. [C] Saving the bulk and enjoying the remainder strikes the right balance for me.", model: "[A] I'd probably save most of it and spend a small part. [R] My rule is to **save for a rainy day** first, because unexpected expenses always come up when you least expect them. [E] For example, when my grandparents gave me two hundred dollars for my birthday, I put one hundred fifty into my **emergency fund** and used the rest to **splurge** on a concert ticket. I didn't feel guilty at all, because I knew most of it was safe. [C] So my approach is simple: save the bigger part, enjoy the smaller part.", lx: ["save for a rainy day", "splurge", "emergency fund"] },
        { q: "Some experts believe that personal finance should be something that schools teach to prepare young people for future money management. Do you agree or disagree with this idea? What impact do you think it would have on students?", model5: "[A] I strongly agree, and I think the impact on students would be enormous. [R] It's striking that most teenagers graduate knowing how to solve equations but not how a loan or a credit card actually works, even though those are decisions they face almost immediately afterwards. [E] A friend of mine got her first credit card at eighteen and, without anyone explaining how interest works, **racked up** nearly two thousand dollars of **debt** within a year. Had she taken even a short course, she could easily have avoided that. [C] Ultimately, basic **financial literacy** would spare students a lot of costly mistakes and make them far more confident **in the long run**.", model: "[A] I strongly agree with this idea. [R] Most teenagers finish school knowing algebra but not knowing how a loan or a credit card works, and those are decisions they make right after graduation. [E] A friend of mine got her first credit card at eighteen and **racked up** almost two thousand dollars of **debt** in one year, just because nobody had explained interest to her. [C] So a basic **financial literacy** course would help students avoid expensive mistakes and feel much more confident **in the long run**.", lx: ["financial literacy", "rack up debt", "in the long run"] }
      ]},
    { id: "s113", badge: "official", title: "Financial Planning", src: "Official TOEFL · 113",
      scenario: "You have volunteered for a research study about people's experiences with financial planning. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, do you currently have a financial plan or budget that you follow?", model5: "[A] I do, although I'd describe it as a fairly basic plan rather than anything sophisticated. [R] Since this is my first time living independently, I need some structure; otherwise, I'd almost certainly **run out of money** before the end of the month. [E] I rely on a free app in which I set spending limits for each category — groceries, transport, eating out — and whenever I get close to one of them, it sends me a notification. That's my cue to **tighten my belt** for a few days. On top of that, I **set aside** a small amount every month for a new laptop. [C] It's hardly a detailed financial plan, but it keeps me consistently on track.", model: "[A] Yes, I do, although it's a pretty simple plan. [R] I'm living on my own for the first time, so I need some structure to avoid **running out of money** before the end of the month. [E] I use a free app where I set limits for each category — groceries, transport, eating out. When I get close to a limit, the app sends me a notification, and I know it's time to **tighten my belt**. I also **set aside** a little every month for a new laptop. [C] So it's not a detailed financial plan, but it works for me.", lx: ["stick to a budget", "tight budget", "set aside"] },
        { q: "If you could design the ideal way of managing your money, what would it look like?", model5: "[A] My ideal system would run almost entirely on its own. [R] Most people, myself included, simply don't have the discipline to log every purchase, so the less effort it requires, the more likely it is to work. [E] On payday, for instance, a fixed percentage would be transferred into savings automatically, another portion would cover my bills, and only what remained would go into a spending account. Ideally, an app would also flag any **subscription** I'd forgotten about but was still paying for. [C] In that kind of system, the tedious part takes care of itself, and I could enjoy my **disposable income** without constantly worrying about it.", model: "[A] My ideal system would be almost completely automatic. [R] Most people, including me, don't have the discipline to track every coffee, so the less I have to think about it, the better. [E] For example, on payday a fixed part of my money would automatically go into savings, another part would pay my bills, and only the rest would go to my spending account. An app would also warn me if a **subscription** I never use is still charging me. [C] So in my ideal world, the boring part is automatic, and I just enjoy my **disposable income** without stress.", lx: ["automatically", "emergency fund", "keep track of"] },
        { q: "In your opinion, what are the most common obstacles people run into with financial planning?", model5: "[A] In my view, the biggest obstacle is the sheer unpredictability of life. [R] You can draw up a flawless plan, but the moment your phone breaks or you need to see a doctor, the whole thing can fall apart. Closely related to that are **impulse purchases** — small, seemingly harmless expenses that gradually eat into your budget. [E] I experienced this myself last semester, when my laptop needed an urgent repair; because I hadn't built up an **emergency fund**, I ended up having to borrow money from my parents. [C] What this taught me is that people rarely fail because planning is difficult — they fail because they don't plan for the unexpected.", model: "[A] I think the most common obstacle is unexpected expenses. [R] You can make a perfect plan, but then your phone breaks or you need to see a doctor, and the whole plan falls apart. Another big problem is **impulse purchases** — small things that seem harmless. [E] This happened to me last semester: my laptop needed a repair, and because I didn't have an **emergency fund**, I had to borrow money from my parents. [C] So I'd say people don't fail because planning is hard, but because life is unpredictable.", lx: ["unexpected expenses", "impulse purchase", "recurring costs"] },
        { q: "Some people believe that detailed financial planning is crucial for achieving long-term financial stability and goals. Do you agree or disagree with this belief? Why or why not?", model5: "[A] I agree that planning is essential, although I'd argue it doesn't need to be particularly detailed. [R] Without any plan at all, it's remarkably easy to **live beyond your means** and never save a cent. On the other hand, an overly rigid plan tends to be abandoned within weeks. [E] My older brother, for example, tried to record every single purchase in a spreadsheet, and after a month he was so fed up that he stopped budgeting altogether. These days he follows just a handful of simple rules, which has proven far more effective. [C] In my opinion, a simple plan you actually **stick to** is worth much more than a perfect one you give up on.", model: "[A] I agree that planning is crucial, but I don't think it has to be very detailed. [R] Without any plan, it's easy to **live beyond your means** and never save anything. **That said**, if a plan is too strict, people usually give up after a few weeks. [E] My older brother tried to record every single purchase in a spreadsheet, and after a month he got so tired of it that he stopped budgeting completely. Now he follows a few simple rules, and it works much better. [C] So a simple plan you actually **stick to** beats a perfect plan you abandon.", lx: ["financial stability", "in the long run", "trade-off"] }
      ]},
    { id: "s091", badge: "official", title: "Personal Finance", src: "Official TOEFL · 091 · в базе 3 вопроса",
      scenario: "You received an email from your university inviting you to join a research study about personal finance. You have scheduled a short online interview with a researcher.",
      questions: [
        { q: "Can you describe one or two methods you or someone you know uses to manage your finances? For example, do you use budgeting apps or keep a written record?", model5: "[A] My roommate and I manage our money in completely opposite ways. [R] I prefer apps because they're quick and automatic, whereas she likes to see everything on paper. [E] I use a banking app that sorts my purchases into categories, so I can tell at a glance when I'm overspending — usually on food delivery, I'm sorry to admit. My roommate, by contrast, keeps a small notebook and writes down every expense before going to bed. She claims that physically writing things down makes her think twice before buying anything. [C] Interestingly, both methods work equally well — what really matters is that you **keep track of your spending** consistently, whatever tool you use.", model: "[A] My roommate and I use two very different methods. [R] I prefer apps because they're quick, while she likes to see everything on paper. [E] I use a banking app that automatically sorts my purchases into categories, so I can see at a glance that I spend too much on food delivery. My roommate, on the other hand, keeps a small notebook and writes down every expense at the end of the day. She says writing it by hand makes her think twice before buying things. [C] Both methods work — the key is to **keep track of your spending** somehow.", lx: ["budgeting app", "keep track of your spending", "categories"] },
        { q: "Tell me about a financial goal you have achieved recently. What motivated you to achieve this goal?", model5: "[A] Recently, I managed to **save up for** a trip to visit my best friend, who moved abroad two years ago. [R] What kept me motivated was simply how much I missed her — we hadn't seen each other since she left. [E] Since the flight **cost an arm and a leg**, I gave myself six months. I **cut back on** eating out, sold clothes I'd never worn, and transferred a fixed amount into a separate account every payday so I wouldn't be tempted to touch it. When I finally booked the ticket, the sense of achievement was incredible. [C] The experience taught me that **delayed gratification** becomes surprisingly easy when the goal genuinely matters to you.", model: "[A] Recently I managed to **save up for** a trip to visit my best friend in another country. [R] I was motivated because we hadn't seen each other for two years, and I really missed her. [E] The flight **cost an arm and a leg**, so I gave myself six months. I **cut back on** eating out, sold some clothes I never wore, and **set aside** a fixed amount every payday. When I finally booked the ticket, I felt incredibly proud. [C] It taught me that **delayed gratification** is much easier when the goal really matters to you.", lx: ["save up for", "delayed gratification", "set aside"] },
        { q: "Some people believe that fiscal responsibility education should be mandatory in schools to help students manage money effectively as adults. Do you agree or disagree with this idea? Why?", model5: "[A] I firmly believe it should be mandatory. [R] Managing money is one of the few skills that everyone needs, regardless of their career, yet very few people are actually taught it at home. [E] In my country, for instance, it's common for young people to **take out loans** for phones or cars without fully understanding the interest, and many of them then spend years **paying those loans off**. A single practical course — covering how to **draw up a budget** and how credit really works — could prevent a great deal of that. [C] For that reason, I'd consider it one of the most valuable subjects a school could possibly offer.", model: "[A] I agree that it should be mandatory. [R] Managing money is a skill everyone needs, no matter what job they have, but very few people learn it at home. [E] In my country, for example, many young people **take out loans** for phones or cars without understanding the interest, and then they spend years **paying them off**. One practical course in high school — how to **draw up a budget**, how credit works — could prevent a lot of that. [C] So I think it would be one of the most useful subjects schools could offer.", lx: ["financial literacy", "required subject", "live beyond their means"] }
      ]},
    { id: "smock", badge: "mock", title: "How People Manage Money", src: "Mock-тест платформы",
      scenario: "You have agreed to participate in a research study about how people manage their money. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, do you usually plan a budget, or do you just spend as you go? Why?", model5: "[A] I used to spend as I went, but these days I always plan a budget. [R] When I first moved out, I had no plan whatsoever, and as a result, I kept **running out of money** a week before my **allowance** arrived. [E] One month, I literally survived on plain pasta for five days, which turned out to be exactly the wake-up call I needed. Ever since, I've drawn up a simple budget at the start of each month and reviewed it every Sunday evening. [C] For me, planning isn't about being restrictive or boring — it's about making sure I never have to eat plain pasta for a week again.", model: "[A] I used to spend as I went, but now I plan a budget. [R] When I first moved out, I had no plan at all, and I kept **running out of money** a week before my **allowance** arrived. [E] One month I literally had to live on pasta for five days, and that was my wake-up call. Since then, I **draw up a simple budget** at the start of every month and check it every Sunday. [C] So for me, planning isn't about being boring — it's about never eating plain pasta for a week again.", lx: ["spend as you go", "run out of money", "tight budget"] },
        { q: "Who has influenced the way you handle money the most, for example, a parent, a friend, or someone else? How did they influence you?", model5: "[A] Surprisingly, it was my best friend, rather than my parents, who influenced me the most. [R] My parents rarely talked about money, whereas my friend started working part-time at sixteen and was incredibly **budget-conscious** from the very beginning. [E] I still remember her showing me how she divided every paycheck: a portion for savings, a portion for fun, and a portion to help her family. At the time, I found it a little strange, but when I got my first job, I adopted her system almost exactly, and I've relied on it ever since. [C] Looking back, she taught me more about managing money than any adult or class ever did.", model: "[A] Surprisingly, my best friend influenced me more than my parents did. [R] My parents never really talked about money, but my friend started working part-time at sixteen and was very **budget-conscious**. [E] I remember she showed me how she divided her salary: some for savings, some for fun, and some to help her family. At first I thought it was strange, but when I got my first job, I copied her system almost exactly, and I've used it ever since. [C] So she taught me more about money than any class or adult did.", lx: ["influence", "set an example", "frugal"] },
        { q: "Some people believe that young people today are worse at saving money than earlier generations were. Do you agree or disagree? Why?", model5: "[A] I only partly agree, because I think the situation is more complicated than it seems. [R] Admittedly, young people today face far more temptations — online shopping, delivery apps and 'buy now, pay later' services, to name a few. At the same time, however, rent and **tuition** have risen dramatically, so saving is objectively much harder than it was for our parents. [E] My parents, for example, bought their first apartment in their twenties, whereas many people my age can barely cover their **recurring costs** and end up **living paycheck to paycheck**. [C] Rather than being worse with money, I'd say young people are living in a far more expensive world.", model: "[A] I partly agree, but I think it's more complicated than that. [R] It's true that young people today face more temptations — online shopping, delivery apps, 'buy now, pay later'. But at the same time, rent and **tuition** are much higher than they were for our parents, so it's simply harder to save. [E] My parents bought their first apartment in their twenties, while most people my age can barely cover their **recurring costs** and often **live paycheck to paycheck**. [C] So I'd say young people aren't worse with money — they just live in a much more expensive world.", lx: ["cost of living", "live paycheck to paycheck", "thrifty"] },
        { q: "Many people think that increasing use of credit cards and mobile payments will eventually replace cash entirely. Others believe that cash will always play a role in daily life. Which opinion do you agree with, and why?", model5: "[A] I'm inclined to think cards and mobile payments will replace cash almost completely, though not entirely. [R] Paying by phone is faster and far more convenient, and it makes it effortless to **keep track of your spending**. In fact, quite a few cafés in my city no longer accept cash at all. [E] **That said**, cash still matters to certain groups of people. My grandmother, for instance, doesn't trust banking apps and insists on paying for everything in cash. Moreover, whenever there's a power or internet outage, cash is the only payment method that still works. [C] I suspect cash will become increasingly rare, but I doubt it will ever disappear completely.", model: "[A] I think cards and mobile payments will replace cash almost completely, but not entirely. [R] Paying by phone is faster and more convenient, and it makes it easy to **keep track of your spending**. Many cafés in my city don't even accept cash anymore. [E] **That said**, cash is still important for some people — my grandmother, for example, doesn't trust apps and pays for everything in cash. And when the internet goes down, cash is the only thing that still works. [C] So cash will become rare, but I don't think it will ever disappear.", lx: ["cashless", "mobile payments", "keep track of"] }
      ]},
    { id: "sfh", badge: "platform", title: "Finance Habits", src: "Практика платформы",
      scenario: "We're exploring how people manage their personal finances and make decisions around budgeting and saving.",
      questions: [
        { q: "Do you regularly create a budget or track your spending in any way — whether that's through an app, a spreadsheet, or just mentally? Why or why not?", model5: "[A] Yes, I track my spending regularly, mainly through my banking app. [R] I did try using a spreadsheet at one point, but it was so time-consuming that I gave up within two weeks. The app, on the other hand, does everything automatically, which makes it much easier to **stick to**. [E] Every Sunday evening, I spend about five minutes reviewing the categories. Last month, for instance, I was shocked to discover that I'd spent almost eighty dollars on coffee alone, so this month I've started brewing my own. [C] What I've learned is that tracking doesn't have to be complicated — even five minutes a week can make a noticeable difference.", model: "[A] Yes, I track my spending, mostly through my banking app. [R] I tried a spreadsheet once, but it took too much time, and I gave up after two weeks. The app does everything automatically, so it's much easier to **stick to**. [E] Every Sunday evening I spend five minutes looking at the categories. Last month, for instance, I noticed I'd spent almost eighty dollars on coffee, so this month I'm making coffee at home. [C] So tracking doesn't have to be complicated — even five minutes a week makes a real difference.", lx: ["keep track of", "budgeting app", "stick to a budget"] },
        { q: "Many people find it hard to save money, especially with rising living costs or unexpected expenses. What do you find most difficult about saving money in your own life? And how do you try to plan around those challenges?", model5: "[A] The most difficult part for me is that my income is both small and unpredictable. [R] Because I work part-time, some months I earn a decent amount and others much less, which makes it almost impossible to save a fixed sum. [E] To get around this, I save a percentage rather than a specific amount: ten percent of whatever I earn goes straight into my **emergency fund** the moment I'm paid. In a good month that's more, in a slow month it's less, but crucially, I never skip it. [C] Consequently, I may not save a lot, but I've managed to save something every single month for over a year.", model: "[A] The most difficult thing for me is that my income is small and irregular. [R] I work part-time, so some months I earn more and some months much less, which makes it hard to save a fixed amount. [E] To deal with that, I save a percentage instead of a fixed sum — ten percent of whatever I earn goes straight into my **emergency fund**. In a good month it's more, in a bad month it's less, but I never skip it. [C] So I can't save a lot, but at least I save something every single month.", lx: ["unexpected expenses", "emergency fund", "tighten my belt"] },
        { q: "Some people reduce spending by avoiding unnecessary purchases or setting clear financial goals. Have you tried any strategies that worked particularly well for you? What changes did you notice?", model5: "[A] One strategy that has worked remarkably well for me is having a no-spend weekend once a month. [R] I noticed that most of my **discretionary spending** happens on weekends, whether it's cafés, shopping or taxis home late at night. [E] So once a month, my friends and I agree not to spend any money for two whole days. Instead, we go hiking, cook dinner together or have movie nights at home. After three months, I'd saved enough to buy new headphones, and, interestingly, those weekends often turned out to be more fun than usual. [C] It just goes to show how quickly small, simple habits can **add up**.", model: "[A] One strategy that worked surprisingly well for me is a no-spend weekend once a month. [R] I realized that most of my **discretionary spending** happens on weekends — cafés, shopping, taxis. [E] So once a month, my friends and I agree not to spend any money for two days. We go hiking, cook together, or watch movies at home. After three months, I'd saved enough for new headphones, and honestly, those weekends were often more fun than usual. [C] So small, simple rules can really **add up**.", lx: ["cut back on", "save up for", "set aside"] },
        { q: "Some schools now teach students about credit, debt, savings, and budgeting. Do you think financial literacy should be taught to everyone from a young age? Why?", model5: "[A] I'm convinced that financial literacy should be taught from a young age. [R] Money habits tend to form early, and it's far easier to build good habits in childhood than to break bad ones as an adult. [E] My aunt, for instance, gave each of her kids three jars — one for spending, one for saving and one for sharing — when they were about six. Now that they're teenagers, they're noticeably more careful with money than most of their friends, and they actually enjoy watching their savings grow. [C] Teaching **financial literacy** early is, in my view, one of the smartest investments a family or a school can possibly make.", model: "[A] Yes, I think everyone should learn about money from a young age. [R] Money habits form early, and it's much easier to learn good habits as a child than to fix bad ones as an adult. [E] I remember my aunt gave her kids three jars — one for spending, one for saving and one for sharing. Now they're teenagers, and they're much more careful with money than most of their friends. [C] So teaching **financial literacy** early is one of the best investments a family or a school can make.", lx: ["financial literacy", "rack up debt", "in the long run"] }
      ]},

      { t: "hypo", src: "Official 113", q: "If you could design the ideal way of managing your money, what would it look like?", model5: "[A] My ideal system would run almost entirely on its own. [R] Most people, myself included, simply don't have the discipline to log every purchase, so the less effort it requires, the more likely it is to work. [E] On payday, for instance, a fixed percentage would be transferred into savings automatically, another portion would cover my bills, and only what remained would go into a spending account. Ideally, an app would also flag any **subscription** I'd forgotten about but was still paying for. [C] In that kind of system, the tedious part takes care of itself, and I could enjoy my **disposable income** without constantly worrying about it.", model: "[A] My ideal system would be almost completely automatic. [R] Most people, including me, don't have the discipline to track every coffee, so the less I have to think about it, the better. [E] For example, on payday a fixed part of my money would automatically go into savings, another part would pay my bills, and only the rest would go to my spending account. An app would also warn me if a **subscription** I never use is still charging me. [C] So in my ideal world, the boring part is automatic, and I just enjoy my **disposable income** without stress.",

      { t: "opinion", src: "Official 113", q: "In your opinion, what are the most common obstacles people run into with financial planning?", model5: "[A] In my view, the biggest obstacle is the sheer unpredictability of life. [R] You can draw up a flawless plan, but the moment your phone breaks or you need to see a doctor, the whole thing can fall apart. Closely related to that are **impulse purchases** — small, seemingly harmless expenses that gradually eat into your budget. [E] I experienced this myself last semester, when my laptop needed an urgent repair; because I hadn't built up an **emergency fund**, I ended up having to borrow money from my parents. [C] What this taught me is that people rarely fail because planning is difficult — they fail because they don't plan for the unexpected.", model: "[A] I think the most common obstacle is unexpected expenses. [R] You can make a perfect plan, but then your phone breaks or you need to see a doctor, and the whole plan falls apart. Another big problem is **impulse purchases** — small things that seem harmless. [E] This happened to me last semester: my laptop needed a repair, and because I didn't have an **emergency fund**, I had to borrow money from my parents. [C] So I'd say people don't fail because planning is hard, but because life is unpredictable.",

      { t: "compare", q: "Is it better to track every single expense, or just set a general spending limit for each month?", model5: "[A] For most people, I'd argue that a general spending limit is far more effective. [R] Tracking every expense sounds responsible in theory, but in practice it's so time-consuming that most people abandon it within weeks, whereas a simple limit is much easier to **stick to**. [E] I learned this firsthand: when I tried logging every purchase for a month, I was skipping entire days by week three and feeling guilty about it. Now I just set a weekly limit for food and entertainment and glance at my app on Sundays — and, ironically, I spend less than I did before. [C] In my experience, a simple system you follow beats a perfect one you don't.", model: "[A] For most people, I think a general spending limit works better. [R] Tracking every single expense sounds smart, but it takes a lot of time and energy, and most people give up quickly. A simple limit is much easier to **stick to**. [E] I tried writing down every purchase for a month, and by the third week I was skipping days and feeling guilty. Now I just have a weekly limit for food and fun, and I check my app on Sundays. I spend less than before. [C] So in my experience, simple beats perfect.",

      { t: "opinion", q: "Should roommates or couples share a common budget, or keep their money completely separate?", model5: "[A] I think they should share a budget for joint expenses while keeping everything else separate. [R] Costs like rent, electricity and groceries affect everyone equally, so it's only fair to **split the bills**. Personal spending, however, is a different matter — nobody wants to justify every jacket or concert ticket. [E] My roommate and I use a shared app purely for rent and household supplies, which we split down the middle, while the rest of our money stays private. As a result, we've never had a single argument about money in two years. [C] A shared budget for the basics combined with financial freedom for everything else seems like the ideal **trade-off**.", model: "[A] I think they should share a budget for common expenses, but keep the rest separate. [R] Things like rent, electricity and groceries affect everyone, so it's fair to **split the bills**. But personal spending is personal — nobody wants to explain why they bought a new jacket. [E] My roommate and I have a shared app for rent and cleaning supplies, and each of us pays half. Everything else is private, and we've never had a single argument about money. [C] So a shared budget for basics and freedom for the rest is the best **trade-off**.",

      { t: "experience", q: "Tell me about a time you regretted buying something.", model5: "[A] The purchase I regret most is an expensive smartwatch I bought last year. [R] It was on sale and all my friends seemed to have one, so I bought it on a whim without asking myself whether I actually needed it. [E] For the first week, I was thrilled with it, but I soon realized my phone already did everything the watch could do. Within a month, it was gathering dust in a drawer, and by then it was too late to return it. It was a textbook **impulse purchase**, and I **overspent** that month as a result. [C] Ever since, I've made myself wait at least three days before buying anything expensive.", model: "[A] I really regret buying an expensive smartwatch last year. [R] I bought it on a whim, because it was on sale and all my friends had one, so I didn't think it through. [E] For the first week I loved it, but then I realized I already had all those functions on my phone. After a month, it was just sitting in a drawer, and I couldn't return it anymore. It was a total **impulse purchase**, and I **overspent** that month because of it. [C] Since then, I wait at least three days before buying anything expensive.",

      { t: "opinion", q: "Do sales and discounts actually help people save money, or do they just make people buy more?", model5: "[A] In most cases, I'd say they encourage people to buy more rather than save. [R] A **discount** creates the feeling that we're saving money, even when we're buying something we never needed in the first place — and retailers are well aware of that. [E] Last Black Friday, for instance, I bought three sweaters because they were half price. I was rather proud of the deal at the time, but if I'm honest, I only ever wear one of them. In other words, I didn't save money at all — I spent it. [C] **That said**, sales can genuinely help if you wait for them to buy something you'd already planned to purchase.", model: "[A] I think in most cases they make people buy more. [R] A **discount** makes us feel like we're saving money, even when we're buying things we never needed. Stores know this very well. [E] Last Black Friday, for example, I bought three sweaters because they were fifty percent off. I was proud of the deal, but honestly, I only wear one of them. I didn't save money — I spent it. [C] **That said**, sales can help if you wait for them to buy something you were already planning to buy.",

      { t: "opinion", src: "Mock", q: "Some people believe that young people today are worse at saving money than earlier generations were. Do you agree or disagree? Why?", model5: "[A] I only partly agree, because I think the situation is more complicated than it seems. [R] Admittedly, young people today face far more temptations — online shopping, delivery apps and 'buy now, pay later' services, to name a few. At the same time, however, rent and **tuition** have risen dramatically, so saving is objectively much harder than it was for our parents. [E] My parents, for example, bought their first apartment in their twenties, whereas many people my age can barely cover their **recurring costs** and end up **living paycheck to paycheck**. [C] Rather than being worse with money, I'd say young people are living in a far more expensive world.", model: "[A] I partly agree, but I think it's more complicated than that. [R] It's true that young people today face more temptations — online shopping, delivery apps, 'buy now, pay later'. But at the same time, rent and **tuition** are much higher than they were for our parents, so it's simply harder to save. [E] My parents bought their first apartment in their twenties, while most people my age can barely cover their **recurring costs** and often **live paycheck to paycheck**. [C] So I'd say young people aren't worse with money — they just live in a much more expensive world.",
        ideas: ["Partly true: online shopping, apps, 'buy now, pay later'", "But: higher rent and tuition — it's harder to save", "Young people are more open about financial literacy"],
        f: ["What makes saving harder today than thirty years ago?", "What are young people better at than their parents?"], lx: ["cost of living", "live paycheck to paycheck", "thrifty"] },
      { t: "compare", q: "Is it more important to save for the future or to enjoy your money while you're young?", model5: "[A] I'd say it's possible — and wise — to do both, although saving should come first. [R] **In the long run**, even modest savings grow considerably, and having a safety net gives you real peace of mind. **That said**, your twenties are the ideal time for travel and new experiences, and that time is something money can never buy back. [E] My own approach is to **set aside** twenty percent of everything I earn and then spend the rest without guilt. That's precisely how I managed to fund a trip to Spain last summer while still keeping my **emergency fund** intact. [C] Ultimately, **it's all about finding a balance** between security and living fully.", model: "[A] I think you can and should do both, but saving should come first. [R] **In the long run**, even small savings grow, and having some security gives you peace of mind. **That said**, being young is the best time for travel and new experiences, and you can't get that time back. [E] My approach is to **set aside** twenty percent of everything I earn and then enjoy the rest without guilt. That's how I paid for a trip to Spain last summer and still kept my **emergency fund**. [C] So **it's all about finding a balance**.",
        f: ["Can you do both? How?", "What would you regret more at forty?"], lx: ["delayed gratification", "in the long run", "finding a balance"] },
      { t: "opinion", q: "Should everyone have an emergency fund? How big should it be?", model5: "[A] Absolutely — I believe everyone should have an **emergency fund**, students included. [R] Unexpected expenses are inevitable, whether it's a broken phone, a medical bill or a last-minute trip home, and without savings, people often end up borrowing money or relying on credit cards. [E] Last year, my laptop died a week before finals, but because I'd saved around four hundred dollars, I was able to fix it the same day without asking anyone for help. For students, I'd suggest one month's expenses as a starting point, whereas working adults should probably aim for three to six months. [C] It's quite simply the smartest way to **save for a rainy day**.", model: "[A] Yes, I think everyone should have an **emergency fund**, even students. [R] Unexpected expenses always come up — a broken phone, a medical bill, a sudden trip home — and without savings, people end up borrowing money or using credit cards. [E] Last year my laptop died a week before finals, and because I had about four hundred dollars saved, I fixed it the same day without asking anyone for help. For students, I'd say one month of expenses is a good start; for working adults, maybe three to six months. [C] It's the best way to **save for a rainy day**.",
        f: ["What counts as a real emergency?", "Have you or someone you know ever needed one?"], lx: ["emergency fund", "unexpected expenses", "save for a rainy day"] }
    ]},

      { t: "opinion", src: "Платформа · Shopping Habits", q: "Do you think advertising, especially on social media, has an impact on what you choose to buy? Why or why not?", model5: "[A] I'd like to believe it doesn't, but realistically, I think it does. [R] Social media ads are extremely targeted: they show you precisely what you've been thinking about, often at the very moment you're bored and scrolling. [E] Last month, for instance, I mentioned running shoes to a friend, and the following day my feed was flooded with ads for them. Two days later, I'd bought a pair. It may well have been a coincidence, but it certainly felt like an **impulse purchase** triggered by the algorithm. [C] In other words, advertising does influence me — particularly when I'm not paying attention.", model: "[A] Yes, I think it does, even though I'd like to say it doesn't. [R] Ads on social media are very targeted — they show you exactly what you were thinking about, at the moment you're bored and scrolling. [E] Last month, for instance, I talked with a friend about running shoes, and the next day my feed was full of shoe ads. Two days later, I bought a pair. Was it a coincidence? Maybe, but it felt like an **impulse purchase**. [C] So advertising definitely influences me, especially when I'm not paying attention.",

      { t: "opinion", q: "Do influencers and bloggers make young people spend more than they can afford?", model5: "[A] I believe they often do, especially when it comes to teenagers. [R] Influencers make expensive products look not only desirable but somehow necessary, which creates strong **peer pressure** for young followers to keep up, even when they **can't afford** it. [E] My younger cousin, for example, saved her entire **allowance** for three months to buy a skincare set a famous blogger had recommended, only to use it twice and feel disappointed. [C] **That said**, the responsibility doesn't lie with influencers alone; young people also need enough **financial literacy** to recognize when they're simply being sold something.", model: "[A] I think they often do, especially for teenagers. [R] Influencers make expensive things look normal and necessary, and young followers feel **peer pressure** to keep up, even if they **can't afford** it. [E] A younger cousin of mine saved her whole **allowance** for three months to buy a skincare set that a famous blogger recommended. She used it twice and was disappointed. [C] **That said**, the influencer isn't the only one responsible — young people need **financial literacy** to recognize when they're being sold something.",
        f: ["Who is responsible — the influencer or the follower?", "Have you ever bought something an influencer recommended?"], lx: ["live beyond your means", "peer pressure", "afford"] },
      { t: "experience", q: "Have you ever bought something just because your friends had it?", model5: "[A] Yes, definitely — in high school, I bought an extremely expensive pair of sneakers simply because everyone in my group had them. [R] I was desperate to **fit in**, and the thought of being the only one without them felt unbearable at the time. [E] I spent my entire birthday money on them, and, ironically, they weren't even comfortable. A few months later, the trend had moved on, and nobody cared about those sneakers anymore. [C] Looking back, it taught me that **peer pressure** can be surprisingly expensive, and nowadays I try to buy things because I genuinely like them, not because others own them.", model: "[A] Yes, definitely — in high school I bought a very expensive pair of sneakers just because everyone in my group had them. [R] I wanted to **fit in**, and I was afraid of being the only one without them. [E] I used all my birthday money, and honestly, they weren't even comfortable. A few months later the trend changed, and nobody cared about those sneakers anymore. [C] It taught me that **peer pressure** is expensive, and now I try to buy things because I like them, not because others have them.",
        f: ["How did you feel about it later?", "Is peer pressure stronger for teenagers or for adults?"], lx: ["peer pressure", "on a whim", "fit in"] },
      { t: "opinion", q: "Is it rude to talk openly about money — salaries, prices or debts — with friends?", model5: "[A] I don't think it's rude, provided it's done in the right way. [R] In my culture, discussing salaries is still something of a **taboo**, but I'd argue that this silence actually works against people, since they have no way of knowing whether they're being paid fairly. [E] Last year, a few friends and I compared what we earned at our part-time jobs, and one of them discovered she was being paid significantly less for exactly the same work. As a result, she asked for a raise — and got it. [C] So long as nobody is showing off, talking openly about money can be genuinely helpful.", model: "[A] I don't think it's rude, but it depends on how you do it. [R] In my culture, talking about salaries is a bit of a **taboo**, but I think that silence actually hurts people — they don't know if they're being paid fairly. [E] Last year my friends and I compared our part-time job salaries, and one friend realized she was earning much less for the same work. She asked for a raise and got it. [C] So as long as nobody is showing off, talking about money openly can really help.",
        f: ["Is it different in your culture compared to the US?", "Would it help if people talked about salaries more openly?"], lx: ["taboo", "openly", "financial literacy"] },
      { t: "experience", q: "Did your parents talk to you about money when you were a child? Do you think they should have?", model5: "[A] Not really — money was a subject my parents largely kept to themselves. [R] I think they wanted to shield me from financial stress, but the downside was that I had to figure everything out on my own later. [E] When I moved out, I didn't even know how to pay utility bills or what a credit score was, and I ended up making some rather silly mistakes, such as paying late fees twice in one month. [C] For that reason, I'm convinced parents should **set an example** and discuss money with their children — not in an alarming way, but as a normal, everyday part of life.", model: "[A] Not really — money was a topic my parents mostly kept to themselves. [R] I think they wanted to protect me from stress, but as a result, I had to learn everything on my own. [E] When I moved out, I didn't even know how to pay bills or what a credit score was, and I made some silly mistakes, like paying late fees twice. [C] So yes, I think parents should **set an example** and talk to their kids about money — not in a scary way, but as a normal part of life.",
        f: ["What is the one money lesson every parent should teach?", "How will you talk about money with your own kids?"], lx: ["allowance", "financial literacy", "set an example"] }

      { t: "personal", q: "Do you prefer to pay with cash or by card? Why?", model5: "[A] I nearly always pay by card — or, more accurately, by phone. [R] It's quicker, I don't need to carry a wallet, and my banking app automatically helps me **keep track of my spending**. **That said**, I've noticed that paying by phone makes it dangerously easy to **overspend**. [E] Last month, as an experiment, I paid only in cash for a week, and I spent noticeably less, simply because I could physically see the money disappearing. [C] Overall, I prefer cards for their **convenience**, but I've come to see cash as a useful tool whenever I need to rein in my spending.", model: "[A] I almost always pay by card, or actually by phone. [R] It's faster, I don't have to carry a wallet, and my banking app automatically helps me **keep track of my spending**. [E] **That said**, I've noticed that paying by phone makes it too easy to **overspend**. Last month, when I tried paying only in cash for a week, I spent noticeably less, because I could physically see the money disappearing. [C] So I prefer cards for **convenience**, but cash is a great tool when I need to control my budget.",

      { t: "opinion", q: "Is 'buy now, pay later' a good option for students?", model5: "[A] In most cases, I don't think it's a sensible option for students. [R] It creates the illusion of free money, since you don't pay right away, which makes it remarkably easy to **live beyond your means** and **rack up debt** without realizing it. [E] A friend of mine used it for clothes, headphones and concert tickets, and within two months she had five separate payments due in the same week. The stress it caused her was considerable. [C] It might work for an essential purchase backed by a clear repayment plan, but for everyday shopping, I'd consider it a trap.", model: "[A] In most cases, I don't think it's a good option for students. [R] It feels like free money, because you don't pay right away, but it makes it very easy to **live beyond your means** and **rack up debt** without noticing. [E] A friend of mine used it for clothes, headphones and concert tickets, and after two months she had five different payments due on the same week. She was really stressed. [C] So it can work for a necessary purchase with a clear plan, but for everyday shopping it's a trap.",

      { t: "hypo", q: "Would you trust an AI assistant to make financial decisions for you? Why or why not?", model5: "[A] I'd trust it with small, routine decisions, but certainly not with major ones. [R] AI is excellent at tedious tasks — finding cheaper phone plans, reminding me about bills or spotting **subscriptions** I've forgotten about. Major decisions, however, involve personal values and **risk**, which I'd want to understand and own myself. [E] For instance, I'd gladly let an assistant transfer ten percent of my income into savings every month, but I'd never allow it to decide where to invest my money or whether to **take out a loan**. [C] In short, I'd welcome AI as an assistant, but not as the one in charge.", model: "[A] I'd trust it with small, routine decisions, but not with big ones. [R] An AI is great at boring tasks — finding cheaper phone plans, reminding me about bills, or spotting **subscriptions** I forgot about. But big decisions involve personal values and **risk**, and I want to understand them myself. [E] For example, I'd happily let an assistant move ten percent of my income into savings every month, but I'd never let it choose where to invest my money or whether to **take out a loan**. [C] So AI as a helper, yes; AI as my boss, no.",
        f: ["Which decisions would you let it make, and which never?", "Who is responsible if the AI makes a mistake?"], lx: ["financial decisions", "trust", "risk"] },
      { t: "opinion", q: "Is it a good idea for university students to have a credit card?", model5: "[A] It can be a good idea, but only if it comes with strict personal rules. [R] On the one hand, a credit card helps students build a **credit history**, which matters later when renting an apartment. On the other hand, it's all too easy to **rack up debt** if you treat it as free money. [E] My rule, which my older sister passed on to me, is to use the card only for purchases I could pay for in cash that day and to clear the full balance every month. I've followed it for a year and haven't paid a cent in interest. [C] It's a valuable tool, then — but only for those disciplined enough to use it responsibly.", model: "[A] I think it can be a good idea, but only with clear rules. [R] A credit card helps students build a **credit history**, which is important later for renting an apartment. But it's also very easy to **rack up debt** if you treat it like free money. [E] My rule, which my older sister taught me, is to use the card only for things I could pay for in cash today and to pay the full balance every month. I've done that for a year and never paid any interest. [C] So it's a useful tool, but only for disciplined people.",
        f: ["What rules would you give a student with a new credit card?", "Can a credit card teach responsibility?"], lx: ["rack up debt", "credit history", "live beyond your means"] }
    ]},

        f: ["Is an expensive university always a better one?", "Would you choose a cheaper university closer to home?"], lx: ["tuition", "scholarship", "worth the money"] },
      { t: "opinion", q: "Should university students have part-time jobs, or should they focus only on their studies?", model5: "[A] I'd say a part-time job is beneficial for most students, provided the hours are reasonable. [R] For one thing, it provides an **income** that helps **cover the costs** of food and books, and for some students it's the only way to **make ends meet**. **That said**, there's an obvious **trade-off**: working twenty or thirty hours a week will almost certainly take a toll on your grades. [E] Personally, I work around ten hours a week at the campus library, which allows me to **prioritize** my studies without constantly worrying about money. [C] Ultimately, **it's all about finding a balance** between earning and learning.",

        model: "[A] I think a part-time job is a good idea for most students, as long as it's not too many hours. [R] First of all, it gives you some **income**, which helps you **cover the costs** of things like food and books, and for some students it's the only way to **make ends meet**. **That said**, there's a clear **trade-off**: if you work twenty or thirty hours a week, your grades will probably suffer. [E] Personally, I work about ten hours a week at the campus library, and I can still **prioritize** my studies without feeling broke all the time. [C] So it's **all about finding a balance**." },
      { t: "compare", q: "From a financial point of view, is it better for students to live in a dorm or to rent an apartment?", model5: "[A] Financially speaking, a dorm is usually the smarter choice, particularly in the first year. [R] You pay a single fixed price, with none of the hidden **recurring costs** such as electricity, internet or furniture. On top of that, living close to campus saves you a considerable amount on transport. [E] When I moved into a shared apartment in my second year, the rent looked cheaper at first glance, but once I'd added utilities and bus passes, I was actually paying more than before. [C] **That said**, an apartment offers far more freedom, so in the end it's a **trade-off** between saving money and gaining independence.", model: "[A] From a financial point of view, I think a dorm is usually the better choice, especially in the first year. [R] You pay one fixed price, and there are no hidden **recurring costs** like electricity, internet or furniture. Plus, you live close to campus, so you save on transport. [E] When I moved into a shared apartment in my second year, the rent looked cheaper, but after utilities and bus passes, I was actually paying more. [C] **That said**, an apartment gives you more freedom, so it's a **trade-off** between money and independence.",
        ideas: ["Dorm: one fixed price, no utility bills, close to class", "Apartment: can be cheaper if shared, more freedom", "Hidden recurring costs: utilities, internet, transport"],

      { t: "opinion", q: "Your university plans to raise the price of the meal plan but add healthier food options. Do you support this change?", model5: "[A] I'd support it, but only on the condition that a cheaper option remains available. [R] Healthy food has a real impact on how well students concentrate and feel, so I'd argue it's **worth spending a bit more on**. However, many **cash-strapped** students simply wouldn't be able to **afford** a price increase. [E] At my university, quite a few of my friends already skip lunch to save money, and a more expensive meal plan would only make matters worse for them. [C] The fairest solution, in my view, would be to offer two plans — a basic, **budget-friendly option** and a premium one with healthier choices.", model: "[A] I'd support it, but only if there's still a cheaper option. [R] Healthy food really affects how well students study and feel, so I think it's **worth spending a bit more on**. But many **cash-strapped** students simply can't **afford** a higher price. [E] At my university, a lot of my friends already skip lunch to save money, and a price increase would make it worse for them. [C] So the best solution would be two meal plans — a basic, **budget-friendly option** and a premium one with healthier choices.",

      { t: "opinion", q: "Should universities make all course materials free and digital, even if it means a small increase in tuition?", model5: "[A] I'd fully support that idea. [E] At the moment, textbooks **cost an arm and a leg** — some of mine were over a hundred dollars each — and a lot of **cash-strapped** students simply go without them, which inevitably affects their grades. [R] If materials were included in **tuition**, everyone would have equal access from day one. Admittedly, the **trade-off** is a slightly higher fee, and students who already buy used books might feel they're paying for nothing. Nevertheless, spreading the cost across everyone seems far fairer to me. [C] **In the long run**, I'm convinced it would **pay off**, since students with all their materials are much more likely to succeed.",

        model: "[A] I'd support that idea. [E] Right now, textbooks **cost an arm and a leg** — some of mine were over a hundred dollars each — and a lot of **cash-strapped** students simply don't buy them, which hurts their grades. [R] If materials were included in **tuition**, everyone would have the same access from day one. Of course, the **trade-off** is that tuition would go up a little, and students who already buy used books might feel they're paying for nothing. But I think spreading the cost across everyone is fairer. [C] **In the long run**, I believe it would **pay off**, because students who have all their materials are more likely to succeed." },
      { t: "opinion", q: "What could your university do to help students manage their money better?", model5: "[A] The most effective step, in my view, would be offering free, practical money-management workshops. [R] Most students arrive at university with very little **financial literacy**, and nobody explains how to budget, **apply for financial aid** or avoid debt. [E] My university could, for instance, run a one-hour session during orientation week on how to **draw up a budget** and where to find financial support. It could also set up a small **emergency fund** for students facing sudden costs, such as a medical bill or an unexpected trip home. [C] Relatively small measures like these could significantly reduce the financial stress so many students experience.", model: "[A] I think the most helpful thing would be free, practical money workshops. [R] Most students arrive with very little **financial literacy**, and nobody explains how to budget, apply for aid, or avoid debt. [E] For example, my university could offer a one-hour session during orientation week on how to **draw up a budget** and **apply for financial aid**. They could also create a small **emergency fund** for students who face sudden expenses, like a medical bill. [C] Small steps like these could reduce a lot of stress on campus.",
        ideas: ["Free workshops on budgeting", "A small emergency fund or grants", "Discounts on campus, cheaper meal options"],

      { t: "opinion", src: "Платформа · University Education", q: "Some people believe universities should be more affordable so that more people can access higher education. What steps could governments or universities take?", model5: "[A] I wholeheartedly agree that universities should become more **affordable**. [R] Talented students shouldn't be excluded from higher education merely because their families can't pay, and society as a whole benefits when more people are well educated. [E] Governments could expand need-based **financial aid** and offer low-interest loans, whereas universities could reduce costs by providing free digital textbooks or more online courses. In my country, for example, students with strong grades receive free tuition, which has opened doors for thousands of families. [C] Clearly, it's achievable — what's required is political will and smarter spending.", model: "[A] I definitely agree that universities should be more **affordable**. [R] Talented students shouldn't miss out on education just because their families can't pay, and society benefits when more people are educated. [E] Governments could offer more need-based **financial aid** and low-interest loans, and universities could cut costs by offering free digital textbooks or online courses. In my country, for example, students with good grades get free tuition, and it has helped thousands of families. [C] So it's possible — it just takes political will and smart spending.",
        f: ["Should university be free for everyone?", "Who should pay for higher education — students, parents or the government?"], lx: ["affordable", "financial aid", "scholarship"] },
      { t: "compare", q: "Should students live with their parents during university to save money?", model5: "[A] I think it's a sensible choice if the university is nearby, although it does come with a **trade-off**. [R] Living at home saves an enormous amount on **rent** and food, which means less debt and considerably less stress. On the other hand, students miss out on the chance to learn how to live independently. [E] My best friend lived with her parents throughout her degree and graduated debt-free, but she admits she had to learn how to cook and pay bills from scratch once she finally moved out. [C] Financially, it's a great decision, but students should still find ways to become **financially independent** along the way.", model: "[A] I think it's a smart choice if the university is close, but it has a **trade-off**. [R] Living at home saves a huge amount of money on **rent** and food, which means less debt and less stress. On the other hand, students miss out on learning to be independent. [E] My best friend lived with her parents for four years and graduated with no debt at all, but she says she had to learn how to cook and pay bills from zero when she finally moved out. [C] So financially it's great, but students should still find ways to become **financially independent**.",
        f: ["What do students lose if they stay at home?", "At what age should young people become financially independent?"], lx: ["financially independent", "trade-off", "rent"] }
    ]},
    { icon: "book", title: "Финансовая грамотность", en: "Financial education", questions: [
      { t: "opinion", src: "Official 091 · 120 · Mock", q: "Should schools teach students how to manage money, for example how to make a budget? Should it be a required subject? Why or why not?", same: "s120-3",
