    { en: "disposable income", pos: "n", ru: "свободные деньги после обязательных трат", ex: "After rent and bills, I don't have much disposable income.", level: "adv" },

    { en: "trade-off", pos: "n", ru: "компромисс: что-то получаешь, чем-то жертвуешь", ex: "Living off campus is cheaper, but the trade-off is a long commute.", level: "adv" },
    { en: "delayed gratification", pos: "n", ru: "отложенное удовольствие", ex: "Saving money is really all about delayed gratification.", level: "adv" },
    { en: "recurring costs", pos: "n", ru: "регулярные, повторяющиеся расходы", ex: "I underestimated how fast recurring costs like phone bills add up.", level: "adv" },
    { en: "emergency fund", pos: "n", ru: "подушка безопасности", ex: "Even a small emergency fund can save you a lot of stress.", level: "adv" },
    { en: "budget-conscious", pos: "adj", ru: "следящий за бюджетом, экономный", ex: "Budget-conscious students usually buy second-hand textbooks.", level: "adv" }

      { en: "_keep track of_ your spending", ru: "отслеживать свои траты", ex: "Banking apps help you keep track of your spending." }

  /* art — ключ рисунка из IDIOM_ART */
  idioms: [
