      { t: "opinion", src: "Mock", q: "Some educators argue that schools should spend more time teaching practical life skills, such as cooking or first aid, even if it means less time for traditional subjects. Do you agree?", model5: "[A] Yes, I'm convinced schools should do this. [R] While traditional subjects are undoubtedly important, a surprising number of young adults can't cook a basic meal, give first aid or manage money — skills that affect their daily lives far more directly. [E] When I moved out, I knew plenty about chemistry but virtually nothing about cooking, so I lived on instant noodles for an entire month. A simple cooking class in high school would have spared me that. [C] **That said**, schools needn't sacrifice core subjects; even one hour a week devoted to practical skills could make a considerable difference **in the long run**.", model: "[A] Yes, I think schools should do this. [R] Traditional subjects are important, but many young adults can't cook a basic meal, do first aid, or manage money, and those skills affect their everyday lives much more. [E] When I moved out, I knew a lot about chemistry but nothing about cooking, so I lived on instant noodles for a month. A simple cooking class in high school would have changed that. [C] **That said**, schools don't need to cut core subjects completely — even one hour a week for practical skills would make a big difference **in the long run**.",
        f: ["Which practical skill do you wish you had learned at school?", "Which subject could be shortened to make time?"], lx: ["practical skills", "curriculum", "in the long run"] },
      { t: "opinion", q: "Should parents give children a regular allowance? At what age should they start?", model5: "[A] Yes, I think a regular **allowance** is an excellent idea, ideally starting at around eight years old. [R] It teaches children that money is finite and that every purchase involves a choice, which is essentially the foundation of **financial literacy**. [E] When I was nine, my parents started giving me a small weekly allowance. At one point, I wanted a toy that cost five weeks' worth, so I had no choice but to **save up for** it. Those five weeks taught me more about **delayed gratification** than any lecture ever could. [C] In that sense, an allowance is really a lesson in disguise rather than just pocket money.", model: "[A] Yes, I think a regular **allowance** is a great idea, starting at around eight years old. [R] It teaches children that money is limited and that they have to make choices, which is the basis of **financial literacy**. [E] When I was nine, my parents gave me a small weekly allowance. Once I wanted a toy that cost five weeks' worth, so I had to **save up for** it. Those five weeks taught me more about **delayed gratification** than any lecture could. [C] So an allowance is really a lesson, not just pocket money.",
        ideas: ["Yes: teaches responsibility and planning early", "Age: around 8–10, small amounts", "Your own childhood experience"],
        f: ["Should the allowance depend on chores?", "What did you spend your pocket money on as a kid?"], lx: ["allowance", "financial literacy", "delayed gratification", "save up for"] },
      { t: "opinion", q: "Should parents pay children for good grades or for doing chores?", model5: "[A] I don't believe parents should pay for good grades, although paying for extra chores can be perfectly reasonable. [R] If children study purely for money, they risk losing the real **motivation** — learning for their own sake. Likewise, basic chores are simply part of being in a family, so they shouldn't be rewarded either. [E] My parents had what I consider a sensible system: making my bed was expected, whereas washing the car or helping in the garden earned me a small **reward**. That taught me that extra effort deserves extra pay. [C] In short, money for additional work, yes; money for grades, no.", model: "[A] I don't think parents should pay for good grades, but paying for extra chores can be fine. [R] If kids study only for money, they lose the real **motivation** — learning for themselves. Basic chores are also part of being a family, so they shouldn't be paid either. [E] My parents had a good system: making my bed was just expected, but washing the car or helping in the garden earned me a small **reward**. That taught me that extra work deserves extra pay. [C] So money for extra effort, yes; money for grades, no.",
        f: ["Does money motivation last?", "What did your parents do?"], lx: ["reward", "allowance", "motivation"] },
      { t: "opinion", q: "At what age should young people start earning their own money?", model5: "[A] I'd say around sixteen is a reasonable age to start earning some money. [R] A small **part-time job** teaches **responsibility**, time management and the real value of money — once you know how many hours something costs, you think twice before buying it. [E] My first job was at a café when I was sixteen, just on weekends. I remember suddenly realizing that a pair of sneakers was equivalent to two full days of work, and from then on I became far more careful with my spending. [C] **That said**, school should always take priority, so it ought to be a few hours a week at most.", model: "[A] I think around sixteen is a good age to start earning some money. [R] A small **part-time job** teaches **responsibility**, time management and the real value of money — you think twice before buying something when you know how many hours it costs. [E] My first job was at a café when I was sixteen, just on weekends. I suddenly realized that a pair of sneakers equaled two full days of work, and I became much more careful with spending. [C] **That said**, school should always come first, so it should be a few hours a week, not more.",
        f: ["What was the first money you ever earned?", "Can working too early be harmful?"], lx: ["part-time job", "financially independent", "responsibility"] },
      { t: "opinion", src: "Платформа · Entrepreneurship", q: "Some believe schools and universities should focus more on teaching business and entrepreneurship skills. Do you agree? Why?", model5: "[A] I agree, at least to some extent. [R] Not everyone will go on to start a company, but skills such as planning a budget, taking calculated risks and pitching ideas are valuable in virtually any career. [E] My university has a startup club where students develop small business ideas, and a friend of mine claims she learned more there about teamwork and money than in any regular class. In fact, she now runs a small online shop that **covers the costs** of her studies. [C] Consequently, I believe every student would benefit from at least one practical course in **entrepreneurship**.", model: "[A] I agree, at least partly. [R] Not everyone will start a company, but skills like planning a budget, taking reasonable risks and presenting ideas are useful in any job. [E] My university has a startup club where students develop small business ideas, and one of my friends learned more there about teamwork and money than in any regular class. She now runs a small online shop that **covers the costs** of her studies. [C] So I think every student would benefit from at least one practical course in **entrepreneurship**.",
        f: ["What skills do future business owners really need?", "Can entrepreneurship really be taught?"], lx: ["entrepreneurship", "practical skills", "take risks"] }
    ]},
    { icon: "scales", title: "Деньги, счастье и ценности", en: "Money & values", questions: [
      { t: "opinion", q: "Can money buy happiness? To what extent?", model5: "[A] I'd say money can buy a certain amount of happiness, but only up to a point. [R] Having enough to cover the essentials provides **financial security** and **peace of mind**, which genuinely matters. Beyond that point, however, additional money seems to make surprisingly little difference. [E] When I finally earned enough to stop worrying about rent, the relief was enormous. By contrast, when I later **splurged** on an expensive phone, the excitement lasted barely a week. My most treasured memories — trips with friends, family dinners — cost very little. [C] In other words, money can buy security, but real happiness comes from people and experiences.", model: "[A] I think money can buy some happiness, but only up to a point. [R] Having enough money to cover the basics gives you **financial security** and **peace of mind**, which really matters. But after that, more money doesn't make people much happier. [E] For example, when I finally had enough to stop worrying about rent, I felt a huge relief. But when I **splurged** on an expensive phone later, the happiness lasted maybe a week. My best memories — trips with friends, family dinners — cost very little. [C] So money buys security, but happiness comes from people and experiences.",
        f: ["Is there an amount of money after which happiness stops growing?", "What makes you happy that costs nothing?"], lx: ["financial security", "peace of mind", "materialistic"] },
      { t: "compare", q: "Is it better to spend money on experiences, like travel, or on things, like clothes and gadgets?", model5: "[A] For me, experiences are undoubtedly worth more. [R] When I **splurge** on a trip or a concert, I'm not merely paying for a few hours of fun — I'm investing in memories and stories that stay with me for years. Possessions, by contrast, tend to lose their appeal remarkably quickly. [E] I remember **saving up for** an expensive jacket, only to find that within a month it was just another jacket in my wardrobe. A weekend trip with friends last spring, on the other hand, still makes me smile whenever I think about it. [C] **That said**, items that improve your daily life can be worthwhile too, but **in the long run**, **I'd rather** invest in experiences.",
        ideas: ["Experiences: memories, stories, personal growth", "Things lose excitement quickly", "Exception: items you use every day"],
        f: ["What is a memory you would never trade for an object?", "Is there an object that changed your life?"], lx: ["splurge", "get your money's worth", "in the long run", "I'd rather … than …"],
        model: "[A] For me, experiences are definitely worth more. [R] When I **splurge** on a trip or a concert, I'm not just buying a few hours of fun — I'm getting memories and stories that last for years. Things, on the other hand, lose their excitement pretty quickly. [E] I remember **saving up for** an expensive jacket, and within a month it was just another jacket in my closet. In contrast, a weekend trip with friends last spring still makes me smile. [C] **That said**, if something improves your daily life, like a good laptop, you can **get your money's worth** too. But **in the long run**, **I'd rather** invest in experiences." },
      { t: "personal", src: "Official 106", q: "When choosing a career, is job satisfaction your first priority, or do you focus more on salary? Why?", model5: "[A] **Job satisfaction** is my top priority, although salary comes a very close second. [R] Since I'll spend most of my waking hours at work, I want to do something meaningful and stimulating. **That said**, I also need a **salary** that allows me to **make ends meet** and put something aside. [E] My uncle, for instance, chose an extremely well-paid job in finance, yet he always seems exhausted and unhappy. My aunt, on the other hand, is a teacher who earns far less but genuinely loves what she does. Watching them made my choice remarkably clear. [C] Ideally, I want a job I enjoy that still pays fairly.", model: "[A] For me, **job satisfaction** is the first priority, but salary is a close second. [R] I'll spend most of my life at work, so I want to do something meaningful and interesting. **That said**, I also need a **salary** that lets me **make ends meet** and save a little. [E] My uncle chose a very well-paid job in finance, and he's always tired and unhappy. My aunt is a teacher who earns much less, but she loves her work. Watching them made my choice clear. [C] So I want a job I enjoy that still pays fairly.",
        f: ["Would your answer change if you had a family to support?", "Can you be satisfied with a job that pays very little?"], lx: ["job satisfaction", "salary", "make ends meet"] },
      { t: "compare", q: "Would you take a boring job with a high salary or an interesting job with a lower salary?", model5: "[A] I'd choose the interesting job, as long as it still allowed me to cover my basic costs. [R] A boring job might pay well, but spending eight hours a day on something you don't care about almost inevitably leads to stress and, eventually, burnout — and no salary can compensate for that indefinitely. [E] Last summer, I had a well-paid but painfully repetitive data-entry job, and by the third week I was literally counting the minutes until five o'clock. The money was nice, but I felt completely drained every evening. [C] For me, that **trade-off** simply isn't worth it; I'd rather be fulfilled and slightly less well-off.", model: "[A] I'd choose the interesting job with a lower salary — as long as I can still cover my basic costs. [R] A boring job might pay well, but spending eight hours a day doing something you don't care about leads to stress and burnout. Money can't compensate for that forever. [E] Last summer I had a well-paid but extremely repetitive data entry job, and by the third week I was counting the minutes. The money was nice, but I felt drained every evening. [C] So the **trade-off** isn't worth it for me — I'd rather be happy and a little less rich.",
        f: ["How long could you stay in a boring job?", "What would make the boring job bearable?"], lx: ["trade-off", "job satisfaction", "well-paid"] },
      { t: "compare", q: "Is it better to have more money and less free time, or less money and more free time?", model5: "[A] At this stage of my life, I'd definitely choose less money and more free time. [R] I'm young, and I want to spend time with friends, travel and explore new hobbies; money matters, of course, but time is the one resource you can never get back. [E] Last year, I juggled three part-time jobs at once. Although I had more money than ever before, I missed a close friend's birthday, stopped going to the gym and felt constantly exhausted. When I finally quit one of the jobs, I was poorer but noticeably happier. [C] For me, a healthy **work-life balance** is worth far more than a bigger paycheck.", model: "[A] Right now, I'd rather have less money and more free time. [R] I'm young, and I want to spend time with friends, travel and try new hobbies; money matters, but time is the one thing you can't get back. [E] Last year I worked three part-time jobs at once. I had more money than ever, but I missed my friend's birthday, stopped going to the gym, and felt exhausted. When I quit one of the jobs, I was poorer but much happier. [C] So for me, a good **work-life balance** is worth more than a bigger paycheck.",
        f: ["Which of the two do you have right now?", "How do you think this will change after graduation?"], lx: ["work-life balance", "free time", "trade-off"] },
      { t: "opinion", q: "Is it ever a good idea to lend money to friends? What if they don't pay you back?", model5: "[A] I think it's fine to **lend** money to friends, but only an amount you're prepared to lose. [R] Money has a way of damaging friendships, particularly when someone doesn't **pay you back**, so it's wise to be cautious. [E] I once lent a friend a hundred dollars, and it took her six months to return it. Since I didn't want to keep reminding her, things became rather awkward between us for a while. Nowadays, my rule is that I only lend what I could comfortably give as a gift. [C] That way, if they repay me, that's great — and if they don't, the friendship remains intact.", model: "[A] I think it's okay to **lend** money to friends, but only an amount you're ready to lose. [R] Money can easily damage a friendship if someone doesn't **pay you back**, so it's important to be careful. [E] I once lent a friend a hundred dollars, and it took her six months to return it. I didn't want to ask again and again, so it became awkward between us. Now my rule is: I only lend what I could give as a gift. [C] That way, if they pay me back, great — and if not, the friendship is still safe.",
        f: ["Have you ever lent or borrowed money?", "How would you ask a friend to return money?"], lx: ["lend", "borrow", "pay back"] }
    ]},
    { icon: "globe", title: "Потребление и экология", en: "Consumerism & environment", questions: [
      { t: "opinion", src: "Official 047 / 051 / 080", q: "Some people believe that fashion trends change too quickly and that spending money on new fashions is wasteful. Do you agree or disagree?", model5: "[A] I largely agree. [R] Thanks to social media, trends now change almost weekly, and fast fashion brands churn out cheap clothes that people wear two or three times before throwing them away — which is wasteful both financially and environmentally. [E] I'm guilty of this myself: I **splurged** on a trendy jacket last spring, and by autumn it already looked dated, so it's been sitting untouched in my wardrobe ever since. [C] **That said**, fashion itself isn't the problem; buying fewer, better-made or **second-hand** pieces is a far smarter way to enjoy it.", model: "[A] I mostly agree. [R] Trends now change every few weeks because of social media, and fast fashion brands produce cheap clothes that people wear two or three times and then throw away. That's wasteful for your wallet and for the environment. [E] I've done it myself: I **splurged** on a trendy jacket last spring, and by autumn it already looked outdated, so it's just sitting in my closet. [C] **That said**, fashion itself isn't bad — buying fewer, better-quality **second-hand** or classic pieces is the smart way to enjoy it.",
        f: ["Do you follow trends or have your own style?", "Is fast fashion a problem in your country?"], lx: ["fast fashion", "wasteful", "second-hand"] },
      { t: "opinion", src: "Official 067", q: "Some people believe that buying too many products we do not need harms the environment. Do you agree with this idea? Why or why not?", model5: "[A] I agree entirely. [R] Every product requires raw materials, energy and transport, so whenever we buy something we don't need, all of those resources are wasted — and the item usually ends up in a landfill before long. [E] When I moved apartments last year, I came across boxes of things I'd bought and never used: kitchen gadgets, clothes with the tags still attached. It was genuinely embarrassing. Since then, I've made a conscious effort to **cut back on** unnecessary shopping and to buy **second-hand** whenever possible. [C] Clearly, **consumerism** isn't merely a financial problem — it's an environmental one as well.", model: "[A] Yes, I completely agree. [R] Every product needs materials, energy and transport, and when we buy things we don't need, all of that is wasted — and the product usually ends up in a landfill. [E] When I moved apartments last year, I found boxes of things I'd bought and never used: kitchen gadgets, clothes with tags still on them. It was honestly embarrassing. Since then, I try to **cut back on** unnecessary shopping and buy **second-hand** when I can. [C] So **consumerism** isn't just a money problem — it's an environmental one.",
        f: ["What do you own that you never use?", "Should companies be responsible for reducing waste?"], lx: ["consumerism", "waste", "cut back on"] },
      { t: "opinion", src: "Mock", q: "Some people believe that holidays have become too focused on shopping and expensive gifts. Do you agree or disagree? Why?", model5: "[A] I agree that many holidays have become excessively commercial. [R] Stores start promoting holiday products months in advance, and people feel growing pressure to buy bigger and more expensive gifts each year, even when they can't **afford** them. [E] My family used to spend a fortune on presents until we decided to switch to a secret gift exchange with a modest price limit. Almost immediately, the gifts became more creative and **meaningful**, and everyone was noticeably less stressed. [C] To my mind, the best holidays are about spending time together rather than **splurging**.", model: "[A] I agree that many holidays have become too commercial. [R] Stores start selling holiday products months in advance, and people feel pressure to buy bigger and more expensive gifts every year, even when they can't **afford** it. [E] In my family, we used to spend a lot on presents, until we decided to do a secret gift exchange with a small price limit. Suddenly the gifts became more creative and **meaningful**, and everyone was less stressed. [C] So I think the best holidays are about time together, not about **splurging**.",
        f: ["What is the best gift you've received that didn't cost much?", "Would you prefer experiences instead of gifts?"], lx: ["materialistic", "splurge", "meaningful"] },
      { t: "opinion", src: "Платформа · Shopping Habits", q: "Is it important for consumers to consider the environmental or ethical impact of what they buy? Do you try to make sustainable choices?", model5: "[A] Yes, I think it's important, and I make an effort, although I'm far from perfect. [R] Every purchase sends a signal to companies: if enough people stop buying from brands that pollute or exploit workers, those brands will eventually be forced to change. [E] I now buy most of my clothes **second-hand**, carry a reusable bottle and avoid brands I know to be unethical. Admittedly, **sustainable** products tend to be more expensive, which makes it challenging on a student budget. [C] Even so, I'm convinced that small, consistent choices make a real difference when enough people make them.", model: "[A] Yes, I think it's important, and I try, although I'm not perfect. [R] Our choices send a message to companies — if people stop buying from brands that pollute or treat workers badly, those brands have to change. [E] For example, I now buy most of my clothes **second-hand**, I carry a reusable bottle, and I avoid brands that I know are unethical. **That said**, **sustainable** products are often more expensive, so it's not always easy for students. [C] So I do what I can, and I think small choices still matter.",
        f: ["Would you pay twenty percent more for an eco-friendly product?", "Is this the consumer's job or the government's?"], lx: ["sustainable", "ethical", "eco-friendly"] },
      { t: "experience", src: "Платформа · Clothing & Identity", q: "Have you ever bought second-hand clothes or other items? Would you recommend it?", model5: "[A] Yes, regularly — and I'd recommend it wholeheartedly. [R] **Second-hand** shopping is a **budget-friendly option**, it's better for the environment, and you often come across unique pieces that nobody else owns. [E] My favorite winter coat came from a **thrift** store for just fifteen dollars, and people constantly ask me where I got it. I also bought most of my textbooks used, which saved me hundreds of dollars over the year. [C] The only thing I'd steer clear of is second-hand electronics without a warranty; for clothes and books, though, it's an excellent choice.", model: "[A] Yes, all the time, and I'd definitely recommend it. [R] **Second-hand** shopping is a **budget-friendly option**, it's better for the environment, and you often find unique things that nobody else has. [E] My favorite winter coat is from a **thrift** store — it cost me fifteen dollars, and people constantly ask where I bought it. I also bought most of my textbooks used, which saved me hundreds of dollars. [C] The only thing I'd avoid is second-hand electronics without a warranty, but for clothes and books, it's a great choice.",
        f: ["What would you never buy second-hand?", "Why do some people feel embarrassed about it?"], lx: ["second-hand", "budget-friendly option", "thrifty"] },
      { t: "compare", q: "Is renting or borrowing things — like tools, clothes or cars — better than owning them?", model5: "[A] For many items, I'd argue that renting or borrowing is actually the smarter choice. [R] There's little point in buying a drill you'll use twice a year or a suit for a single wedding — renting saves money, space and resources. **That said**, for things you use every day, ownership still makes more sense. [E] Last month, for example, I needed a car for a weekend trip, so I used a car-sharing app. It cost me forty dollars, whereas owning a car would mean paying for insurance, parking and repairs every single month. [C] The rule I follow is simple: rent what you rarely use, and own what you rely on daily.", model: "[A] For many things, I think renting or borrowing is actually smarter. [R] Why buy a drill you'll use twice a year, or a suit for one wedding? Renting saves money, space and resources. **That said**, for things you use every day, owning is still better. [E] Last month I needed a car for a weekend trip, so I used a car-sharing app instead of buying one. It cost me forty dollars, while owning a car would mean insurance, parking and repairs every month. [C] So rent what you rarely use, and own what you use daily.",
        f: ["What do you think everyone should own?", "Would you use a sharing app in your neighborhood?"], lx: ["sharing economy", "own", "trade-off"] }
    ]},
    { icon: "landmark", title: "Общественные деньги", en: "Public money", questions: [
      { t: "opinion", src: "Official 054 / 117", q: "Some people believe that local governments should spend more money on public parks because they promote community health and well-being. Do you agree or disagree? Why?", model5: "[A] I agree that local governments should invest more in parks. [R] Parks are one of the few public spaces that are genuinely free for everyone, and they encourage people to stay active, unwind and connect with their neighbors — all of which benefits public health and **well-being**. [E] In my neighborhood, a neglected empty lot was recently turned into a park with a playground and running paths. These days, it's full every evening with families, students and older residents, and it has completely transformed the atmosphere of the area. [C] For that reason, I consider parks one of the best possible uses of **taxpayers'** money.", model: "[A] I agree that governments should invest more in parks. [R] Parks are one of the few places that are free for everyone, and they help people stay active, reduce stress and meet their neighbors. That's good for public health and **well-being**. [E] In my neighborhood, a small abandoned area was turned into a park with a playground and running paths. Now it's full every evening — families, students, older people. It completely changed the atmosphere of the area. [C] So I think it's one of the best ways to spend **taxpayers'** money.",
        f: ["What else could that money be spent on?", "Should parks charge a small entrance fee?"], lx: ["public funding", "well-being", "taxpayers"] },
      { t: "opinion", src: "Mock", q: "Some people believe that museums should be free for everyone, even if this means they have less money for new exhibitions. Do you agree or disagree? Why?", model5: "[A] I mostly agree that museums should be free, at least for students and children. [R] Culture and history ought to be **accessible** to everyone, not only to those who can afford a ticket. Nevertheless, museums need **funding** to stay engaging, so the money has to come from somewhere. [E] In London, for instance, many major museums are free of charge, and they're always full of young people and families. Their costs are covered largely by government funding and private donations. [C] Therefore, I believe free entry is perfectly achievable, provided that governments and donors share the financial burden.", model: "[A] I mostly agree that museums should be free, at least for students and children. [R] Culture and history should be **accessible** to everyone, not only to people who can afford a ticket. **That said**, museums need **funding** to stay interesting, so the money has to come from somewhere. [E] In London, for example, many big museums are free, and they're always full of young people and families. They're funded by the government and donations. [C] So I think free entry is possible if governments and private donors share the cost.",
        f: ["Would you visit museums more often if they were free?", "Who should pay for culture?"], lx: ["free admission", "funding", "accessible"] },
