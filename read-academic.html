<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Passages — TOEFL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 px-4 py-6 h-screen sticky top-0">
        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span><span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>
        <nav class="flex-1 space-y-1">
            <a href="index.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition"><i data-lucide="home" class="w-5 h-5"></i><span class="text-sm font-medium">Dashboard</span></a>
            <a href="vocabulary.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition"><i data-lucide="book-open" class="w-5 h-5"></i><span class="text-sm font-medium">Vocabulary</span></a>
            <div class="pt-6 pb-2 px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider">Practice</div>
            <a href="reading.html" class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900 text-white font-medium shadow-sm"><i data-lucide="book-text" class="w-5 h-5"></i><span class="text-sm">Reading</span></a>
        </nav>
    </aside>

    <main class="flex-1 p-6 overflow-y-auto bg-[#f8f9fa] pb-24 md:pb-6">
        <div class="max-w-4xl mx-auto">
            <a href="reading.html" class="inline-flex items-center text-xs font-bold text-gray-400 hover:text-indigo-600 mb-6 transition uppercase tracking-wider">
                <i data-lucide="arrow-left" class="w-3 h-3 mr-1"></i> Back to Reading
            </a>

            <div class="mb-8">
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Academic Reading Passages</h1>
                <p class="text-sm text-gray-500 mt-1">Advanced long-form texts reflecting authentic TOEFL university-level content.</p>
            </div>

            <div id="testList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p id="loadingMsg" class="text-sm font-medium text-gray-500">Loading academic tests...</p>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const testListContainer = document.getElementById('testList');
        const loadingMsg = document.getElementById('loadingMsg');

        // 1. Единая настройка базы данных
        function getDatabaseClient() {
            if (typeof supabaseClient !== 'undefined') return supabaseClient;
            if (typeof window !== 'undefined' && window.supabaseClient) return window.supabaseClient;
            
            const fallbackUrl = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
            const fallbackKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
            return window.supabase.createClient(fallbackUrl, fallbackKey);
        }

        const db = getDatabaseClient();
        let currentUser = null;

        // 2. Инициализация и проверка авторизации
        async function initPage() {
            try {
                if (typeof requireAuth !== 'function') {
                    throw new Error("Функция requireAuth не найдена. Убедитесь, что auth.js подключен.");
                }
                currentUser = await requireAuth();
                if (currentUser) {
                    await loadTests();
                }
            } catch (err) {
                console.error("Initialization error:", err);
                if (loadingMsg) {
                    loadingMsg.innerHTML = `<span class="text-red-600 font-bold">Authorization required.</span> Please log in.`;
                }
            }
        }

        // 3. Безопасный сброс результатов
        window.resetAcademicTest = async function(id, title) {
            if (!currentUser || !db) return;

            if (confirm(`Are you sure you want to reset the results for "${title}"?`)) {
                try {
                    // Удаляем только академический результат конкретного студента
                    const { error } = await db
                        .from('reading_results')
                        .delete()
                        .eq('task_id', id)
                        .eq('task_type', 'academic')
                        .eq('user_id', currentUser.id);

                    if (error) throw error;
                    
                    await loadTests(); // Перезагружаем карточки
                } catch (err) {
                    console.error("Error resetting academic test:", err.message);
                    alert("Failed to reset progress. Please try again.");
                }
            }
        };

        // 4. Загрузка академических тестов и результатов из БД
        async function loadTests() {
            try {
                let userResults = {}; 

                if (!db) throw new Error("Database client not found");

                // Запрашиваем список академических заданий, исключая тесты только для mock (is_mock_only = true)
                const { data: tasksData, error: tasksError } = await db
                    .from('academic_tasks')
                    .select('id, title, category, questions_count, is_mock_only, is_real_toefl')
                    .eq('is_mock_only', false)
                    .order('id', { ascending: true });

                if (tasksError) throw tasksError;

                // Запрашиваем результаты текущего пользователя для академических тестов
                if (currentUser) {
                    const { data: resultsData, error: resultsError } = await db
                        .from('reading_results')
                        .select('task_id, score_earned, score_total')
                        .eq('user_id', currentUser.id)
                        .eq('task_type', 'academic');

                    if (!resultsError && resultsData) {
                        resultsData.forEach(res => {
                            userResults[res.task_id] = res;
                        });
                    }
                }

                testListContainer.innerHTML = '';

                // Отрисовка
                tasksData.forEach((test, index) => { 
                    const matchedResult = userResults[test.id];
                    let savedScore = null;

                    // Высчитываем процент правильных ответов
                    if (matchedResult && matchedResult.score_total > 0) {
                        savedScore = Math.round((matchedResult.score_earned / matchedResult.score_total) * 100);
                    }

                    let actionButton = '';
                    let scoreDisplay = '';

                    if (savedScore !== null) {
                        const scoreNum = savedScore;
                        
                        let strokeColor = 'stroke-emerald-500';
                        if (scoreNum < 50) strokeColor = 'stroke-rose-500';
                        else if (scoreNum < 75) strokeColor = 'stroke-amber-500';

                        scoreDisplay = `
                            <div class="relative flex items-center justify-center w-10 h-10 shrink-0">
                                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                    <path class="stroke-slate-100" stroke-width="3" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path class="${strokeColor} transition-all duration-500" stroke-width="3" stroke-dasharray="${scoreNum}, 100" stroke-linecap="round" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <span class="absolute text-[10px] font-black text-slate-800">${scoreNum}%</span>
                            </div>
                        `;

                        actionButton = `
                            <a href="read-academic-task.html?id=${test.id}&mode=review" class="text-xs font-bold text-indigo-700 bg-indigo-50 border border-indigo-100 px-4 py-2 rounded-xl hover:bg-indigo-100 transition flex items-center justify-center w-full mt-auto shadow-xs">
                                Review Results <i data-lucide="eye" class="w-3.5 h-3.5 ml-1.5"></i>
                            </a>
                        `;
                    } else {
                        scoreDisplay = `
                            <span class="text-[9px] font-bold text-indigo-600 uppercase tracking-widest bg-indigo-50 px-2 py-0.5 rounded-md border border-indigo-100/40">
                                ${test.category}
                            </span>
                        `;

                        actionButton = `
                            <a href="read-academic-task.html?id=${test.id}" class="text-xs font-bold text-white bg-slate-900 px-4 py-2 rounded-xl hover:bg-indigo-600 transition flex items-center justify-center w-full mt-auto shadow-sm">
                                Start Academic Practice <i data-lucide="arrow-right" class="w-3.5 h-3.5 ml-1.5"></i>
                            </a>
                        `;
                    }

                    const escapedTitle = test.title.replace(/'/g, "\\'").replace(/"/g, '\\"');

                    // Плашка-этикетка для заданий, реально встречавшихся на настоящем TOEFL
                    const realToeflRibbon = test.is_real_toefl
                        ? `<div class="absolute top-[15px] right-[-38px] w-[150px] rotate-45 bg-violet-600 text-white text-[9px] font-extrabold tracking-[0.15em] text-center py-1 shadow-sm z-10">TOEFL</div>`
                        : '';
                    // Сразу закладываем отступ справа у верхней строки, чтобы "Test #X" не залезал под ленту
                    const headerRightPadding = test.is_real_toefl ? 'pr-12' : '';

                    testListContainer.innerHTML += `
                        <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col group hover:border-indigo-200 hover:shadow-md transition relative overflow-hidden">
                            ${realToeflRibbon}
                            <div class="flex justify-between items-start mb-4 ${headerRightPadding}">
                                ${savedScore !== null ? `
                                    <div class="flex flex-col">
                                        <span class="text-[9px] font-bold text-indigo-600 uppercase tracking-widest bg-indigo-50 px-2 py-0.5 rounded-md border border-indigo-100/40 self-start mb-1">${test.category}</span>
                                        <div class="flex items-center space-x-2 mt-0.5">
                                            <span class="text-[10px] font-bold text-emerald-600 flex items-center"><i data-lucide="check" class="w-3 h-3 mr-0.5"></i> Completed</span>
                                            <button onclick="resetAcademicTest(${test.id}, '${escapedTitle}')" class="text-gray-400 hover:text-rose-500 transition p-0.5 rounded-md hover:bg-gray-50" title="Reset results">
                                                <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                                            </button>
                                        </div>
                                    </div>
                                ` : scoreDisplay}
                                
                                <div class="flex items-center space-x-2">
                                    ${savedScore !== null ? scoreDisplay : ''}
                                    <span class="text-[11px] font-medium text-gray-300 whitespace-nowrap ml-1">Test #${index + 1}</span>
                                </div>
                            </div>
                            
                            <h3 class="text-sm font-bold text-slate-900 mb-1 group-hover:text-indigo-600 transition tracking-tight">${test.title}</h3>
                            <p class="text-[11px] text-gray-500 mb-5">${test.questions_count} Questions • Advanced Level</p>
                            
                            ${actionButton}
                        </div>
                    `;
                });
                lucide.createIcons();
            } catch (err) {
                if (loadingMsg) {
                    loadingMsg.innerHTML = `<span class="text-red-600 font-bold">Error:</span> ${err.message}`;
                }
            }
        }

        // Запуск
        initPage();
    </script>
</body>
</html>
