<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening Mini Mock Tests — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="auth.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row" id="mainBody">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 px-4 py-6 h-screen sticky top-0 shrink-0">
        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span><span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>
        
        <nav class="flex-1 space-y-1">
            <a href="index.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-sm font-medium">Dashboard</span>
            </a>
            <a href="vocabulary.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                <i data-lucide="book-open" class="w-5 h-5"></i>
                <span class="text-sm font-medium">Vocabulary</span>
            </a>
            <a href="reading.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                <i data-lucide="book-text" class="w-5 h-5"></i>
                <span class="text-sm">Reading</span>
            </a>
            <a href="listening.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                <i data-lucide="headphones" class="w-5 h-5"></i>
                <span class="text-sm">Listening</span>
            </a>
            <a href="tests.html" class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900 text-white font-medium shadow-sm">
                <i data-lucide="file-check" class="w-5 h-5"></i>
                <span class="text-sm">Mock Tests</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-6 lg:p-10 overflow-y-auto">
        <div class="max-w-6xl mx-auto">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Listening Mini Mocks</h1>
                <p class="text-sm text-gray-500 mt-1">Practice with full-length simulations to test your stamina.</p>
            </div>

            <div id="testsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div id="loadingState" class="col-span-full py-12 flex flex-col items-center justify-center text-gray-400">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-4 text-blue-500"></i>
                    <p class="text-sm font-medium">Loading your tests...</p>
                </div>
            </div>
        </div>
    </main>

    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around py-2 z-40">
        <a href="index.html" class="flex flex-col items-center text-gray-400"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[9px] mt-1 font-medium">Home</span></a>
        <a href="vocabulary.html" class="flex flex-col items-center text-gray-400"><i data-lucide="book-open" class="w-5 h-5"></i><span class="text-[9px] mt-1 font-medium">Vocab</span></a>
        <a href="reading.html" class="flex flex-col items-center text-gray-400"><i data-lucide="book-text" class="w-5 h-5"></i><span class="text-[9px] mt-1 font-medium">Reading</span></a>
        <a href="listening.html" class="flex flex-col items-center text-gray-400"><i data-lucide="headphones" class="w-5 h-5"></i><span class="text-[9px] mt-1 font-medium">Listen</span></a>
        <a href="tests.html" class="flex flex-col items-center text-slate-900"><i data-lucide="file-check" class="w-5 h-5"></i><span class="text-[9px] mt-1 font-bold">Tests</span></a>
    </nav>

    <script>
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
        
        function getDatabaseClient() {
            if (typeof supabaseClient !== 'undefined') return supabaseClient;
            if (typeof window !== 'undefined' && window.supabaseClient) return window.supabaseClient;
            return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        const db = getDatabaseClient();
        let currentUser = null;

        async function initPage() {
            try {
                // Пробуем получить пользователя, но не блокируем загрузку тестов, если его нет
                // (чтобы страница загрузилась в любом случае)
                if (typeof window.requireAuth === 'function') {
                    try {
                        currentUser = await window.requireAuth();
                    } catch (e) {
                        console.warn("Auth check failed, but continuing load:", e);
                    }
                } else {
                    const { data: { session } } = await db.auth.getSession();
                    if (session) {
                        currentUser = session.user;
                    }
                }
                
                await loadMockTests();
                
            } catch (err) {
                console.error("Initialization error:", err);
                showError("Initialization error: " + err.message);
            }
        }

        function showError(message) {
            const loader = document.getElementById('loadingState');
            if(loader) loader.style.display = 'none';
            
            const grid = document.getElementById('testsGrid');
            grid.innerHTML = `
                <div class="col-span-full py-6 px-4 bg-red-50 border border-red-200 rounded-xl text-center">
                    <p class="text-sm font-bold text-red-600 mb-1">Oops, something went wrong</p>
                    <p class="text-xs text-red-500">${message}</p>
                </div>
            `;
        }

        async function loadMockTests() {
            const grid = document.getElementById('testsGrid');
            const loader = document.getElementById('loadingState');

            try {
                // Обращаемся к правильной таблице
                const { data: tests, error } = await db
                    .from('mock_tests_listening') 
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) throw error;

                if (loader) loader.style.display = 'none';

                if (!tests || tests.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full py-12 text-center text-gray-400 bg-white rounded-2xl border border-dashed border-gray-200">
                            <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                            <p class="text-sm font-medium">No tests found in the database.</p>
                        </div>`;
                    lucide.createIcons();
                    return;
                }

                grid.innerHTML = '';

                tests.forEach((test, index) => {
                    // Используем поля title и description (с фоллбэком, если их нет в БД)
                    const testTitle = test.title || `Listening Mock #${index + 1}`;
                    const testDesc = test.description || 'Full-length listening simulation.';
                    
                    const card = `
                    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col hover:shadow-md transition">
                        <div class="flex items-center justify-between mb-4">
                            <span class="bg-blue-50 text-blue-600 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase tracking-wider">Mock Test</span>
                            <div class="flex items-center text-xs font-bold text-slate-400">
                                <i data-lucide="headphones" class="w-3.5 h-3.5 mr-1"></i> Audio
                            </div>
                        </div>
                        
                        <h3 class="font-bold text-slate-800 text-lg mb-2">${testTitle}</h3>
                        <p class="text-xs text-slate-500 mb-6 flex-1 line-clamp-2">${testDesc}</p>
                        
                        <div class="mt-auto pt-4 border-t border-slate-100 flex items-center justify-between">
                            <div class="text-sm font-bold text-slate-400">Ready</div>
                            <a href="mock-test-view.html?id=${test.id}" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition-colors flex items-center">
                                Start <i data-lucide="arrow-right" class="w-3 h-3 ml-1"></i>
                            </a>
                        </div>
                    </div>`;
                    
                    grid.innerHTML += card;
                });

                lucide.createIcons();

            } catch (err) {
                console.error("Error loading tests from Supabase:", err);
                showError("Failed to fetch data from database: " + err.message);
            }
        }

        // Запускаем скрипт после того, как DOM полностью построен
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons(); // Рисуем иконки бокового меню сразу
            initPage();
        });
    </script>
</body>
</html>
