<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening Mini Mock Tests — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="auth.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row" id="mainBody">

    <div id="app-sidebar"></div>
    <script src="nav.js"></script>

    <main class="flex-1 p-6 lg:p-10 overflow-y-auto">
        <div class="max-w-6xl mx-auto">
            <a href="listening.html" class="inline-flex items-center text-xs font-bold text-gray-400 hover:text-indigo-600 mb-6 transition uppercase tracking-wider">
                <i data-lucide="arrow-left" class="w-3 h-3 mr-1"></i> Back to Listening
            </a>

            <div class="mb-8">
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Listening Mini Mocks</h1>
                <p class="text-sm text-gray-500 mt-1">Practice with full-length simulations to test your stamina.</p>
            </div>

            <div id="testsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div id="loadingState" class="col-span-full py-12 flex flex-col items-center justify-center text-gray-400">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-4 text-blue-500"></i>
                    <p class="text-sm font-medium">Loading your tests...</p>
                </div>
            </div>
        </div>
    </main>


    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            
            const loader = document.getElementById('loadingState');
            const grid = document.getElementById('testsGrid');

            try {
                // Один клиент на страницу — тот, что создал auth.js
                const db = window.supabaseClient;
                if (typeof requireAuth !== 'function' || !db) throw new Error('Page failed to load. Please refresh it.');

                // 1. Пользователь. requireAuth проверяет и вход, и доступ к Listening —
                // раньше страница проверяла только сессию.
                const user = await requireAuth();
                if (!user) return;

                // Досылаем попытки, которые не сохранились в прошлый раз (их кладёт плеер)
                const pendingKey = `listening_mm_pending_v1:${user.id}`;
                let pending = [];
                try { pending = JSON.parse(localStorage.getItem(pendingKey)) || []; } catch (e) { pending = []; }
                if (pending.length) {
                    const left = [];
                    for (const row of pending) {
                        const { error } = await db.from('listening_mini_mock_results').insert([row]);
                        if (error) left.push(row);
                    }
                    try { left.length ? localStorage.setItem(pendingKey, JSON.stringify(left)) : localStorage.removeItem(pendingKey); } catch (e) {}
                    pending = left;
                }

                // 2. Получаем тесты — из той же таблицы, что и плеер (listening_mock_tests).
                // Раньше список читал другую (mock_tests_listening) — карточки и плеер могли разойтись.
                const response = await db.from('listening_mock_tests').select('*').order('id', { ascending: true });
                if (response.error) throw response.error;
                const tests = response.data;

                // 3. Получаем результаты текущего пользователя
                const resultsMap = {};
                if (user) {
                    const { data: results, error: resErr } = await db
                        .from('listening_mini_mock_results')
                        .select('*')
                        .eq('user_id', user.id);
                    
                    // Последняя попытка по каждому тесту (с учётом ещё не отправленных)
                    const rowTime = r => Date.parse(r.completed_at || r.updated_at || r.created_at || '') || 0;
                    const isNewer = (a, b) => rowTime(a) > rowTime(b) || (rowTime(a) === rowTime(b) && (Number(a.id) || 0) > (Number(b.id) || 0));
                    ((!resErr && results) ? results : []).concat(pending).forEach(r => {
                        const k = String(r.mock_test_id);
                        if (!resultsMap[k] || isNewer(r, resultsMap[k])) resultsMap[k] = r;
                    });
                }

                if (loader) loader.style.display = 'none';

                if (!tests || tests.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full py-12 text-center text-gray-400 bg-white rounded-2xl border border-dashed border-gray-200">
                            <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                            <p class="text-sm font-medium">No tests found in the database.</p>
                        </div>`;
                    lucide.createIcons();
                    return;
                }

                grid.innerHTML = '';

                tests.forEach((test, index) => {
                    const testTitle = test.title || test.name || `Listening Mock #${index + 1}`;
                    const testDesc = test.description || 'Full-length listening simulation.';
                    const duration = test.duration_minutes || 20;
                    
                    const result = resultsMap[String(test.id)];
                    const isCompleted = !!result;

                    let cardContent = '';

                    if (isCompleted) {
                        const bandNum = parseFloat(result.final_calculated_score);
                        const bandScore = isNaN(bandNum) ? '—' : bandNum.toFixed(1);
                        
                        cardContent = `
                            <div class="bg-white p-6 rounded-2xl border border-indigo-100 shadow-sm flex flex-col hover:shadow-md transition relative overflow-hidden group">
                                <div class="absolute top-0 right-0 w-2 h-full bg-emerald-400"></div>
                                <div class="flex items-center justify-between mb-4">
                                    <span class="bg-emerald-50 text-emerald-600 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase tracking-wider flex items-center"><i data-lucide="check" class="w-3 h-3 mr-1"></i> Completed</span>
                                    <div class="flex items-center text-xs font-bold text-slate-400">
                                        <i data-lucide="clock" class="w-3.5 h-3.5 mr-1"></i> ${duration}m
                                    </div>
                                </div>
                                
                                <h3 class="font-bold text-slate-800 text-lg mb-2 pr-4">${testTitle}</h3>
                                
                                <div class="mt-4 mb-6">
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Band Score</p>
                                    <div class="text-3xl font-extrabold text-emerald-500">${bandScore} <span class="text-sm text-slate-300 font-semibold">/ 6.0</span></div>
                                </div>
                                
                                <div class="mt-auto pt-4 border-t border-slate-100 flex items-center justify-between gap-3">
                                    <button onclick="retakeTest('${encodeURIComponent(test.id)}')" class="flex-1 bg-white border border-slate-200 hover:border-slate-300 text-slate-600 hover:bg-slate-50 text-xs font-bold py-2.5 rounded-lg transition-colors flex items-center justify-center">
                                        <i data-lucide="rotate-ccw" class="w-3 h-3 mr-1.5"></i> Retake
                                    </button>
                                    <a href="mock-test-view.html?id=${encodeURIComponent(test.id)}&review=true" class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold py-2.5 rounded-lg transition-colors flex items-center justify-center">
                                        Review <i data-lucide="eye" class="w-3.5 h-3.5 ml-1.5"></i>
                                    </a>
                                </div>
                            </div>
                        `;
                    } else {
                        cardContent = `
                            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col hover:shadow-md transition">
                                <div class="flex items-center justify-between mb-4">
                                    <span class="bg-blue-50 text-blue-600 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase tracking-wider">Mock Test</span>
                                    <div class="flex items-center text-xs font-bold text-slate-400">
                                        <i data-lucide="headphones" class="w-3.5 h-3.5 mr-1"></i> Audio
                                    </div>
                                </div>
                                
                                <h3 class="font-bold text-slate-800 text-lg mb-2">${testTitle}</h3>
                                <p class="text-xs text-slate-500 mb-6 flex-1 line-clamp-2">${testDesc}</p>
                                
                                <div class="mt-auto pt-4 border-t border-slate-100 flex items-center justify-between">
                                    <div class="text-sm font-bold text-slate-400">Ready</div>
                                    <a href="mock-test-view.html?id=${encodeURIComponent(test.id)}" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition-colors flex items-center">
                                        Start <i data-lucide="arrow-right" class="w-3 h-3 ml-1"></i>
                                    </a>
                                </div>
                            </div>
                        `;
                    }
                    
                    grid.innerHTML += cardContent;
                });

                lucide.createIcons();

            } catch (err) {
                console.error("Fetch Error:", err);
                if (loader) loader.style.display = 'none';
                grid.innerHTML = `
                    <div class="col-span-full py-6 px-4 bg-red-50 border border-red-200 rounded-xl text-center">
                        <p class="text-sm font-bold text-red-600 mb-1">Oops, an error occurred</p>
                        <p class="text-xs text-red-500" id="mmListError"></p>
                    </div>`;
                const el = document.getElementById('mmListError');
                if (el) el.textContent = err.message || String(err);
            }
        });

        // Функция пересдачи теста
        function retakeTest(testId) {
            if(confirm("Start a new attempt? Your previous score will remain in the database, but this will launch a fresh test.")) {
                window.location.href = `mock-test-view.html?id=${testId}`;
            }
        }
    </script>
</body>
</html>
