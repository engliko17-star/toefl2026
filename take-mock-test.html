<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mock Test — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <style>
        /* Сюда нужно скопировать все твои кастомные стили из трех файлов */
        /* .custom-scrollbar, .puzzle-word, .letter-input, .clickable-sentence и т.д. */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .timer-warning { color: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 m-0 p-0 flex flex-col h-[100dvh] overflow-hidden">

    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0 z-10 shadow-sm">
        <div class="flex items-center space-x-4">
            <h1 id="testTitle" class="text-sm font-bold text-slate-900">Loading Test...</h1>
        </div>
        
        <div class="flex items-center space-x-6">
            <div id="globalTimer" class="flex items-center space-x-2 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 shadow-xs">
                <i data-lucide="timer" class="w-4 h-4 text-slate-500"></i>
                <span id="timerText" class="text-sm font-black text-slate-700 tracking-wider">00:00</span>
            </div>

            <span class="text-gray-300 block">|</span>

            <div class="flex items-center space-x-3 text-sm font-bold text-slate-500">
                <span id="globalProgress">0 / 0</span>
            </div>

            <div class="flex items-center space-x-3">
                <button id="btnNext" class="px-5 py-2.5 rounded-lg bg-slate-900 text-white text-xs font-bold hover:bg-indigo-600 transition flex items-center shadow-xs cursor-pointer">
                    Next <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="mainContainer" class="flex flex-col md:flex-row flex-1 min-h-0 overflow-hidden w-full transition-all duration-300">
        
        <section id="leftPanel" class="w-full md:w-1/2 bg-white border-b md:border-b-0 md:border-r border-gray-200 p-6 md:p-8 lg:p-12 overflow-y-auto h-full custom-scrollbar transition-all duration-300">
            <div id="leftContent" class="text-slate-700 leading-relaxed text-sm">
                </div>
        </section>

        <section id="rightPanel" class="w-full md:w-1/2 bg-[#f8f9fa] p-6 md:p-8 lg:p-12 overflow-y-auto h-full custom-scrollbar transition-all duration-300">
            <div id="rightContent" class="w-full space-y-4">
                </div>
        </section>
        
    </main>

    <script>
        lucide.createIcons();

        // 1. Глобальные переменные состояния
        let testInfo = null;
        let questions = [];
        let currentIdx = 0;
        let userAnswers = {};
        let timeRemaining = 0;
        let timerInterval = null;

        // Элементы DOM
        const timerText = document.getElementById('timerText');
        const timerContainer = document.getElementById('globalTimer');
        const leftPanel = document.getElementById('leftPanel');
        const rightPanel = document.getElementById('rightPanel');
        const leftContent = document.getElementById('leftContent');
        const rightContent = document.getElementById('rightContent');
        const btnNext = document.getElementById('btnNext');
        const globalProgress = document.getElementById('globalProgress');

        // Инициализация базы данных (твой стандартный код)
        const db = window.supabase.createClient('https://gmsdixqjhlycovsgwbzq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ'); // Замени на свои ключи

        // 2. Запуск приложения
        async function bootTest() {
            const urlParams = new URLSearchParams(window.location.search);
            const testId = urlParams.get('id');

            // Получаем инфу о тесте
            const { data: testData } = await db.from('mock_tests').select('*').eq('id', testId).single();
            testInfo = testData;
            timeRemaining = testInfo.total_time_seconds;
            document.getElementById('testTitle').innerText = testInfo.title;

            // Получаем все вопросы, жестко отсортированные по order_index
            const { data: qData } = await db.from('mock_questions')
                                            .select('*')
                                            .eq('test_id', testId)
                                            .order('order_index', { ascending: true });
            questions = qData;
            
            startTimer();
            renderCurrentQuestion();
        }

        // 3. Логика Таймера
        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    forceSubmitTest(); // Время вышло - принудительно сдаем тест
                    return;
                }
                
                timeRemaining--;
                
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timerText.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                // Визуальное предупреждение за 3 минуты до конца
                if (timeRemaining < 180) {
                    timerContainer.classList.add('timer-warning', 'border-red-300', 'bg-red-50');
                    timerText.classList.replace('text-slate-700', 'text-red-600');
                    timerContainer.querySelector('i').classList.replace('text-slate-500', 'text-red-500');
                }
            }, 1000);
        }

        // 4. Роутер отображения интерфейса (Хамелеон)
        function renderCurrentQuestion() {
            const q = questions[currentIdx];
            globalProgress.innerText = `${currentIdx + 1} / ${questions.length}`;

            // Сбрасываем классы колонок
            leftPanel.className = "w-full md:w-1/2 bg-white border-b md:border-b-0 md:border-r border-gray-200 p-6 md:p-8 lg:p-12 overflow-y-auto h-full custom-scrollbar transition-all duration-300";
            rightPanel.classList.remove('hidden');

            if (q.stage === 'sentence') {
                renderSentenceLayout(q);
            } else if (q.stage === 'daily') {
                renderDailyLayout(q);
            } else if (q.stage === 'academic') {
                renderAcademicLayout(q);
            }

            // Обновляем иконки
            lucide.createIcons();
        }

        // --- ФУНКЦИИ ОТРИСОВКИ ДЛЯ КАЖДОГО ТИПА (Здесь используется твой код) ---

        function renderSentenceLayout(q) {
            // Прячем правую колонку, делаем левую на 100% ширины
            rightPanel.classList.add('hidden');
            leftPanel.classList.replace('md:w-1/2', 'w-full');
            leftPanel.classList.add('flex', 'items-center', 'justify-center', 'bg-[#f8f9fa]');

            // Твой алгоритм парсинга скобок для инпутов
            const htmlWithInputs = q.passage_text.replace(/((?:\[.\])+)/g, function(match) {
                /* ... твой код генерации инпутов из complete-words.html ... */
                return `<span class="letters-container">...</span>`; 
            });

            leftContent.innerHTML = `
                <div class="bg-white p-10 rounded-3xl border border-gray-100 shadow-sm max-w-3xl w-full text-[16px] leading-[2.3]">
                    ${htmlWithInputs}
                </div>
            `;
            // Не забудь вызвать setupInputs() для переключения фокуса!
        }

        function renderDailyLayout(q) {
            // Левая колонка - дизайн текста (email, notice и тд)
            leftContent.innerHTML = `
                <h2 class="text-xl font-bold mb-4">Reading Passage</h2>
                <div class="bg-slate-50 p-6 rounded-xl border border-slate-200">
                    ${q.passage_text} 
                </div>
            `;

            // Правая колонка - радиокнопки
            renderStandardQuiz(q);
        }

        function renderAcademicLayout(q) {
             // Левая колонка - интерактивный текст с clickable-sentence
             leftContent.innerHTML = `
                <h2 class="text-xl font-bold mb-4">Academic Text</h2>
                ${q.passage_text} 
            `;

            // Правая колонка
            renderStandardQuiz(q);
            
            // Здесь добавь вызов setupInteractiveClicks() из твоеного академического файла
        }

    <script>
        lucide.createIcons();

        // 1. Глобальные переменные состояния
        let testInfo = null;
        let questions = [];
        let currentIdx = 0;
        let userAnswers = {};
        let timeRemaining = 0;
        let timerInterval = null;
        let currentUser = null;

        // Элементы DOM
        const timerText = document.getElementById('timerText');
        const timerContainer = document.getElementById('globalTimer');
        const leftPanel = document.getElementById('leftPanel');
        const rightPanel = document.getElementById('rightPanel');
        const leftContent = document.getElementById('leftContent');
        const rightContent = document.getElementById('rightContent');
        const btnNext = document.getElementById('btnNext');
        const globalProgress = document.getElementById('globalProgress');

        // Инициализация базы данных (используем твою надежную функцию)
        function getDatabaseClient() {
            if (typeof supabaseClient !== 'undefined') return supabaseClient;
            if (typeof window !== 'undefined' && window.supabaseClient) return window.supabaseClient;
            
            const fallbackUrl = 'https://gmsdixqjhlycovsgwbzq.supabase.co'; // ВСТАВЬ СВОИ ДАННЫЕ ИЛИ УДАЛИ ЭТИ СТРОКИ, ЕСЛИ ОНИ В auth.js
            const fallbackKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
            return window.supabase.createClient(fallbackUrl, fallbackKey);
        }
        const db = getDatabaseClient();

        // 2. Запуск приложения (с проверкой авторизации)
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                if (typeof requireAuth !== 'function') throw new Error("Функция requireAuth не найдена.");
                currentUser = await requireAuth();
                if (currentUser) bootTest();
            } catch (err) {
                console.error("Auth error:", err);
                document.getElementById('testTitle').innerText = "Auth Error";
            }
        });

        async function bootTest() {
            const urlParams = new URLSearchParams(window.location.search);
            const testId = urlParams.get('id');

            if (!testId) {
                document.getElementById('testTitle').innerText = "No Test ID";
                return;
            }

            try {
                // Получаем инфу о тесте
                const { data: testData, error: testError } = await db.from('mock_tests').select('*').eq('id', testId).single();
                if (testError) throw testError;
                
                testInfo = testData;
                timeRemaining = testInfo.total_time_seconds || 3600;
                document.getElementById('testTitle').innerText = testInfo.title;

                // Получаем все вопросы
                const { data: qData, error: qError } = await db.from('mock_questions')
                                                .select('*')
                                                .eq('test_id', testId)
                                                .order('order_index', { ascending: true });
                if (qError) throw qError;
                
                questions = qData;
                
                if (questions.length === 0) {
                    document.getElementById('testTitle').innerText = "Тест пуст";
                    return;
                }

                startTimer();
                renderCurrentQuestion();
            } catch (err) {
                console.error("Ошибка загрузки:", err);
                document.getElementById('testTitle').innerText = "Error loading data";
            }
        }

        // 3. Логика Таймера
        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    forceSubmitTest(); 
                    return;
                }
                
                timeRemaining--;
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timerText.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                if (timeRemaining < 180) {
                    timerContainer.classList.add('timer-warning', 'border-red-300', 'bg-red-50');
                    timerText.classList.replace('text-slate-700', 'text-red-600');
                    timerContainer.querySelector('i').classList.replace('text-slate-500', 'text-red-500');
                }
            }, 1000);
        }

        // 4. Роутер отображения
        function renderCurrentQuestion() {
            const q = questions[currentIdx];
            globalProgress.innerText = `${currentIdx + 1} / ${questions.length}`;

            // Сбрасываем классы колонок
            leftPanel.className = "w-full md:w-1/2 bg-white border-b md:border-b-0 md:border-r border-gray-200 p-6 md:p-8 lg:p-12 overflow-y-auto h-full custom-scrollbar transition-all duration-300";
            rightPanel.classList.remove('hidden');
            rightPanel.className = "w-full md:w-1/2 bg-[#f8f9fa] p-6 md:p-8 lg:p-12 overflow-y-auto h-full custom-scrollbar transition-all duration-300";

            if (q.stage === 'sentence') {
                renderSentenceLayout(q);
            } else if (q.stage === 'daily') {
                renderDailyLayout(q);
            } else if (q.stage === 'academic') {
                renderAcademicLayout(q);
            }

            lucide.createIcons();
        }

        // --- ФУНКЦИИ ОТРИСОВКИ ---

        function renderSentenceLayout(q) {
            rightPanel.classList.add('hidden');
            leftPanel.classList.replace('md:w-1/2', 'w-full');
            leftPanel.classList.add('flex', 'items-center', 'justify-center', 'bg-[#f8f9fa]');

            // БЕРЕМ ТЕКСТ ИЗ question_text (так как в базе ты сохранила его туда)
            const sourceText = q.question_text || "";

            // Интегрированный алгоритм парсинга скобок
            const htmlWithInputs = sourceText.replace(/\S*(?:\[.\])+\S*/g, function(match) {
                let wordHtml = match.replace(/((?:\[.\])+)/g, function(bracketsBlock) {
                    const letters = bracketsBlock.match(/\[(.)\]/g).map(m => m.replace(/[\[\]]/g, ''));
                    const inputsHtml = letters.map(letter => {
                        return `<input type="text" maxlength="1" data-answer="${letter}" class="letter-input" autocomplete="off">`;
                    }).join('');
                    return `<span class="letters-container">${inputsHtml}</span>`;
                });
                return `<span class="puzzle-word">${wordHtml}</span>`;
            });

            leftContent.innerHTML = `
                <div class="bg-white p-10 rounded-3xl border border-gray-100 shadow-sm max-w-3xl w-full text-[16px] leading-[2.3]">
                    ${htmlWithInputs}
                </div>
            `;
            
            // Активируем логику переключения фокуса между буквами
            setupInputs();
        }

        function setupInputs() {
            const inputs = document.querySelectorAll('.letter-input');
            if(inputs.length > 0) inputs[0].focus(); // Автофокус на первую букву

            inputs.forEach((input, index) => {
                input.addEventListener('input', function() {
                    this.value = this.value.replace(/[^a-zA-Z]/g, '').toLowerCase();
                    if (this.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
        }

        function renderDailyLayout(q) {
            leftContent.innerHTML = `
                <h2 class="text-xl font-bold mb-4">Reading Passage</h2>
                <div class="bg-slate-50 p-6 rounded-xl border border-slate-200">
                    ${q.passage_text || ""} 
                </div>
            `;
            renderStandardQuiz(q);
        }

        function renderAcademicLayout(q) {
             leftContent.innerHTML = `
                <h2 class="text-xl font-bold mb-4">Academic Text</h2>
                <div class="leading-relaxed space-y-4">
                    ${q.passage_text || ""} 
                </div>
            `;
            renderStandardQuiz(q);
        }

        function renderStandardQuiz(q) {
            let options = {};
            try {
                // Защита от ошибки, если options пустой или кривой JSON
                options = q.options ? (typeof q.options === 'string' ? JSON.parse(q.options) : q.options) : {};
            } catch (e) {
                console.error("Ошибка парсинга options:", e);
            }

            let optionsHtml = '';
            
            // Если options это массив (как ты писала ["A", "B"])
            if (Array.isArray(options)) {
                options.forEach((val, idx) => {
                    optionsHtml += `
                        <label class="flex items-center p-3.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer text-sm">
                            <input type="radio" name="mock_option" value="${idx}" class="w-4 h-4 text-indigo-600 mr-3">
                            <span>${val}</span>
                        </label>
                    `;
                });
            } else {
                // Если options это объект
                for (const [key, value] of Object.entries(options)) {
                    optionsHtml += `
                        <label class="flex items-center p-3.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer text-sm">
                            <input type="radio" name="mock_option" value="${key}" class="w-4 h-4 text-indigo-600 mr-3">
                            <span>${value}</span>
                        </label>
                    `;
                }
            }

            rightContent.innerHTML = `
                <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md uppercase tracking-wider mb-4 inline-block">${q.category || 'Practice'}</span>
                <h3 class="text-base font-bold text-slate-900 mb-6">${q.question_text || ""}</h3>
                <div class="space-y-3">${optionsHtml}</div>
            `;
        }

        // 5. Навигация
        btnNext.addEventListener('click', () => {
            // Сохранение ответа перед переходом
            if (questions[currentIdx].stage === 'sentence') {
                const inputs = document.querySelectorAll('.letter-input');
                let wordAnswer = Array.from(inputs).map(i => i.value).join('');
                userAnswers[questions[currentIdx].id] = wordAnswer;
            } else {
                const selected = document.querySelector('input[name="mock_option"]:checked');
                if (selected) userAnswers[questions[currentIdx].id] = selected.value;
            }
            
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                renderCurrentQuestion();
            } else {
                forceSubmitTest();
            }
        });

        function forceSubmitTest() {
            clearInterval(timerInterval);
            console.log("Собранные ответы:", userAnswers);
            alert("Тест завершен! Проверь консоль браузера (F12), чтобы увидеть сохраненные ответы.");
            // Тут потом напишешь отправку в БД
        }
    </script>
</body>
</html>
