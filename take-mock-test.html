<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mock Test — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .timer-warning { color: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Стили для задания Complete Words */
        .letters-container { display: inline-flex; gap: 4px; margin: 0 4px; }
        .letter-input {
            width: 28px; height: 36px;
            text-align: center; font-size: 16px; font-weight: bold;
            border: 2px solid #e2e8f0; border-radius: 6px;
            text-transform: lowercase; outline: none; transition: all 0.2s;
            color: #1e293b; background-color: #f8fafc;
        }
        .letter-input:focus { 
            border-color: #4f46e5; 
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); 
            background-color: #ffffff;
        }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 m-0 p-0 flex flex-col h-[100dvh] overflow-hidden">

    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0 z-10 shadow-sm">
        <div class="flex items-center space-x-4">
            <h1 id="testTitle" class="text-sm font-bold text-slate-900">Loading Test...</h1>
        </div>
        
        <div class="flex items-center space-x-6">
            <div id="globalTimer" class="flex items-center space-x-2 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 shadow-xs">
                <i data-lucide="timer" class="w-4 h-4 text-slate-500"></i>
                <span id="timerText" class="text-sm font-black text-slate-700 tracking-wider">00:00</span>
            </div>

            <span class="text-gray-300 block">|</span>

            <div class="flex items-center space-x-3 text-sm font-bold text-slate-500">
                <span id="globalProgress">0 / 0</span>
            </div>

            <div class="flex items-center space-x-3">
                <button id="btnNext" class="px-5 py-2.5 rounded-lg bg-slate-900 text-white text-xs font-bold hover:bg-indigo-600 transition flex items-center shadow-xs cursor-pointer">
                    Next <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="mainContainer" class="flex flex-col md:flex-row flex-1 min-h-0 overflow-hidden w-full transition-all duration-300">
        
        <section id="leftPanel" class="w-full md:w-1/2 bg-white border-b md:border-b-0 md:border-r border-gray-200 p-6 md:p-8 lg:p-12 overflow-y-auto h-full custom-scrollbar transition-all duration-300">
            <div id="leftContent" class="text-slate-700 leading-relaxed text-sm">
                </div>
        </section>

        <section id="rightPanel" class="w-full md:w-1/2 bg-[#f8f9fa] p-6 md:p-8 lg:p-12 overflow-y-auto h-full custom-scrollbar transition-all duration-300">
            <div id="rightContent" class="w-full space-y-4">
                </div>
        </section>
        
    </main>

    <script>
        lucide.createIcons();

        // 1. Глобальные переменные состояния
        let testInfo = null;
        let questions = [];
        let currentIdx = 0;
        let userAnswers = {};
        let timeRemaining = 0;
        let timerInterval = null;
        let currentUser = null;

        // Элементы DOM
        const timerText = document.getElementById('timerText');
        const timerContainer = document.getElementById('globalTimer');
        const leftPanel = document.getElementById('leftPanel');
        const rightPanel = document.getElementById('rightPanel');
        const leftContent = document.getElementById('leftContent');
        const rightContent = document.getElementById('rightContent');
        const btnNext = document.getElementById('btnNext');
        const globalProgress = document.getElementById('globalProgress');

        // Инициализация базы данных (твои ключи)
        const db = window.supabase.createClient(
            'https://gmsdixqjhlycovsgwbzq.supabase.co', 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ'
        );

        // 2. Запуск приложения 
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                if (typeof requireAuth === 'function') {
                    currentUser = await requireAuth();
                    if (!currentUser) return; // Если не авторизован, auth.js сам перекинет на логин
                }
                bootTest();
            } catch (err) {
                console.error("Auth error:", err);
                // Запускаем тест даже если auth.js не сработал (для удобства твоей разработки)
                bootTest(); 
            }
        });

        async function bootTest() {
            const urlParams = new URLSearchParams(window.location.search);
            const testId = urlParams.get('id');

            if (!testId) {
                document.getElementById('testTitle').innerText = "Test ID is missing in URL";
                return;
            }

            try {
                // Получаем инфу о тесте
                const { data: testData, error: testError } = await db.from('mock_tests').select('*').eq('id', testId).single();
                if (testError) throw testError;
                
                testInfo = testData;
                timeRemaining = testInfo.total_time_seconds || 3600;
                document.getElementById('testTitle').innerText = testInfo.title;

                // Получаем все вопросы
                const { data: qData, error: qError } = await db.from('mock_questions')
                                                .select('*')
                                                .eq('test_id', testId)
                                                .order('order_index', { ascending: true });
                if (qError) throw qError;
                
                questions = qData;
                
                if (questions.length === 0) {
                    document.getElementById('testTitle').innerText = "Тест пуст. Добавьте вопросы в БД.";
                    return;
                }

                startTimer();
                renderCurrentQuestion();
            } catch (err) {
                console.error("Ошибка загрузки:", err);
                document.getElementById('testTitle').innerText = "Error loading data";
            }
        }

        // 3. Логика Таймера
        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    forceSubmitTest(); 
                    return;
                }
                
                timeRemaining--;
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timerText.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                if (timeRemaining < 180) {
                    timerContainer.classList.add('timer-warning', 'border-red-300', 'bg-red-50');
                    timerText.classList.replace('text-slate-700', 'text-red-600');
                    timerContainer.querySelector('i').classList.replace('text-slate-500', 'text-red-500');
                }
            }, 1000);
        }

        // 4. Роутер отображения
        function renderCurrentQuestion() {
            const q = questions[currentIdx];
            globalProgress.innerText = `${currentIdx + 1} / ${questions.length}`;

            // Сбрасываем классы колонок к стандартным (две колонки)
            leftPanel.className = "w-full md:w-1/2 bg-white border-b md:border-b-0 md:border-r border-gray-200 p-6 md:p-8 lg:p-12 overflow-y-auto h-full custom-scrollbar transition-all duration-300";
            rightPanel.classList.remove('hidden');
            rightPanel.className = "w-full md:w-1/2 bg-[#f8f9fa] p-6 md:p-8 lg:p-12 overflow-y-auto h-full custom-scrollbar transition-all duration-300";

            if (q.stage === 'sentence') {
                renderSentenceLayout(q);
            } else if (q.stage === 'daily') {
                renderDailyLayout(q);
            } else if (q.stage === 'academic') {
                renderAcademicLayout(q);
            } else {
                // Фоллбэк, если stage не указан или другой
                renderStandardQuiz(q);
            }

            lucide.createIcons();
        }

        // --- ФУНКЦИИ ОТРИСОВКИ ---

        function renderSentenceLayout(q) {
            // Для слов мы прячем правую панель и растягиваем левую на весь экран
            rightPanel.classList.add('hidden');
            leftPanel.classList.replace('md:w-1/2', 'w-full');
            leftPanel.classList.add('flex', 'items-center', 'justify-center', 'bg-[#f8f9fa]');

            const sourceText = q.question_text || "";

            // Интегрированный алгоритм парсинга скобок (как в твоем тренажере слов)
            const htmlWithInputs = sourceText.replace(/\S*(?:\[.\])+\S*/g, function(match) {
                let wordHtml = match.replace(/((?:\[.\])+)/g, function(bracketsBlock) {
                    const letters = bracketsBlock.match(/\[(.)\]/g).map(m => m.replace(/[\[\]]/g, ''));
                    const inputsHtml = letters.map(letter => {
                        return `<input type="text" maxlength="1" data-answer="${letter}" class="letter-input" autocomplete="off">`;
                    }).join('');
                    return `<span class="letters-container">${inputsHtml}</span>`;
                });
                return `<span class="puzzle-word">${wordHtml}</span>`;
            });

            leftContent.innerHTML = `
                <div class="bg-white p-10 rounded-3xl border border-gray-100 shadow-sm max-w-3xl w-full text-[16px] leading-[2.3]">
                    ${htmlWithInputs}
                </div>
            `;
            
            // Активируем логику переключения фокуса
            setupInputs();
        }

        function setupInputs() {
            const inputs = document.querySelectorAll('.letter-input');
            if(inputs.length > 0) inputs[0].focus(); 

            inputs.forEach((input, index) => {
                input.addEventListener('input', function() {
                    this.value = this.value.replace(/[^a-zA-Z]/g, '').toLowerCase();
                    if (this.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
        }

        function renderDailyLayout(q) {
            leftContent.innerHTML = `
                <h2 class="text-xl font-bold mb-4 text-slate-900">Reading Passage</h2>
                <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 text-slate-700 leading-relaxed">
                    ${q.passage_text || ""} 
                </div>
            `;
            renderStandardQuiz(q);
        }

        function renderAcademicLayout(q) {
             leftContent.innerHTML = `
                <h2 class="text-xl font-bold mb-4 text-slate-900">Academic Text</h2>
                <div class="leading-relaxed space-y-4 text-slate-700">
                    ${q.passage_text || ""} 
                </div>
            `;
            renderStandardQuiz(q);
        }

        function renderStandardQuiz(q) {
            let options = {};
            try {
                if (q.options) {
                    options = typeof q.options === 'string' ? JSON.parse(q.options) : q.options;
                }
            } catch (e) {
                console.error("Ошибка парсинга options:", e);
            }

            let optionsHtml = '';
            
            if (Array.isArray(options)) {
                options.forEach((val, idx) => {
                    optionsHtml += `
                        <label class="flex items-center p-4 rounded-xl border border-slate-200 bg-white hover:border-indigo-300 hover:bg-indigo-50/30 cursor-pointer transition-all duration-200 text-sm shadow-sm">
                            <input type="radio" name="mock_option" value="${idx}" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500 mr-4">
                            <span class="text-slate-700">${val}</span>
                        </label>
                    `;
                });
            } else {
                for (const [key, value] of Object.entries(options)) {
                    optionsHtml += `
                        <label class="flex items-center p-4 rounded-xl border border-slate-200 bg-white hover:border-indigo-300 hover:bg-indigo-50/30 cursor-pointer transition-all duration-200 text-sm shadow-sm">
                            <input type="radio" name="mock_option" value="${key}" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500 mr-4">
                            <span class="text-slate-700">${value}</span>
                        </label>
                    `;
                }
            }

            rightContent.innerHTML = `
                <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md uppercase tracking-wider mb-4 inline-block border border-indigo-100">
                    ${q.category || 'Practice'}
                </span>
                <h3 class="text-lg font-bold text-slate-900 mb-6 leading-snug">${q.question_text || "Choose the correct answer:"}</h3>
                <div class="space-y-3">${optionsHtml}</div>
            `;
        }

        // 5. Навигация
        btnNext.addEventListener('click', () => {
            // Сохранение ответа перед переходом
            if (questions[currentIdx].stage === 'sentence') {
                const inputs = document.querySelectorAll('.letter-input');
                let wordAnswer = Array.from(inputs).map(i => i.value).join('');
                userAnswers[questions[currentIdx].id] = wordAnswer;
            } else {
                const selected = document.querySelector('input[name="mock_option"]:checked');
                if (selected) userAnswers[questions[currentIdx].id] = selected.value;
            }
            
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                renderCurrentQuestion();
            } else {
                forceSubmitTest();
            }
        });

        function forceSubmitTest() {
            clearInterval(timerInterval);
            console.log("Собранные ответы:", userAnswers);
            alert("Тест завершен! Ответы успешно собраны.");
            // Отправка в БД будет здесь
        }
    </script>
</body>
</html>
