          lx: ["play the guitar", "practice", "a creative outlet"],
          model: "[A] Yes, my main hobby is playing the guitar. [R] I started three years ago because I love music, and now it's the best way for me to relax after studying. [E] For example, almost every evening, I **practice** for about half an hour. I learn songs from online videos, and sometimes I play with my roommate, who sings. Last month, I finally learned a difficult song by my favorite band, and I felt really proud. I also go running and hiking, but the guitar is the hobby I do most regularly. [C] So music is a big part of my free time.",
          model5: "[A] Yes, my main hobby is playing the guitar, which I've been doing for about three years now. [R] I took it up because I've always loved music, but it's since become my most reliable way of switching off after a long day of studying — in other words, **a creative outlet**. [E] Most evenings, for instance, I **practice** for around half an hour, usually learning songs from online tutorials, and occasionally my roommate joins in on vocals, with mixed results. Last month, I finally mastered a notoriously difficult piece by my favorite band, which gave me a real sense of achievement. I also run and go hiking, but the guitar is the one thing I do almost daily. [C] So music is very much at the center of my free time." },
        { q: "If you were to select a new hobby, what would you choose and why?",
          lx: ["take up", "pottery", "therapeutic"],
          model: "[A] I would choose pottery. [R] I spend most of my day on screens, so I'd like a hobby where I use my hands and make something real. It also looks very relaxing. [E] For example, my friend started a pottery class last year, and now she makes her own cups and plates. She says that when she works with clay, she forgets about everything else. I saw her first cup — it was a bit strange, but she was so proud of it! [C] So pottery would be a relaxing and creative change from my digital life.",
          model5: "[A] I'd love to **take up** pottery. [R] Since I spend most of my waking hours staring at screens, I'm drawn to a hobby that's entirely hands-on and produces something you can actually hold. From everything I've heard, it's also remarkably **therapeutic**. [E] A friend of mine, for instance, joined a pottery class last year and now makes her own mugs and bowls. She says that once her hands are in the clay, the rest of the world simply disappears. Her first mug was admittedly rather lopsided, yet she was prouder of it than of any exam result. [C] So pottery would offer exactly what my digital life lacks: slowness, creativity and something real to show for my time." },
        { q: "Now tell me what might prevent you from starting this new pastime.",
          lx: ["commitment", "make time for", "beginner"],
          model: "[A] I think the main problems would be time and money. [R] I'm a student with a part-time job, so my week is already very busy. Also, pottery classes are quite expensive, and you need to pay for clay and for using the oven. [E] For example, the pottery studio near my university charges about two hundred dollars for an eight-week course. That's a lot for my budget. And classes are on Tuesday evenings, when I usually work at the café. Maybe I could start in the summer, when I have more free time. [C] So it's possible, but not right now.",
          model5: "[A] Realistically, time and money would be the main obstacles. [R] Between my studies and a part-time job, my week is already fairly packed, and pottery is surprisingly expensive once you factor in materials and the cost of using a kiln. [E] The studio near my campus, for instance, charges around two hundred dollars for an eight-week **beginner** course, which is a significant chunk of a student budget. To make matters worse, its classes run on Tuesday evenings, precisely when I work at the café. I could perhaps start during the summer break, when I'd have more flexibility. [C] So it's not a question of motivation, but of finding the time and money to **make** that **commitment** properly." },
        { q: "Some people believe it is better to have one interest outside of work or school that you dedicate yourself to rather than multiple smaller ones. What do you think about that and why?",
          lx: ["a jack of all trades", "devote time to", "dabble in"],
          model: "[A] I think it's better to have one main interest and maybe one or two smaller ones. [R] When you **devote** a lot of **time to** one hobby, you get really good at it, and that feels great. But having a few different hobbies keeps life interesting and helps you meet different people. [E] For example, the guitar is my main hobby — I practice almost every day, and I've improved a lot. But I also go hiking with friends sometimes, which is good for my health and my social life. My cousin tries ten hobbies a year and isn't good at any of them. [C] So one main hobby plus a little variety is ideal.",
          model5: "[A] I'd argue the ideal is one main passion supported by a couple of lighter interests. [R] **Devoting time to** a single hobby allows you to develop genuine skill, which brings a deep sense of satisfaction. Variety, however, keeps life fresh and exposes you to different people and experiences. [E] The guitar, for instance, is my central hobby; I practice almost daily, and the progress I've made is enormously rewarding. Yet I also go hiking with friends now and then, which benefits both my health and my social life. My cousin, by contrast, **dabbles in** about ten new hobbies a year and, as a result, has never got beyond beginner level in any of them — the classic **jack of all trades**. [C] So depth matters most, but a little breadth keeps it enjoyable." }
      ]},
    { id: "s100", badge: "official", title: "Hobbies and Leisure Activities", src: "Official TOEFL · 100",
      scenario: "You have agreed to participate in a research study about hobbies and leisure activities. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, when you engage in your favorite hobby, do you prefer to do it alone or do you like to do it with your family or friends? Why?",
          lx: ["some time to myself", "the more, the merrier", "concentrate"],
          model: "[A] I usually prefer to do my favorite hobby, playing the guitar, alone. [R] When I'm alone, I can concentrate, make mistakes and practice the same part many times without anyone listening. It's also my quiet time after a busy day. [E] For example, in the evenings, I close the door of my room and practice for half an hour. It's the only time in the day when I have **some time to myself**. But sometimes, on weekends, I play with my roommate, and that's fun too, especially when friends come and sing along. [C] So I mostly enjoy it alone, but sharing it sometimes is nice.",
          model5: "[A] For the guitar, my main hobby, I generally prefer to be alone. [R] Practicing on my own lets me concentrate fully, repeat difficult passages endlessly and make embarrassing mistakes without an audience; it's also one of the few moments in my day when I genuinely **have some time to myself**. [E] Most evenings, for instance, I shut my door and play for half an hour, which acts as a buffer between a hectic day and a calm evening. That said, at weekends I occasionally play with my roommate, and when friends drop by and start singing along, it turns into something quite different and very fun — **the more, the merrier**. [C] So I practice alone but perform, very informally, with others." },
        { q: "And do you think it is better to spend free time indoors like in a movie theater, or outdoors like in a park? Why?",
          lx: ["fresh air", "outdoors", "a cozy night in"],
          model: "[A] I think it's usually better to spend free time **outdoors**. [R] Most of us spend all day inside — at school, at work or at home — so fresh air and nature help us relax and feel healthier. But indoor activities are good in bad weather. [E] For example, on sunny weekends, my friends and I go for picnics in the park or go hiking, and I always feel full of energy afterwards. But in winter, when it's cold and dark, a movie or a board game night at home is a great way to spend time together. [C] So outdoors is my first choice, but it depends on the weather.",
          model5: "[A] Generally speaking, I'd say **outdoors** is better, though it depends heavily on the season. [R] Since most of us spend our working or studying hours indoors, time outside offers **fresh air**, movement and a change of scenery that recharges us in a way indoor activities rarely do. Nevertheless, indoor options have their place. [E] On sunny weekends, for instance, my friends and I head to the park for picnics or out of town for a hike, and I always come back with more energy than I left with. In midwinter, however, when it's dark by four, nothing beats **a cozy night in** with a film or a board game. [C] So I'd choose the outdoors whenever the weather allows, and the cinema when it doesn't." },
        { q: "Many people have the same hobbies as their friends. Do you think it is necessary for good friends to share hobbies? Why or why not?",
          lx: ["share a passion for", "have a lot in common", "friendship"],
          model: "[A] No, I don't think good friends need to share hobbies. [R] Friendship is about trust, support and enjoying time together, not about doing the same activities. Different hobbies can even make friendship more interesting, because you learn new things from each other. [E] For example, my best friend loves painting and theater, and I like sports and music. We don't share many hobbies, but we talk for hours, and she sometimes takes me to the theater while I take her hiking. On the other hand, I **share a passion for** board games with my roommate, and it's fun too. [C] So shared hobbies help, but they're not necessary.",
          model5: "[A] I don't think it's necessary, although shared hobbies can certainly help a friendship begin. [R] Deep friendships rest on trust, support and genuinely enjoying each other's company rather than on identical interests. In fact, different hobbies can enrich a friendship, since each person introduces the other to something new. [E] My best friend, for instance, is passionate about painting and theater, whereas I'm into sport and music. We rarely share activities, yet we can talk for hours, and we regularly drag each other into our worlds — she takes me to plays, and I take her hiking. My roommate and I, meanwhile, **share a passion for** board games, which is great fun but isn't what makes us close. [C] So shared hobbies are a bonus, not a requirement." },
        { q: "Some people believe that having hobbies is essential for being happy. Do you agree with this idea? Or do you think you can live a happy life without having hobbies? Explain your answer.",
          lx: ["sense of achievement", "rewarding", "switch off"],
          model: "[A] I think hobbies are very important for happiness, but you can be happy without a typical hobby. [R] Hobbies help us relax, feel proud and meet people. But some people get the same feelings from their family, their work or simply spending time with friends. [E] For example, I feel much happier on days when I play the guitar or go running — it helps me **switch off** and feel good about myself. But my mother doesn't really have a hobby. She says her happiness comes from her family and her job as a teacher, and she's one of the happiest people I know. [C] So hobbies help, but they're not the only way to be happy.",
          model5: "[A] I'd say hobbies contribute enormously to happiness, but they're not strictly essential. [R] They offer relaxation, a **sense of achievement** and often community, all of which are key ingredients of well-being. Some people, however, find those same things through their family, their work or simply time with loved ones. [E] I'm noticeably happier on days when I play the guitar or go for a run, for instance, because those activities help me **switch off** and feel competent. My mother, by contrast, doesn't really have a hobby in the conventional sense; she finds deep fulfillment in her family and her work as a teacher, and she's genuinely one of the happiest people I know. [C] So hobbies are a wonderful route to happiness, but not the only one." }
      ]},
    { id: "s118", badge: "official", title: "Leisure Activities", src: "Official TOEFL · 118",
      scenario: "You are taking part in a study about leisure activities. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, do you usually spend your leisure or free time indoors or outdoors? Tell me more about that.",
          lx: ["outdoors", "go hiking", "a homebody"],
          model: "[A] I spend my free time both indoors and outdoors, but I try to be outdoors as much as possible. [R] I study inside all week, so on weekends I really want fresh air. But on weekday evenings, I usually stay at home because I'm tired. [E] For example, on weekdays I play the guitar, read or watch a series in my room. But on Saturdays, I go running in the park or **go hiking** with friends outside the city. In summer, we also play volleyball on the beach. [C] So I'm indoors on weekdays and outdoors on weekends.",
          model5: "[A] It's a fairly even split, although I make a conscious effort to get outdoors whenever I can. [R] After a week spent almost entirely inside lecture halls and libraries, I crave fresh air at weekends, whereas on weekday evenings I'm usually too tired for anything more ambitious than staying in. [E] During the week, for instance, my free time revolves around the guitar, a novel or an episode of a series in my room. Saturdays, by contrast, mean a run in the park or a day **hiking** in the hills with friends, and in summer, beach volleyball becomes our weekly ritual. [C] So I'm something of **a homebody** on weekdays and an outdoor person at weekends." },
        { q: "Can you describe one of your favorite leisure activities and explain why you enjoy it?",
          lx: ["go hiking", "be in your element", "switch off"],
          model: "[A] One of my favorite leisure activities is hiking in the mountains with friends. [R] I enjoy it because it combines nature, exercise and good company. When I'm walking in the mountains, I forget about exams and stress. [E] For example, once a month, my friends and I take an early train out of the city and hike for the whole day. Last month we walked twenty kilometers to a beautiful lake, had a picnic and talked for hours. I was tired, but very happy. [C] So hiking is the best way for me to relax and recharge.",
          model5: "[A] One of my absolute favorites is hiking in the mountains with friends. [R] What I love about it is that it combines three things I value — nature, physical effort and good company — and on a trail, worries about exams simply fade away. I'm genuinely **in my element** there. [E] Roughly once a month, for instance, a group of us catches an early train out of the city and spends the entire day hiking. Last month, we covered twenty kilometers to a glacier lake, where we had a long, lazy picnic and talked for hours. I came home exhausted but happier than I'd felt in weeks. [C] So hiking isn't just exercise for me; it's how I **switch off** and recharge." },
        { q: "Do you prefer to engage in the same leisure activities over and over, or do you regularly seek out new activities? Why?",
          lx: ["a creature of habit", "try something new", "comfort zone"],
          model: "[A] I mostly do the same activities, but I try something new a few times a year. [R] My favorite activities, like the guitar and hiking, make me happy, so I don't want to change them. But trying new things keeps life exciting and helps me learn about myself. [E] For example, every week I play the guitar, run and meet friends, which is my routine. But last year I tried rock climbing and salsa dancing for the first time. Salsa wasn't for me, but I loved climbing, and now I go once a month. [C] So I'm a **creature of habit**, but with a little adventure.",
          model5: "[A] I'm largely **a creature of habit**, though I deliberately **try something new** every few months. [R] My core activities, the guitar and hiking, bring me reliable joy, so I see no reason to abandon them. At the same time, stepping outside my **comfort zone** occasionally keeps life from becoming predictable and teaches me things about myself. [E] My weekly routine, for instance, rarely changes: guitar most evenings, a few runs and time with friends at weekends. Last year, however, I tried both rock climbing and salsa dancing for the first time. Salsa, it turned out, was definitely not my thing, whereas I loved climbing so much that I now go once a month. [C] So routine gives me stability, and novelty gives me the occasional pleasant surprise." },
        { q: "Some people believe that regularly engaging in leisure activities is important for mental health. What are your thoughts on this? How do leisure activities impact your own well-being?",
          lx: ["unwind", "recharge your batteries", "well-being"],
          model: "[A] I agree that leisure activities are very important for mental health. [R] When we only work and study, we get tired and stressed. Hobbies give our brain a break and help us feel happy and creative. [E] For example, I play guitar for half an hour almost every evening. Even after a very bad day, when I start playing, I forget about my problems and feel calm. And on weekends, I go hiking with friends, which is the best way for me to **recharge my batteries**. [C] So for me, free time is not a luxury but a necessity.", model5: "[A] I strongly agree; regular leisure time is essential for mental health. [R] A life consisting solely of work and study inevitably leads to exhaustion, whereas hobbies give the mind a genuine rest and restore a sense of enjoyment and creativity. [E] Most evenings, for instance, I play the guitar for half an hour. However rough the day has been, within minutes of starting, my worries fade into the background. At weekends, meanwhile, hiking with friends is my most reliable way to **recharge my batteries**. On the rare weeks when I skip both, I notice my mood dipping almost immediately. [C] So leisure isn't an indulgence; it's what keeps the rest of my life running smoothly." }
      ]},
    { id: "sli", badge: "platform", title: "Leisure Activities", src: "Практика платформы",
      scenario: "We're exploring how people choose to spend their leisure time. I'll ask you a few questions.",
      questions: [
        { q: "What do you usually do when you have free time?",
          lx: ["spare time", "play the guitar", "hang out with"],
          model: "[A] In my free time, I usually play the guitar, go running or **hang out with** friends. [R] I like to have a mix of relaxing, active and social activities, so I don't get bored. [E] For example, on a normal weekday evening, I play the guitar for half an hour and then watch a series or read. On weekends, I go for a long run on Saturday morning, and in the evening, I meet friends for dinner or a board game night. Once a month, we also go hiking. [C] So my free time is a mix of music, sport and friends.",
          model5: "[A] My **spare time** usually revolves around three things: music, exercise and friends. [R] I like to balance relaxing, active and social activities, which stops my free time from feeling repetitive. [E] On a typical weekday evening, for instance, I'll **play the guitar** for half an hour before curling up with a series or a novel. Weekends are more active: a long run on Saturday morning, followed by dinner or a board-game night with friends in the evening. And roughly once a month, we escape the city for a day of hiking. [C] So my free time is a fairly balanced mix of solitude, movement and company, which seems to work well for me." },
        { q: "People enjoy different activities in their spare time—some prefer relaxing at home, while others like being active or social. What kind of activities help you feel recharged or relaxed? Why do you think they help?",
          lx: ["recharge", "switch off", "clear my head"],
          model: "[A] Two kinds of activities help me **recharge**: being active outdoors and playing music. [R] Running or hiking **clears my head** because I focus on my body, not my problems. Playing the guitar helps because I need to concentrate on the music, so I can't think about stress. [E] For example, after a long day of lectures, a forty-minute run in the park makes me feel like a new person. And on stressful evenings before exams, half an hour with my guitar calms me down better than anything else. [C] So movement and music are my two ways to relax.",
          model5: "[A] I find two very different types of activity equally restorative: exercise outdoors and making music. [R] Running or hiking **clears my head**, I think, because the physical effort pulls my attention away from my worries, while playing the guitar demands such complete concentration that there's simply no room left for stress. [E] After a long day of lectures, for instance, a forty-minute run through the park leaves me feeling like a new person. On tense evenings before exams, meanwhile, half an hour with my guitar calms me more effectively than anything else I've tried. [C] So, in both cases, what helps me **recharge** is an activity absorbing enough to make me **switch off** completely." },
        { q: "Some people argue that we don't have enough free time these days. Do you feel you have a good balance between work or school responsibilities and leisure time? Why or why not?",
          lx: ["leisure time", "work-life balance", "deadline"],
          model: "[A] Not really — I think I don't have enough free time. [R] Between classes, homework and my part-time job, my week is very full, and my free time often disappears because of deadlines. [E] For example, I wanted to join a football club this semester, but I could only go twice because I always had something to finish. Even on weekends, I usually spend one day studying. I'm trying to change this by planning my week better. [C] So I'm still looking for a better balance, like many students.", model5: "[A] Honestly, not quite — I'd say leisure time is the first thing I sacrifice. [R] Between lectures, assignments and my part-time job, my week is packed, and whenever a deadline appears, my free time is what disappears. [E] This semester, for example, I signed up for a football club, but I've only managed to attend twice, since there was always something urgent to finish. Even weekends are usually split between rest and catching up on readings. I've recently started scheduling my free time in advance, which has helped a little. [C] So, like many students, I'm still searching for that balance, but at least I'm now treating rest as a priority." },
        { q: "There's a growing interest in using free time to learn new skills or pursue personal development. Do you think this is a good use of leisure time? Why or why not?",
          lx: ["develop new skills", "sense of accomplishment", "leisure time"],
          model: "[A] Yes, I think it's a good use of free time, but only if you enjoy it. [R] Learning something new in your free time makes you feel proud and can help your career. But free time is also for rest. If every hour must be \"productive\", you can get tired and stressed. [E] For example, I learn Spanish in the evenings because I love the language and want to travel to Latin America. But on Sundays I just relax, watch movies and meet friends, with no goals at all. [C] So personal development is great, as long as rest still has a place.", model5: "[A] It can be an excellent use of leisure time, provided it's driven by enjoyment rather than guilt. [R] Picking up a new skill brings a real **sense of accomplishment** and can even benefit your career. **That said**, leisure also exists for genuine rest, and turning every free hour into \"self-improvement\" can easily lead to exhaustion. [E] I study Spanish in the evenings, for instance, because I genuinely love the language and dream of traveling around Latin America. Sundays, on the other hand, are completely goal-free: films, long walks and friends. [C] So personal development is a wonderful way to spend free time, as long as it doesn't crowd out the rest we actually need." }
      ]},
    { id: "s069", badge: "official", title: "Gardening", src: "Official TOEFL · 069",
      scenario: "You have volunteered for a research study at your university about gardening. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, do you have a garden or any plants that you take care of? If so, how often do you spend time gardening? And if not, why?",
          lx: ["water the plants", "have a green thumb", "windowsill"],
          model: "[A] I don't have a garden, but I take care of a few plants on my windowsill. [R] I live in a small dorm room, so a garden is impossible. But plants make my room feel more alive and calm. [E] For example, I have a small cactus, a basil plant and a big green plant my mom gave me. I **water** them twice a week and use the basil for cooking. In summer, I also help my grandmother in her vegetable garden when I visit her — she really **has a green thumb**. [C] So I'm not a real gardener, but I enjoy taking care of my plants.",
          model5: "[A] I don't have a garden as such, but I do look after a small collection of plants on my **windowsill**. [R] Living in a cramped dorm room makes a garden impossible, yet even a few plants make the space feel calmer and more alive. [E] At the moment, for instance, I have a cactus, a pot of basil that regularly ends up in my pasta, and a large leafy plant my mother gave me when I moved in. I **water** them twice a week, which has become a small, oddly soothing ritual. In summer, I also help out in my grandmother's vegetable garden, where I mostly follow instructions, since she's the one who genuinely **has a green thumb**. [C] So I'm hardly a gardener, but I do enjoy caring for my little indoor jungle." },
        { q: "What kinds of plants or gardens have you seen or heard about that you found interesting or appealing? Describe them and talk about why you found them interesting or appealing.",
          lx: ["botanical garden", "rooftop garden", "peaceful"],
          model: "[A] The most interesting garden I've seen is a rooftop garden on a building in my city. [R] It's amazing to see a green space with trees and vegetables in the middle of concrete and traffic. It shows that cities can be greener. [E] For example, on top of a big shopping center, there's a garden where volunteers grow tomatoes, herbs and flowers. There are also beehives and a small café. I visited it last summer, and it was so **peaceful** that I forgot I was in the city center. The vegetables are given to a local food bank. [C] So it was beautiful and also useful for the community.",
          model5: "[A] The garden that impressed me most is a **rooftop garden** above a shopping center in my city. [R] What makes it so appealing is the contrast: a lush, productive green space flourishing in the middle of concrete and traffic, which shows how much greener our cities could be. [E] Volunteers grow tomatoes, herbs and wildflowers there, for instance, alongside several beehives and a tiny café. When I visited last summer, it was so **peaceful** that I completely forgot I was in the city center, just a few floors above a busy road. Even better, the vegetables they harvest are donated to a local food bank. [C] So it struck me as both beautiful and genuinely useful — exactly what urban gardening should be." },
        { q: "What challenges do you think people face when trying to grow plants or maintain a garden?",
          lx: ["time-consuming", "space", "commitment"],
          model: "[A] I think the biggest challenges are time, space and knowledge. [R] Plants need regular care, and busy people often forget to water them. In cities, many people live in small apartments without a garden or even a balcony. And many beginners don't know what each plant needs. [E] For example, I killed three plants in my first year at university because I watered them too much — I didn't know that cacti need very little water. My grandmother says gardening is very **time-consuming**; in summer, she works in her garden almost every day. [C] So gardening needs time, space and patience.",
          model5: "[A] The main challenges, I'd say, are time, **space** and knowledge. [R] Plants demand consistent care, which is difficult for busy people; urban residents often lack a garden or even a balcony; and beginners frequently have no idea what different plants actually need. [E] In my first year at university, for instance, I managed to kill three plants, mainly by overwatering a cactus, which, I later learned, needs barely any water at all. My grandmother, meanwhile, warns that a proper garden is extremely **time-consuming**: in summer, she spends several hours almost every day weeding, watering and harvesting. [C] So gardening requires not just enthusiasm but a real **commitment** of time, space and patience." },
        { q: "Some people believe that gardening can have positive effects on personal mental health and well-being. Do you agree or disagree with this viewpoint? Why?",
          lx: ["well-being", "unwind", "self-care"],
          model: "[A] I agree that gardening can be good for mental health. [R] It's calm and slow, you're outside, and you see the results of your work. Taking care of plants also gives you a reason to get up and a small sense of responsibility. [E] For example, my grandmother has a small garden, and she says it's her therapy. After my grandfather died, she spent hours in the garden every day, and it helped her a lot. Even I have a few plants on my windowsill, and watering them in the morning is a relaxing moment. [C] So gardening is a simple way to feel calmer.", model5: "[A] I agree; gardening seems to combine several things that are good for the mind. [R] It's slow and calming, it gets you outdoors and moving, and it offers the quiet satisfaction of watching something grow thanks to your care. It also provides gentle structure and responsibility, which can be especially valuable during difficult times. [E] My grandmother, for instance, calls her small vegetable garden her therapy. After my grandfather passed away, she spent hours there every day, and she says it gave her a reason to get up in the morning. Even my modest collection of windowsill plants gives me a peaceful few minutes each morning. [C] So gardening is a simple, low-cost way to nurture your own well-being." }
      ]},
    { id: "sac", badge: "platform", title: "Animal Care", src: "Практика платформы",
      scenario: "I'm conducting a study on people's experiences with pets and how animals fit into their daily lives. I'd like to ask you a few questions to understand your perspective.",
      questions: [
        { q: "Do you currently have a pet, or have you had one in the past? If so, what kind of pet was it, and how long were they a part of your life?",
          lx: ["family pet", "companionship", "take care of"],
          model: "[A] Yes, my family has a dog called Max. [R] We got him when I was ten, so he's been part of my life for about ten years. Now I live at university, so I see him only when I visit home. [E] For example, Max is a big, friendly golden retriever. When I was a child, I walked him every day after school, and he slept next to my bed. Now he's old and slow, but when I come home, he still runs to the door and jumps on me. I miss him a lot. [C] So Max is a real member of our family.",
          model5: "[A] Yes, my family has a golden retriever called Max, who's been part of my life for about ten years. [R] We adopted him when I was ten, and although I now live away at university, he remains very much a member of the family. [E] As a child, for instance, I walked him every day after school, and for years he slept at the foot of my bed. These days he's grey around the muzzle and noticeably slower, yet whenever I come home, he still races to the door and greets me as if I'd been away for a decade. Honestly, he's one of the things I miss most about home. [C] So Max isn't just a pet to us; he's family." },
        { q: "Many people describe their pets as members of the family and say they bring comfort, routine, or even joy during difficult times. In your experience, what kind of role have pets played in your life—or in the lives of your friends or family members?",
          lx: ["companionship", "routine", "comfort"],
          model: "[A] Pets have given my family comfort, routine and a lot of joy. [R] A dog makes you go outside every day, and it's always happy to see you, even on bad days. [E] For example, when my grandfather died, my grandmother was very sad and lonely. Our dog Max stayed with her for a few weeks, and she said walking him every day helped her get out of bed and talk to neighbors. Also, when I was stressed before exams in high school, playing with Max always made me smile. [C] So for my family, pets are a source of love and support.",
