          lx: ["build a career", "job security", "in demand"],
          model: "[A] Most people around me work in technology or healthcare. [R] These fields are **in demand**, they pay well, and they offer a lot of **job security**, so parents often push their kids in that direction. [E] For example, in my family, my cousin is a software developer and my aunt is a nurse, and about half of my friends from school are studying computer science or medicine. Only a few of them chose something creative, like design. [C] So I'd say people around me usually choose safe, stable careers rather than risky ones.",
          model5: "[A] From what I've seen, most people around me tend to **build careers** in either technology or healthcare. [R] Both fields are hugely **in demand**, they pay well and, perhaps most importantly, they offer a great deal of **job security**, which is why parents often steer their children in that direction. [E] In my own family, for instance, my cousin is a software developer and my aunt has been a nurse for twenty years, while roughly half of my school friends are now studying either computer science or medicine. Only a handful of them have opted for something creative, like graphic design. [C] Generally speaking, then, people in my circle prioritize stability over taking risks." },
        { q: "When choosing a career, is job satisfaction your first priority, or do you focus more on salary? Why?",
          lx: ["job satisfaction", "salary", "fulfilling"],
          model: "[A] For me, **job satisfaction** comes first, but salary is still important. [R] We spend about forty hours a week at work, so if I hate my job, no **salary** can make me happy. At the same time, I need enough money to live comfortably. [E] For example, my uncle works at a bank and earns a lot, but he's stressed and tired all the time. My mom earns less as a teacher, but she loves her job and comes home happy. [C] So I'd choose a **fulfilling** job with a decent salary over a boring job with a high one.",
          model5: "[A] Job satisfaction is definitely my first priority, although I'd never ignore salary completely. [R] Given that we spend roughly a third of our adult lives at work, no amount of money can make up for a job you dread every morning. **That said**, a salary has to be high enough to live on without constant worry. [E] My uncle, for example, earns a fortune at an investment bank, yet he's permanently exhausted and openly admits he's miserable. My mother, by contrast, earns far less as a teacher but finds her work genuinely **fulfilling**. [C] Ideally, then, I'd choose a job that I enjoy and that pays reasonably, rather than one that simply pays the most." },
        { q: "In recent years, there has been a trend towards people changing careers multiple times throughout their lives instead of sticking to one profession. What are your thoughts on this trend? Do you think it's helpful or hurtful to workers?",
          lx: ["switch careers", "transferable skills", "a dead-end job"],
          model: "[A] I think this trend is mostly helpful to workers. [R] People change a lot over their lives, and it's normal that your interests at forty are different from your interests at twenty. If you can **switch careers**, you don't get stuck in **a dead-end job**. [E] For example, my aunt worked in accounting for fifteen years, then went back to school and became a nurse. She says it was the best decision of her life. [C] Of course, it can be risky and stressful, but overall, having the freedom to change is a good thing.",
          model5: "[A] On the whole, I think this trend is far more helpful than hurtful. [R] People evolve throughout their lives, so it seems perfectly natural that what fascinates you at twenty may bore you at forty. Being able to **switch careers** means nobody has to stay trapped in **a dead-end job** for decades, and the **transferable skills** you've gained are rarely wasted. [E] My aunt, for instance, spent fifteen years in accounting before retraining as a nurse, and she now says it was the best decision she's ever made. Her organizational skills, if anything, made her a better nurse. [C] Admittedly, it involves risk, but the freedom to start over is ultimately a huge advantage." },
        { q: "Some people believe that artificial intelligence will greatly change the kinds of jobs available in the future. Do you think this trend will continue in your chosen field? Why or why not?",
          lx: ["automate", "replace", "develop new skills"],
          model: "[A] Yes, I'm sure AI will change my field, which is marketing. [R] AI can already write simple texts, make images and analyze data in seconds, so many basic tasks will be **automated**. But I don't think it will **replace** people completely, because marketing is about understanding emotions and creativity. [E] For example, during my internship, our team used AI to write the first draft of social media posts, but a person always had to check and improve them. [C] So the jobs will change, and people will need to **develop new skills** to work with AI.",
          model5: "[A] I'm convinced AI will keep transforming my chosen field, which is marketing. [R] It can already draft copy, generate images and analyze customer data in seconds, so most routine tasks are bound to be **automated**. What it can't do, however, is genuinely understand people, and that's the heart of marketing. [E] During my internship, for instance, our team used AI to produce first drafts of social media posts, but every single one had to be rewritten by a human, because they sounded generic and lifeless. [C] So rather than **replacing** marketers, AI will change what we do, which means we'll constantly have to **develop new skills** to stay relevant." }
      ]},
    { id: "s081", badge: "official", title: "Job Satisfaction", src: "Official TOEFL · 081",
      scenario: "You have agreed to participate in a research study about people's experiences with job satisfaction. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, what do you think are the most important things to consider when looking for a job?",
          lx: ["work-life balance", "career advancement", "colleagues"],
          model: "[A] I think the two most important things are the people and the chance to grow. [R] Even a great job becomes terrible if your boss or **colleagues** are unpleasant. And if there's no **career advancement**, you'll get bored after a year. [E] For example, my friend took a job with a high salary, but her manager shouted at everyone, and she **quit** after six months. Her new job pays a little less, but the team is friendly and she's learning a lot. [C] So before taking a job, I'd ask about the team and the opportunities to grow.",
          model5: "[A] In my view, the two things that matter most are the people you'll be working with and the opportunities for growth. [R] However impressive a job looks on paper, it quickly becomes unbearable if your manager or **colleagues** are hostile, and without real **career advancement**, even an interesting role gets stale. [E] A friend of mine, for instance, accepted a very well-paid position, only to discover that her boss regularly shouted at the team. She **quit** within six months and now earns slightly less, but she's surrounded by supportive people and learns something new every week. [C] Before accepting any offer, then, I'd look closely at the team and the room to grow." },
        { q: "Can you describe a job that either you or one of your friends has had? What kind of work was involved?",
          lx: ["part-time job", "responsibilities", "learn the ropes"],
          model: "[A] Last year, I had a **part-time job** as a barista in a café near my university. [R] I needed some extra money, and the hours were flexible, so I could work around my classes. [E] My **responsibilities** were making coffee, serving customers, cleaning the machines and sometimes training new staff. It was hard at first — the café was really busy in the mornings — but it took me about two weeks to **learn the ropes**, and after that I really enjoyed it. [C] So it wasn't my dream job, but it taught me a lot about working under pressure.",
          model5: "[A] Last year, I had a **part-time job** as a barista at a café just off campus. [R] I needed some extra income, and since the shifts were flexible, I could easily fit them around my lectures. [E] My **responsibilities** ranged from making drinks and serving customers to cleaning the machines and, eventually, training new staff. The first couple of weeks were overwhelming, as the morning rush was intense, but once I'd **learned the ropes**, I genuinely started to enjoy it. What I valued most was learning to stay calm when twenty people were waiting in line. [C] It certainly wasn't my dream job, but it taught me more about handling pressure than any class has." },
        { q: "Moving on, what kinds of things do you think can lead people to feel unhappy in their work? Can you tell me about one or two of them?",
          lx: ["workload", "recognition", "burnout"],
          model: "[A] I think the two main things are a heavy **workload** and a lack of **recognition**. [R] When you have too much work, you feel stressed all the time and you have no energy for your personal life. And if nobody notices your effort, you lose motivation. [E] For example, my older sister worked at a big company where she often stayed until ten p.m., but her manager never said thank you. After two years, she was close to **burnout** and decided to leave. [C] So I believe stress and feeling unappreciated make people the most unhappy.",
          model5: "[A] I'd say two factors stand out: an unmanageable **workload** and a lack of **recognition**. [R] When the work never stops, stress gradually spills over into your personal life, and when nobody acknowledges your effort, it's only natural to wonder why you're bothering at all. [E] My older sister, for example, worked for a large consulting firm where she routinely stayed in the office until ten at night, yet her manager never once thanked her. Within two years, she was on the verge of **burnout** and eventually resigned. Ironically, she now earns less but feels far more valued. [C] Ultimately, people don't just need a salary; they need to feel that their work matters." },
        { q: "Some people believe that working for a large company offers more advantages than working for a small company, while others prefer the opposite. What do you think? And why?",
          lx: ["job security", "perks", "take on responsibility"],
          model: "[A] I think a small company is better, especially at the start of a career. [R] In a small company, you can **take on** more **responsibility** and try many different tasks, so you learn faster. Big companies offer better salaries, **perks** and **job security**, but you often do only one small task. [E] For example, during my internship at a small marketing agency, I wrote posts, met clients and even helped with a budget. My friend did an internship at a huge corporation, and she just made spreadsheets for three months. [C] So for learning, I'd choose a small company.",
          model5: "[A] Personally, I'd prefer a small company, at least at the beginning of my career. [R] Admittedly, large corporations offer higher salaries, attractive **perks** and greater **job security**. In a small company, however, you're given the chance to **take on responsibility** almost immediately, which means you learn far faster. [E] During my internship at a ten-person marketing agency, for instance, I wrote content, attended client meetings and even helped plan a budget. A friend of mine, meanwhile, interned at a multinational and spent three months doing nothing but updating spreadsheets. [C] So while large companies are ideal for stability, small ones are, I believe, unbeatable for growth." }
      ]},
    { id: "s085", badge: "official", title: "Work Experience", src: "Official TOEFL · 085 / 126",
      scenario: "You have volunteered for a research study at your university about work experience. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, can you tell me about the type of work you are currently doing or have done in the past?",
          lx: ["internship", "gain work experience", "hands-on experience"],
          model: "[A] Right now, I'm a full-time student, but last summer I **did an internship** at a small marketing agency. [R] I'm studying business, and I wanted to **gain** real **work experience** before I graduate. [E] I worked there for three months, mostly helping with social media for local companies — a coffee shop, a gym and a bookstore. Before that, I also had a part-time job as a barista. Both jobs gave me a lot of **hands-on experience**. [C] So I don't have a full-time job yet, but I already know what working in a team feels like.",
          model5: "[A] At the moment, I'm a full-time student, but last summer I **did an internship** at a small marketing agency. [R] As a business major, I was eager to **gain** some genuine **work experience** before graduating, rather than relying solely on what I'd learned in lectures. [E] For three months, I helped manage social media accounts for local clients — a coffee shop, a fitness studio and an independent bookstore. Before that, I'd also worked part-time as a barista, which, surprisingly, turned out to be just as useful. [C] So although I haven't had a full-time job yet, both roles gave me valuable **hands-on experience** of working with real clients and real deadlines." },
        { q: "Can you describe some of your regular responsibilities or particular tasks that you do in your job?",
          lx: ["responsibilities", "meet a deadline", "go the extra mile"],
          model: "[A] During my internship, I had three main **responsibilities**. [R] I was the youngest person on the team, so I helped with many different tasks. [E] First, I wrote posts for our clients' social media pages every day. Second, I prepared weekly reports with numbers — how many likes and new followers each client got. And third, I took notes at client meetings. Sometimes I also **went the extra mile** and suggested new ideas for videos, and my manager really liked that. [C] So my work was a mix of creative tasks and boring but important ones.",
          model5: "[A] My internship involved three main **responsibilities**. [R] Being the youngest member of a small team, I was expected to help wherever I was needed. [E] Every day, I drafted posts for our clients' social media accounts, making sure each one matched the brand's style. Every Friday, I compiled a performance report showing engagement and follower growth, which had to be ready before the client call, so I learned to **meet deadlines** without exception. I also took minutes at meetings. Occasionally, I **went the extra mile** by pitching ideas for short videos, two of which were actually used. [C] It was, in short, a mix of creative work and routine tasks." },
        { q: "Tell me about a challenging project or task you have worked on. How did you handle it?",
          lx: ["be snowed under", "prioritize", "meet a deadline"],
          model: "[A] The most challenging task was organizing a launch event for a client during my internship. [R] It was hard because we had only one week, and my manager suddenly got sick. [E] I was **snowed under** — I had to book a place, invite guests and prepare all the posts. So I made a list, **prioritized** the most urgent tasks and asked two colleagues to help me with the invitations. I worked late a few nights, but we **met the deadline**, and about eighty people came. [C] It taught me that asking for help is not a weakness.",
          model5: "[A] The most challenging task I've faced was organizing a product launch for a client during my internship. [R] What made it so difficult was that we had just one week, and two days in, my manager fell ill, leaving me largely in charge. [E] I was completely **snowed under**: the venue, the guest list and the promotional posts all had to be ready at once. Rather than panic, I listed every task, **prioritized** ruthlessly and asked two colleagues to take over the invitations. I burned the midnight oil a few times, but we **met the deadline**, and nearly eighty guests attended. [C] Above all, it taught me that delegating is a strength, not a weakness." },
        { q: "Some people believe that gaining diverse work experiences by often changing jobs and companies is more valuable than staying in one job or one company for a long time. What is your opinion on this? Why?",
          lx: ["job-hopping", "transferable skills", "loyalty"],
          model: "[A] I think it depends on your age. [R] When you're young, changing jobs often is useful, because you try different things and find out what you really like. But later, staying in one company helps you get promotions and become an expert. [E] For example, my cousin changed three jobs in five years after university, and now she knows exactly what she wants. My father, on the other hand, has worked at the same company for twenty years, and now he's a top manager. [C] So **job-hopping** is good at the start, but long-term **loyalty** pays off later.",
          model5: "[A] I'd argue it largely depends on what stage of your career you're at. [R] Early on, changing jobs frequently is extremely valuable, since you discover what genuinely suits you and pick up **transferable skills** along the way. Later, however, staying put allows you to build deep expertise and earn the trust needed for senior roles. [E] My cousin, for instance, worked for three different companies in her first five years after graduating, and she now knows precisely what she wants. My father, by contrast, has been with one firm for two decades and has risen to senior management. [C] So **job-hopping** pays off at the start, whereas **loyalty** tends to be rewarded later." }
      ]},
    { id: "s110", badge: "official", title: "Work-Life Balance", src: "Official TOEFL · 110",
      scenario: "You have volunteered for a research study about work-life balance. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, can you share one or two strategies that you use that you think are effective in managing your work-life balance?",
          lx: ["switch off", "call it a day", "set boundaries"],
          model: "[A] I use two simple strategies: a fixed end time and no work apps on my phone. [R] Without clear limits, work and study can take all my free time, and I get tired very quickly. [E] For example, I always **call it a day** at seven p.m. — I close my laptop, even if I haven't finished everything. Also, I deleted my work email app from my phone, so I can really **switch off** in the evening and on weekends. [C] These two small rules help me feel much more relaxed and actually more productive.",
          model5: "[A] I rely on two strategies: a strict cut-off time and keeping work off my phone. [R] Without clear boundaries, my studies and part-time job would gradually swallow every free moment, and I'd end up exhausted. [E] Every evening, for instance, I **call it a day** at seven o'clock and close my laptop, even if my to-do list isn't finished. I've also deleted my work email app, so I can genuinely **switch off** after hours instead of checking messages at midnight. Surprisingly, I've become more productive, not less, because I now work with a deadline in mind. [C] Small rules like these, I find, make a huge difference to my work-life balance." },
        { q: "Many companies are now developing programs to help employees manage work-life balance. Would programs like this affect your interest in working for a particular company? Why or why not?",
          lx: ["work-life balance", "burnout", "employer"],
          model: "[A] Yes, these programs would definitely make a company more attractive to me. [R] They show that the **employer** cares about people, not only about results. Also, I want to avoid **burnout**, which is very common in my generation. [E] For example, my friend's company gives everyone one free Friday a month and pays for a gym membership. She says she's much less stressed than her friends at other companies, and she doesn't want to leave. [C] So if two companies offered the same salary, I'd choose the one with a good **work-life balance** program.",
          model5: "[A] Absolutely; programs like these would make a company far more attractive to me. [R] They signal that the **employer** genuinely values employees' well-being rather than treating them simply as resources, and with **burnout** so widespread among young professionals, that matters enormously. [E] A friend of mine, for example, works for a firm that gives everyone one free Friday a month and covers gym memberships. She's noticeably less stressed than friends at other companies, and despite receiving a better offer recently, she chose to stay. [C] So if two jobs offered similar salaries, I'd undoubtedly choose the employer that takes **work-life balance** seriously, provided the programs are real and not just for show." },
        { q: "Some companies also offer flexible working hours or remote work options to help employees achieve a better work-life balance, but they are concerned that these options would reduce employee attention to tasks or engagement in the workplace. Do you think such programs are a good strategy for companies? Why or why not?",
          lx: ["work remotely", "flexible hours", "productivity"],
          model: "[A] Yes, I think they're a good strategy, if companies set clear goals. [R] When people have **flexible hours** or can **work remotely**, they save time on commuting and feel more trusted, so they often work better. Of course, some people may get distracted at home. [E] For example, during my internship, we worked from home two days a week. I was actually more productive on those days because the office was noisy. But we had a team call every morning, so everyone stayed connected. [C] So flexibility works well when there are clear rules.",
          model5: "[A] I believe they're an excellent strategy, provided companies set clear expectations. [R] Employees with **flexible hours** or the option to **work remotely** save hours on commuting and feel trusted, which tends to boost **productivity** rather than reduce it. Admittedly, some people do struggle with distractions at home, but that's a management issue, not a reason to ban flexibility. [E] At my internship, for instance, we worked from home twice a week, and I got noticeably more done on those days, since the open-plan office was so noisy. A short video call every morning kept the whole team engaged. [C] So flexibility works brilliantly, as long as it comes with structure and clear goals." },
        { q: "Looking to the future, do you think people's attitudes towards work-life balance will change? For example, do you think people will prioritize personal life over work or work over personal life? Explain your thoughts.",
          lx: ["work to live", "prioritize", "burnout"],
          model: "[A] I think people will **prioritize** their personal life more and more. [R] Younger generations saw their parents work long hours and get stressed, and they don't want the same life. Also, technology and remote work make it easier to work less and still be productive. [E] For example, many of my friends say they'd rather earn less and have time for hobbies and family. When they look for jobs, the first thing they ask about is flexible hours. [C] So in the future, I think most people will **work to live**, not live to work.",
          model5: "[A] I'm fairly confident that people will increasingly **prioritize** their personal lives over work. [R] Having watched their parents work punishing hours, often ending up with **burnout**, many young people are determined not to repeat that pattern. On top of that, technology now allows us to be productive in far less time. [E] Most of my friends, for example, openly say they'd accept a lower salary in exchange for time for their hobbies and families, and the first question they ask in job interviews is about flexibility. Some even turn down offers that require constant overtime. [C] In the coming decades, I suspect, the dominant attitude will be to **work to live**, not live to work." }
      ]},
    { id: "s124", badge: "official", title: "Work-Life Balance", src: "Official TOEFL · 124",
      scenario: "As part of a university project, you have agreed to take part in a short research interview about work-life balance. A graduate student conducting the research will ask you some questions online.",
      questions: [
        { q: "First, do you feel that you currently have a good balance between your work and personal life? Give details to explain your answer.",
          lx: ["work-life balance", "workload", "take time off"],
          model: "[A] To be honest, my balance is not perfect right now, but it's getting better. [R] I'm a full-time student and I also work part-time, so my **workload** is quite heavy, especially during exams. [E] For example, last month I had three deadlines and extra shifts at the café, and I didn't see my friends for almost two weeks. After that, I decided to work only on weekdays and keep Sundays completely free. Now I have time for sports and friends again. [C] So it's still a challenge, but I'm learning to protect my free time.",
          model5: "[A] Honestly, my balance isn't perfect at the moment, but it's improving steadily. [R] Combining full-time studies with a part-time job means my **workload** can get quite heavy, particularly around exam periods. [E] Last month, for instance, I had three assignments due and picked up extra shifts at the café, with the result that I barely saw my friends for two weeks. That was a wake-up call, so I've since stopped working on weekends and keep Sundays entirely free. Since then, I've gone back to playing football and I feel far less drained. [C] Striking a healthy **work-life balance** is still a challenge, but I've learned that free time has to be protected deliberately." },
        { q: "Can you describe some strategies you use or want to use to maintain a balanced lifestyle?",
          lx: ["set boundaries", "switch off", "to-do list"],
          model: "[A] I use two strategies, and I want to try one more. [R] I learned that if I don't plan my time, work and study take everything. [E] First, every Sunday I write a **to-do list** for the week and put my free time in my calendar, like a meeting. Second, I don't check emails after eight p.m., so I can **switch off**. In the future, I also want to try a digital detox — one day a month without my phone. [C] So for me, balance is about planning and clear limits.",
          model5: "[A] I currently use two strategies, and there's a third I'd like to adopt. [R] Experience has taught me that, without planning, work and study will expand to fill every hour available. [E] Every Sunday, for example, I write a weekly **to-do list** and schedule my free time in my calendar, treating a run or dinner with friends as seriously as a meeting. I also **set** a firm **boundary** of no emails after eight p.m., which allows me to genuinely **switch off**. What I'd like to try next is a monthly digital detox — a whole day without my phone. [C] Essentially, for me, balance comes down to planning ahead and sticking to clear limits." },
        { q: "Tell me about a time when you might have felt overwhelmed by work or personal responsibilities. How did you handle the situation?",
          lx: ["be snowed under", "overwhelmed", "prioritize"],
          model: "[A] I felt really **overwhelmed** at the end of my last semester. [R] I had final exams, a group project and extra shifts at work, all in the same two weeks. [E] I was **snowed under** and couldn't sleep well. So I talked to my manager and asked for fewer shifts, and she agreed. Then I made a plan for every day and **prioritized** the exams. I also went for a walk every evening to relax. In the end, I passed everything. [C] It taught me that it's better to ask for help early than to suffer in silence.",
          model5: "[A] The most **overwhelmed** I've ever felt was at the end of last semester. [R] Final exams, a group project and extra shifts at work all landed in the same fortnight. [E] I was completely **snowed under**, to the point where I was barely sleeping. Eventually, I spoke to my manager, explained the situation and asked to reduce my hours, which, to my relief, she agreed to immediately. I then drew up a day-by-day plan, **prioritized** my exams and forced myself to take a short walk every evening to clear my head. In the end, I passed everything with decent grades. [C] Looking back, I realize that asking for help early is far better than struggling in silence." },
        { q: "Some people believe that employers should offer more flexible working arrangements to help employees better achieve a healthy work-life balance. Do you agree or disagree with this idea? Why?",
          lx: ["flexible working arrangements", "commute", "productivity"],
          model: "[A] I agree with this idea. [R] People have different lives — some have small kids, some live far away, some work better in the morning. Flexible schedules help them organize their day and feel less stressed, and happy employees usually work better. [E] For example, my neighbor is a single mom. Her company lets her start work at seven and finish at three, so she can pick up her son from school. She says she would quit without this option. [C] So I think flexible work is good for both employees and companies.",
          model5: "[A] I strongly agree with this idea. [R] Employees lead very different lives: some are raising young children, others face a two-hour **commute**, and many simply work better at certain times of day. **Flexible working arrangements** let people organize their lives sensibly, and less stressed employees are, almost invariably, more productive and more loyal. [E] My neighbor, for instance, is a single mother whose company lets her work from seven to three, so she can collect her son from school. She told me she'd have resigned long ago without that option. [C] Flexibility, in my view, isn't a favor to employees; it's a smart investment that benefits companies just as much." }
      ]},
    { id: "smock", badge: "mock", title: "The Workplace", src: "Mock-тест платформы",
      scenario: "You have volunteered for a research study about the workplace. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, have you ever worked as part of a team, either at a job or on a school project? What was your role?",
          lx: ["work as part of a team", "take on responsibility", "meet a deadline"],
          model: "[A] Yes, I **worked as part of a team** on a big group project at university last semester. [R] There were five of us, and we had to create a business plan for a new app, so we needed a clear leader. [E] I **took on** the role of coordinator. I divided the tasks, made a shared calendar and organized short meetings every week. When two people were late with their parts, I helped them so we could **meet the deadline**. We got the highest grade in the class. [C] So my role was to keep everyone organized and on time.",
          model5: "[A] Yes, I **worked as part of a team** on a major group project at university last semester. [R] Five of us had to develop a full business plan for a new app, and it quickly became clear that someone needed to coordinate everything. [E] I volunteered to **take on** that **responsibility**: I divided up the tasks according to everyone's strengths, set up a shared calendar and ran a short check-in every week. When two teammates fell behind, I helped them catch up rather than complaining, which meant we **met the deadline** comfortably. We ended up with the highest grade in the class. [C] My role, in short, was keeping the team organized and motivated." },
        { q: "Would you rather have a manager who gives you clear instructions or one who lets you decide how to do your work? Why?",
          lx: ["micromanage", "independence", "learn the ropes"],
          model: "[A] I'd rather have a manager who lets me decide, but only after I **learn the ropes**. [R] At the beginning of a new job, clear instructions are really helpful, because you don't know how things work. But later, I want **independence**, because nobody likes being controlled all the time. [E] For example, at the café, my first manager explained everything step by step, which was great. After a month, she let me organize the morning shifts my own way, and I felt much more motivated. [C] So the best manager gives clear instructions first and freedom later.",
          model5: "[A] Ideally, I'd want a manager who gives me freedom, though only once I've **learned the ropes**. [R] When you're new, clear instructions are invaluable, since you have no idea how things are done. Once you're competent, however, being told exactly what to do feels restrictive, and few things kill motivation faster than being **micromanaged**. [E] At the café, for example, my manager walked me through every procedure during my first weeks, which was exactly what I needed. A month later, she let me reorganize the morning routine my own way, and I felt genuinely trusted. [C] So the best managers, I think, start with clear guidance and gradually give you **independence**." },
        { q: "Some people believe that being friends with your coworkers helps you do your job better. Do you agree or disagree? Why?",
          lx: ["coworkers", "work as part of a team", "professional"],

          model5: "[A] I largely agree, with one important condition. [R] Being friends with your **coworkers** builds trust, so people ask for help without hesitation and communicate more openly. Work also becomes far more enjoyable, which, in turn, boosts motivation. [E] At the café, for instance, my closest friend was also my coworker, and on hectic mornings we coordinated almost without speaking — our manager even called us her fastest team. **That said**, we occasionally got distracted chatting, and we had to remind each other to stay focused. [C] So workplace friendships definitely help, provided people remain **professional** and keep personal matters from interfering with the job." },
        { q: "Some people believe that in the future, most work meetings will take place online rather than in person. What might be the advantages and disadvantages of this for workers?",

          model: "[A] Online meetings have clear advantages, but also some serious disadvantages. [R] The main advantage is that workers save time and money, because they don't need to **commute**. The disadvantage is that it's harder to build relationships and understand people through a screen. [E] For example, during my internship, our weekly online meetings were short and efficient. But when we had to solve a difficult problem, we always met **face-to-face**, because online people just turned off their cameras and stayed silent. [C] So I think a mix of online and in-person meetings is best.",
          model5: "[A] Moving meetings online would bring real advantages, but some significant drawbacks as well. [R] On the positive side, workers would save countless hours otherwise spent **commuting**, and meetings tend to be shorter and more focused. On the downside, building relationships through a screen is far harder, and subtle signals like body language are easily lost. [E] During my internship, for example, our weekly online check-ins were efficient, whereas brainstorming sessions only worked **face-to-face**; online, half the team switched off their cameras and barely spoke. [C] So rather than going fully online, I think workplaces will settle on a hybrid model, using each format for what it does best." }

    { id: "sent", badge: "platform", title: "Entrepreneurship and Small Business", src: "Практика платформы",
      scenario: "We're exploring what motivates people to start and manage their own businesses. I'll ask you a few questions about your thoughts and experiences.",
      questions: [
        { q: "To begin, have you ever started or thought about starting a business? If yes, what kind of business was it—and if not, what's stopped you so far?",
          lx: ["start a business", "entrepreneur", "take a risk"],
          model: "[A] Yes, I've thought about **starting a business** many times, but I haven't done it yet. [R] My dream is to open a small coffee shop with a bookstore inside. But I'm a student, and I don't have enough money or experience yet. [E] For example, when I worked at a café, I saw how hard it is for the owner — rent is expensive, and she works almost every day. That made me understand that I need to save money and learn more about business first. [C] So I'm not ready now, but maybe in five or ten years.",
          model5: "[A] I've often thought about **starting a business**, although I haven't actually done it yet. [R] My dream is to open a small café combined with a second-hand bookstore. What's held me back so far is simply a lack of capital and experience, which, as a student, is hardly surprising. [E] Working at a café opened my eyes, too: I saw how hard the owner struggled with rising rent and staff shortages, often working seven days a week. Rather than putting me off, though, it made me realize I should save money and learn the business side first before I **take** such a big **risk**. [C] So it's a long-term plan rather than an immediate one." },
        { q: "Many entrepreneurs say they're driven by independence, passion, or a desire to solve a problem. What do you think are the biggest personal motivations behind starting a business—and what challenges do you think come with that decision?",
          lx: ["be your own boss", "independence", "financial risk"],
          model: "[A] I think the biggest motivation is **independence** — people want to **be their own boss**. [R] In a normal job, someone else makes the decisions, but in your own business, you choose what to do and how to do it. The biggest challenges are **financial risk** and stress, because you can lose all your money. [E] For example, my uncle opened a small bakery. He loves the freedom, but in the first two years he had no weekends and was always worried about money. [C] So starting a business gives you freedom, but you pay for it with stress.",
          model5: "[A] I'd say the strongest motivation is **independence** — the desire to **be your own boss**. [R] In a conventional job, others decide what you work on and how, whereas running your own business lets you shape everything according to your own vision. The flip side is considerable **financial risk**, along with long hours and constant uncertainty. [E] My uncle, for example, left a stable office job to open a bakery. He adores the freedom, but he admits that, for the first two years, he worked every weekend and lay awake at night worrying about money. [C] Entrepreneurship, then, offers enormous freedom, but at a price that not everyone is willing to pay." },
        { q: "Starting a business often involves risk, uncertainty, and long hours. At the same time, it can offer flexibility and fulfillment. Do you believe entrepreneurship is worth the risk for most people? Why or why not? Can you think of any examples that support your view?",
          lx: ["worth the risk", "job security", "fulfilling"],
          model: "[A] I don't think entrepreneurship is **worth the risk** for most people. [R] Most new businesses close in the first few years, and many people have families and loans, so they need **job security**. It's a good choice only for people who are very passionate and ready to work very hard. [E] For example, two of my parents' friends opened restaurants. One is very successful now, but the other one lost all his savings and had to go back to an office job. [C] So it can be **fulfilling**, but it isn't for everyone.",
          model5: "[A] For most people, I don't believe it's **worth the risk**, although for some it absolutely is. [R] A large proportion of new businesses fail within their first few years, and people with families or loans can rarely afford to give up **job security**. It makes sense mainly for those who are genuinely passionate and prepared for years of sacrifice. [E] Two family friends of ours, for instance, opened restaurants around the same time. One now runs three thriving locations, whereas the other lost his life savings within eighteen months and had to return to an office job. [C] So entrepreneurship can be incredibly **fulfilling**, but only if you go in with your eyes open and a safety net." },
        { q: "One last question. Some believe that schools and universities should focus more on teaching business and entrepreneurship skills. Do you agree? Why or why not—and what kind of skills do you think future business owners really need?",
          lx: ["transferable skills", "hands-on experience", "financial literacy"],
          model: "[A] Yes, I agree, especially at universities. [R] Most students learn theory, but they don't learn how to manage money, sell an idea or deal with failure. These are useful skills even if you never start a business. [E] For example, at my university, we had a project where we created a mini-business and sold products on campus. I learned more about marketing and teamwork in that month than in a whole semester of lectures. [C] So I think future business owners need **financial literacy**, communication and resilience, and schools should teach them.",
          model5: "[A] I agree, particularly at university level. [R] Most programs focus heavily on theory, yet very few teach students how to manage cash flow, pitch an idea or cope with failure — **transferable skills** that are valuable whether or not you ever start a company. [E] At my university, for example, we had a project in which teams set up mini-businesses and sold products on campus for a month. That single month gave me more **hands-on experience** of marketing and teamwork than an entire semester of lectures. [C] What future business owners really need, in my view, is **financial literacy**, persuasive communication and resilience, and schools are perfectly placed to develop all three." }
      ]},
    { id: "ssr", badge: "platform", title: "Social Responsibility", src: "Практика платформы",
      scenario: "We're looking at how people view ethics and social responsibility in business. I'll ask you a few questions about your perspective.",
      questions: [
        { q: "To start, when you think of a company that acts responsibly, what comes to mind? Can you name a business or describe specific practices that you consider ethical?",
          lx: ["ethical", "fair wages", "sustainable"],
          model: "[A] When I think of a responsible company, I think of a small coffee shop chain in my city. [R] They pay **fair wages** to farmers and to their staff, and they try to be **sustainable**. [E] For example, they buy coffee directly from farmers, use paper cups that can be recycled, and give a discount if you bring your own cup. They also give leftover food to a homeless shelter every evening. My friend works there and says they treat employees very well. [C] So for me, an **ethical** company cares about people and the planet, not just profit.",
          model5: "[A] What springs to mind is a local coffee chain in my city. [R] It stands out because it pays **fair wages** both to the farmers who grow its beans and to its own staff, while making a real effort to be **sustainable**. [E] It buys coffee directly from small farms, uses compostable cups and gives customers a discount for bringing their own mug. What's more, every evening it donates unsold food to a homeless shelter nearby. A friend who works there says employees are treated with genuine respect, which is rare in hospitality. [C] To me, then, an **ethical** company is one whose everyday practices, not just its slogans, show it cares about people and the planet." },
        { q: "These days, many consumers expect companies to do more than just make money—they want transparency, fair treatment of workers, and attention to environmental impact. How important are these issues to you when choosing where to shop or work? Why?",
          lx: ["transparency", "fair treatment", "company culture"],
          model: "[A] These issues are very important to me, especially when I choose where to work. [R] I spend most of my day at work, so I want to work for a company I respect. If a company treats workers badly, I don't want to be part of it. When I shop, price still matters, but I try to avoid brands with bad reputations. [E] For example, I rejected an internship offer last year after reading reviews from employees about long hours and no overtime pay. [C] So **fair treatment** and **transparency** really affect my choices.",
          model5: "[A] They matter a great deal to me, particularly when deciding where to work. [R] Since I'll spend most of my waking hours at a job, I want to work somewhere whose values I genuinely respect; if a company mistreats its staff, I'd rather not be associated with it. As a shopper, I'm admittedly more influenced by price, but I do avoid brands with notorious reputations. [E] Last year, for instance, I turned down an internship after reading employee reviews describing unpaid overtime and a toxic **company culture**. [C] So while I'm not a perfect consumer, **transparency** and **fair treatment** of workers definitely shape my decisions, and I expect they'll matter even more as my career develops." },
        { q: "Sometimes, companies face tough choices—like balancing profit with doing the right thing. Do you believe most businesses today are genuinely trying to be responsible, or are they mostly concerned with public image? Why do you feel that way?",
          lx: ["public image", "greenwashing", "profit"],
          model: "[A] I think most businesses care more about their **public image**. [R] Being responsible is popular now, so companies talk about it in advertising, but they don't always change what they do. Their main goal is still **profit**. [E] For example, a big fashion brand had a campaign about recycling old clothes, but at the same time it produced millions of cheap clothes every month. People call this **greenwashing**. Of course, some companies are really trying, but they are usually smaller. [C] So I'm a bit skeptical about big companies' promises.",
          model5: "[A] I suspect most large businesses are primarily concerned with their **public image**, though there are genuine exceptions. [R] Social responsibility has become a powerful marketing tool, so companies are eager to talk about it, yet their core priority remains **profit**, and real change is often expensive. [E] A major fashion brand, for instance, ran a high-profile campaign encouraging customers to recycle old clothes while simultaneously producing millions of cheap garments every month — a textbook example of **greenwashing**. Smaller companies, by contrast, often make real sacrifices for their values, partly because their founders' reputations are on the line. [C] So I remain rather skeptical, and I judge companies by their actions rather than their advertising." },
        { q: "Final question. Do you think governments or consumers should do more to hold businesses accountable for their actions? Why or why not—and what kinds of changes would you personally like to see in how companies operate?",
          lx: ["hold accountable", "regulation", "transparency"],
          model: "[A] I think both governments and consumers should do more, but governments are more important. [R] Consumers can stop buying from bad companies, but most people just look at the price. Governments can make laws and fine companies that break the rules. [E] For example, in some countries, companies must show how much CO2 they produce, and this made many of them reduce pollution. Personally, I'd like companies to be more open about how much they pay workers and where their products are made. [C] So we need strong rules and more **transparency**.",
          model5: "[A] Both should do more, but I believe governments have the greater responsibility. [R] Consumers can certainly boycott irresponsible brands, yet in reality most people simply buy whatever is cheapest. Governments, on the other hand, can introduce **regulation** and impose fines that genuinely **hold** companies **accountable**. [E] In several European countries, for instance, large companies are now legally required to report their carbon emissions, and many have cut them significantly as a result. What I'd personally like to see is far greater **transparency** about pay gaps and supply chains, so that people know exactly who made their products and under what conditions. [C] In short, strong rules backed by informed consumers would make the biggest difference." }
      ]}

        model5: "[A] It really depends on the task, although I generally concentrate better on my own. [R] Working alone lets me focus deeply and set my own pace, whereas teamwork inevitably involves meetings and compromises that slow things down. **That said**, complex or creative projects almost always benefit from a mix of perspectives. [E] I always write essays alone, for instance, ideally in a silent corner of the library. For our group business project, by contrast, the ideas we developed together were far stronger than anything I could have come up with by myself. [C] So for focused tasks I prefer to work independently, but for creative ones I'd much rather **work as part of a team**.",

        model5: "[A] Apart from genuine emergencies, I don't believe they should. [R] Everyone needs time to rest and focus on their personal lives; if employees are permanently reachable, they never truly **switch off**, and chronic stress becomes almost inevitable. [E] My sister's boss, for instance, used to send messages late at night, and she felt obliged to reply immediately, which left her constantly on edge. Once her company introduced a rule banning emails after seven, morale noticeably improved. In fact, some countries, such as France, have even made the right to disconnect a legal requirement. [C] So I think evenings and weekends should belong to employees, not their employers.",
