<script>
/* =====================================================================
   КОНТЕНТ УРОКА: SHOPPING & FASHION
   Новая тема = копия файла: меняются LESSON, HERO_ART и IDIOM_ART.
   Общий движок и стили — topic-engine.js и topic-engine.css.
   **слово** — подсветка целевой лексики.
   _слово_ в коллокациях — «ключевой кубик».
   [A] [R] [E] [C] в модельных ответах — цветная структура:
   A = прямой ответ, R = причина, E = пример, C = вывод.
   ===================================================================== */
const LESSON = {
  slug: "shopping",
  titleEn: "Shopping & Fashion",
  titleRu: "Шопинг и мода",
  category: "Личное",
  intro: "Онлайн или в магазине, отзывы и бренды, реклама и инфлюенсеры, личный стиль, быстрая мода и будущее магазинов — одна из самых частых тем в Take an Interview. Разбираем лексику, которая звучит естественно, и отрабатываем её на всех вопросах по теме из базы.",
  meta: [["≈ 60", "минут"], ["27", "слов · 2 уровня"], ["20", "коллокаций"], ["9", "идиом"], ["{Q}", "вопросов для обсуждения"]],

  frames: {
    warmup:    { icon: "flame",      time: "3 мин",  steps: ["Нажми динамик или прочитай вопрос", "Ответь вслух за 20 секунд", "Без подсказок — это «до урока»"] },
    vocab:     { icon: "book",       time: "10 мин", steps: ["Пройди по пути покупки на схеме", "Найди себя на шкале", "Слова: начни с Core, слушай и повторяй"] },
    coll:      { icon: "link",       time: "8 мин",  steps: ["Учи сочетание целиком", "Цветной кубик — то, что чаще путают", "Скажи с 5 сочетаниями фразу о себе"] },
    idioms:    { icon: "quote",      time: "6 мин",  steps: ["Посмотри картинку — запомни образ", "Плашка «Можно» — смело в ответы", "Выбери 2 идиомы на сегодня"] },
    expr:      { icon: "megaphone",  time: "5 мин",  steps: ["Послушай интонацию", "По 1 фразе из каждой группы", "Запомни шкалу 45 секунд"] },
    check:     { icon: "puzzle",     time: "10 мин", steps: ["4 мини-игры", "Цель — 100% в Matching и Gap-fill", "Карточки — пока не узнаёшь все"] },
    repeat:    { icon: "headphones", time: "5 мин",  steps: ["Слушай, не читая", "Повтори слово в слово", "Включи запись и сравни"] },
    interview: { icon: "mic",        time: "15 мин", steps: ["Выбери сет — начни с Official", "Пройди все вопросы подряд, без пауз", "Сравни с моделью: цвета = структура"] },
    club:      { icon: "chat",       time: "30+ мин", steps: ["Возьми 1–2 блока на занятие", "Ответь, потом — на «Копнём глубже»", "Отметь «Обсудили» или крути рулетку"] },
    self:      { icon: "checkCircle",time: "3 мин",  steps: ["Прослушай свои записи", "Отметь, что получилось", "Цель — 15+ отмеченных слов"] }
  },

  warmup: [
    "Do you enjoy shopping, or is it something you try to avoid?",
    "What was the last thing you bought online?",
    "Is there a store you always go back to? Why?",
    "How would you describe your style in three words?"
  ],

  /* Путь покупки: равные ветки, вместо процента — tag */
  flow: {
    icon: "cart",
    title: "Путь покупки: от «хочу» до «купил»",
    source: { kicker: "Это бросилось в глаза…", title: "I want it!", ru: "мне это нужно?", words: ["catch my eye", "tempted", "browse"] },
    branches: [
      { title: "Need it", ru: "нужная вещь", sub: "essentials · buy it", tag: "Купить", color: "#0ea5e9", words: ["essentials", "run out of", "replace"] },
      { title: "Wait & compare", ru: "подумать и сравнить", sub: "smart shopper", tag: "Подождать", color: "#8b5cf6", words: ["read reviews", "compare prices", "shop around", "wishlist"] },
      { title: "Just want it", ru: "просто хочется", sub: "impulse buy", tag: "Импульс", color: "#ec4899", words: ["impulse buy", "treat myself", "retail therapy", "buyer's remorse"] }
    ],
    notes: [
      "<b>buyer's remorse</b> — сожаление после покупки, частый финал ветки «Импульс»",
      "Готовая фраза: <i>Before I buy anything, I ask myself one question: do I need it, or do I just want it?</i>"
    ]
  },

  scale: {
    title: "Love it or hate it? Перетащи кружок туда, где ты",
    left: "SHOPPING IS A CHORE", right: "SHOPAHOLIC",
    words: [
      { w: "a chore", p: 5 }, { w: "get in and get out", p: 17 }, { w: "only when I need to", p: 31 }, { w: "browse", p: 45 },
      { w: "window-shopping", p: 59 }, { w: "retail therapy", p: 72 }, { w: "splurge", p: 85 }, { w: "shopaholic", p: 97 }
    ],
    says: [
      { max: 25,  t: "Honestly, shopping is **a chore** for me — I know what I need, I **get in and get out**." },
      { max: 50,  t: "I only shop **when I need to**, but I don't mind **browsing** for a while if I have time." },
      { max: 75,  t: "I actually enjoy shopping. On weekends I sometimes go **window-shopping** just for fun." },
      { max: 101, t: "I'll admit it — shopping is my **retail therapy**. After a hard week, I love to **treat myself**." }
    ]
  },

  vocab: [
    { en: "browse", pos: "v", ru: "просматривать товары, «гулять» по магазину", ex: "I like to browse online before I go to the store.", level: "core" },
    { en: "bargain", pos: "n", ru: "выгодная покупка", ex: "This jacket was a real bargain — seventy percent off.", level: "core" },
    { en: "refund", pos: "n", ru: "возврат денег", ex: "I returned the shoes and got a full refund.", level: "core" },
    { en: "exchange", pos: "v / n", ru: "обменять; обмен", ex: "Can I exchange this shirt for a smaller size?", level: "core" },
    { en: "checkout", pos: "n", ru: "касса; оформление заказа", ex: "There was a long line at the checkout.", level: "core" },
    { en: "delivery", pos: "n", ru: "доставка", ex: "Free delivery is the main reason I order online.", level: "core" },
    { en: "out of stock", pos: "adj", ru: "нет в наличии", ex: "The size I wanted was out of stock.", level: "core" },
    { en: "customer service", pos: "n", ru: "обслуживание клиентов", ex: "Good customer service makes me come back to a store.", level: "core" },
    { en: "brand", pos: "n", ru: "бренд, марка", ex: "I don't care much about brands — quality matters more.", level: "core" },
    { en: "outfit", pos: "n", ru: "образ, комплект одежды", ex: "I usually plan my outfit the night before.", level: "core" },
    { en: "try on", pos: "phr v", ru: "примерить", ex: "I always try clothes on before buying them.", level: "core" },
    { en: "fit", pos: "v", ru: "подходить по размеру", ex: "These jeans don't fit me anymore.", level: "core" },
    { en: "suit", pos: "v", ru: "идти, быть к лицу", ex: "Bright colors really suit you.", level: "core" },
    { en: "trendy", pos: "adj", ru: "модный, трендовый", ex: "Trendy clothes go out of style very quickly.", level: "core" },
    { en: "second-hand", pos: "adj", ru: "подержанный, б/у", ex: "Half of my wardrobe is second-hand.", level: "core" },

    { en: "consumerism", pos: "n", ru: "потребительство, культ потребления", ex: "Black Friday is a perfect example of modern consumerism.", level: "adv" },
    { en: "retailer", pos: "n", ru: "розничный продавец, магазин", ex: "Online retailers can often offer lower prices.", level: "adv" },
    { en: "brick-and-mortar store", pos: "n", ru: "обычный (физический) магазин", ex: "Many brick-and-mortar stores are struggling to compete.", level: "adv" },
    { en: "convenience", pos: "n", ru: "удобство", ex: "For me, convenience matters more than price.", level: "adv" },
    { en: "marketing ploy", pos: "n", ru: "маркетинговая уловка", ex: "'Only three left!' is often just a marketing ploy.", level: "adv" },
    { en: "fast fashion", pos: "n", ru: "быстрая мода (дешёвая одежда на один сезон)", ex: "Fast fashion is cheap, but it creates a huge amount of waste.", level: "adv" },
    { en: "sustainable", pos: "adj", ru: "экологичный, устойчивый", ex: "I try to buy from more sustainable brands.", level: "adv" },
    { en: "overconsumption", pos: "n", ru: "чрезмерное потребление", ex: "Overconsumption is one of the biggest environmental problems today.", level: "adv" },
    { en: "self-expression", pos: "n", ru: "самовыражение", ex: "For me, clothing is a form of self-expression.", level: "adv" },
    { en: "word of mouth", pos: "n", ru: "сарафанное радио, рекомендации знакомых", ex: "I found my favorite store through word of mouth.", level: "adv" },
    { en: "haul", pos: "n", ru: "«улов» покупок; видеообзор покупок", ex: "Shopping haul videos make people want to buy even more.", level: "adv" },
    { en: "counterfeit", pos: "adj / n", ru: "поддельный; подделка", ex: "Some marketplaces sell counterfeit sneakers.", level: "adv" }
  ],

  collocations: [
    { icon: "store", group: "Где и как покупаем", items: [
      { en: "_shop_ online", ru: "покупать онлайн", ex: "I shop online for almost everything except shoes." },
      { en: "go _window-shopping_", ru: "смотреть витрины, ничего не покупая", ex: "On Sundays we often go window-shopping downtown." },
      { en: "_place_ an order", ru: "оформить заказ", ex: "I placed an order on Monday, and it arrived on Wednesday." },
      { en: "_track_ a package", ru: "отслеживать посылку", ex: "I can track my package in the app." },
      { en: "_browse_ the aisles", ru: "бродить между рядами", ex: "I love to browse the aisles of old bookstores." }
    ]},
    { icon: "tag", group: "Решение о покупке", items: [
      { en: "_read_ reviews", ru: "читать отзывы", ex: "I always read reviews before I buy electronics." },
      { en: "_compare_ prices", ru: "сравнивать цены", ex: "Apps make it really easy to compare prices." },
      { en: "_catch_ my eye", ru: "бросаться в глаза", ex: "This bag caught my eye in the shop window." },
      { en: "_good value_ for money", ru: "хорошее соотношение цены и качества", ex: "This backpack is really good value for money." },
      { en: "_snap up_ a bargain", ru: "ухватить выгодную покупку", ex: "I snapped up a bargain in the January sales." }
    ]},
    { icon: "undo", group: "После покупки", items: [
      { en: "_return_ an item", ru: "вернуть товар", ex: "I returned an item because it was the wrong size." },
      { en: "_get_ a full refund", ru: "получить деньги назад полностью", ex: "I got a full refund within a week." },
      { en: "_exchange_ it for a different size", ru: "обменять на другой размер", ex: "I exchanged the sweater for a medium." },
      { en: "_leave_ a review", ru: "оставить отзыв", ex: "I always leave a review if the service was great." },
      { en: "_make_ a complaint", ru: "пожаловаться", ex: "I made a complaint because the package arrived damaged." }
    ]},
    { icon: "shirt", group: "Мода и стиль", items: [
      { en: "_keep up with_ trends", ru: "следить за трендами", ex: "I don't try to keep up with every new trend." },
      { en: "_go out of_ fashion", ru: "выйти из моды", ex: "Skinny jeans went out of fashion a few years ago." },
      { en: "_dress up_ / _dress down_", ru: "нарядиться / одеться попроще", ex: "I like to dress up for special occasions." },
      { en: "_express_ yourself", ru: "самовыражаться", ex: "Clothes are an easy way to express yourself." },
      { en: "a _timeless_ piece", ru: "вещь вне времени", ex: "A good wool coat is a timeless piece." }
    ]}
  ],

  idioms: [
    { art: "drop", lit: "буквально: «ходить по магазинам, пока не упадёшь»", en: "shop till you drop", ru: "шопиться до упаду", meaning: "ходить по магазинам очень долго, до усталости", ex: "On our trip to Milan, we shopped till we dropped.", reg: "ok", note: "Хорошо звучит в рассказе о поездке или распродаже." },
    { art: "steal", lit: "буквально: «кража»", en: "a steal", ru: "почти даром, очень выгодно", meaning: "вещь, купленная намного дешевле её реальной цены", ex: "At ten dollars, these boots were a steal.", reg: "ok", note: "Естественно и коротко: It was a steal!" },
    { art: "ripoff", lit: "буквально: «содрать»", en: "a rip-off", ru: "грабёж, обдираловка", meaning: "слишком высокая, нечестная цена", ex: "Eight dollars for a coffee? That's a rip-off!", reg: "ok", note: "Разговорное, но для интервью уместно — эмоционально и ясно." },
    { art: "rage", lit: "буквально: «вся ярость»", en: "all the rage", ru: "писк моды", meaning: "очень популярное прямо сейчас", ex: "Wide-leg jeans are all the rage right now.", reg: "ok", note: "Отлично для вопросов о трендах." },
    { art: "musthave", lit: "буквально: «обязательно иметь»", en: "a must-have", ru: "вещь, которая «обязательно нужна»", meaning: "то, что считается необходимым (часто из-за рекламы)", ex: "Every season, magazines tell us about the new must-haves.", reg: "ok", note: "Удобно критиковать рекламу: the so-called must-haves…" },
    { art: "megaphone", lit: "буквально: «купиться на что-то»", en: "buy into sth", ru: "поверить, «купиться» (на идею)", meaning: "принять идею, часто навязанную рекламой", ex: "I don't buy into the idea that expensive means better.", reg: "ok", note: "Сильная фраза для вопросов о рекламе и брендах." },
    { art: "remorse", lit: "буквально: «угрызения покупателя»", en: "buyer's remorse", ru: "сожаление после покупки", meaning: "чувство, что не стоило это покупать", ex: "I had terrible buyer's remorse after buying that phone.", reg: "ok", note: "Идеально для вопроса «a purchase you regretted»." },
    { art: "nose", lit: "буквально: «платить через нос»", en: "pay through the nose", ru: "сильно переплатить", meaning: "заплатить намного больше, чем вещь стоит", ex: "We paid through the nose for concert merch.", reg: "ok", note: "Хорошо звучит в рассказе о туристических местах и концертах." },
    { art: "crown", lit: "буквально: «клиент всегда прав»", en: "the customer is always right", ru: "клиент всегда прав", meaning: "магазин должен выполнять желания покупателя", ex: "Some people think the customer is always right, but I disagree.", reg: "careful", note: "Клише. Хорошо, только если ты с ним споришь." }
  ],

  expressions: [
    { icon: "play", fn: "Начать ответ", items: [
      "To be honest, I'm not a big fan of shopping.",
      "I'd say I'm more of an online shopper.",
      "It really depends on what I'm buying."
    ]},
    { icon: "bulb", fn: "Причина", items: [
      "The main reason is convenience — I can do it from my couch.",
      "What matters most to me is being able to try things on.",
      "For me, it all comes down to price and quality."
    ]},
    { icon: "camera", fn: "Пример из жизни", items: [
      "Just last week, for example, I ordered …",
      "The last time I went to the mall, I …",
      "I remember buying a jacket that …"
    ]},
    { icon: "scales", fn: "Баланс и контраст", items: [
      "Online shopping is convenient; that said, nothing beats trying things on.",
      "While it's true that stores can be more expensive, …",
      "On the flip side, …"
    ]},
    { icon: "trending", fn: "Будущее", items: [
      "I can easily imagine a future where …",
      "In ten years, I think most people will …",
      "Physical stores won't disappear; they'll just change."
    ]},
    { icon: "flag", fn: "Завершить", items: [
      "So all in all, I prefer a mix of both.",
      "That's why I'd rather …",
      "So for me, the experience matters more than the price."
    ]}
  ],

  answerSteps: [
    { k: "A", s: 5,  i: "I mostly shop online, to be honest." },
    { k: "R", s: 12, i: "The main reason is convenience…" },
    { k: "E", s: 22, i: "Just last week, for example…" },
    { k: "C", s: 6,  i: "So all in all, …" }
  ],

  matching: [
    { a: "a steal", b: "very cheap for what it is really worth" },
    { a: "a rip-off", b: "an unfair, far too high price" },
    { a: "all the rage", b: "extremely fashionable right now" },
    { a: "buyer's remorse", b: "regret after buying something" },
    { a: "pay through the nose", b: "pay much more than something is worth" },
    { a: "buy into sth", b: "believe an idea, often from advertising" }
  ],

  gapfill: [
    { t: "I always ___ reviews before I buy electronics.", a: ["read"] },
    { t: "This bag ___ my eye in the shop window.", a: ["caught"] },
    { t: "The shoes didn't fit, so I ___ them and got a full refund.", a: ["returned"] },
    { t: "I placed an ___ on Monday, and it arrived on Wednesday.", a: ["order"] },
    { t: "I don't try to keep ___ with every new trend.", a: ["up"] },
    { t: "Skinny jeans have gone out of ___.", a: ["fashion", "style"] },
    { t: "At ten dollars, these boots were a real ___.", a: ["steal", "bargain"] },
    { t: "Can I ___ this shirt for a smaller size?", a: ["exchange"] }
  ],

  paraphrase: [
    { plain: "I don't like shopping.", better: ["Honestly, shopping is a bit of **a chore** for me.", "I'm not a big fan of shopping — I **get in and get out**."] },
    { plain: "It was very cheap.", better: ["It was **a steal**!", "I **snapped up a bargain**."] },
    { plain: "It was too expensive.", better: ["Honestly, it was **a rip-off**.", "We **paid through the nose** for it."] },

  ],

  /* ===== Реальные сеты Take an Interview по теме (из базы платформы) ===== */
  sets: [
    { id: "s055", badge: "official", title: "Online Shopping", src: "Official TOEFL · 055 / 070",
      scenario: "You have volunteered for a research study at your university about online shopping. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, how often do you shop online? Do you do it weekly, monthly, or less often?",
          lx: ["place an order", "convenience", "delivery"],
          model: "[A] I'd say I shop online at least once a week, so pretty often. [R] As a student, I don't have much free time, and **convenience** matters a lot to me — I can **place an order** in two minutes between classes. [E] For example, last week I ordered a phone charger, some notebooks and a birthday present for my sister, and everything was **delivered** to my dorm in two days. I didn't have to go anywhere. [C] So online shopping has become a normal part of my week, especially for small, everyday things." },
