<script>
/* =====================================================================

   Новая тема = копия файла: меняются LESSON, HERO_ART и IDIOM_ART.
   Общий движок и стили — topic-engine.js и topic-engine.css.
   **слово** — подсветка целевой лексики.
   _слово_ в коллокациях — «ключевой кубик».
   [A] [R] [E] [C] в модельных ответах — цветная структура:
   A = прямой ответ, R = причина, E = пример, C = вывод.
   ===================================================================== */
const LESSON = {
  slug: "shopping",
  titleEn: "Shopping & Fashion",
  titleRu: "Шопинг и мода",
  category: "Личное",
  intro: "Онлайн или в магазине, отзывы и бренды, реклама и инфлюенсеры, личный стиль, быстрая мода и будущее магазинов — одна из самых частых тем в Take an Interview. Разбираем лексику, которая звучит естественно, и отрабатываем её на всех вопросах по теме из базы.",
  meta: [["≈ 60", "минут"], ["27", "слов · 2 уровня"], ["20", "коллокаций"], ["9", "идиом"], ["{Q}", "вопросов для обсуждения"]],

  frames: {
    warmup:    { icon: "flame",      time: "3 мин",  steps: ["Нажми динамик или прочитай вопрос", "Ответь вслух за 20 секунд", "Без подсказок — это «до урока»"] },
    vocab:     { icon: "book",       time: "10 мин", steps: ["Пройди по пути покупки на схеме", "Найди себя на шкале", "Слова: начни с Core, слушай и повторяй"] },
    coll:      { icon: "link",       time: "8 мин",  steps: ["Учи сочетание целиком", "Цветной кубик — то, что чаще путают", "Скажи с 5 сочетаниями фразу о себе"] },
    idioms:    { icon: "quote",      time: "6 мин",  steps: ["Посмотри картинку — запомни образ", "Плашка «Можно» — смело в ответы", "Выбери 2 идиомы на сегодня"] },
    expr:      { icon: "megaphone",  time: "5 мин",  steps: ["Послушай интонацию", "По 1 фразе из каждой группы", "Запомни шкалу 45 секунд"] },
    check:     { icon: "puzzle",     time: "10 мин", steps: ["4 мини-игры", "Цель — 100% в Matching и Gap-fill", "Карточки — пока не узнаёшь все"] },
    repeat:    { icon: "headphones", time: "5 мин",  steps: ["Слушай, не читая", "Повтори слово в слово", "Включи запись и сравни"] },
    interview: { icon: "mic",        time: "15 мин", steps: ["Выбери сет — начни с Official", "Пройди все вопросы подряд, без пауз", "Сравни с моделью: цвета = структура"] },
    club:      { icon: "chat",       time: "30+ мин", steps: ["Возьми 1–2 блока на занятие", "Ответь, потом — на «Копнём глубже»", "Отметь «Обсудили» или крути рулетку"] },
    self:      { icon: "checkCircle",time: "3 мин",  steps: ["Прослушай свои записи", "Отметь, что получилось", "Цель — 15+ отмеченных слов"] }
  },

  warmup: [
    "Do you enjoy shopping, or is it something you try to avoid?",
    "What was the last thing you bought online?",
    "Is there a store you always go back to? Why?",
    "How would you describe your style in three words?"
  ],

  /* Путь покупки: равные ветки, вместо процента — tag */
  flow: {
    icon: "cart",
    title: "Путь покупки: от «хочу» до «купил»",
    source: { kicker: "Это бросилось в глаза…", title: "I want it!", ru: "мне это нужно?", words: ["catch my eye", "tempted", "browse"] },
    branches: [
      { title: "Need it", ru: "нужная вещь", sub: "essentials · buy it", tag: "Купить", color: "#0ea5e9", words: ["essentials", "run out of", "replace"] },
      { title: "Wait & compare", ru: "подумать и сравнить", sub: "smart shopper", tag: "Подождать", color: "#8b5cf6", words: ["read reviews", "compare prices", "shop around", "wishlist"] },
      { title: "Just want it", ru: "просто хочется", sub: "impulse buy", tag: "Импульс", color: "#ec4899", words: ["impulse buy", "treat myself", "retail therapy", "buyer's remorse"] }
    ],
    notes: [
      "<b>buyer's remorse</b> — сожаление после покупки, частый финал ветки «Импульс»",
      "Готовая фраза: <i>Before I buy anything, I ask myself one question: do I need it, or do I just want it?</i>"
    ]
  },

  scale: {
    title: "Love it or hate it? Перетащи кружок туда, где ты",
    left: "SHOPPING IS A CHORE", right: "SHOPAHOLIC",
    words: [
      { w: "a chore", p: 5 }, { w: "get in and get out", p: 17 }, { w: "only when I need to", p: 31 }, { w: "browse", p: 45 },
      { w: "window-shopping", p: 59 }, { w: "retail therapy", p: 72 }, { w: "splurge", p: 85 }, { w: "shopaholic", p: 97 }
    ],
    says: [
      { max: 25,  t: "Honestly, shopping is **a chore** for me — I know what I need, I **get in and get out**." },
      { max: 50,  t: "I only shop **when I need to**, but I don't mind **browsing** for a while if I have time." },
      { max: 75,  t: "I actually enjoy shopping. On weekends I sometimes go **window-shopping** just for fun." },
      { max: 101, t: "I'll admit it — shopping is my **retail therapy**. After a hard week, I love to **treat myself**." }
    ]
  },

  vocab: [
    { en: "browse", pos: "v", ru: "просматривать товары, «гулять» по магазину", ex: "I like to browse online before I go to the store.", level: "core" },
    { en: "bargain", pos: "n", ru: "выгодная покупка", ex: "This jacket was a real bargain — seventy percent off.", level: "core" },
    { en: "refund", pos: "n", ru: "возврат денег", ex: "I returned the shoes and got a full refund.", level: "core" },
    { en: "exchange", pos: "v / n", ru: "обменять; обмен", ex: "Can I exchange this shirt for a smaller size?", level: "core" },
    { en: "checkout", pos: "n", ru: "касса; оформление заказа", ex: "There was a long line at the checkout.", level: "core" },
    { en: "delivery", pos: "n", ru: "доставка", ex: "Free delivery is the main reason I order online.", level: "core" },
    { en: "out of stock", pos: "adj", ru: "нет в наличии", ex: "The size I wanted was out of stock.", level: "core" },
    { en: "customer service", pos: "n", ru: "обслуживание клиентов", ex: "Good customer service makes me come back to a store.", level: "core" },
    { en: "brand", pos: "n", ru: "бренд, марка", ex: "I don't care much about brands — quality matters more.", level: "core" },
    { en: "outfit", pos: "n", ru: "образ, комплект одежды", ex: "I usually plan my outfit the night before.", level: "core" },
    { en: "try on", pos: "phr v", ru: "примерить", ex: "I always try clothes on before buying them.", level: "core" },
    { en: "fit", pos: "v", ru: "подходить по размеру", ex: "These jeans don't fit me anymore.", level: "core" },
    { en: "suit", pos: "v", ru: "идти, быть к лицу", ex: "Bright colors really suit you.", level: "core" },
    { en: "trendy", pos: "adj", ru: "модный, трендовый", ex: "Trendy clothes go out of style very quickly.", level: "core" },
    { en: "second-hand", pos: "adj", ru: "подержанный, б/у", ex: "Half of my wardrobe is second-hand.", level: "core" },

    { en: "consumerism", pos: "n", ru: "потребительство, культ потребления", ex: "Black Friday is a perfect example of modern consumerism.", level: "adv" },
    { en: "retailer", pos: "n", ru: "розничный продавец, магазин", ex: "Online retailers can often offer lower prices.", level: "adv" },
    { en: "brick-and-mortar store", pos: "n", ru: "обычный (физический) магазин", ex: "Many brick-and-mortar stores are struggling to compete.", level: "adv" },
    { en: "convenience", pos: "n", ru: "удобство", ex: "For me, convenience matters more than price.", level: "adv" },
    { en: "marketing ploy", pos: "n", ru: "маркетинговая уловка", ex: "'Only three left!' is often just a marketing ploy.", level: "adv" },
    { en: "fast fashion", pos: "n", ru: "быстрая мода (дешёвая одежда на один сезон)", ex: "Fast fashion is cheap, but it creates a huge amount of waste.", level: "adv" },
    { en: "sustainable", pos: "adj", ru: "экологичный, устойчивый", ex: "I try to buy from more sustainable brands.", level: "adv" },
    { en: "overconsumption", pos: "n", ru: "чрезмерное потребление", ex: "Overconsumption is one of the biggest environmental problems today.", level: "adv" },
    { en: "self-expression", pos: "n", ru: "самовыражение", ex: "For me, clothing is a form of self-expression.", level: "adv" },
    { en: "word of mouth", pos: "n", ru: "сарафанное радио, рекомендации знакомых", ex: "I found my favorite store through word of mouth.", level: "adv" },
    { en: "haul", pos: "n", ru: "«улов» покупок; видеообзор покупок", ex: "Shopping haul videos make people want to buy even more.", level: "adv" },
    { en: "counterfeit", pos: "adj / n", ru: "поддельный; подделка", ex: "Some marketplaces sell counterfeit sneakers.", level: "adv" }
  ],

  collocations: [
    { icon: "store", group: "Где и как покупаем", items: [
      { en: "_shop_ online", ru: "покупать онлайн", ex: "I shop online for almost everything except shoes." },
      { en: "go _window-shopping_", ru: "смотреть витрины, ничего не покупая", ex: "On Sundays we often go window-shopping downtown." },
      { en: "_place_ an order", ru: "оформить заказ", ex: "I placed an order on Monday, and it arrived on Wednesday." },
      { en: "_track_ a package", ru: "отслеживать посылку", ex: "I can track my package in the app." },
      { en: "_browse_ the aisles", ru: "бродить между рядами", ex: "I love to browse the aisles of old bookstores." }
    ]},
    { icon: "tag", group: "Решение о покупке", items: [
      { en: "_read_ reviews", ru: "читать отзывы", ex: "I always read reviews before I buy electronics." },
      { en: "_compare_ prices", ru: "сравнивать цены", ex: "Apps make it really easy to compare prices." },
      { en: "_catch_ my eye", ru: "бросаться в глаза", ex: "This bag caught my eye in the shop window." },
      { en: "_good value_ for money", ru: "хорошее соотношение цены и качества", ex: "This backpack is really good value for money." },
      { en: "_snap up_ a bargain", ru: "ухватить выгодную покупку", ex: "I snapped up a bargain in the January sales." }
    ]},
    { icon: "undo", group: "После покупки", items: [
      { en: "_return_ an item", ru: "вернуть товар", ex: "I returned an item because it was the wrong size." },
      { en: "_get_ a full refund", ru: "получить деньги назад полностью", ex: "I got a full refund within a week." },
      { en: "_exchange_ it for a different size", ru: "обменять на другой размер", ex: "I exchanged the sweater for a medium." },
      { en: "_leave_ a review", ru: "оставить отзыв", ex: "I always leave a review if the service was great." },
      { en: "_make_ a complaint", ru: "пожаловаться", ex: "I made a complaint because the package arrived damaged." }
    ]},
    { icon: "shirt", group: "Мода и стиль", items: [
      { en: "_keep up with_ trends", ru: "следить за трендами", ex: "I don't try to keep up with every new trend." },
      { en: "_go out of_ fashion", ru: "выйти из моды", ex: "Skinny jeans went out of fashion a few years ago." },
      { en: "_dress up_ / _dress down_", ru: "нарядиться / одеться попроще", ex: "I like to dress up for special occasions." },
      { en: "_express_ yourself", ru: "самовыражаться", ex: "Clothes are an easy way to express yourself." },
      { en: "a _timeless_ piece", ru: "вещь вне времени", ex: "A good wool coat is a timeless piece." }
    ]}
  ],

  idioms: [
    { art: "drop", lit: "буквально: «ходить по магазинам, пока не упадёшь»", en: "shop till you drop", ru: "шопиться до упаду", meaning: "ходить по магазинам очень долго, до усталости", ex: "On our trip to Milan, we shopped till we dropped.", reg: "ok", note: "Хорошо звучит в рассказе о поездке или распродаже." },
    { art: "steal", lit: "буквально: «кража»", en: "a steal", ru: "почти даром, очень выгодно", meaning: "вещь, купленная намного дешевле её реальной цены", ex: "At ten dollars, these boots were a steal.", reg: "ok", note: "Естественно и коротко: It was a steal!" },
    { art: "ripoff", lit: "буквально: «содрать»", en: "a rip-off", ru: "грабёж, обдираловка", meaning: "слишком высокая, нечестная цена", ex: "Eight dollars for a coffee? That's a rip-off!", reg: "ok", note: "Разговорное, но для интервью уместно — эмоционально и ясно." },
    { art: "rage", lit: "буквально: «вся ярость»", en: "all the rage", ru: "писк моды", meaning: "очень популярное прямо сейчас", ex: "Wide-leg jeans are all the rage right now.", reg: "ok", note: "Отлично для вопросов о трендах." },
    { art: "musthave", lit: "буквально: «обязательно иметь»", en: "a must-have", ru: "вещь, которая «обязательно нужна»", meaning: "то, что считается необходимым (часто из-за рекламы)", ex: "Every season, magazines tell us about the new must-haves.", reg: "ok", note: "Удобно критиковать рекламу: the so-called must-haves…" },
    { art: "megaphone", lit: "буквально: «купиться на что-то»", en: "buy into sth", ru: "поверить, «купиться» (на идею)", meaning: "принять идею, часто навязанную рекламой", ex: "I don't buy into the idea that expensive means better.", reg: "ok", note: "Сильная фраза для вопросов о рекламе и брендах." },
    { art: "remorse", lit: "буквально: «угрызения покупателя»", en: "buyer's remorse", ru: "сожаление после покупки", meaning: "чувство, что не стоило это покупать", ex: "I had terrible buyer's remorse after buying that phone.", reg: "ok", note: "Идеально для вопроса «a purchase you regretted»." },
    { art: "nose", lit: "буквально: «платить через нос»", en: "pay through the nose", ru: "сильно переплатить", meaning: "заплатить намного больше, чем вещь стоит", ex: "We paid through the nose for concert merch.", reg: "ok", note: "Хорошо звучит в рассказе о туристических местах и концертах." },
    { art: "crown", lit: "буквально: «клиент всегда прав»", en: "the customer is always right", ru: "клиент всегда прав", meaning: "магазин должен выполнять желания покупателя", ex: "Some people think the customer is always right, but I disagree.", reg: "careful", note: "Клише. Хорошо, только если ты с ним споришь." }

  expressions: [
    { icon: "play", fn: "Начать ответ", items: [
      "To be honest, I'm not a big fan of shopping.",
      "I'd say I'm more of an online shopper.",
      "It really depends on what I'm buying."
    ]},
    { icon: "bulb", fn: "Причина", items: [
      "The main reason is convenience — I can do it from my couch.",
      "What matters most to me is being able to try things on.",
      "For me, it all comes down to price and quality."
    ]},
    { icon: "camera", fn: "Пример из жизни", items: [
      "Just last week, for example, I ordered …",
      "The last time I went to the mall, I …",
      "I remember buying a jacket that …"
    ]},
    { icon: "scales", fn: "Баланс и контраст", items: [
      "Online shopping is convenient; that said, nothing beats trying things on.",
      "While it's true that stores can be more expensive, …",
      "On the flip side, …"
    ]},
    { icon: "trending", fn: "Будущее", items: [

    { icon: "flag", fn: "Завершить", items: [

  ],

  answerSteps: [
    { k: "A", s: 5,  i: "I mostly shop online, to be honest." },
    { k: "R", s: 12, i: "The main reason is convenience…" },
    { k: "E", s: 22, i: "Just last week, for example…" },

  ],

  matching: [

  ],

  gapfill: [
    { t: "I always ___ reviews before I buy electronics.", a: ["read"] },
    { t: "This bag ___ my eye in the shop window.", a: ["caught"] },

    { t: "Can I ___ this shirt for a smaller size?", a: ["exchange"] }
  ],

  paraphrase: [
    { plain: "I don't like shopping.", better: ["Honestly, shopping is a bit of **a chore** for me.", "I'm not a big fan of shopping — I **get in and get out**."] },

  /* ===== Реальные сеты Take an Interview по теме (из базы платформы) ===== */
  sets: [
    { id: "s055", badge: "official", title: "Online Shopping", src: "Official TOEFL · 055 / 070",
      scenario: "You have volunteered for a research study at your university about online shopping. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, how often do you shop online? Do you do it weekly, monthly, or less often?", model5: "[A] I'd say I shop online at least once a week, so fairly regularly. [R] As a student with a packed schedule, **convenience** matters enormously to me — I can **place an order** in a couple of minutes between lectures without having to go anywhere. [E] Last week alone, for instance, I ordered a phone charger, a few notebooks and a birthday present for my sister, and everything was **delivered** to my dorm within two days. Had I gone to the shops instead, it would have taken me an entire afternoon. [C] Online shopping, in other words, has become a routine part of my week, particularly for small, everyday items.",
          lx: ["place an order", "convenience", "delivery"],
          model: "[A] I'd say I shop online at least once a week, so pretty often. [R] As a student, I don't have much free time, and **convenience** matters a lot to me — I can **place an order** in two minutes between classes. [E] For example, last week I ordered a phone charger, some notebooks and a birthday present for my sister, and everything was **delivered** to my dorm in two days. I didn't have to go anywhere. [C] So online shopping has become a normal part of my week, especially for small, everyday things." },
        { q: "If you were to shop online, what types of products would you be most likely to buy? For example, would you buy clothing, electronics, or groceries?", model5: "[A] I'd be most likely to buy electronics and books online, whereas clothes are a different story. [R] With electronics, I usually know exactly what I'm looking for, so I can **read reviews**, **compare prices** and often find a better deal than in a store. [E] Clothes, by contrast, are much riskier. Last year, I ordered a jacket that looked fantastic in the photos, but it didn't **fit** at all, and **returning** it turned into a real hassle. Ever since, I've preferred to **try things on** in person. [C] My rule of thumb, then, is online for products with clear specifications and in-store for anything I'm going to wear.",
          lx: ["read reviews", "compare prices", "try on"],
          model: "[A] I'd most likely buy electronics and books online, but probably not clothes. [R] With electronics, I know exactly what I want, so I can **read reviews**, **compare prices** and usually find a better deal than in a store. [E] Clothes are different. Last year I ordered a jacket that looked great in the photos, but it didn't **fit** at all, and **returning** it was a real hassle. Since then, I prefer to **try things on** first. [C] So for me, it's online for things with clear specs, and in person for anything I wear." },
        { q: "Some people believe that online shopping is more convenient than shopping in physical stores, while others think it's a worse experience because it lacks the human interaction of in-person shopping. What is your opinion on this?", model5: "[A] I'd say online shopping is more convenient, but shopping in person is often the better experience. [R] Online, you save time, you can shop at midnight and you can **compare prices** in seconds. **That said**, you lose the human element, and a knowledgeable salesperson can make a genuine difference. [E] When I was buying running shoes, for instance, an assistant at a sports store watched me run on a treadmill and recommended a pair I'd never have chosen myself — they're by far the best shoes I've ever owned. [C] So it really depends on the product: for simple items, online wins, whereas for important purchases I still value real people.",
          lx: ["convenience", "customer service", "that said"],
          model: "[A] I think online shopping is more convenient, but going to a store is often a better experience. [R] Online, you save time, you can shop at midnight, and you can **compare prices** in seconds. **That said**, you lose the human side — a good salesperson can really help you choose. [E] For instance, when I was buying running shoes, an assistant in a sports store watched me run and recommended a pair I would never have picked myself. They're the best shoes I've ever had. [C] So it depends on the product: for simple things, online wins; for important purchases, I still prefer real people." },
        { q: "Some people believe physical stores might one day disappear because of online shopping. What is your opinion on this? Why?", model5: "[A] I don't believe physical stores will disappear, although many of them will have to reinvent themselves. [R] Admittedly, **online retailers** win on price and **convenience**, so shops that simply sell products are already struggling. What the internet can't replace, however, is the experience — touching fabric, **trying things on**, or getting advice from someone who genuinely knows the product. [E] In my city, for example, a large electronics chain closed last year, yet a tiny bookstore with a café next door is packed every weekend, largely because people go there to spend time rather than just to buy. [C] **Brick-and-mortar stores** won't vanish; they'll evolve into places you visit for the experience rather than the purchase.",
          lx: ["brick-and-mortar store", "try on", "in the long run"],
          model: "[A] I don't think physical stores will disappear completely, but they will definitely change. [R] Some **brick-and-mortar stores** are closing because people can get things cheaper online. But shopping is also a social activity, and many people want to see, touch and **try on** products. [E] In my city, for example, a lot of small shops closed, but the ones that survived turned into experiences — a bookstore with a café, a sneaker shop with events on weekends. They're always full. [C] So **in the long run**, stores will become places to experience a brand, not just places to buy things." }
      ]},
    { id: "s119", badge: "official", title: "Shopping Habits", src: "Official TOEFL · 119",
      scenario: "You have volunteered for a research study about shopping habits. You will have a short online interview with a researcher.",
      questions: [
        { q: "Do you shop more frequently online or in physical stores? And why?", model5: "[A] These days, I shop online considerably more often than in physical stores. [R] The main reason is **convenience**: I can compare prices, read reviews and **place an order** within minutes, all without leaving my room. [E] Just last week, for instance, I ordered a desk lamp and some notebooks at midnight, and they were on my doorstep two days later. The one notable exception is clothes and shoes, which I still prefer to **try on** in a store, having been burned by a few online orders that simply didn't fit. [C] In short, I shop online for everyday essentials and in person for anything I'm going to wear.", model: "[A] These days I shop online much more often than in physical stores. [R] The main reason is **convenience** — I can compare prices, read reviews and **place an order** in a few minutes between classes, without traveling anywhere. [E] Just last week, for example, I ordered a desk lamp and some notebooks at midnight, and they were at my door two days later. The only exception is clothes and shoes — I still prefer to **try them on** in a store first. [C] So online for everyday things, and in person for anything I wear.", lx: ["convenience", "brick-and-mortar store", "try on"] },
        { q: "Can you tell me about one or two factors that most influence your decision to purchase a product? For example, do you consider price, brand, or quality? Why?", model5: "[A] For me, the two decisive factors are quality and price, in that order. [R] I'm perfectly willing to pay a little more for something durable, since cheap products often break and you end up buying them twice. Brands, on the other hand, matter far less — I simply don't **buy into** the idea that a famous logo guarantees better quality. [E] When I needed new headphones, for example, I **read reviews**, **compared prices** and eventually chose a lesser-known brand with excellent ratings. They cost half as much as the popular ones and work flawlessly. [C] Essentially, what I'm always looking for is **good value for money**.", model: "[A] For me, the two biggest factors are quality and price. [R] I don't mind paying a bit more if a product will last, because cheap things often break and you end up buying them twice. Brands matter much less — I don't **buy into** the idea that a famous logo means better quality. [E] For example, when I needed headphones, I **read reviews** and **compared prices**, and I chose a less famous brand that had excellent ratings. They were half the price of the popular ones and work perfectly. [C] So I'm always looking for **good value for money**.", lx: ["good value for money", "brand", "read reviews"] },
        { q: "Thinking back to a recent shopping experience, can you describe a product you bought that you were particularly satisfied with and explain why?", model5: "[A] The product I'm most satisfied with is a second-hand bike I bought this autumn. [R] It was an absolute **steal** — roughly a third of the price of a new one — and, more importantly, it has completely transformed my daily routine. [E] Previously, I spent almost forty minutes on a crowded bus every morning, whereas now I cycle to campus in fifteen. Not only do I save money on transport, but I also get regular exercise without even thinking about it. Before buying, I checked the seller's reviews thoroughly, and the bike turned out to be in perfect condition. [C] All in all, it was cheap, practical and **worth every penny**.", model: "[A] The product I'm happiest with is a secondhand bike I bought this fall. [R] It was **a steal** — about a third of the price of a new one — and it completely changed my daily routine. [E] Before, I spent almost forty minutes on the bus every morning. Now I ride to campus in fifteen minutes, I save money on transport, and I get some exercise without even thinking about it. I checked the seller's reviews carefully, and the bike was in perfect condition. [C] So it was cheap, practical and **worth every penny**.", lx: ["a steal", "worth every penny", "catch my eye"] },
        { q: "As online shopping continues to grow, some people believe that physical stores will become obsolete. Do you agree or disagree with this viewpoint? Why or why not?", model5: "[A] I disagree; I don't think physical stores will become obsolete, although many will certainly have to change. [R] **Online retailers** are undeniably cheaper and more convenient, so stores that merely sell products are bound to struggle. **That said**, people still want to see, touch and **try on** things, and shopping remains a social activity for many. [E] In my city, for example, a large electronics store closed down recently, yet a new bookstore with a café opened nearby and is packed every weekend. [C] **Brick-and-mortar stores** will survive, I believe, by offering the kind of experience the internet simply can't replicate.", model: "[A] I disagree — I don't think physical stores will become obsolete, but many of them will change. [R] **Online retailers** are cheaper and more convenient, so stores that only sell products will struggle. **That said**, people still want to see, touch and **try on** things, and shopping is also a social activity. [E] In my city, for example, a big electronics store closed, but a new bookstore with a café opened nearby, and it's always full on weekends. [C] So **brick-and-mortar stores** will survive by offering experiences that the internet can't.", lx: ["obsolete", "online retailers", "that said"] }
      ]},
    { id: "s067", badge: "official", title: "Shopping Habits", src: "Official TOEFL · 067",
      scenario: "You have signed up for a study run by a university research group that is investigating shopping habits. You will have a short video interview with one of the researchers.",
      questions: [
        { q: "When was your last shopping trip and what did you buy? Did you have a good shopping experience?", model5: "[A] My last shopping trip was last Saturday, when I went to the mall to buy a pair of running shoes. [R] I specifically wanted to **try them on** in person, having had several bad experiences with shoes ordered online. [E] As it turned out, it was an excellent experience. The salesperson asked about my running habits, let me test three different pairs on a small treadmill and recommended a model I'd never have considered on my own — they're remarkably comfortable. The only downside was the long queue at the **checkout**. [C] Overall, it reminded me why genuinely good **customer service** is still worth the trip.", model: "[A] My last shopping trip was last Saturday, when I went to the mall to buy running shoes. [R] I wanted to **try them on** in person, because I'd had problems with shoes ordered online before. [E] It turned out to be a really good experience. The salesperson asked about my running habits, let me test three pairs on a small treadmill, and recommended a model I would never have chosen myself. They're incredibly comfortable. The only downside was the long line at the **checkout**. [C] So overall, it reminded me why good **customer service** is still worth a trip to a store.", lx: ["browse", "customer service", "checkout"] },
        { q: "When you shop, which do you like better, shopping for yourself or shopping for others? Why?", model5: "[A] Surprisingly, perhaps, I much prefer shopping for others. [R] When I'm shopping for myself, I tend to overthink everything and worry about the price, whereas buying something for someone I care about feels fun and meaningful. [E] Last month, for example, I spent an entire afternoon looking for a birthday present for my sister. When I spotted a vintage camera in a tiny shop, it immediately **caught my eye**, since she's passionate about photography. Seeing her reaction when she opened it was easily the highlight of my week. [C] For me, then, shopping for others is about the joy it brings rather than the things themselves.", model: "[A] I actually prefer shopping for others. [R] When I shop for myself, I overthink everything and worry about the price, but buying something for someone I love feels fun and meaningful. [E] For example, last month I spent a whole afternoon looking for a birthday present for my sister. When I saw a vintage camera in a small shop, it immediately **caught my eye**, because she loves photography. Her reaction when she opened it was the best part of my week. [C] So for me, shopping for others is about the joy, not the stuff.", lx: ["gift", "catch my eye", "treat myself"] },
        { q: "In recent years, people's shopping preferences have shifted in various ways. Do you think that in the future, people will continue to change how and where they shop? Why or why not?", model5: "[A] I'm certain that shopping habits will keep evolving. [R] Technology is advancing so rapidly that every few years something new emerges — online marketplaces, one-hour delivery, paying with your phone — and people invariably adopt whatever is more **convenient**. [E] Just consider my grandparents: they used to buy almost everything at a local market, whereas I order nearly everything through apps. Within a decade, we may well be shopping in virtual reality or relying on AI assistants to reorder our groceries. [C] **In the long run**, I suspect the only constant in shopping will be change itself.", model: "[A] Yes, I'm sure shopping habits will keep changing. [R] Technology moves very fast, and every few years there's something new — online marketplaces, delivery in one hour, paying with your phone. People always adapt to whatever is more **convenient**. [E] Just think about my grandparents: they used to buy everything at a local market, while I order almost everything through apps. In ten years, maybe we'll shop through virtual reality or have AI assistants order groceries for us. [C] So **in the long run**, the only thing that won't change is that shopping will keep changing.", lx: ["online retailers", "convenience", "in the long run"] },
        { q: "Some people believe that buying too many products you do not need harms the environment. Do you agree with this idea? Why or why not?", model5: "[A] I agree with this idea completely. [R] Every product requires raw materials, energy and transport, so when people buy things they don't actually need, all of those resources are wasted — and most of those items end up in a landfill surprisingly quickly. In fact, **overconsumption** is one of the most serious environmental problems we face. [E] I realized this myself when I moved apartments and found boxes of things I'd bought and never used, including clothes with the tags still attached. It was genuinely embarrassing. [C] Since then, I've tried to buy less and choose **second-hand** whenever possible, because consuming less is one of the simplest ways to help the planet.", model: "[A] Yes, I completely agree with this idea. [R] Every product needs raw materials, energy and transport, and when people buy things they don't need, all of that is wasted. Most of those things end up in a landfill very quickly. **Overconsumption** is a huge environmental problem. [E] I noticed this myself when I moved apartments — I found boxes of things I'd bought and never used, including clothes with the tags still on. It was embarrassing. Since then, I try to buy less and choose **second-hand** when I can. [C] So buying less is one of the easiest ways to help the planet.", lx: ["overconsumption", "fast fashion", "sustainable"] }
      ]},
    { id: "s047", badge: "official", title: "Fashion and Clothing", src: "Official TOEFL · 047 / 051 / 080",
      scenario: "You have agreed to participate in a research study about people's experiences with fashion and clothing. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, do you enjoy shopping for clothes, or is it something you find tedious? Why?", model5: "[A] To be honest, I find it rather tedious, particularly in large shopping malls. [R] There's an overwhelming number of options, the music is far too loud, and the queues for the fitting rooms seem endless. [E] Last month, for instance, I spent nearly three hours searching for a single pair of jeans and left empty-handed. Having learned from that, I now **browse** online first, shortlist two or three options and only then go to the store to **try them on**. [C] So while I wouldn't say I hate it, I definitely prefer to **get in and get out** as quickly as possible.",
          lx: ["a chore", "try on", "get in and get out"],
          model: "[A] Honestly, I find it a bit tedious, especially in big malls. [R] There are too many options, the music is loud, and the lines for the fitting rooms are always long. [E] Last month, for example, I spent almost three hours looking for one pair of jeans, and I left with nothing. Now I usually **browse** online first, choose two or three options, and then go to the store just to **try them on**. [C] So I don't hate it, but I like to **get in and get out** as fast as possible." },
        { q: "What types of clothes do you usually prefer to wear? Do you have a particular style you enjoy?", model5: "[A] I'd describe my style as simple and comfortable — mostly jeans, plain T-shirts and sneakers. [R] Since I spend the entire day rushing between classes, comfort matters far more to me than looking **trendy**. [E] My go-to **outfit**, for example, is black jeans, a white T-shirt and an oversized jacket, which somehow works for lectures, coffee with friends and even a casual presentation. What I like about it is that I never have to think twice about whether it's appropriate. [C] Essentially, I prefer versatile, **timeless pieces** to whatever happens to be fashionable at the moment.",
          lx: ["outfit", "trendy", "timeless piece"],
          model: "[A] I'd describe my style as simple and comfortable — mostly jeans, plain T-shirts and sneakers. [R] I'm a student, so I spend the whole day running between classes, and comfort matters more to me than looking **trendy**. [E] For example, my favorite **outfit** is black jeans, a white T-shirt and an oversized jacket — it works for lectures, coffee with friends and even a casual presentation. [C] So I'd say I prefer **timeless pieces** to the latest trends." },
        { q: "How do you decide what to wear each day? Do you choose your clothes in the morning or the night before?", model5: "[A] I almost always choose my clothes the night before. [R] My mornings are invariably rushed, and if I have to make decisions at eight a.m., I inevitably end up late. [E] So every evening, I check the weather forecast and my schedule: if I have a presentation, I **dress up** a little, whereas on lab days I wear something I don't mind getting dirty. It takes two minutes at most, yet it saves me a remarkable amount of stress. [C] Planning my **outfit** in advance has turned out to be one of the simplest habits that genuinely makes my mornings easier.",
          lx: ["outfit", "dress up", "plan ahead"],
          model: "[A] I usually choose my clothes the night before. [R] Mornings are always rushed for me, and if I have to decide at eight a.m., I end up late. [E] So in the evening I check the weather and my schedule — if I have a presentation, I **dress up** a little, and on lab days I wear something I don't mind getting dirty. It takes two minutes, but it saves me a lot of stress. [C] So planning my **outfit** ahead really works for me." },
        { q: "Some people believe that fashion trends change too quickly and that spending money on new fashions is wasteful. Do you agree or disagree with this viewpoint? Why or why not?", model5: "[A] I largely agree with this viewpoint. [R] Driven by social media, trends now change every few weeks, and **fast fashion** brands produce cheap clothes that people wear two or three times before throwing them away, which is wasteful both financially and environmentally. [E] I'm guilty of this myself: I bought a **trendy** jacket last spring, and by autumn it had already **gone out of fashion**, so it's been hanging untouched in my wardrobe ever since. [C] **That said**, fashion itself isn't the problem — buying fewer, better-made **timeless pieces** is a far smarter way to enjoy it.",
          lx: ["fast fashion", "go out of fashion", "timeless piece"],
          model: "[A] I mostly agree. [R] Trends now change every few weeks because of social media, and **fast fashion** brands produce cheap clothes that people wear two or three times and then throw away. That's wasteful both for your wallet and for the environment. [E] I've done it myself: I bought a **trendy** jacket last spring, and by autumn it had already **gone out of fashion**, so it's just sitting in my closet. [C] **That said**, fashion itself isn't bad — buying fewer, better **timeless pieces** is the smart way to enjoy it." }
      ]},
    { id: "s072", badge: "official", title: "Grocery Shopping Habits", src: "Official TOEFL · 072 · в базе 3 вопроса",
      scenario: "You have volunteered for a research study about grocery shopping habits. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, how often do you go grocery shopping each week? Why that often?", model5: "[A] I usually go grocery shopping twice a week. [R] Living in a small dorm room with a tiny fridge, I simply can't buy much at once, and besides, I prefer my food to be fresh. [E] On Mondays, I stock up on **essentials** for the week, such as rice, eggs and pasta, while on Thursdays I make a quick trip for fresh fruit and vegetables so that I never **run out of** them before the weekend. Since the store is right next to campus, each trip takes no more than twenty minutes. [C] Two short trips, therefore, suit my lifestyle far better than one big weekly shop.", model: "[A] I usually go grocery shopping twice a week. [R] I live in a small dorm room with a tiny fridge, so I can't buy too much at once, and I prefer fresh food anyway. [E] On Monday I buy the **essentials** for the week — rice, eggs, pasta — and on Thursday I do a quick trip for fresh vegetables and fruit, so I never **run out of** them before the weekend. It takes about twenty minutes each time, because the store is right next to campus. [C] So two short trips work much better for me than one big one.", lx: ["run out of", "essentials", "plan ahead"] },
        { q: "Can you tell me what types of items you usually buy when you go grocery shopping? For example, do you buy fresh produce, dairy products or packaged foods?", model5: "[A] I mostly buy fresh produce along with a few basic packaged foods. [R] I've been trying to eat more healthily, so fruit and vegetables are always at the top of my list; however, as a student, I also need quick, inexpensive options for particularly busy days. [E] A typical basket for me includes apples, bananas, tomatoes, chicken and yogurt, as well as pasta and canned beans for evenings when I'm too exhausted to cook properly. I rarely buy ready meals, since they're both expensive and not particularly nutritious. [C] In short, my shopping is a balance between fresh food and practical **essentials**.", model: "[A] I mostly buy fresh produce and some basic packaged foods. [R] I'm trying to eat healthier, so fruit and vegetables are always at the top of my list, but as a student I also need quick and cheap options for busy days. [E] A typical shopping basket for me has apples, bananas, tomatoes, chicken, yogurt, and then some pasta and canned beans for nights when I'm too tired to cook. I rarely buy ready meals, because they're expensive and not very healthy. [C] So it's a mix of fresh food and practical **essentials**.", lx: ["fresh produce", "essentials", "good value for money"] },
        { q: "When you are grocery shopping, how often do you impulse buy? In other words, buy things you did not plan on buying. What types of items do you or might you impulse buy?", model5: "[A] I impulse buy far more often than I'd like to admit — probably every time I go shopping. [R] Supermarkets are deliberately designed to encourage it: snacks, sweets and drinks are strategically placed by the **checkout**, exactly where you're forced to wait. [E] Last week, for instance, I went in just for milk and bread, but a new chocolate bar **caught my eye**, and before I knew it, I'd also grabbed some crisps and an iced coffee. None of it was expensive, yet together it doubled my bill. [C] As a result, I now always shop with a list — and never when I'm hungry.", model: "[A] I impulse buy more often than I'd like to admit — probably every time I go shopping. [R] Supermarkets are designed for it: snacks, sweets and drinks are placed right next to the **checkout**, exactly where you have to wait. [E] Last week I went in just for milk and bread, but a new chocolate bar **caught my eye**, and I also grabbed some chips and an iced coffee. None of it was expensive, but together it doubled my bill. [C] So now I always use a shopping list, and I never shop when I'm hungry.", lx: ["impulse buy", "catch my eye", "treat myself"] }
      ]},
    { id: "smock", badge: "mock", title: "Shopping Habits", src: "Mock-тест платформы · 3 вопроса",
      scenario: "You have agreed to take part in a research study about shopping habits. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, when you go shopping, do you prefer to shop alone or do you like to shop with friends or family? Why?", model5: "[A] It depends on what I'm buying, but generally I prefer to shop alone. [R] On my own, I can **get in and get out** quickly and focus on what I actually need, whereas with friends, a quick errand turns into an entire afternoon — and I invariably end up spending more. [E] **That said**, for important purchases, like an outfit for a wedding, I always bring my sister, because she's brutally honest and gives a reliable **second opinion**. Last month, in fact, she talked me out of an expensive jacket that didn't **suit** me at all. [C] So I'd say: alone for everyday shopping, and with family for the big decisions.", model: "[A] It depends on what I'm buying, but usually I prefer to shop alone. [R] When I'm alone, I can **get in and get out** quickly and focus on what I actually need. With friends, shopping turns into a whole afternoon, and I always end up spending more. [E] **That said**, for important things like a dress for a wedding, I like to bring my sister, because she's honest and gives me a good **second opinion**. Last month she stopped me from buying a really expensive jacket that didn't **suit** me. [C] So alone for everyday shopping, and with family for big decisions.", lx: ["browse", "get in and get out", "second opinion"] },
        { q: "Where do you generally do your shopping? For example, do you usually go to department stores, specialty shops, secondhand stores, or other types of stores? Why do you choose to go there?", model5: "[A] I generally shop at second-hand stores and online, and I rarely set foot in department stores. [R] Second-hand shops are a **budget-friendly option**, and I like knowing that clothes get a second life rather than ending up in a landfill. Department stores, by contrast, strike me as overpriced and rather overwhelming. [E] My favorite place is a small vintage shop near campus, where last month I found a wool coat in almost perfect condition for just twenty dollars — friends still ask me where I got it. [C] For me, **second-hand** shopping offers both **good value for money** and a style that's genuinely my own.", model: "[A] I generally shop at secondhand stores and online, and I rarely go to department stores. [R] Secondhand stores are a **budget-friendly option**, and I like the idea that clothes get a second life instead of ending up in a landfill. Department stores, on the other hand, feel expensive and a bit overwhelming. [E] My favorite place is a small vintage shop near campus. Last month I found a wool coat there for twenty dollars that looks almost new, and friends keep asking where I got it. [C] So for me, **second-hand** means **good value for money** and a unique style.", lx: ["department store", "second-hand", "good value for money"] },
        { q: "Many people believe that Internet retail will lead to the disappearance of physical stores. Do you agree or disagree and why?", model5: "[A] I disagree; I think physical stores will become fewer, but they certainly won't disappear. [R] Admittedly, **online retailers** are often cheaper and more convenient. Nevertheless, many people still want to see products for themselves, **try them on** and get advice from real people. [E] When I bought my first laptop, for example, I went to a store, compared several models side by side and asked an assistant countless questions. I'd never have felt that confident buying it online. [C] Stores that offer outstanding service and memorable experiences will continue to thrive, in my opinion, even as online shopping grows.", model: "[A] I disagree — I think physical stores will become fewer, but they won't disappear. [R] It's true that **online retailers** are often cheaper and more convenient. **That said**, many people still want to see products, **try them on**, and get help from real people. [E] For example, when I bought my first laptop, I went to a store, compared several models in person and asked an assistant lots of questions. I would never have felt that confident buying it online. [C] So stores will survive, especially the ones that offer great service and experiences.", lx: ["brick-and-mortar store", "online retailers", "that said"] }
      ]},
    { id: "sph", badge: "platform", title: "Shopping Habits", src: "Практика платформы",
      scenario: "I'm interested in learning more about how people shop, what influences their choices, and how those habits have changed over time.",
      questions: [
        { q: "Where do you usually prefer to shop — do you mostly buy things online, in physical stores, or a combination of both? And what types of purchases do you tend to make in each setting?", model5: "[A] I'd say I use a combination of both, depending on what I'm buying. [R] For electronics, books and household items, I shop online, since it's so easy to **compare prices** and **read reviews**. For clothes, shoes and groceries, however, I much prefer physical stores. [E] Last month, for example, I ordered a phone case and a desk organizer online, but when I needed winter boots, I went to a store, because I had to **try them on** and check the size. Shoes that don't **fit** are notoriously difficult to return. [C] Ultimately, I choose whichever setting makes the most sense for the particular product.", model: "[A] I'd say I use a combination of both, depending on what I'm buying. [R] For electronics, books and household items, I shop online, because I can **compare prices** and **read reviews** easily. For clothes, shoes and food, I prefer physical stores. [E] For example, last month I ordered a phone case and a desk organizer online, but when I needed winter boots, I went to a store, because I had to **try them on** and check the size. Shoes that don't **fit** are a nightmare to return. [C] So I choose the setting that makes the most sense for each product.", lx: ["shop online", "try on", "convenience"] },
        { q: "Some people love the convenience and variety of online shopping, while others miss the ability to see and touch items in person. What do you enjoy or find frustrating about shopping online versus going to a store? Has your preference changed over time?", model5: "[A] What I enjoy most about online shopping is its **convenience**, whereas what frustrates me most is returning things. [R] Online, I can shop at any hour and compare dozens of options in minutes; however, when something doesn't match the photos, sending it back can be a real ordeal. [E] Last spring, I ordered a jacket that looked perfect online but arrived in a completely different shade. I had to print a label, find a box and queue at the post office just to get my money back. [C] Since that experience, my preference has shifted noticeably towards physical stores for anything I'm going to wear.", model: "[A] What I enjoy most about online shopping is the **convenience**, and what frustrates me is returning things. [R] Online, I can shop at any time and compare dozens of options in minutes. But when something doesn't match the photos, sending it back is a real hassle. [E] Last spring I ordered a jacket that looked perfect online, but it arrived in a completely different color. I had to print a label, find a box and go to the post office just to get a refund. Since then, I order clothes online much less often. [C] So my preference has definitely shifted toward stores for anything I wear.", lx: ["track a package", "return an item", "that said"] },
        { q: "Advertisements, especially on social media, seem to follow us everywhere. Some people believe these ads strongly influence our spending, while others feel they're easy to ignore. Do you think advertising has an impact on what you choose to buy? Why or why not?", model5: "[A] I'd like to think I'm immune to advertising, but in reality, it does influence me. [R] Social media ads are highly personalized: they show you exactly the right product at precisely the moment you're bored and scrolling, which makes **impulse purchases** remarkably easy. [E] A few months ago, for example, I kept seeing ads for a smart water bottle that tracks how much you drink. After about a week, I gave in and bought it — and now I barely use it. It was a classic **marketing ploy**, and it worked on me perfectly. [C] Advertising clearly affects my choices, especially when I'm not paying close attention.", model: "[A] Yes, I think it does, even though I like to believe I'm immune to it. [R] Social media ads are very personalized — they show you exactly the right product at the moment you're bored and scrolling, which makes **impulse purchases** really easy. [E] A few months ago, I kept seeing ads for a water bottle that tracks how much you drink. After a week, I bought it, and now I barely use it. It was a classic **marketing ploy**, and it worked on me. [C] So ads influence me more than I'd like, especially when I'm not paying attention.", lx: ["marketing ploy", "buy into", "catch my eye"] },
        { q: "Some people now choose eco-friendly packaging, second-hand items, or brands that are transparent about their values. Do you think it's important for consumers to consider the environmental or ethical impact of the things they buy? Do you try to make more sustainable choices?", model5: "[A] Yes, I think it's extremely important, and I try to make more **sustainable** choices, although I'm far from perfect. [R] Every purchase sends a message to companies, and if enough consumers stop supporting brands that pollute or treat workers unfairly, those brands will be forced to change. [E] I now buy most of my clothes **second-hand**, avoid **fast fashion** brands and choose products with less plastic packaging whenever I can. Admittedly, sustainable products are often more expensive, which can make things difficult on a student budget. [C] Even so, I'm convinced that small choices add up when enough people make them.", model: "[A] Yes, I think it's very important, and I try to make more **sustainable** choices, although I'm not perfect. [R] Every purchase sends a message to companies, and if consumers stop supporting brands that pollute or treat workers unfairly, those brands are forced to change. [E] For example, I now buy most of my clothes **second-hand**, I avoid **fast fashion** brands, and I choose products with less plastic packaging when I can. **That said**, sustainable products are often more expensive, which makes it hard for students. [C] So I do what I can, because small choices still add up.", lx: ["sustainable", "second-hand", "overconsumption"] }
      ]},
    { id: "sfi", badge: "platform", title: "Fashion & Personal Identity", src: "Практика платформы",
      scenario: "We're exploring the connection between fashion and self-expression — how people use clothing to reflect their identity, values, or creativity.",
      questions: [
        { q: "How would you describe your personal style or the types of clothes you typically like to wear? Do you tend to follow trends, or do you choose pieces that feel more individual or comfortable for you?", model5: "[A] I'd describe my style as simple and comfortable, with the occasional bold detail. [R] I make no effort to **keep up with trends**, partly because they change so fast and partly because it gets expensive. Instead, I prefer **timeless pieces** that are easy to combine. [E] My everyday **outfit** is usually jeans, a plain sweater and white sneakers, but I almost always add one item that reflects my personality — a bright scarf, say, or a vintage jacket I found in a thrift store. Funnily enough, people often remember me for those details. [C] In a nutshell, my style is mostly classic, with a touch of fun.", model: "[A] I'd describe my style as simple and comfortable, with a few bold pieces. [R] I don't try to **keep up with trends**, because they change too fast and it gets expensive. I prefer **timeless pieces** that I can combine easily. [E] My everyday **outfit** is usually jeans, a plain sweater and white sneakers, but I always add one item that shows my personality — like a bright scarf or a vintage jacket I found in a thrift store. People often remember me for those details. [C] So my style is mostly classic, with a little bit of fun.", lx: ["keep up with trends", "timeless piece", "outfit"] },
        { q: "How important is clothing to the way you present yourself to others? Do you feel that your style reflects your personality, or does it change depending on your mood or environment?", model5: "[A] Clothing is fairly important to me, and my style definitely shifts depending on my mood and the situation. [R] I see clothes as an instant form of **self-expression**: before you've said a single word, people have already formed an impression based on what you're wearing. [E] Whenever I have a presentation, for instance, I **dress up** a little, which genuinely makes me feel more confident and professional. On weekends, by contrast, I wear relaxed, colorful clothes that feel much more like me. [C] So my clothes reflect not only my personality but also how I want to feel on any given day.", model: "[A] Clothing is quite important to me, and my style definitely changes with my mood and the situation. [R] I think clothes are a quick form of **self-expression** — before you say a word, people already get an impression from what you're wearing. [E] For example, when I have a presentation, I **dress up** a little, and it actually makes me feel more confident and professional. On weekends, when I'm relaxed, I wear comfortable, colorful clothes that feel more like me. [C] So my clothes reflect both my personality and how I want to feel that day.", lx: ["self-expression", "express yourself", "dress up"] },
        { q: "Some critics argue that the fashion industry promotes overconsumption, unrealistic beauty standards, or pressure to constantly update your wardrobe. Others see fashion as a powerful creative and cultural force. What are your thoughts?", model5: "[A] I'd say fashion has both a positive and a negative side. [R] On the one hand, **fast fashion** encourages **overconsumption**, and advertising featuring flawless models can make young people deeply insecure about their bodies. On the other hand, fashion is a powerful form of **self-expression** and creativity. [E] My younger sister, for instance, used to feel terrible comparing herself to models on social media, but later she discovered vintage fashion and began designing her own clothes. Fashion now gives her confidence rather than taking it away. [C] Ultimately, it depends on whether people experience fashion as pressure or as creativity.", model: "[A] I think fashion has both a positive and a negative side. [R] On the negative side, **fast fashion** encourages **overconsumption**, and ads with perfect models can make young people feel insecure about their bodies. On the positive side, fashion is a powerful form of **self-expression** and creativity. [E] For example, my younger sister used to feel bad comparing herself to models on social media, but later she discovered vintage fashion and started designing her own clothes. Now fashion makes her confident. [C] So it depends on how people use it: as pressure or as creativity.", lx: ["overconsumption", "fast fashion", "self-expression"] },
        { q: "We've seen more conversations around body positivity, gender-neutral fashion, and cultural representation. Do you think people are becoming more open to diverse and inclusive expressions of style? Why is that important?", model5: "[A] Yes, I think people are becoming considerably more open, particularly younger generations. [R] Social media has made different body types, cultures and styles far more visible, showing that there's no single way to look good — which matters because it allows everyone to express themselves without fear of judgment. [E] At my university, for example, nobody bats an eye at a guy wearing nail polish or a student dressed in traditional clothing from their culture, whereas only a few years ago, either would have attracted plenty of attention. [C] Fashion is undoubtedly becoming more **inclusive**, and I see that as a profoundly positive change.", model: "[A] Yes, I think people are becoming much more open, especially younger generations. [R] Social media has made different body types, cultures and styles more visible, so people see that there isn't just one way to look good. That's important because it lets everyone express themselves without fear of being judged. [E] For example, at my university, nobody is surprised to see a guy wearing nail polish or someone wearing traditional clothes from their culture — a few years ago, that would have attracted a lot of attention. [C] So I think fashion is becoming more **inclusive**, and that's a very positive change.", lx: ["inclusive", "self-expression", "open-minded"] }
      ]}
  ],

      { t: "personal", q: "What is the most annoying part of online shopping for you — delivery, returns, or something else?", model5: "[A] For me, the most frustrating part is undoubtedly returns. [R] Ordering takes two minutes, yet **returning an item** can take a week — printing labels, finding a box, queuing at the post office and then waiting for the **refund**. [E] Last month, I ordered a sweater that turned out to be two sizes too small. I wanted to **exchange it for a different size**, but the store only offered refunds, so I had to send it back and reorder it. The whole process dragged on for nearly three weeks. [C] Consequently, I now check size charts and reviews meticulously before buying clothes online.", model: "[A] For me, the most annoying part is definitely returns. [R] Ordering takes two minutes, but **returning an item** can take a week — printing labels, finding a box, going to the post office, and then waiting for the **refund**. [E] Last month I ordered a sweater that was two sizes too small. I wanted to **exchange it for a different size**, but the store only offered a refund, so I had to send it back and order again. The whole process took almost three weeks. [C] So now I check size charts and reviews very carefully before I buy clothes online.",

      { t: "compare", q: "Is free delivery worth waiting longer for, or would you rather pay for fast delivery?", model5: "[A] In most cases, free delivery is well worth the wait. [R] The majority of things I buy online aren't urgent, so paying extra just to receive them a day earlier makes little sense, particularly on a student budget. What's more, slower deliveries are generally better for the environment. [E] **That said**, there are exceptions. Last semester, my laptop charger broke two days before an exam, and I gladly paid for next-day **delivery**. [C] My approach is a simple **trade-off**: free and slow for everyday purchases, and fast only when something is genuinely urgent.", model: "[A] In most cases, free delivery is worth waiting for. [R] Most things I buy online aren't urgent, so paying extra just to get them a day earlier doesn't make sense, especially on a student budget. It's also better for the environment when deliveries aren't rushed. [E] **That said**, there are exceptions. Last semester my laptop charger broke two days before an exam, and I happily paid for next-day **delivery**. [C] So free and slow for everyday things, and fast only when I really need something urgently — it's a simple **trade-off**.",
        f: ["What do you usually need urgently?", "Is super-fast delivery bad for the environment?"], lx: ["delivery", "convenience", "trade-off"] },
      { t: "opinion", q: "Some people try clothes on in a store and then buy them cheaper online. Is that fair to the store?", model5: "[A] Honestly, I don't think it's entirely fair, although I understand why people do it. [R] Stores pay for staff, rent and fitting rooms, and customers who do this use all of those services without contributing anything. If everyone behaved this way, many **brick-and-mortar stores** would simply have to close. [E] I'll admit I've done it once myself: I tried on sneakers in a store and later found them twenty dollars cheaper online. Afterwards, I felt rather guilty, since the assistant had spent half an hour helping me. [C] Nowadays, if a store provides excellent service, I make a point of buying there.", model: "[A] Honestly, I don't think it's completely fair, although I understand why people do it. [R] The store pays for staff, rent and fitting rooms, and customers use all of that without paying anything. If everyone did this, many **brick-and-mortar stores** would simply close. [E] I'll admit I've done it once — I tried on sneakers in a store and later found them twenty dollars cheaper online. Afterwards I felt a bit guilty, because the assistant had spent half an hour helping me. [C] So now, if a store gives me great service, I try to buy there.",

        f: ["What makes a shopping experience good or bad?", "Did the staff help you?"], lx: ["browse", "customer service", "checkout"] },
      { t: "opinion", q: "Do you trust online reviews? Why or why not?", model5: "[A] I trust online reviews, but only to a certain extent. [R] They're extremely useful for spotting serious problems; however, I'm well aware that some companies pay for fake positive reviews, so I'm instantly suspicious of products with nothing but perfect ratings. [E] My strategy is to **read** the three-star **reviews**, which tend to be the most balanced and honest. When I was buying a vacuum cleaner, for instance, those reviews warned me that the battery died quickly, so I chose a different model. [C] Reviews are helpful, then, but **word of mouth** from friends is still what I trust most.", model: "[A] I trust online reviews, but only to a certain extent. [R] Reviews are really useful for spotting serious problems, but I know that some companies pay for fake positive reviews. So I never trust a product that has only perfect five-star ratings. [E] My strategy is to **read reviews** with three stars, because they're usually the most honest. When I was buying a vacuum cleaner, those reviews warned me that the battery died quickly, so I chose a different model. [C] So reviews are helpful, but **word of mouth** from friends is still what I trust most.",
        f: ["Have you ever written a review yourself?", "How can you spot a fake review?"], lx: ["read reviews", "word of mouth", "fake"] },
      { t: "opinion", q: "Are expensive brands really better, or are people just paying for the name?", model5: "[A] In most cases, I'd argue people are largely paying for the name. [R] Major brands spend enormous sums on advertising, and that cost is inevitably built into the price. The quality may occasionally be better, but frequently the difference is negligible — which is why I don't **buy into** the idea that expensive automatically means better. [E] I once compared a designer T-shirt with a cheap one from a local store; as it turned out, they'd been made in the same factory and felt almost identical, yet one cost five times more. [C] **That said**, for certain products, such as running shoes, a reputable brand can genuinely be worth it.", model: "[A] I think in most cases people are mainly paying for the name. [R] Big brands spend a lot on advertising, and that cost goes into the price. Quality is sometimes better, but often the difference is tiny. I just don't **buy into** the idea that expensive always means better. [E] For example, I once compared a famous brand T-shirt with a cheap one from a local store. They were made in the same factory and felt almost the same, but one cost five times more. [C] **That said**, for some things, like running shoes, a good brand can really be worth it.",
        f: ["Is there a brand you're loyal to?", "Would you ever buy a counterfeit designer item?"], lx: ["brand", "counterfeit", "buy into"] },
      { t: "compare", q: "Is it better to buy one expensive, high-quality item or several cheap ones?", model5: "[A] Generally speaking, I think it's wiser to buy one high-quality item. [R] Cheap products often break or lose their shape quickly, so you end up replacing them again and again, which costs more **in the long run** and creates far more waste. [E] I used to buy a cheap backpack every year, for instance, because the zippers always broke. Two years ago, I finally invested in a good one, and it still looks practically new — genuinely **good value for money**. [C] **That said**, for things that go out of fashion quickly or that I rarely use, cheaper options make more sense.", model: "[A] I usually think it's better to buy one high-quality item. [R] Cheap things often break or lose their shape quickly, so you end up buying them again and again, which costs more **in the long run** and creates more waste. [E] For example, I used to buy cheap backpacks every year, because the zippers always broke. Two years ago I finally bought a good one, and it still looks new. It's real **good value for money**. [C] **That said**, for things that go out of fashion fast or that I rarely use, cheaper options make more sense.",
        f: ["Give an example of a cheap item that broke too fast.", "Does it depend on the product?"], lx: ["timeless piece", "good value for money", "last"] },
      { t: "experience", q: "Tell me about a purchase you regretted. What happened?", model5: "[A] The purchase I regret most is an expensive smartwatch I bought last year. [R] It was on sale, and all my friends had one, so I bought it without seriously considering whether I needed it. [E] For the first week, I was delighted with it, but I soon realized that my phone already did everything the watch could. Within a month, it was lying forgotten in a drawer, and by then it was too late to **return the item**. Given that it had been a classic **impulse buy**, the **buyer's remorse** was considerable. [C] Ever since, I've made a rule of waiting three days before buying anything expensive.", model: "[A] I really regret buying an expensive smartwatch last year. [R] It was on sale, and all my friends had one, so I bought it without really thinking about whether I needed it. [E] For the first week I loved it, but then I realized my phone already did everything the watch did. After a month, it was just lying in a drawer, and by then it was too late to **return the item**. I had terrible **buyer's remorse**, especially because it was a total **impulse buy**. [C] Since then, I always wait three days before buying anything expensive.",
        f: ["What would you do differently now?", "Did you try to return it?"], lx: ["buyer's remorse", "impulse buy", "return an item"] }

      { t: "opinion", q: "Is it better to give a gift you chose yourself, or money or a gift card?", model5: "[A] For close friends and family, I think a gift you've chosen yourself is usually more valuable. [R] A **thoughtful** present shows that you know the person and have taken time to think about them, which makes it far more **meaningful**. **That said**, money or a gift card can be considerably more practical. [E] My best friend once gave me a framed antique map of my hometown; it probably didn't cost much, yet it remains my favorite gift ever. For my cousin's wedding, on the other hand, money was undoubtedly more useful. [C] Personal gifts for those closest to you, then, and practical ones for big occasions.", model: "[A] I think a gift you chose yourself is usually better, especially for close friends and family. [R] A **thoughtful** gift shows that you know the person and spent time thinking about them, which makes it much more **meaningful**. **That said**, money or a gift card can be more practical. [E] For example, my best friend once gave me an old map of my hometown in a frame. It probably wasn't expensive, but it's my favorite gift ever. On the other hand, for my cousin's wedding, money was much more useful. [C] So personal gifts for close people, practical ones for big events.",

      { t: "opinion", src: "Mock", q: "Some people believe that holidays have become too focused on shopping and expensive gifts. Do you agree or disagree? Why?", model5: "[A] I agree that many holidays have become excessively commercial. [R] Stores start promoting holiday products months in advance, and people feel mounting pressure to buy bigger and more expensive gifts each year, even when they can't really afford them — a perfect illustration of modern **consumerism**. [E] My family used to spend a fortune on presents until we switched to a secret gift exchange with a modest price limit. Almost immediately, the gifts became more creative and **meaningful**, and everyone was far less stressed. [C] To my mind, the best holidays are about spending time together rather than **splurging**.", model: "[A] I agree that many holidays have become too commercial. [R] Stores start selling holiday products months in advance, and people feel pressure to buy bigger and more expensive gifts every year, even when they can't afford it. It's a perfect example of **consumerism**. [E] In my family, we used to spend a lot on presents, until we decided to do a secret gift exchange with a small price limit. Suddenly the gifts became more creative and **meaningful**, and everyone was less stressed. [C] So I think the best holidays are about time together, not about **splurging**.",
        f: ["What's a meaningful gift that didn't cost much?", "Should families set a price limit for gifts?"], lx: ["consumerism", "materialistic", "meaningful"] },
      { t: "experience", q: "Tell me about a time you had to buy a present for someone and had no idea what to choose.", model5: "[A] That happened last year, when I had to buy a birthday present for my roommate's father, whom I'd met only once. [R] I knew nothing about his interests, and I didn't want to fall back on something generic like socks. [E] After **browsing** several shops for almost two hours with no luck, I finally asked my roommate a few questions and discovered that he loved gardening. So I bought him a set of herb seeds in an elegant wooden box. He was genuinely touched, and he still sends us photos of the plants. [C] The lesson I took away was simple: when in doubt, ask someone who knows the person well.", model: "[A] This happened last year when I had to buy a birthday present for my roommate's father, whom I'd met only once. [R] I didn't know his interests at all, and I didn't want to give something generic like socks. [E] I **browsed** a few shops for almost two hours with no luck. Finally, I asked my roommate a couple of questions and found out he loved gardening. So I bought a small set of herb seeds in a nice wooden box. He was surprised and genuinely happy, and he still sends us photos of the plants. [C] So when in doubt, just ask someone who knows them.",
