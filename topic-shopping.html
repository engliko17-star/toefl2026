      { t: "experience", q: "Have you ever bought something after seeing it in an influencer's video or a shopping haul? How did it turn out?", model5: "[A] Yes, I have — and it didn't end particularly well. [R] Influencers make products look flawless and indispensable, and when you see the same item in several videos, you gradually start believing you need it too. [E] Last year, after watching a few **haul** videos, I bought a trendy skincare set that everyone seemed to be raving about. Not only was it expensive, but it actually irritated my skin. I later found out that most of those influencers had been paid to promote it, which left me with real **buyer's remorse**. [C] Since then, I always check independent reviews before trusting an influencer's recommendation.", model: "[A] Yes, I have — and it didn't turn out very well. [R] Influencers make products look perfect and **must-have**, and when you watch the same thing in several videos, you start believing you need it too. [E] Last year, after watching a few **haul** videos, I bought a trendy skincare set that everyone was talking about. It was expensive, and it actually irritated my skin. Later I found out that most of those influencers were paid to promote it. I had real **buyer's remorse**. [C] So now I check independent reviews before I trust an influencer's recommendation.",
        f: ["Do you trust influencers who are paid by brands?", "Should influencers always say when a post is an ad?"], lx: ["haul", "must-have", "buyer's remorse"] },
      { t: "opinion", q: "Should there be stricter rules for advertising to children and teenagers?", model5: "[A] Yes, I believe stricter rules are long overdue. [R] Children and teenagers are far more impressionable than adults; they often can't distinguish genuine content from advertising, and companies are well aware of that. As a result, ads **targeted** at them can create intense pressure to own particular toys, phones or clothes. [E] My little brother, for instance, constantly asks for things he sees in mobile games, and many of those ads are virtually indistinguishable from the game itself. My parents end up having to explain every single time that it's just an advert. [C] Clearer regulations would protect children and make parents' lives considerably easier.", model: "[A] Yes, I think there should be stricter rules. [R] Children and teenagers are much more easily influenced than adults — they often can't tell the difference between real content and an ad, and companies know this. Ads **targeted** at them can create pressure to have certain toys, phones or clothes. [E] My little brother, for example, constantly asks for things he sees in mobile games, and many of those ads look exactly like the game itself. My parents have to explain every time that it's just advertising. [C] So clearer rules would protect kids and make parents' lives easier.",
        f: ["What kinds of ads target teenagers the most?", "Who should control this — parents or governments?"], lx: ["target", "influence", "marketing ploy"] },
      { t: "opinion", q: "Do 'limited time offers' and countdown timers make you buy faster? Are these tactics fair?", model5: "[A] They definitely make me buy faster, and I'd argue they're not entirely fair. [R] A countdown creates artificial pressure, leaving you no time to think or **compare prices**, which is precisely why it's such an effective **marketing ploy**. [E] Last month, I saw a jacket with a timer claiming the discount would end in two hours, so I bought it immediately. The following week, however, the very same jacket appeared with an identical 'last chance' offer. I felt rather manipulated, to be honest. [C] Nowadays, whenever I see a countdown, I treat it as a signal to slow down rather than hurry up.", model: "[A] Yes, they definitely make me buy faster, and I don't think they're completely fair. [R] A countdown timer creates pressure, so you don't have time to think or **compare prices**. That's exactly why it's such an effective **marketing ploy**. [E] Last month I saw a jacket with a timer saying the discount ended in two hours. I bought it immediately, but the next week the same jacket had the same 'last chance' discount again. I felt a bit fooled. [C] So now, when I see a countdown, I take it as a sign to slow down, not hurry up.",
        f: ["Have you ever bought something because 'only two were left'?", "How can shoppers protect themselves?"], lx: ["marketing ploy", "impulse buy", "pressure"] },
      { t: "compare", q: "Are personalized ads helpful, or are they a little creepy?", model5: "[A] Honestly, I find them somewhat creepy, even though they're occasionally helpful. [R] It's convenient to see ads for things I actually need, yet it's unsettling to realize how much companies know about my habits — and possibly even my conversations. It's a genuine **privacy** concern. [E] Once, I mentioned hiking boots to a friend without ever searching for them, and the next morning my feed was full of boot ads. It may well have been a coincidence, but it certainly made me reconsider what my phone collects. [C] So while they can be useful, I'd much prefer to have more control over my own data.", model: "[A] Honestly, I find them a little creepy, even though they're sometimes helpful. [R] It's useful to see ads for things I actually need, but it's uncomfortable to realize how much companies know about my habits and conversations. It's a real **privacy** issue. [E] Once, I talked with a friend about hiking boots — I never searched for them — and the next morning my feed was full of boot ads. Maybe it was a coincidence, but it really made me think about what my phone collects. [C] So they're convenient, but I'd prefer more control over my data.",
        f: ["Have you ever seen an ad for something you only talked about?", "Would you pay to avoid ads?"], lx: ["personalized ads", "privacy", "catch my eye"] }
    ]},

      { t: "opinion", q: "Should students wear uniforms at school? What about at university?", model5: "[A] I think uniforms make sense at school, but certainly not at university. [R] At school, uniforms reduce **peer pressure** and the competition over expensive clothes, allowing students to concentrate on learning. University students, however, are adults, and for them, clothing becomes an important form of **self-expression**. [E] I wore a uniform until I was sixteen, and I was honestly grateful for it, since nobody was judged for not owning branded clothes. When I started university, though, choosing my own outfits helped me discover my personal style. [C] In short: uniforms for children, freedom for adults.", model: "[A] I think uniforms make sense at school, but not at university. [R] At school, uniforms reduce **peer pressure** and the competition over expensive clothes, so students can focus on learning. At university, however, students are adults, and clothing is an important part of **self-expression**. [E] I wore a uniform until I was sixteen, and honestly, I was grateful — nobody judged anyone for not having branded clothes. But when I started university, choosing my own outfits helped me discover my style. [C] So uniforms for kids, freedom for adults.",

      { t: "opinion", q: "Is it important to dress formally for a job interview, even for a casual job?", model5: "[A] I'd say it's important to dress neatly, though not necessarily formally. [R] **First impressions** matter a great deal, and your clothes signal that you're taking the opportunity seriously. **That said**, turning up to a café interview in a suit might seem slightly odd; what really matters is being **appropriate** for the setting. [E] When I applied for a job at a bookstore, I wore clean dark jeans, a simple shirt and smart shoes. The manager later mentioned that I'd looked well prepared yet relaxed. [C] My rule of thumb, therefore, is to dress one level above what the employees usually wear.", model: "[A] I think it's important to dress neatly, but not necessarily formally. [R] **First impressions** matter, and your clothes show that you take the job seriously. **That said**, wearing a suit to an interview at a café might look strange. It's more about being **appropriate** for the place. [E] When I applied for a job at a bookstore, I wore clean dark jeans, a simple shirt and nice shoes. The manager later told me she noticed that I looked prepared but still relaxed. [C] So the rule is: dress one level above what employees usually wear.",

      { t: "opinion", src: "Платформа · Fashion & Identity", q: "Do you think people are becoming more open to diverse and inclusive expressions of style? Why is that important?", model5: "[A] Yes, I think people are becoming considerably more open, particularly younger generations. [R] Social media has made different body types, cultures and styles far more visible, showing that there's no single way to look good — which matters because it allows everyone to express themselves without fear of judgment. [E] At my university, for example, nobody bats an eye at a guy wearing nail polish or a student dressed in traditional clothing from their culture, whereas only a few years ago, either would have attracted plenty of attention. [C] Fashion is undoubtedly becoming more **inclusive**, and I see that as a profoundly positive change.", model: "[A] Yes, I think people are becoming much more open, especially younger generations. [R] Social media has made different body types, cultures and styles more visible, so people see that there isn't just one way to look good. That's important because it lets everyone express themselves without fear of being judged. [E] For example, at my university, nobody is surprised to see a guy wearing nail polish or someone wearing traditional clothes from their culture — a few years ago, that would have attracted a lot of attention. [C] So I think fashion is becoming more **inclusive**, and that's a very positive change.",

    { icon: "leaf", title: "Экология и осознанное потребление", en: "Sustainable shopping", questions: [
      { t: "opinion", src: "Official 067", q: "Some people believe that buying too many products you do not need harms the environment. Do you agree with this idea? Why or why not?", model5: "[A] I agree with this idea completely. [R] Every product requires raw materials, energy and transport, so when people buy things they don't actually need, all of those resources are wasted — and most of those items end up in a landfill surprisingly quickly. In fact, **overconsumption** is one of the most serious environmental problems we face. [E] I realized this myself when I moved apartments and found boxes of things I'd bought and never used, including clothes with the tags still attached. It was genuinely embarrassing. [C] Since then, I've tried to buy less and choose **second-hand** whenever possible, because consuming less is one of the simplest ways to help the planet.", model: "[A] Yes, I completely agree with this idea. [R] Every product needs raw materials, energy and transport, and when people buy things they don't need, all of that is wasted. Most of those things end up in a landfill very quickly. **Overconsumption** is a huge environmental problem. [E] I noticed this myself when I moved apartments — I found boxes of things I'd bought and never used, including clothes with the tags still on. It was embarrassing. Since then, I try to buy less and choose **second-hand** when I can. [C] So buying less is one of the easiest ways to help the planet.",

      { t: "experience", src: "Платформа · Clothing & Identity", q: "Have you ever thought about how your clothing choices affect the environment or other people? Should this be a bigger conversation in society?", model5: "[A] Yes, it's something I've thought about a great deal over the past couple of years. [R] I learned that the fashion industry is among the world's biggest polluters and that many cheap garments are made by workers paid almost nothing — which completely changed how I see a five-dollar T-shirt. [E] After watching a documentary about a factory disaster, I decided to buy mostly **second-hand** and to choose fewer, better-quality pieces. My wardrobe is smaller now, yet I actually like it more. [C] I'm convinced this should be a far bigger conversation in society, particularly among young people.", model: "[A] Yes, I've started thinking about it a lot over the last couple of years. [R] I learned that the fashion industry is one of the biggest polluters in the world, and that many cheap clothes are made by workers who are paid almost nothing. That changed the way I see a five-dollar T-shirt. [E] After watching a documentary about a factory disaster, I decided to buy mostly **second-hand** and choose fewer, better-quality pieces. My wardrobe is smaller now, but I actually like it more. [C] So yes, I think this should be a much bigger conversation, especially among young people.",
        f: ["Do you know where your clothes are made?", "Should brands be forced to show how their clothes are produced?"], lx: ["fast fashion", "ethical", "sustainable"] },
      { t: "personal", q: "Would you buy second-hand clothes? Why or why not?", model5: "[A] Absolutely — in fact, most of my clothes are already second-hand. [R] It's a **budget-friendly option**, it's kinder to the environment, and you frequently stumble upon unique pieces that nobody else owns. [E] My favorite winter coat, for instance, came from a **thrift store** for just fifteen dollars, and people constantly ask me where I got it. I've also found vintage band T-shirts and jeans that are better made than many new ones. The only things I wouldn't buy second-hand are shoes and underwear. [C] For me, second-hand shopping is cheaper, greener and considerably more fun.", model: "[A] Yes, I already buy most of my clothes second-hand. [R] It's a **budget-friendly option**, it's better for the environment, and you often find unique things that nobody else has. [E] My favorite winter coat is from a **thrift store** — it cost me fifteen dollars, and people constantly ask where I got it. I also find vintage band T-shirts and jeans that are better quality than many new ones. The only things I wouldn't buy second-hand are shoes and underwear. [C] So for me, second-hand shopping is cheaper, greener and more fun.",
        f: ["What would you never buy second-hand?", "Why do some people feel embarrassed about it?"], lx: ["second-hand", "thrift store", "good value for money"] },
      { t: "opinion", q: "Should online stores be required to use less packaging?", model5: "[A] Yes, I firmly believe there should be regulations on this. [R] Online orders frequently arrive in enormous boxes stuffed with plastic bags and air pillows for one tiny item, which generates a staggering amount of **waste** — and companies are unlikely to change voluntarily if it costs them money. [E] Last month, I ordered a single USB cable, and it arrived in a box large enough for a pair of shoes, wrapped in two layers of plastic. I was genuinely shocked. [C] Clear rules — limits on box sizes and plastic, for example — would make online shopping far more **sustainable**.", model: "[A] Yes, I think there should be rules about it. [R] Online orders often come with huge boxes, plastic bags and air pillows for one tiny item, which creates an enormous amount of **waste**. Companies won't change on their own if it costs them money. [E] Last month I ordered a single USB cable, and it arrived in a box big enough for a pair of shoes, wrapped in two layers of plastic. I was honestly shocked. [C] So clear rules — like limits on box size and plastic — would make online shopping much more **sustainable**.",
        f: ["What was the most ridiculous packaging you've received?", "Would you wait longer for eco-friendly delivery?"], lx: ["packaging", "waste", "sustainable"] },
      { t: "opinion", q: "Fast fashion is cheap and accessible. Is it fair to criticize people who can't afford sustainable brands?", model5: "[A] No, I don't think it's fair to blame people on a **tight budget**. [R] **Sustainable** brands are often two or three times more expensive, and many families simply can't **afford** them; the real responsibility lies with the companies producing cheap clothes in harmful ways. [E] My cousin, for example, is a single mother of two, and for her, **fast fashion** is the only realistic way to dress children who outgrow their clothes every few months. **That said**, second-hand shopping offers an alternative that's both affordable and green. [C] Ultimately, we should be criticizing the system rather than those with the fewest choices.", model: "[A] No, I don't think it's fair to blame people who are on a **tight budget**. [R] **Sustainable** brands are often two or three times more expensive, and many families simply can't **afford** them. The real responsibility lies with the companies that produce cheap clothes in harmful ways. [E] My cousin is a single mom with two kids, and for her, **fast fashion** is the only way to buy clothes they quickly grow out of. **That said**, second-hand shopping is a good alternative that's both cheap and green. [C] So we should criticize the system, not the people with the least choice.",
