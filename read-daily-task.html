<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL Reading Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Стилизация скроллбара для удобства чтения */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-4">
            <a href="read-daily.html" class="text-slate-500 hover:text-slate-800 transition flex items-center text-sm font-medium">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-1.5"></i> Back to Reading
            </a>
            <span class="text-slate-300">|</span>
            <h1 id="taskTitle" class="text-base font-bold text-slate-800">Loading test...</h1>
        </div>
        
        <div class="flex items-center space-x-4">
            <div class="text-right">
                <span class="text-xs text-slate-400 block font-medium">Progress</span>
                <span id="progressText" class="text-xs font-bold text-slate-700">0 / 0</span>
            </div>
            <div class="w-32 bg-slate-100 h-2 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden min-h-0">
        
        <section class="w-1/2 bg-white p-8 overflow-y-auto custom-scrollbar border-r border-slate-200 prose max-w-none">
            <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">Reading Passage</h2>
            <div id="passageContent" class="text-sm text-slate-600 leading-relaxed space-y-4">
                <div class="flex items-center space-x-2 text-slate-400">
                    <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
                    <span>Loading text from database...</span>
                </div>
            </div>
        </section>

        <section class="w-1/2 bg-slate-50/50 p-8 overflow-y-auto custom-scrollbar flex flex-col justify-between">
            
            <div id="quizContainer" class="flex-1 flex flex-col justify-between">
                <div class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-xs">
                    <div class="flex items-center justify-between mb-4">
                        <span id="questionNumber" class="text-xs font-semibold text-indigo-600 tracking-wider uppercase">Question 1</span>
                        <span id="questionTypeBadge" class="px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-md text-[10px] font-bold uppercase tracking-wider">Detail</span>
                    </div>
                    
                    <p id="questionText" class="text-sm font-semibold text-slate-800 mb-6 leading-snug">
                        </p>

                    <div id="optionsContainer" class="space-y-2.5">
                        </div>
                </div>

                <div class="flex items-center justify-between pt-6 border-t border-slate-200 mt-6 shrink-0">
                    <button id="prevBtn" class="px-5 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-700 text-xs font-bold hover:bg-slate-50 disabled:opacity-50 disabled:pointer-events-none transition flex items-center shadow-xs">
                        <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i> Previous
                    </button>
                    <button id="nextBtn" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-indigo-600 transition flex items-center shadow-xs">
                        Next Question <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i>
                    </button>
                </div>
            </div>

            <div id="resultsContainer" class="hidden bg-white rounded-2xl border border-slate-200 p-8 text-center max-w-md mx-auto my-auto shadow-sm">
                <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="trophy" class="w-8 h-8"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-1">Test Completed!</h3>
                <p class="text-xs text-slate-400 mb-6">Your answers have been processed successfully.</p>
                
                <div class="bg-slate-50 rounded-xl p-4 flex justify-around mb-6">
                    <div>
                        <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-0.5">Accuracy</span>
                        <span id="finalScorePercent" class="text-xl font-black text-slate-800">0%</span>
                    </div>
                    <div class="border-r border-slate-200"></div>
                    <div>
                        <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-0.5">Raw Score</span>
                        <span id="finalScoreRaw" class="text-xl font-black text-slate-800">0 / 0</span>
                    </div>
                </div>

                <a href="read-daily.html" class="block w-full text-center py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl transition shadow-xs">
                    Return to Dashboard
                </a>
            </div>

        </section>
    </main>

    <script>
        // Инициализируем иконки Lucide
        lucide.createIcons();

        // Данные подключения к твоему Supabase
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';

        let currentTask = null;
        let currentQuestionIdx = 0;
        let userAnswers = {}; 

        // DOM элементы
        const taskTitle = document.getElementById('taskTitle');
        const progressText = document.getElementById('progressText');
        const progressBar = document.getElementById('progressBar');
        const passageContent = document.getElementById('passageContent');
        const questionNumber = document.getElementById('questionNumber');
        const questionTypeBadge = document.getElementById('questionTypeBadge');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const quizContainer = document.getElementById('quizContainer');
        const resultsContainer = document.getElementById('resultsContainer');

        // Функция инициализации страницы
        async function init() {
            // Извлекаем id из адресной строки (например, ?id=1)
            const urlParams = new URLSearchParams(window.location.search);
            const taskId = urlParams.get('id');

            if (!taskId) {
                taskTitle.innerText = "Error: No Test ID";
                passageContent.innerHTML = `<div class="text-red-500 font-medium">Please provide a valid test ID in the URL (?id=X).</div>`;
                return;
            }

            try {
                // Инициализируем клиент Supabase
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // Запрос к нашей новой таблице daily_life_tasks
                const { data, error } = await supabaseClient
                    .from('daily_life_tasks')
                    .select('*')
                    .eq('id', taskId)
                    .single(); // Ожидаем одну запись

                if (error) throw error;

                if (data) {
                    currentTask = data;
                    
                    // Если JSON пришел как строка, парсим его
                    if (typeof currentTask.questions === 'string') {
                        currentTask.questions = JSON.parse(currentTask.questions);
                    }

                    renderTask();
                } else {
                    taskTitle.innerText = "Task not found";
                    passageContent.innerHTML = `<div class="text-slate-400">No task matches the ID: ${taskId}</div>`;
                }
            } catch (error) {
                console.error("Database Connection Error:", error);
                taskTitle.innerText = "Error loading content";
                passageContent.innerHTML = `<div class="text-red-500 font-medium">Failed to fetch data from Supabase: ${error.message}</div>`;
            }
        }

        // Вывод заголовка и текста
        function renderTask() {
            if (!currentTask || !currentTask.questions) return;
            
            taskTitle.innerText = currentTask.title;
            passageContent.innerHTML = currentTask.passage;
            userAnswers = {};
            currentQuestionIdx = 0;
            showQuestion(0);
        }

        // Рендеринг текущего вопроса и вариантов
        function showQuestion(idx) {
            const q = currentTask.questions[idx];
            
            // Обновляем прогресс-бар
            progressText.innerText = `${idx + 1} / ${currentTask.questions.length}`;
            progressBar.style.width = `${((idx + 1) / currentTask.questions.length) * 100}%`;
            
            questionNumber.innerText = `Question ${idx + 1} of ${currentTask.questions.length}`;
            questionTypeBadge.innerText = q.type;
            questionText.innerText = q.text;

            optionsContainer.innerHTML = '';
            q.options.forEach((option, i) => {
                const isChecked = userAnswers[idx] === i;
                const optionHtml = `
                    <label class="flex items-center p-3.5 rounded-xl border ${isChecked ? 'border-indigo-600 bg-indigo-50/40 font-semibold text-indigo-950' : 'border-slate-200 bg-white hover:bg-slate-50 text-slate-700'} transition cursor-pointer text-xs">
                        <input type="radio" name="toefl_option" value="${i}" ${isChecked ? 'checked' : ''} class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-500 mr-3 shrink-0">
                        <span>${option}</span>
                    </label>
                `;
                optionsContainer.innerHTML += optionHtml;
            });

            // Навешиваем клик на радио-кнопки вариантов
            optionsContainer.querySelectorAll('input').forEach(input => {
                input.addEventListener('change', (e) => {
                    userAnswers[idx] = parseInt(e.target.value);
                    showQuestion(idx); // Перерисовываем для обновления стилей рамки
                });
            });

            // Логика доступности кнопок навигации
            prevBtn.disabled = idx === 0;
            if (idx === currentTask.questions.length - 1) {
                nextBtn.innerHTML = `Submit Test <i data-lucide="check" class="w-4 h-4 ml-1.5"></i>`;
                nextBtn.className = "px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700 transition flex items-center shadow-xs";
            } else {
                nextBtn.innerHTML = `Next Question <i data-lucide="chevron-right" class="w-4 h-4 ml-1.5"></i>`;
                nextBtn.className = "px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-indigo-600 transition flex items-center shadow-xs";
            }
            lucide.createIcons();
        }

        // События кнопок навигации
        prevBtn.addEventListener('click', () => {
            if (currentQuestionIdx > 0) {
                currentQuestionIdx--;
                showQuestion(currentQuestionIdx);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (userAnswers[currentQuestionIdx] === undefined) {
                alert("Please select an answer before moving forward!");
                return;
            }

            if (currentQuestionIdx < currentTask.questions.length - 1) {
                currentQuestionIdx++;
                showQuestion(currentQuestionIdx);
            } else {
                processResults();
            }
        });

        // Подсчет результатов теста
        function processResults() {
            let correctCount = 0;
            
            // Локальная статистика (для графиков на дашборде, если нужно)
            let globalStats = JSON.parse(localStorage.getItem('toefl_reading_stats')) || {
                "Detail": { correct: 20, total: 23 },
                "Inference": { correct: 5, total: 11 },
                "Vocabulary in Context": { correct: 22, total: 24 }
            };

            currentTask.questions.forEach((q, idx) => {
                const isCorrect = userAnswers[idx] === q.correct;
                if (isCorrect) correctCount++;

                if (!globalStats[q.type]) {
                    globalStats[q.type] = { correct: 0, total: 0 };
                }
                globalStats[q.type].total += 1;
                if (isCorrect) globalStats[q.type].correct += 1;
            });

            const scorePercent = Math.round((correctCount / currentTask.questions.length) * 100);
            
            // Сохраняем прогресс выполнения в localStorage
            localStorage.setItem(`daily_test_score_${currentTask.id}`, scorePercent);
            localStorage.setItem('toefl_reading_stats', JSON.stringify(globalStats));

            // Скрываем квиз, показываем результаты
            quizContainer.classList.add('hidden');
            resultsContainer.classList.remove('hidden');

            document.getElementById('finalScorePercent').innerText = `${scorePercent}%`;
            document.getElementById('finalScoreRaw').innerText = `${correctCount} / ${currentTask.questions.length}`;
            lucide.createIcons();
        }

        // Запуск приложения
        init();
    </script>
</body>
</html>
