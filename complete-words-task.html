<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Practice Task — TOEFL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        .task-passage {
            font-size: 19px;
            line-height: 2.5;
            color: #1e293b;
            font-weight: 500;
            max-width: 1100px;
        }

        /* Группа букв внутри одного слова */
        .gap-group {
            display: inline-flex;
            align-items: baseline;
            /* Добавили небольшой отступ справа, чтобы слова не сливались */
            margin-right: 4px; 
            margin-left: 2px;
        }

        .gap-input {
            width: 14px;
            height: 24px;
            border: none;
            border-bottom: 2px solid #cbd5e1;
            background: transparent;
            outline: none;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #4f46e5;
            padding: 0;
            transition: 0.2s;
        }

        .gap-input:focus { border-bottom-color: #6366f1; background: #eef2ff; }
        .gap-input.correct { border-bottom-color: #10b981; color: #10b981; }
        .gap-input.wrong { border-bottom-color: #ef4444; color: #ef4444; }

        .answer-chip {
            padding: 8px 12px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>

<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 px-4 py-6 h-screen sticky top-0">
        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span><span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>
        <nav class="flex-1 space-y-1">
            <a href="index.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 transition"><i data-lucide="home" class="w-5 h-5"></i><span class="text-sm font-medium">Dashboard</span></a>
            <div class="pt-6 pb-2 px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider">Practice</div>
            <a href="reading.html" class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900 text-white font-medium shadow-sm"><i data-lucide="book-text" class="w-5 h-5"></i><span class="text-sm">Reading</span></a>
        </nav>
    </aside>

    <main class="flex-1 p-6 overflow-y-auto bg-[#f8f9fa] pb-24">
        <div class="max-w-6xl mx-auto mt-4">
            <div class="bg-white p-8 md:p-10 rounded-3xl border border-gray-100 shadow-sm relative">
                <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-purple-500 to-indigo-500"></div>
                
                <div class="flex justify-between items-start mb-8 pb-6 border-b border-gray-100">
                    <div>
                        <span id="taskCategory" class="text-[10px] font-bold text-purple-600 uppercase tracking-widest bg-purple-50 px-2 py-1 rounded-md">Loading...</span>
                        <h2 id="taskTitle" class="text-2xl font-bold text-slate-900 mt-3">Loading task...</h2>
                    </div>
                    <a href="complete-words.html" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 text-gray-400 hover:bg-gray-100"><i data-lucide="x" class="w-4 h-4"></i></a>
                </div>

                <div id="textContent" class="task-passage"></div>

                <div class="mt-10 flex justify-end" id="submitContainer">
                    <button id="submitBtn" class="text-sm font-bold text-white bg-slate-900 px-8 py-3.5 rounded-2xl hover:bg-purple-600 transition shadow-md">Check Answers</button>
                </div>

                <div id="resultBlock" class="hidden mt-10">
                    <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-6">
                        <h4 class="text-sm font-bold text-slate-900 mb-2">Task Completed</h4>
                        <span id="scoreDisplay" class="text-sm font-bold text-indigo-600"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';

        if (!window.supabaseClient) {
            window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
        const db = window.supabaseClient;

        async function loadTask(){
            const urlParams = new URLSearchParams(window.location.search);
            const taskId = urlParams.get('id');
            if(!taskId) return;

            const { data, error } = await db.from('complete_words_tasks').select('*').eq('id', taskId).single();
            if(error || !data) return;

            renderTask(data);
        }

        function renderTask(task){
            document.getElementById('taskTitle').innerText = task.title;
            document.getElementById('taskCategory').innerText = task.category;

            const processedText = task.passage.replace(/\[([^\]]+)\]/g, (match, answer) => {
                return `<span class="gap-group">${answer.split('').map(letter => `<input type="text" maxlength="1" class="gap-input" data-answer="${letter}">`).join('')}</span>`;
            });

            document.getElementById('textContent').innerHTML = processedText.replace(/\n/g, '<br>');

            const inputs = document.querySelectorAll('.gap-input');
            inputs.forEach((input, index) => {
                input.addEventListener('input', function(){
                    this.value = this.value.replace(/[^a-zA-Z]/g, '').toLowerCase();
                    if(this.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
                });
                input.addEventListener('keydown', (e) => {
                    if(e.key === 'Backspace' && !input.value && index > 0) inputs[index - 1].focus();
                });
            });

            document.getElementById('submitBtn').addEventListener('click', () => {
                let correctCount = 0;
                inputs.forEach(input => {
                    input.disabled = true;
                    if(input.value.toLowerCase() === input.dataset.answer.toLowerCase()){
                        input.classList.add('correct');
                        correctCount++;
                    } else {
                        input.classList.add('wrong');
                        input.value = input.dataset.answer;
                    }
                });
                document.getElementById('scoreDisplay').innerText = `${correctCount} / ${inputs.length} correct`;
                document.getElementById('resultBlock').classList.remove('hidden');
                document.getElementById('submitContainer').classList.add('hidden');
            });
        }
        loadTask();
    </script>
</body>
</html>
