<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Task — TOEFL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        /* Контейнер для слова целиком — гарантирует небольшие пробелы по бокам */
        .puzzle-word {
            display: inline-flex;
            align-items: baseline;
            vertical-align: baseline;
            margin: 0 4px; 
        }
        
        /* Единая плашка для пропущенных букв внутри слова */
        .letters-container {
            display: inline-flex;
            align-items: baseline;
            vertical-align: baseline;
            background-color: #f1f5f9;
            border-radius: 4px;
            padding: 0 2px;
            margin: 0; /* Прижимает плашку к обычной части слова без зазоров */
            transition: all 0.2s ease;
        }
        
        .puzzle-word:focus-within .letters-container {
            background-color: #e2e8f0;
        }

        /* Инпуты сидят идеально ровно на линии шрифта */
        .letter-input {
            width: 14px;
            text-align: center;
            border: none;
            border-bottom: 2px solid #94a3b8;
            outline: none;
            font-weight: 700;
            color: #1e293b;
            background: transparent;
            margin: 0 1px;
            padding: 0;
            font-family: inherit;
            font-size: inherit;
            vertical-align: baseline;
            transition: all 0.2s;
        }
        
        .letter-input:focus {
            border-bottom-color: #7e22ce;
        }
        
        .letter-input.correct { 
            border-bottom-color: #10b981; 
            color: #065f46; 
        }
        .letter-input.wrong { 
            border-bottom-color: #ef4444; 
            color: #991b1b; 
        }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 px-4 py-6 h-screen sticky top-0">
        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span><span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>
        <nav class="flex-1 space-y-1">
            <a href="index.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 transition"><i data-lucide="home" class="w-5 h-5"></i><span class="text-sm font-medium">Dashboard</span></a>
            <div class="pt-6 pb-2 px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider">Practice</div>
            <a href="reading.html" class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900 text-white font-medium shadow-sm"><i data-lucide="book-text" class="w-5 h-5"></i><span class="text-sm">Reading</span></a>
        </nav>
    </aside>

    <main class="flex-1 p-6 overflow-y-auto bg-[#f8f9fa] pb-24 md:pb-6">
        <div class="max-w-3xl mx-auto mt-4">
            
            <div class="bg-white p-8 md:p-10 rounded-3xl border border-gray-100 shadow-sm relative overflow-hidden">
                <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-purple-500 to-indigo-500"></div>

                <div class="flex justify-between items-start mb-8 pb-6 border-b border-gray-100">
                    <div>
                        <span id="taskCategory" class="text-[10px] font-bold text-purple-600 uppercase tracking-widest bg-purple-50 px-2 py-1 rounded-md mb-3 inline-block">Loading...</span>
                        <h2 id="taskTitle" class="text-xl font-bold text-slate-900 tracking-tight">Loading task...</h2>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <!-- Timer -->
                        <div id="timerDisplay" class="hidden items-center space-x-1.5 bg-slate-100 px-3 py-1.5 rounded-lg text-slate-700 font-bold text-sm shadow-sm transition-colors duration-300">
                            <i data-lucide="clock" class="w-4 h-4 opacity-70"></i>
                            <span id="timerText" class="tracking-widest tabular-nums">01:45</span>
                        </div>
                        
                        <a href="complete-words.html" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 text-gray-400 hover:bg-gray-100 hover:text-slate-700 transition">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </a>
                    </div>
                </div>

                <div id="textContent" class="text-[16px] leading-[2.3] text-slate-700 font-medium space-y-5">
                    <p id="loadingTaskMsg" class="text-sm text-gray-400">Fetching text from database...</p>
                </div>

                <div id="resultBlock" class="hidden mt-10">
                    <div class="bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-100/50 rounded-2xl p-6 relative overflow-hidden">
                        <div class="flex items-start space-x-4 relative z-10">
                            <div class="w-10 h-10 rounded-xl bg-white shadow-sm flex items-center justify-center text-indigo-600 shrink-0"><i data-lucide="award" class="w-5 h-5"></i></div>
                            <div class="w-full">
                                <div class="flex justify-between items-center mb-2">
                                    <h4 class="text-sm font-bold text-slate-900">Task Completed</h4>
                                    <span id="scoreDisplay" class="text-xs font-bold bg-white px-3 py-1.5 rounded-lg shadow-sm text-indigo-600"></span>
                                </div>
                                <div id="tipsContent" class="text-xs text-slate-600 leading-relaxed mt-1"></div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-6 flex justify-end gap-3">
                        <button onclick="resetAndRestartCompleteWords()" class="text-xs font-bold text-white bg-purple-600 px-5 py-3 rounded-xl hover:bg-purple-700 transition flex items-center shadow-xs cursor-pointer">
                            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 mr-1.5"></i> Try Again
                        </button>
                        <a href="complete-words.html" class="text-xs font-bold text-slate-700 bg-gray-100 px-6 py-3 rounded-xl hover:bg-gray-200 transition">Return to List</a>
                    </div>
                </div>

                <div class="mt-10 flex justify-end" id="submitContainer">
                    <button id="submitBtn" class="text-sm font-bold text-white bg-slate-900 px-8 py-3.5 rounded-xl hover:bg-purple-600 transition shadow-md flex items-center cursor-pointer">
                        Check Answers <i data-lucide="check-circle" class="w-4 h-4 ml-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('id');
        let currentTaskTitle = ""; 
        
        // Timer Variables
        let timeLeft = 105; // 1 minute 45 seconds
        let timerInterval = null;

        function getDatabaseClient() {
            if (typeof supabaseClient !== 'undefined') return supabaseClient;
            if (typeof window !== 'undefined' && window.supabaseClient) return window.supabaseClient;
            
            const fallbackUrl = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
            const fallbackKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
            return window.supabase.createClient(fallbackUrl, fallbackKey);
        }

        const db = getDatabaseClient();
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                if (typeof requireAuth !== 'function') {
                    throw new Error("Функция requireAuth не найдена.");
                }
                currentUser = await requireAuth();
                if (currentUser) {
                    initTask();
                }
            } catch (err) {
                showError("Authorization required. Please log in.");
            }
        });

        // Timer Functions
        function formatTime(seconds) {
            const absSec = Math.abs(seconds);
            const m = Math.floor(absSec / 60);
            const s = absSec % 60;
            const timeStr = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return seconds < 0 ? `-${timeStr}` : timeStr;
        }

        function updateTimerUI() {
            const timerText = document.getElementById('timerText');
            const timerDisplay = document.getElementById('timerDisplay');
            if (!timerText || !timerDisplay) return;

            timerText.innerText = formatTime(timeLeft);

            if (timeLeft < 0) {
                timerDisplay.classList.remove('bg-slate-100', 'text-slate-700');
                timerDisplay.classList.add('bg-rose-100', 'text-rose-700');
            } else {
                timerDisplay.classList.add('bg-slate-100', 'text-slate-700');
                timerDisplay.classList.remove('bg-rose-100', 'text-rose-700');
            }
        }

        function startTimer() {
            const timerDisplay = document.getElementById('timerDisplay');
            timerDisplay.classList.remove('hidden');
            timerDisplay.classList.add('flex');
            
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = 105;
            updateTimerUI();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        async function initTask() {
            if (!taskId) {
                showError("No Task ID provided.");
                return;
            }

            try {
                const { data: test, error } = await db
                    .from('complete_words_tasks')
                    .select('*')
                    .eq('id', taskId)
                    .single();

                if (error || !test) {
                    throw new Error(error ? error.message : "Task not found in DB");
                }

                currentTaskTitle = test.title;
                document.getElementById('taskTitle').innerText = test.title;
                document.getElementById('taskCategory').innerText = test.category || 'Practice';
                document.getElementById('tipsContent').innerHTML = test.tips || `<span class='font-bold text-indigo-700'>Tip:</span> Pay close attention to contextual clues and academic spelling suffixes.`;

                // ИСПРАВЛЕННЫЙ ПАРСИНГ: Ищем ЛЮБУЮ последовательность символов до пробела, внутри которой есть квадратные скобки.
                const htmlWithInputs = (test.passage || "").replace(/\S*(?:\[.\])+\S*/g, function(match) {
                    
                    let wordHtml = match.replace(/((?:\[.\])+)/g, function(bracketsBlock) {
                        const letters = bracketsBlock.match(/\[(.)\]/g).map(m => m.replace(/[\[\]]/g, ''));
                        
                        const inputsHtml = letters.map(letter => {
                            return `<input type="text" maxlength="1" data-answer="${letter}" class="letter-input" autocomplete="off">`;
                        }).join('');
                        
                        return `<span class="letters-container">${inputsHtml}</span>`;
                    });
                    
                    return `<span class="puzzle-word">${wordHtml}</span>`;
                });

                document.getElementById('textContent').innerHTML = htmlWithInputs;
                setupInputs();

                const { data: progress, error: progressError } = await db
                    .from('complete_words_results')
                    .select('score_percent')
                    .eq('task_id', taskId)
                    .eq('user_id', currentUser.id)
                    .maybeSingle();

                if (!progressError && progress) {
                    const savedScore = progress.score_percent;
                    const inputs = document.querySelectorAll('.letter-input');
                    inputs.forEach(input => {
                        input.disabled = true;
                        const correctAnswer = input.getAttribute('data-answer');
                        input.value = correctAnswer; 
                        input.classList.add('correct');
                    });

                    document.getElementById('scoreDisplay').innerText = `Saved Score: ${savedScore}%`;
                    document.getElementById('submitContainer').classList.add('hidden');
                    document.getElementById('resultBlock').classList.remove('hidden');
                    
                    // Если задание уже выполнено, таймер не запускаем (он останется скрытым)
                } else {
                    // Задание не выполнено - запускаем таймер
                    startTimer();
                }

                lucide.createIcons();

            } catch (err) {
                showError(err.message);
            }
        }

        function showError(msg) {
            document.getElementById('taskTitle').innerText = "Error Loading Test";
            document.getElementById('taskCategory').innerText = "Error";
            document.getElementById('textContent').innerHTML = `<p class="text-red-500 font-bold">${msg}</p>`;
            document.getElementById('submitContainer').style.display = 'none';
        }

        function setupInputs() {
            const inputs = document.querySelectorAll('.letter-input');
            inputs.forEach((input, index) => {
                input.addEventListener('input', function() {
                    this.value = this.value.replace(/[^a-zA-Z]/g, '').toLowerCase();
                    if (this.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
        }

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const inputs = document.querySelectorAll('.letter-input');
            if (inputs.length === 0) return;
            
            stopTimer(); // Останавливаем таймер при проверке ответов

            let correctCount = 0;
            inputs.forEach(input => {
                input.disabled = true;
                const userAnswer = input.value.toLowerCase();
                const correctAnswer = input.getAttribute('data-answer').toLowerCase();

                if (userAnswer === correctAnswer) {
                    input.classList.add('correct');
                    correctCount++;
                } else {
                    input.classList.add('wrong');
                    input.value = correctAnswer; 
                }
            });

            const scorePercent = Math.round((correctCount / inputs.length) * 100);
            
            try {
                const { error } = await db
                    .from('complete_words_results')
                    .upsert([{ 
                        task_id: taskId, 
                        user_id: currentUser.id, 
                        score_percent: scorePercent 
                    }], { onConflict: 'user_id, task_id' });

                if (error) throw error;
            } catch (dbErr) {
                console.error("Error saving progress to Supabase:", dbErr.message);
            }

            document.getElementById('scoreDisplay').innerText = `${scorePercent}% (${correctCount} / ${inputs.length} correct)`;
            document.getElementById('submitContainer').classList.add('hidden');
            document.getElementById('resultBlock').classList.remove('hidden');
            
            lucide.createIcons();
        });

        window.resetAndRestartCompleteWords = function() {
            if (!taskId || !currentUser) return;

            db.from('complete_words_results')
                .delete()
                .eq('task_id', taskId)
                .eq('user_id', currentUser.id)
                .then(({ error }) => {
                    if (error) console.error("Error resetting progress in DB:", error.message);
                });

            const inputs = document.querySelectorAll('.letter-input');
            inputs.forEach(input => {
                input.value = '';
                input.disabled = false;
                input.className = 'letter-input'; 
            });

            document.getElementById('resultBlock').classList.add('hidden');
            document.getElementById('submitContainer').classList.remove('hidden');

            if (inputs.length > 0) inputs[0].focus();
            
            // Перезапускаем таймер
            startTimer();
        };
    </script>
</body>
</html>
