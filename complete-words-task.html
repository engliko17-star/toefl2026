<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practice Task — TOEFL</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        body{
            font-family:'Plus Jakarta Sans',sans-serif;
        }

        ::-webkit-scrollbar{
            width:6px;
        }

        ::-webkit-scrollbar-track{
            background:transparent;
        }

        ::-webkit-scrollbar-thumb{
            background:#e2e8f0;
            border-radius:10px;
        }

        /* =========================
           WORD BLOCK
        ========================= */

        .word-gap{
            display:inline-flex;
            align-items:flex-end;
            gap:2px;

            margin:0 6px 0 2px;

            flex-wrap:nowrap;
            vertical-align:middle;
        }

        .word-gap .char{
            font-size:15px;
            font-weight:500;
            color:#334155;
            line-height:1;
        }

        /* =========================
           INPUT
        ========================= */

        .letter-input{
            width:28px;
            height:34px;

            border:2px solid #e2e8f0;
            border-radius:10px;

            background:white;

            text-align:center;

            font-size:15px;
            font-weight:700;

            color:#7e22ce;

            outline:none;

            transition:all .2s ease;
        }

        .letter-input:focus{
            border-color:#8b5cf6;
            box-shadow:0 0 0 4px rgba(139,92,246,.12);
        }

        .letter-input.correct{
            border-color:#10b981;
            background:#ecfdf5;
            color:#10b981;
        }

        .letter-input.wrong{
            border-color:#ef4444;
            background:#fef2f2;
            color:#ef4444;
        }

        /* paragraph spacing */

        .task-paragraph{
            margin-bottom:24px;
            line-height:2.2;
        }
    </style>
</head>

<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <!-- SIDEBAR -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 px-4 py-6 h-screen sticky top-0">

        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span>
            <span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>

        <nav class="flex-1 space-y-1">

            <a href="index.html"
               class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 transition">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-sm font-medium">Dashboard</span>
            </a>

            <div class="pt-6 pb-2 px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider">
                Practice
            </div>

            <a href="reading.html"
               class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900 text-white font-medium shadow-sm">
                <i data-lucide="book-text" class="w-5 h-5"></i>
                <span class="text-sm">Reading</span>
            </a>

        </nav>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-6 overflow-y-auto bg-[#f8f9fa] pb-24 md:pb-6">

        <div class="max-w-3xl mx-auto mt-4">

            <div class="bg-white p-8 md:p-10 rounded-3xl border border-gray-100 shadow-sm relative overflow-hidden">

                <!-- top gradient -->
                <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-purple-500 to-indigo-500"></div>

                <!-- header -->
                <div class="flex justify-between items-start mb-8 pb-6 border-b border-gray-100">

                    <div>
                        <span id="taskCategory"
                              class="text-[10px] font-bold text-purple-600 uppercase tracking-widest bg-purple-50 px-2 py-1 rounded-md mb-3 inline-block">
                              Loading...
                        </span>

                        <h2 id="taskTitle"
                            class="text-xl font-bold text-slate-900 tracking-tight">
                            Loading task...
                        </h2>
                    </div>

                    <a href="complete-words.html"
                       class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 text-gray-400 hover:bg-gray-100 hover:text-slate-700 transition">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </a>

                </div>

                <!-- content -->
                <div id="textContent"
                     class="text-[15px] text-slate-700 font-medium">
                </div>

                <!-- RESULT -->
                <div id="resultBlock" class="hidden mt-10">

                    <div class="bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-100/50 rounded-2xl p-6 relative overflow-hidden">

                        <div class="flex items-start space-x-4 relative z-10">

                            <div class="w-10 h-10 rounded-xl bg-white shadow-sm flex items-center justify-center text-indigo-600 shrink-0">
                                <i data-lucide="award" class="w-5 h-5"></i>
                            </div>

                            <div class="w-full">

                                <div class="flex justify-between items-center mb-2">

                                    <h4 class="text-sm font-bold text-slate-900">
                                        Task Completed
                                    </h4>

                                    <span id="scoreDisplay"
                                          class="text-xs font-bold bg-white px-3 py-1.5 rounded-lg shadow-sm text-indigo-600">
                                    </span>

                                </div>

                                <div id="tipsContent"
                                     class="text-xs text-slate-600 leading-relaxed mt-1">
                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="mt-6 flex justify-end">
                        <a href="complete-words.html"
                           class="text-xs font-bold text-slate-700 bg-gray-100 px-6 py-3 rounded-xl hover:bg-gray-200 transition">
                            Return to List
                        </a>
                    </div>

                </div>

                <!-- submit -->
                <div class="mt-10 flex justify-end" id="submitContainer">

                    <button id="submitBtn"
                            class="text-sm font-bold text-white bg-slate-900 px-8 py-3.5 rounded-xl hover:bg-purple-600 transition shadow-md flex items-center">

                        Check Answers

                        <i data-lucide="check-circle"
                           class="w-4 h-4 ml-2"></i>

                    </button>

                </div>

            </div>

        </div>

    </main>

    <script>

        lucide.createIcons();

        /* ========================================
           DATABASE
        ======================================== */

        const database = {

            "1": {
                category: "History",

                title: "The Origins of Agriculture",

                text: `
                    <p>
                        Agriculture began around 10,000 years ago in the Fertile Crescent.
                    </p>

                    <p>
                        It marked a massive shift in h[u]m[a]n history.
                        People transitioned from nomadic hunter-gatherers
                        to settled communities.

                        This eventually led to the rise of early
                        c[i]v[i]l[i]zations.
                    </p>
                `,

                tips: `
                    <span class='font-bold text-indigo-700'>Tip:</span>
                    Notice the spelling of <strong>civilization</strong>.
                    In TOEFL (US English) it uses a 'z',
                    while UK English often uses 's'.
                `
            },

            "2": {
                category: "Science",

                title: "Cognitive Psychology",

                text: `
                    <p>
                        Cognitive psychology is the scientific study of mental
                        processes such as attention, language use,
                        memory, and perception.
                    </p>

                    <p>
                        It originated in the 1960s in a break from
                        beh[a]v[i]orism.

                        Researchers began applying the strict scientific
                        m[e]th[o]d to studying the mind.
                    </p>
                `,

                tips: `
                    <span class='font-bold text-indigo-700'>Tip:</span>
                    <strong>Behaviorism</strong>:
                    US English ends in -or,
                    UK English is -our.
                `
            }

        };

        /* ========================================
           GET TASK
        ======================================== */

        const urlParams = new URLSearchParams(window.location.search);

        const taskId = urlParams.get('id');

        const currentTask = database[taskId];

        /* ========================================
           ERROR
        ======================================== */

        if (!currentTask) {

            document.getElementById('taskTitle').innerText = 'Task not found';

            document.getElementById('taskCategory').innerText = 'Error';

            document.getElementById('submitContainer').style.display = 'none';

        }

        /* ========================================
           RENDER TASK
        ======================================== */

        else {

            document.getElementById('taskTitle').innerText =
                currentTask.title;

            document.getElementById('taskCategory').innerText =
                currentTask.category;

            document.getElementById('tipsContent').innerHTML =
                currentTask.tips;

            /* ========================================
               RENDER WORDS WITH INPUTS
            ======================================== */

            function renderTextWithInputs(text) {

                return text.replace(
                    /([a-zA-Z\[\]]+)/g,

                    function(word){

                        // no gaps
                        if(!word.includes('[')){
                            return word;
                        }

                        let finalWord = '<span class="word-gap">';

                        for(let i = 0; i < word.length; i++){

                            // input
                            if(word[i] === '['){

                                const answer = word[i + 1];

                                finalWord += `
                                    <input
                                        type="text"
                                        maxlength="1"
                                        data-answer="${answer}"
                                        class="letter-input"
                                        autocomplete="off"
                                    >
                                `;

                                i += 2;
                            }

                            // letter
                            else{

                                finalWord += `
                                    <span class="char">
                                        ${word[i]}
                                    </span>
                                `;
                            }
                        }

                        finalWord += '</span>';

                        return finalWord;
                    }
                );
            }

            const processedHTML =
                renderTextWithInputs(currentTask.text);

            document.getElementById('textContent').innerHTML =
                processedHTML;

            /* ========================================
               STYLE PARAGRAPHS
            ======================================== */

            document.querySelectorAll('#textContent p')
                .forEach(p => {
                    p.classList.add('task-paragraph');
                });

            /* ========================================
               INPUT LOGIC
            ======================================== */

            const inputs =
                document.querySelectorAll('.letter-input');

            inputs.forEach((input, index) => {

                input.addEventListener('input', function(){

                    this.value = this.value
                        .replace(/[^a-zA-Z]/g, '')
                        .toLowerCase();

                    if(
                        this.value.length === 1 &&
                        index < inputs.length - 1
                    ){
                        inputs[index + 1].focus();
                    }

                });

                input.addEventListener('keydown', function(e){

                    if(
                        e.key === 'Backspace' &&
                        this.value === '' &&
                        index > 0
                    ){
                        inputs[index - 1].focus();
                    }

                });

            });

            /* ========================================
               SUBMIT
            ======================================== */

            document
                .getElementById('submitBtn')
                .addEventListener('click', () => {

                    let correctCount = 0;

                    inputs.forEach(input => {

                        input.disabled = true;

                        const userAnswer =
                            input.value.toLowerCase();

                        const correctAnswer =
                            input
                                .getAttribute('data-answer')
                                .toLowerCase();

                        if(userAnswer === correctAnswer){

                            input.classList.add('correct');

                            correctCount++;

                        } else {

                            input.classList.add('wrong');

                            input.value = correctAnswer;

                        }

                    });

                    document.getElementById('scoreDisplay')
                        .innerText =
                        `${correctCount} / ${inputs.length} correct`;

                    document.getElementById('submitContainer')
                        .classList.add('hidden');

                    document.getElementById('resultBlock')
                        .classList.remove('hidden');

                });

        }

    </script>

</body>
</html>
