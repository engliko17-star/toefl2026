<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Practice Task — TOEFL</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        body{
            font-family:'Plus Jakarta Sans',sans-serif;
        }

        ::-webkit-scrollbar{
            width:6px;
        }

        ::-webkit-scrollbar-track{
            background:transparent;
        }

        ::-webkit-scrollbar-thumb{
            background:#e2e8f0;
            border-radius:10px;
        }

        /* =========================
           PARAGRAPH
        ========================= */

        .task-paragraph{
            font-size:18px;
            line-height:2.2;
            color:#1e293b;
            font-weight:500;
            margin-bottom:28px;
        }

        /* =========================
           INLINE GAP INPUT
        ========================= */

        .gap-input{
            display:inline-block;

            min-width:36px;

            border:none;
            border-bottom:2px solid #a855f7;

            background:transparent;

            text-align:center;

            font-size:17px;
            font-weight:600;

            color:#7e22ce;

            outline:none;

            padding:0 2px 2px;

            margin:0 2px;

            transition:all .2s ease;

            vertical-align:baseline;
        }

        .gap-input:focus{
            border-bottom-color:#6366f1;
            box-shadow:0 4px 12px rgba(99,102,241,.12);
        }

        .gap-input.correct{
            border-bottom-color:#10b981;
            color:#10b981;
        }

        .gap-input.wrong{
            border-bottom-color:#ef4444;
            color:#ef4444;
        }

        /* remove weird input bg on mobile */

        input{
            -webkit-appearance:none;
            appearance:none;
            border-radius:0;
        }

    </style>
</head>

<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <!-- SIDEBAR -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 px-4 py-6 h-screen sticky top-0">

        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span>
            <span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>

        <nav class="flex-1 space-y-1">

            <a href="index.html"
               class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 transition">

                <i data-lucide="home" class="w-5 h-5"></i>

                <span class="text-sm font-medium">
                    Dashboard
                </span>

            </a>

            <div class="pt-6 pb-2 px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider">
                Practice
            </div>

            <a href="reading.html"
               class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900 text-white font-medium shadow-sm">

                <i data-lucide="book-text" class="w-5 h-5"></i>

                <span class="text-sm">
                    Reading
                </span>

            </a>

        </nav>

    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-6 overflow-y-auto bg-[#f8f9fa] pb-24 md:pb-6">

        <div class="max-w-4xl mx-auto mt-4">

            <div class="bg-white p-8 md:p-10 rounded-3xl border border-gray-100 shadow-sm relative overflow-hidden">

                <!-- top line -->
                <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-purple-500 to-indigo-500"></div>

                <!-- HEADER -->
                <div class="flex justify-between items-start mb-8 pb-6 border-b border-gray-100">

                    <div>

                        <span id="taskCategory"
                              class="text-[10px] font-bold text-purple-600 uppercase tracking-widest bg-purple-50 px-2 py-1 rounded-md mb-3 inline-block">

                            Loading...

                        </span>

                        <h2 id="taskTitle"
                            class="text-2xl font-bold text-slate-900 tracking-tight">

                            Loading task...

                        </h2>

                    </div>

                    <a href="complete-words.html"
                       class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 text-gray-400 hover:bg-gray-100 hover:text-slate-700 transition">

                        <i data-lucide="x" class="w-4 h-4"></i>

                    </a>

                </div>

                <!-- TASK -->
                <div id="textContent"></div>

                <!-- SUBMIT -->
                <div class="mt-10 flex justify-end" id="submitContainer">

                    <button id="submitBtn"
                            class="text-sm font-bold text-white bg-slate-900 px-8 py-3.5 rounded-2xl hover:bg-purple-600 transition shadow-md flex items-center">

                        Check Answers

                        <i data-lucide="check-circle" class="w-4 h-4 ml-2"></i>

                    </button>

                </div>

                <!-- RESULT -->
                <div id="resultBlock" class="hidden mt-10">

                    <div class="bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-100/50 rounded-2xl p-6">

                        <div class="flex items-start space-x-4">

                            <div class="w-10 h-10 rounded-xl bg-white shadow-sm flex items-center justify-center text-indigo-600 shrink-0">

                                <i data-lucide="award" class="w-5 h-5"></i>

                            </div>

                            <div class="w-full">

                                <div class="flex justify-between items-center mb-2">

                                    <h4 class="text-sm font-bold text-slate-900">
                                        Task Completed
                                    </h4>

                                    <span id="scoreDisplay"
                                          class="text-xs font-bold bg-white px-3 py-1.5 rounded-lg shadow-sm text-indigo-600">
                                    </span>

                                </div>

                                <div id="tipsContent"
                                     class="text-xs text-slate-600 leading-relaxed mt-1">
                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="mt-6 flex justify-end">

                        <a href="complete-words.html"
                           class="text-xs font-bold text-slate-700 bg-gray-100 px-6 py-3 rounded-xl hover:bg-gray-200 transition">

                            Return to List

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script>

        lucide.createIcons();

        /* =========================
           DATABASE
        ========================= */

        const database = {

            "1": {

                category: "Psychology",

                title: "Human Perception",

                text: `
Human perception is not a direct recording of reality but a constructed experience shaped by the brain’s interpretation of sensory information.

Some resear[chers] have arg[ued] that the mi[nd] actively fi[lls] in mis[sing] details based on past exper[iences].

This proc[ess] helps indiv[iduals] make deci[sions] quickly, but it can also lead to systematic errors or illusions.
                `,

                tips: `
                    <span class='font-bold text-indigo-700'>Tip:</span>
                    Try reading the full sentence first before focusing on the missing parts.
                    Context clues make vocabulary tasks much easier in TOEFL Reading.
                `
            }

        };

        /* =========================
           GET TASK
        ========================= */

        const urlParams = new URLSearchParams(window.location.search);

        const taskId = urlParams.get('id') || "1";

        const currentTask = database[taskId];

        /* =========================
           ERROR
        ========================= */

        if(!currentTask){

            document.getElementById('taskTitle').innerText =
                'Task not found';

            document.getElementById('taskCategory').innerText =
                'Error';

        }

        /* =========================
           RENDER
        ========================= */

        else{

            document.getElementById('taskTitle').innerText =
                currentTask.title;

            document.getElementById('taskCategory').innerText =
                currentTask.category;

            document.getElementById('tipsContent').innerHTML =
                currentTask.tips;

            /* =========================
               PARSER
            ========================= */

            function renderText(text){

                const paragraphs = text
                    .trim()
                    .split('\n\n');

                let finalHTML = '';

                paragraphs.forEach(paragraph => {

                    const processedParagraph =
                        paragraph.replace(
                            /\[([^\]]+)\]/g,

                            (match, answer) => {

                                const width =
                                    Math.max(answer.length * 14, 40);

                                return `
                                    <input
                                        type="text"
                                        class="gap-input"
                                        data-answer="${answer}"
                                        maxlength="${answer.length}"
                                        style="width:${width}px"
                                        autocomplete="off"
                                    >
                                `;
                            }
                        );

                    finalHTML += `
                        <p class="task-paragraph">
                            ${processedParagraph}
                        </p>
                    `;
                });

                return finalHTML;

            }

            document.getElementById('textContent').innerHTML =
                renderText(currentTask.text);

            /* =========================
               INPUT LOGIC
            ========================= */

            const inputs =
                document.querySelectorAll('.gap-input');

            inputs.forEach((input, index) => {

                input.addEventListener('input', function(){

                    this.value =
                        this.value.replace(/[^a-zA-Z]/g, '');

                    if(
                        this.value.length >= this.maxLength &&
                        index < inputs.length - 1
                    ){
                        inputs[index + 1].focus();
                    }

                });

                input.addEventListener('keydown', function(e){

                    if(
                        e.key === 'Backspace' &&
                        this.value === '' &&
                        index > 0
                    ){
                        inputs[index - 1].focus();
                    }

                });

            });

            /* =========================
               SUBMIT
            ========================= */

            document
                .getElementById('submitBtn')
                .addEventListener('click', () => {

                    let correctCount = 0;

                    inputs.forEach(input => {

                        input.disabled = true;

                        const userAnswer =
                            input.value.trim().toLowerCase();

                        const correctAnswer =
                            input.dataset.answer.trim().toLowerCase();

                        if(userAnswer === correctAnswer){

                            input.classList.add('correct');

                            correctCount++;

                        }else{

                            input.classList.add('wrong');

                            input.value = input.dataset.answer;

                        }

                    });

                    document.getElementById('scoreDisplay')
                        .innerText =
                        `${correctCount} / ${inputs.length} correct`;

                    document.getElementById('submitContainer')
                        .classList.add('hidden');

                    document.getElementById('resultBlock')
                        .classList.remove('hidden');

                });

        }

    </script>

</body>
</html>
