<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Task — TOEFL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Если CDN иконок не ответил, страница не должна падать на lucide.createIcons()
        if (!window.lucide || typeof window.lucide.createIcons !== 'function') window.lucide = { createIcons: function () {} };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="auth.js"></script>
    <script src="practice-next.js"></script>
    <script src="complete-words-ui.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <div id="app-sidebar"></div>
    <script src="nav.js"></script>

    <main class="flex-1 p-3 sm:p-6 overflow-y-auto bg-[#f8f9fa] pb-10 sm:pb-6">
        <div class="max-w-3xl mx-auto mt-1 sm:mt-4">
            
            <div class="bg-white p-5 sm:p-8 md:p-10 rounded-2xl sm:rounded-3xl border border-gray-100 shadow-sm relative overflow-hidden">
                <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-purple-500 to-indigo-500"></div>

                <div class="flex justify-between items-start gap-3 mb-5 pb-4 sm:mb-8 sm:pb-6 border-b border-gray-100">
                    <div class="min-w-0">
                        <span id="taskCategory" class="text-[10px] font-bold text-purple-600 uppercase tracking-widest bg-purple-50 px-2 py-1 rounded-md mb-3 inline-block">Loading...</span>
                        <h2 id="taskTitle" class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">Loading task...</h2>
                    </div>
                    
                    <div class="flex items-center gap-2 sm:gap-4 shrink-0">
                        <!-- Timer -->
                        <div id="timerDisplay" class="hidden items-center space-x-1.5 bg-slate-100 px-3 py-1.5 rounded-lg text-slate-700 font-bold text-sm shadow-sm transition-colors duration-300">
                            <i data-lucide="clock" class="w-4 h-4 opacity-70"></i>
                            <span id="timerText" class="tracking-widest tabular-nums">01:45</span>
                        </div>
                        
                        <a href="complete-words.html" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 text-gray-400 hover:bg-gray-100 hover:text-slate-700 transition">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </a>
                    </div>
                </div>

                <p class="text-sm font-semibold text-slate-500 mb-3 sm:mb-4">Fill in the missing letters in the paragraph.</p>
                <div id="textContent" class="text-[17px] sm:text-[18px] leading-[1.9] text-slate-800 font-medium">
                    <p id="loadingTaskMsg" class="text-sm text-gray-400">Fetching text from database...</p>
                </div>

                <div id="resultBlock" class="hidden mt-8 sm:mt-10">
                    <div class="bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-100/50 rounded-2xl p-4 sm:p-6 relative overflow-hidden">
                        <div class="flex items-start space-x-4 relative z-10">
                            <div class="w-10 h-10 rounded-xl bg-white shadow-sm flex items-center justify-center text-indigo-600 shrink-0"><i data-lucide="award" class="w-5 h-5"></i></div>
                            <div class="w-full">
                                <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
                                    <h4 class="text-sm font-bold text-slate-900">Task Completed</h4>
                                    <span id="scoreDisplay" class="text-xs font-bold bg-white px-3 py-1.5 rounded-lg shadow-sm text-indigo-600"></span>
                                </div>
                                <div id="tipsContent" class="text-xs text-slate-600 leading-relaxed mt-1"></div>
                            </div>
                        </div>
                    </div>
                    <div id="resultActions" class="mt-6 flex flex-wrap justify-end gap-3">
                        <button onclick="resetAndRestartCompleteWords()" class="text-xs font-bold text-white bg-purple-600 px-5 py-3 rounded-xl hover:bg-purple-700 transition flex items-center shadow-xs cursor-pointer">
                            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 mr-1.5"></i> Try Again
                        </button>
                        <a href="complete-words.html" class="text-xs font-bold text-slate-700 bg-gray-100 px-6 py-3 rounded-xl hover:bg-gray-200 transition">Return to List</a>
                    </div>
                </div>

                <div class="mt-8 sm:mt-10 flex justify-end" id="submitContainer">
                    <button id="submitBtn" class="w-full sm:w-auto justify-center text-sm font-bold text-white bg-slate-900 px-8 py-3.5 rounded-xl hover:bg-purple-600 transition shadow-md flex items-center cursor-pointer">
                        Check Answers <i data-lucide="check-circle" class="w-4 h-4 ml-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('id');
        let currentTaskTitle = ""; 
        
        // Timer Variables
        let timeLeft = 105; // 1 minute 45 seconds
        let timerInterval = null;

        function getDatabaseClient() {
            if (typeof supabaseClient !== 'undefined') return supabaseClient;
            if (typeof window !== 'undefined' && window.supabaseClient) return window.supabaseClient;
            
            const fallbackUrl = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
            const fallbackKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
            return window.supabase.createClient(fallbackUrl, fallbackKey);
        }

        const db = getDatabaseClient();
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                if (typeof requireAuth !== 'function') {
                    throw new Error("Функция requireAuth не найдена.");
                }
                currentUser = await requireAuth();
                if (currentUser) {
                    initTask();
                }
            } catch (err) {
                showError("Authorization required. Please log in.");
            }
        });

        // Timer Functions
        function formatTime(seconds) {
            const absSec = Math.abs(seconds);
            const m = Math.floor(absSec / 60);
            const s = absSec % 60;
            const timeStr = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return seconds < 0 ? `-${timeStr}` : timeStr;
        }

        function updateTimerUI() {
            const timerText = document.getElementById('timerText');
            const timerDisplay = document.getElementById('timerDisplay');
            if (!timerText || !timerDisplay) return;

            timerText.innerText = formatTime(timeLeft);

            if (timeLeft < 0) {
                timerDisplay.classList.remove('bg-slate-100', 'text-slate-700');
                timerDisplay.classList.add('bg-rose-100', 'text-rose-700');
            } else {
                timerDisplay.classList.add('bg-slate-100', 'text-slate-700');
                timerDisplay.classList.remove('bg-rose-100', 'text-rose-700');
            }
        }

        function startTimer() {
            const timerDisplay = document.getElementById('timerDisplay');
            timerDisplay.classList.remove('hidden');
            timerDisplay.classList.add('flex');
            
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = 105;
            updateTimerUI();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        async function initTask() {
            if (!taskId) {
                showError("No Task ID provided.");
                return;
            }

            try {
                const { data: test, error } = await db
                    .from('complete_words_tasks')
                    .select('*')
                    .eq('id', taskId)
                    .single();

                if (error || !test) {
                    throw new Error(error ? error.message : "Task not found in DB");
                }

                currentTaskTitle = test.title;
                document.getElementById('taskTitle').innerText = test.title;
                document.getElementById('taskCategory').innerText = test.category || 'Practice';
                document.getElementById('tipsContent').innerHTML = test.tips || `<span class='font-bold text-indigo-700'>Tip:</span> Pay close attention to contextual clues and academic spelling suffixes.`;

                // ИСПРАВЛЕННЫЙ ПАРСИНГ: Ищем ЛЮБУЮ последовательность символов до пробела, внутри которой есть квадратные скобки.
                const htmlWithInputs = (test.passage || "").replace(/\S*(?:\[.\])+\S*/g, function(match) {
                    
                    let wordHtml = match.replace(/((?:\[.\])+)/g, function(bracketsBlock) {
                        const letters = bracketsBlock.match(/\[(.)\]/g).map(m => m.replace(/[\[\]]/g, ''));
                        
                        const inputsHtml = letters.map(letter => {
                            return `<input type="text" maxlength="1" data-answer="${letter}" class="letter-input" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="next" aria-label="missing letter">`;
                        }).join('');
                        
                        return `<span class="letters-container">${inputsHtml}</span>`;
                    });
                    
                    return `<span class="puzzle-word">${wordHtml}</span>`;
                });

                document.getElementById('textContent').innerHTML = htmlWithInputs;
                setupInputs();

                // select('*') — чтобы получить и ответы ученицы, если колонка user_answers уже есть.
                // Без maybeSingle: если в базе остались дубли, страница не должна ломаться.
                const { data: progressRows, error: progressError } = await db
                    .from('complete_words_results')
                    .select('*')
                    .eq('task_id', taskId)
                    .eq('user_id', currentUser.id);

                const progress = (!progressError && progressRows && progressRows.length)
                    ? [...progressRows].sort((x, y) => String(x.created_at || '').localeCompare(String(y.created_at || ''))).pop()
                    : null;

                if (progress) {
                    showSavedAttempt(progress);
                } else {
                    // Задание не выполнено - запускаем таймер
                    startTimer();
                }

                lucide.createIcons();

            } catch (err) {
                showError(err.message);
            }
        }

        // Показ сохранённой попытки. Раньше все пропуски заполнялись правильными
        // буквами и красились зелёным — разбор выглядел как 100% при любом балле.
        function showSavedAttempt(progress) {
            let saved = progress.user_answers;
            if (typeof saved === 'string') { try { saved = JSON.parse(saved); } catch (e) { saved = null; } }
            const words = document.querySelectorAll('.puzzle-word');
            let correctWords = 0;
            words.forEach((wordEl, w) => {
                const letters = Array.isArray(saved) && Array.isArray(saved[w]) ? saved[w] : null;
                let wordOk = true;
                wordEl.querySelectorAll('.letter-input').forEach((input, i) => {
                    input.disabled = true;
                    const right = input.getAttribute('data-answer');
                    if (letters) {
                        const typed = String(letters[i] || '').toLowerCase();
                        const ok = typed === right.toLowerCase();
                        if (!ok) wordOk = false;
                        input.value = right;
                        input.classList.add(ok ? 'correct' : 'wrong');
                    } else {
                        input.value = right; // ответы этой попытки не сохранялись — только правильные буквы, без оценки
                    }
                });
                if (letters && wordOk) correctWords++;
            });

            document.getElementById('scoreDisplay').innerText = (Array.isArray(saved) && words.length)
                ? `Saved Score: ${progress.score_percent}% (${correctWords} / ${words.length} correct)`
                : `Saved Score: ${progress.score_percent}% — your letters for this attempt were not saved, correct letters are shown`;
            document.getElementById('submitContainer').classList.add('hidden');
            document.getElementById('resultBlock').classList.remove('hidden');
            // «Next test» — следующий несделанный тест из списка (practice-next.js)
            if (window.PracticeNext) PracticeNext.mount('words', { row: 'resultActions', currentId: new URLSearchParams(location.search).get('id'), client: db, userId: currentUser && currentUser.id, align: 'right' });
        }

        // Сохраняет результат. Работает и без уникального ключа (user_id, task_id) в базе
        // (тогда старый результат удаляется и пишется новый), и без колонки user_answers
        // (тогда сохраняется только балл, как раньше).
        async function saveCompleteWordsResult(scorePercent, userWords) {
            const base = { task_id: taskId, user_id: currentUser.id, score_percent: scorePercent };
            const variants = [{ ...base, user_answers: userWords }, base];
            let lastErr = null;
            for (const row of variants) {
                let { error } = await db.from('complete_words_results').upsert([row], { onConflict: 'user_id, task_id' });
                if (error && !/user_answers/i.test(error.message || '')) {
                    const del = await db.from('complete_words_results').delete().eq('task_id', taskId).eq('user_id', currentUser.id);
                    if (!del.error) ({ error } = await db.from('complete_words_results').insert([row]));
                }
                if (!error) return { ok: true };
                lastErr = error;
                if (!/user_answers/i.test(error.message || '')) break; // ошибка не про колонку — второй вариант не поможет
            }
            return { ok: false, error: lastErr };
        }

        function showError(msg) {
            document.getElementById('taskTitle').innerText = "Error Loading Test";
            document.getElementById('taskCategory').innerText = "Error";
            document.getElementById('textContent').innerHTML = `<p class="text-red-500 font-bold">${msg}</p>`;
            document.getElementById('submitContainer').style.display = 'none';
        }

        // Ввод букв, переход между клетками, Backspace на Android — общий файл complete-words-ui.js
        function setupInputs() {
            if (window.CWUI) CWUI.bind(document.getElementById('textContent'));
        }

        let checking = false;
        document.getElementById('submitBtn').addEventListener('click', async () => {
            if (checking) return;
            const puzzleWords = document.querySelectorAll('.puzzle-word');
            const totalWords = puzzleWords.length;
            
            if (totalWords === 0) return;
            checking = true;
            
            stopTimer(); // Останавливаем таймер при проверке ответов

            let correctWordsCount = 0;
            const userWords = []; // буквы ученицы по словам — для разбора

            puzzleWords.forEach(wordContainer => {
                const inputs = wordContainer.querySelectorAll('.letter-input');
                userWords.push(Array.from(inputs).map(i => i.value.toLowerCase()));
                let isWordCorrect = true;

                inputs.forEach(input => {
                    input.disabled = true;
                    const userAnswer = input.value.toLowerCase();
                    const correctAnswer = input.getAttribute('data-answer').toLowerCase();

                    if (userAnswer === correctAnswer) {
                        input.classList.add('correct');
                    } else {
                        input.classList.add('wrong');
                        input.value = correctAnswer; 
                        isWordCorrect = false;
                    }
                });

                if (isWordCorrect && inputs.length > 0) {
                    correctWordsCount++;
                }
            });

            const scorePercent = Math.round((correctWordsCount / totalWords) * 100);
            
            const saved = await saveCompleteWordsResult(scorePercent, userWords);
            if (!saved.ok) {
                console.error("Error saving progress to Supabase:", saved.error);
                alert('Результат не сохранился в базу — балл на экране показан, но его не будет в статистике.\n\n'
                    + (saved.error && saved.error.message ? saved.error.message : saved.error));
            }

            document.getElementById('scoreDisplay').innerText = `${scorePercent}% (${correctWordsCount} / ${totalWords} correct)`;
            document.getElementById('submitContainer').classList.add('hidden');
            document.getElementById('resultBlock').classList.remove('hidden');
            // «Next test» — следующий несделанный тест из списка (practice-next.js)
            if (window.PracticeNext) PracticeNext.mount('words', { row: 'resultActions', currentId: new URLSearchParams(location.search).get('id'), client: db, userId: currentUser && currentUser.id, align: 'right' });
            checking = false;
            
            lucide.createIcons();
        });

        window.resetAndRestartCompleteWords = function() {
            if (!taskId || !currentUser) return;

            db.from('complete_words_results')
                .delete()
                .eq('task_id', taskId)
                .eq('user_id', currentUser.id)
                .then(({ error }) => {
                    if (error) console.error("Error resetting progress in DB:", error.message);
                });

            const inputs = document.querySelectorAll('.letter-input');
            inputs.forEach(input => {
                input.value = '';
                input.disabled = false;
                input.className = 'letter-input'; 
            });

            document.getElementById('resultBlock').classList.add('hidden');
            document.getElementById('submitContainer').classList.remove('hidden');

            if (inputs.length > 0) inputs[0].focus();
            
            // Перезапускаем таймер
            startTimer();
        };
    </script>
</body>
</html>
