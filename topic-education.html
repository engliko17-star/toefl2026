        { q: "Tell me a little about the technology you used during your childhood education. Do you feel like that technology prepared you for life after school? Why or why not?",
          lx: ["digital skills", "keep up with", "curriculum"],
          model: "[A] We used quite basic technology at school, and I don't think it prepared me very well for life after school. [R] We learned to type and use simple programs, but technology changes so fast that most of it was out of date by the time I graduated. We never learned important skills like coding or how to check information online. [E] For example, our computer room had old computers, and we spent lessons making presentations and simple tables. When I started university, I had to learn data tools and design software from online videos by myself. My little brother's school now teaches coding from age ten. [C] So school gave me the basics, but I learned the useful skills later.",
          model5: "[A] Our school technology was fairly basic, and honestly, it prepared me only partially for life afterwards. [R] We learned to type and use standard office programs, but technology evolves so quickly that much of it was outdated by graduation, and we never touched essential skills such as coding or evaluating information online. [E] Our computer room, for instance, had aging machines, and most lessons involved making slideshows and simple spreadsheets. At university, I had to teach myself data and design software through online tutorials. My younger brother's school, by contrast, now introduces coding from the age of ten. [C] So school gave me a foundation, but the genuinely useful digital skills I acquired later, on my own." },
        { q: "Some people believe that the current education system needs significant changes to better prepare children for the future, focusing more on skills like problem-solving and teamwork instead of mainly teaching facts. Do you agree or disagree with this viewpoint? Why?",
          lx: ["rote learning", "critical thinking", "curriculum"],
          model: "[A] I agree — schools should focus more on skills like problem-solving and teamwork. [R] Today, we can find any fact on the internet in seconds, but we can't find the ability to think, cooperate or solve new problems. Employers also say that young people lack these skills. But some basic knowledge is still important. [E] For example, at school, we learned many dates and formulas by heart, and I forgot most of them after the exam. But the mini-company project taught me teamwork, planning and how to solve problems, and I still use these skills every day at my internship. [C] So schools should teach fewer facts and more skills.",
          model5: "[A] I largely agree, though I wouldn't abandon factual knowledge entirely. [R] Any fact can now be found online in seconds, whereas the ability to think critically, collaborate and tackle unfamiliar problems can't be searched for, and employers consistently report that graduates lack precisely these skills. [E] At school, for instance, we learned countless dates and formulas **by heart**, most of which I forgot immediately after the exams. Our mini-company project, by contrast, taught me teamwork, planning and problem-solving, skills I still rely on daily in my internship. [C] So schools should shift the balance away from **rote learning** toward skills, while keeping enough core knowledge to think with." }
      ]
    },
    { id: "s086", badge: "official", title: "Education Experiences", src: "Official TOEFL · 086",
      scenario: "You have signed up for a study run by a university research group that is investigating education experiences. You will have a short video interview with one of the researchers. The researcher will ask you some questions.",
      questions: [
        { q: "First, which do you think is more important for a college, offering a wide variety of courses, or having small class sizes?",
          lx: ["lecture", "attention", "classmate"],
          model: "[A] I think small class sizes are more important. [R] In a small class, the teacher knows every student, gives personal feedback and can see when someone is struggling. Students also participate more. A wide variety of courses is nice, but if every class has two hundred people, you don't really learn well. [E] For example, my first-year statistics lecture had three hundred students, and I was too shy to ask questions, so I almost failed. In my marketing seminar this year, there are only fifteen of us, and the professor knows my name and comments on my ideas. I learn much more there. [C] So for me, quality of teaching is more important than choice.",
          model5: "[A] Small class sizes, in my view. [R] In a small group, the instructor knows each student, can offer personal feedback and notices when someone is falling behind, and students naturally participate more. A broad course catalogue is appealing, but it means little if every class is a crowded lecture hall. [E] My first-year statistics lecture, for instance, had three hundred students, and I was too intimidated to ask questions, so I came dangerously close to failing. My marketing seminar this year, by contrast, has just fifteen students, and the professor knows my name and engages with my ideas, so I learn far more. [C] So I'd prioritize the quality of interaction over the quantity of choice." },
        { q: "Imagine that you are preparing for a test. Would you prefer to study by yourself or with a group? What would make you choose one over the other?",
          lx: ["review your notes", "study group", "the penny dropped"],
          model: "[A] It depends on the subject, but usually I prefer to study first alone and then with a small group. [R] Alone, I can focus and go at my own speed. But in a group, we can explain difficult topics to each other and test each other, which helps me remember. [E] For example, before my statistics exam, I studied the theory alone in the library for a week. Then I met two classmates, and we solved problems together. When my friend explained one formula in a simple way, the penny finally dropped. But for memorizing vocabulary, I always study alone. [C] So I use both — alone to learn, together to check.",
          model5: "[A] I usually combine the two: solo study first, followed by a small group session. [R] Studying alone allows me to concentrate and move at my own pace, whereas a group lets us explain tricky concepts to one another and quiz each other, which strengthens my memory. [E] Before my statistics exam, for instance, I worked through the theory alone in the library for a week, then met two classmates to solve practice problems together. When one of them explained a formula I'd been struggling with in plain language, **the penny** finally **dropped**. For pure memorization, however, I always work alone. [C] So I study solo to learn the material and with others to test and deepen it." },
        { q: "Some people believe that online courses offer more flexibility and accessibility compared to those offered in traditional classroom settings and are therefore superior. What are your thoughts on this? Do you agree or disagree? Why?",
          lx: ["flexible", "accessible", "self-discipline"],
          model: "[A] I agree that online courses are more flexible, but I don't think they're superior in general. [R] Online courses are great for people who work, live far away or have children. But many students need a teacher, classmates and a fixed schedule to stay motivated, and some subjects need practice in person. [E] For example, my cousin, who is a nurse with two kids, finished a management course online in the evenings, which would be impossible otherwise. But when I took an online course in graphic design, I stopped after three weeks because nobody checked my progress. [C] So online courses are better for some people, not for everyone.",
          model5: "[A] They're certainly more flexible and accessible, but I wouldn't call them superior across the board. [R] For working adults, parents or people in remote areas, online courses can be transformative. Many learners, however, depend on the structure, accountability and human contact of a classroom, and some subjects simply require hands-on practice. [E] My cousin, for instance, a nurse with two children, completed a management qualification online in the evenings, something that would otherwise have been impossible. When I enrolled in an online graphic design course, by contrast, I quietly gave up after three weeks because nobody was checking my progress. [C] So online learning is superior for some people, but far from all." },
        { q: "Online courses are becoming increasingly popular, and there are now full degree programs offered by universities where every class is available online only. Do you think online learning will someday completely replace in-person learning? Explain your thoughts.",
          lx: ["hybrid learning", "face-to-face", "campus life"],
          model: "[A] No, I don't think online learning will completely replace in-person learning. [R] Online learning will grow, but university is not just about information. It's also about discussion, practical work, friends and networking, which are much better in person. Some subjects, like medicine or chemistry, also need labs. [E] For example, during the pandemic, my cousin's university moved fully online, and she said she learned the material but felt lonely and unmotivated. When classes came back, everyone was happy to be on campus again. I also found my internship through a career event at my university, which wouldn't happen online. [C] So I think the future is hybrid, not fully online.",
          model5: "[A] I doubt it will ever replace in-person learning completely. [R] Online provision will undoubtedly expand, but university is about far more than information transfer; it involves debate, hands-on work, friendships and professional networks, all of which thrive face-to-face, and fields like medicine or chemistry depend on physical labs. [E] When my cousin's university went fully online during the pandemic, for instance, she said she absorbed the content but felt isolated and unmotivated, and everyone was thrilled to return to campus. I also found my internship through an on-campus career fair, an opportunity that simply wouldn't have arisen online. [C] So I'd expect a **hybrid** future rather than a fully virtual one." }
      ]
    },
    { id: "s088", badge: "official", title: "Online Learning", src: "Official TOEFL · 088",
      scenario: "As part of a university project, you have agreed to take part in a short research interview about online learning experiences. A graduate student conducting the research will ask you some questions online.",
      questions: [
        { q: "First, have you or someone you know ever taken an online course? If so, what was the subject?",
          lx: ["take an online course", "pick up a skill", "self-paced"],
          model: "[A] Yes, I've taken a few online courses, and so have many people I know. [R] Online courses are cheap or free and easy to fit into a busy schedule, so they're very popular with students. [E] For example, last year I took an online course in data analysis for marketing, because my university program didn't cover it well. It had short videos and weekly tasks, and I got a certificate that I put on my CV. Also, I've been learning Spanish with an app for a year. My mom even took an online course in photography during the pandemic. [C] So online courses are a normal part of learning for me and my family.",
          model5: "[A] Yes, several, as have many people around me. [R] They're affordable, often free, and easy to fit around a busy schedule, which makes them especially popular with students. [E] Last year, for instance, I completed an online course in data analysis for marketing, a gap in my university program; it combined short videos with weekly tasks, and the certificate now features on my CV. I've also been learning Spanish through an app for about a year, and even my mother took an online photography course during the pandemic. [C] So online courses have become a completely normal part of learning, both for me and for my family." },
        { q: "Can you describe what you think are some of the advantages or disadvantages of an online course over an in-person course?",
          lx: ["flexible", "self-discipline", "face-to-face"],
          model: "[A] The main advantages are flexibility and lower cost, but the disadvantages are less motivation and less contact with people. [R] Online, you can study anytime and anywhere, and you can watch lectures again. But it's easy to procrastinate when nobody is checking, and you can't easily ask questions or meet classmates. [E] For example, in my data analysis course, I could rewatch difficult videos three times, which helped a lot, and I studied on the metro to work. But I had no one to discuss problems with, and I almost gave up in week four. In my in-person seminars, I make friends and learn from discussions. [C] So online is convenient, but in-person is more engaging.",
          model5: "[A] Flexibility and cost are the big advantages, while weaker motivation and limited human contact are the main drawbacks. [R] Online, you can study whenever and wherever you like and replay lectures as often as you need; on the other hand, procrastination is tempting without anyone checking, and it's harder to ask questions or form connections. [E] In my data analysis course, for instance, I could rewatch difficult videos several times and study during my metro commute, which was invaluable. Yet with nobody to discuss problems with, I nearly gave up in week four. My in-person seminars, by contrast, are where I've made friends and learned most through debate. [C] So online learning wins on convenience, while the classroom wins on engagement." },
        { q: "Online courses often let students work at their own pace. How do you feel about learning when there is no set class time?",
          lx: ["study at your own pace", "self-paced", "self-discipline"],
          model: "[A] I like it, but it's difficult for me. [R] Learning at my own pace is flexible — I can study when I have energy and repeat difficult parts. But without a fixed time, it's very easy to **procrastinate**, and you need a lot of **self-discipline**. [E] For example, last year I signed up for an online course in data analysis. In the first two weeks, I watched all the lessons, but then I got busy and stopped. I finished it only when I put a fixed time in my calendar — every Tuesday and Thursday at six. [C] So it works well, but only if you create your own schedule.", model5: "[A] I appreciate the flexibility, but I find it genuinely challenging. [R] Learning at your own pace means you can study when your energy is highest and revisit difficult parts as often as you need. Without a fixed class time, however, it's dangerously easy to **procrastinate**, so it demands considerable **self-discipline**. [E] Last year, for instance, I enrolled in an online data analysis course. I flew through the first two weeks, then got busy and drifted away from it entirely. I only completed it once I'd scheduled two fixed sessions a week in my calendar, essentially creating the structure the course lacked. [C] So self-paced learning works beautifully, but only for those willing to impose their own schedule." },
        { q: "One of the concerns with online learning is online assessment, with some people believing that you cannot trust the results of an online test. What do you think about that issue?",
          lx: ["cheat", "assessment", "credentials"],
          model: "[A] I think this is a real concern, but there are ways to make online tests more reliable. [R] At home, it's easy to look things up, use AI or ask a friend, so some results are not honest. But if tests are designed well, cheating doesn't help much. [E] For example, during the pandemic, many of my classmates had open-book online exams, and almost everyone got high grades, so the results meant very little. Later, my university changed the format: we had to explain our thinking in short video answers or do projects, and it was much harder to cheat. [C] So online tests can be trusted if they test thinking, not memory.",
          model5: "[A] It's a legitimate concern, although it can be largely addressed through better test design. [R] At home, it's easy to look up answers, consult AI or get help from a friend, so traditional memory-based tests lose much of their credibility online. If assessments require reasoning and application, however, cheating offers little advantage. [E] During the pandemic, for instance, my university ran open-book online exams on which nearly everyone scored highly, making the grades almost meaningless. The university later switched to short recorded explanations and applied projects, which proved far harder to game. [C] So online assessment can be trustworthy, provided it measures thinking rather than memorization." }
      ]
    },
    { id: "suni", badge: "platform", title: "University Education & Pressure", src: "Практика платформы",
      scenario: "This interview is about access to higher education and how students experience academic pressure.",
      questions: [
        { q: "What made you decide to attend university in the first place? Was it something you always planned to do, or did it take time to make that decision? And how did your family or personal background influence your choice?",
          lx: ["apply to", "scholarship", "major in"],
          model: "[A] I always planned to go to university, but choosing what to study took time. [R] Both my parents went to university, so it was expected in my family. But I didn't know which subject was right for me until my last year of school. Money was also a concern, so I needed a scholarship. [E] For example, I was choosing between economics and psychology, but our school mini-company project showed me how much I love marketing. So I applied only to universities with strong business programs where I had a real chance of getting a scholarship. Luckily, I got one, and my parents were very proud. [C] So the decision to go was easy, but choosing the path took time.",
          model5: "[A] Going to university was always the plan; choosing what to study took considerably longer. [R] Both my parents are graduates, so university was simply assumed in my family, yet I didn't discover my real interest until my final year of school, and finances meant I needed a **scholarship**. [E] I was torn between economics and psychology, for instance, until our school mini-company project showed me how much I enjoy marketing. I then applied exclusively to universities with strong business programs where I had a realistic chance of funding, and when the scholarship offer arrived, my parents were overjoyed. [C] So the decision to go was easy, but finding the right path required time and some trial and error." },
        { q: "Many students say they feel pressure to succeed, whether it's keeping up with grades, managing student debt, or meeting high expectations from family or society. Have you personally experienced stress related to academic performance or the cost of education? How do you usually deal with those pressures?",
          lx: ["pressure", "cope with stress", "scholarship"],
          model: "[A] Yes, I've felt a lot of stress about grades, and also about money. [R] My parents pay for part of my studies, so I feel I must get good grades, and at the same time, I work at a café to pay for my rent. Sometimes it's too much. [E] For example, last spring, I had exams and extra shifts in the same week, and I couldn't sleep from stress. What helped most was talking honestly to my parents. They told me they cared more about my health than my grades, and I felt much lighter. [C] So for me, talking about the pressure helped the most.", model5: "[A] I have, both about grades and about money. [R] Because my parents cover part of my tuition, I feel a strong obligation to perform well, while also working at a café to pay my rent, and occasionally the combination becomes overwhelming. [E] Last spring, for instance, exams coincided with extra shifts, and I was so **stressed out** that I couldn't sleep. What helped most, surprisingly, was finally **opening up** to my parents about it. They told me they cared far more about my health than my grades, and that single conversation lifted an enormous weight off my shoulders. [C] So, for me, the most effective way to **cope with** pressure has been talking about it rather than hiding it." },
        { q: "In your opinion, what is the main purpose of going to university? Is it primarily to prepare for a job, to grow as a person, to build social networks—or something else? And since you began your studies, has your view of what university is for changed in any way?",
          lx: ["grow as a person", "critical thinking", "network"],
          model: "[A] At first, I thought university was mainly to get a good job, but now I think its main purpose is personal growth. [R] Of course, a degree helps with a career. But university also teaches you to think critically, live independently and meet people from different backgrounds — and these things change who you are. [E] For example, in my first year, I only cared about grades and skipped every event. Then I joined the hiking club, started volunteering and met friends from ten countries. I became more confident and open-minded, and I even found my internship through someone I met at a university event. [C] So my view changed — university is about growing, not just about a diploma.",
          model5: "[A] When I started, I saw it mainly as a route to a good job; now I believe its main purpose is personal growth. [R] A degree obviously supports a career, but university also teaches you to think critically, live independently and engage with people from very different backgrounds, which fundamentally shapes who you become. [E] In my first year, for instance, I focused solely on grades and skipped every social event. Then I joined the hiking club, began volunteering and made friends from a dozen countries, becoming noticeably more confident and open-minded; I even landed my internship through a contact from a campus event. [C] So my view has shifted: university is less about the diploma and more about who you are when you leave." },
        { q: "Some people believe that universities should be more affordable and inclusive so that more people can access the benefits of higher education. Do you agree? What specific steps could be taken to make higher education more accessible for all?",
          lx: ["accessible", "tuition (fees)", "scholarship"],
          model: "[A] I definitely agree that universities should be more **affordable**. [R] Talented students shouldn't miss out on education just because their families can't pay, and society benefits when more people are educated. [E] Governments could offer more need-based **financial aid** and low-interest loans, and universities could cut costs by offering free digital textbooks or online courses. In my country, for example, students with good grades get free tuition, and it has helped thousands of families. [C] So it's possible — it just takes political will and smart spending.", model5: "[A] I wholeheartedly agree that universities should become more **affordable**. [R] Talented students shouldn't be excluded from higher education merely because their families can't pay, and society as a whole benefits when more people are well educated. [E] Governments could expand need-based **financial aid** and offer low-interest loans, whereas universities could reduce costs by providing free digital textbooks or more online courses. In my country, for example, students with strong grades receive free tuition, which has opened doors for thousands of families. [C] Clearly, it's achievable — what's required is political will and smarter spending." }
      ]
    },
    { id: "soe", badge: "platform", title: "Online Education", src: "Практика платформы",
      scenario: "I'm conducting a study on online learning and how it compares to traditional classroom settings. I'd like to ask you a few questions to better understand your experiences and opinions.",
      questions: [
        { q: "To start, have you ever taken an online course or class—either for school, work, or personal interest? If so, what was the course about, and how would you describe your overall experience?",
          lx: ["take an online course", "self-paced", "motivation"],
          model: "[A] Yes, I've taken a few, and my experience was mixed — one was great, and one I didn't finish. [R] The difference was structure. When a course had deadlines and live sessions, I stayed motivated. When it was completely self-paced, I lost interest. [E] For example, my data analysis course had weekly tasks, a live Q&A every Friday and a group chat with other students, so I finished it and even enjoyed it. But a graphic design course I bought had only videos and no deadlines, and I stopped after three weeks. I still feel a bit guilty about it! [C] So my experience was positive when the course had a clear structure.",
          model5: "[A] Yes, a few, with mixed results: one was excellent, and another I never finished. [R] The decisive factor was structure; courses with deadlines and live sessions kept me engaged, whereas entirely **self-paced** ones lost me quickly. [E] My data analysis course, for instance, had weekly assignments, a live Q&A every Friday and an active group chat, so I not only finished it but genuinely enjoyed it. A graphic design course I'd paid for, by contrast, offered nothing but prerecorded videos with no deadlines, and I drifted away after three weeks, which I still feel slightly guilty about. [C] So my online learning has succeeded whenever there was a clear structure to keep me on track." },
        { q: "Some find online learning flexible and convenient, while others miss the face-to-face interaction with instructors and classmates. What would you say are the biggest advantages or disadvantages of online learning for you? And do you think those aspects affect how much you learn?",
          lx: ["flexible", "face-to-face", "interaction"],
          model: "[A] For me, the biggest advantage is flexibility, and the biggest disadvantage is the lack of real discussion, and yes, it affects how much I learn. [R] Because I work part-time, flexible online lessons help me fit everything in. But I learn best by talking and asking questions, and online that feels less natural. [E] For example, I can watch a recorded lecture at night after my shift at the café, which is very helpful. But in online seminars, most students turn off their cameras and nobody speaks, so the discussion is boring. In class, our debates help me understand and remember much more. [C] So online helps me manage my time, but in-person helps me learn deeply.",
          model5: "[A] Flexibility is the biggest advantage for me, the lack of genuine discussion the biggest drawback, and both definitely affect how much I learn. [R] Since I work part-time, being able to study at any hour is invaluable, yet I learn best through conversation and questioning, which feels far less natural on a screen. [E] I can watch a recorded lecture late at night after a shift at the café, for instance, which makes my schedule manageable. In online seminars, however, most students switch off their cameras and stay silent, so discussions fall flat, whereas in-person debates help me understand and retain ideas far better. [C] So online learning helps me manage my time, while the classroom helps me learn in depth." },
        { q: "Online classes often involve long periods in front of a screen, and many people mention challenges like shorter attention spans, lack of motivation, or digital fatigue. In your view, can online education truly be as effective as learning in a traditional classroom? Do certain types of learners benefit more than others?",
          lx: ["attention span", "self-discipline", "digital fatigue"],
          model: "[A] I think online education can be as effective, but only for certain types of learners. [R] People who are very organized, motivated and independent can learn well online. But people who need structure, or who learn by talking and doing, often struggle with screen fatigue and distractions. [E] For example, my roommate is very disciplined and introverted, and he did better online during the pandemic because he could study quietly at his own pace. I'm the opposite — after three hours of video calls, I couldn't focus, and I kept checking my phone. [C] So it depends on the person: online works great for some, but not for all.",
          model5: "[A] It can be equally effective, but mainly for particular kinds of learners. [R] Highly organized, self-motivated and independent students often thrive online, whereas those who need external structure or learn through discussion and hands-on activity tend to struggle with screen fatigue and distraction. [E] My roommate, for instance, who is disciplined and fairly introverted, actually performed better online during the pandemic, relishing the chance to work quietly at his own pace. I was the opposite: after three hours of video calls, my concentration collapsed, and I kept reaching for my phone. [C] So online education's effectiveness depends less on the technology than on the learner." },
        { q: "Many schools and universities have shifted toward hybrid models that combine in-person and online instruction. Do you think this trend will continue in the long term, or will we return to mostly in-person learning? What factors will influence that decision?",
          lx: ["hybrid learning", "cost", "student preferences"],
          model: "[A] I think hybrid learning will continue, because it combines the best parts of both. [R] Students like the flexibility of recorded lectures, and universities save money on big lecture halls. But seminars, labs and group work will stay in person, because they need interaction. The main factors will be cost, technology and what students want. [E] For example, at my university, big lectures are now recorded and online, but seminars and exams are on campus. Most of my classmates prefer this, especially those who work or live far away. Some professors complain that fewer students come to campus, though. [C] So hybrid is here to stay, but the balance will keep changing.",
          model5: "[A] I'm fairly confident hybrid learning is here to stay, as it combines the strengths of both formats. [R] Students value the flexibility of recorded lectures, and institutions save on large lecture spaces, while seminars, labs and group work will remain in person because they depend on interaction. Cost, technology and student demand will largely determine the exact balance. [E] At my university, for instance, large lectures are now recorded and available online, whereas seminars and exams take place on campus. Most classmates, especially those who work or commute long distances, strongly prefer this arrangement, although some professors lament that campus feels emptier. [C] So hybrid models will persist, with the balance continually adjusted." }
      ]
    },
    { id: "sal", badge: "platform", title: "Academic Life", src: "Практика платформы",
      scenario: "I'm doing a study on how academic life affects people beyond just grades and schoolwork.",
      questions: [
        { q: "To start, how would you describe your current academic routine—are you balancing it alongside work, family, or other responsibilities? And do you find it easy or challenging to maintain that balance?",
          lx: ["juggle", "meet a deadline", "work-life balance"],
          model: "[A] My routine is busy — I balance my studies with a part-time job and volunteering, and it's sometimes challenging. [R] I need the job to pay for living costs, and I don't want to give up volunteering or sport, because they keep me happy. So planning is very important. [E] For example, I have lectures every morning, work at the café three afternoons a week and volunteer at the animal shelter on Saturdays. I plan my week every Sunday evening and use a calendar app. It works most of the time, but during exam periods, I usually ask for fewer shifts, because otherwise I sleep too little. [C] So it's challenging, but good planning makes it possible.",
          model5: "[A] It's a full schedule — studies, a part-time job and volunteering — and keeping it balanced is a constant challenge. [R] I need the job to cover living costs, but I'm unwilling to give up volunteering or exercise, since they keep me grounded, so careful planning is essential. [E] I attend lectures every morning, for instance, work at the café three afternoons a week and volunteer at the animal shelter on Saturdays. Every Sunday evening, I map out the week in a calendar app, and it mostly works, although during exam periods I ask for fewer shifts, as otherwise my sleep suffers badly. [C] So the balance is demanding, but with disciplined planning, it's manageable." },
        { q: "Many students say academic life impacts more than just their study time—it affects sleep, stress levels, even social life. From your own experience, how has school or studying influenced your day-to-day habits or overall lifestyle?",
          lx: ["stress", "sleep", "social life"],
          model: "[A] Studying has changed my habits a lot — especially my sleep and stress levels. [R] During the semester, I have many deadlines, so I often study late and sleep less. Also, I have less time for friends and sport during exam periods. [E] For example, in my first year, I slept only five or six hours during exams, drank too much coffee and stopped running for a month. I felt terrible. Now I plan my studying earlier, so I can keep my sleep and my runs even in busy weeks. [C] So university affected my lifestyle, but I'm learning to control it.", model5: "[A] Academic life has shaped my daily habits considerably, particularly my sleep and stress levels. [R] With deadlines piling up during the semester, it's tempting to study late into the night, and exam periods inevitably squeeze out time for friends and exercise. [E] In my first year, for instance, I survived exam season on five or six hours' sleep and far too much coffee, and I stopped running altogether for a month. Unsurprisingly, I felt exhausted and anxious. Since then, I've started revising much earlier, which allows me to protect both my sleep and my runs, even during the busiest weeks. [C] So university initially took over my lifestyle, but I've gradually learned to take it back." },
        { q: "With online learning, digital tools, and constant access to information, studying today looks very different than it used to. Do you find these modern resources make learning more convenient, or do they ever feel like a distraction? How do you personally stay focused or motivated?",
          lx: ["distraction", "stay focused", "motivation"],
          model: "[A] Modern resources make learning much more convenient, but they can also be a big **distraction**. [R] I can find any information in seconds and watch lectures again, which is great. But when I study on my laptop, social media and messages are just one click away. [E] For example, when I watch an online lecture, I sometimes open another tab \"for a second\" and then lose twenty minutes. To **stay focused**, I use a website blocker during study time and study with a friend in the library. [C] So technology helps, but only with some rules.", model5: "[A] They make learning far more convenient, though they can just as easily become a **distraction**. [R] Being able to find almost any explanation instantly or rewatch a lecture is invaluable; the trouble is that social media and messages are always just one click away from the material. [E] During online lectures, for example, I'd sometimes open another tab \"for a second\" and resurface twenty minutes later. To **stay focused**, I now use a website blocker during study sessions and, whenever possible, study alongside a friend in the library, which adds a little accountability. [C] So digital tools are a huge advantage, provided we set boundaries around how we use them." },
        { q: "Academic pressure is something most people experience at some point—whether it's from deadlines, expectations, or competition. In your view, how do you manage that kind of pressure in a healthy way? And do you think schools or institutions do enough to support students' mental and emotional well-being?",
          lx: ["pressure", "well-being", "cope with stress"],
          model: "[A] I manage pressure with planning and regular breaks, but I don't think schools do enough. [R] When I plan my deadlines early, I feel more in control. Sport and time with friends also help me relax. But many students don't know how to cope, and universities often just give more work. [E] For example, during exam week I still go running three times and meet friends once. At my university, there is a free psychologist, but the waiting list is about a month long, so it doesn't really help. [C] So students can do a lot themselves, but schools should offer more support.", model5: "[A] I manage it through careful planning and protected downtime, though I don't believe institutions do nearly enough. [R] Planning deadlines early gives me a sense of control, while exercise and time with friends prevent stress from building up. Many students, however, have never been taught these strategies, and universities tend to respond to pressure simply by adding more work. [E] Even during exam week, for instance, I still run three times and see friends at least once. My university does offer free counseling, but the waiting list is almost a month long, which makes it virtually useless in a crisis. [C] So students can do a lot for themselves, but schools need to invest far more in support." }
      ]
    },
    { id: "sre", badge: "platform", title: "The Role of Education", src: "Практика платформы",
      scenario: "I'm conducting a study about how people view the role of education in their lives. I'll ask you a few questions.",
      questions: [
        { q: "To start, could you describe one educational experience—positive or negative—that had a lasting impact on you?",
          lx: ["leave a lasting impression", "believe in", "make a difference"],
          model: "[A] A very positive experience was when my math teacher gave me free extra lessons in high school. [R] I was failing math, and I started to believe that I was just bad at it. She showed me that I could do it if I learned in a different way, and that changed my confidence in general. [E] For example, twice a week after school, she explained topics using real examples, like calculating discounts or football statistics. After three months, my grades went from failing to good, and I passed my final exam. Now I work with data in marketing every day! [C] So that teacher taught me that effort and the right method matter more than talent.",
          model5: "[A] The experience that shaped me most was a math teacher who gave me free extra lessons in high school. [R] I was failing and had begun to believe I simply wasn't a \"math person,\" but she proved that the problem was the method, not my ability, which transformed my confidence far beyond mathematics. [E] Twice a week after school, for instance, she explained concepts through real-life examples, such as calculating discounts or analyzing football statistics. Within three months, I'd gone from failing to solid grades and went on to pass my final exam; ironically, I now work with data every day in marketing. [C] So she taught me that effort and the right approach matter far more than innate talent." },
        { q: "Education can mean different things to different people—some see it mainly as a path to a good job, while others see it as a way to explore new ideas or grow personally. What does education mean to you, and how has that meaning evolved over time?",
          lx: ["grow as a person", "broaden your horizons", "critical thinking"],
          model: "[A] For me, education used to mean grades and a good job, but now it means learning how to think and understand the world. [R] At school, I studied mainly to get good marks and make my parents happy. At university, I realized that the most valuable things I learn are skills and ways of thinking, not facts for exams. [E] For example, in a sociology elective, we discussed why people buy things they don't need, and it completely changed how I see advertising — and my own shopping habits. I don't remember my grade in that class, but I use those ideas every day. [C] So education has become something much bigger than a path to a job for me.",
          model5: "[A] Education once meant grades and job prospects to me; today it means learning how to think and how to understand the world. [R] At school, I studied primarily to earn top marks and please my parents, but university made me realize that the most valuable things I'm gaining are skills and perspectives rather than facts for an exam. [E] A sociology elective, for instance, explored why people buy things they don't need, and it permanently changed how I view advertising, and indeed my own shopping habits. I've long forgotten my grade in that course, yet I draw on its ideas almost daily. [C] So, for me, education has grown from a career tool into a way of seeing." },
        { q: "In many places, there's an increasing emphasis on test scores and academic rankings. Do you think this focus helps or harms students' overall learning experience? Why?",
          lx: ["standardized test", "rote learning", "pressure"],
          model: "[A] I think the focus on test scores mostly harms students' learning. [R] When everything depends on one exam, teachers teach to the test, and students memorize instead of understanding. It also creates a lot of stress and makes students compare themselves with others. Some tests are useful, but they shouldn't be everything. [E] For example, in my last year of school, we stopped doing projects and discussions and just practiced exam questions for months. I got a good score, but I forgot most of it within weeks. My friend was so stressed that she got sick before the exam. [C] So tests should be one part of education, not the main goal.",
          model5: "[A] On balance, I think it does more harm than good. [R] When everything hinges on a single exam, teachers inevitably teach to the test, students memorize rather than understand, and the constant comparison breeds anxiety. Tests do have value as one measure among many, but they shouldn't define the entire experience. [E] In my final year of school, for instance, projects and discussions disappeared entirely in favor of months of drilling past exam papers. I achieved a good score, yet forgot most of the material within weeks, while a close friend became so stressed that she fell ill just before the exam. [C] So test scores should inform education, not dominate it." },
        { q: "Looking ahead, what changes would you like to see in the education system—whether in schools, universities, or other learning environments? Why do you think those changes are important?",
          lx: ["curriculum", "practical skills", "well-rounded"],
          model: "[A] I'd like schools and universities to teach more practical skills and to support students' mental health better. [R] Many young people finish school without knowing how to manage money, cook, deal with stress or work in a team. These skills are important for a happy and successful adult life. [E] For example, I didn't know how to make a budget or cook when I started university, and in my first semester I lived on instant noodles and borrowed money from my parents. Also, at my university, the waiting list for a counselor is almost a month long, which is too long for students in crisis. [C] So I'd like education to prepare us for life, not just for exams.",
          model5: "[A] I'd prioritize two changes: far more practical life skills and much stronger mental health support. [R] Too many young people leave school unable to budget, cook, manage stress or collaborate effectively, yet these abilities are fundamental to a successful and fulfilling adult life. [E] When I started university, for instance, I couldn't budget or cook, so my first semester was a diet of instant noodles and emergency loans from my parents. Meanwhile, at my university, the waiting list to see a counselor is nearly a month, which is far too long for a student in crisis. [C] So I'd like education to prepare us for life itself, not merely for the next exam." }
      ]
    },
    { id: "sul", badge: "platform", title: "University Life", src: "Практика платформы",
      scenario: "We're exploring what university life is like for students today, and I'd like to ask you a few questions about your personal experience.",
      questions: [
        { q: "To begin, what subject are you currently studying, and how would you describe a typical day in your life as a student—from classes and studying to how you spend your free time?",
          lx: ["major in", "attend lectures", "extracurricular"],
          model: "[A] I'm in my third year of a business degree, and I'm majoring in marketing. My days are busy but varied. [R] I try to balance classes, work, sport and friends, so I plan my day carefully. [E] For example, on a typical day, I get up at seven and go for a run in the park next to my dorm. From nine to one, I have lectures and seminars. After lunch in the cafeteria with friends, I either study in the library or work a shift at the café. In the evening, I cook with my roommates, play guitar for half an hour and read before bed. [C] So it's a full day, but I enjoy the mix.",
          model5: "[A] I'm in the third year of a business degree, majoring in marketing, and my days are full but varied. [R] I try hard to balance studies, work, exercise and friends, so I plan each day fairly carefully. [E] A typical day, for instance, starts at seven with a run in the park beside my dorm, followed by lectures and seminars from nine until one. After lunch with friends in the cafeteria, I either study in the library or work a shift at the café. Evenings usually involve cooking with my roommates, half an hour on the guitar and some reading before bed. [C] So it's a packed schedule, but I genuinely enjoy the variety." },
        { q: "What do you find most rewarding or enjoyable about being a university student? And on the other hand, what challenges have you faced—whether academic, financial, social, or something else?",
          lx: ["independent", "a steep learning curve", "financial pressure"],
          model: "[A] The most rewarding thing is the freedom to learn and grow, and the biggest challenges have been money and homesickness. [R] At university, I can choose interesting courses, meet people from all over the world and live independently. But I also have to pay for everything myself, and at first I felt lonely far from my family. [E] For example, I loved my first marketing project with a real company — it felt like real work. But in my first semester, I was very homesick and had headaches every day, and by November I had to borrow money from my parents. Joining the hiking club and making a budget helped a lot. [C] So it's challenging, but it's the best time of my life.",
          model5: "[A] The freedom to learn and grow is the most rewarding part, while money and homesickness have been my biggest challenges. [R] University lets me choose fascinating courses, meet people from every corner of the world and live independently; on the other hand, I'm responsible for every expense, and leaving home was initially very hard. [E] My first marketing project with a real company, for instance, was exhilarating, as it felt like genuine professional work. In my first semester, however, I was so homesick that I had daily headaches, and by November I'd had to borrow money from my parents. Joining the hiking club and finally creating a budget turned things around. [C] So it's been **a steep learning curve**, but also the best time of my life." },
        { q: "Many students choose to get involved in activities outside the classroom, such as clubs, volunteer work, student government, or sports. How important is social life to your overall university experience, and are there any extracurriculars you regularly participate in?",
          lx: ["extracurricular", "make friends with", "balance"],
          model: "[A] Social life is very important to my university experience, and I take part in a hiking club. [R] Studying all the time is stressful, and friends and activities help me relax and feel at home in a new city. [E] For example, I joined the hiking club in my first semester, and now I go on trips once a month. That's where I met my two best friends. I also sometimes go to the film club on Thursdays. Without these activities, I think university would feel lonely and boring. [C] So extracurriculars are as important as classes for me.", model5: "[A] It's absolutely central, and I'm an active member of the university hiking club. [R] Without a social life, university would feel like an endless cycle of lectures and deadlines; friendships and activities provide balance and, especially for students who've moved away from home, a sense of belonging. [E] I **joined** the hiking **club** in my very first semester, for instance, and its monthly trips have become highlights of my year; it's also where I met my two closest friends. Occasionally, I drop in on the film club's Thursday screenings too. Looking back, I'm convinced these activities shaped my university experience as much as any course. [C] So extracurriculars aren't a distraction from education; they're part of it." },
        { q: "While university is a time of learning, it's also a time when many students start thinking seriously about their future. Do you feel that your university experience—whether in academics, internships, or personal growth—is preparing you well for what comes after graduation? Why or why not?",
          lx: ["internship", "put knowledge into practice", "employability"],
          model: "[A] Partly yes, but I think university could do more. [R] My classes give me good theory, and I learned to manage my time and work in teams. But there are not many practical tasks, and many students graduate without real work experience. [E] For example, I found my internship by myself, through a friend, not through the university. Without that internship, I wouldn't know how a real office works. [C] So university is preparing me, but internships and part-time jobs are just as important.", model5: "[A] To some extent, yes, though I think it could do considerably more. [R] My courses have given me a solid theoretical foundation, and group projects have taught me to manage my time and collaborate. Practical experience, however, is largely left to students to find for themselves, so many graduate without ever having worked in a real organization. [E] I found my own internship, for example, through a friend rather than through the university's career services, and that internship taught me more about how a workplace functions than any lecture. [C] So university is a good starting point, but it's internships and part-time jobs that are really bridging the gap for me." }
      ]
    },
    { id: "sll", badge: "platform", title: "Lifelong Learning", src: "Практика платформы",
      scenario: "We're exploring the idea of learning new skills throughout life and how people view education beyond school or university.",
      questions: [
        { q: "Have you ever enrolled in a class, workshop, or course that wasn't part of your formal schooling or job training? If so, what motivated you to join, and what was the focus of that learning experience?",
          lx: ["workshop", "pick up a skill", "confidence"],
          model: "[A] Yes, last year I took a weekend workshop on public speaking. [R] I was always nervous when I had to present in class, and I knew that in marketing I would need to present ideas to clients. So I wanted to become more confident. [E] For example, the workshop had about twelve people of all ages — students, a doctor, even a retired teacher. Every person gave short speeches, and we got feedback and watched videos of ourselves. It was scary at first, but very useful. Two months later, I gave a presentation at my internship, and my manager said I sounded very confident. [C] So it was a small course, but it made a big difference.",
          model5: "[A] Yes; last year I signed up for a weekend workshop on public speaking. [R] Presenting in class had always made me anxious, and I knew that a marketing career would involve pitching ideas to clients, so I wanted to tackle the fear directly. [E] The group of about twelve, for instance, ranged from students to a doctor and even a retired teacher. Each of us gave short speeches, received detailed feedback and watched recordings of ourselves, which was mortifying at first but remarkably effective. Two months later, I delivered a presentation at my internship, and my manager complimented me on my confidence. [C] So it was a short course, yet it had a disproportionately large impact." },
        { q: "Lifelong learning is often associated with personal growth, career advancement, or simply the joy of exploring something new. In your opinion, why do you think some people are motivated to keep learning even after finishing their formal education? What do they hope to gain?",
          lx: ["lifelong learning", "upskill", "personal growth"],
          model: "[A] I think people keep learning for two reasons: their career and their personal growth. [R] The job market changes very fast, so if you don't learn new skills, you can lose your job. Also, many people simply enjoy learning new things. [E] For example, my mom is forty-five, and last year she took an online course in data analysis because her company started using new programs. She got a promotion after that. She also takes guitar lessons, just for fun. [C] So learning helps both your career and your happiness.", model5: "[A] I'd say people keep learning for two main reasons: **career advancement** and personal growth. [R] The job market is evolving so rapidly that those who stop learning risk falling behind, while for many others, learning is simply a source of joy and confidence. [E] My mother, for example, took an online course in data analysis at forty-five after her company introduced new software, and within a year she'd been promoted. At the same time, she started guitar lessons purely for pleasure, and she says they keep her mind sharp. [C] So lifelong learning, I believe, benefits both your career and your quality of life, and the two often reinforce each other." },
        { q: "These days, there are so many online resources—platforms like YouTube, Coursera, or language-learning apps—that make it easier than ever to learn at your own pace. Have you ever used the internet or any mobile apps to pick up a new skill or subject? What did you learn, and how would you describe the experience?",
          lx: ["pick up a skill", "study at your own pace", "consistency"],
          model: "[A] Yes, I've learned two important skills online — playing the guitar and Spanish. [R] Online learning is free or cheap, and I can practice whenever I have time, which is perfect for a busy student. But it needs discipline, because nobody checks you. [E] For example, I learned most of my guitar songs from free video tutorials — I can pause, slow down and repeat difficult parts. For Spanish, I've used an app for fifteen minutes every day for a year, and now I can have simple conversations. But apps alone are not enough, so I also talk to a Spanish exchange student once a week. [C] So online resources are great, especially combined with real practice.",
          model5: "[A] Yes, two skills in particular: the guitar and Spanish. [R] Online resources are free or inexpensive and fit easily around a busy student schedule, although they demand self-discipline, since nobody holds you accountable. [E] I learned most of my guitar repertoire, for instance, from free video tutorials that let me pause, slow down and repeat tricky passages. For Spanish, I've used an app for fifteen minutes daily for about a year and can now manage basic conversations, though I've realized apps alone aren't enough, so I also meet a Spanish exchange student weekly to practice speaking. [C] So online tools are a brilliant starting point, particularly when combined with real-world practice." },
        { q: "As life expectancy increases and career paths evolve, many experts suggest that learning should become a lifelong habit, not something limited to our early years. Do you agree that people should be encouraged to keep learning at all stages of life? Why or why not?",
          lx: ["lifelong learning", "you're never too old to learn", "keep up with"],
          model: "[A] Yes, I strongly agree that people should keep learning all their lives. [R] Jobs and technology change very fast, so people need new skills to stay employed. Learning also keeps the brain healthy and makes life more interesting, especially for older people. [E] For example, my father learned data analysis at fifty because his company started using new software, and he got a promotion. And my grandmother joined a free computer class at the library at seventy-five, and now she video calls me every week. She's so proud of it! [C] So learning at every age helps both careers and happiness — you're never too old to learn.",
          model5: "[A] I agree wholeheartedly. [R] Jobs and technology are evolving so quickly that continual learning is essential to remain employable, and beyond work, learning keeps the mind sharp and life engaging, particularly in later years. [E] My father, for instance, retrained in data analysis at fifty when his company introduced new software, and he was promoted soon afterwards. My grandmother, meanwhile, joined a free computer class at the library at seventy-five and now video calls me every week, which she's enormously proud of. [C] So lifelong learning benefits both careers and well-being, which is why I firmly believe **you're never too old to learn**." }
      ]
    },
    { id: "sle", badge: "platform", title: "Learning Experiences", src: "Практика платформы",
      scenario: "I'm conducting a study about people's educational experiences and views on learning. I'd like to ask you a few questions.",
      questions: [
        { q: "First, could you tell me a bit about your most recent or current educational experience? Are you in school now, or have you completed any formal studies?",
          lx: ["degree", "major in", "graduate"],
          model: "[A] Yes, I'm currently at university — I'm in the third year of a bachelor's degree in business, majoring in marketing. [R] I chose this program because I'm interested in how people make decisions and how brands communicate, and it combines creative and analytical work. [E] For example, this semester I'm taking courses in consumer behavior, digital marketing and statistics. We also have a group project with a local company, where we're creating a social media campaign for a new café. Besides that, I'm doing a part-time marketing internship. I'll graduate next year, and I'm thinking about a master's degree. [C] So I'm in the middle of my studies, and I'm enjoying them.",
          model5: "[A] I'm currently in the third year of a bachelor's degree in business, majoring in marketing. [R] I chose it because I'm fascinated by how people make decisions and how brands communicate, and the program blends creative and analytical work in a way that suits me. [E] This semester, for instance, I'm taking consumer behavior, digital marketing and statistics, alongside a group project in which we're designing a social media campaign for a local café. I'm also doing a part-time internship at a marketing agency. I'm due to graduate next year and am seriously considering a master's. [C] So I'm right in the thick of my studies, and I'm genuinely enjoying them." },
        { q: "Some people enjoy learning and thrive in the classroom, while others find school stressful or difficult to connect with. What has your overall experience with education been like, and what factors do you think shaped it?",
          lx: ["supportive", "thrive", "pressure"],
          model: "[A] Overall, my experience with education has been positive, mainly because of good teachers and supportive parents. [R] When teachers believed in me and made lessons interesting, I enjoyed learning. When they only cared about grades or criticized students, I lost interest. My parents always supported me without too much pressure. [E] For example, my math teacher gave me free lessons when I was failing, and math became one of my best subjects. But my art teacher once showed my drawing to the class as an example of mistakes, and I stopped trying in art. At university, I can choose my courses, so I'm more motivated than ever. [C] So teachers and freedom of choice shaped my experience the most.",
          model5: "[A] Largely positive, thanks mainly to inspiring teachers and supportive parents. [R] Whenever teachers believed in me and made lessons engaging, I thrived, whereas teachers who focused solely on grades or humiliated students quickly killed my interest. My parents, meanwhile, were consistently supportive without piling on pressure. [E] When I was failing math, for instance, one teacher offered me free lessons, and it became one of my strongest subjects. By contrast, an art teacher once held up my drawing as an example of mistakes, and I simply gave up on art. At university, the freedom to choose my courses has made me more motivated than ever. [C] So teachers and autonomy have shaped my education more than anything else." },
        { q: "Let's talk about motivation. Some people are very driven by academic success or career goals, while others focus more on learning for personal growth. What has motivated you most in your education so far—and has that motivation changed over time?",
          lx: ["motivation", "career goals", "personal growth"],
          model: "[A] At school I was motivated mostly by grades, but now I'm motivated more by my future career and curiosity. [R] In school, my parents praised good grades, so I studied to get A's. At university, I understand that I'm learning skills I'll actually use. [E] For example, in high school I memorized everything for tests and forgot it a week later. Now, in my marketing classes, I try to understand how real companies work, because I want to work in this field. I even read articles that aren't required. [C] So my motivation has changed from external to internal.", model5: "[A] In school, I was driven mainly by grades, whereas now my motivation comes from my career plans and genuine curiosity. [R] Back then, good grades brought praise from my parents, so I studied primarily to earn top marks. At university, however, I've realized I'm acquiring skills I'll actually rely on in my future career. [E] In high school, for instance, I'd memorize material for tests and forget it within a week. Now, in my marketing courses, I'm keen to understand how real companies operate, to the point where I regularly read articles nobody has assigned. [C] So my motivation has shifted from external rewards to something far more internal, and, in my experience, far more durable." },
        { q: "In recent years, there's been more debate about how schools should adapt to meet different learning styles, incorporate technology, or emphasize life skills. Do you think the current education system prepares people well for real life? Why or why not?",
          lx: ["practical skills", "curriculum", "well-rounded"],
          model: "[A] I think the education system prepares people well academically, but not very well for real life. [R] Schools teach a lot of theory and facts, but many students don't learn practical things like managing money, communicating at work or dealing with stress. Also, schools usually teach everyone in the same way, although people learn differently. [E] For example, I could solve difficult equations at eighteen, but I didn't know how to rent an apartment, pay taxes or write a CV. My friend is dyslexic, and she struggled for years because her school didn't adapt lessons for her, but at university, with audiobooks and extra time, she became a top student. [C] So schools need to be more practical and flexible.",
          model5: "[A] Academically, it does a reasonable job; for real life, considerably less so. [R] Schools tend to prioritize theory and facts while neglecting practical competencies such as managing money, workplace communication or handling stress, and they generally teach everyone in the same way despite very different learning needs. [E] At eighteen, for instance, I could solve complex equations, yet I had no idea how to rent an apartment, pay taxes or write a CV. A friend of mine with dyslexia struggled for years because her school never adapted its teaching, but at university, with audiobooks and extra time, she became one of the top students. [C] So the system needs to become both more practical and more flexible." }
      ]
    },
    { id: "she", badge: "platform", title: "Higher Education Choices", src: "Практика платформы",
      scenario: "I'm conducting a study about how people make decisions when it comes to higher education—whether to pursue it, where to go, and what to study.",
      questions: [
        { q: "First, are you currently attending college or university, or have you already completed a degree or some form of post-secondary education? And what led you to that decision?",
          lx: ["attend", "degree", "career goals"],
          model: "[A] Yes, I'm currently attending university — I'm in my third year of a business degree. [R] I decided to go to university because I wanted a career in marketing, and in my country, most companies expect a degree. I also wanted the experience of living independently in a big city. [E] For example, when I was in high school, I did a short summer job at a small advertising agency, and everyone there had a degree in business or communications. They told me that university gave them both knowledge and contacts. Also, my older sister left university, and she told me she regretted it. [C] So both career plans and personal experience led me to university.",
          model5: "[A] Yes, I'm currently in my third year of a business degree. [R] I chose university mainly because I wanted a career in marketing, and in my country, most employers expect a degree; I was also eager to experience independent life in a big city. [E] During a summer job at a small advertising agency in high school, for instance, I noticed that every employee held a business or communications degree, and they all said university had given them both knowledge and valuable contacts. My older sister, who left university early, also told me she regretted that decision. [C] So a combination of career ambitions and family experience led me to higher education." },
        { q: "When people decide to pursue higher education, they often weigh multiple factors like tuition costs, program reputation, career goals, or even proximity to home. What influenced your choice the most—and why was that factor particularly important to you?",
          lx: ["tuition (fees)", "scholarship", "reputation"],
          model: "[A] Honestly, **tuition** was one of the biggest factors for me, together with the program. [R] I didn't want to finish my degree with huge debt, so I only applied to universities where I had a real chance of getting a **scholarship**. [E] I actually got into a more famous university, but it would have cost almost twice as much. In the end I chose a cheaper one with a very strong program in my field, and I've never regretted it. [C] So for me, a good program at a fair price was **worth more** than a famous name.", model5: "[A] Honestly, **tuition** was one of the decisive factors for me, alongside the quality of the program. [R] I was determined not to graduate with crippling debt, so I only applied to universities where I had a realistic chance of getting a **scholarship**. [E] In fact, I was accepted by a more prestigious university, but it would have cost almost twice as much. In the end, I chose a more affordable one with an excellent program in my field, and I've never once regretted it. [C] For me, a strong program at a reasonable price was **worth far more** than a famous name." },
        { q: "Some believe that higher education is still essential for long-term success, while others argue that practical experience, entrepreneurship, or technical skills can be just as valuable—or even more so. What's your perspective? Do you believe formal education still plays a critical role in achieving career goals?",
          lx: ["the school of hard knocks", "credentials", "practical experience"],
          model: "[A] I think both are important, but the answer depends on the job. [R] For jobs like doctor or engineer, a degree is necessary. But in many fields, like IT or design, employers care more about your skills and experience. [E] For example, my cousin never finished university, but he learned programming online and built a strong portfolio. Now he works at a good tech company. My sister, on the other hand, is a doctor, and of course she needed many years of university. [C] So a degree is essential in some careers, but not in all of them.", model5: "[A] I'd say it depends heavily on the field. [R] In professions such as medicine or engineering, a degree is obviously non-negotiable. In many others, however — IT, design or marketing, for instance — employers increasingly care about what you can actually do rather than which diploma you hold. [E] My cousin, for example, dropped out of university, taught himself to code online and built an impressive portfolio, which landed him a job at a respected tech company. My sister, by contrast, could never have become a doctor without seven years of medical school. [C] So a degree remains essential for certain careers, but it's no longer the only route to long-term success." },
        { q: "In recent years, online learning, certificate programs, and alternative credentials have become increasingly popular and accessible. Given these new options, do you think traditional universities will still be necessary in the future—or might they become less relevant? How do you see higher education evolving in the next 10 or 20 years?",
          lx: ["credentials", "hybrid learning", "adapt"],
