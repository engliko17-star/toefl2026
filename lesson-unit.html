<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Юнит — TOEFL</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  body.dyslexia-mode { font-family: 'Lexend', sans-serif; background: #FBF8F1; letter-spacing: .02em; }
  body.dyslexia-mode p, body.dyslexia-mode li { line-height: 1.95; }
  body.dyslexia-mode em, body.dyslexia-mode i.italic { font-style: normal; }
  body.dyslexia-mode .text-xs { font-size: .875rem; }
  .step-row { transition: border-color .15s, background-color .15s; }
  .step-row:hover { border-color: #a5b4fc; }
  .tier-btn.active { border-color: #4f46e5; background: #eef2ff; color: #3730a3; font-weight: 600; }
  .step-body { border-top: 1px solid #e2e8f0; }
</style>
</head>
<body class="bg-slate-50 text-slate-900">

<header class="bg-white border-b border-slate-200 sticky top-0 z-20">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3 min-w-0">
      <a href="lessons.html" class="text-slate-400 hover:text-slate-700 shrink-0" aria-label="К списку уроков">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <h1 id="unitTitle" class="text-lg font-semibold truncate">Юнит</h1>
    </div>
    <button id="dyslexiaToggle" class="flex items-center gap-2 text-sm text-slate-600 border border-slate-200 rounded-lg px-3 py-1.5 hover:bg-slate-50">
      <i data-lucide="type" class="w-4 h-4"></i><span class="hidden sm:inline">Режим чтения</span>
    </button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 sm:px-6 py-8">
  <div id="state" class="text-slate-500 py-16 text-center">Загрузка…</div>
  <div id="unitBody" class="hidden">

    <div class="bg-white border border-slate-200 rounded-xl p-5 sm:p-6 mb-6">
      <div class="flex items-start justify-between gap-6 mb-5">
        <div class="min-w-0">
          <p id="unitCategory" class="text-xs text-slate-400 mb-1"></p>
          <h2 id="unitName" class="text-xl font-semibold"></h2>
          <p id="unitMeta" class="text-sm text-slate-500 mt-1"></p>
        </div>
        <div class="text-right shrink-0">
          <p class="text-xs text-slate-400 mb-0.5">Прогресс</p>
          <p id="unitProgress" class="text-2xl font-semibold">0/0</p>
        </div>
      </div>

      <div class="border-t border-slate-200 pt-4">
        <p class="text-sm text-slate-600 mb-2">
          Уровень поддержки <span id="tierSource" class="text-slate-400"></span>
        </p>
        <div class="grid grid-cols-3 gap-2">
          <button data-tier="1" class="tier-btn border border-slate-200 rounded-lg py-2 px-2 text-sm text-slate-600 hover:border-slate-400">С опорами</button>
          <button data-tier="2" class="tier-btn border border-slate-200 rounded-lg py-2 px-2 text-sm text-slate-600 hover:border-slate-400">Частично</button>
          <button data-tier="3" class="tier-btn border border-slate-200 rounded-lg py-2 px-2 text-sm text-slate-600 hover:border-slate-400">Без опор</button>
        </div>
      </div>
    </div>

    <div id="steps" class="space-y-2"></div>
  </div>
</main>

<script>
const SUPABASE_URL = window.SUPABASE_URL || 'ВСТАВЬ_URL';
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'ВСТАВЬ_КЛЮЧ';
const db = window.supabaseClient || supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
window.supabaseClient = db;

const CATEGORY_LABELS = { campus: 'Кампус', daily_life: 'Быт', services: 'Услуги', academic: 'Учёба' };
const SKILL_STYLES = {
  vocabulary: 'bg-sky-50 text-sky-700', speaking: 'bg-rose-50 text-rose-700',
  listening: 'bg-teal-50 text-teal-700', writing: 'bg-indigo-50 text-indigo-700',
  assessment: 'bg-amber-50 text-amber-700'
};
const SKILL_LABELS = {
  vocabulary: 'Лексика', speaking: 'Speaking', listening: 'Listening',
  writing: 'Writing', assessment: 'Замер'
};

let unit = null, steps = [], doneSteps = new Set(), currentTier = 2, tierIsAuto = true, openStepId = null;

function safeCreateIcons() {
  try { if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons(); }
  catch (e) { console.warn('lucide:', e); }
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) { console.warn('tts:', e); }
}

function initDyslexia() {
  const btn = document.getElementById('dyslexiaToggle');
  let on = false;
  try { on = localStorage.getItem('dyslexia-mode') === '1'; } catch (e) {}
  if (on) document.body.classList.add('dyslexia-mode');
  btn.addEventListener('click', () => {
    const now = document.body.classList.toggle('dyslexia-mode');
    try { localStorage.setItem('dyslexia-mode', now ? '1' : '0'); } catch (e) {}
  });
}

// ─── уровень поддержки ───────────────────────────────────────
function bandToTier(band) {
  if (band == null) return 2;
  if (band <= 2.5) return 1;
  if (band <= 4.0) return 2;
  return 3;
}

async function latestBand(userId) {
  const tables = ['big_mock_attempts', 'big_mock_listening_attempts', 'big_mock_writing_attempts', 'big_mock_speaking_attempts'];
  const results = await Promise.all(tables.map(t =>
    db.from(t).select('total_score, created_at')
      .eq('user_id', userId).not('total_score', 'is', null)
      .order('created_at', { ascending: false }).limit(1)
      .then(r => (r.data && r.data[0] ? r.data[0].total_score : null))
      .catch(() => null)
  ));
  const nums = results.filter(v => typeof v === 'number');
  if (!nums.length) return null;
  return nums.reduce((a, b) => a + b, 0) / nums.length;
}

async function resolveTier(userId) {
  const { data: settings } = await db.from('lesson_user_settings')
    .select('tier, auto').eq('user_id', userId).maybeSingle();

  if (settings && settings.auto === false) {
    currentTier = settings.tier; tierIsAuto = false;
    document.getElementById('tierSource').textContent = '· выбран вручную';
    return;
  }
  const band = await latestBand(userId);
  currentTier = bandToTier(band);
  tierIsAuto = true;
  document.getElementById('tierSource').textContent = band == null
    ? '· пока нет результатов моков, поставили середину'
    : `· определён по последним мокам (${band.toFixed(1)})`;
}

async function setTier(tier) {
  currentTier = tier; tierIsAuto = false;
  document.getElementById('tierSource').textContent = '· выбран вручную';
  renderTierButtons();
  renderSteps();
  try {
    await db.from('lesson_user_settings')
      .upsert({ user_id: window.currentUser.id, tier, auto: false, updated_at: new Date().toISOString() },
              { onConflict: 'user_id' });
  } catch (e) { console.warn('tier save:', e); }
}

function renderTierButtons() {
  document.querySelectorAll('.tier-btn').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.tier) === currentTier);
  });
}

// ─── тело шага ───────────────────────────────────────────────
function block(title, inner) {
  return `<div class="mb-5"><p class="text-xs font-semibold text-slate-500 mb-2">${title}</p>${inner}</div>`;
}
function trapsBlock(traps) {
  if (!traps || !traps.length) return '';
  return block('Где обычно ломается', `<ul class="space-y-1.5">${traps.map(t =>
    `<li class="text-sm text-slate-700 flex gap-2"><i data-lucide="alert-triangle" class="w-4 h-4 text-amber-500 shrink-0 mt-0.5"></i><span>${esc(t)}</span></li>`).join('')}</ul>`);
}

function renderStepContent(step) {
  const c = step.content || {};
  const shared = c.shared || {};
  const tier = c['tier' + currentTier] || {};
  let html = '';

  if (shared.intro) html += `<p class="text-slate-700 mb-5">${esc(shared.intro)}</p>`;
  if (shared.prompt) html += `<div class="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-5 text-slate-800">${esc(shared.prompt)}</div>`;

  if (step.step_type === 'vocabulary' && shared.words) {
    html += block('Слова', `<div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-1">${shared.words.map(w => `
      <div class="flex items-center gap-2 py-1.5 border-b border-slate-100">
        <button class="tts text-slate-300 hover:text-indigo-600 shrink-0" data-say="${esc(w.en)}" aria-label="Прослушать">
          <i data-lucide="volume-2" class="w-4 h-4"></i>
        </button>
        <span class="text-sm font-medium">${esc(w.en)}</span>
        <span class="text-sm text-slate-500 ml-auto text-right">${esc(w.ru)}</span>
      </div>`).join('')}</div>`);
  }

  if (step.step_type === 'phrases' && shared.patterns) {
    html += block('Конструкции', `<div class="space-y-3">${shared.patterns.map(p => `
      <div class="border border-slate-200 rounded-lg p-3">
        <p class="text-sm font-semibold text-indigo-700">${esc(p.form)}</p>
        <p class="text-sm text-slate-800 mt-1">${esc(p.example)}</p>
        <p class="text-xs text-slate-500 mt-1">${esc(p.note)}</p>
      </div>`).join('')}</div>`);
  }

  if (step.step_type === 'speaking' && shared.people) {
    html += block('Кто перед тобой', `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${shared.people.map(p => `
      <div class="border border-slate-200 rounded-lg p-3">
        <p class="text-xs text-slate-400">${esc(p.name)}</p>
        <p class="text-sm text-slate-800">${esc(p.line)}</p>
      </div>`).join('')}</div>`);
  }

  if (step.step_type === 'listen_repeat' && shared.items) {
    const limit = currentTier === 1 ? 4 : currentTier === 2 ? 6 : shared.items.length;
    html += block('Реплики', `<ol class="space-y-1.5 list-decimal list-inside">${shared.items.slice(0, limit).map(s =>
      `<li class="text-sm text-slate-800">${esc(s)}
        <button class="tts text-slate-300 hover:text-indigo-600 align-middle ml-1" data-say="${esc(s)}" aria-label="Прослушать">
          <i data-lucide="volume-2" class="w-3.5 h-3.5"></i></button></li>`).join('')}</ol>`);
    if (shared.common_errors) {
      html += block('Так говорят ученики / так правильно', `<div class="space-y-2">${shared.common_errors.map(e => `
        <div class="text-sm">
          <p class="text-rose-600 line-through">${esc(e.wrong)}</p>
          <p class="text-emerald-700">${esc(e.right)}</p>
        </div>`).join('')}</div>`);
    }
  }

  if (step.step_type === 'email' && shared.useful_chunks) {
    html += block('Готовые куски', `<ul class="space-y-1">${shared.useful_chunks.map(s =>
      `<li class="text-sm text-slate-800 font-mono">${esc(s)}</li>`).join('')}</ul>`);
  }

  if (step.step_type === 'assessment' && shared.parts) {
    html += block('Из чего состоит', `<ul class="space-y-1">${shared.parts.map(s =>
      `<li class="text-sm text-slate-700 flex gap-2"><i data-lucide="dot" class="w-4 h-4 shrink-0"></i>${esc(s)}</li>`).join('')}</ul>`);
  }

  html += trapsBlock(shared.traps);

  // ── то, что меняется по тиру ──
  let tierInner = '';
  if (tier.task) tierInner += `<p class="text-sm text-slate-800">${esc(tier.task)}</p>`;
  if (tier.frames) tierInner += `<ul class="mt-2 space-y-1">${tier.frames.map(f =>
    `<li class="text-sm font-mono text-slate-700">${esc(f)}</li>`).join('')}</ul>`;
  if (tier.outline) tierInner += `<ol class="mt-2 space-y-1 list-decimal list-inside">${tier.outline.map(o =>
    `<li class="text-sm text-slate-700">${esc(o)}</li>`).join('')}</ol>`;
  if (tierInner) {
    html += `<div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4 mb-5">
      <p class="text-xs font-semibold text-indigo-700 mb-2">Твоё задание</p>${tierInner}</div>`;
  }

  const isDone = doneSteps.has(step.id);
  html += `<div class="flex flex-wrap items-center gap-2 pt-1">
    ${step.launch_url ? `<a href="${esc(step.launch_url)}" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg px-4 py-2">
      <i data-lucide="play" class="w-4 h-4"></i> Открыть в тренажёре</a>` : ''}
    <button class="toggle-done inline-flex items-center gap-2 text-sm rounded-lg px-4 py-2 border ${isDone
      ? 'border-emerald-200 bg-emerald-50 text-emerald-700'
      : 'border-slate-200 text-slate-600 hover:bg-slate-50'}" data-step="${step.id}">
      <i data-lucide="${isDone ? 'check-circle-2' : 'circle'}" class="w-4 h-4"></i>
      ${isDone ? 'Выполнено' : 'Отметить выполненным'}
    </button>
  </div>`;

  return html;
}

function renderSteps() {
  const wrap = document.getElementById('steps');
  wrap.innerHTML = steps.map((s, i) => {
    const done = doneSteps.has(s.id);
    const open = openStepId === s.id;
    const marker = done
      ? `<div class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0"><i data-lucide="check" class="w-4 h-4"></i></div>`
      : `<div class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center shrink-0 text-sm">${i + 1}</div>`;
    const tier = (s.content && s.content['tier' + currentTier]) || {};

    return `<div class="bg-white border ${open ? 'border-indigo-300' : 'border-slate-200'} rounded-xl overflow-hidden">
      <button class="step-row w-full flex items-center gap-3 p-4 text-left" data-step="${s.id}">
        ${marker}
        <div class="flex-1 min-w-0">
          <p class="font-medium text-slate-900">${esc(s.title)}</p>
          <p class="text-xs text-slate-500 mt-0.5 truncate">${esc(tier.task || '')}</p>
        </div>
        <span class="text-xs px-2 py-0.5 rounded shrink-0 ${SKILL_STYLES[s.skill] || 'bg-slate-100 text-slate-600'}">${SKILL_LABELS[s.skill] || s.skill}</span>
        <span class="text-xs text-slate-400 shrink-0 hidden sm:inline">${s.est_minutes} мин</span>
        <i data-lucide="chevron-${open ? 'up' : 'down'}" class="w-4 h-4 text-slate-400 shrink-0"></i>
      </button>
      ${open ? `<div class="step-body p-4 sm:p-5">${renderStepContent(s)}</div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('unitProgress').textContent = `${doneSteps.size}/${steps.length}`;

  wrap.querySelectorAll('.step-row').forEach(b => b.addEventListener('click', () => {
    openStepId = openStepId === b.dataset.step ? null : b.dataset.step;
    renderSteps();
  }));
  wrap.querySelectorAll('.toggle-done').forEach(b => b.addEventListener('click', () => toggleDone(b.dataset.step)));
  wrap.querySelectorAll('.tts').forEach(b => b.addEventListener('click', () => speak(b.dataset.say)));
  safeCreateIcons();
}

async function toggleDone(stepId) {
  const wasDone = doneSteps.has(stepId);
  if (wasDone) doneSteps.delete(stepId); else doneSteps.add(stepId);
  renderSteps();
  try {
    if (wasDone) {
      await db.from('lesson_progress').delete()
        .eq('user_id', window.currentUser.id).eq('step_id', stepId);
    } else {
      await db.from('lesson_progress').upsert({
        user_id: window.currentUser.id, unit_id: unit.id, step_id: stepId,
        tier: currentTier, status: 'completed', completed_at: new Date().toISOString()
      }, { onConflict: 'user_id,step_id' });
    }
  } catch (e) {
    console.error('progress:', e);
    if (wasDone) doneSteps.add(stepId); else doneSteps.delete(stepId);
    renderSteps();
  }
}

async function load() {
  const state = document.getElementById('state');
  try {
    const { data: authData } = await db.auth.getUser();
    const user = authData && authData.user;
    if (!user) { window.location.href = 'login.html'; return; }
    window.currentUser = user;

    const slug = new URLSearchParams(location.search).get('unit');
    if (!slug) { state.textContent = 'Юнит не указан.'; return; }

    const { data: u, error: uErr } = await db.from('lesson_units')
      .select('*').eq('slug', slug).maybeSingle();
    if (uErr) throw uErr;
    if (!u) { state.textContent = 'Такого юнита нет.'; return; }
    unit = u;

    const [{ data: st, error: sErr }, { data: pr }] = await Promise.all([
      db.from('lesson_steps').select('*').eq('unit_id', u.id).order('order_num'),
      db.from('lesson_progress').select('step_id').eq('user_id', user.id).eq('unit_id', u.id)
    ]);
    if (sErr) throw sErr;
    steps = st || [];
    doneSteps = new Set((pr || []).map(p => p.step_id));

    await resolveTier(user.id);

    document.getElementById('unitTitle').textContent = u.title_en;
    document.getElementById('unitName').textContent = u.title_en;
    document.getElementById('unitCategory').textContent =
      `${CATEGORY_LABELS[u.category] || u.category || ''}${u.title_ru ? ' · ' + u.title_ru : ''}`;
    const mins = steps.reduce((a, s) => a + (s.est_minutes || 0), 0);
    document.getElementById('unitMeta').textContent = `${steps.length} шагов · около ${mins} мин`;

    state.classList.add('hidden');
    document.getElementById('unitBody').classList.remove('hidden');
    renderTierButtons();
    renderSteps();
  } catch (e) {
    console.error(e);
    state.innerHTML = `<p class="text-red-600">Не удалось загрузить юнит.</p>
                       <p class="text-sm text-slate-500 mt-1">${esc(e.message || e)}</p>`;
  }
}

document.querySelectorAll('.tier-btn').forEach(b =>
  b.addEventListener('click', () => setTier(Number(b.dataset.tier))));

initDyslexia();
safeCreateIcons();
load();
</script>
</body>
</html>t
