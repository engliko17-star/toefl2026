<script>
// auth.js создаёт клиент как `const _supabase`. Объявленные через const
// переменные не попадают в window, поэтому берём голое имя, а не window._supabase.
function getDb() {
    try {
        if (typeof _supabase !== 'undefined' && _supabase && typeof _supabase.from === 'function') {
            return _supabase;
        }
    } catch (e) {}
    const named = [window.supabaseClient, window.supabaseInstance, window.supabaseDB, window.sb, window.db];
    for (const c of named) if (c && typeof c.from === 'function') return c;
    return null;
}

const CATEGORY_LABELS = { campus: 'Кампус', daily_life: 'Быт', services: 'Услуги', academic: 'Учёба' };
const SKILL_STYLES = {
    vocabulary: 'bg-sky-50 text-sky-700', speaking: 'bg-rose-50 text-rose-700',
    listening: 'bg-teal-50 text-teal-700', writing: 'bg-indigo-50 text-indigo-700',
    assessment: 'bg-amber-50 text-amber-700'
};
const SKILL_LABELS = {
    vocabulary: 'Лексика', speaking: 'Speaking', listening: 'Listening',
    writing: 'Writing', assessment: 'Замер'
};

let db = null, unit = null, steps = [], doneSteps = new Set();
let currentTier = 2, openStepId = null;

function safeCreateIcons() {
    try { if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons(); }
    catch (e) { console.warn('lucide:', e); }
}
function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function speak(text) {
    try {
        if (!window.speechSynthesis) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = 0.9;
        speechSynthesis.speak(u);
    } catch (e) { console.warn('tts:', e); }
}

function initDyslexia() {
    let on = false;
    try { on = localStorage.getItem('dyslexia-mode') === '1'; } catch (e) {}
    if (on) document.body.classList.add('dyslexia-mode');
}

function bandToTier(band) {
    if (band == null) return 2;
    if (band <= 2.5) return 1;
    if (band <= 4.0) return 2;
    return 3;
}

async function latestBand(userId) {
    const tables = ['big_mock_attempts', 'big_mock_listening_attempts',
                    'big_mock_writing_attempts', 'big_mock_speaking_attempts'];
    const results = await Promise.all(tables.map(t =>
        db.from(t).select('total_score, created_at')
          .eq('user_id', userId).not('total_score', 'is', null)
          .order('created_at', { ascending: false }).limit(1)
          .then(r => (r.data && r.data[0] ? r.data[0].total_score : null))
          .catch(() => null)
    ));
    const nums = results.filter(v => typeof v === 'number');
    if (!nums.length) return null;
    return nums.reduce((a, b) => a + b, 0) / nums.length;
}

async function resolveTier(userId) {
    let settings = null;
    try {
        const r = await db.from('lesson_user_settings')
            .select('tier, auto').eq('user_id', userId).maybeSingle();
        settings = r.data;
    } catch (e) { console.warn('settings:', e); }

    if (settings && settings.auto === false) {
        currentTier = settings.tier;
        document.getElementById('tierSource').textContent = '· выбран вручную';
        return;
    }
    const band = await latestBand(userId);
    currentTier = bandToTier(band);
    document.getElementById('tierSource').textContent = band == null
        ? '· пока нет результатов моков, поставили середину'
        : '· определён по последним мокам (' + band.toFixed(1) + ')';
}

async function setTier(tier) {
    currentTier = tier;
    document.getElementById('tierSource').textContent = '· выбран вручную';
    renderTierButtons();
    renderSteps();
    try {
        await db.from('lesson_user_settings').upsert({
            user_id: window.currentUser.id, tier: tier, auto: false,
            updated_at: new Date().toISOString()
        }, { onConflict: 'user_id' });
    } catch (e) { console.warn('tier save:', e); }
}

function renderTierButtons() {
    document.querySelectorAll('.tier-btn').forEach(b => {
        b.classList.toggle('active', Number(b.dataset.tier) === currentTier);
    });
}

function block(title, inner) {
    return '<div class="mb-5"><p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">'
         + title + '</p>' + inner + '</div>';
}

function renderStepContent(step) {
    const c = step.content || {};
    const shared = c.shared || {};
    const tier = c['tier' + currentTier] || {};
    let html = '';

    if (shared.intro) html += `<p class="text-sm text-gray-600 mb-5">${esc(shared.intro)}</p>`;
    if (shared.prompt) html += `<div class="bg-gray-50 border border-gray-100 rounded-xl p-4 mb-5 text-sm text-slate-800">${esc(shared.prompt)}</div>`;

    if (step.step_type === 'vocabulary' && shared.words) {
        html += block('Слова', `<div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6">${shared.words.map(w => `
            <div class="flex items-center gap-2 py-2 border-b border-gray-50">
                <button class="tts text-gray-300 hover:text-indigo-600 transition shrink-0" data-say="${esc(w.en)}" aria-label="Прослушать">
                    <i data-lucide="volume-2" class="w-4 h-4"></i>
                </button>
                <span class="text-sm font-semibold text-slate-800">${esc(w.en)}</span>
                <span class="text-sm text-gray-400 ml-auto text-right">${esc(w.ru)}</span>
            </div>`).join('')}</div>`);
    }

    if (step.step_type === 'phrases' && shared.patterns) {
        html += block('Конструкции', `<div class="space-y-2">${shared.patterns.map(p => `
            <div class="border border-gray-100 rounded-xl p-3">
                <p class="text-sm font-bold text-indigo-700">${esc(p.form)}</p>
                <p class="text-sm text-slate-800 mt-1">${esc(p.example)}</p>
                <p class="text-xs text-gray-400 mt-1">${esc(p.note)}</p>
            </div>`).join('')}</div>`);
    }

    if (step.step_type === 'speaking' && shared.people) {
        html += block('Кто перед тобой', `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${shared.people.map(p => `
            <div class="border border-gray-100 rounded-xl p-3">
                <p class="text-[11px] font-bold text-gray-400">${esc(p.name)}</p>
                <p class="text-sm text-slate-800">${esc(p.line)}</p>
            </div>`).join('')}</div>`);
    }

    if (step.step_type === 'listen_repeat' && shared.items) {
        const limit = currentTier === 1 ? 4 : currentTier === 2 ? 6 : shared.items.length;
        html += block('Реплики', `<ol class="space-y-2 list-decimal list-inside">${shared.items.slice(0, limit).map(s => `
            <li class="text-sm text-slate-800">${esc(s)}
                <button class="tts text-gray-300 hover:text-indigo-600 transition align-middle ml-1" data-say="${esc(s)}" aria-label="Прослушать">
                    <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                </button>
            </li>`).join('')}</ol>`);
        if (shared.common_errors) {
            html += block('Так говорят / так правильно', `<div class="space-y-2">${shared.common_errors.map(e => `
                <div class="text-sm">
                    <p class="text-rose-500 line-through">${esc(e.wrong)}</p>
                    <p class="text-emerald-700 font-medium">${esc(e.right)}</p>
                </div>`).join('')}</div>`);
        }
    }

    if (step.step_type === 'email' && shared.useful_chunks) {
        html += block('Готовые куски', `<ul class="space-y-1.5">${shared.useful_chunks.map(s =>
            `<li class="text-sm text-slate-700 bg-gray-50 rounded-lg px-3 py-1.5">${esc(s)}</li>`).join('')}</ul>`);
    }

    if (step.step_type === 'assessment' && shared.parts) {
        html += block('Из чего состоит', `<ul class="space-y-1.5">${shared.parts.map(s =>
            `<li class="text-sm text-gray-600 flex gap-2"><span class="text-gray-300">•</span>${esc(s)}</li>`).join('')}</ul>`);
    }

    if (shared.traps && shared.traps.length) {
        html += block('Где обычно ломается', `<ul class="space-y-2">${shared.traps.map(t => `
            <li class="text-sm text-slate-700 flex gap-2">
                <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-500 shrink-0 mt-0.5"></i><span>${esc(t)}</span>
            </li>`).join('')}</ul>`);
    }

    let tierInner = '';
    if (tier.task) tierInner += `<p class="text-sm text-slate-800">${esc(tier.task)}</p>`;
    if (tier.frames) tierInner += `<ul class="mt-2 space-y-1">${tier.frames.map(f =>
        `<li class="text-sm text-indigo-900/80">${esc(f)}</li>`).join('')}</ul>`;
    if (tier.outline) tierInner += `<ol class="mt-2 space-y-1 list-decimal list-inside">${tier.outline.map(o =>
        `<li class="text-sm text-indigo-900/80">${esc(o)}</li>`).join('')}</ol>`;
    if (tierInner) {
        html += `<div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mb-5">
            <p class="text-[11px] font-bold text-indigo-700 uppercase tracking-wider mb-2">Твоё задание</p>${tierInner}</div>`;
    }

    const isDone = doneSteps.has(step.id);
    html += `<div class="flex flex-wrap items-center gap-2">
        ${step.launch_url ? `<a href="${esc(step.launch_url)}" class="inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-700 text-white text-xs font-bold rounded-xl px-4 py-2.5 transition">
            <i data-lucide="play" class="w-4 h-4"></i> Открыть в тренажёре</a>` : ''}
        <button class="toggle-done inline-flex items-center gap-2 text-xs font-bold rounded-xl px-4 py-2.5 border transition ${isDone
            ? 'border-emerald-200 bg-emerald-50 text-emerald-700'
            : 'border-gray-200 text-gray-500 hover:bg-gray-50'}" data-step="${esc(step.id)}">
            <i data-lucide="${isDone ? 'check-circle-2' : 'circle'}" class="w-4 h-4"></i>
            ${isDone ? 'Выполнено' : 'Отметить выполненным'}
        </button>
    </div>`;

    return html;
}

function renderSteps() {
    const wrap = document.getElementById('steps');
    wrap.innerHTML = steps.map((s, i) => {
        const done = doneSteps.has(s.id);
        const open = openStepId === s.id;
        const tier = (s.content && s.content['tier' + currentTier]) || {};
        const marker = done
            ? '<div class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0"><i data-lucide="check" class="w-4 h-4"></i></div>'
            : '<div class="w-8 h-8 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center shrink-0 text-xs font-bold">' + (i + 1) + '</div>';

        return `<div class="bg-white rounded-2xl border ${open ? 'border-indigo-200' : 'border-gray-100'} shadow-xs overflow-hidden">
            <button class="step-row w-full flex items-center gap-3 p-4 text-left" data-step="${esc(s.id)}">
                ${marker}
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-slate-900">${esc(s.title)}</p>
                    <p class="text-xs text-gray-400 mt-0.5 truncate">${esc(tier.task || '')}</p>
                </div>
                <span class="text-[11px] font-medium px-2 py-0.5 rounded-lg shrink-0 ${SKILL_STYLES[s.skill] || 'bg-gray-50 text-gray-500'}">${esc(SKILL_LABELS[s.skill] || s.skill)}</span>
                <span class="text-[11px] text-gray-300 shrink-0 hidden sm:inline">${s.est_minutes} мин</span>
                <i data-lucide="chevron-${open ? 'up' : 'down'}" class="w-4 h-4 text-gray-300 shrink-0"></i>
            </button>
            ${open ? '<div class="border-t border-gray-100 p-4 sm:p-5">' + renderStepContent(s) + '</div>' : ''}
        </div>`;
    }).join('');

    document.getElementById('unitProgress').textContent = doneSteps.size + '/' + steps.length;

    wrap.querySelectorAll('.step-row').forEach(b => b.addEventListener('click', () => {
        openStepId = openStepId === b.dataset.step ? null : b.dataset.step;
        renderSteps();
    }));
    wrap.querySelectorAll('.toggle-done').forEach(b =>
        b.addEventListener('click', () => toggleDone(b.dataset.step)));
    wrap.querySelectorAll('.tts').forEach(b =>
        b.addEventListener('click', () => speak(b.dataset.say)));
    safeCreateIcons();
}

async function toggleDone(stepId) {
    const wasDone = doneSteps.has(stepId);
    if (wasDone) doneSteps.delete(stepId); else doneSteps.add(stepId);
    renderSteps();
    try {
        if (wasDone) {
            const { error } = await db.from('lesson_progress').delete()
                .eq('user_id', window.currentUser.id).eq('step_id', stepId);
            if (error) throw error;
        } else {
            const { error } = await db.from('lesson_progress').upsert({
                user_id: window.currentUser.id, unit_id: unit.id, step_id: stepId,
                tier: currentTier, status: 'completed', completed_at: new Date().toISOString()
            }, { onConflict: 'user_id,step_id' });
            if (error) throw error;
        }
    } catch (e) {
        console.error('progress:', e);
        if (wasDone) doneSteps.add(stepId); else doneSteps.delete(stepId);
        renderSteps();
        alert('Прогресс не сохранился: ' + (e.message || e));
    }
}

async function load() {
    const state = document.getElementById('state');
    try {
        const user = await requireAuth();
        if (!user) return;
        window.currentUser = user;

        if (user.role === 'teacher') {
            ['teacherLinkDesktop', 'teacherLinkMobile'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.classList.remove('hidden'); el.classList.add('flex'); }
            });
            safeCreateIcons();
        }

        db = getDb();
        if (!db) throw new Error('Не найден клиент Supabase. Посмотри, как он называется в auth.js, и добавь это имя в getDb().');

        const slug = new URLSearchParams(location.search).get('unit');
        if (!slug) { state.textContent = 'Юнит не указан в адресе страницы.'; return; }

        const { data: u, error: uErr } = await db.from('lesson_units')
            .select('*').eq('slug', slug).maybeSingle();
        if (uErr) throw uErr;
        if (!u) { state.textContent = 'Такого юнита нет.'; return; }
        unit = u;

        const [stepRes, progRes] = await Promise.all([
            db.from('lesson_steps').select('*').eq('unit_id', u.id).order('order_num'),
            db.from('lesson_progress').select('step_id').eq('user_id', user.id).eq('unit_id', u.id)
        ]);
        if (stepRes.error) throw stepRes.error;
        steps = stepRes.data || [];
        doneSteps = new Set((progRes.data || []).map(p => p.step_id));

        await resolveTier(user.id);

        document.title = u.title_en + ' — TOEFL Prep';
        document.getElementById('unitName').textContent = u.title_en;
        document.getElementById('unitCategory').textContent =
            (CATEGORY_LABELS[u.category] || u.category || '') + (u.title_ru ? ' · ' + u.title_ru : '');
        const mins = steps.reduce((a, s) => a + (s.est_minutes || 0), 0);
        document.getElementById('unitMeta').textContent = steps.length + ' шагов · около ' + mins + ' мин';

        state.classList.add('hidden');
        document.getElementById('unitBody').classList.remove('hidden');
        renderTierButtons();
        renderSteps();
    } catch (e) {
        console.error(e);
        state.innerHTML = `<p class="text-rose-600 font-medium">Не удалось загрузить юнит.</p>
                           <p class="text-xs text-gray-400 mt-1">${esc(e.message || e)}</p>`;
    }
}

document.querySelectorAll('.tier-btn').forEach(b =>
    b.addEventListener('click', () => setTier(Number(b.dataset.tier))));

safeCreateIcons();
initDyslexia();
window.addEventListener('load', load);
</script>
</body>
