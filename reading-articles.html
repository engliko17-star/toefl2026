<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL Reading - Master Classes & Strategies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased flex">

    <aside class="w-64 bg-white border-r border-slate-200 h-screen p-5 flex flex-col justify-between shrink-0 fixed left-0 top-0">
        <div class="space-y-6">
            <div class="flex items-center space-x-2 px-2">
                <span class="text-xl font-black text-indigo-600 tracking-tight">TOEFL<span class="text-slate-400 font-normal">.pro</span></span>
            </div>
            
            <nav class="space-y-1">
                <a href="dashboard.html" class="flex items-center space-x-3 px-3 py-2.5 text-xs font-bold text-slate-500 hover:text-slate-900 hover:bg-slate-50 rounded-xl transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> <span>Dashboard</span>
                </a>
                <a href="vocabulary.html" class="flex items-center space-x-3 px-3 py-2.5 text-xs font-bold text-slate-500 hover:text-slate-900 hover:bg-slate-50 rounded-xl transition">
                    <i data-lucide="book-open" class="w-4 h-4"></i> <span>Vocabulary</span>
                </a>
                <a href="reading.html" class="flex items-center space-x-3 px-3 py-2.5 text-xs font-bold bg-indigo-50 text-indigo-600 rounded-xl transition">
                    <i data-lucide="book-open-check" class="w-4 h-4"></i> <span>Reading</span>
                </a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 pl-64 min-h-screen flex flex-col">
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center space-x-3">
                <a href="reading.html" class="text-slate-400 hover:text-slate-700 transition flex items-center text-xs font-bold">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> Reading Home
                </a>
                <span class="text-slate-300">/</span>
                <h1 class="text-base font-bold text-slate-800">Learn & Strategies</h1>
            </div>
        </header>

        <div class="p-8 max-w-5xl w-full mx-auto space-y-8 flex-1">
            <div class="bg-gradient-to-r from-indigo-900 to-slate-950 rounded-2xl p-8 text-white relative overflow-hidden shadow-xs">
                <div class="absolute right-0 bottom-0 opacity-10 transform translate-x-10 translate-y-10">
                    <i data-lucide="graduation-cap" class="w-72 h-72"></i>
                </div>
                <span class="px-2.5 py-1 bg-indigo-500/30 text-indigo-200 border border-indigo-400/20 rounded-md text-[10px] font-bold uppercase tracking-wider">Theoretical Prep</span>
                <h2 class="text-xl font-black mt-3 tracking-tight">Master the Reading Section</h2>
                <p class="text-slate-300 font-medium text-xs mt-1 max-w-xl leading-relaxed">Изучи пошаговые алгоритмы разбора каждого типа вопросов в TOEFL Reading и прокачай навыки тайм-менеджмента для высокого балла.</p>
            </div>

            <div class="flex items-center justify-between border-b border-slate-200 pb-1">
                <div class="flex space-x-1" id="filterTabs">
                    <button onclick="filterArticles('all')" data-tab="all" class="px-4 py-2 text-xs font-bold rounded-lg transition border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50/50">
                        All Guides
                    </button>
                    <button onclick="filterArticles('question_type')" data-tab="question_type" class="px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-800 transition rounded-lg">
                        Question Types
                    </button>
                    <button onclick="filterArticles('strategy')" data-tab="strategy" class="px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-800 transition rounded-lg">
                        Core Strategies
                    </button>
                </div>
                <span id="articleCount" class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">0 Articles</span>
            </div>

            <div id="articlesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
        
        let allArticles = [];

        // Встроенные данные на случай, если таблица в базе еще не создана
        const mockArticles = [
            {
                id: 1,
                title: "Time Management for Reading",
                description: "Learn how to manage your time effectively, skim paragraphs, and find answers faster.",
                category: "strategy",
                question_type_tag: "Strategy",
                reading_time: "8 min read",
                icon: "clock"
            },
            {
                id: 2,
                title: "Mastering 'Inference' Questions",
                description: "A complete guide to understanding implied meanings in academic texts without overthinking.",
                category: "question_type",
                question_type_tag: "Inference",
                reading_time: "12 min read",
                icon: "brain"
            },
            {
                id: 3,
                title: "Cracking Factual Information",
                description: "How to avoid scanning traps and find the specific detail required by the question prompt.",
                category: "question_type",
                question_type_tag: "Detail",
                reading_time: "10 min read",
                icon: "file-text"
            },
            {
                id: 4,
                title: "Insert a Sentence Layout Strategy",
                description: "Using transition words and pronouns to perfectly place context sentences into paragraphs.",
                category: "question_type",
                question_type_tag: "Insert Text",
                reading_time: "7 min read",
                icon: "layout"
            },
            {
                id: 5,
                title: "Active Reading & Note Taking",
                description: "How creating a mental map of the text saves minutes and increases comprehension.",
                category: "strategy",
                question_type_tag: "Strategy",
                reading_time: "6 min read",
                icon: "pen-tool"
            }
        ];

        async function fetchArticles() {
            try {
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { data, error } = await supabaseClient
                    .from('reading_articles')
                    .select('*')
                    .order('id', { ascending: true });

                if (error || !data || data.length === 0) {
                    console.log("Using local mock data for articles.");
                    allArticles = mockArticles;
                } else {
                    allArticles = data;
                }
                renderArticles(allArticles);
            } catch (err) {
                allArticles = mockArticles;
                renderArticles(allArticles);
            }
        }

        function renderArticles(list) {
            const grid = document.getElementById('articlesGrid');
            document.getElementById('articleCount').innerText = `${list.length} ${list.length === 1 ? 'Article' : 'Articles'}`;
            
            if(list.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400 text-xs font-medium">
                        No articles found in this category.
                    </div>
                `;
                return;
            }

            grid.innerHTML = list.map(art => {
                // Выбираем сочный пастельный цвет в зависимости от типа категории
                const isStrategy = art.category === 'strategy';
                const accentBg = isStrategy ? 'bg-violet-50 text-violet-600' : 'bg-indigo-50 text-indigo-600';
                const borderHover = isStrategy ? 'hover:border-violet-300' : 'hover:border-indigo-300';

                return `
                    <a href="article-view.html?id=${art.id}" class="group bg-white border border-slate-200/80 rounded-2xl p-5 shadow-2xs transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xs ${borderHover} flex flex-col justify-between h-52">
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <div class="w-9 h-9 ${accentBg} rounded-xl flex items-center justify-center transition-transform group-hover:scale-105">
                                    <i data-lucide="${art.icon || 'file-text'}" class="w-4 h-4"></i>
                                </div>
                                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-slate-100 text-slate-500">${art.question_type_tag}</span>
                            </div>
                            
                            <h3 class="text-sm font-bold text-slate-800 leading-snug group-hover:text-indigo-600 transition mb-1.5">${art.title}</h3>
                            <p class="text-xs text-slate-400 font-normal leading-relaxed line-clamp-2">${art.description}</p>
                        </div>

                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] font-bold text-slate-400">
                            <span class="flex items-center"><i data-lucide="clock" class="w-3.5 h-3.5 mr-1 text-slate-300"></i> ${art.reading_time}</span>
                            <span class="text-indigo-500 group-hover:translate-x-0.5 transition flex items-center text-[10px] uppercase tracking-wider">Read <i data-lucide="chevron-right" class="w-3.5 h-3.5 ml-0.5"></i></span>
                        </div>
                    </a>
                `;
            }).join('');

            lucide.createIcons();
        }

        function filterArticles(category) {
            // Обновление состояния вкладок
            const tabs = document.querySelectorAll('#filterTabs button');
            tabs.forEach(tab => {
                if(tab.getAttribute('onclick').includes(`'${category}'`)) {
                    tab.className = "px-4 py-2 text-xs font-bold rounded-lg transition border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50/50";
                } else {
                    tab.className = "px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-800 transition rounded-lg";
                }
            });

            if(category === 'all') {
                renderArticles(allArticles);
            } else {
                const filtered = allArticles.filter(a => a.category === category);
                renderArticles(filtered);
            }
        }

        window.onload = () => {
            fetchArticles();
        };
    </script>
</body>
</html>
