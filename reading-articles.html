<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL Reading - Master Class</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#fafafa] flex text-slate-800 min-h-screen">

    <div id="app-sidebar"></div>
    <script src="nav.js"></script>

    <main class="flex-1 overflow-y-auto pb-24 md:pb-12">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            <div class="flex items-center text-sm text-gray-400 mb-6 space-x-2">
                <a href="reading.html" class="hover:text-slate-600 flex items-center">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i>
                    Reading Home
                </a>
                <span>/</span>
                <span class="text-slate-800 font-medium">Learn & Strategies</span>
            </div>

            <div class="bg-[#1e1b4b] rounded-[2rem] p-8 md:p-12 text-white relative overflow-hidden mb-10 shadow-lg">
                <div class="relative z-10 md:w-2/3">
                    <span class="inline-block px-3 py-1 bg-indigo-500/20 text-indigo-300 text-xs font-bold rounded-lg tracking-wider mb-4 border border-indigo-500/30">
                        THEORETICAL PREP
                    </span>
                    <h1 class="text-3xl md:text-4xl font-bold mb-4 tracking-tight">Master the Reading Section</h1>
                    <p class="text-indigo-100/80 leading-relaxed text-sm md:text-base max-w-xl">
                        Изучи пошаговые алгоритмы разбора каждого типа вопросов в TOEFL Reading и прокачай навыки тайм-менеджмента для высокого балла.
                    </p>
                </div>
                <i data-lucide="graduation-cap" class="absolute -right-8 -bottom-10 w-64 h-64 text-indigo-900/40 transform -rotate-12 pointer-events-none"></i>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-gray-200 mb-8">
                <div class="flex space-x-6 overflow-x-auto -mx-4 px-4 sm:mx-0 sm:px-0" id="tab-container">
                    <button data-tab="all" class="pb-3 border-b-2 border-indigo-600 text-indigo-600 font-semibold text-sm whitespace-nowrap active-tab">All Guides</button>
                    <button data-tab="overview" class="pb-3 border-b-2 border-transparent text-gray-500 hover:text-slate-800 font-medium text-sm whitespace-nowrap transition">Overview</button>
                    <button data-tab="tasks" class="pb-3 border-b-2 border-transparent text-gray-500 hover:text-slate-800 font-medium text-sm whitespace-nowrap transition">Task Types</button>
                    <button data-tab="questions" class="pb-3 border-b-2 border-transparent text-gray-500 hover:text-slate-800 font-medium text-sm whitespace-nowrap transition">Question Types</button>
                    <button data-tab="skills" class="pb-3 border-b-2 border-transparent text-gray-500 hover:text-slate-800 font-medium text-sm whitespace-nowrap transition">Skills</button>
                </div>
                <div class="text-sm text-gray-400 py-3 sm:py-0 font-medium" id="articles-count">
                    Loading...
                </div>
            </div>

            <!-- Статьи по группам: обзор → задания → типы вопросов → навыки -->
            <div class="space-y-12" id="articles-grid">
                </div>
        </div>
    </main>


    <script>
        // Статьи остаются жестко прописанными в коде.
        // group — раздел на странице: overview (обзор секции), tasks (три задания Reading),
        // questions (типы вопросов), skills (навыки для всех заданий).
        // Ссылки article-….html считает section-articles.js на странице Reading — оставляйте их строкой.
        const GROUPS = [
            { id: 'overview',  title: 'Overview',       note: 'Start here: how the Reading section works.' },
            { id: 'tasks',     title: 'Task Types',     note: 'The three tasks of the Reading section.' },
            { id: 'questions', title: 'Question Types', note: 'Questions you meet in Read in Daily Life and Read an Academic Passage.' },
            { id: 'skills',    title: 'Skills',         note: 'Skills that help in every task.' }
        ];
        // tag у типов вопросов — где встречается (по официальным заданиям ETS):
        // Daily + Academic — в обоих заданиях, Academic only — только в академическом тексте
        const articlesData = [
            {
                group: "overview",
                tag: "Overview",
                title: "General Reading",
                description: "Master the fundamentals of skimming, scanning, and active reading to efficiently tackle passages.",
                readTime: "8 min read",
                icon: "book-open",
                iconBg: "bg-violet-50",
                iconColor: "text-violet-500",
                link: "general-reading.html"
            },
            {
                group: "tasks",
                tag: "Task Type",
                title: "Complete the Words",
                description: "Techniques and context clue strategies to correctly complete words and fill vocabulary gaps.",
                readTime: "6 min read",
                icon: "spell-check",
                iconBg: "bg-teal-50",
                iconColor: "text-teal-500",
                link: "article-complete-words.html"
            },
            {
                group: "tasks",
                tag: "Task Type",
                title: "Read in Daily Life",
                description: "Short everyday texts — emails, notices, chats, schedules — with 2 or 3 questions each: what they test and how to read them fast.",
                readTime: "7 min read",
                icon: "newspaper",
                iconBg: "bg-emerald-50",
                iconColor: "text-emerald-500",
                link: "article-read-in-daily.html"
            },
            {
                group: "tasks",
                tag: "Task Type",
                title: "Read an Academic Passage",
                description: "Understand the structure of complex academic texts to navigate dense passages with confidence.",
                readTime: "11 min read",
                icon: "landmark",
                iconBg: "bg-sky-50",
                iconColor: "text-sky-500",
                link: "article-academic-passage.html"
            },
            {
                group: "questions",
                tag: "Daily + Academic",
                title: "Factual & Negative Factual",
                description: "How to avoid scanning traps and find the specific detail required by the question prompt.",
                readTime: "10 min read",
                icon: "file-search",
                iconBg: "bg-emerald-50",
                iconColor: "text-emerald-500",
                link: "article-factual.html"
            },
            {
                group: "questions",
                tag: "Daily + Academic",
                title: "Vocabulary Questions",
                description: "Learn how to use context clues to determine the meaning of unfamiliar words.",
                readTime: "5 min read",
                icon: "book-open-check",
                iconBg: "bg-rose-50",
                iconColor: "text-rose-500",
                link: "article-vocabulary.html"
            },
            {
                group: "questions",
                tag: "Daily + Academic",
                title: "Inference Questions",
                description: "A complete guide to understanding implied meanings in academic texts without overthinking.",
                readTime: "12 min read",
                icon: "scan-search",
                iconBg: "bg-blue-50",
                iconColor: "text-blue-500",
                link: "article-inference.html"
            },
            {
                group: "questions",
                tag: "Daily + Academic",
                title: "Reference Questions",
                description: "Quickly and accurately identify what pronouns and demonstratives refer to in the text.",
                readTime: "5 min read",
                icon: "link",
                iconBg: "bg-amber-50",
                iconColor: "text-amber-500",
                link: "article-reference.html"
            },
            {
                group: "questions",
                tag: "Daily + Academic",
                title: "Rhetorical Purpose",
                description: "Analyze why the author includes specific words, quotes, or paragraphs in the passage.",
                readTime: "8 min read",
                icon: "message-square-quote",
                iconBg: "bg-indigo-50",
                iconColor: "text-indigo-500",
                link: "article-rhetorical-purpose.html"
            },
            {
                group: "questions",
                tag: "Academic only",
                title: "Sentence Simplification",
                description: "Identify essential information in complex sentences without getting confused by distractors.",
                readTime: "9 min read",
                icon: "scissors",
                iconBg: "bg-fuchsia-50",
                iconColor: "text-fuchsia-500",
                link: "article-sentence-simplification.html"
            },
            {
                group: "questions",
                tag: "Academic only",
                title: "Insert Text Strategy",
                description: "Using transition words and pronouns to perfectly place context sentences into paragraphs.",
                readTime: "7 min read",
                icon: "wrap-text",
                iconBg: "bg-orange-50",
                iconColor: "text-orange-500",
                link: "article-insert-text.html"
            },
            {
                group: "questions",
                tag: "Academic only",
                title: "Select a Sentence",
                description: "Strategies for questions asking you to identify and select specific sentences within the passage.",
                readTime: "6 min read",
                icon: "mouse-pointer-click",
                iconBg: "bg-cyan-50",
                iconColor: "text-cyan-500",
                link: "article-select-sentence.html"
            },
            {
                group: "skills",
                tag: "Strategy",
                title: "Time Management in Reading",
                description: "How the clock works, a time plan for each module, a pace calculator and what to do when you fall behind.",
                readTime: "14 min read",
                icon: "timer",
                iconBg: "bg-amber-50",
                iconColor: "text-amber-600",
                link: "article-time-management.html"
            },
            {
                group: "skills",
                tag: "Word Roots",
                title: "Greek and Latin Roots",
                description: "Decode unfamiliar academic words by recognising their roots, prefixes and suffixes.",
                readTime: "9 min read",
                icon: "sprout",
                iconBg: "bg-lime-50",
                iconColor: "text-lime-600",
                link: "article-greek-latin.html"
            }
        ];

        const grid = document.getElementById('articles-grid');
        const countDisplay = document.getElementById('articles-count');
        const tabs = document.querySelectorAll('#tab-container button');

        const TAG_STYLE = {
            'Daily + Academic': 'text-emerald-700 bg-emerald-50',
            'Academic only': 'text-sky-700 bg-sky-50'
        };
        function cardHtml(article) {
            const tagCls = TAG_STYLE[article.tag] || 'text-gray-400 bg-gray-50';
            return `
                <a href="${article.link}" class="bg-white rounded-3xl p-6 border border-gray-100 flex flex-col h-full hover:shadow-xl hover:shadow-indigo-500/5 transition-all duration-300 group cursor-pointer">
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <div class="w-10 h-10 rounded-xl ${article.iconBg} flex items-center justify-center ${article.iconColor} group-hover:scale-110 transition-transform shrink-0">
                            <i data-lucide="${article.icon}" class="w-5 h-5"></i>
                        </div>
                        <span class="text-[10px] font-bold ${tagCls} uppercase tracking-widest px-2 py-1 rounded-md text-right">${article.tag}</span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 mb-2 leading-tight">${article.title}</h3>
                    <p class="text-sm text-gray-500 mb-6 flex-1 leading-relaxed">${article.description}</p>
                    <div class="flex items-center justify-between mt-auto pt-4 border-t border-gray-50">
                        <div class="flex items-center text-xs font-medium text-gray-400">
                            <i data-lucide="timer" class="w-3.5 h-3.5 mr-1.5"></i>
                            ${article.readTime}
                        </div>
                        <span class="text-xs font-bold text-indigo-600 flex items-center group-hover:text-indigo-700">READ <i data-lucide="chevron-right" class="w-3 h-3 ml-1"></i></span>
                    </div>
                </a>`;
        }

        // Рендер: «All Guides» — все группы друг под другом с заголовками, вкладка — одна группа
        function renderArticles(filter = 'all') {
            const groups = GROUPS.filter(g => filter === 'all' || g.id === filter);
            const shown = articlesData.filter(a => groups.some(g => g.id === a.group));
            countDisplay.textContent = `${shown.length} ${shown.length === 1 ? 'ARTICLE' : 'ARTICLES'}`;

            grid.innerHTML = groups.map(g => {
                const items = articlesData.filter(a => a.group === g.id);
                if (!items.length) return '';
                return `
                <section data-group="${g.id}">
                    <div class="mb-5">
                        <div class="flex items-baseline gap-2">
                            <h2 class="text-xl font-bold text-slate-900 tracking-tight">${g.title}</h2>
                            <span class="text-sm font-semibold text-gray-400">${items.length}</span>
                        </div>
                        <p class="text-sm text-gray-500 mt-1">${g.note}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${items.map(cardHtml).join('')}</div>
                </section>`;
            }).join('');

            lucide.createIcons();
        }

        // Логика табов
        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                tabs.forEach(t => t.className = "pb-3 border-b-2 border-transparent text-gray-500 hover:text-slate-800 font-medium text-sm whitespace-nowrap transition");
                e.currentTarget.className = "pb-3 border-b-2 border-indigo-600 text-indigo-600 font-semibold text-sm whitespace-nowrap";
                renderArticles(e.currentTarget.dataset.tab);
            });
        });

        // ЗАЩИТА СТРАНИЦЫ
        async function initProtectedPage() {
            try {
                // Вызываем функцию проверки из твоего auth.js
                const user = await window.requireAuth();
                
                // Если проверка пройдена, показываем контент
                if (user) {
                    renderArticles();
                } else {
                    // Если requireAuth не перекинул пользователя на страницу логина автоматически
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-rose-500 font-medium">Please log in to access the Master Class materials.</div>`;
                    countDisplay.textContent = "0 ARTICLES";
                }
            } catch (error) {
                console.error("Authorization check failed:", error);
            }
        }

        // Запускаем проверку при загрузке
        initProtectedPage();
        lucide.createIcons();
    </script>
</body>
</html>
