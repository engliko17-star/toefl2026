<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Tests — TOEFL Prep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        .puzzle-word { display: inline-flex; align-items: baseline; vertical-align: baseline; margin: 0 2px; }
        .letters-container { display: inline-flex; align-items: baseline; vertical-align: baseline; background-color: #f1f5f9; border-radius: 4px; padding: 0 4px; margin: 0 2px; transition: all 0.2s ease; border-bottom: 2px solid #cbd5e1; }
        .letters-container:focus-within { background-color: #e2e8f0; border-bottom-color: #7e22ce; }
        .letter-input { width: 14px; text-align: center; border: none; border-bottom: 2px solid #94a3b8; outline: none; font-weight: 700; color: #1e293b; background: transparent; margin: 0 1px; padding: 0; font-family: inherit; font-size: inherit; vertical-align: baseline; transition: all 0.2s; }
        .letter-input:focus { border-bottom-color: #7e22ce; }

        .clickable-sentence { cursor: pointer; border-radius: 4px; transition: background-color 0.2s; padding: 0 2px; }
        .clickable-sentence:hover { background-color: #fee2e2; color: #991b1b; }
        .clickable-sentence.selected { background-color: #4f46e5; color: white; }
        
        .insert-square { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 4px; 
            cursor: pointer; 
            font-size: 0.9rem; 
            color: #94a3b8; 
            background: #f1f5f9; 
            width: 22px; 
            height: 22px; 
            border-radius: 4px; 
            transition: all 0.2s; 
            user-select: none;
            font-weight: bold;
        }
        .insert-square:hover { background: #4f46e5; color: white; transform: scale(1.1); }
        .insert-square.selected { background: #312e81; color: white; transform: scale(1.1); box-shadow: 0 0 0 4px #e0e7ff; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row overflow-hidden">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 px-4 py-6 h-screen sticky top-0 z-10 shrink-0">
        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span><span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>
        <nav class="flex-1 space-y-1">
            <a href="index.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 transition"><i data-lucide="home" class="w-5 h-5"></i><span class="text-sm font-medium">Dashboard</span></a>
            <a href="vocabulary.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 transition"><i data-lucide="book-open" class="w-5 h-5"></i><span class="text-sm font-medium">Vocabulary</span></a>
            <div class="pt-6 pb-2 px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider">Practice</div>
            <a href="tests.html" class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900 text-white font-medium shadow-sm"><i data-lucide="file-check" class="w-5 h-5"></i><span class="text-sm">Mock Tests</span></a>
        </nav>
    </aside>

    <main id="main-interface" class="flex-1 p-6 overflow-y-auto bg-[#f8f9fa] h-screen custom-scrollbar relative">
        <div id="view-tests-grid" class="max-w-6xl mx-auto transition-all duration-300">
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Mock Tests</h1>
                <p class="text-sm text-gray-500 mt-2">Select a full test to begin your simulation.</p>
            </div>
            <!-- Сюда динамически подгрузятся тесты из базы -->
            <div id="tests-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                 <div class="text-slate-400 text-sm flex items-center"><i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin"></i> Loading tests...</div>
            </div>
        </div>

        <div id="view-test-detail" class="max-w-4xl mx-auto hidden transition-all duration-300">
            <button onclick="closeTestView()" class="flex items-center space-x-2 text-sm font-semibold text-gray-500 hover:text-slate-900 transition mb-6 group">
                <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i><span>Back to Library</span>
            </button>

            <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-8 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div class="flex items-center space-x-5">
                    <div id="dynamic-emoji-container" class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center text-4xl shadow-inner">📝</div>
                    <div>
                        <h2 id="dynamic-test-title" class="text-3xl font-bold text-slate-900 tracking-tight">Loading...</h2>
                        <p class="text-sm text-gray-500 mt-1">Full Section Simulation</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-white border border-gray-100 rounded-2xl p-5 hover:border-blue-200 hover:shadow-md transition group flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center"><i data-lucide="book-text" class="w-6 h-6"></i></div>
                            <span class="text-[10px] font-bold text-slate-500 bg-gray-50 px-2.5 py-1 rounded-md border border-gray-100">35 MINS</span>
                        </div>
                        <h4 class="font-bold text-slate-900 text-lg mb-1">Reading</h4>
                        <p class="text-sm text-gray-500 mb-6">Structured test loaded from DB.</p>
                    </div>
                    <button id="start-btn" class="w-full text-left text-sm font-semibold text-blue-600 flex items-center group-hover:translate-x-1 transition-transform">
                        Start Section <i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>

                </div>
            </div>
        </div>
    </main>

    <!-- EXAM ENGINE -->
    <div id="exam-engine-view" class="fixed inset-0 z-50 bg-[#f8f9fa] flex-col hidden h-screen w-screen">
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0 shadow-sm relative z-20">
            <div class="flex items-center space-x-4">
                <button onclick="exitExamEngine()" class="text-gray-400 hover:text-red-600 transition flex items-center text-sm font-bold cursor-pointer group">
                    <i data-lucide="x-circle" class="w-4 h-4 mr-2 group-hover:scale-110 transition-transform"></i> Abort
                </button>
                <div class="h-4 w-px bg-gray-200"></div>
                <h1 id="engine-title" class="text-sm font-bold text-slate-900">Reading Section</h1>
            </div>
            
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-1.5 text-sm font-bold text-red-500 bg-red-50 px-3 py-1.5 rounded-lg">
                    <i data-lucide="timer" class="w-4 h-4"></i>
                    <span id="engine-timer">35:00</span>
                </div>
                <div class="flex items-center space-x-3 text-sm font-bold text-slate-500">
                    <span id="engine-progress">0 / 0</span>
                </div>
                <span class="text-gray-300 block">|</span>
                <div class="flex items-center space-x-3">
                    <button id="engine-prev" onclick="prevTask()" class="px-4 py-2 rounded-lg border border-gray-200 bg-white text-slate-700 text-xs font-bold hover:bg-slate-50 disabled:opacity-30 transition flex items-center shadow-xs">
                        <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i> Back

                    <button id="engine-next" onclick="nextTask()" class="px-4 py-2 rounded-lg bg-slate-900 text-white text-xs font-bold hover:bg-indigo-600 transition flex items-center shadow-xs">
                        Next <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i>

                </div>

        <main id="engine-content" class="flex-1 flex overflow-hidden w-full h-full relative"></main>

    <!-- RESULTS SCREEN (ОБНОВЛЕННЫЙ SPLIT-SCREEN) -->

        <!-- Динамический рендер split-screen -->
    </div>

    <script>
        const supabaseUrl = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
        
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        lucide.createIcons();

        async function loadTestsGrid() {
            const container = document.getElementById('tests-container');
            try {
                const { data: tests, error } = await supabaseClient.from('full_tests').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                if (!tests || tests.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center text-slate-500 py-10">No tests found in 'full_tests' table.</div>`;
                    return;
                }

                container.innerHTML = tests.map(test => `
                    <div onclick="openTestView(${test.id}, '${test.title}', '${test.emoji}')" class="bg-white rounded-3xl border border-gray-100 p-6 shadow-sm hover:shadow-md hover:-translate-y-1 hover:border-indigo-200 transition-all cursor-pointer group">
                        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-3xl mb-5 group-hover:scale-110 transition-transform">${test.emoji || '📝'}</div>
                        <h3 class="text-xl font-bold text-slate-900 mb-1">${test.title}</h3>
                        <p class="text-xs text-gray-400 mb-6">Full Section Simulation</p>
                        <div class="flex items-center justify-between border-t border-gray-50 pt-4">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">35 mins</span>
                            <span class="px-2.5 py-1 bg-green-50 text-green-600 font-bold text-[10px] rounded-lg uppercase tracking-wider">Ready</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error loading tests:", err);
                container.innerHTML = `<div class="col-span-full text-red-500">Error loading tests. Check console.</div>`;
            }
        }
        
        loadTestsGrid();

        let currentActiveTestId = null;

        function openTestView(testId, title, emoji) {
            currentActiveTestId = testId;
            document.getElementById('view-tests-grid').classList.add('hidden');
            document.getElementById('view-test-detail').classList.remove('hidden');
            
            document.getElementById('dynamic-test-title').innerText = title;
            document.getElementById('dynamic-emoji-container').innerText = emoji || '📝';
            
            const startBtn = document.getElementById('start-btn');
            startBtn.onclick = () => startExamEngine(testId, title);
        }

        function closeTestView() {
            document.getElementById('view-test-detail').classList.add('hidden');
            document.getElementById('view-tests-grid').classList.remove('hidden');
            currentActiveTestId = null;
        }

        let currentTasks = [];
        let currentIndex = 0;
        let timerInterval;
        let timeRemaining = 35 * 60; 

        function renderDailyLifeLayout(passage, layoutType, taskTitle) {
            if (!passage) return "";
            const cleanPassage = passage.replace(/[\[\]]/g, ''); 
            switch(layoutType?.toLowerCase().trim()) {
                case 'email': 
                    return `<div class="max-w-xl mx-auto bg-white border border-slate-200 rounded-lg overflow-hidden shadow-xs font-sans text-sm"><div class="bg-slate-50 p-4 border-b border-slate-200 space-y-1.5 text-slate-700"><div><span class="inline-block w-14 font-semibold text-slate-400">To:</span> <span class="bg-white px-2 py-0.5 border border-slate-200 rounded text-xs">student@toeflprep.com</span></div><div><span class="inline-block w-14 font-semibold text-slate-400">From:</span> <span class="text-slate-600">admin</span></div><div><span class="inline-block w-14 font-semibold text-slate-400">Subject:</span> <span class="font-medium text-slate-900">${taskTitle}</span></div></div><div class="p-6 text-slate-800 space-y-4 leading-relaxed font-normal bg-white">${cleanPassage}</div></div>`;
                case 'social_media': 
                    return `<div class="max-w-md mx-auto bg-white border border-slate-200 rounded-2xl p-5 shadow-xs font-sans"><div class="flex items-center space-x-3 mb-4"><div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-sm"><i data-lucide="user" class="w-5 h-5"></i></div><div><div class="font-bold text-sm text-slate-900">Community Board</div><div class="text-[11px] text-slate-400 font-normal">Posted recently</div></div></div><div class="text-slate-700 space-y-3 font-normal text-sm leading-relaxed mb-4">${cleanPassage}</div></div>`;
                case 'notice': 
                    return `<div class="max-w-lg mx-auto bg-white border-2 border-slate-800 p-8 shadow-xs font-sans relative"><h3 class="text-lg font-bold text-slate-900 text-center tracking-tight mb-6 uppercase">${taskTitle}</h3><div class="text-slate-700 space-y-4 font-normal text-sm leading-relaxed relative z-10">${cleanPassage}</div></div>`;
                case 'chat': {
                    let chatHtml = '';
                    const chatParts = cleanPassage.split(/([A-Za-z0-9 ]+ \(\d{2}:\d{2}\s*[AP]M\)):/);
                    if (chatParts.length > 1) {
                        for (let i = 1; i < chatParts.length; i += 2) {
                            let sender = chatParts[i].trim();
                            let msg = (chatParts[i+1] || '').trim();
                            if (sender && msg) {
                                chatHtml += `
                                    <div class="mb-5">
                                        <div class="text-[11px] text-slate-500 mb-1.5 ml-1">${sender}</div>
                                        <div class="bg-white border border-slate-100 text-slate-700 p-4 rounded-2xl rounded-tl-sm shadow-sm text-sm leading-relaxed inline-block">${msg}</div>
                                    </div>
                                `;
                            }
                        }
                    } else {
                        chatHtml = `<div class="bg-white border border-slate-100 text-slate-700 p-4 rounded-2xl rounded-tl-sm shadow-sm text-sm leading-relaxed">${cleanPassage}</div>`;
                    }
                    return `<div class="max-w-sm mx-auto bg-slate-50 border border-slate-200 rounded-[24px] overflow-hidden shadow-xs font-sans flex flex-col h-[550px]"><div class="bg-[#111827] p-4 text-white text-center font-bold text-[13px] flex items-center justify-center gap-2 shadow-sm shrink-0"><span class="w-1.5 h-1.5 bg-emerald-400 rounded-full"></span> Group Chat</div><div class="p-5 overflow-y-auto flex-1 custom-scrollbar">${chatHtml}</div></div>`;
                }
                case 'advertisement': 
                    return `<div class="max-w-md mx-auto bg-gradient-to-br from-yellow-50 to-orange-50 border-2 border-dashed border-orange-200 p-8 rounded-2xl shadow-sm font-sans text-center relative overflow-hidden"><div class="absolute top-0 right-0 bg-red-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-lg uppercase tracking-wider">Ad</div><h3 class="text-2xl font-extrabold text-orange-600 mb-4 tracking-tight">${taskTitle}</h3><div class="text-slate-700 space-y-3 font-medium text-sm leading-relaxed mb-6">${cleanPassage}</div><button class="bg-orange-500 text-white font-bold py-2 px-6 rounded-full shadow-md text-sm cursor-default hover:bg-orange-600 transition">Learn More</button></div>`;
                default: 
                    return `<div class="text-slate-700 space-y-4 font-normal leading-relaxed text-base">${cleanPassage}</div>`;
            }
        }

        function setupInputs() {
            const inputs = document.querySelectorAll('.letter-input');
            inputs.forEach((input, index) => {
                input.setAttribute('maxlength', '1');
                input.addEventListener('input', function() {
                    this.value = this.value.replace(/[^a-zA-Z]/g, '').toLowerCase();
                    if (this.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
                });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value === '' && index > 0) inputs[index - 1].focus();
                });
            });
        }

        async function fetchAndParseTasks(testId, stageName) {
            let parsedTasks = [];
            const { data: plan, error: planErr } = await supabaseClient
                .from('full_test_tasks')
                .select('*')
                .eq('test_id', testId)
                .eq('stage', stageName)
                .order('order_num', { ascending: true });

            if (planErr) throw planErr;
            if (!plan || plan.length === 0) return parsedTasks;

            for (let step of plan) {
                let tableName = step.task_type + '_tasks'; 
                
                const { data: taskData, error: taskErr } = await supabaseClient
                    .from(tableName)
                    .select('*')
                    .eq('id', step.task_id)
                    .single();

                if (taskErr) {
                    console.warn(`Could not load task ${step.task_id} from ${tableName}`);
                    continue; 
                }

                if (step.task_type === 'complete_words') {
                    let parsedPassage = taskData.passage.replace(/(?:\[[a-zA-Z]\])+/g, (match) => {
                        let letters = match.replace(/[\[\]]/g, '').split('');
                        let inputsHtml = letters.map(l => `<input type="text" class="letter-input" data-answer="${l}">`).join('');
                        return `<span class="letters-container">${inputsHtml}</span>`;
                    });
                    parsedTasks.push({ 
                        type: 'complete_words', 
                        title: taskData.title, 
                        passage: parsedPassage,
                        stage: stageName,
                        correctAnswer: null, 
                        userAnswer: null
                    });
                
                } else if (step.task_type === 'daily_life' || step.task_type === 'academic') {
                    let questions = [];
                    if (typeof taskData.questions === 'string') {
                        try { questions = JSON.parse(taskData.questions); } catch(e) { questions = []; }
                    } else if (Array.isArray(taskData.questions)) {
                        questions = taskData.questions;
                    }
                    
                    questions.forEach(q => {
                        let parsedPassage = taskData.passage;
                        let qType = q.type || 'Standard';

                        if (step.task_type === 'academic') {
                            if (qType === 'Select a Sentence') {
                                parsedPassage = parsedPassage.replace(/\[s\d+\]\s*([^\[\n]+)/g, '<span class="clickable-sentence">$1</span>');
                            } else if (qType === 'Insert Text') {
                                parsedPassage = parsedPassage.replace(/\[s\d+\]/g, '<span class="insert-square">■</span>').replace(/\[■\]/g, '<span class="insert-square">■</span>');
                            } else {
                                parsedPassage = parsedPassage.replace(/\[s\d+\]\s*/g, '').replace(/\[■\]\s*/g, '');
                            }
                        }

                        parsedTasks.push({
                            type: step.task_type,
                            title: taskData.title,
                            layout: taskData.layout_type || 'notice',
                            passage: parsedPassage,
                            question: q.text,
                            options: q.options || [],
                            qType: qType,
                            insertSentence: q.insertSentence || "",
                            stage: stageName,
                            correctAnswer: q.correct !== undefined ? q.options[q.correct] : null,
                            explanation: q.explanation || "",
                            userAnswer: null
                        });
                    });
                }
            }
            return parsedTasks;
        }

        async function startExamEngine(testId, testTitle) {
            document.getElementById('results-view').classList.add('hidden');
            document.getElementById('results-view').classList.remove('flex');

            document.getElementById('main-interface').classList.add('hidden');
            document.getElementById('exam-engine-view').classList.remove('hidden');
            document.getElementById('exam-engine-view').classList.add('flex');
            
            document.getElementById('engine-title').innerText = `Loading ${testTitle}...`;
            document.getElementById('engine-content').innerHTML = `
                <div class="m-auto text-center">
                    <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <p class="text-slate-600 font-bold text-sm animate-pulse">Building test layout...</p>
                </div>
            `;
            
            currentTasks = [];
            
            try {
                currentTasks = await fetchAndParseTasks(testId, '1');

                if (currentTasks.length === 0) {
                    alert("This test is empty (No module 1 tasks)! Please add tasks in Supabase 'full_test_tasks' table with stage '1'.");
                    exitExamEngine();
                    return;
                }

                currentIndex = 0;
                document.getElementById('engine-title').innerText = testTitle;
                
                timeRemaining = 35 * 60;
                startTimer();
                renderEngine();

            } catch (err) {
                console.error("Engine crash:", err);
                alert("Error loading test structure.");
                exitExamEngine();
            }
        }

        function exitExamEngine() {
            clearInterval(timerInterval);
            document.getElementById('exam-engine-view').classList.add('hidden');
            document.getElementById('exam-engine-view').classList.remove('flex');
            document.getElementById('main-interface').classList.remove('hidden');
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert("Time is up!");
                    exitExamEngine();
                }
                let m = Math.floor(timeRemaining / 60);
                let s = timeRemaining % 60;
                document.getElementById('engine-timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);
        }

        function renderEngine() {
            const task = currentTasks[currentIndex];
            const contentDiv = document.getElementById('engine-content');
            
            document.getElementById('engine-progress').innerText = `${currentIndex + 1} / ${currentTasks.length}`;
            document.getElementById('engine-prev').disabled = (currentIndex === 0);
            document.getElementById('engine-next').innerHTML = (currentIndex === currentTasks.length - 1) 
                ? 'Continue <i data-lucide="check" class="w-4 h-4 ml-1"></i>' 
                : 'Next <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i>';

            contentDiv.innerHTML = '';

            if (task.type === 'complete_words') {
                contentDiv.innerHTML = `
                    <div class="w-full p-10 overflow-y-auto custom-scrollbar flex items-center justify-center bg-[#f8f9fa]">
                        <div class="max-w-3xl w-full bg-white p-10 rounded-3xl border border-gray-100 shadow-sm">
                            <h2 class="text-xl font-bold mb-6 text-center text-slate-900">${task.title}</h2>
                            <div class="text-lg leading-loose text-slate-700 text-center">${task.passage}</div>
                        </div>
                    </div>
                `;
                setTimeout(() => setupInputs(), 50);
            } 
            else if (task.type === 'daily_life') {
                const renderedLayout = renderDailyLifeLayout(task.passage, task.layout, task.title);
                contentDiv.innerHTML = `
                    <section class="w-1/2 bg-white p-10 overflow-y-auto custom-scrollbar border-r border-slate-200 flex flex-col justify-center">
                        <div>${renderedLayout}</div>
                    </section>
                    <section class="w-1/2 bg-slate-50 p-10 overflow-y-auto custom-scrollbar">
                        <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-xs max-w-xl mx-auto mt-10">
                            <h3 class="font-bold text-slate-900 mb-6">${task.question}</h3>
                            <div class="space-y-3">
                                ${task.options.map((opt) => `
                                    <label class="flex items-center p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-slate-50 transition">
                                        <input type="radio" name="q" value="${opt}"
                                            ${task.userAnswer === opt ? 'checked' : ''}
                                            onchange="currentTasks[${currentIndex}].userAnswer = this.value"
                                            class="w-4 h-4 text-indigo-600 mr-3">
                                        <span class="text-sm text-slate-700">${opt}</span>
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                    </section>
                `;
            }
            else if (task.type === 'academic') {
                let rightPanelContent = '';

                if (task.qType === 'Select a Sentence') {
                    rightPanelContent = `
                        <div class="bg-amber-50 border border-amber-100 p-3 rounded-xl mb-6 text-xs text-amber-800 flex items-center">
                            <i data-lucide="mouse-pointer-click" class="w-4 h-4 mr-2"></i> Click a sentence on the left.
                        </div>
                        <h3 class="font-bold text-slate-900">${task.question}</h3>
                    `;
                } else if (task.qType === 'Insert Text') {
                    rightPanelContent = `
                        <div class="bg-blue-50 border border-blue-100 p-3 rounded-xl mb-6 text-xs text-blue-800 flex items-center">
                            <i data-lucide="mouse-pointer-click" class="w-4 h-4 mr-2"></i> Click on a square [■] to insert the sentence.
                        </div>
                        <h3 class="font-bold text-slate-900 mb-4">${task.question}</h3>
                        <div class="p-4 bg-white border-2 border-dashed border-indigo-300 rounded-xl text-sm font-bold text-indigo-900 text-center shadow-xs">
                            "${task.insertSentence}"
                        </div>
                    `;
                } else {
                    rightPanelContent = `
                        <h3 class="font-bold text-slate-900 mb-6">${task.question}</h3>
                        <div class="space-y-3">
                            ${task.options.map((opt) => `
                                <label class="flex items-center p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-slate-50 transition">
                                    <input type="radio" name="q" value="${opt}"
                                        ${task.userAnswer === opt ? 'checked' : ''}
                                        onchange="currentTasks[${currentIndex}].userAnswer = this.value"
                                        class="w-4 h-4 text-indigo-600 mr-3">
                                    <span class="text-sm text-slate-700">${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                    `;
                }

                contentDiv.innerHTML = `
                    <section class="w-1/2 bg-white p-10 overflow-y-auto custom-scrollbar border-r border-slate-200">
                        <h2 class="text-xl font-bold text-slate-900 mb-6">${task.title}</h2>
                        <div class="text-sm text-slate-700 leading-relaxed space-y-4 whitespace-pre-wrap">${task.passage}</div>
                    </section>
                    <section class="w-1/2 bg-slate-50 p-10 overflow-y-auto custom-scrollbar">
                         <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-xs max-w-xl mx-auto">
                            ${rightPanelContent}
                        </div>
                    </section>
                `;

                setTimeout(() => {
                    document.querySelectorAll('.clickable-sentence').forEach(el => {
                        const sentenceText = el.textContent.trim();
                        if (task.userAnswer === sentenceText) el.classList.add('selected');
                        
                        el.onclick = function() {
                            if (task.qType !== 'Select a Sentence') return;
                            document.querySelectorAll('.clickable-sentence').forEach(s => s.classList.remove('selected'));
                            this.classList.add('selected');
                            currentTasks[currentIndex].userAnswer = this.textContent.trim();
                        };
                    });

                    document.querySelectorAll('.insert-square').forEach((el, index) => {
                        const squareIndexStr = index.toString();
                        if (task.userAnswer === squareIndexStr) el.classList.add('selected');

                        el.onclick = function() {
                            if (task.qType !== 'Insert Text') return;
                            document.querySelectorAll('.insert-square').forEach(s => s.classList.remove('selected'));
                            this.classList.add('selected');
                            currentTasks[currentIndex].userAnswer = squareIndexStr;
                        };
                    });
                }, 50);
            }
            lucide.createIcons();
        }

        async function loadModule2Tasks() {
            document.getElementById('engine-next').innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin mr-1"></i> Loading Module 2...';
            
            let correctCount = 0;
            let module1Total = 0;

            for (let task of currentTasks) {
                if (task.stage === '1' && task.correctAnswer !== null) {
                    module1Total++;
                    if (task.userAnswer && task.userAnswer === task.correctAnswer) {
                        correctCount++;
                    }
                }
            }

            const thresholdPercentage = 0.5; 
            const isHardModule = (module1Total > 0) && (correctCount / module1Total >= thresholdPercentage);
            const nextStage = isHardModule ? '2_hard' : '2_easy';
            
            try {
                const module2Tasks = await fetchAndParseTasks(currentActiveTestId, nextStage);
                if (module2Tasks.length > 0) {
                    currentTasks = currentTasks.concat(module2Tasks);
                    return true; 
                }
            } catch(e) {
                console.error("Error loading module 2:", e);
            }
            return false; 
        }

        function calculateTOEFLScore(correct, total) {
            if (total === 0) return "1.0";
            const ratio = correct / total;
            let score = 1.0 + (ratio * 5.0);
            return (Math.round(score * 2) / 2).toFixed(1);
        }

        // ОБНОВЛЕННАЯ ФУНКЦИЯ ДЛЯ ВЫВОДА SPLIT-SCREEN РЕЗУЛЬТАТОВ ПО МОДУЛЯМ
        function showResults() {
            clearInterval(timerInterval);
            
            let correctAnswers = 0;
            let totalQuestions = 0;

            const modules = {};

            currentTasks.forEach((task, index) => {
                // Подсчет общих баллов
                if (task.correctAnswer !== null && task.correctAnswer !== undefined) { 
                    totalQuestions++;
                    if (task.userAnswer === task.correctAnswer) correctAnswers++;
                }

                // Группировка по модулям
                let stageName = task.stage.startsWith('2') ? 'Module 2' : 'Module 1';
                if (!modules[stageName]) modules[stageName] = [];

                // Группировка по текстам внутри модуля
                let pObj = modules[stageName].find(p => p.title === task.title && p.type === task.type);
                if (!pObj) {
                    pObj = {
                        title: task.title,
                        type: task.type,
                        passage: task.passage,
                        layout: task.layout,
                        questions: []
                    };
                    modules[stageName].push(pObj);
                }
                pObj.questions.push({...task, globalIndex: index + 1});
            });

            const finalScore = calculateTOEFLScore(correctAnswers, totalQuestions);

            // Переключаем интерфейс
            document.getElementById('exam-engine-view').classList.add('hidden');
            document.getElementById('exam-engine-view').classList.remove('flex');
            document.getElementById('main-interface').classList.add('hidden');
            
            const resultsView = document.getElementById('results-view');
            resultsView.classList.remove('hidden');
            resultsView.className = 'fixed inset-0 z-50 bg-[#f8f9fa] flex flex-row w-screen h-screen overflow-hidden';

            let leftColHtml = '';
            let rightColHtml = '';

            // Генерация контента
            Object.keys(modules).forEach(modName => {
                rightColHtml += `<div class="mt-8 mb-6 font-extrabold text-2xl text-slate-800 border-b pb-3 border-gray-200">${modName}</div>`;
                leftColHtml += `<div class="mt-8 mb-6 font-extrabold text-2xl text-slate-800 border-b pb-3 border-gray-200">${modName}</div>`;

                modules[modName].forEach(pObj => {
                    // Рендер левой части (Тексты заданий)
                    let renderedPassage = '';
                    if (pObj.type === 'daily_life') {
                        renderedPassage = renderDailyLifeLayout(pObj.passage, pObj.layout, pObj.title);
                    } else if (pObj.type === 'complete_words') {
                        renderedPassage = `<div class="bg-white p-6 rounded-xl border border-gray-200 text-sm leading-relaxed">${pObj.passage}</div>`;
                    } else {
                        renderedPassage = `<div class="bg-white p-8 border border-slate-500 shadow-sm text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">${pObj.passage}</div>`;
                    }
                    
                    leftColHtml += `
                        <div class="mb-12">
                            <h3 class="text-xl font-bold text-slate-800 mb-4">${pObj.type === 'academic' ? 'Academic Text' : (pObj.type === 'complete_words' ? 'Word Puzzle Text' : 'Reading Passage')}</h3>
                            ${renderedPassage}
                        </div>
                    `;

                    // Рендер правой части (Ответы и Разбор)
                    pObj.questions.forEach(q => {
                        if (q.type === 'complete_words') {
                            rightColHtml += `
                                <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm mb-4">
                                    <div class="flex justify-between items-center mb-4">
                                        <span class="bg-indigo-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-md uppercase tracking-wider">TYPE: COMPLETE WORDS</span>
                                    </div>
                                    <div class="p-3 bg-green-50 border border-green-200 rounded-lg flex justify-between items-center text-sm">
                                        <span class="text-green-800 font-medium">Text successfully completed</span>
                                        <div class="w-5 h-5 bg-green-500 text-white rounded flex items-center justify-center"><i data-lucide="check" class="w-3.5 h-3.5"></i></div>
                                    </div>
                                </div>
                            `;
                            return;
                        }

                        let optionsHtml = '';
                        if (q.qType === 'Select a Sentence' || q.qType === 'Insert Text') {
                            let isCorrect = q.userAnswer === q.correctAnswer;
                            optionsHtml = `
                                <div class="p-4 rounded-xl border ${isCorrect ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800'}">
                                    <div class="text-xs font-bold mb-1 opacity-70">Your Answer:</div>
                                    <div class="text-sm mb-3 font-medium">${q.userAnswer || 'No answer'}</div>
                                    ${!isCorrect ? `
                                        <div class="text-xs font-bold mb-1 mt-2 opacity-70">Correct Answer:</div>
                                        <div class="text-sm font-medium">${q.correctAnswer}</div>
                                    ` : ''}
                                </div>
                            `;
                        } else if (q.options) {
                            optionsHtml = q.options.map(opt => {
                                let isUserChoice = (q.userAnswer === opt);
                                let isCorrectChoice = (q.correctAnswer === opt);
                                
                                let boxClass = "bg-white border-gray-200 text-slate-600";
                                let iconBox = '<div class="w-5 h-5 rounded-full border border-gray-300 mr-3 flex-shrink-0 bg-gray-50"></div>';

                                if (isCorrectChoice && isUserChoice) {
                                    boxClass = "bg-green-50 border-green-400 text-green-900 shadow-sm";
                                    iconBox = `<div class="w-5 h-5 rounded bg-green-500 text-white flex items-center justify-center mr-3 flex-shrink-0"><i data-lucide="check" class="w-3.5 h-3.5"></i></div>`;
                                } else if (isUserChoice && !isCorrectChoice) {
                                    boxClass = "bg-red-50 border-red-300 text-red-900 shadow-sm";
                                    iconBox = `<div class="w-5 h-5 rounded bg-red-500 text-white flex items-center justify-center mr-3 flex-shrink-0"><i data-lucide="x" class="w-3.5 h-3.5"></i></div>`;
                                } else if (!isUserChoice && isCorrectChoice) {
                                    boxClass = "bg-green-50 border-green-400 text-green-900 shadow-sm";
                                    iconBox = `<div class="w-5 h-5 rounded bg-green-500 text-white flex items-center justify-center mr-3 flex-shrink-0"><i data-lucide="check" class="w-3.5 h-3.5"></i></div>`;
                                }

                                return `
                                    <div class="flex items-center p-3 border rounded-xl mb-2.5 ${boxClass} transition-colors">
                                        ${iconBox}
                                        <span class="text-sm font-medium">${opt}</span>
                                    </div>
                                `;
                            }).join('');
                        }

                        let badgeLabel = q.qType ? q.qType.toUpperCase() : 'DETAIL';

                        rightColHtml += `
                            <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm mb-4 relative overflow-hidden">
                                <div class="flex justify-between items-center mb-5">
                                    <span class="bg-indigo-500 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-sm flex items-center"><i data-lucide="target" class="w-3 h-3 mr-1"></i> TYPE: ${badgeLabel}</span>
                                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Q${q.globalIndex}</span>
                                </div>
                                <h4 class="font-bold text-slate-900 mb-5 text-[15px] leading-relaxed">${q.question}</h4>
                                <div class="space-y-1">
                                    ${optionsHtml}
                                </div>
                                ${q.explanation ? `<div class="mt-5 p-4 bg-amber-50 text-amber-900 text-sm rounded-xl border border-amber-100 leading-relaxed"><strong class="font-bold uppercase tracking-wider text-[10px] block mb-1.5 opacity-60">Explanation</strong> ${q.explanation}</div>` : ''}
                            </div>
                        `;
                    });
                });
            });

            // Сборка итогового интерфейса
            resultsView.innerHTML = `
                <div class="w-1/2 h-full overflow-y-auto custom-scrollbar p-10 border-r border-slate-200 bg-white">
                    ${leftColHtml}
                </div>
                <div class="w-1/2 h-full overflow-y-auto custom-scrollbar p-10 bg-[#f8f9fa]">
                    
                    <div class="bg-white rounded-[2rem] p-8 border border-gray-100 shadow-sm text-center mb-10 relative overflow-hidden">
                        <div class="w-16 h-16 bg-yellow-50 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">🏆</div>
                        <h2 class="text-2xl font-bold text-slate-900 mb-8">Review Mode</h2>
                        
                        <div class="flex justify-center items-center mb-8">
                            <div class="px-8 text-center border-r border-gray-100">
                                <div class="text-6xl font-extrabold text-indigo-600 mb-2">${finalScore}</div>
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Est. Band Score</div>
                            </div>
                            <div class="px-8 text-center">
                                <div class="text-3xl font-bold text-slate-700 mb-2 mt-2">${correctAnswers} <span class="text-gray-300 text-xl">/</span> <span class="text-gray-400 text-2xl">${totalQuestions}</span></div>
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-1">Raw Score</div>
                            </div>
                        </div>

                        <div class="flex justify-center space-x-3">
                            <button onclick="startExamEngine(currentActiveTestId, document.getElementById('dynamic-test-title').innerText)" class="px-6 py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-indigo-600 transition shadow-md text-sm flex items-center">
                                <i data-lucide="rotate-ccw" class="w-4 h-4 mr-2"></i> Try Again
                            </button>
                            <button onclick="closeResults()" class="px-6 py-3 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition shadow-sm text-sm">
                                Dashboard
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 mb-6 text-yellow-500 px-2">
                        <i data-lucide="lightbulb" class="w-6 h-6"></i>
                        <h3 class="text-lg font-bold text-slate-900">Review Answers & Explanations</h3>
                    </div>

                    <div class="space-y-4">
                        ${rightColHtml}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function closeResults() {
            document.getElementById('results-view').classList.add('hidden');
            document.getElementById('results-view').classList.remove('flex');
            document.getElementById('main-interface').classList.remove('hidden');
            loadTestsGrid();
        }

        async function nextTask() {
            if (currentIndex < currentTasks.length - 1) {
                currentIndex++;
                renderEngine();
            } else {
                const isModule1Finished = !currentTasks.some(t => t.stage.startsWith('2'));
                
                if (isModule1Finished) {
                    const loaded = await loadModule2Tasks();
                    if (loaded) {
                        currentIndex++;
                        renderEngine();
                        return;
                    }
                }
                showResults();
            }
        }

        function prevTask() {
            if (currentIndex > 0) {
                currentIndex--;
                renderEngine();
            }
        }
    </script>
</body>
</html>
