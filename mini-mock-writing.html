<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL Mock Writing</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .exam-textarea { resize: none; outline: none; font-family: inherit; }
        .word-slot { min-width: 90px; min-height: 36px; transition: all 0.2s; }
        .sortable-ghost { opacity: 0.2; background-color: #f1f5f9; border: 2px dashed #94a3b8; color: transparent; }
    </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col antialiased opacity-0 transition-opacity duration-200" id="mainBody">

    <!-- Top Navigation (TOEFL Style) -->
    <header class="bg-[#333333] text-white flex flex-col w-full z-50 shrink-0 select-none">
        <!-- Top Dark Bar -->
        <div class="flex justify-between items-center px-4 py-2 border-b border-[#555]">
            <div class="flex items-center gap-2">
                <span class="text-xl font-bold tracking-tight font-serif italic text-gray-100">*toefl ibt.</span>
            </div>
            
            <!-- Action Buttons Area -->
            <div class="flex items-center gap-1.5" id="topActionButtons">
                <button id="navHelp" class="bg-[#333] hover:bg-[#444] text-white px-3 py-1.5 text-sm font-bold border border-gray-500 rounded-sm flex items-center transition-colors">
                    Help <i data-lucide="help-circle" class="w-3.5 h-3.5 ml-1.5 opacity-70"></i>
                </button>
                <button id="navReview" class="bg-[#333] hover:bg-[#444] text-white px-3 py-1.5 text-sm font-bold border border-gray-500 rounded-sm flex items-center transition-colors">
                    Review <i data-lucide="bookmark" class="w-3.5 h-3.5 ml-1.5 opacity-70"></i>
                </button>
                <button id="navBack" class="bg-[#333] hover:bg-[#444] text-white px-4 py-1.5 text-sm font-bold border border-gray-500 rounded-sm transition-colors">
                    Back
                </button>
                <button id="navNext" class="bg-white hover:bg-gray-100 text-black px-4 py-1.5 text-sm font-bold border border-white rounded-sm transition-colors ml-1">
                    Next &gt;
                </button>
            </div>
        </div>
        
        <!-- Second Light Bar -->
        <div class="flex justify-between items-center px-4 py-1.5 bg-white text-black border-b border-gray-300 shadow-sm">
            <div class="text-sm font-bold text-slate-700" id="taskCounterLabel">Loading...</div>
            <div class="flex items-center gap-4 text-sm font-bold">
                <div id="timeLeft" class="font-mono text-base tracking-wider text-slate-900">00:00:00</div>
                <button class="text-slate-500 hover:text-slate-800 text-xs flex items-center font-normal transition-colors">
                    <i data-lucide="eye-off" class="w-3.5 h-3.5 mr-1"></i> Hide Time
                </button>
            </div>
        </div>
    </header>

    <!-- Main Exam Container -->
    <main class="flex-1 flex flex-col overflow-hidden relative" id="examContainer">
        <!-- Вся динамика (Sentences, Email, Academic) рендерится здесь -->
        <div id="dynamicTaskArea" class="flex flex-col w-full h-full overflow-y-auto"></div>
    </main>

    <!-- Success Screen -->
    <main id="successScreen" class="hidden flex-1 flex-col items-center justify-center p-6 bg-gray-50">
        <div class="w-full max-w-lg bg-white rounded-2xl p-10 text-center border border-gray-200 shadow-sm">
            <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 mb-2">Simulation Complete</h2>
            <p class="text-gray-500 mb-8">Your responses have been successfully submitted for review.</p>
            <a href="mini-mock-writing-list.html" class="inline-block bg-slate-900 hover:bg-slate-800 text-white px-8 py-3 rounded-xl text-sm font-bold transition">
                Return to Dashboard
            </a>
        </div>
    </main>

    <script>
        // Supabase Settings
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ'; // Замени на свой ключ
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Global State
        let currentUser = null;
        let mockData = null;
        
        let sentencesData = [];
        let emailData = null;
        let academicData = null;
        
        let currentPhase = 'sentence'; // 'sentence', 'sentence-review', 'email', 'academic'
        let currentSentenceIndex = 0;
        let userResponses = [];
        
        let timerInterval;

        const dynamicTaskArea = document.getElementById('dynamicTaskArea');
        const navReview = document.getElementById('navReview');
        const navBack = document.getElementById('navBack');
        const navNext = document.getElementById('navNext');

        async function checkAuthAndLoad() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) return window.location.replace('index.html');
                
                currentUser = session.user;
                document.getElementById('mainBody').classList.remove('opacity-0');
                lucide.createIcons();
                
                const mockId = new URLSearchParams(window.location.search).get('id');
                if (!mockId) return window.location.replace('mini-mock-writing-list.html');
                
                await loadMockData(mockId);
            } catch (err) {
                console.error("Auth error:", err);
            }
        }

        async function loadMockData(mockId) {
            try {
                const { data: mock } = await supabaseClient.from('mini_mock_writing').select('*').eq('id', mockId).single();
                mockData = mock;

                const { data: firstSentence } = await supabaseClient.from('writing_tasks').select('test_id').eq('id', mock.sentence_task_id).single();
                const targetTestId = (firstSentence && firstSentence.test_id) ? firstSentence.test_id : mock.sentence_task_id;

                const [sentencesRes, emailRes, academicRes] = await Promise.all([
                    supabaseClient.from('writing_tasks').select('*').eq('type', 'sentence').eq('test_id', targetTestId).order('id'),
                    supabaseClient.from('writing_tasks').select('*').eq('id', mock.email_task_id).single(),
                    supabaseClient.from('writing_tasks').select('*').eq('id', mock.academic_task_id).single()
                ]);

                sentencesData = sentencesRes.data || [];
                emailData = emailRes.data;
                academicData = academicRes.data;

                sentencesData.forEach(q => {
                    if (typeof q.structure === 'string') q.structure = JSON.parse(q.structure);
                    if (typeof q.bank === 'string') q.bank = JSON.parse(q.bank);
                });
                if (typeof emailData.instructions === 'string') emailData.instructions = JSON.parse(emailData.instructions);
                if (typeof academicData.peers === 'string') academicData.peers = JSON.parse(academicData.peers);

                initPhaseSentence();
            } catch (err) {
                console.error("Data load error:", err);
                alert("Error loading test data.");
            }
        }

        // ==========================================
        // UI & NAVIGATION HELPERS
        // ==========================================
        function countWords(text) {
            const words = text.toLowerCase().match(/\b\w+\b/g) || [];
            const articles = ['a', 'an', 'the'];
            return words.filter(w => !articles.includes(w)).length;
        }

        function setupWordCounter(textareaId, counterId) {
            const textarea = document.getElementById(textareaId);
            const counter = document.getElementById(counterId);
            if (textarea && counter) {
                textarea.addEventListener('input', () => { counter.textContent = countWords(textarea.value); });
            }
        }

        function formatTime(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function startPhaseTimer(minutes, timeoutCallback) {
            clearInterval(timerInterval);
            let seconds = minutes * 60;
            const display = document.getElementById('timeLeft');
            display.style.color = ''; 

            display.textContent = formatTime(seconds);

            timerInterval = setInterval(() => {
                seconds--;
                display.textContent = formatTime(seconds);
                
                if (seconds <= 60) display.style.color = '#ef4444'; // Red if <= 1 min
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    timeoutCallback(); // АВТО-ПЕРЕХОД ПРИ ИСТЕЧЕНИИ
                }
            }, 1000);
        }

        // ==========================================
        // PHASE 1: SENTENCES
        // ==========================================
        function initPhaseSentence() {
            currentPhase = 'sentence';
            
            let wrapper = document.getElementById('sentencesWrapper');
            if (!wrapper) {
                dynamicTaskArea.innerHTML = `<div id="sentencesWrapper" class="w-full flex flex-col flex-1 pb-10"></div>`;
                wrapper = document.getElementById('sentencesWrapper');
                
                // Рендер всех предложений (скрытых)
                sentencesData.forEach((q, index) => {
                    let sentenceHTML = '';
                    (q.structure || []).forEach((item, sIndex) => {
                        if (item.type === 'text') {
                            sentenceHTML += `<div class="inline-flex px-1.5 py-1 text-base font-medium text-slate-800">${item.value}</div>`;
                        } else if (item.type === 'slot') {
                            sentenceHTML += `<div class="word-slot inline-flex items-center justify-center border-b-[3px] border-gray-400 mx-1 pb-1 align-bottom bg-gray-50/50" id="slot-${index}-${sIndex}"></div>`;
                        }
                    });

                    const div = document.createElement('div');
                    div.id = `sentence-container-${index}`;
                    div.className = `w-full flex-1 flex flex-col items-center pt-10 px-4`;
                    
                    let bankWords = [...(q.bank || [])].sort(() => Math.random() - 0.5);
                    let bankHTML = bankWords.map(word => `<div class="bg-white border border-gray-300 hover:border-indigo-400 text-slate-700 text-sm px-4 py-2 rounded shadow-sm cursor-grab select-none">${word}</div>`).join('');

                    div.innerHTML = `
                        <h2 class="text-xl font-bold text-slate-900 mb-12">Make an appropriate sentence.</h2>
                        <div class="w-full max-w-3xl mb-16 px-4">
                            <div class="flex items-center space-x-6 mb-8">
                                <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center text-3xl shrink-0 overflow-hidden shadow-inner">${q.avatar_left || '🧑'}</div>
                                <div class="text-base font-semibold text-slate-800">${q.prompt_context}</div>
                            </div>
                            <div class="flex items-start space-x-6">
                                <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center text-3xl shrink-0 overflow-hidden shadow-inner">${q.avatar_right || '👩'}</div>
                                <div class="flex-1 flex flex-wrap items-end gap-y-4 pt-4">${sentenceHTML}<span class="text-xl font-bold text-slate-800 select-none ml-1 align-bottom leading-none">?</span></div>
                            </div>
                        </div>
                        <div class="w-full max-w-3xl mx-auto flex flex-wrap justify-center gap-4 min-h-[60px]" id="bank-${index}">${bankHTML}</div>
                    `;
                    wrapper.appendChild(div);

                    new Sortable(div.querySelector(`#bank-${index}`), { group: `shared-${index}`, animation: 150 });
                    div.querySelectorAll(`[id^="slot-${index}-"]`).forEach(slot => {
                        new Sortable(slot, { group: `shared-${index}`, animation: 150 });
                    });
                });

                startPhaseTimer(10, finishSentencePhase); // 10 мин на предложения
            }

            const reviewWrapper = document.getElementById('sentenceReviewWrapper');
            if (reviewWrapper) reviewWrapper.style.display = 'none';
            wrapper.style.display = 'flex';

            updateSentenceUI();
        }

        function updateSentenceUI() {
            document.getElementById('taskCounterLabel').textContent = `Writing | Question ${currentSentenceIndex + 1} of ${sentencesData.length}`;
            
            // Toggle visibility
            sentencesData.forEach((_, i) => {
                const c = document.getElementById(`sentence-container-${i}`);
                if (c) c.style.display = i === currentSentenceIndex ? 'flex' : 'none';
            });

            // Настройка кнопок
            navReview.style.display = 'flex';
            navReview.onclick = showSentenceReview;
            
            navBack.style.visibility = currentSentenceIndex === 0 ? 'hidden' : 'visible';
            navBack.onclick = () => { currentSentenceIndex--; updateSentenceUI(); };
            
            navNext.style.display = 'block';
            if (currentSentenceIndex === sentencesData.length - 1) {
                // На последнем вопросе предлагаем перейти к следующей части
                navNext.innerHTML = "Next &gt;";
                navNext.onclick = finishSentencePhase; 
            } else {
                navNext.innerHTML = "Next &gt;";
                navNext.onclick = () => { currentSentenceIndex++; updateSentenceUI(); };
            }
        }

        function isSentenceComplete(index) {
            const slots = document.querySelectorAll(`[id^="slot-${index}-"]`);
            for (let slot of slots) { if (slot.children.length === 0) return false; }
            return true;
        }

        function getSentenceAnswer(index) {
            let parts = [];
            (sentencesData[index].structure || []).forEach((item, sIndex) => {
                if (item.type === 'text') parts.push(item.value);
                else if (item.type === 'slot') {
                    const s = document.getElementById(`slot-${index}-${sIndex}`);
                    parts.push(s && s.children.length > 0 ? s.children[0].textContent.trim() : "____");
                }
            });
            return parts.join(" ").replace(/\s+([.?!])/g, "$1").trim() + ".";
        }

        function showSentenceReview() {
            currentPhase = 'sentence-review';
            document.getElementById('taskCounterLabel').textContent = "Writing | Review";

            navReview.style.display = 'none'; // Скрываем кнопку review
            navBack.style.visibility = 'visible';
            navBack.onclick = () => { initPhaseSentence(); }; // Возврат к предложению
            
            navNext.innerHTML = "Next Section &gt;";
            navNext.onclick = finishSentencePhase;

            document.getElementById('sentencesWrapper').style.display = 'none';

            let reviewDiv = document.getElementById('sentenceReviewWrapper');
            if (!reviewDiv) {
                reviewDiv = document.createElement('div');
                reviewDiv.id = 'sentenceReviewWrapper';
                reviewDiv.className = 'w-full max-w-4xl mx-auto p-8 flex flex-col flex-1';
                dynamicTaskArea.appendChild(reviewDiv);
            }

            let listHTML = sentencesData.map((s, i) => `
                <div class="flex justify-between items-center px-4 py-3 bg-white border border-gray-200 mb-2 rounded cursor-pointer hover:bg-gray-50 transition" onclick="returnToSentence(${i})">
                    <span class="font-semibold text-slate-700">Question ${i + 1}</span>
                    ${isSentenceComplete(i) ? `<span class="text-sm font-bold text-slate-500">Answered</span>` : `<span class="text-sm font-bold text-rose-500">Not Answered</span>`}
                </div>
            `).join('');

            reviewDiv.innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-6 text-center">Review Your Answers</h2>
                <div class="flex-1 overflow-y-auto">${listHTML}</div>
            `;
            reviewDiv.style.display = 'flex';
        }

        window.returnToSentence = function(i) {
            currentSentenceIndex = i;
            initPhaseSentence(); 
        };

        async function finishSentencePhase() {
            // Сохраняем ответы
            sentencesData.forEach((q, i) => {
                userResponses.push({ task_id: q.id, task_type: 'sentence', response_content: getSentenceAnswer(i), user_id: currentUser.id });
            });
            
            if(document.getElementById('sentencesWrapper')) document.getElementById('sentencesWrapper').style.display = 'none';
            if(document.getElementById('sentenceReviewWrapper')) document.getElementById('sentenceReviewWrapper').style.display = 'none';

            initPhaseEmail();
        }

        // ==========================================
        // PHASE 2: EMAIL
        // ==========================================
        function initPhaseEmail() {
            currentPhase = 'email';
            document.getElementById('taskCounterLabel').textContent = "Writing | Email Task";
            
            navReview.style.display = 'none';
            navBack.style.visibility = 'hidden'; // Назад в другую секцию нельзя
            navNext.innerHTML = "Next &gt;";
            navNext.onclick = finishEmailPhase;

            let instr = (emailData.instructions || []).map(li => `<li class="mb-1">${li}</li>`).join('');
            dynamicTaskArea.innerHTML = `
                <div class="flex flex-col md:flex-row h-full w-full">
                    <!-- Left Sidebar (Instructions) -->
                    <div class="w-full md:w-[45%] p-8 bg-white border-r border-gray-200 overflow-y-auto">
                        <h2 class="text-lg font-bold mb-4 text-slate-900">${emailData.title || 'Email Writing'}</h2>
                        <p class="text-sm text-slate-700 leading-relaxed mb-6">${emailData.prompt_context}</p>
                        
                        <div class="bg-gray-50 p-5 rounded border border-gray-200">
                            <h3 class="text-sm font-bold text-slate-900 mb-2">Write an email to ${emailData.meta_to || 'Recipient'}. In the email:</h3>
                            <ul class="list-disc pl-5 text-sm text-slate-700 space-y-1">${instr}</ul>
                        </div>
                    </div>
                    
                    <!-- Right Sidebar (Editor) -->
                    <div class="w-full md:w-[55%] bg-gray-100 flex flex-col relative">
                        <!-- Pseudo Header -->
                        <div class="bg-white px-6 py-4 border-b border-gray-300 text-sm shrink-0">
                            <div class="flex justify-between items-center mb-2">
                                <div><span class="font-bold text-slate-500 w-16 inline-block">To:</span> <span class="font-semibold text-slate-900">${emailData.meta_to || 'Recipient'}</span></div>
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-wide">Word Count: <span id="emailWordCount" class="text-slate-900">0</span></span>
                            </div>
                            <div><span class="font-bold text-slate-500 w-16 inline-block">Subject:</span> <span class="font-semibold text-slate-900">${emailData.meta_subject || 'Topic'}</span></div>
                        </div>
                        <textarea id="emailResponse" class="exam-textarea flex-1 p-6 text-sm text-slate-800 w-full h-full bg-white" spellcheck="false"></textarea>
                    </div>
                </div>
            `;
            setupWordCounter('emailResponse', 'emailWordCount');
            startPhaseTimer(10, finishEmailPhase); // 10 мин на email
        }

        async function finishEmailPhase() {
            const ans = document.getElementById('emailResponse') ? document.getElementById('emailResponse').value.trim() : "";
            userResponses.push({ task_id: emailData.id, task_type: 'email', response_content: ans, user_id: currentUser.id });
            initPhaseAcademic();
        }

        // ==========================================
        // PHASE 3: ACADEMIC
        // ==========================================
        function initPhaseAcademic() {
            currentPhase = 'academic';
            document.getElementById('taskCounterLabel').textContent = "Writing | Academic Discussion";
            
            navReview.style.display = 'none';
            navBack.style.visibility = 'hidden';
            navNext.innerHTML = "Submit";
            navNext.onclick = submitSimulation;

            let peersHTML = (academicData.peers || []).map(p => `
                <div class="bg-white p-4 rounded border border-gray-200 flex gap-4 shrink-0 shadow-sm">
                    <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-lg shrink-0 border border-gray-200">${p.avatar || '👤'}</div>
                    <div>
                        <p class="text-xs font-bold text-slate-500 mb-1">${p.name}</p>
                        <p class="text-sm text-slate-800 leading-relaxed">${p.text}</p>
                    </div>
                </div>
            `).join('');

            dynamicTaskArea.innerHTML = `
                <div class="flex flex-col md:flex-row h-full w-full">
                    <!-- Left Sidebar (Instructions) -->
                    <div class="w-full md:w-[50%] p-8 bg-white border-r border-gray-200 overflow-y-auto">
                        <div class="mb-6 p-4 bg-gray-50 border border-gray-200 rounded text-sm text-slate-800 leading-relaxed">
                            ${academicData.instruction_box || 'Your professor is teaching a class on sociology. Write a post responding to the professor\'s question.'}
                        </div>
                        
                        <div class="flex gap-4 shrink-0 mb-8">
                            <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-2xl shrink-0 border border-gray-200">${academicData.professor_avatar || '👨‍🏫'}</div>
                            <div>
                                <p class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">${academicData.professor_name || 'Professor'}</p>
                                <div class="text-sm text-slate-800 leading-relaxed font-semibold">${academicData.professor_prompt || ''}</div>
                            </div>
                        </div>
                        
                        <h3 class="text-sm font-bold text-slate-900 mb-4 border-b pb-2">Discussion:</h3>
                        <div class="flex flex-col gap-4 shrink-0">
                            ${peersHTML}
                        </div>
                    </div>
                    
                    <!-- Right Sidebar (Editor) -->
                    <div class="w-full md:w-[50%] bg-gray-100 flex flex-col">
                        <div class="bg-white px-6 py-3 border-b border-gray-300 flex justify-between items-center shrink-0">
                            <span class="text-xs font-bold text-slate-500 uppercase">Your Response</span>
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-wide">Word Count: <span id="academicWordCount" class="text-slate-900">0</span></span>
                        </div>
                        <textarea id="academicResponse" class="exam-textarea flex-1 p-6 text-sm text-slate-800 w-full h-full bg-white shadow-inner" spellcheck="false"></textarea>
                    </div>
                </div>
            `;
            setupWordCounter('academicResponse', 'academicWordCount');
            startPhaseTimer(10, submitSimulation); // 10 мин на Academic
        }

        // ==========================================
        // SUBMIT
        // ==========================================
        async function submitSimulation() {
            clearInterval(timerInterval);
            navNext.disabled = true;
            navNext.innerHTML = "Submitting...";
            
            const ans = document.getElementById('academicResponse') ? document.getElementById('academicResponse').value.trim() : "";
            userResponses.push({ task_id: academicData.id, task_type: 'academic', response_content: ans, user_id: currentUser.id });
            
            try {
                const { error } = await supabaseClient.from('student_responses').insert(userResponses);
                if (error) throw error;
                
                document.querySelector('header').classList.add('hidden');
                document.getElementById('examContainer').classList.add('hidden');
                document.getElementById('successScreen').classList.replace('hidden', 'flex');
            } catch (err) {
                console.error(err);
                alert("Error submitting. Please try again.");
                navNext.disabled = false;
                navNext.innerHTML = "Submit";
            }
        }

        // Защита от случайного закрытия
        window.onbeforeunload = () => (currentPhase !== 'success' && !document.getElementById('examContainer').classList.contains('hidden')) ? "Your progress will be lost." : null;
        document.addEventListener('DOMContentLoaded', checkAuthAndLoad);
    </script>
</body>
</html>
