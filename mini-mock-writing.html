<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini-Mock Simulation — TOEFL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        html, body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; 
            overscroll-behavior: none; 
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        
        .exam-textarea { resize: none; outline: none; font-family: inherit; }
        .word-slot { min-width: 90px; min-height: 40px; transition: all 0.2s; }
        .sortable-ghost { opacity: 0.2; background-color: #f1f5f9; border: 2px dashed #94a3b8; color: transparent; }
    </style>
</head>
<body class="bg-[#f3f4f6] text-slate-800 antialiased flex flex-col opacity-0 transition-opacity duration-200" id="mainBody">

    <!-- Top Navigation -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shrink-0 shadow-sm z-50" id="topHeader">
        <div class="flex items-center gap-4">
            <a href="mini-mock-writing-list.html" id="exitBtn" class="text-sm font-bold text-gray-400 hover:text-slate-700 transition flex items-center">
                <i data-lucide="x" class="w-4 h-4 mr-1"></i> Exit Mock
            </a>
            <div class="h-4 w-px bg-gray-200"></div>
            <span class="text-sm font-bold text-slate-900" id="taskCounterLabel">Preparing...</span>
        </div>
        
        <div class="flex items-center gap-3">
            <button id="navReview" class="hidden text-sm font-bold text-indigo-600 bg-indigo-50 px-4 py-1.5 rounded-lg hover:bg-indigo-100 transition shadow-sm border border-indigo-100">
                Review
            </button>
            <button id="navBack" class="hidden text-sm font-bold text-slate-600 bg-white border border-gray-300 px-4 py-1.5 rounded-lg hover:bg-gray-50 transition shadow-sm">
                Back
            </button>
            <button id="navNext" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-1.5 rounded-lg text-sm font-bold transition shadow-sm flex items-center">
                <span id="navNextText">Next</span> <i data-lucide="arrow-right" class="w-4 h-4 ml-1.5" id="navNextIcon"></i>
            </button>
            
            <div class="flex items-center gap-2 bg-slate-900 text-white px-4 py-1.5 rounded-lg font-mono text-lg font-bold shadow-sm ml-2 transition-all duration-300" id="timerBadge">
                <i data-lucide="clock" class="w-4 h-4 text-indigo-400"></i>
                <span id="timeLeft">00:00</span>
            </div>
        </div>
    </header>

    <!-- Main Exam Area -->
    <main class="flex-1 overflow-hidden flex justify-center p-4 md:p-6" id="examContainer">
        <div class="w-full max-w-6xl flex flex-col h-full bg-white rounded-3xl border border-gray-200 shadow-sm overflow-hidden relative">
            <div id="dynamicTaskArea" class="flex flex-col flex-1 overflow-hidden w-full h-full">
                <!-- Задания рендерятся сюда -->
            </div>
        </div>
    </main>

    <!-- Success Screen (Контейнер для финального экрана) -->
    <main id="successScreen" class="hidden flex-1 flex items-center justify-center p-4 h-full">
        <!-- Сюда JS вставит две кнопки после успешной отправки -->
    </main>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let mockData = null;
        
        let sentencesData = [];
        let emailData = null;
        let academicData = null;
        
        let currentPhase = 'sentence'; 
        let currentSentenceIndex = 0;
        let userResponses = [];
        
        let timerInterval;

        const dynamicTaskArea = document.getElementById('dynamicTaskArea');
        const navReview = document.getElementById('navReview');
        const navBack = document.getElementById('navBack');
        const navNext = document.getElementById('navNext');
        const navNextText = document.getElementById('navNextText');
        const navNextIcon = document.getElementById('navNextIcon');
        const timerBadge = document.getElementById('timerBadge');

        async function checkAuthAndLoad() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) return window.location.replace('index.html');
                
                currentUser = session.user;
                document.getElementById('mainBody').classList.remove('opacity-0');
                
                const mockId = new URLSearchParams(window.location.search).get('id');
                if (!mockId) return window.location.replace('mini-mock-writing-list.html');
                
                await loadMockData(mockId);
            } catch (err) {
                console.error(err);
            }
        }

        async function loadMockData(mockId) {
            try {
                const { data: mock } = await supabaseClient.from('mini_mock_writing').select('*').eq('id', mockId).single();
                mockData = mock;

                const { data: firstSentence } = await supabaseClient.from('writing_tasks').select('test_id').eq('id', mock.sentence_task_id).single();
                const targetTestId = (firstSentence && firstSentence.test_id) ? firstSentence.test_id : mock.sentence_task_id;

                const [sentencesRes, emailRes, academicRes] = await Promise.all([
                    supabaseClient.from('writing_tasks').select('*').eq('type', 'sentence').eq('test_id', targetTestId).order('id'),
                    supabaseClient.from('writing_tasks').select('*').eq('id', mock.email_task_id).single(),
                    supabaseClient.from('writing_tasks').select('*').eq('id', mock.academic_task_id).single()
                ]);

                sentencesData = sentencesRes.data || [];
                emailData = emailRes.data;
                academicData = academicRes.data;

                // Парсим JSON
                sentencesData.forEach(q => {
                    if (typeof q.structure === 'string') q.structure = JSON.parse(q.structure);
                    if (typeof q.bank === 'string') q.bank = JSON.parse(q.bank);
                });
                if (typeof emailData.instructions === 'string') emailData.instructions = JSON.parse(emailData.instructions);
                if (typeof academicData.peers === 'string') academicData.peers = JSON.parse(academicData.peers);

                initPhaseSentence();
            } catch (err) {
                console.error(err);
                alert("Error loading test data.");
            }
        }

        // Подсчёт слов как на реальном TOEFL / в стандартных текстовых редакторах:
        // считаем токены, разделённые пробелами, без исключения артиклей и без разрыва
        // слов с апострофом (don't = 1 слово, а не 2).
        function countWords(text) {
            const trimmed = (text || '').trim();
            if (!trimmed) return 0;
            return trimmed.split(/\s+/).length;
        }

        function setupWordCounter(textareaId, counterId) {
            const textarea = document.getElementById(textareaId);
            const counter = document.getElementById(counterId);
            if (textarea && counter) {
                textarea.addEventListener('input', () => { counter.textContent = countWords(textarea.value); });
            }
        }

        // ==========================================
        // TIMER LOGIC
        // ==========================================
        function startPhaseTimer(minutes, timeoutCallback) {
            clearInterval(timerInterval);
            timerBadge.classList.remove('hidden'); 
            
            let seconds = minutes * 60;
            const display = document.getElementById('timeLeft');
            display.classList.remove('text-red-400');

            timerInterval = setInterval(() => {
                seconds--;
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                display.textContent = `${m}:${s}`;
                
                if (seconds <= 60) display.classList.add('text-red-400');
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    timeoutCallback(); 
                }
            }, 1000);
        }

        // ==========================================
        // PHASE 1: SENTENCES
        // ==========================================
        function initPhaseSentence() {
            currentPhase = 'sentence';
            
            navReview.classList.remove('hidden');
            navNext.classList.remove('hidden');
            navNext.classList.replace('bg-emerald-500', 'bg-indigo-600');
            navNext.classList.replace('hover:bg-emerald-600', 'hover:bg-indigo-700');
            navNextIcon.classList.remove('hidden');
            
            let wrapper = document.getElementById('sentencesWrapper');
            
            if (!wrapper) {
                dynamicTaskArea.innerHTML = `<div id="sentencesWrapper" class="w-full h-full flex flex-col flex-1 overflow-y-auto"></div>`;
                wrapper = document.getElementById('sentencesWrapper');
                
                sentencesData.forEach((q, index) => {
                    let sentenceHTML = '';
                    (q.structure || []).forEach((item, sIndex) => {
                        if (item.type === 'text') {
                            sentenceHTML += `<div class="inline-flex shrink-0 px-1.5 py-2 text-sm font-bold text-slate-800 whitespace-nowrap">${item.value}</div>`;
                        } else if (item.type === 'slot') {
                            sentenceHTML += `<div class="word-slot inline-flex shrink-0 items-center justify-center border-b-2 border-gray-300 mx-1 pb-1 align-bottom" id="slot-${index}-${sIndex}"></div>`;
                        }
                    });

                    const div = document.createElement('div');
                    div.id = `sentence-container-${index}`;
                    div.className = `w-full flex-1 flex flex-col items-center justify-center p-4 md:p-8 overflow-y-auto`;
                    div.style.display = index === 0 ? 'flex' : 'none';
                    
                    let bankWords = [...(q.bank || [])].sort(() => Math.random() - 0.5);
                    let bankHTML = bankWords.map(word => `<div class="bg-white border border-gray-200 text-slate-700 text-sm font-bold px-4 py-2 rounded-xl shadow-sm cursor-grab select-none hover:border-indigo-300 transition">${word}</div>`).join('');

                    div.innerHTML = `
                        <div class="w-full max-w-3xl space-y-8 mb-12 bg-gray-50 p-6 md:p-8 rounded-3xl border border-gray-100 shadow-sm mt-4 shrink-0">
                            <div class="flex items-start space-x-4">
                                <div class="w-10 h-10 bg-blue-50 border rounded-full flex items-center justify-center text-lg shrink-0">${q.avatar_left || '👨‍🏫'}</div>
                                <div class="bg-white border rounded-2xl px-5 py-3 text-sm text-slate-700 mt-1 shadow-sm font-medium">${q.prompt_context}</div>
                            </div>
                            <div class="flex items-start space-x-4 pt-4 border-t border-dashed border-gray-200">
                                <div class="w-10 h-10 bg-rose-50 border rounded-full flex items-center justify-center text-lg shrink-0">${q.avatar_right || '👩‍🏫'}</div>
                                <div class="flex-1 flex flex-nowrap items-end gap-y-3 pt-1 pb-2 overflow-x-auto">${sentenceHTML}<span class="shrink-0 text-2xl font-bold text-slate-400 select-none ml-1 align-bottom leading-none">${getEndPunctuation(q)}</span></div>
                            </div>
                        </div>
                        <div class="w-full max-w-2xl mx-auto shrink-0 pb-10">
                            <div class="flex flex-wrap justify-center gap-2.5 bg-gray-50 border border-gray-200 p-5 rounded-3xl min-h-[80px]" id="bank-${index}">${bankHTML}</div>
                        </div>
                    `;
                    wrapper.appendChild(div);

                    new Sortable(div.querySelector(`#bank-${index}`), { group: `shared-${index}`, animation: 150 });
                    div.querySelectorAll(`[id^="slot-${index}-"]`).forEach(slot => {
                        new Sortable(slot, { 
                            group: {
                                name: `shared-${index}`,
                                put: function (to) {
                                    return to.el.children.length === 0;
                                }
                            }, 
                            animation: 150 
                        });
                    });
                });

                startPhaseTimer(6, finishSentencePhase);
            }

            const reviewWrapper = document.getElementById('sentenceReviewWrapper');
            if (reviewWrapper) reviewWrapper.style.display = 'none';
            wrapper.style.display = 'flex';

            updateSentenceUI();
        }

        function updateSentenceUI() {
            document.getElementById('taskCounterLabel').textContent = `Question ${currentSentenceIndex + 1} of ${sentencesData.length} (Sentence Build)`;
            
            sentencesData.forEach((_, i) => {
                const c = document.getElementById(`sentence-container-${i}`);
                if (c) c.style.display = i === currentSentenceIndex ? 'flex' : 'none';
            });

            if (currentSentenceIndex === 0) {
                navBack.classList.add('hidden');
            } else {
                navBack.classList.remove('hidden');
                navBack.onclick = () => { currentSentenceIndex--; updateSentenceUI(); };
            }
            
            if (currentSentenceIndex === sentencesData.length - 1) {
                navNextText.textContent = "Next Part";
                navNext.onclick = finishSentencePhase; 
            } else {
                navNextText.textContent = "Next";
                navNext.onclick = () => { currentSentenceIndex++; updateSentenceUI(); };
            }
            
            navReview.onclick = showSentenceReview;
        }

        function isSentenceComplete(index) {
            const slots = document.querySelectorAll(`[id^="slot-${index}-"]`);
            for (let slot of slots) {
                if (slot.children.length === 0) return false;
            }
            return true;
        }

        // Определяет верный финальный знак препинания на основе sample_answer задания
        // (может быть "." или "?" или "!"), вместо того чтобы всегда считать, что это точка.
        function getEndPunctuation(q) {
            const sample = (q.sample_answer || '').trim();
            const lastChar = sample.slice(-1);
            return ['.', '?', '!'].includes(lastChar) ? lastChar : '.';
        }

        function getSentenceAnswer(index) {
            const q = sentencesData[index];
            let parts = [];
            (q.structure || []).forEach((item, sIndex) => {
                if (item.type === 'text') parts.push(item.value);
                else if (item.type === 'slot') {
                    const s = document.getElementById(`slot-${index}-${sIndex}`);
                    parts.push(s && s.children.length > 0 ? s.children[0].textContent.trim() : "____");
                }
            });
            // Схлопываем случайные двойные пробелы (могут возникать, если у отдельных
            // text-сегментов структуры уже были пробелы по краям — в браузере это незаметно,
            // но ломает точное сравнение строк при проверке ответа) и убираем пробел перед
            // конечной пунктуацией.
            let sentence = parts.join(" ")
                .replace(/\s+/g, " ")
                .replace(/\s+([.?!])/g, "$1")
                .trim();

            if (!['.', '?', '!'].includes(sentence.slice(-1))) {
                sentence += getEndPunctuation(q);
            }
            return sentence;
        }

        function showSentenceReview() {
            currentPhase = 'sentence-review';
            document.getElementById('taskCounterLabel').textContent = "Review Sentences";

            navReview.classList.add('hidden');
            navBack.classList.remove('hidden');
            navBack.onclick = initPhaseSentence; 
            
            navNextText.textContent = "Next Part";
            navNext.onclick = finishSentencePhase;

            document.getElementById('sentencesWrapper').style.display = 'none';

            let reviewDiv = document.getElementById('sentenceReviewWrapper');
            if (!reviewDiv) {
                reviewDiv = document.createElement('div');
                reviewDiv.id = 'sentenceReviewWrapper';
                reviewDiv.className = 'p-4 md:p-8 max-w-3xl mx-auto w-full h-full flex flex-col flex-1 overflow-y-auto';
                dynamicTaskArea.appendChild(reviewDiv);
            }

            let listHTML = sentencesData.map((s, i) => `
                <div class="flex justify-between items-center p-4 hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-0 transition" onclick="returnToSentence(${i})">
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-500">${i+1}</span>
                        <span class="font-bold text-slate-700">Sentence ${i + 1}</span>
                    </div>
                    ${isSentenceComplete(i) 
                        ? `<span class="text-emerald-500 bg-emerald-50 px-3 py-1 rounded-lg font-bold text-xs flex items-center"><i data-lucide="check" class="w-3 h-3 mr-1"></i> Complete</span>` 
                        : `<span class="text-rose-500 bg-rose-50 px-3 py-1 rounded-lg font-bold text-xs flex items-center"><i data-lucide="alert-circle" class="w-3 h-3 mr-1"></i> Incomplete</span>`}
                </div>
            `).join('');

            reviewDiv.innerHTML = `
                <h2 class="text-2xl font-black text-slate-900 mb-6 text-center">Section 1 Review</h2>
                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden flex-1 shrink-0">
                    ${listHTML}
                </div>
            `;
            reviewDiv.style.display = 'flex';
            lucide.createIcons();
        }

        window.returnToSentence = function(i) {
            currentSentenceIndex = i;
            initPhaseSentence(); 
        };

        async function finishSentencePhase() {
            sentencesData.forEach((q, i) => {
                userResponses.push({
                    task_id: q.id,
                    task_type: 'sentence',
                    response_content: getSentenceAnswer(i),
                    user_id: currentUser.id
                });
            });
            
            showPhaseTransition();
        }

        // ==========================================
        // TRANSITION SCREEN
        // ==========================================
        function showPhaseTransition() {
            currentPhase = 'transition';
            
            navReview.classList.add('hidden');
            navBack.classList.add('hidden');
            navNext.classList.add('hidden');
            timerBadge.classList.add('hidden');
            clearInterval(timerInterval);

            document.getElementById('taskCounterLabel').textContent = "Section Transition";

            dynamicTaskArea.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-6 bg-slate-50 w-full h-full">
                    <div class="w-full max-w-xl bg-white rounded-3xl p-10 text-center border border-gray-200 shadow-sm">
                        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6 border border-indigo-100 shadow-inner">
                            <i data-lucide="pen-tool" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-3xl font-black text-slate-900 mb-3">Writing Section</h2>
                        <p class="text-slate-500 mb-8 max-w-md mx-auto text-[15px] leading-relaxed">
                            You have successfully completed the <b>Sentence Building</b> tasks. <br><br>
                            Next, you will write an <b>Email</b> and participate in an <b>Academic Discussion</b>. Each of these tasks will have its own time limit.
                        </p>
                        <button onclick="initPhaseEmail()" class="inline-flex bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3.5 rounded-xl text-sm font-bold transition shadow-sm items-center">
                            Start Writing Tasks <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // ==========================================
        // PHASE 2: EMAIL
        // ==========================================
        function initPhaseEmail() {
            currentPhase = 'email';
            
            navNext.classList.remove('hidden'); 
            navNextText.textContent = "Next Task";
            navNext.onclick = finishEmailPhase;
            
            document.getElementById('taskCounterLabel').textContent = "Task 1 of 2 (Email)";
            
            let instr = (emailData.instructions || []).map(li => `<li>${li}</li>`).join('');
            dynamicTaskArea.innerHTML = `
                <div class="flex flex-col md:flex-row h-full divide-y md:divide-y-0 md:divide-x divide-gray-200 w-full">
                    <div class="w-full md:w-1/2 p-6 overflow-y-auto bg-white">
                        <h2 class="text-xl font-bold mb-4 text-slate-900">${emailData.title || 'Email Writing'}</h2>
                        <p class="text-sm text-slate-700 leading-relaxed">${emailData.prompt_context}</p>
                        <hr class="my-6 border-gray-100">
                        <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                            <h3 class="text-sm font-bold uppercase tracking-wide text-indigo-900">Write an email to ${emailData.meta_to || 'Recipient'}. In the email:</h3>
                            <ul class="list-disc pl-5 text-sm text-indigo-800 mt-3 space-y-1.5">${instr}</ul>
                        </div>
                    </div>
                    <div class="w-full md:w-1/2 p-6 bg-slate-50 flex flex-col">
                        <div class="bg-white border border-gray-200 rounded-2xl flex flex-col h-full shadow-sm overflow-hidden min-h-[300px]">
                            <div class="bg-gray-50 border-b border-gray-200 px-5 py-4 text-sm flex justify-between items-center shrink-0">
                                <div>
                                    <p><span class="font-bold text-gray-400">To:</span> <span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded font-semibold ml-1">${emailData.meta_to || 'Recipient'}</span></p>
                                    <p class="mt-2"><span class="font-bold text-gray-400">Subject:</span> <span class="font-semibold text-slate-700 ml-1">${emailData.meta_subject || 'Topic'}</span></p>
                                </div>
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100">Words: <span id="emailWordCount">0</span></span>
                            </div>
                            <textarea id="emailResponse" placeholder="Write your email here..." class="exam-textarea flex-1 p-5 text-sm text-slate-700 w-full h-full"></textarea>
                        </div>
                    </div>
                </div>
            `;
            setupWordCounter('emailResponse', 'emailWordCount');
            startPhaseTimer(7, finishEmailPhase); 
        }

        async function finishEmailPhase() {
            const ans = document.getElementById('emailResponse') ? document.getElementById('emailResponse').value.trim() : "";
            userResponses.push({
                task_id: emailData.id,
                task_type: 'email',
                response_content: ans,
                user_id: currentUser.id
            });
            initPhaseAcademic();
        }

        // ==========================================
        // PHASE 3: ACADEMIC
        // ==========================================
        function initPhaseAcademic() {
            currentPhase = 'academic';
            
            navReview.classList.add('hidden');
            navBack.classList.add('hidden');
            
            navNextText.textContent = "Submit Simulation";
            navNextIcon.classList.add('hidden');
            navNext.classList.replace('bg-indigo-600', 'bg-emerald-500');
            navNext.classList.replace('hover:bg-indigo-700', 'hover:bg-emerald-600');
            navNext.onclick = submitSimulation;
            
            document.getElementById('taskCounterLabel').textContent = "Task 2 of 2 (Academic Discussion)";

            let peersHTML = (academicData.peers || []).map(p => `
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex gap-4 shrink-0">
                    <div class="w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center text-lg shrink-0 border border-indigo-100">${p.avatar || '👤'}</div>
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase mb-1">${p.name}</p>
                        <p class="text-sm text-slate-700 leading-relaxed">${p.text}</p>
                    </div>
                </div>
            `).join('');

            dynamicTaskArea.innerHTML = `
                <div class="flex flex-col md:flex-row h-full divide-y md:divide-y-0 md:divide-x divide-gray-200 w-full">
                    <div class="w-full md:w-1/2 p-6 overflow-y-auto bg-white">
                        <h2 class="text-xl font-bold mb-4 text-slate-900">${academicData.title || 'Academic Discussion'}</h2>
                        <div class="bg-teal-50 text-teal-900 p-4 rounded-xl text-sm font-medium mb-6 border border-teal-100 leading-relaxed">
                            ${academicData.instruction_box || ''}
                        </div>
                        <div class="bg-gray-50 p-5 rounded-2xl border border-gray-200 flex gap-4 shrink-0">
                            <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-2xl shrink-0 border border-gray-200 shadow-sm">${academicData.professor_avatar || '👨‍🏫'}</div>
                            <div>
                                <p class="text-xs font-black text-slate-500 uppercase tracking-wide mb-1.5">${academicData.professor_name || 'Professor'}</p>
                                <div class="text-sm text-slate-800 leading-relaxed font-medium">${academicData.professor_prompt || ''}</div>
                            </div>
                        </div>
                    </div>
                    <div class="w-full md:w-1/2 p-6 bg-slate-50 flex flex-col gap-4 overflow-y-auto">
                        <div class="flex flex-col gap-4 shrink-0">
                            ${peersHTML}
                        </div>
                        <div class="bg-white border border-gray-200 rounded-2xl flex flex-col mt-4 flex-1 min-h-[300px] shadow-sm overflow-hidden">
                            <div class="flex justify-between items-center bg-gray-50 px-4 py-3 border-b border-gray-200 shrink-0">
                                <span class="text-xs font-black text-slate-400 uppercase tracking-wide">TOEFL Editor</span>
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100">Words: <span id="academicWordCount">0</span></span>
                            </div>
                            <textarea id="academicResponse" placeholder="Write your contribution here..." class="exam-textarea flex-1 p-5 text-sm text-slate-700 w-full h-full"></textarea>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
            setupWordCounter('academicResponse', 'academicWordCount');
            startPhaseTimer(10, submitSimulation); 
        }

        // ==========================================
        // SUBMIT AND SHOW SUCCESS SCREEN
        // ==========================================
        async function submitSimulation() {
            navNext.disabled = true;
            navNextText.innerHTML = `<span class="animate-pulse">Submitting...</span>`;
            
            const ans = document.getElementById('academicResponse') ? document.getElementById('academicResponse').value.trim() : "";
            userResponses.push({
                task_id: academicData.id,
                task_type: 'academic',
                response_content: ans,
                user_id: currentUser.id
            });
            
            try {
                // 1. Создаем попытку
                const { data: attempt, error: attemptError } = await supabaseClient
                    .from('mini_mock_writing_attempts')
                    .insert([{ user_id: currentUser.id, mock_id: mockData.id }])
                    .select()
                    .single();

                if (attemptError) throw attemptError;

                // 2. Привязываем attempt_id
                const responsesWithAttempt = userResponses.map(resp => ({
                    ...resp,
                    attempt_id: attempt.id
                }));

                // 3. Отправляем ответы
                const { error: responsesError } = await supabaseClient
                    .from('mini_mock_writing_responses')
                    .insert(responsesWithAttempt);
                    
                if (responsesError) throw responsesError;
                
                // 4. Показываем обновленный экран с двумя кнопками
                document.getElementById('examContainer').classList.add('hidden');
                document.querySelector('header').classList.add('hidden');
                
                const successScreen = document.getElementById('successScreen');
                successScreen.classList.replace('hidden', 'flex');
                
                successScreen.innerHTML = `
                    <div class="w-full max-w-2xl bg-white rounded-3xl p-10 text-center border border-gray-100 shadow-lg">
                        <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-2xl flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="check-circle-2" class="w-10 h-10"></i>
                        </div>
                        <h2 class="text-2xl font-black text-slate-900 mb-2">Simulation Complete!</h2>
                        <p class="text-gray-500 mb-8 max-w-md mx-auto">All responses have been successfully saved to the database.</p>
                        <div class="flex flex-col sm:flex-row justify-center gap-4">
                            <a href="mini-mock-writing-list.html" class="inline-flex justify-center bg-gray-100 hover:bg-gray-200 text-slate-700 px-6 py-3.5 rounded-xl text-sm font-bold transition shadow-sm items-center">
                                Dashboard
                            </a>
                            <a href="mini-mock-results.html?attempt_id=${attempt.id}" class="inline-flex justify-center bg-slate-900 hover:bg-slate-800 text-white px-8 py-3.5 rounded-xl text-sm font-bold transition shadow-sm items-center">
                                View Full Review <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                            </a>
                        </div>
                    </div>
                `;
                lucide.createIcons();
                
            } catch (err) {
                console.error("Full error object:", err);
                alert("Error submitting. Please try again.\n" + (err.message || JSON.stringify(err)));
                navNext.disabled = false;
                navNextText.textContent = "Submit Simulation";
            }
        }

        window.onbeforeunload = () => (currentPhase !== 'success' && !document.getElementById('examContainer').classList.contains('hidden')) ? "Warning" : null;
        document.addEventListener('DOMContentLoaded', checkAuthAndLoad);
    </script>
</body>
</html>
