<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Results — TOEFL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .correction-box { white-space: pre-wrap; }
    </style>
</head>
<body class="bg-[#f3f4f6] text-slate-800 antialiased opacity-0 transition-opacity duration-200" id="mainBody">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <a href="mini-mock-writing-list.html" class="text-sm font-bold text-gray-400 hover:text-slate-700 transition flex items-center">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> Back to Dashboard
            </a>
            <div class="h-4 w-px bg-gray-200"></div>
            <h1 class="text-sm font-bold text-slate-900" id="headerTitle">Simulation Results</h1>
        </div>
        
        <div id="statusBadgeWrap" class="hidden flex items-center gap-3">
            <div id="rawScoreBadge" class="text-xs font-bold px-3 py-1.5 rounded-lg border bg-slate-50 text-slate-600 border-slate-200"></div>
            <div id="statusBadge" class="text-sm font-bold px-4 py-1.5 rounded-lg border"></div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-8 space-y-8" id="resultsContainer">
        <!-- Индикатор загрузки -->
        <div id="loadingIndicator" class="text-center py-20 text-gray-400 font-bold animate-pulse">Loading results...</div>
        
        <!-- Контент -->
        <div id="contentArea" class="hidden space-y-10">
            <!-- Sentences Section -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-black text-slate-900 flex items-center"><i data-lucide="list-checks" class="w-5 h-5 mr-2 text-indigo-500"></i> Part 1: Sentence Building</h2>
                </div>
                <div id="sentencesResults" class="space-y-4"></div>
            </section>

            <!-- Email Section -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-black text-slate-900 flex items-center"><i data-lucide="mail" class="w-5 h-5 mr-2 text-indigo-500"></i> Part 2: Email Writing</h2>
                    <div id="emailScore" class="hidden inline-flex items-center justify-center bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg border border-indigo-200 font-bold text-sm shadow-sm"></div>
                </div>
                <div id="emailResult" class="bg-white rounded-3xl border border-gray-200 shadow-sm overflow-hidden"></div>
            </section>

            <!-- Academic Section -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-black text-slate-900 flex items-center"><i data-lucide="graduation-cap" class="w-5 h-5 mr-2 text-emerald-500"></i> Part 3: Academic Discussion</h2>
                    <div id="academicScore" class="hidden inline-flex items-center justify-center bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-lg border border-emerald-200 font-bold text-sm shadow-sm"></div>
                </div>
                <div id="academicResult" class="bg-white rounded-3xl border border-gray-200 shadow-sm overflow-hidden"></div>
            </section>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initResults() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) return window.location.replace('index.html');
                
                document.getElementById('mainBody').classList.remove('opacity-0');
                
                const urlParams = new URLSearchParams(window.location.search);
                const attemptId = urlParams.get('attempt_id');
                
                if (!attemptId) {
                    document.getElementById('loadingIndicator').textContent = 'Attempt ID is missing in URL.';
                    return;
                }

                await loadAttemptData(attemptId);
            } catch (err) {
                console.error(err);
                document.getElementById('loadingIndicator').textContent = 'Error loading results.';
            }
        }

        async function loadAttemptData(attemptId) {
            // 1. Загружаем данные попытки
            const { data: attempt, error: attemptError } = await supabaseClient
                .from('mini_mock_writing_attempts')
                .select('*')
                .eq('id', attemptId)
                .single();

            if (attemptError || !attempt) {
                console.error('Error fetching attempt:', attemptError);
                document.getElementById('loadingIndicator').textContent = 'Failed to load results (Attempt not found).';
                return;
            }

            // Загружаем заголовок мока
            let mockTitle = 'Simulation Results';
            if (attempt.mock_id) {
                const { data: mock } = await supabaseClient
                    .from('mini_mock_writing')
                    .select('title')
                    .eq('id', attempt.mock_id)
                    .single();
                if (mock && mock.title) mockTitle = mock.title;
            }
            attempt.mockTitle = mockTitle;

            // 2. Загружаем ответы пользователя
            const { data: responses, error: respError } = await supabaseClient
                .from('mini_mock_writing_responses')
                .select('*')
                .eq('attempt_id', attemptId);

            if (respError) {
                console.error('Error fetching responses:', respError);
                document.getElementById('loadingIndicator').textContent = 'Failed to load student responses.';
                return;
            }

            // 3. Подтягиваем карточки заданий из writing_tasks
            const taskIds = (responses || []).map(r => r.task_id).filter(Boolean);
            let tasksMap = {};
            
            if (taskIds.length > 0) {
                const { data: tasks } = await supabaseClient
                    .from('writing_tasks')
                    .select('*')
                    .in('id', taskIds);
                    
                if (tasks) {
                    tasks.forEach(t => { tasksMap[t.id] = t; });
                }
            }

            // Объединяем ответы с данными заданий
            const fullResponses = (responses || []).map(r => ({
                ...r,
                task: tasksMap[r.task_id] || null
            }));

            // Считаем автоматический балл
            const autoCalculatedScore = calculateOverallScore(fullResponses);

            renderStatus(attempt, autoCalculatedScore);
            renderSentences(fullResponses.filter(r => r.task_type === 'sentence'));
            renderEssay(fullResponses.find(r => r.task_type === 'email'), 'emailResult', 'emailScore');
            renderEssay(fullResponses.find(r => r.task_type === 'academic'), 'academicResult', 'academicScore');

            document.getElementById('loadingIndicator').classList.add('hidden');
            document.getElementById('contentArea').classList.remove('hidden');
        }

        // Нормализует текст для сравнения: убирает регистр, схлопывает повторяющиеся
        // пробелы и обрезает пробелы по краям (двойные пробелы могут появляться из-за
        // склейки частей предложения и визуально незаметны в браузере, но ломают точное
        // сравнение строк).
        function normalizeForCompare(text) {
            return (text || '').toLowerCase().replace(/\s+/g, ' ').trim();
        }

        function calculateOverallScore(responses) {
            // 1. Build a Sentence — считается автоматически (точное совпадение) и
            // переводится в диапазон 1.0–6.0 линейно — так же, как это уже сделано
            // для Reading/Listening мини-моков на этой платформе.
            const sentenceResponses = responses.filter(r => r.task_type === 'sentence');
            let correctSentences = 0;
            sentenceResponses.forEach(r => {
                const correct = r.task?.sample_answer || '';
                const user = r.response_content || r.answer || '';
                if (user && correct && normalizeForCompare(user) === normalizeForCompare(correct)) {
                    correctSentences += 1;
                }
            });
            const totalSentences = sentenceResponses.length;

            let sentenceBand = null;
            if (totalSentences > 0) {
                const ratio = correctSentences / totalSentences;
                sentenceBand = Math.min(6, Math.max(1, Math.round((1 + ratio * 5) * 2) / 2));
            }

            // 2. Email + Academic — балл выставляет учитель вручную по шкале 1.0–6.0
            // за каждое задание (та же шкала, что и для обычных эссе на платформе).
            // Берём среднее из того, что уже проверено.
            const email = responses.find(r => r.task_type === 'email');
            const academic = responses.find(r => r.task_type === 'academic');
            const essayScores = [email, academic]
                .map(r => (r && r.score !== null && r.score !== undefined && r.score !== '') ? parseFloat(r.score) : null)
                .filter(s => s !== null && !isNaN(s));
            const essayBand = essayScores.length > 0
                ? essayScores.reduce((sum, s) => sum + s, 0) / essayScores.length
                : null;

            // 3. Итог: Build a Sentence весит 50%, Email+Academic — 50%.
            // Если какая-то из половин ещё не оценена — показываем то, что уже есть,
            // а не занижаем балл искусственным нулём за непроверенную часть.
            let overallBand = null;
            if (sentenceBand !== null && essayBand !== null) {
                overallBand = sentenceBand * 0.5 + essayBand * 0.5;
            } else if (sentenceBand !== null) {
                overallBand = sentenceBand;
            } else if (essayBand !== null) {
                overallBand = essayBand;
            }
            if (overallBand !== null) {
                overallBand = Math.min(6, Math.max(1, Math.round(overallBand * 2) / 2));
            }

            return {
                sentenceRawLabel: `${correctSentences}/${totalSentences}`,
                sentenceBand,
                essayBand,
                overallBand,
                fullyGraded: sentenceBand !== null && essayBand !== null
            };
        }

        function renderStatus(attempt, autoResult) {
            document.getElementById('headerTitle').textContent = attempt.mockTitle;

            const badgeWrap = document.getElementById('statusBadgeWrap');
            const rawBadge = document.getElementById('rawScoreBadge');
            const badge = document.getElementById('statusBadge');
            badgeWrap.classList.remove('hidden');
            badgeWrap.classList.add('flex');

            // Raw-балл по Build a Sentence — всегда показываем отдельно, он объективный
            rawBadge.innerHTML = `<i data-lucide="list-checks" class="w-3.5 h-3.5 inline mr-1 -mt-0.5"></i> Sentence: ${autoResult.sentenceRawLabel}`;

            // Если учитель выставил финальный балл вручную в attempts — используем его,
            // иначе показываем расчёт по формуле 50% Sentence + 50% Email/Academic
            const hasManualOverall = attempt.overall_score !== null && attempt.overall_score !== undefined;
            const displayBand = hasManualOverall
                ? Number(attempt.overall_score).toFixed(1)
                : (autoResult.overallBand !== null ? autoResult.overallBand.toFixed(1) : '—');

            if (attempt.status === 'reviewed') {
                badge.className = 'text-sm font-bold px-4 py-1.5 rounded-lg border bg-emerald-50 text-emerald-600 border-emerald-200 flex items-center';
                badge.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 mr-1.5"></i> Reviewed (Overall: ${displayBand} / 6.0)`;
            } else {
                const label = autoResult.fullyGraded ? 'Current Score' : 'Est. Score (partial)';
                badge.className = 'text-sm font-bold px-4 py-1.5 rounded-lg border bg-amber-50 text-amber-600 border-amber-200 flex items-center';
                badge.innerHTML = `<i data-lucide="clock" class="w-4 h-4 mr-1.5"></i> Pending Teacher Review (${label}: ${displayBand} / 6.0)`;
            }
            lucide.createIcons();
        }

        function renderSentences(sentenceResponses) {
            const container = document.getElementById('sentencesResults');
            if (!sentenceResponses.length) {
                container.innerHTML = '<p class="text-gray-500">No sentence building responses found.</p>';
                return;
            }

            container.innerHTML = sentenceResponses.map((r, i) => {
                // Правильный ответ теперь берется из колонки sample_answer
                const correctAns = r.task?.sample_answer || '';
                // Ответ ученика из базы
                const userAns = r.response_content || r.answer || ''; 
                // Убираем регистр и пробелы по бокам для правильного сравнения
                const isCorrect = userAns && correctAns && normalizeForCompare(userAns) === normalizeForCompare(correctAns);
                
                return `
                    <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm">
                        <div class="flex items-start justify-between mb-3">
                            <div class="text-sm font-bold text-slate-400">Sentence ${i + 1}</div>
                            ${isCorrect 
                                ? `<span class="bg-emerald-50 text-emerald-500 px-2 py-1 rounded text-xs font-bold border border-emerald-100">Exact Match</span>`
                                : `<span class="bg-rose-50 text-rose-500 px-2 py-1 rounded text-xs font-bold border border-rose-100">Needs Review</span>`
                            }
                        </div>
                        <div class="mb-4">
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-1">Your Answer</p>
                            <p class="text-slate-800 font-medium ${!isCorrect ? 'text-rose-600' : ''}">${userAns || '-'}</p>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-3 border border-gray-100">
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-1">Correct Structure (Sample Answer)</p>
                            <p class="text-slate-600 font-medium">${correctAns || 'Not specified in database'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPromptHTML(task, taskType) {
            if (!task) return '';

            if (taskType === 'email') {
                let instructions = task.instructions || [];
                if (typeof instructions === 'string') {
                    try { instructions = JSON.parse(instructions); } catch(e) { instructions = []; }
                }
                let instrList = Array.isArray(instructions) 
                    ? instructions.map(i => `<li>${i}</li>`).join('') 
                    : '';

                return `
                    <div class="bg-slate-50 border-b border-gray-200 p-6 space-y-3">
                        <div class="flex items-center gap-2 text-xs font-black text-indigo-500 uppercase tracking-wider">
                            <i data-lucide="file-question" class="w-4 h-4"></i> Task Prompt & Instructions
                        </div>
                        ${task.prompt_context ? `<p class="text-sm text-slate-700 font-medium leading-relaxed">${task.prompt_context}</p>` : ''}
                        
                        <div class="bg-white rounded-xl p-4 border border-gray-200 text-xs space-y-2 shadow-sm">
                            <div class="flex flex-wrap gap-4 text-slate-500 font-semibold border-b border-gray-100 pb-2.5">
                                <span><strong class="text-slate-800">To:</strong> ${task.meta_to || 'Recipient'}</span>
                                <span class="text-gray-300">|</span>
                                <span><strong class="text-slate-800">Subject:</strong> ${task.meta_subject || 'Topic'}</span>
                            </div>
                            ${instrList ? `<ul class="list-disc pl-4 space-y-1 text-slate-700 font-medium pt-1">${instrList}</ul>` : ''}
                        </div>
                    </div>
                `;
            }

            if (taskType === 'academic') {
                let peers = task.peers || [];
                if (typeof peers === 'string') {
                    try { peers = JSON.parse(peers); } catch(e) { peers = []; }
                }
                let peersHTML = Array.isArray(peers) ? peers.map(p => `
                    <div class="bg-white p-3 rounded-xl border border-gray-200 text-xs shadow-sm flex items-start gap-2.5">
                        <span class="text-base leading-none shrink-0">${p.avatar || '👤'}</span>
                        <div>
                            <span class="font-bold text-slate-800 block mb-0.5">${p.name}</span>
                            <span class="text-slate-600 leading-relaxed">${p.text}</span>
                        </div>
                    </div>
                `).join('') : '';

                return `
                    <div class="bg-slate-50 border-b border-gray-200 p-6 space-y-3">
                        <div class="flex items-center gap-2 text-xs font-black text-emerald-600 uppercase tracking-wider">
                            <i data-lucide="file-question" class="w-4 h-4"></i> Task Prompt & Discussion
                        </div>
                        
                        ${task.instruction_box ? `<div class="bg-emerald-50 text-emerald-900 border border-emerald-100 p-3.5 rounded-xl text-xs font-medium leading-relaxed">${task.instruction_box}</div>` : ''}
                        
                        <div class="bg-white p-4 rounded-xl border border-gray-200 text-xs flex items-start gap-3 shadow-sm">
                            <div class="text-2xl shrink-0">${task.professor_avatar || '👨‍🏫'}</div>
                            <div>
                                <div class="font-bold text-slate-800 uppercase text-[11px] tracking-wider mb-1">${task.professor_name || 'Professor'}</div>
                                <div class="text-slate-700 leading-relaxed font-medium">${task.professor_prompt || ''}</div>
                            </div>
                        </div>

                        ${peersHTML ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">${peersHTML}</div>` : ''}
                    </div>
                `;
            }

            return '';
        }

        function renderEssay(response, containerId, scoreId) {
            const container = document.getElementById(containerId);
            if (!response) {
                container.innerHTML = '<div class="p-6 text-gray-500">No response recorded.</div>';
                return;
            }

            // Выводим балл за конкретное эссе в мини-квадратик
            if (response.score !== undefined && response.score !== null) {
                const scoreBadge = document.getElementById(scoreId);
                scoreBadge.classList.remove('hidden');
                scoreBadge.classList.add('flex'); // Обеспечиваем отображение flex-элемента
                
                const formattedScore = Number(response.score).toFixed(1);
                
                if (response.raw_score !== undefined && response.raw_score !== null) {
                    scoreBadge.innerHTML = `<span class="opacity-60 text-xs font-semibold mr-2 pr-2 border-r border-current">Raw: ${response.raw_score}</span><span>Score: ${formattedScore} / 6.0</span>`;
                } else {
                    scoreBadge.textContent = `Score: ${formattedScore} / 6.0`;
                }
            }

            const promptHTML = renderPromptHTML(response.task, response.task_type);

            container.innerHTML = `
                <div class="flex flex-col">
                    <!-- Задание (Prompt) -->
                    ${promptHTML}

                    <!-- Ответ ученика и Поле проверки учителя -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-gray-200">
                        <div class="p-6 bg-slate-50/50">
                            <h3 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-4 flex items-center">
                                <i data-lucide="file-text" class="w-4 h-4 mr-1.5"></i> Your Response
                            </h3>
                            <div class="bg-white border border-gray-200 rounded-xl p-5 text-sm text-slate-700 leading-relaxed shadow-sm min-h-[200px] whitespace-pre-wrap">${response.response_content || response.answer || 'No text submitted.'}</div>
                        </div>
                        
                        <div class="p-6 bg-white flex flex-col">
                            <h3 class="text-xs font-black text-indigo-400 uppercase tracking-wider mb-4 flex items-center">
                                <i data-lucide="pen-tool" class="w-4 h-4 mr-1.5"></i> Teacher's Correction & Feedback
                            </h3>
                            ${response.teacher_correction 
                                ? `<div class="correction-box bg-indigo-50 border border-indigo-100 rounded-xl p-5 text-sm text-indigo-900 leading-relaxed flex-1 shadow-inner">${response.teacher_correction}</div>`
                                : `<div class="flex-1 border-2 border-dashed border-gray-100 rounded-xl flex items-center justify-center flex-col text-gray-400 p-8 text-center">
                                     <i data-lucide="clock" class="w-8 h-8 mb-2 opacity-50"></i>
                                     <p class="text-sm font-medium">Your teacher hasn't reviewed this task yet.</p>
                                   </div>`
                            }
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', initResults);
    </script>
</body>
</html>
