        { q: "What genres or types of music do you usually enjoy listening to? For example, do you prefer classical, rock or jazz music? Give details to explain your answer.",
          lx: ["genre", "lyrics", "catchy"],
          model: "[A] I mostly listen to indie rock, but I also enjoy film soundtracks and some jazz. [R] I like indie rock because the **lyrics** are often meaningful and the bands are less commercial. Film soundtracks are perfect for studying because they have no words. [E] For example, my favorite band writes songs about growing up and friendship, and I learned many of their songs on the guitar. When I write essays, I listen to soundtracks from fantasy movies — they make even boring topics feel epic! And on Sunday mornings, my dad and I listen to old jazz records. [C] So my taste depends on my mood and activity.",
          model5: "[A] My go-to **genre** is indie rock, though I also love film soundtracks and, thanks to my father, a bit of jazz. [R] What draws me to indie rock is its honest, often poetic **lyrics** and the fact that the bands feel less manufactured than mainstream pop. Soundtracks, meanwhile, are ideal for studying, since there are no words to distract me. [E] My favorite band, for instance, writes about growing up and friendship, and I've learned half their songs on the guitar. When I'm writing essays, epic fantasy soundtracks make even the dullest topic feel dramatic. And on Sunday mornings at home, my dad and I still listen to his old jazz records. [C] So my taste is fairly eclectic, shaped by both my mood and the people around me." },
        { q: "Can you tell me about a concert or live music event you would like to attend? Why would you make that particular choice?",
          lx: ["live music", "atmosphere", "a once-in-a-lifetime"],
          model: "[A] I would love to go to a big summer music festival in Europe, like Glastonbury in England. [R] I've only been to small concerts in my city, so I want to experience a huge festival with many bands, thousands of people and an amazing atmosphere. [E] For example, I've watched videos of Glastonbury, where people camp for five days, dance in the rain and see their favorite artists on different stages. My favorite band played there last year. I'd go with my best friends, and we'd stay until the very last song. [C] So it would be a dream experience for me.",
          model5: "[A] My dream is to attend Glastonbury, the legendary music festival in England. [R] So far, I've only been to small gigs in my city, so I'd love to experience something on a completely different scale: dozens of stages, tens of thousands of people and an **atmosphere** that people describe as unforgettable. [E] I've watched countless clips, for instance, of crowds camping for five days, dancing in the mud and singing every word with their favorite artists. My favorite band actually played there last year, which only made me more determined. Ideally, I'd go with my closest friends and stay right until the final song on the last night. [C] So it would be **a once-in-a-lifetime** experience, and one I'm already saving for." },
        { q: "Some people believe that music can have a powerful effect on our emotions and moods. Do you agree or disagree with this viewpoint? Why?",
          lx: ["mood", "boost your mood", "unwind"],
          model: "[A] I completely agree. [R] Music can change my mood in just a few seconds. Fast music gives me energy, and slow music helps me relax or feel my emotions. [E] For example, I always listen to an energetic playlist when I run, and it helps me run faster. When I'm sad, I listen to calm songs, and it somehow makes me feel better and less alone. Also, one song from my childhood always makes me smile because it reminds me of family trips. [C] So music is a very powerful tool for our emotions.", model5: "[A] I wholeheartedly agree; music affects my mood more quickly than almost anything else. [R] An upbeat track can energize me within seconds, while slower music either calms me down or helps me process what I'm feeling. Music is also strongly tied to memory, so a single song can transport you back years. [E] When I run, for instance, an energetic playlist noticeably improves my pace, whereas on difficult days, quiet songs make me feel understood and less alone. There's also one particular song from my childhood that instantly reminds me of family road trips and never fails to make me smile. [C] So music isn't just entertainment; it's one of our most accessible tools for managing emotions." }
      ]},
    { id: "s116", badge: "official", title: "Experiences with Music", src: "Official TOEFL · 116",
      scenario: "You have agreed to participate in a research study about people's experiences with music. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, how important is music in your life? Why?",
          lx: ["express yourself", "unwind", "bring back memories"],
          model: "[A] Music is extremely important in my life. [R] It helps me relax, gives me energy and helps me **express** feelings that I can't say in words. It's also connected to many of my best memories. [E] For example, after a stressful day, I play the guitar for half an hour, and I feel calm again. Before exams, I listen to my favorite band to feel confident. And when I hear certain songs from summer camp, I immediately remember my old friends. [C] So I can't imagine my life without music.",
          model5: "[A] It's genuinely one of the most important things in my life. [R] Music regulates my mood, gives me energy when I'm flagging and offers a way to **express** feelings I struggle to put into words; on top of that, it's woven into many of my most cherished memories. [E] After a stressful day, for instance, half an hour with my guitar is the most reliable way I know to **unwind**. Before exams, my favorite band's songs act almost like a pep talk. And whenever I hear a particular song from a summer camp years ago, it instantly **brings back memories** of friends I rarely see now. [C] So, quite simply, I can't imagine my life without music." },
        { q: "Now, if you had to choose, would you rather create music yourself or listen to music created by others? Why?",
          lx: ["create", "a work in progress", "appreciate"],
          model: "[A] If I had to choose, I'd rather listen to music created by others. [R] I play the guitar, and I love it, but I'm not very talented, and I can't write songs. Professional musicians create music that moves me much more than my own playing. [E] For example, I once tried to write my own song, but after two hours, I had only one line of lyrics — I completely **drew a blank**. But when I listen to my favorite album, I discover something new every time. Still, playing gives me a special feeling of achievement. [C] So I'd choose listening, but I'd keep playing for fun.",
          model5: "[A] Forced to choose, I'd pick listening, although it would be a painful decision. [R] I love playing the guitar, but I'm realistic about my limits: I play other people's songs reasonably well, yet I have no real gift for composing. Music created by talented artists simply moves me far more deeply than anything I could produce. [E] When I once tried writing a song of my own, for instance, I **drew a** complete **blank** and abandoned it after two hours with a single line of lyrics. My favorite album, by contrast, still reveals new details after a hundred listens. [C] So listening would win, though I'd secretly keep playing, because my own music, however much **a work in progress**, brings a different kind of satisfaction." },
        { q: "Do you think music should be a required part of children's education? Why or why not?",
          lx: ["instrument", "self-expression", "well-rounded"],
          model: "[A] Yes, I think music should be a required part of children's education. [R] Music develops creativity, memory and teamwork, and it can help children who are not good at academic subjects to feel successful. Also, many families can't pay for private lessons. [E] For example, at my primary school, every child learned to play the recorder and sang in the school choir. It was the first time I felt the joy of making music with others, and it's probably why I started the guitar later. My cousin's school stopped music classes, and he says he never had a chance to try. [C] So music lessons give every child an equal chance.",
          model5: "[A] I'm convinced it should be. [R] Music develops creativity, memory and cooperation, and it allows children who struggle academically to discover something they excel at. Crucially, school may be the only place where children from lower-income families ever get to try an **instrument**. [E] At my primary school, for instance, every pupil learned the recorder and sang in the choir, and it was there that I first experienced the joy of making music with others — quite possibly why I picked up the guitar years later. My cousin's school, by contrast, scrapped music classes to save money, and he says he never had the chance to find out whether he had any musical talent. [C] So compulsory music lessons are, above all, a matter of giving every child the same opportunity." },
        { q: "Some people believe that live music has a stronger impact than recorded music. Do you agree or disagree with that? Why or why not?",
          lx: ["live music", "atmosphere", "give sb goosebumps"],
          model: "[A] I agree that live music has a stronger impact. [R] At a concert, you're part of the moment — you hear the music loudly, see the musicians and share the experience with hundreds of people. Recorded music is perfect, but it can't give you that energy. [E] For example, I've listened to my favorite band's songs hundreds of times at home. But when I saw them live in a small club last year and everyone sang the chorus together, it **gave me goosebumps**. I still remember that feeling. [C] So recorded music is great every day, but live music is unforgettable.",
          model5: "[A] I agree; live music has an intensity that recordings can't replicate. [R] At a concert, you're not just hearing music, you're part of a shared moment: the volume, the visible effort of the musicians and the collective energy of the crowd create an **atmosphere** no pair of headphones can match. Recorded music, admittedly, is technically perfect and endlessly accessible. [E] I'd listened to my favorite band's songs hundreds of times, for instance, yet when I finally saw them live in a small club and the entire room sang the chorus back to them, it **gave me goosebumps**. Months later, I can still feel that moment. [C] So recordings are wonderful companions for everyday life, but live music creates memories." }
      ]},
    { id: "s050", badge: "official", title: "Art and Self-Expression", src: "Official TOEFL · 050",
      scenario: "A researcher is studying people's views on art and self-expression. The researcher will ask you some questions about artistic activities.",
      questions: [
        { q: "Do you engage in any artistic activities such as painting or playing music regularly? If so, what do you do? If not, which artistic activity would you like to try if you had the chance?",
          lx: ["play the guitar", "a creative outlet", "take up"],
          model: "[A] Yes, I play the guitar almost every day. [R] It's my main way to relax and be creative. I'm not a professional, but I love learning new songs. I'd also like to try painting one day. [E] For example, every evening, I practice for about half an hour, usually songs by my favorite indie bands. Sometimes my roommate sings, and we play together for friends. As for painting, my best friend paints, and when I watch her, it looks so relaxing that I want to try it too. [C] So music is my art for now, but painting is next on my list.",
          model5: "[A] Yes, I play the guitar most days, and painting is something I'd love to try next. [R] The guitar is my main **creative outlet**: I'm certainly no professional, but learning new songs gives me a real sense of progress and helps me switch off. [E] I practice for roughly half an hour every evening, for instance, usually working through songs by my favorite indie bands, and occasionally my roommate sings along when friends come over. Painting, meanwhile, appeals to me because of my best friend, who paints; watching her lose herself in a canvas for hours makes me want to experience that kind of calm absorption myself. [C] So music is my art form for now, but painting is definitely next on my list." },
        { q: "What kind of art or music do you enjoy the most, and how do you typically experience it, through creation or appreciation?",
          lx: ["appreciate", "exhibition", "creation"],
          model: "[A] I enjoy music the most, and I experience it in both ways — I listen and I play. With visual art, I'm only a viewer. [R] Music is part of my everyday life, but I go to galleries only sometimes. I like photography exhibitions the most because they show real life. [E] For example, I listen to indie rock every day and play some of the songs on my guitar. Last month, I went to a photography exhibition about life in small villages, and I stayed there for two hours. I can't take good photos myself, but I really **appreciate** them. [C] So music I create and enjoy, and art I mostly admire.",
          model5: "[A] Music is what I enjoy most, and I experience it through both listening and playing, whereas with visual art I'm firmly on the **appreciation** side. [R] Music is woven into every day of my life, while galleries are more of an occasional pleasure; when I do go, photography tends to move me most, because it captures real life so directly. [E] I listen to indie rock daily, for instance, and recreate some of those songs on my guitar in the evenings. Last month, meanwhile, I visited a photography **exhibition** documenting life in remote villages and ended up spending two hours there, completely absorbed. I couldn't take photos like that myself, but I can certainly appreciate them. [C] So music is something I both create and consume, while art is something I mainly admire." },
        { q: "If you were creating art or music, would you prefer sharing your work publicly or keeping it private? What influences your decision?",
          lx: ["blow your own trumpet", "get feedback", "audience"],
          model: "[A] I would prefer to keep my work private, or share it only with friends. [R] I'm not very confident, and I'm afraid of negative comments from strangers. Also, I make music for myself, not to be famous. But I understand that sharing can help you improve. [E] For example, I sometimes play the guitar for my friends, and they give me honest, kind **feedback**. But I've never posted a video online. My cousin posted his songs online, and some people wrote rude comments, which made him stop for months. [C] So for now, my music stays private, but maybe I'll share it one day.",
          model5: "[A] For now, I'd keep it largely private, sharing it only with close friends. [R] Partly, that's a confidence issue: I'm wary of harsh comments from strangers. But it's also because I create mainly for my own enjoyment; I don't feel the need to **blow my own trumpet**. That said, I recognize that sharing work publicly is one of the best ways to improve. [E] I occasionally play for friends, for instance, who give me honest but kind **feedback**, yet I've never posted a single video online. My cousin, by contrast, uploaded his songs and received a handful of cruel comments, which discouraged him from playing for months. [C] So my music stays private for the moment, although, with more confidence, I might eventually share it with a wider **audience**." },
        { q: "Some people think art and music can be powerful ways to communicate emotions and ideas that are difficult to express with words. Do you agree or disagree? Why?",
          lx: ["convey", "put feelings into words", "strike a chord"],
          model: "[A] I completely agree. [R] Some feelings are too big or too complicated for words, but a song, a painting or a melody can show them immediately. Art can also communicate across languages and cultures. [E] For example, when my grandfather died, I couldn't talk about my feelings. But one sad song by my favorite band expressed exactly what I felt, and I listened to it again and again. Also, I've seen paintings in museums that made me feel something strong, even though I didn't know anything about them. [C] So art speaks where words can't.",
          model5: "[A] I wholeheartedly agree. [R] Some emotions are too complex or painful to **put into words**, yet a melody or an image can **convey** them almost instantly, and art does so across languages and cultures. [E] When my grandfather passed away, for instance, I found it impossible to talk about how I felt. A melancholy song by my favorite band, however, captured my grief so precisely that I listened to it on repeat for weeks; its lyrics **struck a chord** in a way no conversation could. Similarly, I've stood in front of paintings knowing nothing about their background and still felt deeply moved. [C] So art communicates exactly where words fail, which is perhaps its greatest power." }
      ]},
    { id: "s097", badge: "official", title: "Art and Creativity", src: "Official TOEFL · 097",
      scenario: "You have volunteered for a research study at your university about people's experiences with art and creativity. You will have a short online interview with a researcher.",
      questions: [
        { q: "Do you consider yourself to be a creative person? Why or why not?",
          lx: ["creative", "think outside the box", "a creative outlet"],
          model: "[A] I think I'm creative in some ways, but not in an artistic way. [R] I can't draw or write stories, but I like finding new ideas and solving problems in unusual ways. And music is my **creative outlet**. [E] For example, at my marketing internship, I suggested an idea for funny short videos for a client, and they used two of them. I also play the guitar and sometimes change songs to make my own versions. But when I try to draw, everything looks like a child's picture! [C] So I'm creative with ideas and music, but not with art.",
          model5: "[A] In some ways yes, though not in the traditional artistic sense. [R] I have no talent for drawing or fiction, but I enjoy generating ideas and approaching problems from unexpected angles, and music gives me a genuine **creative outlet**. [E] During my marketing internship, for instance, I pitched an idea for humorous short videos, two of which the client actually used. I also enjoy reworking songs on the guitar into my own slower, acoustic versions. My drawings, on the other hand, still look as though a seven-year-old produced them. [C] So I'd describe myself as creative with ideas and music, but hopeless with a pencil." },
        { q: "Some people think that learning about art is just as important as learning science or math. Do you agree or disagree? Why?",
          lx: ["well-rounded", "creativity", "appreciate"],
          model: "[A] I agree that art is just as important, although schools often treat it as less important. [R] Science and math teach logic, but art teaches creativity, observation and how to express feelings. In the future, creativity will be very important, because AI can do many logical tasks. [E] For example, my art teacher in school taught us to look carefully at the world, and that helped me in many subjects, even in biology. Also, many successful engineers and scientists say that art helped them think creatively. [C] So a good education needs both.",
          model5: "[A] I agree, even though schools rarely treat it that way. [R] Science and math develop logical reasoning, whereas art cultivates creativity, observation and emotional expression — skills that will matter more than ever as AI takes over routine analytical tasks. A truly **well-rounded** education needs both. [E] My art teacher at school, for instance, trained us to observe details closely, a habit that, surprisingly, helped me in biology practicals. Moreover, plenty of innovative engineers and scientists credit artistic training with teaching them to think beyond conventional solutions. [C] So I'd argue that art isn't a luxury subject, but an essential counterpart to the sciences." },
        { q: "Some people believe that engaging in creative activities can improve mental well-being. Do you agree or disagree? Why?",
          lx: ["self-care", "cope with", "sense of accomplishment"],
          model: "[A] I agree that creative activities can improve mental well-being. [R] When you draw, write or play music, you focus on one thing, and your worries disappear for a while. It's also a way to express feelings that are hard to say in words. [E] For example, my best friend started painting during a difficult time after her parents' divorce. She says painting helped her understand her emotions, and now she feels much calmer. Also, finishing a painting gives her a nice feeling of achievement. [C] So creativity can be a kind of therapy.", model5: "[A] I agree, and I think creativity can be genuinely therapeutic. [R] Creative activities demand complete focus, which pushes anxious thoughts aside, and they offer a way to express emotions that are difficult to put into words. On top of that, completing something creative brings a real **sense of accomplishment**. [E] A close friend of mine, for instance, took up painting during a painful period after her parents' divorce. She says it allowed her to process feelings she couldn't talk about, and over several months she became noticeably calmer and more confident. Many of her paintings from that time, she admits, are far from masterpieces, but that was never the point. [C] So creativity can be a powerful form of self-care, whatever the result looks like." },
        { q: "Do you think future schools will teach more art or less? What factors might influence this?",
          lx: ["budget cuts", "creativity", "artificial intelligence (AI)"],
          model: "[A] I'm afraid that schools will probably teach less art, although they should teach more. [R] Many governments focus on test results in math, science and technology, and when budgets are small, art is often the first subject to be cut. But AI may change this, because creative skills will become more valuable. [E] For example, my cousin's school cut art classes from two hours to one hour a week to add more coding. But at the same time, some companies now say they want employees with creative skills that machines don't have. [C] So the future depends on whether schools see creativity as important.",
          model5: "[A] In the short term, I suspect schools will teach less art, although long-term trends may reverse that. [R] Governments tend to prioritize measurable results in math, science and technology, so when budgets are tight, art is usually the first casualty. Paradoxically, however, the rise of AI may make uniquely human creative skills more valuable than ever. [E] My cousin's school, for instance, recently halved its art lessons to make room for coding. Meanwhile, more and more employers are emphasizing creativity and original thinking as precisely the qualities that machines struggle to replicate. [C] So the key factor will be whether policymakers start seeing creativity not as a luxury, but as a core skill for the future." }
      ]},
    { id: "sml", badge: "platform", title: "Music and Listening Habits", src: "Практика платформы",
      scenario: "I'm conducting a study on how people listen to music and the role it plays in their lives. I'd like to ask you a few questions about your personal listening habits and experiences.",
      questions: [
        { q: "What kind of music do you usually enjoy listening to, and how often do you listen to music in a typical day or week? Are there specific times or situations when you're more likely to listen?",
          lx: ["genre", "playlist", "listen to music"],
          model: "[A] I mostly listen to indie rock and film soundtracks, and I listen every day. [R] Music is part of almost every activity in my day, but I choose different music for different situations. [E] For example, when I go running in the morning, I listen to a fast, energetic **playlist**. When I study, I need music without words, so I choose soundtracks. On the bus and in the evening, I listen to my favorite indie bands. On Sundays, I listen to jazz with my dad when I visit my family. [C] So I listen to music all the time, but the type depends on the situation.",
          model5: "[A] I'm mostly into indie rock and film soundtracks, and I listen every day, often for several hours. [R] Music accompanies almost every activity, but I deliberately match the **genre** to the situation. [E] My morning runs, for instance, are powered by a fast, high-energy **playlist**; when I'm studying, I can only focus with instrumental soundtracks, since lyrics distract me; on the bus and in the evenings, it's my favorite indie bands; and whenever I'm home on a Sunday, my dad and I end up listening to his jazz collection. [C] So music is constant in my life, but I treat it almost like a tool, choosing exactly what each moment needs." },
        { q: "What role does music play in your daily routine or personal well-being? And why do you think it's had that kind of impact on you?",
          lx: ["unwind", "boost your mood", "focus"],
          model: "[A] Music helps me control my energy and my mood. [R] I think it's because music affects emotions very quickly — one song can change how I feel in a minute. [E] For example, when I feel tired in the morning, a fast song wakes me up better than coffee. When I'm stressed before an exam, slow music or playing my guitar calms me down. And when I feel sad, a sad song actually helps, because I feel that someone understands me. [C] So music is like a tool I use every day to feel better.",
          model5: "[A] Music essentially acts as my mood regulator throughout the day. [R] I think it's so powerful for me because it bypasses rational thought and works directly on emotions; a single song can shift my state of mind within seconds. [E] On sluggish mornings, for instance, an upbeat track wakes me up more effectively than coffee. Before exams, when anxiety creeps in, slow music, or better still, half an hour on my guitar, helps me **unwind**. And, paradoxically, when I'm feeling low, a melancholy song often comforts me more than a cheerful one, simply because it makes me feel understood. [C] So music is less a background to my day than a tool I use, quite deliberately, to look after my well-being." },
        { q: "These days, a lot of people use streaming platforms like Spotify, Apple Music, or YouTube to explore new music or personalize their listening experience. In your opinion, how have these platforms changed the way people discover and connect with music? Do you think it's had mostly a positive or negative effect?",
          lx: ["streaming platform", "algorithm", "niche"],
          model: "[A] I think streaming platforms have changed music a lot, mostly in a positive way for listeners, but not always for artists. [R] Now we can listen to almost any song in the world for little money, and algorithms help us find new music. But artists earn very little from streaming, and people listen to songs quickly without really connecting to whole albums. [E] For example, I discovered my favorite band because the app recommended one of their songs. But that band says they earn more from selling T-shirts at concerts than from millions of streams. [C] So streaming is great for fans, but not so good for musicians.",
          model5: "[A] They've transformed how we discover music, largely for the better from a listener's perspective, though far less so for artists. [R] Almost the entire history of recorded music is now available for a modest monthly fee, and **algorithms** expose us to **niche** artists we'd never otherwise encounter. On the other hand, artists earn remarkably little per stream, and constant shuffling encourages us to skim songs rather than connect deeply with whole albums. [E] I discovered my favorite band, for instance, purely because an app recommended one of their songs. Yet that same band has openly said they earn more from selling T-shirts at gigs than from millions of streams. [C] So streaming has been a gift to fans, but it urgently needs a fairer model for musicians." },
        { q: "Music is often strongly connected to memory and emotion—sometimes a single song can remind us of a place, a person, or a specific chapter in our lives. Can you think of a time when a particular song helped you through a difficult or meaningful experience? What do you remember most about that moment, and why did the music stand out?",
          lx: ["bring back memories", "strike a chord", "nostalgic"],
          model: "[A] Yes, one song helped me a lot during my first semester at university. [R] I had just moved to a new city, I didn't know anyone, and I felt very homesick and lonely. [E] For example, every evening, I walked around my new neighborhood and listened to one song by my favorite band about leaving home and starting a new life. The **lyrics** felt like they were written for me. I remember the cold air, the city lights and the feeling that I wasn't the only one feeling this way. Now, when I hear it, I feel proud of how far I've come. [C] So that song will always be special to me.",
          model5: "[A] Yes — one particular song carried me through my very first semester at university. [R] I'd just moved to a city where I knew no one, and I was overwhelmed by homesickness and loneliness. [E] Every evening, I'd wander around my unfamiliar neighborhood listening to a track by my favorite band about leaving home and starting over; the lyrics **struck a chord** so precisely that it felt as though they'd been written for me. I still vividly remember the cold air, the blur of city lights and the comforting sense that someone else had felt exactly the same. Nowadays, whenever I hear it, I feel **nostalgic** but also proud of how far I've come. [C] So that song isn't just music to me; it's a chapter of my life." }
      ]}
  ],

      { t: "experience", q: "Tell me about the best concert or live performance you've ever been to.",
        model: "[A] The best concert I've ever been to was my favorite band's show in a small club last year. [R] It was special because the place was tiny, so I was very close to the musicians, and the energy was amazing. [E] For example, there were only about three hundred people, and everyone knew all the songs. In the middle of the concert, the singer came down from the stage and sang one song among the audience. When everyone sang the chorus together, I got goosebumps. The drummer also **stole the show** with a crazy solo. [C] So it was small, but unforgettable.",
        model5: "[A] Without a doubt, my favorite band's gig in a tiny club last year. [R] What made it unforgettable was the intimacy: with barely three hundred people packed in, I was close enough to see the guitarist's fingers on the strings, and the energy in the room was electric. [E] Midway through, for instance, the singer stepped off the stage and performed an acoustic song right in the middle of the crowd, and when everyone sang the chorus back to her, it **gave me goosebumps**. Later, the drummer completely **stole the show** with an outrageous five-minute solo. [C] So it was a small concert, but it **left a lasting impression** that no stadium show has matched.",
        f: ["Big stadium or small club?", "What makes a great performer?"], lx: ["steal the show", "give sb goosebumps", "audience"] },
      { t: "opinion", q: "Concert tickets have become very expensive. Is live music becoming only for rich people?",
        model: "[A] I think big concerts are becoming too expensive for many people, but small concerts are still affordable. [R] Famous artists' tickets now cost hundreds of dollars, especially with resellers. Many students and families can't pay that. But local bands and small clubs are still cheap. [E] For example, my friend wanted to see a famous pop star, but the cheapest ticket was two hundred dollars, so she couldn't go. But every Thursday, a bar near my university has live music for five dollars, and the bands are really good. [C] So big shows are becoming a luxury, but live music isn't only for the rich.",
        model5: "[A] Major concerts are certainly drifting out of reach for many people, although live music as a whole isn't yet a luxury. [R] Ticket prices for global stars have soared, particularly with resale platforms inflating them further, so students and families are increasingly priced out. Smaller venues and local bands, however, remain remarkably affordable. [E] A friend of mine, for instance, desperately wanted to see a famous pop star, but the cheapest ticket was two hundred dollars, so she watched clips online instead. Meanwhile, a bar near my campus hosts live bands every Thursday for five dollars, and some of them are genuinely excellent. [C] So stadium shows may be becoming a privilege, but anyone willing to explore the local scene can still enjoy live music.",
        f: ["Should resellers be banned?", "Would you pay a lot to see your favorite band?"], lx: ["live music", "support local artists", "mainstream"] },
      { t: "compare", q: "Would you rather go to a big music festival or a small concert? Why?",
        model: "[A] I'd rather go to a small concert, although I'd like to try a big festival once. [R] At small concerts, you can see the musicians up close, the sound is better and it's cheaper. Festivals are exciting, but they're crowded, expensive and very tiring. [E] For example, at a small club concert last year, I stood two meters from the stage and even talked to the guitarist after the show. My friend went to a big festival and said she spent half the time in lines for food and toilets. [C] So small concerts are better for me, but a festival is on my dream list.",
        model5: "[A] On balance, I'd choose a small concert, although a major festival remains on my bucket list. [R] Small venues offer intimacy, better sound and lower prices, whereas festivals, for all their excitement, involve huge crowds, high costs and considerable exhaustion. [E] At a club gig last year, for instance, I stood a couple of meters from the stage and even chatted with the guitarist afterwards. A friend who went to a large festival, by contrast, said she spent half the weekend queuing for food and toilets and saw her favorite band only as a tiny figure on a distant screen. [C] So for the music itself, small concerts win, but for the sheer experience, I'd still love to try a festival once.",
        f: ["What would you take to a festival?", "Who is the best live performer you know?"], lx: ["atmosphere", "audience", "live music"] }

        model: "[A] It depends on the music — some music helps me, but songs with words distract me. [R] When there are lyrics, my brain listens to the words instead of reading. But calm instrumental music blocks other noises and helps me concentrate. [E] For example, when I study in the library with soundtracks or classical music, I can focus for an hour or more. But once I tried to write an essay while listening to my favorite band, and I wrote the same sentence three times because I was singing along! [C] So instrumental music, yes — favorite songs, no.",
        model5: "[A] It depends entirely on the type of music. [R] Songs with lyrics compete with whatever I'm reading or writing, since my brain can't resist processing the words. Calm instrumental music, on the other hand, masks background noise and creates a kind of focus bubble. [E] When I study in the library with film soundtracks or classical piano, for instance, I can concentrate comfortably for over an hour. Yet when I once tried writing an essay to my favorite band's new album, I caught myself typing the same sentence three times, because I kept singing along. [C] So instrumental music is a study aid for me, whereas my favorite songs are strictly a reward for afterwards.",

      { t: "opinion", q: "Does someone's music taste say something about their personality?",

        model5: "[A] It offers a few clues, but it's far from a reliable guide. [R] The music we're drawn to can reflect our moods, our values and the communities we belong to, yet people often turn out to be surprisingly different from what their playlists suggest. [E] My roommate, for instance, adores heavy metal, so people often assume she's aggressive, when in reality she's the gentlest, most patient person I know; for her, metal is simply a release. A friend who's obsessed with jazz, by contrast, really is an imaginative dreamer, which does seem to fit his taste. [C] So music taste can hint at someone's personality, but judging people by their playlists is risky.",

    { icon: "phone", title: "Стриминг и музыкальная индустрия", en: "Streaming & the industry", questions: [

      { t: "opinion", q: "Should people pay for music, or is it fine to listen for free online?",
        model: "[A] I think people should pay for music if they can, because artists need to earn money. [R] Creating music takes a lot of time and work, and if nobody pays, many talented musicians can't continue. But free music online also helps new artists find fans. [E] For example, I pay for a music streaming subscription, and when I really love a band, I buy their T-shirt or a concert ticket, because I know they earn more that way. My friend downloads music illegally, and I think that's unfair to the artists. [C] So listen for free sometimes, but support the artists you love.",
        model5: "[A] I believe people should pay, at least for the artists they genuinely love. [R] Creating music demands enormous time and skill, and if nobody pays, many talented musicians simply can't afford to continue. Free access does help unknown artists build an audience, admittedly, but it shouldn't be the only way we engage with them. [E] I pay for a streaming subscription, for instance, but whenever I really love a band, I also buy merchandise or concert tickets, since I know that money actually reaches them. A friend of mine, by contrast, still downloads music illegally, which strikes me as deeply unfair to the people creating it. [C] So free listening is fine for discovery, but loyalty to artists should come with real support.",
        f: ["How do musicians earn money today?", "Have you ever bought a vinyl record?"], lx: ["support local artists", "streaming platform", "niche"] },
      { t: "opinion", q: "AI can now create songs and paintings. Is AI-generated work real art?",
        model: "[A] I don't think AI-generated work is real art in the same way as human art. [R] AI copies patterns from millions of human works, but it doesn't have feelings, experiences or something it wants to say. For me, art is about a person expressing themselves. But AI can be a useful tool for artists. [E] For example, I heard an AI-generated song that sounded like my favorite band. It was technically good, but it felt empty — there was no story behind it. On the other hand, my friend uses AI to get ideas for her paintings, and then she paints them herself. [C] So AI can help art, but it can't replace the artist.",
        model5: "[A] I'd hesitate to call it art in the fullest sense, although it can certainly be a powerful tool. [R] AI generates work by recombining patterns from millions of human creations, but it has no experiences, emotions or intention, and for me, art is fundamentally about a person trying to communicate something. [E] I recently heard an AI-generated song imitating my favorite band, for instance; technically it was impressive, yet it felt strangely hollow, precisely because there was no story or feeling behind it. A friend of mine, by contrast, uses AI to brainstorm compositions and then paints them entirely by hand, which strikes me as a legitimate creative partnership. [C] So AI may assist artists, but it can't replace the human voice that makes art meaningful.",
        f: ["Should AI songs be labeled?", "Who owns AI-created art?"], lx: ["artificial intelligence (AI)", "self-expression", "convey"] },
      { t: "opinion", q: "Many musicians now become famous through social media rather than record labels. Is this a good change?",
        model: "[A] Yes, I think it's mostly a good change. [R] Before, a few record companies decided who became famous. Now, any talented person with a phone can share their music and find fans. But it's also very hard to stand out, and musicians must spend a lot of time making videos instead of music. [E] For example, a girl from my city posted covers on social media, and one video went viral. Now she has her own songs and tours small venues. But I also know musicians who spend more time filming TikToks than writing songs, and they're frustrated. [C] So social media opens doors, but it also creates new pressure.",
        model5: "[A] On the whole, yes, although it brings new pressures of its own. [R] Previously, a handful of record labels effectively decided who got heard; now anyone with talent and a phone can build an audience directly. The flip side is fierce competition and the expectation that musicians become full-time content creators. [E] A girl from my city, for instance, posted acoustic covers online, one of which **went viral**; she now releases her own songs and tours small venues across the country. Yet I also know local musicians who complain that they spend more time filming short videos than actually writing music. [C] So social media has democratized fame, but it has also blurred the line between artist and influencer.",
        f: ["Do you follow any musicians online?", "Would you post your own music?"], lx: ["go viral", "mainstream", "audience"] }
    ]},

      { t: "opinion", q: "Some modern art looks very simple — like a single line or a banana taped to a wall. Can anything be art?",

    { icon: "landmark", title: "Музеи, галереи и город", en: "Museums & public art", questions: [
      { t: "personal", q: "Do you enjoy visiting museums and galleries? Tell me about one you liked.",
        model: "[A] Yes, I enjoy museums, especially small ones and photography galleries. [R] Big museums are often too crowded and tiring, but small galleries are calm, and I can really look at each work. [E] For example, last month I visited a small photography gallery in my city with an exhibition about life in mountain villages. There were only about forty photos, but each one told a story. I stayed for two hours and even bought a postcard of my favorite photo. In big museums, I usually get tired after one hour. [C] So I love museums, but I prefer small ones.",
        model5: "[A] I do, though I much prefer small galleries to vast museums. [R] Major museums are often so crowded and overwhelming that I end up rushing past masterpieces, whereas smaller spaces let me slow down and genuinely engage with each work. [E] Last month, for instance, I visited a modest photography gallery in my city showing an exhibition on life in remote mountain villages. There were only around forty photographs, but each told a complete story, and I happily spent two hours there before buying a postcard of my favorite image. In large museums, by contrast, my attention usually fades within an hour. [C] So I love museums, but for me, less is definitely more.",
        f: ["What's the most famous museum you've visited?", "Are museums boring for young people?"], lx: ["visit a museum", "exhibition", "admire a painting"] },
      { t: "opinion", q: "Should museums and galleries be free for everyone?",
        model: "[A] Yes, I think museums should be free, or at least free on some days. [R] Art and history belong to everyone, not only to people with money. Free entry helps students, families and poorer people learn and enjoy culture. But museums need money, so governments or sponsors should support them. [E] For example, many museums in London are free, and I saw people of all ages and backgrounds there when I visited. In my city, the main museum costs twenty dollars, so many students never go. But on free Sundays, it's full of young people. [C] So free entry makes culture open to everyone.",
        model5: "[A] I believe they should be free, or at the very least offer regular free days. [R] Art and history are part of everyone's heritage, not a privilege for those who can afford a ticket, and free entry encourages students, families and lower-income visitors to engage with culture. Museums do need funding, of course, but that can come from governments, donors and sponsors. [E] Many of London's major museums, for instance, are free, and when I visited, I was struck by how diverse the visitors were. In my city, by contrast, the main museum charges twenty dollars, and most students I know have never been — except on its monthly free Sunday, when it's packed with young people. [C] So free access genuinely opens culture up to everyone.",
        f: ["Would you donate to a museum?", "Should tourists pay more?"], lx: ["visit a museum", "appreciate art", "access"] },
      { t: "opinion", q: "Should governments spend public money on the arts?",
        model: "[A] Yes, I think governments should spend some public money on the arts. [R] Art makes cities more interesting, keeps culture alive and gives young artists a chance. Without support, only commercial art that sells easily would survive. But it shouldn't be more important than hospitals or schools. [E] For example, my city gives small grants to young musicians and painters, and thanks to that, we have free concerts in parks every summer. My friend got a grant for her first exhibition, which she couldn't pay for herself. [C] So a reasonable amount of public money for art is a good investment.",
        model5: "[A] I believe they should, within reasonable limits. [R] Public arts funding keeps cultural traditions alive, enriches city life and gives emerging artists a chance that the commercial market rarely offers; without it, only the most marketable art would survive. Naturally, though, it shouldn't come at the expense of healthcare or education. [E] My city, for instance, awards small grants to young musicians and painters, which is why we enjoy free open-air concerts in the parks every summer. A friend of mine received one such grant to stage her very first exhibition, something she could never have funded herself. [C] So modest public investment in the arts pays back far more than it costs, in culture, community and opportunity.",
        f: ["Which art deserves funding?", "Should famous artists pay more tax?"], lx: ["support local artists", "niche", "community"] },
      { t: "opinion", q: "Is street art and graffiti a form of art or vandalism?",
        model: "[A] I think it depends — some graffiti is real art, and some is just vandalism. [R] When artists paint beautiful murals with permission, they make the city more colorful and interesting. But writing names or tags on buildings without permission damages other people's property. [E] For example, in my city, there's a street where artists painted huge murals about the history of the neighborhood, and now tourists come to take photos. But my grandmother's building is often covered with ugly tags, and she has to pay to clean them. [C] So permission and quality make the difference.",
        model5: "[A] It can be either, depending largely on permission and intention. [R] Commissioned murals can transform dull neighborhoods into vibrant open-air galleries, whereas tags scrawled on private buildings without consent are simply damage that someone else has to pay for. [E] In my city, for instance, one formerly run-down street is now lined with enormous murals depicting the neighborhood's history, and it's become a genuine tourist attraction. My grandmother's apartment block, on the other hand, is regularly covered in meaningless tags, and residents have to pay repeatedly to have them removed. [C] So street art can be a powerful form of public art, but only when it respects the community it appears in.",
        f: ["Should cities give walls to street artists?", "What's the best street art you've seen?"], lx: ["self-expression", "beauty is in the eye of the beholder", "community"] }
    ]},
