<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading MST Logic Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-10 font-sans text-slate-800">

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
        <h1 class="text-2xl font-bold mb-6">Fox Test: Reading Section</h1>
        
        <div id="test-interface" class="space-y-4">
            <p class="text-gray-500">Нажмите кнопку ниже, чтобы загрузить конфиг из "Supabase" и начать тест.</p>
            <button onclick="startReadingSection()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-semibold hover:bg-indigo-700 transition">
                Start Reading Section
            </button>
        </div>
    </div>

    <script>
        // 1. Имитируем ответ от Supabase (наш JSONB)
        const mockTestConfig = {
            threshold: 14,
            stage_1_router: ["task_1", "task_2", "task_3"], // Условно 20 вопросов тут
            stage_2_upper: ["task_hard_1", "task_hard_2"],  // Условно 15 сложных
            stage_2_lower: ["task_easy_1", "task_easy_2"]   // Условно 15 легких
        };

        const interfaceDiv = document.getElementById('test-interface');

        // 2. Функция старта
        function startReadingSection() {
            interfaceDiv.innerHTML = `
                <div class="p-4 bg-blue-50 text-blue-800 rounded-xl border border-blue-100">
                    <h2 class="font-bold">Stage 1: Router Module</h2>
                    <p class="text-sm mt-1">Загружены задания: ${mockTestConfig.stage_1_router.join(', ')}</p>
                    <p class="text-xs text-blue-600 mt-2">Ученик решает 20 вопросов...</p>
                </div>
                <button onclick="simulateStage1Completion()" class="mt-4 bg-slate-900 text-white px-6 py-2 rounded-xl font-semibold hover:bg-slate-800 transition">
                    Завершить Stage 1 (Симуляция)
                </button>
            `;
        }

        // 3. Функция оценки первой стадии и маршрутизации
        function simulateStage1Completion() {
            // Генерируем случайный балл от 10 до 20 для наглядности
            const scoreStage1 = Math.floor(Math.random() * 11) + 10; 
            
            let nextStageHtml = '';
            let nextTasks = [];

            // Самая главная логика развилки!
            if (scoreStage1 >= mockTestConfig.threshold) {
                nextTasks = mockTestConfig.stage_2_upper;
                nextStageHtml = `
                    <div class="p-4 bg-purple-50 text-purple-800 rounded-xl border border-purple-100 mt-4">
                        <h2 class="font-bold">Stage 2: UPPER Module (Hard Path) 🚀</h2>
                        <p class="text-sm mt-1">Балл за Stage 1: <strong>${scoreStage1}/20</strong> (Порог: ${mockTestConfig.threshold})</p>
                        <p class="text-sm mt-1">Загружены задания: ${nextTasks.join(', ')}</p>
                    </div>
                `;
            } else {
                nextTasks = mockTestConfig.stage_2_lower;
                nextStageHtml = `
                    <div class="p-4 bg-amber-50 text-amber-800 rounded-xl border border-amber-100 mt-4">
                        <h2 class="font-bold">Stage 2: LOWER Module (Easy Path) 🐢</h2>
                        <p class="text-sm mt-1">Балл за Stage 1: <strong>${scoreStage1}/20</strong> (Порог: ${mockTestConfig.threshold})</p>
                        <p class="text-sm mt-1">Загружены задания: ${nextTasks.join(', ')}</p>
                    </div>
                `;
            }

            interfaceDiv.innerHTML += nextStageHtml;
            
            // Убираем кнопку симуляции, чтобы не кликать дважды
            document.querySelector('button[onclick="simulateStage1Completion()"]').remove();
        }
    </script>
</body>
</html>
