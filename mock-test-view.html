<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Mock Test Simulator — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Стили для кастомных радио-кнопок */
        .radio-peer:checked + div {
            border-color: #2563eb !important; 
            background-color: #f8fafc !important; 
        }
        .radio-peer:checked + div .radio-circle {
            border-color: #2563eb !important;
            background-color: #2563eb !important;
            box-shadow: inset 0 0 0 2.5px white;
        }
        
        /* Скроллбары для транскриптов */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col">

    <audio id="globalAudio" class="hidden"></audio>

    <header class="bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-sm shrink-0">
        <div class="flex items-center gap-4">
            <a href="listening-mini-mock.html" onclick="return confirm('Are you sure you want to exit? All progress will be lost.')" class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 text-gray-400 hover:text-rose-500 hover:bg-rose-50 transition">
                <i data-lucide="x" class="w-4 h-4"></i>
            </a>
            <div>
                <h1 id="testTitle" class="text-sm font-bold text-slate-900 tracking-tight">Initializing Simulation...</h1>
                <p id="stepIndicator" class="text-[10px] font-bold text-indigo-600 uppercase tracking-wider">Preparing...</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <div id="timerContainer" class="bg-indigo-50 border border-indigo-100 px-4 py-1.5 rounded-lg flex items-center gap-2 text-indigo-700 transition-colors">
                <i data-lucide="timer" class="w-4 h-4"></i>
                <span id="timerDisplay" class="font-bold font-mono text-sm">00:00</span>
            </div>
            <button id="nextBtn" onclick="handleNextStep()" disabled class="bg-slate-100 text-slate-400 text-xs font-bold px-5 py-2.5 rounded-lg transition-all flex items-center cursor-not-allowed">
                Next <i data-lucide="arrow-right" class="w-3.5 h-3.5 ml-1"></i>
            </button>
        </div>
    </header>

    <main id="taskContainer" class="flex-1 w-full max-w-5xl mx-auto px-4 py-8 flex flex-col relative">
        <div class="flex items-center justify-center h-full flex-1">
            <p class="text-slate-400 text-sm font-medium flex items-center gap-2">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Loading test data...
            </p>
        </div>
    </main>

    <script>
        // Безопасная инициализация клиента Supabase
        let db;
        if (typeof supabaseClient !== 'undefined') {
            db = supabaseClient;
        } else if (window.supabaseClient) {
            db = window.supabaseClient;
        } else {
            const fallbackUrl = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
            const fallbackKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
            db = window.supabase.createClient(fallbackUrl, fallbackKey);
        }

        lucide.createIcons();
        
        // --- Архитектура Автомата Состояний ---
        let testQueue = []; 
        let currentBlockIdx = 0; 
        let currentSubQIdx = 0; 
        let currentPhase = 'audio'; 
        
        let timeRemaining = 0; 
        let timerInterval;
        let selectedOptionIndex = null;
        let userAnswers = {}; 
        let testMetadata = {};

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const testId = urlParams.get('id') || '1'; 
            await buildTestQueue(testId);
        });

        // 1. Сборка очереди заданий
        async function buildTestQueue(testId) {
            try {
                let response = await db.from('listening_mock_tests').select('*').eq('id', testId).single();
                
                if (response.error && response.error.message.includes("Could not find the table")) {
                    console.warn("Table listening_mock_tests not found, trying mock_tests_listening...");
                    response = await db.from('mock_tests_listening').select('*').eq('id', testId).single();
                }

                if (response.error || !response.data) throw new Error("Mock test not found in database.");
                
                const mockData = response.data;
                testMetadata = mockData;
                document.getElementById('testTitle').innerText = mockData.title || mockData.name || "Listening Mock Test";

                for (let block of mockData.structure) {
                    if (block.block_type === 'response') {
                        const { data: qData, error: qErr } = await db
                            .from('listening_questions')
                            .select('*')
                            .eq('set_number', block.source_id)
                            .order('id', { ascending: true });

                        if (qErr) console.error("Error fetching response questions:", qErr);

                        if (qData && qData.length > 0) {
                            testQueue.push({
                                block_type: 'response',
                                id: block.source_id,
                                questions: qData
                            });
                        }
                    } else {
                        const { data: taskData, error: taskErr } = await db
                            .from('listening_tests')
                            .select('*')
                            .eq('id', block.source_id)
                            .single();

                        if (taskErr) console.error("Error fetching listening test:", taskErr);

                        if (taskData) {
                            testQueue.push({
                                block_type: block.block_type,
                                id: block.source_id,
                                image_url: taskData.image_url,
                                audio_url: taskData.audio_url,
                                transcript: taskData.transcript,
                                questions: taskData.questions
                            });
                        }
                    }
                }

                if (testQueue.length === 0) {
                    throw new Error("No valid test blocks found for this mock configuration.");
                }
                
                currentBlockIdx = 0;
                currentSubQIdx = 0;
                currentPhase = testQueue[0].block_type === 'response' ? 'questions' : 'audio';
                
                renderCurrentState();

            } catch (err) {
                console.error(err);
                document.getElementById('taskContainer').innerHTML = `
                    <div class="bg-white rounded-2xl border border-rose-200 p-8 text-center max-w-md mx-auto mt-10">
                        <p class="text-rose-600 font-bold mb-2">Error loading test data</p>
                        <p class="text-slate-500 text-xs">${err.message}</p>
                    </div>
                `;
            }
        }

        // Таймер
        function startQuestionTimer(seconds) {
            clearInterval(timerInterval);
            timeRemaining = seconds;
            
            const display = document.getElementById('timerDisplay');
            const container = document.getElementById('timerContainer');
            
            container.className = "bg-indigo-50 border border-indigo-100 px-4 py-1.5 rounded-lg flex items-center gap-2 text-indigo-700 transition-colors";
            
            const updateDisplay = () => {
                const min = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                const sec = (timeRemaining % 60).toString().padStart(2, '0');
                display.innerText = `${min}:${sec}`;
            };
            
            updateDisplay();
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateDisplay();
                
                if (timeRemaining < 5 && timeRemaining > 0) {
                    container.className = "bg-rose-50 border border-rose-100 px-4 py-1.5 rounded-lg flex items-center gap-2 text-rose-600 transition-colors";
                }
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    handleNextStep(); 
                }
            }, 1000);
        }

        // 2. Рендеринг экранов
        function renderCurrentState() {
            const container = document.getElementById('taskContainer');
            const block = testQueue[currentBlockIdx];
            selectedOptionIndex = null;
            
            clearInterval(timerInterval);
            document.getElementById('timerDisplay').innerText = "--:--";
            document.getElementById('timerContainer').className = "bg-indigo-50 border border-indigo-100 px-4 py-1.5 rounded-lg flex items-center gap-2 text-indigo-700 transition-colors";

            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = true;
            nextBtn.className = 'bg-slate-100 text-slate-400 text-xs font-bold px-5 py-2.5 rounded-lg transition-all flex items-center cursor-not-allowed';
            
            document.getElementById('stepIndicator').innerText = `Section ${currentBlockIdx + 1} of ${testQueue.length} — ${block.block_type.toUpperCase()}`;

            const globalAudio = document.getElementById('globalAudio');
            globalAudio.pause();
            globalAudio.onended = null;
            globalAudio.ontimeupdate = null;

            if (block.block_type === 'response') {
                container.innerHTML = getResponseHTML(block, currentSubQIdx);
                initResponseLogic(block.questions[currentSubQIdx]);
            } else {
                if (currentPhase === 'audio') {
                    container.innerHTML = getStandardAudioHTML(block);
                    initStandardAudioLogic(block);
                } else {
                    container.innerHTML = getStandardQuestionsHTML(block, currentSubQIdx);
                    let seconds = (block.block_type === 'academic') ? 30 : 20;
                    startQuestionTimer(seconds);
                }
            }
            lucide.createIcons();
        }

        // --- ШАБЛОНЫ ---
        function getResponseHTML(block, qIdx) {
            return `
                <div class="flex flex-col md:flex-row gap-8 md:gap-12 w-full fade-in h-full">
                    <div class="w-full md:w-1/2 flex flex-col shrink-0">
                        <div class="relative w-full aspect-square md:aspect-[4/3] rounded-3xl overflow-hidden shadow-sm border border-gray-100 bg-white mb-6">
                            <img id="speakerImage" src="" class="w-full h-full object-cover transition-opacity duration-300">
                            <div class="absolute bottom-4 left-4 bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/20 shadow-sm flex items-center">
                                <span class="w-2 h-2 rounded-full bg-indigo-500 mr-2 animate-pulse"></span>
                                <span class="text-[10px] font-bold text-slate-700 uppercase tracking-wider">Question ${qIdx + 1}/${block.questions.length}</span>
                            </div>
                        </div>
                        <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
                            <div class="flex items-center space-x-4">
                                <button id="playBtn" class="w-12 h-12 shrink-0 rounded-full bg-indigo-600 text-white hover:bg-indigo-700 transition shadow-md flex items-center justify-center">
                                    <span id="playIconContainer"><i data-lucide="play" class="w-5 h-5 ml-1"></i></span>
                                </button>
                                <div class="flex-1">
                                    <div class="flex justify-between text-[11px] font-bold text-gray-400 mb-1.5">
                                        <span id="currentTime">0:00</span>
                                        <span id="durationTime">0:00</span>
                                    </div>
                                    <div class="h-2 bg-gray-100 rounded-full overflow-hidden relative">
                                        <div id="progressBar" class="absolute top-0 left-0 h-full bg-indigo-500 w-0 transition-all duration-100 ease-linear"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="w-full md:w-1/2 flex flex-col justify-center">
                        <h2 class="text-xl font-bold text-slate-800 mb-6">Select the best response:</h2>
                        <div id="optionsList" class="space-y-3 opacity-25 pointer-events-none transition-all duration-500 ease-in-out"></div>
                    </div>
                </div>
            `;
        }

        function initResponseLogic(question) {
            document.getElementById('speakerImage').src = question.speaker_image;
            const audioEl = document.getElementById('globalAudio');
            const playBtn = document.getElementById('playBtn');
            const optionsList = document.getElementById('optionsList');
            
            audioEl.src = question.audio_url;
            audioEl.load();

            optionsList.innerHTML = '';
            question.options.forEach((optText, i) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 border-gray-100 bg-white hover:border-indigo-200 hover:bg-indigo-50/50 transition-all text-sm font-medium text-slate-700 flex items-center group shadow-xs';
                btn.innerHTML = `
                    <div class="w-5 h-5 rounded-full border-2 border-gray-200 mr-3 flex items-center justify-center group-hover:border-indigo-400 option-circle shrink-0">
                        <div class="w-2.5 h-2.5 rounded-full bg-indigo-500 opacity-0 scale-50 transition-all option-dot"></div>
                    </div>
                    <span>${optText}</span>
                `;
                btn.onclick = () => {
                    selectedOptionIndex = i;
                    document.querySelectorAll('#optionsList button').forEach(b => {
                        b.classList.remove('border-indigo-500', 'bg-indigo-50');
                        b.classList.add('border-gray-100');
                        b.querySelector('.option-circle').classList.remove('border-indigo-500');
                        b.querySelector('.option-dot').classList.remove('opacity-100', 'scale-100');
                    });
                    btn.classList.remove('border-gray-100');
                    btn.classList.add('border-indigo-500', 'bg-indigo-50');
                    btn.querySelector('.option-circle').classList.add('border-indigo-500');
                    btn.querySelector('.option-dot').classList.add('opacity-100', 'scale-100');
                    enableNextBtn();
                };
                optionsList.appendChild(btn);
            });

            const setPlayIcon = (icon) => document.getElementById('playIconContainer').innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 ${icon==='play'?'ml-1':''}"></i>`;
            
            playBtn.onclick = () => {
                if (audioEl.paused) {
                    audioEl.play().then(() => setPlayIcon('pause')).catch(() => setPlayIcon('play'));
                } else {
                    audioEl.pause();
                    setPlayIcon('play');
                }
                lucide.createIcons();
            };

            audioEl.ontimeupdate = () => {
                const prog = document.getElementById('progressBar');
                if (prog && audioEl.duration) {
                    prog.style.width = `${(audioEl.currentTime / audioEl.duration) * 100}%`;
                }
            };

            audioEl.onended = () => {
                setPlayIcon('play');
                optionsList.classList.remove('opacity-25', 'pointer-events-none');
                optionsList.classList.add('opacity-100');
                lucide.createIcons();
                startQuestionTimer(20); 
            };
            
            setTimeout(() => { audioEl.play().then(() => {setPlayIcon('pause'); lucide.createIcons();}).catch(e=>console.log(e)); }, 500);
        }

        function getStandardAudioHTML(block) {
            return `
                <div class="flex-1 flex flex-col items-center justify-center fade-in h-full">
                    <img src="${block.image_url}" class="w-full max-w-md rounded-xl shadow-sm mb-6 border border-slate-200/60 object-cover aspect-video">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/60 w-full max-w-md text-center shadow-sm">
                        <span class="bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider mb-3 inline-block">Active Listening</span>
                        <p class="text-sm font-bold text-slate-800 mb-4">Listen to the audio track. You cannot pause or skip.</p>
                        <audio id="activeAudioPlayer" class="w-full" controls controlsList="nodownload noplaybackrate"></audio>
                    </div>
                </div>
            `;
        }

        function initStandardAudioLogic(block) {
            const player = document.getElementById('activeAudioPlayer');
            player.src = block.audio_url;
            player.play().catch(e => console.log("Autoplay blocked"));
            
            player.onended = () => {
                currentPhase = 'questions';
                renderCurrentState();
            };
        }

        function getStandardQuestionsHTML(block, qIdx) {
            const question = block.questions[qIdx];
            let optionsHTML = '';
            
            question.options.forEach((opt, idx) => {
                optionsHTML += `
                    <label class="relative block cursor-pointer group">
                        <input type="radio" name="stdOption" value="${idx}" class="peer radio-peer hidden" onchange="enableNextBtn()">
                        <div class="flex items-center p-4 rounded-xl border-2 border-slate-100 group-hover:border-slate-200 transition-colors bg-white shadow-sm">
                            <div class="radio-circle w-4 h-4 rounded-full border-2 border-slate-300 mr-3 shrink-0 transition-all"></div>
                            <span class="text-slate-700 text-sm font-medium select-none">${opt}</span>
                        </div>
                    </label>
                `;
            });

            return `
                <div class="flex flex-col md:flex-row gap-8 w-full max-w-4xl mx-auto fade-in">
                    <div class="md:w-1/3 shrink-0">
                        <div class="sticky top-4">
                            <img src="${block.image_url}" class="w-full rounded-xl border border-slate-200/80 object-cover aspect-video mb-4">
                            <div class="bg-slate-50 text-slate-600 text-xs p-4 rounded-xl font-medium border border-slate-200/80">
                                <span class="font-bold text-slate-800 block mb-1">Question ${qIdx + 1} of ${block.questions.length}</span>
                                Answer based on your notes.
                            </div>
                        </div>
                    </div>
                    <div class="md:w-2/3">
                        <div class="bg-white p-8 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col h-full">
                            <h4 class="text-lg font-bold text-slate-800 mb-6 leading-snug">${question.text}</h4>
                            <div class="space-y-3 flex-1">${optionsHTML}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function enableNextBtn() {
            const btn = document.getElementById('nextBtn');
            btn.disabled = false;
            btn.className = 'bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-5 py-2.5 rounded-lg transition-all shadow-sm flex items-center cursor-pointer';
            
            const block = testQueue[currentBlockIdx];
            const isLastQuestionInBlock = currentSubQIdx === block.questions.length - 1;
            const isLastBlock = currentBlockIdx === testQueue.length - 1;
            
            if (isLastQuestionInBlock && isLastBlock) {
                btn.innerHTML = 'Finish Test <i data-lucide="check-circle" class="w-3.5 h-3.5 ml-1"></i>';
                btn.classList.replace('bg-slate-900', 'bg-emerald-600');
                btn.classList.replace('hover:bg-slate-800', 'hover:bg-emerald-700');
            }
        }

        function handleNextStep() {
            clearInterval(timerInterval);
            const block = testQueue[currentBlockIdx];
            
            if (block.block_type === 'response') {
                userAnswers[block.questions[currentSubQIdx].id] = selectedOptionIndex;
            } else {
                const radio = document.querySelector('input[name="stdOption"]:checked');
                if (radio) {
                    userAnswers[block.questions[currentSubQIdx].id] = parseInt(radio.value);
                } else {
                    userAnswers[block.questions[currentSubQIdx].id] = null; 
                }
            }

            if (currentSubQIdx < block.questions.length - 1) {
                currentSubQIdx++; 
            } else {
                if (currentBlockIdx < testQueue.length - 1) {
                    currentBlockIdx++;
                    currentSubQIdx = 0;
                    currentPhase = testQueue[currentBlockIdx].block_type === 'response' ? 'questions' : 'audio';
                } else {
                    submitTest();
                    return;
                }
            }
            renderCurrentState();
        }

        // 4. Финальный подсчет, сохранение и детальное ревью
        async function submitTest() {
            clearInterval(timerInterval);
            document.querySelector('header').style.display = 'none';
            document.getElementById('taskContainer').innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center fade-in">
                    <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="font-bold text-slate-800">Calculating your score and preparing review...</p>
                </div>
            `;

            let totalQuestions = 0;
            let correctAnswers = 0;

            testQueue.forEach(block => {
                block.questions.forEach(q => {
                    totalQuestions++;
                    const correctIdx = q.correct_index !== undefined ? q.correct_index : q.correct_answer;
                    if (userAnswers[q.id] === correctIdx) {
                        correctAnswers++;
                    }
                });
            });

            // Шкала до 6.0, округление вверх до 0.5
            let proportionalScore = (correctAnswers / totalQuestions) * 6.0;
            let finalCalculatedScore = Math.min(Math.ceil(proportionalScore * 2) / 2, 6.0);

            try {
                const { data: { session } } = await db.auth.getSession();
                if (session?.user) {
                    await db.from('listening_mini_mock_results').insert([{
                        user_id: session.user.id,
                        mock_test_id: testMetadata.id,
                        score_earned: correctAnswers,
                        score_total: totalQuestions,
                        final_calculated_score: finalCalculatedScore,
                        detailed_answers: userAnswers
                    }]);
                }
            } catch (err) {
                console.error("Database save failed:", err);
            }

            setTimeout(() => {
                // Генерируем HTML для каждого блока теста
                let reviewHTML = '';
                
                testQueue.forEach((block, bIdx) => {
                    if (block.block_type === 'response') {
                        // Для Response каждое задание выводим отдельно
                        block.questions.forEach((q, qIdx) => {
                            reviewHTML += buildReviewRow(
                                q.audio_url, 
                                q.transcript, 
                                q.speaker_image || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&q=80&w=600', 
                                [q], 
                                `Section ${bIdx + 1}: Choose a Response (Task ${qIdx + 1})`
                            );
                        });
                    } else {
                        // Для длинных текстов выводим один плеер и список вопросов справа
                        reviewHTML += buildReviewRow(
                            block.audio_url, 
                            block.transcript, 
                            block.image_url || '', 
                            block.questions, 
                            `Section ${bIdx + 1}: ${block.block_type.toUpperCase()}`
                        );
                    }
                });

                document.getElementById('taskContainer').innerHTML = `
                    <div class="w-full fade-in pb-12">
                        <div class="bg-white rounded-2xl border border-emerald-200 p-8 md:p-10 text-center mb-10 shadow-sm max-w-4xl mx-auto">
                            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i data-lucide="check-check" class="w-8 h-8"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-slate-900 mb-2">Simulation Completed!</h2>
                            <p class="text-slate-500 text-sm mb-8">Your answers have been processed and saved.</p>
                            
                            <div class="flex gap-4 mb-8 max-w-lg mx-auto">
                                <div class="flex-1 bg-slate-50 border border-slate-100 rounded-xl p-4">
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Raw Score</p>
                                    <p class="text-xl font-bold text-slate-700">${correctAnswers} / ${totalQuestions}</p>
                                </div>
                                <div class="flex-1 bg-emerald-50 border border-emerald-100 rounded-xl p-4">
                                    <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-wider mb-1">Est. Band</p>
                                    <p class="text-3xl font-extrabold text-emerald-600">${finalCalculatedScore.toFixed(1)} <span class="text-sm font-medium text-emerald-500">/ 6.0</span></p>
                                </div>
                            </div>

                            <a href="listening-mini-mock.html" class="inline-block bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold px-8 py-3.5 rounded-xl transition">Return to Library</a>
                        </div>

                        <div class="max-w-6xl mx-auto mt-12">
                            <h2 class="text-2xl font-extrabold text-slate-900 mb-8 flex items-center">
                                <i data-lucide="list-checks" class="w-7 h-7 mr-3 text-indigo-600"></i> Detailed Test Review
                            </h2>
                            ${reviewHTML}
                        </div>
                    </div>
                `;
                lucide.createIcons();
            }, 800);
        }

        // Функция генерации HTML-блока для ревью (плеер слева, вопросы справа)
        function buildReviewRow(audio_url, transcript, image_url, questions, title) {
            let qsHTML = '';
            
            questions.forEach((q) => {
                const userAns = userAnswers[q.id];
                const correctIdx = q.correct_index !== undefined ? q.correct_index : q.correct_answer;
                const isCorrect = userAns === correctIdx;

                let optionsHTML = '<div class="space-y-2 mt-4">';
                q.options.forEach((opt, oIdx) => {
                    const isUserChoice = (oIdx === userAns);
                    const isRightChoice = (oIdx === correctIdx);

                    let styleClass = "border-slate-100 bg-gray-50 text-gray-500 opacity-60";
                    let icon = `<div class="w-4 h-4 mr-2 shrink-0"></div>`;
                    
                    if (isRightChoice) {
                        styleClass = "border-emerald-200 bg-emerald-50 text-emerald-900 font-medium";
                        icon = `<i data-lucide="check" class="w-4 h-4 text-emerald-600 mt-0.5 mr-2 shrink-0"></i>`;
                    } else if (isUserChoice && !isRightChoice) {
                        styleClass = "border-rose-200 bg-rose-50 text-rose-900";
                        icon = `<i data-lucide="x" class="w-4 h-4 text-rose-500 mt-0.5 mr-2 shrink-0"></i>`;
                    }
                    
                    optionsHTML += `
                        <div class="flex items-start p-2.5 rounded-lg border ${styleClass}">
                            ${icon}
                            <span class="text-sm">${opt}</span>
                        </div>
                    `;
                });
                optionsHTML += '</div>';

                const explanationHTML = q.explanation ? `
                    <div class="mt-4 bg-slate-50 p-4 rounded-xl border border-slate-100 flex gap-3">
                        <i data-lucide="lightbulb" class="w-4 h-4 text-amber-500 shrink-0 mt-0.5"></i>
                        <p class="text-xs text-slate-600 leading-relaxed">${q.explanation}</p>
                    </div>
                ` : '';

                const statusBadge = isCorrect 
                    ? `<span class="text-xs font-extrabold tracking-wide text-emerald-500 uppercase">Correct</span>`
                    : (userAns === null || userAns === undefined)
                        ? `<span class="text-xs font-extrabold tracking-wide text-gray-400 uppercase">Skipped</span>`
                        : `<span class="text-xs font-extrabold tracking-wide text-rose-500 uppercase">Incorrect</span>`;

                qsHTML += `
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/60 shadow-sm mb-6 transition hover:border-slate-300">
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-bold text-slate-800 text-base leading-snug pr-4">${q.text || "Select the best response:"}</h4>
                            <div class="shrink-0 mt-1">${statusBadge}</div>
                        </div>
                        ${optionsHTML}
                        ${explanationHTML}
                    </div>
                `;
            });

            return `
                <div class="mb-12 border-t border-slate-200 pt-8">
                    <h3 class="text-sm font-extrabold text-indigo-900 mb-6 bg-indigo-50 inline-block px-4 py-2 rounded-lg uppercase tracking-wider">${title}</h3>
                    <div class="flex flex-col lg:flex-row gap-8">
                        
                        <div class="lg:w-5/12 shrink-0">
                            <div class="bg-white p-5 rounded-2xl border border-slate-200/60 shadow-sm sticky top-6">
                                ${image_url ? `<img src="${image_url}" class="w-full rounded-xl border border-slate-100 object-cover aspect-video mb-5">` : ''}
                                <audio src="${audio_url}" controls class="w-full mb-2 outline-none"></audio>
                                ${transcript ? `
                                <div class="mt-5 pt-5 border-t border-slate-100">
                                    <h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3 flex items-center">
                                        <i data-lucide="file-text" class="w-3.5 h-3.5 mr-1.5"></i> Audio Transcript
                                    </h4>
                                    <div class="h-64 overflow-y-auto text-sm text-slate-600 leading-relaxed pr-3 whitespace-pre-wrap">${transcript}</div>
                                </div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="lg:w-7/12">
                            ${qsHTML}
                        </div>

                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
