<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test: Choose a Response</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shrink-0 shadow-sm">
        <div class="flex items-center space-x-4">
            <a href="choose-response-list.html" id="exitBtn" class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 transition" title="Exit Test">
                <i data-lucide="x" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="font-bold text-slate-800 text-sm md:text-base">Practice Set <span id="setNumberDisplay">#</span></h1>
                <p class="text-[11px] text-gray-400 font-medium">Choose a Response</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3" id="headerCounterWrap">
            <div class="bg-slate-100 px-4 py-2 rounded-xl flex items-center">
                <span class="text-xs font-bold text-gray-500 mr-2">QUESTION</span>
                <span id="questionCounter" class="text-sm font-extrabold text-slate-900">1 / 3</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-6 md:p-10 flex flex-col md:flex-row gap-8 md:gap-12 items-start">
        
        <div class="w-full md:w-1/2 flex flex-col shrink-0 sticky top-[100px]">
            <div class="relative w-full aspect-square md:aspect-[4/3] rounded-3xl overflow-hidden shadow-sm border border-gray-100 bg-white mb-6">
                <img id="speakerImage" src="" alt="Speaker" class="w-full h-full object-cover transition-opacity duration-300">
                <div class="absolute bottom-4 left-4 bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/20 shadow-sm flex items-center">
                    <span class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></span>
                    <span class="text-[10px] font-bold text-slate-700 uppercase tracking-wider">Speaker</span>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
                <div class="flex items-center space-x-4 mb-3">
                    <button id="playBtn" class="w-12 h-12 shrink-0 rounded-full bg-purple-600 text-white hover:bg-purple-700 transition shadow-md shadow-purple-500/30 flex items-center justify-center">
                        <span id="playIconContainer" class="flex items-center justify-center">
                            <i data-lucide="play" class="w-5 h-5 ml-1"></i>
                        </span>
                    </button>
                    <div class="flex-1">
                        <div class="flex justify-between text-[11px] font-bold text-gray-400 mb-1.5">
                            <span id="currentTime">0:00</span>
                            <span id="durationTime">0:00</span>
                        </div>
                        <div class="h-2 bg-gray-100 rounded-full overflow-hidden relative">
                            <div id="progressBar" class="absolute top-0 left-0 h-full bg-purple-500 w-0 transition-all duration-100 ease-linear"></div>
                        </div>
                    </div>
                </div>
                <p id="playerInstruction" class="text-[11px] text-center text-gray-400">Listen to the audio carefully. You can only answer after it finishes.</p>
            </div>
            
            <audio id="audioElement" preload="metadata"></audio>
        </div>

        <div class="w-full md:w-1/2 flex flex-col min-h-[400px]">
            
            <div id="testState" class="flex flex-col h-full w-full">
                <div class="flex-1 flex flex-col justify-center py-10 md:py-0">
                    <h2 class="text-xl font-bold text-slate-800 mb-6 tracking-tight text-center md:text-left">Select the best response:</h2>
                    <div id="optionsList" class="space-y-3 opacity-25 pointer-events-none transition-all duration-500 ease-in-out">
                        </div>
                </div>
                <div class="mt-8 pt-6 border-t border-gray-100 flex justify-end shrink-0">
                    <button id="nextBtn" disabled class="px-8 py-3.5 rounded-xl text-sm font-bold transition-all flex items-center bg-gray-100 text-gray-400 cursor-not-allowed">
                        Next Question <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                    </button>
                </div>
            </div>

            <div id="resultsState" class="hidden flex-col w-full pb-10 mt-2">
                
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm text-center mb-8">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-green-50 border border-green-100 mb-4 text-green-500">
                        <i data-lucide="trophy" class="w-6 h-6"></i>
                    </div>
                    <h2 class="text-lg font-extrabold text-slate-800 mb-6">Test Completed!</h2>
                    
                    <div class="flex justify-center items-center gap-10 mb-8">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Accuracy</p>
                            <p id="resultAccuracy" class="text-3xl font-black text-slate-800">0%</p>
                        </div>
                        <div class="w-px h-10 bg-gray-200"></div>
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Raw Score</p>
                            <p id="resultScore" class="text-3xl font-black text-slate-800">0 / 0</p>
                        </div>
                    </div>
                    
                    <div class="flex gap-4">
                        <button onclick="location.reload()" class="flex-1 py-3.5 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-800 transition shadow-md">Try Again</button>
                        <a href="choose-response-list.html" class="flex-1 py-3.5 rounded-xl bg-gray-100 text-slate-700 text-sm font-bold hover:bg-gray-200 transition border border-gray-200 flex items-center justify-center">Dashboard</a>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center mb-4">
                        <i data-lucide="list-checks" class="w-4 h-4 mr-2"></i> Review Answers
                    </h3>
                    <div id="reviewList" class="space-y-4">
                        </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const currentSet = urlParams.get('set') || 1;
        document.getElementById('setNumberDisplay').innerText = `#${currentSet}`;

        const mockQuestions = [
            {
                id: 101,
                audio_url: 'https://s3.amazonaws.com/freecodecamp/drums/Heater-1.mp3', 
                speaker_image: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=600',
                options: ["It depends on the traffic.", "The hotel is close to the beach.", "The drive was very scenic.", "I waited for an hour to get in."],
                correct_answer: 0
            },
            {
                id: 102,
                audio_url: 'https://s3.amazonaws.com/freecodecamp/drums/Heater-2.mp3',
                speaker_image: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=600',
                options: ["It usually takes about 20 minutes by bus.", "The dining hall opens at 7 AM.", "I haven't chosen my major yet.", "Sorry, I don't have a spare pen."],
                correct_answer: 0
            },
            {
                id: 103,
                audio_url: 'https://s3.amazonaws.com/freecodecamp/drums/Heater-3.mp3',
                speaker_image: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&q=80&w=600',
                options: ["Sure, I can help you review your essay.", "The lab is closed on weekends.", "He said the exam will cover chapters 1 to 4.", "I'd love to go, but I have to study."],
                correct_answer: 3
            }
        ];

        let currentIndex = 0;
        let selectedOptionIndex = null;
        let userAnswers = [];

        const audioEl = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const optionsList = document.getElementById('optionsList');
        const nextBtn = document.getElementById('nextBtn');

        function setPlayIcon(state) {
            const container = document.getElementById('playIconContainer');
            if (state === 'play') {
                container.innerHTML = `<i data-lucide="play" class="w-5 h-5 ml-1"></i>`;
            } else {
                container.innerHTML = `<i data-lucide="pause" class="w-5 h-5"></i>`;
            }
            lucide.createIcons();
        }

        function loadQuestion(index) {
            const q = mockQuestions[index];
            selectedOptionIndex = null;
            
            document.getElementById('questionCounter').innerText = `${index + 1} / ${mockQuestions.length}`;
            document.getElementById('speakerImage').src = q.speaker_image;
            audioEl.src = q.audio_url;
            audioEl.load();

            setPlayIcon('play');
            progressBar.style.width = '0%';
            currentTimeEl.innerText = '0:00';

            optionsList.classList.add('opacity-25', 'pointer-events-none');
            optionsList.classList.remove('opacity-100');
            
            optionsList.innerHTML = '';
            q.options.forEach((optText, i) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 border-gray-100 bg-white hover:border-purple-200 hover:bg-purple-50/50 transition-all text-sm font-medium text-slate-700 flex items-center group shadow-xs';
                btn.innerHTML = `
                    <div class="w-5 h-5 rounded-full border-2 border-gray-200 mr-3 flex items-center justify-center group-hover:border-purple-400 option-circle shrink-0">
                        <div class="w-2.5 h-2.5 rounded-full bg-purple-500 opacity-0 scale-50 transition-all option-dot"></div>
                    </div>
                    <span>${optText}</span>
                `;
                btn.onclick = () => selectOption(i, btn);
                optionsList.appendChild(btn);
            });

            nextBtn.disabled = true;
            nextBtn.className = 'px-8 py-3.5 rounded-xl text-sm font-bold transition-all flex items-center bg-gray-100 text-gray-400 cursor-not-allowed';
            if (index === mockQuestions.length - 1) {
                nextBtn.innerHTML = `Finish Test <i data-lucide="check-circle" class="w-4 h-4 ml-2"></i>`;
            } else {
                nextBtn.innerHTML = `Next Question <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>`;
            }
            lucide.createIcons();
        }

        function selectOption(index, btnElement) {
            selectedOptionIndex = index;
            document.querySelectorAll('#optionsList button').forEach(b => {
                b.classList.remove('border-purple-500', 'bg-purple-50', 'shadow-xs');
                b.classList.add('border-gray-100');
                b.querySelector('.option-circle').classList.remove('border-purple-500');
                b.querySelector('.option-dot').classList.remove('opacity-100', 'scale-100');
            });

            btnElement.classList.remove('border-gray-100');
            btnElement.classList.add('border-purple-500', 'bg-purple-50', 'shadow-xs');
            btnElement.querySelector('.option-circle').classList.add('border-purple-500');
            btnElement.querySelector('.option-dot').classList.add('opacity-100', 'scale-100');

            nextBtn.disabled = false;
            nextBtn.className = 'px-8 py-3.5 rounded-xl text-sm font-bold transition-all flex items-center bg-slate-900 hover:bg-purple-600 text-white shadow-md cursor-pointer';
        }

        playBtn.addEventListener('click', () => {
            if (audioEl.paused) {
                const playPromise = audioEl.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => setPlayIcon('pause')).catch(error => {
                        optionsList.classList.remove('opacity-25', 'pointer-events-none');
                        optionsList.classList.add('opacity-100');
                        setPlayIcon('play');
                    });
                }
            } else {
                audioEl.pause();
                setPlayIcon('play');
            }
        });

        audioEl.addEventListener('timeupdate', () => {
            const current = audioEl.currentTime;
            const duration = audioEl.duration || 1;
            progressBar.style.width = `${(current / duration) * 100}%`;
            
            const formatTime = (time) => {
                if(isNaN(time) || !isFinite(time)) return '0:00';
                const min = Math.floor(time / 60);
                const sec = Math.floor(time % 60);
                return `${min}:${sec < 10 ? '0' : ''}${sec}`;
            };
            
            currentTimeEl.innerText = formatTime(current);
            durationTimeEl.innerText = formatTime(duration);
        });

        audioEl.addEventListener('ended', () => {
            setPlayIcon('play');
            optionsList.classList.remove('opacity-25', 'pointer-events-none');
            optionsList.classList.add('opacity-100');
        });

        audioEl.addEventListener('loadedmetadata', () => {
            const duration = audioEl.duration;
            const min = Math.floor(duration / 60);
            const sec = Math.floor(duration % 60);
            durationTimeEl.innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
        });

        nextBtn.addEventListener('click', () => {
            if (selectedOptionIndex === null) return;

            const q = mockQuestions[currentIndex];
            userAnswers.push({
                question_id: q.id,
                selected_index: selectedOptionIndex,
                is_correct: (selectedOptionIndex === q.correct_answer)
            });

            if (currentIndex < mockQuestions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                finishTest();
            }
        });

        function finishTest() {
            nextBtn.disabled = true;
            nextBtn.innerHTML = `<div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-2"></div> Saving...`;

            const scoreEarned = userAnswers.filter(a => a.is_correct).length;
            const scoreTotal = mockQuestions.length;
            const accuracy = Math.round((scoreEarned / scoreTotal) * 100);

            showResultsUI(scoreEarned, scoreTotal, accuracy);

            const userId = '00000000-0000-0000-0000-000000000000';
            supabaseClient.from('response_results').insert([{
                user_id: userId,
                set_number: parseInt(currentSet),
                score_earned: scoreEarned,
                score_total: scoreTotal,
                user_answers: userAnswers
            }]).catch(err => console.error("Error saving DB:", err));
        }

        function showResultsUI(score, total, accuracy) {
            const testState = document.getElementById('testState');
            const resultsState = document.getElementById('resultsState');
            
            testState.classList.add('hidden');
            testState.classList.remove('flex');
            
            resultsState.classList.remove('hidden');
            resultsState.classList.add('flex');
            
            document.getElementById('headerCounterWrap').classList.add('hidden');
            document.getElementById('playerInstruction').innerText = "Select a question from the right to listen again.";
            document.getElementById('resultAccuracy').innerText = `${accuracy}%`;
            document.getElementById('resultScore').innerText = `${score} / ${total}`;

            const reviewList = document.getElementById('reviewList');
            reviewList.innerHTML = '';

            userAnswers.forEach((ans, index) => {
                const q = mockQuestions.find(mq => mq.id === ans.question_id);
                const isCorrect = ans.is_correct;
                
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl border border-gray-100 shadow-sm transition hover:border-gray-300 cursor-pointer group';
                
                card.onclick = () => {
                    document.getElementById('speakerImage').src = q.speaker_image;
                    audioEl.src = q.audio_url;
                    audioEl.load();
                    setPlayIcon('play');
                    progressBar.style.width = '0%';
                    currentTimeEl.innerText = '0:00';
                    document.querySelectorAll('#reviewList > div').forEach(c => c.classList.remove('border-purple-400', 'ring-2', 'ring-purple-100'));
                    card.classList.add('border-purple-400', 'ring-2', 'ring-purple-100');
                    
                    // Скролл к плееру на мобильных
                    if(window.innerWidth < 768) {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                };

                // ГЕНЕРИРУЕМ ВСЕ 4 ВАРИАНТА ОТВЕТА
                let optionsHTML = '<div class="space-y-2 mt-4">';
                
                q.options.forEach((optText, optIndex) => {
                    if (optIndex === q.correct_answer) {
                        // Правильный ответ (Всегда зеленый)
                        optionsHTML += `
                            <div class="flex items-start bg-green-50 p-2.5 rounded-lg border border-green-200">
                                <i data-lucide="check" class="w-4 h-4 text-green-600 mt-0.5 mr-2 shrink-0"></i>
                                <span class="text-sm font-medium text-green-900">${optText}</span>
                            </div>
                        `;
                    } else if (optIndex === ans.selected_index && !isCorrect) {
                        // Выбранный, но неверный (Красный)
                        optionsHTML += `
                            <div class="flex items-start bg-red-50 p-2.5 rounded-lg border border-red-200">
                                <i data-lucide="x" class="w-4 h-4 text-red-500 mt-0.5 mr-2 shrink-0"></i>
                                <span class="text-sm font-medium text-red-900">${optText}</span>
                            </div>
                        `;
                    } else {
                        // Остальные невыбранные (Серые, нейтральные)
                        optionsHTML += `
                            <div class="flex items-start bg-gray-50 p-2.5 rounded-lg border border-gray-100 opacity-60">
                                <div class="w-4 h-4 mr-2 shrink-0"></div> <span class="text-sm text-gray-500">${optText}</span>
                            </div>
                        `;
                    }
                });
                
                optionsHTML += '</div>';

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-extrabold tracking-wide ${isCorrect ? 'text-green-500' : 'text-red-500'}">
                            QUESTION ${index + 1} &mdash; ${isCorrect ? 'CORRECT' : 'INCORRECT'}
                        </span>
                        <button class="text-[10px] bg-gray-100 text-gray-500 px-2.5 py-1.5 rounded-md font-bold group-hover:bg-purple-100 group-hover:text-purple-600 transition flex items-center">
                            <i data-lucide="play" class="w-3 h-3 mr-1"></i> Listen Again
                        </button>
                    </div>
                    ${optionsHTML}
                `;
                
                reviewList.appendChild(card);
            });
            
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadQuestion(0);
        });
    </script>
</body>
</html>
