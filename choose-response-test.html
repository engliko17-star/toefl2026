<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test: Choose a Response</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .glass-overlay {
            background: rgba(248, 249, 250, 0.85);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-4">
            <a href="choose-response-list.html" id="exitBtn" class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 transition" title="Exit Test">
                <i data-lucide="x" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="font-bold text-slate-800 text-sm md:text-base">Practice Set <span id="setNumberDisplay">#</span></h1>
                <p class="text-[11px] text-gray-400 font-medium">Choose a Response</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <div class="bg-slate-100 px-4 py-2 rounded-xl flex items-center">
                <span class="text-xs font-bold text-gray-500 mr-2">QUESTION</span>
                <span id="questionCounter" class="text-sm font-extrabold text-slate-900">1 / 15</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-6 md:p-10 flex flex-col md:flex-row gap-8 md:gap-12 items-center md:items-stretch">
        
        <div class="w-full md:w-1/2 flex flex-col">
            <div class="relative w-full aspect-square md:aspect-[4/3] rounded-3xl overflow-hidden shadow-sm border border-gray-100 bg-white mb-6">
                <img id="speakerImage" src="" alt="Speaker" class="w-full h-full object-cover transition-opacity duration-300">
                <div class="absolute bottom-4 left-4 bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/20 shadow-sm flex items-center">
                    <span class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></span>
                    <span class="text-[10px] font-bold text-slate-700 uppercase tracking-wider">Speaker</span>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
                <div class="flex items-center space-x-4 mb-3">
                    <button id="playBtn" class="w-12 h-12 shrink-0 rounded-full bg-purple-600 text-white flex items-center justify-center hover:bg-purple-700 transition shadow-md shadow-purple-500/30">
                        <i data-lucide="play" id="playIcon" class="w-5 h-5 ml-1"></i>
                    </button>
                    <div class="flex-1">
                        <div class="flex justify-between text-[11px] font-bold text-gray-400 mb-1.5">
                            <span id="currentTime">0:00</span>
                            <span id="durationTime">0:00</span>
                        </div>
                        <div class="h-2 bg-gray-100 rounded-full overflow-hidden relative">
                            <div id="progressBar" class="absolute top-0 left-0 h-full bg-purple-500 w-0 transition-all duration-100 ease-linear"></div>
                        </div>
                    </div>
                </div>
                <p class="text-[11px] text-center text-gray-400">Listen to the audio carefully. You can only answer after it finishes.</p>
            </div>
            
            <audio id="audioElement" preload="metadata"></audio>
        </div>

        <div class="w-full md:w-1/2 flex flex-col relative justify-center">
            
            <h2 class="text-xl font-bold text-slate-800 mb-6 tracking-tight">Select the best response:</h2>

            <div class="relative flex-1 flex flex-col justify-center">
                
                <div id="optionsOverlay" class="absolute inset-[-16px] glass-overlay z-10 rounded-2xl flex flex-col items-center justify-center transition-opacity duration-500 ease-in-out border border-gray-200/50">
                    <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-gray-400 mb-4 shadow-sm">
                        <i data-lucide="lock" class="w-7 h-7"></i>
                    </div>
                    <p class="font-bold text-slate-700 text-sm">Options are locked</p>
                    <p class="text-xs text-gray-500 mt-1">Please finish listening to the audio first.</p>
                </div>

                <div id="optionsList" class="space-y-3 relative z-0">
                    </div>
            </div>

            <div class="mt-8 pt-6 border-t border-gray-100 flex justify-end">
                <button id="nextBtn" disabled class="px-8 py-3.5 rounded-xl text-sm font-bold transition-all flex items-center bg-gray-100 text-gray-400 cursor-not-allowed">
                    Next Question <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                </button>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        // 1. Настройка Supabase
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Получаем номер сета из URL (по умолчанию 1)
        const urlParams = new URLSearchParams(window.location.search);
        const currentSet = urlParams.get('set') || 1;
        document.getElementById('setNumberDisplay').innerText = `#${currentSet}`;

        // 2. Моковые данные для тестирования логики (позже заменим на запрос к БД)
        const mockQuestions = [
            {
                id: 101,
                audio_url: 'https://actions.google.com/sounds/v1/alarms/beep_short.ogg', // Короткий звук для теста
                speaker_image: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=600',
                options: [
                    "I think I left it in the library.",
                    "No, the deadline is next Friday.",
                    "Professor Smith is teaching that course.",
                    "Yes, I completely agree with you."
                ],
                correct_answer: 1 // Индекс правильного ответа
            },
            {
                id: 102,
                audio_url: 'https://actions.google.com/sounds/v1/water/water_drop.ogg', // Короткий звук для теста
                speaker_image: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=600',
                options: [
                    "It usually takes about 20 minutes by bus.",
                    "The dining hall opens at 7 AM.",
                    "I haven't chosen my major yet.",
                    "Sorry, I don't have a spare pen."
                ],
                correct_answer: 0
            },
            {
                id: 103,
                audio_url: 'https://actions.google.com/sounds/v1/doors/wood_door_open.ogg', // Короткий звук для теста
                speaker_image: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&q=80&w=600',
                options: [
                    "Sure, I can help you review your essay.",
                    "The lab is closed on weekends.",
                    "He said the exam will cover chapters 1 to 4.",
                    "I'd love to go, but I have to study."
                ],
                correct_answer: 3
            }
        ];

        // 3. Переменные состояния
        let currentIndex = 0;
        let selectedOptionIndex = null;
        let userAnswers = []; // Собираем ответы: { question_id, selected, isCorrect }

        // Элементы DOM
        const audioEl = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        
        const overlay = document.getElementById('optionsOverlay');
        const optionsList = document.getElementById('optionsList');
        const nextBtn = document.getElementById('nextBtn');
        const exitBtn = document.getElementById('exitBtn');

        // Предупреждение при выходе
        exitBtn.addEventListener('click', (e) => {
            if(!confirm('Are you sure you want to quit? Your progress will not be saved.')) {
                e.preventDefault();
            }
        });

        // 4. Загрузка вопроса на экран
        function loadQuestion(index) {
            const q = mockQuestions[index];
            selectedOptionIndex = null;
            
            // Обновляем счетчик
            document.getElementById('questionCounter').innerText = `${index + 1} / ${mockQuestions.length}`;
            
            // Обновляем картинку и аудио
            document.getElementById('speakerImage').src = q.speaker_image;
            audioEl.src = q.audio_url;
            audioEl.load();

            // Сброс плеера
            playIcon.setAttribute('data-lucide', 'play');
            progressBar.style.width = '0%';
            currentTimeEl.innerText = '0:00';
            lucide.createIcons();

            // Включаем ширму
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            
            // Генерируем варианты ответов
            optionsList.innerHTML = '';
            q.options.forEach((optText, i) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 border-gray-100 bg-white hover:border-purple-200 hover:bg-purple-50/50 transition-all text-sm font-medium text-slate-700 flex items-center group';
                btn.innerHTML = `
                    <div class="w-6 h-6 rounded-full border-2 border-gray-200 mr-3 flex items-center justify-center group-hover:border-purple-400 option-circle">
                        <div class="w-2.5 h-2.5 rounded-full bg-purple-500 opacity-0 scale-50 transition-all option-dot"></div>
                    </div>
                    <span>${optText}</span>
                `;
                btn.onclick = () => selectOption(i, btn);
                optionsList.appendChild(btn);
            });

            // Настройка кнопки Next/Finish
            nextBtn.disabled = true;
            nextBtn.className = 'px-8 py-3.5 rounded-xl text-sm font-bold transition-all flex items-center bg-gray-100 text-gray-400 cursor-not-allowed';
            if (index === mockQuestions.length - 1) {
                nextBtn.innerHTML = `Finish Test <i data-lucide="check-circle" class="w-4 h-4 ml-2"></i>`;
            } else {
                nextBtn.innerHTML = `Next Question <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>`;
            }
            lucide.createIcons();
        }

        // 5. Логика выбора ответа
        function selectOption(index, btnElement) {
            selectedOptionIndex = index;
            
            // Сбрасываем стили у всех
            document.querySelectorAll('#optionsList button').forEach(b => {
                b.classList.remove('border-purple-500', 'bg-purple-50', 'shadow-sm');
                b.classList.add('border-gray-100');
                b.querySelector('.option-circle').classList.remove('border-purple-500');
                b.querySelector('.option-dot').classList.remove('opacity-100', 'scale-100');
            });

            // Выделяем выбранный
            btnElement.classList.remove('border-gray-100');
            btnElement.classList.add('border-purple-500', 'bg-purple-50', 'shadow-sm');
            btnElement.querySelector('.option-circle').classList.add('border-purple-500');
            btnElement.querySelector('.option-dot').classList.add('opacity-100', 'scale-100');

            // Активируем кнопку Next
            nextBtn.disabled = false;
            nextBtn.className = 'px-8 py-3.5 rounded-xl text-sm font-bold transition-all flex items-center bg-slate-900 hover:bg-purple-600 text-white shadow-md cursor-pointer';
        }

        // 6. Логика Плеера
        playBtn.addEventListener('click', () => {
            if (audioEl.paused) {
                audioEl.play();
                playIcon.setAttribute('data-lucide', 'pause');
            } else {
                audioEl.pause();
                playIcon.setAttribute('data-lucide', 'play');
            }
            lucide.createIcons();
        });

        audioEl.addEventListener('timeupdate', () => {
            const current = audioEl.currentTime;
            const duration = audioEl.duration || 1;
            progressBar.style.width = `${(current / duration) * 100}%`;
            
            // Форматирование времени
            const formatTime = (time) => {
                if(isNaN(time)) return '0:00';
                const min = Math.floor(time / 60);
                const sec = Math.floor(time % 60);
                return `${min}:${sec < 10 ? '0' : ''}${sec}`;
            };
            
            currentTimeEl.innerText = formatTime(current);
            durationTimeEl.innerText = formatTime(duration);
        });

        // САМОЕ ВАЖНОЕ: Убираем ширму, когда аудио закончилось
        audioEl.addEventListener('ended', () => {
            playIcon.setAttribute('data-lucide', 'play');
            lucide.createIcons();
            // Прячем оверлей
            overlay.classList.add('opacity-0', 'pointer-events-none');
        });

        // Обработка метаданных для правильного отображения длительности до старта
        audioEl.addEventListener('loadedmetadata', () => {
            const duration = audioEl.duration;
            const min = Math.floor(duration / 60);
            const sec = Math.floor(duration % 60);
            durationTimeEl.innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
        });

        // 7. Кнопка Next / Finish
        nextBtn.addEventListener('click', async () => {
            if (selectedOptionIndex === null) return;

            const q = mockQuestions[currentIndex];
            const isCorrect = selectedOptionIndex === q.correct_answer;
            
            // Сохраняем ответ пользователя в массив
            userAnswers.push({
                question_id: q.id,
                selected_index: selectedOptionIndex,
                is_correct: isCorrect
            });

            if (currentIndex < mockQuestions.length - 1) {
                // Идем к следующему вопросу
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                // Это был последний вопрос. Завершаем тест.
                finishTest();
            }
        });

        // 8. Сохранение результатов и Редирект
        async function finishTest() {
            // Меняем кнопку на лоадер
            nextBtn.disabled = true;
            nextBtn.innerHTML = `<div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-2"></div> Saving...`;

            const scoreEarned = userAnswers.filter(a => a.is_correct).length;
            const scoreTotal = mockQuestions.length;

            try {
                // Создаем тестового пользователя-заглушку, если у тебя еще нет системы логина
                const userId = '00000000-0000-0000-0000-000000000000'; // Заглушка UUID

                const { error } = await supabaseClient
                    .from('response_results')
                    .insert([{
                        user_id: userId,
                        set_number: parseInt(currentSet),
                        score_earned: scoreEarned,
                        score_total: scoreTotal,
                        user_answers: userAnswers
                    }]);

                if (error) throw error;

                // Если сохранилось успешно — перекидываем на страницу результатов
                window.location.href = `choose-response-results.html?set=${currentSet}`;

            } catch (err) {
                console.error("Error saving results:", err);
                alert("There was an error saving your results. Please check your internet connection or database setup.");
                nextBtn.disabled = false;
                nextBtn.innerHTML = `Finish Test <i data-lucide="check-circle" class="w-4 h-4 ml-2"></i>`;
                lucide.createIcons();
            }
        }

        // Запуск первого вопроса при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            loadQuestion(0);
        });

    </script>
</body>
</html>
