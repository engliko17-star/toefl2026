<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a Response — Test List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="practice-next.js"></script>
    <script>
        // Бесплатная версия (auth.js): в списке видны все задания, закрытые — под замочком
        var gMerge = (table, rows, opts) => (typeof authGuestMerge === 'function' ? authGuestMerge(table, rows, opts) : Promise.resolve(rows || []));
        var gCard = (html, row) => (typeof authGuestCard === 'function' ? authGuestCard(html, row) : html);
        var gNote = () => (typeof authL === 'function' ? authL('Available with full access', 'Доступно в полной версии') : 'Available with full access');
    </script>
    <script src="content-visibility.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row opacity-0 transition-opacity duration-200" id="mainBody">

    <div id="app-sidebar"></div>
    <script src="nav.js"></script>

    <main class="flex-1 p-6 lg:p-10 overflow-y-auto bg-[#f8f9fa] pb-24 md:pb-10">
        <div class="max-w-5xl mx-auto">
            
            <a href="listening.html" class="inline-flex items-center text-xs font-bold text-gray-400 hover:text-slate-700 transition mb-6">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> All Listening Tasks
            </a>

            <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 border-b border-gray-100 pb-6">
                <div>
                    <span class="text-[10px] font-bold text-purple-600 bg-purple-50 px-2.5 py-1 rounded-md uppercase tracking-wider">Task Type 1</span>
                    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mt-2">Choose a Response</h1>
                    <p class="text-sm text-gray-500 mt-1">Listen to short statements and pick the best logical answer or continuation.</p>
                </div>
                <div class="mt-4 md:mt-0 flex items-center space-x-4 bg-white px-4 py-2.5 rounded-2xl border border-gray-100 shadow-xs">
                    <div class="w-8 h-8 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center">
                        <i data-lucide="award" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-medium text-gray-400 uppercase">Avg. Accuracy</p>
                        <p id="avgAccuracyText" class="text-sm font-bold text-slate-800">Calculating...</p>
                    </div>
                </div>
            </div>

            <div id="loadingState" class="py-20 text-center flex flex-col items-center justify-center">
                <div class="w-8 h-8 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                <p class="text-xs text-gray-400">Loading test packages...</p>
            </div>

            <div id="setsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 hidden">
            </div>

        </div>
    </main>


    <script>
        // Один клиент на страницу — тот, что создал auth.js (второй клиент на том же
        // хранилище сессии иногда «зависал» на входе)
        const supabaseClient = window.supabaseClient;

        // Глазик преподавателя (content-visibility.js). Если файл не загрузился,
        // страница работает как раньше, а скрытое всё равно не попадает к ученикам.
        const CV = window.ContentVisibility || {
            init() {}, cardClass() { return ''; }, withEye(html) { return html; }, eye() { return ''; },
            visibleFor(rows) { return (rows || []).filter(r => r.is_hidden !== true); }
        };

        // База отдаёт не больше 1000 строк за раз: когда вопросов станет больше,
        // часть наборов просто пропала бы из списка. Читаем порциями.
        // Необязательные колонки: is_real_toefl (этикетка TOEFL, listening_official_setup.sql)
        // и is_hidden (глазик, eye_practice_only.sql). Пока SQL не запущен, запрос с колонкой
        // падает (42703) — тогда читаем без неё.
        async function fetchAllQuestionSets() {
            let optional = ['is_real_toefl', 'is_hidden'];
            for (;;) {
                try {
                    return await fetchQuestionPages(['id', 'set_number', ...optional].join(', '));
                } catch (error) {
                    const missing = error && optional.find(c => (error.message || '').includes(c));
                    if (!missing) throw error;
                    console.warn('[listening_questions] нет колонки ' + missing + ' — работаем без неё');
                    optional = optional.filter(c => c !== missing);
                }
            }
        }

        async function fetchQuestionPages(columns) {
            const PAGE = 1000;
            let all = [];
            for (let from = 0; ; from += PAGE) {
                const { data, error } = await supabaseClient
                    .from('listening_questions')
                    .select(columns)
                    .or('is_mock_only.eq.false,is_mock_only.is.null')
                    .order('id', { ascending: true })
                    .range(from, from + PAGE - 1);
                if (error) throw error;
                all = all.concat(data || []);
                if (!data || data.length < PAGE) return all;
            }
        }

        // Лента TOEFL в углу — как в Reading, Writing и Speaking: набор с настоящего экзамена
        const REAL_TOEFL_RIBBON = `<div class="absolute top-[15px] right-[-38px] w-[150px] rotate-45 bg-violet-600 text-white text-[9px] font-extrabold tracking-[0.15em] text-center py-1 shadow-sm z-10 pointer-events-none">TOEFL</div>`;

        // Самая свежая попытка из нескольких строк по одному набору
        function rowTime(r) { return Date.parse(r.completed_at || r.updated_at || r.created_at || '') || 0; }
        function isNewer(a, b) { return rowTime(a) > rowTime(b) || (rowTime(a) === rowTime(b) && (Number(a.id) || 0) > (Number(b.id) || 0)); }

        let currentUser = null; 

        async function checkAuthAndLoad() {
            try {
                // requireAuth проверяет и сессию, и открыт ли ученику Listening.
                const user = await requireAuth();
                if (!user) return;

                currentUser = user;
                CV.init({ user, reload: loadSetsList });
                document.getElementById('mainBody').classList.remove('opacity-0');

                await loadSetsList();

            } catch (err) {
                console.error("Auth protection error:", err);
                window.location.replace('index.html');
            }
        }

        async function loadSetsList() {
            try {
                // ИСКЛЮЧАЕМ вопросы для мок-тестов из подсчета практики
                const questionsData = await gMerge('listening_questions', await fetchAllQuestionSets());

                const setCounts = {};
                const setIsToefl = {};   // набор TOEFL, только если помечены все его вопросы
                const setIds = {};       // id вопросов набора — глазик скрывает набор целиком
                const setHidden = {};    // скрыт глазиком (хотя бы один вопрос набора)
                const setLocked = {};    // гость: набор доступен в полной версии
                if (questionsData && questionsData.length > 0) {
                    questionsData.forEach(q => {
                        const sn = q.set_number;
                        if (sn) {
                            setCounts[sn] = (setCounts[sn] || 0) + 1;
                            setIsToefl[sn] = (setIsToefl[sn] !== false) && q.is_real_toefl === true;
                            (setIds[sn] = setIds[sn] || []).push(q.id);
                            if (q.is_hidden === true) setHidden[sn] = true;
                            if (q.__locked) setLocked[sn] = true;
                        }
                    });
                }

                // Скрытый набор ученице не показываем (в мок-тестах он остаётся)
                const isTeacherView = !!currentUser && currentUser.role === 'teacher';
                const availableSets = Object.keys(setCounts).map(Number)
                    .filter(sn => isTeacherView || !setHidden[sn])
                    .sort((a, b) => a - b);

                const { data: results, error } = await supabaseClient
                    .from('response_results')
                    .select('*')
                    .eq('user_id', currentUser.id);

                if (error) throw error;

                const resultMap = {};
                let totalEarned = 0;
                let totalPossible = 0;

                // По каждому набору — только последняя попытка, и только по наборам,
                // которые сейчас есть в списке (раньше в среднюю точность попадали
                // и повторы, и удалённые наборы)
                (results || []).forEach(res => {
                    const prev = resultMap[res.set_number];
                    if (!prev || isNewer(res, prev)) resultMap[res.set_number] = res;
                });
                availableSets.forEach(sn => {
                    if (setLocked[sn]) return;
                    const res = resultMap[sn];
                    if (!res) return;
                    totalEarned += Number(res.score_earned) || 0;
                    totalPossible += Number(res.score_total) || 0;
                });

                const avgAccuracyText = document.getElementById('avgAccuracyText');
                if (totalPossible > 0) {
                    avgAccuracyText.innerText = `${Math.round((totalEarned / totalPossible) * 100)}%`;
                } else {
                    avgAccuracyText.innerText = '0%';
                }

                const grid = document.getElementById('setsGrid');
                grid.innerHTML = ''; 

                if (availableSets.length === 0) {
                    document.getElementById('loadingState').innerHTML = `<p class="text-xs text-gray-400 font-medium">No practice sets found in the database.</p>`;
                    return;
                }

                availableSets.forEach(i => {
                    const userResult = resultMap[i];
                    const qCount = setCounts[i] || 0;
                    const isRealToefl = setIsToefl[i] === true;
                    const ribbon = isRealToefl ? REAL_TOEFL_RIBBON : '';
                    // отступ справа, чтобы процент / «Ready» не уходили под ленту
                    const headerPad = isRealToefl ? 'pr-12' : '';
                    const isHiddenSet = setHidden[i] === true;
                    const eyeBtn = CV.eye('listening_questions', setIds[i] || [], isHiddenSet, { compact: true });
                    let cardHtml = '';

                    if (userResult && !setLocked[i]) {
                        const pct = Number(userResult.score_total) > 0
                            ? Math.round((userResult.score_earned / userResult.score_total) * 100) : 0;
                        
                        cardHtml = `
                            <div class="bg-white rounded-2xl p-5 border border-purple-100 shadow-xs flex flex-col justify-between relative overflow-hidden group border-t-4 border-t-purple-500 ${CV.cardClass(isHiddenSet)}">
                                ${ribbon}
                                <div>
                                    <div class="flex justify-between items-start mb-3 ${headerPad}">
                                        <h3 class="font-bold text-slate-800 text-sm">Practice Set #${i}</h3>
                                        <span class="text-[11px] font-bold text-purple-600 bg-purple-50 px-2 py-0.5 rounded-md">${pct}% Accuracy</span>
                                    </div>
                                    <p class="text-[11px] text-gray-400 mb-6">Completed. Score: <span class="font-bold text-slate-700">${userResult.score_earned}/${userResult.score_total}</span> tasks.</p>
                                </div>
                                
                                <div class="flex items-center justify-between pt-4 border-t border-gray-50 mt-auto">
                                    <button onclick="resetTest(${i})" class="w-8 h-8 rounded-lg border border-gray-200 hover:border-red-200 hover:bg-rose-50 text-gray-400 hover:text-rose-500 flex items-center justify-center transition" title="Reset Score">
                                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <div class="flex items-center gap-2">
                                    <a href="choose-response-test.html?set=${i}&review=true" class="text-xs font-bold text-purple-600 border border-purple-200 px-4 py-2 rounded-xl hover:bg-purple-50 transition flex items-center">
                                        View Review <i data-lucide="eye" class="w-3.5 h-3.5 ml-1.5"></i>
                                    </a>${eyeBtn}
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        cardHtml = `
                            <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-xs flex flex-col justify-between relative overflow-hidden group hover:shadow-md transition duration-200 ${CV.cardClass(isHiddenSet)}">
                                ${ribbon}
                                <div>
                                    <div class="flex justify-between items-start mb-3 ${headerPad}">
                                        <h3 class="font-bold text-slate-800 text-sm">Practice Set #${i}</h3>
                                        ${setLocked[i] ? '' : '<span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Ready</span>'}
                                    </div>
                                    <p class="text-[11px] text-gray-400 mb-6">Contains ${qCount} interactive audio responses.${setLocked[i] ? '<br>' + gNote() : ''}</p>
                                </div>
                                
                                <div class="flex items-center justify-between pt-4 border-t border-gray-50 mt-auto">
                                    <span class="text-[10px] font-bold text-gray-300 uppercase">Not Started</span>
                                    <div class="flex items-center gap-2">
                                    <a href="choose-response-test.html?set=${i}" class="text-xs font-bold text-white bg-slate-900 px-4 py-2 rounded-xl hover:bg-purple-600 transition flex items-center shadow-xs">
                                        Start Test <i data-lucide="play" class="w-3 h-3 ml-1.5 fill-current"></i>
                                    </a>${eyeBtn}
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    grid.innerHTML += setLocked[i] ? gCard(cardHtml, { __locked: true }) : cardHtml;
                });

                document.getElementById('loadingState').classList.add('hidden');
                const gridEl = document.getElementById('setsGrid');
                gridEl.classList.remove('hidden');
                // Порядок наборов для кнопки «Следующий тест» (practice-next.js)
                if (window.PracticeNext) PracticeNext.remember('response', gridEl, currentUser && currentUser.id);
                
                lucide.createIcons();

            } catch (err) {
                console.error("Error loading Choose a Response list:", err);
                document.getElementById('loadingState').innerHTML = `<p class="text-xs text-red-500 font-medium">Failed to load tests. Please refresh the page.</p>`;
            }
        }

        async function resetTest(setNumber) {
            if (!currentUser) return;
            if (!confirm(`Are you sure you want to reset your score for Set #${setNumber}? This will erase your past answers.`)) return;

            try {
                const { data: deleted, error } = await supabaseClient
                    .from('response_results')
                    .delete()
                    .eq('set_number', setNumber)
                    .eq('user_id', currentUser.id)
                    .select('id');

                if (error) throw error;
                // База может молча не удалить ни одной строки (нет права на удаление) —
                // раньше это выглядело как успешный сброс
                if (!deleted || deleted.length === 0) {
                    alert("Не получилось сбросить результат — сообщите преподавателю.");
                    return;
                }

                loadSetsList();
            } catch (err) {
                console.error("Error resetting test performance:", err);
                alert("Could not reset the test results. Please try again.");
            }
        }

        document.addEventListener('DOMContentLoaded', checkAuthAndLoad);
    </script>
</body>
</html>
