<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Mock Tests — TOEFL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen antialiased flex flex-col md:flex-row opacity-0 transition-opacity duration-200" id="mainBody">

    <!-- Sidebar (Desktop) -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 px-4 py-6 h-screen sticky top-0 shrink-0">
        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span><span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>
        
        <nav class="flex-1 space-y-1">
            <a href="index.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-sm font-medium">Dashboard</span>
            </a>
            <a href="vocabulary.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                <i data-lucide="book-open" class="w-5 h-5"></i>
                <span class="text-sm font-medium">Vocabulary</span>
            </a>
            
            <div class="pt-6 pb-2 px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider">Practice</div>
            <a href="reading.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                <i data-lucide="book-text" class="w-5 h-5"></i>
                <span class="text-sm">Reading</span>
            </a>
            <a href="listening.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                <i data-lucide="headphones" class="w-5 h-5"></i>
                <span class="text-sm">Listening</span>
            </a>
            <a href="writing.html" class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900 text-white font-medium shadow-sm">
                <i data-lucide="pen-tool" class="w-5 h-5"></i>
                <span class="text-sm">Writing</span>
            </a>
            <a href="speaking.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                <i data-lucide="mic" class="w-5 h-5"></i>
                <span class="text-sm">Speaking</span>
            </a>
            <a href="tests.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                <i data-lucide="file-check" class="w-5 h-5"></i>
                <span class="text-sm">Mock Tests</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 lg:p-10 overflow-y-auto bg-[#f8f9fa] pb-24 md:pb-10 relative">
        <div class="max-w-5xl mx-auto">
            
            <!-- Header section -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-10">
                <div class="flex items-center gap-4">
                    <a href="writing.html" class="flex items-center justify-center w-10 h-10 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 text-slate-600 transition shadow-sm">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </a>
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
                            Mini-Mock Tests
                        </h1>
                        <p class="text-xs text-gray-500 mt-1">Select a full writing simulation to practice under exam conditions.</p>
                    </div>
                </div>
            </div>

            <!-- Mocks Grid -->
            <div id="mock-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Скелетон загрузки (исчезнет после подгрузки данных) -->
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm animate-pulse h-[250px]">
                    <div class="w-16 h-5 bg-gray-200 rounded-md mb-4"></div>
                    <div class="w-3/4 h-6 bg-gray-200 rounded mb-2"></div>
                    <div class="w-full h-4 bg-gray-200 rounded mb-2"></div>
                    <div class="w-5/6 h-4 bg-gray-200 rounded mb-8"></div>
                    <div class="w-full h-10 bg-gray-200 rounded-xl mt-auto"></div>
                </div>
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm animate-pulse h-[250px]">
                    <div class="w-16 h-5 bg-gray-200 rounded-md mb-4"></div>
                    <div class="w-3/4 h-6 bg-gray-200 rounded mb-2"></div>
                    <div class="w-full h-4 bg-gray-200 rounded mb-2"></div>
                    <div class="w-5/6 h-4 bg-gray-200 rounded mb-8"></div>
                    <div class="w-full h-10 bg-gray-200 rounded-xl mt-auto"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- Mobile Nav -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around py-2 z-40">
        <a href="index.html" class="flex flex-col items-center text-gray-400"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[9px] mt-1 font-medium">Home</span></a>
        <a href="vocabulary.html" class="flex flex-col items-center text-gray-400"><i data-lucide="book-open" class="w-5 h-5"></i><span class="text-[9px] mt-1 font-medium">Vocab</span></a>
        <a href="reading.html" class="flex flex-col items-center text-gray-400"><i data-lucide="book-text" class="w-5 h-5"></i><span class="text-[9px] mt-1 font-medium">Reading</span></a>
        <a href="listening.html" class="flex flex-col items-center text-gray-400"><i data-lucide="headphones" class="w-5 h-5"></i><span class="text-[9px] mt-1 font-medium">Listen</span></a>
        <a href="writing.html" class="flex flex-col items-center text-slate-900"><i data-lucide="pen-tool" class="w-5 h-5"></i><span class="text-[9px] mt-1 font-bold">Write</span></a>
    </nav>

    <script>
        // Инициализация иконок
        lucide.createIcons();

        // Подключение к Supabase
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function checkAuth() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error || !session) {
                    window.location.replace('index.html');
                    return;
                }

                currentUser = session.user;
                document.getElementById('mainBody').classList.remove('opacity-0');
                
                await loadMockTests();
            } catch (err) {
                console.error("Auth protection error:", err);
                window.location.replace('index.html');
            }
        }

        async function loadMockTests() {
            const container = document.getElementById('mock-list-container');

            try {
                // Получаем список моков
                const { data: mocks, error } = await supabaseClient
                    .from('mini_mock_writing')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;

                if (!mocks || mocks.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full flex flex-col items-center justify-center py-20 px-4 text-center bg-white rounded-3xl border border-dashed border-gray-200">
                            <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4">
                                <i data-lucide="inbox" class="w-8 h-8 text-gray-300"></i>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800 mb-1">No Tests Found</h3>
                            <p class="text-sm text-gray-500 max-w-sm">There are currently no mini-mock tests available. Check back later!</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                container.innerHTML = mocks.map((mock, index) => {
                    const mockNumber = index + 1;
                    return `
                        <div class="bg-white rounded-2xl p-6 border border-gray-200 shadow-sm hover:shadow-[0_8px_30px_rgb(0,0,0,0.06)] hover:border-indigo-200 transition-all duration-300 flex flex-col h-full relative overflow-hidden group">
                            
                            <!-- Декоративная иконка на фоне -->
                            <div class="absolute -top-4 -right-4 p-4 opacity-5 group-hover:opacity-10 transform group-hover:scale-110 group-hover:rotate-12 transition-all duration-500 pointer-events-none">
                                <i data-lucide="flask-conical" class="w-32 h-32 text-indigo-600"></i>
                            </div>

                            <div class="relative z-10 flex-1">
                                <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 text-[10px] font-bold uppercase tracking-widest rounded-lg mb-4 border border-indigo-100">
                                    Mock #${mockNumber}
                                </span>
                                
                                <h3 class="text-xl font-bold text-slate-900 mb-2 leading-tight">${mock.title}</h3>
                                <p class="text-xs text-slate-500 leading-relaxed mb-6">
                                    ${mock.description || 'Complete a full writing simulation consisting of 3 consecutive tasks under exam time limits.'}
                                </p>
                            </div>
                            
                            <div class="mt-auto relative z-10">
                                <div class="flex items-center justify-between mb-5 text-[11px] font-bold text-slate-400 bg-gray-50 px-4 py-2.5 rounded-xl border border-gray-100">
                                    <div class="flex space-x-4">
                                        <span class="flex items-center gap-1.5" title="Sentence Building">
                                            <i data-lucide="puzzle" class="w-3.5 h-3.5 text-rose-400"></i> 1
                                        </span>
                                        <span class="flex items-center gap-1.5" title="Email Writing">
                                            <i data-lucide="mail" class="w-3.5 h-3.5 text-blue-400"></i> 1
                                        </span>
                                        <span class="flex items-center gap-1.5" title="Academic Discussion">
                                            <i data-lucide="message-square" class="w-3.5 h-3.5 text-teal-400"></i> 1
                                        </span>
                                    </div>
                                    <span class="flex items-center gap-1">
                                        <i data-lucide="clock" class="w-3 h-3"></i> ~23 min
                                    </span>
                                </div>

                                <a href="mini-mock-writing.html?id=${mock.id}" class="w-full flex items-center justify-center space-x-2 bg-slate-900 hover:bg-indigo-600 text-white py-3.5 rounded-xl text-sm font-bold transition-all shadow-sm hover:shadow-md group-hover:-translate-y-0.5 active:scale-[0.98]">
                                    <span>Start Simulation</span>
                                    <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');

                lucide.createIcons();

            } catch (err) {
                console.error("Error fetching mocks:", err);
                container.innerHTML = `
                    <div class="col-span-full p-6 bg-red-50 text-red-600 rounded-2xl border border-red-100 text-center text-sm font-medium">
                        Failed to load tests. Please check your connection and try again.
                    </div>
                `;
            }
        }

        // Запуск при загрузке страницы
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
