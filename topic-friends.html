          model: "[A] My friendship with my best friend from school taught me to be more patient and less judgmental. [R] She is very different from me — she's quiet and artistic, and I'm more active and sporty. At first, I didn't understand why she needed so much time alone. [E] For example, when her parents divorced, she didn't want to talk to anyone for weeks, and I felt hurt and thought she didn't trust me. But later she told me that she started painting during that time, and it helped her deal with her feelings. I understood that everyone deals with problems in their own way. [C] So that friendship taught me to accept people as they are.",
          model5: "[A] My friendship with my best friend from school taught me patience and, above all, not to judge how others cope. [R] We're very different: she's quiet and artistic, whereas I'm active and sporty, and for a long time I struggled to understand her need for solitude. [E] When her parents divorced, for instance, she withdrew from everyone for several weeks, and I felt hurt, assuming she didn't trust me. Only later did she explain that she'd started painting during that period and that it was how she processed her emotions. That conversation made me realize that people deal with pain in completely different ways. [C] So that friendship taught me to accept people as they are, rather than as I expect them to be." },
        { q: "In your opinion, what makes a friendship last a long time?",
          lx: ["through thick and thin", "trust", "keep in touch with"],
          model: "[A] I think trust, effort and accepting change make a friendship last a long time. [R] Friends need to be honest with each other and keep promises. They also need to make an effort to stay in touch, especially when life gets busy or they live far apart. And they should accept that people change over time. [E] For example, my best friend moved to Canada two years ago, and many people said we would drift apart. But we have a video call every Sunday, and last summer I saved money and visited her. Our lives are different now, but we're still close. [C] So friendship lasts when both people work on it.",
          model5: "[A] In my view, it comes down to trust, consistent effort and a willingness to grow together. [R] Friends have to be honest and reliable, but they also need to make a conscious effort to stay in touch when life gets busy or they end up far apart. Crucially, they must accept that both people will change over time. [E] When my best friend moved to Canada two years ago, for instance, plenty of people predicted that we'd **drift apart**. Instead, we've kept a standing video call every Sunday, and last summer I saved up to visit her. Our lives look very different now, yet we're as close as ever. [C] So a friendship lasts when both people treat it as something worth investing in, **through thick and thin**." },
        { q: "Some people believe that maintaining friendships is essential for emotional well-being and life satisfaction. Do you agree or disagree with this viewpoint? Why or why not?",
          lx: ["a support network", "well-being", "a shoulder to cry on"],
          model: "[A] I strongly agree. [R] Friends support us in difficult times, make good times better and help us see problems from a different side. Without friends, people often feel lonely, and loneliness is bad for both mental and physical health. [E] For example, during my first semester, I was very homesick and anxious. My new friends from the dorm invited me to dinners and runs, and slowly I started to feel at home. I don't know how I would have managed without them. [C] So friendships are one of the most important things for our well-being.", model5: "[A] I strongly agree; I'd say friendships are among the most important foundations of well-being. [R] Friends support us through difficult periods, amplify our happiness and help us see problems from new angles. Loneliness, by contrast, has been linked to serious mental and even physical health risks. [E] During my first semester, for instance, I was intensely homesick and anxious. It was the people on my dorm floor, inviting me to shared dinners and evening runs, who gradually made the new city feel like home. Honestly, I'm not sure how I'd have coped without them. [C] So investing time in friendships isn't a distraction from a successful life; it's a central part of one." }
      ]

    { id: "s083", badge: "official", title: "Social Gatherings", src: "Official TOEFL · 082 / 083",
      scenario: "You have volunteered for a research study about people's experiences with social gatherings. You will have a short online interview with a researcher. The researcher will ask you some questions.",
      questions: [
        { q: "First, do you enjoy attending large social gatherings, or do you prefer smaller, more private gatherings? Why is that?",
          lx: ["get-together", "small talk", "catch up with"],
          model: "[A] I prefer smaller, more private gatherings. [R] At big parties, it's loud, and I spend most of the time making small talk with people I don't know. At small gatherings, I can have real conversations and actually catch up with my friends. [E] For example, last month I went to a big student party with about a hundred people. I talked to many people, but only for two minutes each, and I went home early. The next weekend, four friends came to my dorm for dinner, and we talked and laughed until two in the morning. [C] So for me, small gatherings are much more enjoyable.",
          model5: "[A] I definitely prefer smaller, more intimate gatherings. [R] Large parties tend to be loud and crowded, so I end up making endless **small talk** with strangers, whereas small get-togethers allow for real conversation and a chance to properly **catch up with** friends. [E] Last month, for instance, I went to a student party with around a hundred people; I spoke to plenty of them, but rarely for more than two minutes, and I left early feeling oddly drained. The following weekend, by contrast, four friends came over to my dorm for dinner, and we talked and laughed until two in the morning. [C] So for me, the best gatherings are the ones where you can actually hear each other." },
        { q: "Can you describe a memorable social gathering you attended recently? What made it special?",
          lx: ["host", "invite someone over", "the life and soul of the party"],
          model: "[A] A memorable gathering was an international dinner that my roommates and I hosted last month. [R] It was special because everyone brought a dish from their home country, so we learned a lot about each other's cultures, and new people became friends. [E] For example, there were about twelve guests from seven countries. A friend from Mexico made tacos, a girl from Japan brought homemade sushi, and I made my grandmother's honey cake. After dinner, I played guitar and everyone sang songs in their own languages. We stayed up until three in the morning. [C] So it was special because of the food, the music and the mix of cultures.",
          model5: "[A] One that stands out is an international dinner my roommates and I hosted last month. [R] What made it special was that every guest brought a dish from their home country, so the evening became a genuine exchange of cultures, and several people who'd never met left as friends. [E] We had about twelve guests from seven countries, for instance: a friend from Mexico made tacos, a classmate from Japan brought homemade sushi, and I baked my grandmother's famous honey cake. After dinner, I got my guitar out, and everyone took turns singing songs in their own languages until well past three in the morning. [C] So it was the combination of food, music and cultural curiosity that made it unforgettable." },
        { q: "How do you usually prepare for a social gathering? What do you focus on most?",
          lx: ["host", "guest", "make people feel welcome"],
          model: "[A] When I host a gathering, I focus most on making people feel comfortable. [R] Food and decorations are nice, but people remember how they felt. So I think about who is coming, what they like and how to help them talk to each other. [E] For example, before our dorm dinner, I asked everyone about allergies and food preferences, made a playlist and prepared a simple game to break the ice, because some guests didn't know each other. When I'm a guest, I usually bring something small, like dessert, and check who else is coming. [C] So my focus is always on the people, not on perfection.",
          model5: "[A] When I'm hosting, my main focus is making people feel at ease. [R] Food and decorations matter, of course, but what guests really remember is how comfortable they felt, so I think carefully about who's coming, what they enjoy and how to get them talking to one another. [E] Before our dorm dinner, for instance, I checked everyone's allergies and dietary preferences, put together a playlist and prepared a quick game to **break the ice**, since several guests had never met. As a guest, meanwhile, I always bring something small, usually dessert, and find out in advance who else will be there. [C] So whether I'm hosting or attending, I focus on people rather than perfection." },
        { q: "Some people believe that social gatherings are important opportunities for building and maintaining professional relationships. Do you agree or disagree with this idea? Why or why not?",
          lx: ["network", "rapport", "colleague"],
          model: "[A] Yes, I agree. [R] When people meet outside the office, they relax, talk about their lives and get to know each other better. Later, this trust helps them work together. Also, at parties and events you can meet people who can help your career. [E] For example, at a university career event, I talked to a woman from a marketing agency during the coffee break. We kept in touch, and two months later she told me about an internship there. That's how I got it. [C] So social events can be very useful for your career.", model5: "[A] I agree, and I'd go further: they're often where professional relationships really begin. [R] In a relaxed setting, people drop their formal roles and connect on a personal level, and that trust makes working together far easier later on. What's more, informal events give you access to people you'd never meet otherwise. [E] At a university career fair, for instance, I got chatting with a woman from a marketing agency during the coffee break. We stayed in touch, and two months later she mentioned an internship opening at her company — the one I eventually got. [C] So social gatherings can be surprisingly powerful for building a career, as long as you approach them genuinely." }
      ]
    },
    { id: "sfr", badge: "platform", title: "Family Relationships", src: "Практика платформы",
      scenario: "We're exploring people's views and experiences related to family life. I'd like to ask you a few questions.",
      questions: [
        { q: "First, how would you describe your family structure? For example, who do you live with, or who do you consider to be part of your immediate family?",
          lx: ["immediate family", "extended family", "close-knit"],
          model: "[A] My immediate family is my parents, my older sister, my younger sister and brother, and our dog, Max. [R] Right now, I live in a university dorm with roommates, but I go home often, and we're quite a close family. My grandmother is also a very important part of my life. [E] For example, my older sister is married and has a baby son, so now I'm an uncle, which is very exciting! My younger sister and brother are still at school. My grandmother lives in a village nearby, and the whole family meets at her house for Sunday lunch at least once a month. [C] So my family is not very big, but we're close.",
          model5: "[A] My **immediate family** consists of my parents, my older sister, my younger sister and brother and, of course, our golden retriever, Max. [R] At the moment, I live in a university dorm with roommates, but I go home regularly, and we're a fairly **close-knit** family; my grandmother is also central to my life. [E] My older sister, for instance, is married and recently had a baby son, which has made me a very proud uncle, while my younger siblings are still in high school. My grandmother lives in a village nearby, and the whole family gathers at her house for Sunday lunch at least once a month. [C] So my family isn't large, but it's very close." },
        { q: "What are some values or habits that are important in your family, such as how you spend time together or handle responsibilities?",
          lx: ["values", "spend quality time with", "family ties"],
          model: "[A] The most important values in my family are honesty, helping each other and spending time together. [R] My parents always said that we can make mistakes, but we must tell the truth. And everyone has responsibilities, because a family is a team. [E] For example, when we were children, each of us had jobs at home — I walked the dog and took out the trash, and my sister helped with cooking. We also had a rule: dinner together at seven with no phones. Even now, when I visit, we still have that dinner, and it's my favorite part of the day. [C] So for my family, honesty and time together are the most important things.",
          model5: "[A] Honesty, mutual support and shared time are probably the core values in my family. [R] My parents always told us that mistakes were forgivable, but lying wasn't, and they treated the household as a team in which everyone had responsibilities. [E] As children, for instance, we each had our own chores: I walked the dog and took out the rubbish, while my sister helped with cooking. We also had a firm rule of dinner together at seven, with no phones at the table, and even now, whenever I'm home, that dinner remains my favorite part of the day. [C] So in my family, honesty and **quality time** matter far more than any material things." },
        { q: "What do you think helps maintain strong and healthy family relationships? And on the other hand, what do you think causes tension or distance between family members?",
          lx: ["clear the air", "fall out with", "spend quality time with"],
          model: "[A] I think good communication and spending time together keep families strong, and things like money problems and not talking cause tension. [R] When family members talk openly, small problems don't become big ones. But when people are too busy or avoid difficult topics, they slowly become distant. [E] For example, a few years ago, my parents and my older sister argued about her decision to leave university. For months, they hardly spoke. Finally, my grandmother invited everyone for lunch, and they talked honestly to clear the air. Now they're close again. On the other hand, one of my uncles stopped talking to his brother because of money, and they still don't speak. [C] So honest talking is the key.",
          model5: "[A] Open communication and regular time together are what keep families strong, whereas unspoken resentment, often linked to money, tends to drive them apart. [R] When people talk honestly, small disagreements are resolved before they grow, but when they avoid difficult conversations, distance builds quietly over time. [E] A few years ago, for instance, my parents and my older sister barely spoke for months after she decided to leave university. It was my grandmother who finally invited everyone to lunch, where they talked things through and **cleared the air**, and they're close again now. By contrast, one of my uncles fell out with his brother over an inheritance, and they remain **estranged** to this day. [C] So honest conversation is, in my view, the single most important factor." },
        { q: "As society changes, family roles and expectations also evolve. Some people live far apart or communicate mostly online. Do you think the definition of \"family\" is changing in today's world? Why or why not—and do you see that change as positive, negative, or both?",
          lx: ["nuclear / extended family", "keep in touch with", "the family we choose"],
          model: "[A] Yes, I think the definition of family is changing, and I see it as mostly positive. [R] In the past, family meant parents, children and relatives living close together. Now, families are more different — people live in different countries, and close friends can feel like family. But it can be negative when family members feel lonely or far from each other. [E] For example, my aunt lives in Germany, and we see her only once a year, but we talk in our family group chat every day. Also, my friend from the refugee center says that the other volunteers are her family now, because her real family is far away. [C] So family is becoming more about love and support than about living together.",
          model5: "[A] I believe it is, and largely for the better, although there are downsides. [R] Family once meant parents, children and relatives living close together, whereas today it's more fluid: relatives are scattered across countries, and close friends often play the role of family. The risk, however, is that distance can leave some people, particularly older relatives, feeling isolated. [E] My aunt, for instance, lives in Germany, and although we see her only once a year, she's part of our family group chat every single day. Meanwhile, a woman I know through the refugee center describes her fellow volunteers as her family, since her own relatives are thousands of kilometers away. [C] So family is increasingly defined by love and support rather than by blood or geography." }
      ]
    }
  ],
