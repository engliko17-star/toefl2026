<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview — TOEFL Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Подключаем auth.js для авторизации и глобального объекта _supabase -->
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fa; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col md:flex-row">

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 px-4 py-6 h-screen sticky top-0 shrink-0">
        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span><span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>
        <nav class="flex-1 space-y-1">
            <a href="speaking.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 transition">
                <i data-lucide="arrow-left" class="w-5 h-5"></i><span>Back to Speaking</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-6 overflow-y-auto pb-24 md:pb-6 max-w-5xl mx-auto">
        
        <div class="mb-8 mt-4">
            <a href="speaking.html" class="inline-flex items-center text-xs font-bold text-gray-400 hover:text-slate-700 uppercase tracking-wider mb-4 transition">
                <i data-lucide="arrow-left" class="w-3 h-3 mr-1"></i> Back to Speaking
            </a>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Interview Practice</h1>
            <p class="text-sm text-gray-500 mt-1">Simulate a live interview environment. Watch the video question and respond within 45 seconds.</p>
        </div>

        <div id="tests-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Сюда будут загружаться тесты -->
        </div>

    </main>

    <script>
        // Инициализация иконок
        lucide.createIcons();

        let currentUser = null;

        // Функция для загрузки тестов из базы данных
        async function loadTests() {
            const container = document.getElementById('tests-container');
            container.innerHTML = '<p class="text-sm text-gray-500 col-span-full">Loading tests from database...</p>';

            try {
                // 1. Проверяем авторизацию
                if (typeof requireAuth !== 'function') throw new Error("auth.js is missing.");
                currentUser = await requireAuth();
                if (!currentUser) return; // auth.js перенаправит на логин, если пользователя нет

                // 2. Запрашиваем тесты, где тип = interview
                const { data: tests, error: testsError } = await _supabase
                    .from('speaking_tests')
                    .select('*')
                    .eq('type', 'interview') 
                    .order('created_at', { ascending: true }); // Сортируем от старых к новым (Set 1, Set 2...)

                if (testsError) throw testsError;

                // 3. Запрашиваем попытки текущего пользователя для этого типа
                const { data: attempts, error: attemptsError } = await _supabase
                    .from('speaking_attempts')
                    .select('id, test_id')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false }); // От новых попыток к старым

                if (attemptsError) throw attemptsError;

                // Очищаем надпись загрузки
                container.innerHTML = '';

                // Если тестов пока нет
                if (!tests || tests.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full bg-white p-8 rounded-2xl border border-gray-100 text-center">
                            <i data-lucide="video" class="w-8 h-8 text-gray-300 mx-auto mb-3"></i>
                            <p class="text-sm text-gray-500">No interview tests available yet. Add them in Supabase!</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                // 4. Перебираем полученные тесты и создаем HTML-карточки
                tests.forEach((test, index) => {
                    const setNumber = index + 1;
                    
                    // Ищем последнюю попытку для текущего теста
                    const testAttempt = attempts ? attempts.find(a => a.test_id === test.id) : null;
                    
                    let buttonsHTML = '';

                    // Если попытка есть, показываем кнопки Review и Retake
                    if (testAttempt) {
                        buttonsHTML = `
                            <div class="mt-auto flex space-x-2 w-full pt-4">
                                <a href="interview_results.html?attempt_id=${testAttempt.id}" class="flex-1 py-2.5 bg-sky-50 hover:bg-sky-100 text-sky-600 text-xs font-bold rounded-xl flex items-center justify-center transition border border-sky-200 shadow-sm">
                                    Review <i data-lucide="video" class="w-3.5 h-3.5 ml-1.5"></i>
                                </a>
                                <a href="speaking_player.html?type=interview&id=${test.id}" class="flex-1 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl flex items-center justify-center transition shadow-sm">
                                    Retake <i data-lucide="rotate-cw" class="w-3.5 h-3.5 ml-1.5"></i>
                                </a>
                            </div>
                        `;
                    } else {
                        // Если попыток нет, показываем кнопку Start Practice
                        buttonsHTML = `
                            <div class="mt-auto pt-4">
                                <a href="speaking_player.html?type=interview&id=${test.id}" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl flex items-center justify-center transition shadow-sm">
                                    Start Practice <i data-lucide="arrow-right" class="w-3.5 h-3.5 ml-1.5"></i>
                                </a>
                            </div>
                        `;
                    }

                    // Формируем бейдж статуса
                    const cardStatus = testAttempt 
                        ? `<span class="text-[10px] font-bold tracking-wider text-sky-600 uppercase bg-sky-100 px-2 py-1 rounded border border-sky-200">Completed</span>`
                        : `<span class="text-[10px] font-bold tracking-wider text-slate-500 uppercase bg-slate-100 px-2 py-1 rounded border border-slate-200">New</span>`;
                    
                    const cardHTML = `
                        <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col hover:border-sky-100 transition">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[10px] font-bold tracking-wider text-sky-500 uppercase bg-sky-50 px-2 py-1 rounded border border-sky-100">Set ${setNumber}</span>
                                ${cardStatus}
                            </div>
                            <h3 class="font-bold text-slate-800 mb-1 mt-4">${test.title}</h3>
                            <p class="text-xs text-gray-400 mb-2">${test.total_questions} Questions • 45s Response</p>
                            
                            ${buttonsHTML}
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });

                // Перерисовываем иконки для новых карточек
                lucide.createIcons();

            } catch (err) {
                console.error("Error loading tests:", err.message);
                container.innerHTML = '<p class="text-sm text-rose-500 col-span-full font-medium p-4 bg-rose-50 rounded-xl">Failed to load tests. Please check console.</p>';
            }
        }

        // Запускаем загрузку сразу после построения DOM
        document.addEventListener('DOMContentLoaded', loadTests);
    </script>
</body>
</html>
