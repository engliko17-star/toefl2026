<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Если CDN иконок не ответил, страница не должна падать на lucide.createIcons()
        if (!window.lucide || typeof window.lucide.createIcons !== 'function') window.lucide = { createIcons: function () {} };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="i18n.js"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <div id="app-sidebar"></div>
    <script src="nav.js"></script>

    <!-- Страницу раздела рисует section-hub.js (общий шаблон для всех четырёх разделов).
         Статьи, тексты и ссылки — в HUBS внутри section-hub.js. -->
    <main class="flex-1 min-w-0 overflow-y-auto pb-28 md:pb-10">
        <div class="max-w-6xl mx-auto px-4 sm:px-8 pt-5 sm:pt-10">
            <div id="hub" data-section="speaking"></div>
        </div>
    </main>

    <script src="section-hub.js"></script>
    <!-- число статей на кнопках «Все статьи» — после section-hub.js, когда кнопки уже нарисованы -->
    <script src="section-articles.js"></script>
</body>
</html>
