<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irregular Verbs Practice — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* 16px и больше — иначе iPhone увеличивает страницу при вводе ответа */
        #v2Input, #v3Input { font-size: 16px; }

        .perspective { perspective: 1000px; }
        .card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card-flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-back { transform: rotateY(180deg); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 invisible" id="pageBody">

    <a href="irregular-verbs.html" class="absolute top-6 left-6 flex items-center space-x-2 text-sm font-semibold text-slate-400 hover:text-slate-700 transition">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Back to List</span>
    </a>

    <div id="sessionContainer" class="w-full max-w-lg bg-white rounded-3xl border border-slate-200 shadow-xl p-6 md:p-8 space-y-6 relative hidden animate-fade-in">
        
        <div class="space-y-2">
            <div class="flex justify-between items-center text-xs font-bold text-slate-400 uppercase tracking-wider">
                <span id="sessionModeBadge" class="bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-lg border border-indigo-100">Practice</span>
                <span id="progressText">Verb 1 of 10</span>
            </div>
            <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-indigo-600 transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div id="quizArea" class="min-h-[280px] flex items-center justify-center flex-col">
            </div>

        <p id="bottomHint" class="text-center text-[11px] text-slate-400 font-medium h-4">
            Введите вторую и третью форму глагола
        </p>
    </div>

    <div id="resultsContainer" class="w-full max-w-sm bg-white rounded-3xl border border-slate-200 shadow-xl p-8 text-center space-y-6 hidden animate-fade-in">
        <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto text-indigo-600">
            <i data-lucide="trophy" class="w-8 h-8"></i>
        </div>
        <div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Practice Completed!</h2>
            <p class="text-xs text-slate-400 mt-1">Отличная работа!</p>
        </div>

        <div class="bg-slate-50 rounded-2xl p-4 grid grid-cols-2 gap-4 border border-slate-100">
            <div>
                <span class="block text-2xl font-extrabold text-indigo-600" id="resCorrectCount">0</span>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Правильно</span>
            </div>
            <div class="border-l border-slate-200">
                <span class="block text-2xl font-extrabold text-slate-700" id="resTotalCount">0</span>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Всего глаголов</span>
            </div>
        </div>

        <div class="space-y-2">
            <button onclick="location.reload()" class="w-full py-3 bg-indigo-600 text-white rounded-xl text-sm font-bold hover:bg-indigo-700 transition shadow-md cursor-pointer">
                Повторить эти же
            </button>
            <a href="irregular-verbs.html" class="w-full block py-3 bg-slate-100 text-slate-600 rounded-xl text-sm font-semibold hover:bg-slate-200 transition cursor-pointer border border-slate-200">
                Выбрать другие
            </a>
        </div>
    </div>

    <div id="loader" class="text-center space-y-3">
        <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-xs text-slate-400 font-medium">Preparing your verbs...</p>
    </div>

    <script>
        function vrEsc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        // Иконки: если библиотека не загрузилась, тренировка всё равно работает
        // (раньше ошибка здесь останавливала весь скрипт, и страница оставалась пустой)
        function vrIcons() { try { if (window.lucide) lucide.createIcons(); } catch (e) {} }
        vrIcons();
        const body = document.getElementById('pageBody');

        let reviewVerbs = [];
        let currentIndex = 0;
        let correctAnswers = 0;
        let answered = false;      // текущий глагол уже проверен
        let answeredAt = 0;

        function showMessage(text, withReload) {
            document.getElementById('loader').innerHTML = `<p class="text-sm text-slate-600 font-semibold max-w-xs mx-auto">${vrEsc(text)}</p>
                <div class="flex gap-2 justify-center mt-4">${withReload ? '<button onclick="location.reload()" class="px-5 py-2.5 bg-slate-900 text-white rounded-xl text-sm font-bold">Обновить</button>' : ''}
                <a href="irregular-verbs.html" class="px-5 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-sm font-bold border border-slate-200">К списку</a></div>`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Проверка доступа — общая, из auth.js (гость и неподтверждённая
            //    ученица сюда больше не попадают). Клиент тоже общий.
            const supabaseClient = window.supabaseClient;
            if (!supabaseClient || typeof requireAuth !== 'function') { body.classList.remove('invisible'); showMessage('Ошибка сети. Обновите страницу.', true); return; }
            const currentUser = await requireAuth();
            body.classList.remove('invisible');
            if (!currentUser) return;

            try {
                // 2. Сохранённые глаголы ученицы
                const { data: savedData, error: savedError } = await supabaseClient
                    .from('user_saved_verbs').select('v1').eq('user_id', currentUser.id);
                if (savedError) throw savedError;

                const selectedVerbs = Array.from(new Set((savedData || []).map(row => row.v1).filter(Boolean)));
                if (selectedVerbs.length === 0) {
                    showMessage('У вас нет сохранённых глаголов. Добавьте их на странице списка — значком закладки.');
                    return;
                }

                // 3. Полные данные только по выбранным глаголам
                const { data, error } = await supabaseClient.from('irregular_verbs').select('*').in('v1', selectedVerbs);
                if (error) throw error;

                reviewVerbs = shuffle((data || []).filter(v => v.v1 && v.v2 && v.v3));
                if (!reviewVerbs.length) { showMessage('Сохранённых глаголов больше нет в списке — выберите новые.'); return; }
            } catch (e) {
                console.error(e);
                showMessage('Не удалось загрузить глаголы: ' + (e.message || 'нет связи'), true);
                return;
            }

            document.getElementById('loader').classList.add('hidden');
            document.getElementById('sessionContainer').classList.remove('hidden');
            showVerb();
        });

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function playAudio(v1, v2, v3) {
            if (!('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const or = s => String(s || '').replace(/\s*[\/,;]\s*/g, ' or ');
                const utterance = new SpeechSynthesisUtterance(`${v1}. ${or(v2)}. ${or(v3)}.`);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } catch (e) {}
        }

        // Варианты формы: «learnt/learned», «got, gotten», «was / were», «dreamed or dreamt».
        // Раньше варианты понимались только во второй форме — в третьей «learnt»
        // при записи «learnt/learned» считалось ошибкой.
        function normForm(s) { return String(s || '').toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, ' ').trim(); }
        function variants(s) { return normForm(s).split(/\s*(?:[\/,;]|\bor\b)\s*/).map(x => x.trim()).filter(Boolean); }
        // Верно, если каждая написанная форма — допустимая («learnt», «learned» и «learnt/learned» — всё верно)
        function formOk(answer, correct) {
            const allowed = new Set(variants(correct)), full = normForm(correct), a = normForm(answer);
            if (!a) return false;
            if (a === full) return true;
            const parts = variants(a);
            return parts.length > 0 && parts.every(p => allowed.has(p));
        }

        const INPUT = 'type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="next"';

        function showVerb() {
            if (currentIndex >= reviewVerbs.length) {
                showResults();
                return;
            }
            answered = false;

            const total = reviewVerbs.length;
            document.getElementById('progressText').innerText = `Verb ${currentIndex + 1} of ${total}`;
            document.getElementById('progressBar').style.width = `${(currentIndex / total) * 100}%`;

            const currentVerb = reviewVerbs[currentIndex];
            const quizArea = document.getElementById('quizArea');

            quizArea.innerHTML = `
                <div class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-6 space-y-6 animate-fade-in">

                    <div class="text-center space-y-1">
                        <span class="text-3xl font-extrabold text-slate-900 tracking-tight block">${vrEsc(currentVerb.v1)}</span>
                        <span class="text-sm font-bold text-slate-400 block">${vrEsc(currentVerb.tr)}</span>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label for="v2Input" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">V2 (Past Simple)</label>
                            <input id="v2Input" ${INPUT} class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-indigo-100 font-bold tracking-wide text-center shadow-sm">
                        </div>
                        <div>
                            <label for="v3Input" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">V3 (Past Participle)</label>
                            <input id="v3Input" ${INPUT.replace('enterkeyhint="next"', 'enterkeyhint="done"')} class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-indigo-100 font-bold tracking-wide text-center shadow-sm">
                        </div>
                        <div id="feedback" class="text-sm font-bold hidden transition-all text-center p-3 rounded-xl border"></div>
                    </div>

                    <button id="checkBtn" type="button" class="w-full py-3 bg-slate-900 text-white rounded-xl text-sm font-bold hover:bg-slate-800 transition shadow-md cursor-pointer">
                        Check Forms
                    </button>
                </div>
            `;
            document.getElementById('checkBtn').addEventListener('click', onMainButton);

            // На телефоне фокус без касания не открывает клавиатуру, а только
            // сдвигает экран — ставим его сразу лишь на компьютере
            if (window.matchMedia('(hover:hover) and (pointer:fine)').matches) document.getElementById('v2Input').focus();
            document.getElementById('v2Input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); document.getElementById('v3Input').focus(); }
            });
        }

        // Одна кнопка: «Проверить», потом «Дальше». Двойное касание раньше сразу
        // перелистывало глагол, и правильный ответ не успевали увидеть.
        function onMainButton() {
            if (!answered) { checkAnswer(); return; }
            if (Date.now() - answeredAt < 400) return;
            currentIndex++;
            showVerb();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' || document.getElementById('sessionContainer').classList.contains('hidden')) return;
            if (e.target && e.target.id === 'v2Input') return;   // Enter во второй форме — к третьей
            if (e.target && e.target.tagName === 'BUTTON') return;  // на кнопке Enter сам нажмёт её — второй раз не нужно
            e.preventDefault();
            onMainButton();
        });

        function checkAnswer() {
            if (answered) return;
            answered = true; answeredAt = Date.now();
            const v2Input = document.getElementById('v2Input');
            const v3Input = document.getElementById('v3Input');
            const feedback = document.getElementById('feedback');
            const checkBtn = document.getElementById('checkBtn');
            const currentVerb = reviewVerbs[currentIndex];

            v2Input.disabled = true;
            v3Input.disabled = true;
            feedback.classList.remove('hidden');

            const isV2Correct = formOk(v2Input.value, currentVerb.v2);
            const isV3Correct = formOk(v3Input.value, currentVerb.v3);

            if (isV2Correct && isV3Correct) {
                v2Input.className = "w-full px-4 py-3 bg-green-50 border border-green-300 rounded-xl text-base font-bold text-center text-green-700";
                v3Input.className = "w-full px-4 py-3 bg-green-50 border border-green-300 rounded-xl text-base font-bold text-center text-green-700";
                feedback.className = "text-xs font-bold text-green-700 mt-2 text-center bg-green-50 border border-green-200 p-2 rounded-lg";
                feedback.innerText = "✨ Perfect!";
                correctAnswers++;
            } else {
                v2Input.className = `w-full px-4 py-3 border rounded-xl text-base font-bold text-center ${isV2Correct ? 'bg-green-50 border-green-300 text-green-700' : 'bg-red-50 border-red-300 text-red-700'}`;
                v3Input.className = `w-full px-4 py-3 border rounded-xl text-base font-bold text-center ${isV3Correct ? 'bg-green-50 border-green-300 text-green-700' : 'bg-red-50 border-red-300 text-red-700'}`;

                feedback.className = "text-xs font-bold text-red-700 mt-2 text-center bg-red-50 border border-red-200 p-3 rounded-lg flex flex-col space-y-1";
                feedback.innerHTML = `
                    <span>Correct forms:</span>
                    <span class="text-sm font-extrabold text-slate-900">${vrEsc(currentVerb.v2)} / ${vrEsc(currentVerb.v3)}</span>
                `;
            }

            playAudio(currentVerb.v1, currentVerb.v2, currentVerb.v3);

            checkBtn.innerText = "Continue";
            checkBtn.className = "w-full py-3 bg-indigo-600 text-white rounded-xl text-sm font-bold hover:bg-indigo-700 transition shadow-md cursor-pointer mt-4";
            checkBtn.focus();
        }

        function showResults() {
            document.getElementById('sessionContainer').classList.add('hidden');
            document.getElementById('resCorrectCount').innerText = correctAnswers;
            document.getElementById('resTotalCount').innerText = reviewVerbs.length;
            document.getElementById('resultsContainer').classList.remove('hidden');
            vrIcons();
        }
    </script>
</body>
</html>
