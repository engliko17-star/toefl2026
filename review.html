<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Session — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="auth.js"></script>
    <script src="words.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        /* Стили для 3D переворота карточки */
        .perspective { perspective: 1000px; }
        .card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card-flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-back { transform: rotateY(180deg); }

        /* Анимация плавного появления */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex items-center justify-center p-4">

    <a href="vocabulary.html" class="absolute top-6 left-6 flex items-center space-x-2 text-sm font-semibold text-gray-400 hover:text-slate-700 transition">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Exit Review</span>
    </a>

    <div id="sessionContainer" class="w-full max-w-lg bg-white rounded-3xl border border-gray-100 shadow-xl p-6 md:p-8 space-y-6 relative hidden animate-fade-in">
        
        <div class="space-y-2">
            <div class="flex justify-between items-center text-xs font-bold text-gray-400 uppercase tracking-wider">
                <span id="sessionModeBadge" class="bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-lg">Flashcards</span>
                <span id="progressText">Word 1 of 10</span>
            </div>
            <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-indigo-600 transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div id="quizArea" class="min-h-[280px] flex items-center justify-center flex-col">
            </div>

        <p id="bottomHint" class="text-center text-[11px] text-gray-400 font-medium h-4">
            Кликните на карточку, чтобы перевернуть её
        </p>
    </div>

    <div id="resultsContainer" class="w-full max-w-sm bg-white rounded-3xl border border-gray-100 shadow-xl p-8 text-center space-y-6 hidden animate-fade-in">
        <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto text-indigo-600">
            <i data-lucide="trophy" class="w-8 h-8"></i>
        </div>
        <div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Review Completed!</h2>
            <p class="text-xs text-gray-400 mt-1">Отличная работа!</p>
        </div>

        <div class="bg-gray-50 rounded-2xl p-4 grid grid-cols-2 gap-4">
            <div>
                <span class="block text-2xl font-extrabold text-indigo-600" id="resCorrectCount">0</span>
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Правильно</span>
            </div>
            <div class="border-l border-gray-200/60">
                <span class="block text-2xl font-extrabold text-slate-700" id="resTotalCount">0</span>
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Всего слов</span>
            </div>
        </div>

        <div class="space-y-2">
            <button onclick="location.reload()" class="w-full py-3 bg-indigo-600 text-white rounded-xl text-sm font-bold hover:bg-indigo-700 transition shadow-md cursor-pointer">
                Повторить еще раз
            </button>
            <a href="vocabulary.html" class="w-full block py-3 bg-gray-50 text-slate-600 rounded-xl text-sm font-semibold hover:bg-gray-100 transition cursor-pointer">
                В библиотеку
            </a>
        </div>
    </div>

    <div id="loader" class="text-center space-y-3">
        <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-xs text-gray-400 font-medium">Preparing your study set...</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let reviewWords = [];
        let currentIndex = 0;
        let correctAnswers = 0;
        let sessionSettings = null;
        let currentMode = ''; 
        let currentUser = null;

        // Главная функция инициализации сессии
        window.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            
            // 1. Проверяем авторизацию (если нет, функция сама перекинет на login.html)
            currentUser = await requireAuth();
            if (!currentUser) return; 

            // 2. Берем НАСТРОЙКИ (какие списки выбраны) из localStorage
            sessionSettings = JSON.parse(localStorage.getItem('reviewSettings'));
            
            if (!sessionSettings || !sessionSettings.lists || sessionSettings.lists.length === 0) {
                alert("Настройки сессии не найдены. Выберите списки для повторения.");
                window.location.href = 'vocabulary.html';
                return;
            }

            // 3. Загружаем сами слова
            await loadSessionWords();
        });

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function loadSessionWords() {
            // 1. Качаем слова пользователя напрямую из базы Supabase
            const { data, error } = await supabaseClient
                .from('user_vocabulary')
                .select('word, list_name')
                .eq('user_id', currentUser.id);

            if (error) {
                console.error("Ошибка при получении списков:", error);
                alert("Не удалось загрузить списки слов. Попробуйте еще раз.");
                window.location.href = 'vocabulary.html';
                return;
            }

            // 2. Отбираем только уникальные слова из тех списков, которые юзер выбрал
            let uniqueWordNames = new Set();
            data.forEach(row => {
                if (sessionSettings.lists.includes(row.list_name)) {
                    uniqueWordNames.add(row.word);
                }
            });

            if (uniqueWordNames.size === 0) {
                alert("В выбранных списках нет слов для повторения!");
                window.location.href = 'vocabulary.html';
                return;
            }

            // 3. Фильтруем массив allWords (из файла words.js), чтобы достать дефиниции и примеры
            if (typeof allWords === 'undefined' || allWords.length === 0) {
                 alert("Общая база слов не загружена. Проверьте подключение words.js");
                 return;
            }

            reviewWords = allWords.filter(w => uniqueWordNames.has(w.word));
            reviewWords = shuffle(reviewWords);

            // Переключаем экраны
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('sessionContainer').classList.remove('hidden');

            initSession();
        }

        function initSession() {
            currentIndex = 0;
            correctAnswers = 0;
            showWord();
        }

        function showWord() {
            // Перед рендерингом нового слова сбрасываем текущую озвучку
            window.speechSynthesis.cancel();

            if (currentIndex >= reviewWords.length) {
                showResults();
                return;
            }

            const total = reviewWords.length;
            document.getElementById('progressText').innerText = `Word ${currentIndex + 1} of ${total}`;
            document.getElementById('progressBar').style.width = `${(currentIndex / total) * 100}%`;

            const currentWordObj = reviewWords[currentIndex];
            
            // Вычисляем режим для текущей карточки
            currentMode = sessionSettings.mode;
            if (currentMode === 'mixed') {
                const modes = ['flashcards', 'typing', 'dictation'];
                currentMode = modes[Math.floor(Math.random() * modes.length)];
            }

            const quizArea = document.getElementById('quizArea');
            const bottomHint = document.getElementById('bottomHint');
            quizArea.innerHTML = '';

            const safeExample = currentWordObj.example ? currentWordObj.example.replace(/"/g, '&quot;') : '';

            // --- КАРТОЧКИ ---
            if (currentMode === 'flashcards') {
                document.getElementById('sessionModeBadge').innerText = "Flashcards";
                bottomHint.innerText = "Кликните на карточку, чтобы перевернуть её";
                
                quizArea.innerHTML = `
                    <div class="w-full h-64 perspective cursor-pointer" onclick="flipCard()">
                        <div id="cardInner" class="w-full h-full card-inner relative rounded-2xl border border-gray-100 shadow-xs bg-white">
                            <div class="card-front absolute inset-0 flex flex-col items-center justify-center p-6 bg-slate-50/50 rounded-2xl">
                                <span class="text-3xl font-extrabold text-slate-900 tracking-tight">${currentWordObj.word}</span>
                                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider mt-2 bg-white px-2.5 py-1 rounded-md border border-gray-100">${currentWordObj.part}</span>
                            </div>
                            <div class="card-back absolute inset-0 flex flex-col justify-center p-6 bg-indigo-600 rounded-2xl text-white text-center space-y-3">
                                <p class="text-base font-medium leading-relaxed">${currentWordObj.definition}</p>
                                ${currentWordObj.example ? `<p class="text-xs text-indigo-100 italic opacity-90 border-t border-indigo-500/40 pt-2 font-light">"${currentWordObj.example}"</p>` : ''}
                            </div>
                        </div>
                    </div>
                `;

                const actionButtons = document.createElement('div');
                actionButtons.className = "flex justify-center space-x-3 w-full mt-4 animate-fade-in";
                actionButtons.innerHTML = `
                    <button onclick="event.stopPropagation(); nextWord(false)" class="px-5 py-2.5 bg-gray-50 text-slate-500 rounded-xl text-xs font-bold hover:bg-gray-100 transition flex items-center space-x-1 cursor-pointer">
                        <i data-lucide="frown" class="w-4 h-4 text-red-400"></i> <span>Forgot</span>
                    </button>
                    <button onclick="event.stopPropagation(); nextWord(true)" class="px-5 py-2.5 bg-indigo-50 text-indigo-600 rounded-xl text-xs font-bold hover:bg-indigo-100 transition flex items-center space-x-1 cursor-pointer">
                        <i data-lucide="smile" class="w-4 h-4 text-green-500"></i> <span>Knew it</span>
                    </button>
                `;
                quizArea.appendChild(actionButtons);

            // --- НАПИСАНИЕ ПО ОПРЕДЕЛЕНИЮ ---
            } else if (currentMode === 'typing') {
                document.getElementById('sessionModeBadge').innerText = "Type the Word";
                bottomHint.innerText = "Прочтите определение и введите слово";

                quizArea.innerHTML = `
                    <div class="w-full bg-slate-50/60 border border-gray-100 rounded-2xl p-6 space-y-5 animate-fade-in">
                        <div class="space-y-1">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Definition (${currentWordObj.part})</span>
                            <p class="text-slate-800 font-medium text-sm leading-relaxed">${currentWordObj.definition}</p>
                        </div>
                        <div class="space-y-2">
                            <input type="text" id="typingInput" placeholder="Type your answer here..." autocomplete="off" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100 font-bold tracking-wide">
                            <div id="typingFeedback" class="text-xs font-bold hidden transition-all"></div>
                        </div>
                        <button id="checkBtn" onclick="checkAnswer('typing')" class="w-full py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition shadow-xs cursor-pointer">
                            Check Answer
                        </button>
                    </div>
                `;
                setupEnterKey('typingInput', 'typing');

            // --- АУДИО-ДИКТАНТ ---
            } else if (currentMode === 'dictation') {
                document.getElementById('sessionModeBadge').innerText = "Listen & Type";
                bottomHint.innerText = "Послушайте произношение и введите слово";

                quizArea.innerHTML = `
                    <div class="w-full bg-slate-50/60 border border-gray-100 rounded-2xl p-6 space-y-6 flex flex-col items-center animate-fade-in">
                        <button onclick="playCurrentWordAudio()" class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center hover:bg-indigo-200 transition shadow-sm cursor-pointer group">
                            <i data-lucide="volume-2" class="w-8 h-8 group-hover:scale-110 transition-transform"></i>
                        </button>
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mt-[-10px]">Play Audio</p>

                        <div class="w-full space-y-2">
                            <input type="text" id="dictationInput" placeholder="Type what you hear..." autocomplete="off" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm text-center focus:outline-none focus:ring-2 focus:ring-indigo-100 font-bold tracking-wide">
                            <div id="dictationFeedback" class="text-xs font-bold hidden transition-all text-center"></div>
                            
                            <div id="dictationReveal" class="hidden mt-3 p-4 bg-white border border-gray-100 rounded-xl text-left w-full space-y-1">
                                <div class="flex justify-between items-center">
                                    <span class="text-lg font-extrabold text-slate-900" id="revealWord"></span>
                                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">${currentWordObj.part}</span>
                                </div>
                                <p class="text-sm text-slate-600 font-medium">${currentWordObj.definition}</p>
                            </div>
                        </div>

                        <button id="checkDictationBtn" onclick="checkAnswer('dictation')" class="w-full py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition shadow-xs cursor-pointer mt-2">
                            Check Answer
                        </button>
                    </div>
                `;

                setupEnterKey('dictationInput', 'dictation');
                setTimeout(playCurrentWordAudio, 400); 
            }

            lucide.createIcons();
            
            const inputField = document.getElementById(currentMode === 'typing' ? 'typingInput' : (currentMode === 'dictation' ? 'dictationInput' : null));
            if(inputField) inputField.focus();
        }

        function playCurrentWordAudio() {
            window.speechSynthesis.cancel(); 
            const wordText = reviewWords[currentIndex].word;
            const utterance = new SpeechSynthesisUtterance(wordText);
            utterance.lang = 'en-US';
            utterance.rate = 0.9; 
            window.speechSynthesis.speak(utterance);
        }

        function flipCard() {
            const cardInner = document.getElementById('cardInner');
            if (cardInner) cardInner.classList.toggle('card-flipped');
        }

        function setupEnterKey(inputId, mode) {
            document.getElementById(inputId).addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    const btnId = mode === 'typing' ? 'checkBtn' : 'checkDictationBtn';
                    const btn = document.getElementById(btnId);
                    if (btn.innerText === 'Check Answer') {
                        checkAnswer(mode);
                    } else {
                        btn.click();
                    }
                }
            });
        }

        function checkAnswer(mode) {
            const inputId = mode === 'typing' ? 'typingInput' : 'dictationInput';
            const feedbackId = mode === 'typing' ? 'typingFeedback' : 'dictationFeedback';
            const btnId = mode === 'typing' ? 'checkBtn' : 'checkDictationBtn';
            
            const input = document.getElementById(inputId);
            const feedback = document.getElementById(feedbackId);
            const checkBtn = document.getElementById(btnId);
            const currentWordObj = reviewWords[currentIndex];

            const userAnswer = input.value.trim().toLowerCase();
            const correctAnswer = currentWordObj.word.trim().toLowerCase();

            input.disabled = true;
            feedback.classList.remove('hidden');

            const isCorrect = (userAnswer === correctAnswer);

            if (isCorrect) {
                input.className = `w-full px-4 py-3 bg-green-50 border border-green-300 rounded-xl text-sm font-bold tracking-wide text-green-700 ${mode === 'dictation' ? 'text-center' : ''}`;
                feedback.innerText = "✨ Correct! Excellent spelling.";
                feedback.className = "text-xs font-bold text-green-600 mt-1";
                correctAnswers++;
            } else {
                input.className = `w-full px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-sm font-bold tracking-wide text-red-700 ${mode === 'dictation' ? 'text-center' : ''}`;
                feedback.innerHTML = `❌ Incorrect. Correct spelling is: <span class="underline">${currentWordObj.word}</span>`;
                feedback.className = "text-xs font-bold text-red-500 mt-1";
            }

            if (mode === 'dictation') {
                document.getElementById('dictationReveal').classList.remove('hidden');
                document.getElementById('revealWord').innerText = currentWordObj.word;
            }

            checkBtn.innerText = "Continue";
            checkBtn.className = "w-full py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700 transition shadow-xs cursor-pointer mt-4";
            checkBtn.onclick = () => nextWord(isCorrect);
        }

        function nextWord(wasCorrect) {
            if (currentMode === 'flashcards' && wasCorrect) {
                correctAnswers++;
            }
            currentIndex++;
            showWord();
        }

        // Вывод результатов тестирования
        function showResults() {
            window.speechSynthesis.cancel();
            document.getElementById('sessionContainer').classList.add('hidden');
            document.getElementById('bottomHint').classList.add('hidden');
            
            document.getElementById('resCorrectCount').innerText = correctAnswers;
            document.getElementById('resTotalCount').innerText = reviewWords.length;
            
            document.getElementById('resultsContainer').classList.remove('hidden');
            lucide.createIcons();

            // В будущем: здесь можно добавить функцию отправки результата 
            // в таблицу статистики в Supabase!
        }
    </script>
</body>
</html>
