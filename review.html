<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="T-Vocab">
<link rel="manifest" href="vocab-manifest.json">
<title>Тренировка — T-Vocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<style>
:root{
  --bg:#f5f6fa; --surface:#fff; --surface-2:#f0f2f7; --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --faint:#94a3b8; --line:#e6e9f0;
  --primary:#4f46e5; --primary-ink:#4338ca; --primary-soft:#eef2ff;
  --mint:#10b981; --mint-ink:#047857; --mint-soft:#e9fbf3;
  --amber:#f59e0b; --amber-ink:#b45309; --amber-soft:#fff6e5;
  --rose:#e11d48; --rose-ink:#be123c; --rose-soft:#fff1f3;
  --font:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --safe-b:env(safe-area-inset-bottom, 0px); --safe-t:env(safe-area-inset-top, 0px);
}
body.dyslexia-mode{--font:'Lexend', system-ui, sans-serif; --bg:#fbf6ec; --surface:#fffdf8; --surface-2:#f5efe3; --line:#ece4d4; --ink:#2b2b2b; letter-spacing:.01em}
body.dyslexia-mode .ex, body.dyslexia-mode em{font-style:normal}
body.dyslexia-mode p{line-height:1.75}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
p,h1,h2,h3{margin:0}
a{color:inherit;text-decoration:none}
.ic{display:inline-block;vertical-align:middle;flex:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px;border-radius:10px}

/* ---------- Каркас сессии ---------- */
.session{position:fixed;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.s-top{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 10px) 12px 6px}
.icon-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:active{background:var(--surface-2)}
.s-bar{flex:1;height:10px;border-radius:5px;background:#e3e6ee;overflow:hidden}
.s-bar i{display:block;height:100%;width:0;border-radius:5px;background:var(--primary);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.s-bar.learn i{background:var(--mint)}
.s-count{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mode-chip{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 10px;border-radius:17px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2);flex:none}
.s-tag{display:flex;align-items:center;justify-content:center;gap:8px;min-height:26px;font-size:13px;font-weight:700;color:var(--muted);padding:4px 16px 0}
.retry{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:var(--amber-soft);color:var(--amber-ink);font-size:11.5px;font-weight:800}
.stage{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;justify-content:center;-webkit-overflow-scrolling:touch}
.stage.top{justify-content:flex-start;padding-top:16px}
.stage.split{justify-content:flex-start;padding-top:16px}
.stage.split .bottom{margin-top:auto;padding-top:14px}
.stage.split .reveal{margin-top:12px}
.s-actions{padding:8px 16px calc(var(--safe-b) + 14px);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;min-height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 18px;border-radius:17px;font-weight:800;font-size:16px;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn-sm{height:42px;font-size:14px;border-radius:13px;padding:0 14px}
.btn-primary{background:var(--primary);color:#fff}
.btn-dark{background:var(--ink);color:#fff}
.btn-soft{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.btn-mint{background:var(--mint);color:#fff}
.btn-rose{background:var(--rose-soft);color:var(--rose-ink)}
.btn-amber{background:var(--amber-soft);color:var(--amber-ink)}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.say{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.say.on-dark{background:rgba(255,255,255,.16);color:#fff}

/* ---------- Карточка с переворотом и свайпом ---------- */
.card-zone{width:100%;max-width:520px;margin:0 auto;perspective:1400px}
.swipe-wrap{position:relative;touch-action:pan-y;will-change:transform;user-select:none;-webkit-user-select:none}
.fcard{position:relative;height:min(58vh,440px);min-height:290px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.fcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;padding:24px 22px;display:flex;flex-direction:column;overflow-y:auto;text-align:center}
.face-in{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.front{background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 34px rgba(15,23,42,.07)}
.back{background:radial-gradient(130% 90% at 100% 0%,#7c74ff 0%,rgba(124,116,255,0) 55%),var(--primary);color:#fff;transform:rotateY(180deg)}
.back.browse{background:#334155}
.big-word{font-size:clamp(30px,9vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.05;word-break:break-word}
.def-text{font-size:19px;line-height:1.5;font-weight:600}
.back .def-text{font-weight:600}
.tap-hint{font-size:12.5px;color:var(--faint);font-weight:700;margin-top:6px}
.fam{font-size:13px;opacity:.85;line-height:1.6}
.ex{font-size:14.5px;line-height:1.55;font-style:italic;opacity:.92;border-top:1px solid rgba(255,255,255,.22);padding-top:12px;width:100%}
.front .ex{border-color:var(--line)}
.ex mark{background:transparent;color:inherit;font-weight:800;font-style:normal;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.tr-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:11px;background:var(--surface-2);color:var(--muted);font-size:13px;font-weight:700}
.on-dark .tr-btn, .back .tr-btn{background:rgba(255,255,255,.16);color:#fff}
.tr-text{font-size:16px;font-weight:600;opacity:.85}
.stamp{position:absolute;top:22px;padding:6px 12px;border-radius:12px;font-weight:800;font-size:15px;border:3px solid;opacity:0;pointer-events:none;z-index:2;background:rgba(255,255,255,.9)}
.stamp-l{right:20px;color:var(--rose);border-color:var(--rose);transform:rotate(10deg)}
.stamp-r{left:20px;color:var(--mint-ink);border-color:var(--mint);transform:rotate(-10deg)}
.swipe-help{text-align:center;font-size:12px;color:var(--faint);font-weight:600;margin-top:12px;min-height:18px}

/* ---------- Задание с определением ---------- */
.prompt{width:100%;max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px}
.prompt .def-text{font-size:18px}
.prompt-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.answer-zone{width:100%;max-width:520px;margin:14px auto 0}
.inp{width:100%;height:58px;border-radius:18px;border:2px solid var(--line);background:var(--surface);padding:0 18px;font-size:20px;font-weight:700;letter-spacing:.01em;outline:none;transition:border-color .15s, background .15s}
.inp:focus{border-color:#a5b4fc}
.inp.ok{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-ink)}
.inp.bad{border-color:#fda4af;background:var(--rose-soft);color:var(--rose-ink)}
.inp.center{text-align:center}
.mask{font-size:20px;font-weight:800;letter-spacing:.32em;color:var(--primary-ink);text-align:center;margin-top:10px}
.feedback{font-size:15px;font-weight:700;margin-top:12px;min-height:22px;text-align:center}
.feedback.ok{color:var(--mint-ink)} .feedback.bad{color:var(--rose-ink)} .feedback.almost{color:var(--amber-ink)}
.inline-actions{display:grid;grid-template-columns:auto 1fr 1.25fr;gap:8px;margin-top:12px}
.inline-actions.one{grid-template-columns:1fr 1.25fr}
.fb-hint{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:4px;text-align:center}
.reveal{width:100%;max-width:520px;margin:14px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px;animation:pop .25s ease-out}
.reveal .ex{border:0;padding:0;opacity:1;color:var(--ink-2)}
.reveal .ex mark{color:var(--primary-ink)}
.reveal-word{display:flex;align-items:center;gap:12px}
.reveal-word b{font-size:24px;font-weight:800;letter-spacing:-.02em;flex:1}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.shake{animation:shake .4s}

/* выбор ответа */
.options{display:grid;gap:10px;width:100%;max-width:520px;margin:14px auto 0}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 16px;border-radius:18px;background:var(--surface);border:2px solid var(--line);font-size:18px;font-weight:700;text-align:left;transition:background .15s,border-color .15s,opacity .15s}
.opt:active{transform:scale(.99)}
.opt-k{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--faint);flex:none}
.opt.good{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-ink)}
.opt.bad{border-color:#fda4af;background:var(--rose-soft);color:var(--rose-ink)}
.opt.dim{opacity:.45}
.skip{display:block;margin:14px auto 0;font-size:14px;font-weight:700;color:var(--muted);padding:8px 12px;border-radius:10px}

/* собрать из букв */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px auto 0;max-width:520px}
.slot{width:38px;height:50px;border-radius:12px;background:var(--surface);border:2px dashed #d3d8e3;display:grid;place-items:center;font-size:22px;font-weight:800;text-transform:lowercase}
.slot.filled{border-style:solid;border-color:#a5b4fc;color:var(--primary-ink)}
.slot.fixed{border:0;background:transparent;width:14px}
.slot.ok{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-ink)}
.slot.bad{border-color:#fda4af;background:var(--rose-soft);color:var(--rose-ink)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px auto 0;max-width:460px}
.tile{width:48px;height:54px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 #e0e4ee;font-size:22px;font-weight:800;text-transform:lowercase;transition:transform .1s, opacity .15s}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 #e0e4ee}
.tile.used{opacity:.18;pointer-events:none;box-shadow:none}

/* диктант */
.listen{display:flex;flex-direction:column;align-items:center;gap:14px;margin:6px 0 4px}
.play-big{width:108px;height:108px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:0 14px 34px rgba(79,70,229,.32)}
.play-big:active{transform:scale(.97)}
.play-row{display:flex;gap:8px}

/* ---------- Итоги ---------- */
.results-scroll{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.results{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 28px) 18px calc(var(--safe-b) + 24px);display:flex;flex-direction:column;gap:14px}
.res-hero{text-align:center;padding:10px 0 4px}
.res-hero h1{font-size:28px;font-weight:800;letter-spacing:-.025em;margin-top:14px}
.res-hero p{color:var(--muted);margin-top:4px}
.ring{position:relative;display:grid;place-items:center;margin:0 auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{position:relative;font-size:30px;font-weight:800;letter-spacing:-.03em}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res-stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.res-stat b{display:block;font-size:22px;font-weight:800}
.res-stat span{font-size:12px;color:var(--muted);font-weight:600}
.streak-box{display:flex;align-items:center;gap:12px;background:var(--amber-soft);color:var(--amber-ink);border-radius:18px;padding:14px 16px;font-weight:800}
.res-list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.res-row{display:flex;align-items:center;gap:10px;padding:11px 14px}
.res-row + .res-row{border-top:1px solid var(--line)}
.res-row b{flex:1;font-size:15.5px}
.res-row small{font-size:12.5px;font-weight:700}
.res-sec{font-size:14px;font-weight:700;color:var(--muted);margin:6px 4px -4px}

/* ---------- Шторка, тост, загрузка ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.42);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(var(--safe-b) + 18px);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.85,.25,1)}
.sheet::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:#d5dae4;margin:0 auto 12px}
.sheet-wrap.open .sheet{transform:none}.sheet-wrap.open .sheet-backdrop{opacity:1}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:4px}
.m-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;text-align:left;border-radius:14px}
.m-row + .m-row{border-top:1px solid var(--line)}
.m-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.m-row.on .m-ico{background:var(--primary);color:#fff}
.mchk{width:24px;height:24px;border-radius:8px;border:2px solid #cfd5e1;display:grid;place-items:center;color:#fff;flex:none}
.mchk.on{background:var(--primary);border-color:var(--primary)}
.m-row b{display:block;font-size:15.5px}
.m-row span{display:block;font-size:12.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;font-weight:600;color:var(--ink-2)}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);width:max-content;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#111a2e;color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;font-size:14px;font-weight:600;z-index:80;transition:opacity .2s,transform .2s;max-width:calc(100% - 28px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#a5b4fc;font-weight:800;padding:6px 8px}
.loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-weight:600;font-size:14px;padding:24px;text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid #dfe3ff;border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (min-width:1024px){
  .sheet-wrap{align-items:center}.sheet{border-radius:26px;transform:translateY(16px);opacity:0;transition:transform .2s, opacity .2s}.sheet-wrap.open .sheet{opacity:1;transform:none}.sheet::before{display:none}
  .stage{padding:16px 24px}
}
@media (max-height:640px){ .fcard{height:52vh;min-height:250px} .s-tag{min-height:20px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="loader" class="loader"><div class="spin"></div><span id="loaderText">Готовим слова…</span></div>

<div id="session" class="session" hidden>
  <header class="s-top">
    <button class="icon-btn" id="btnClose" aria-label="Закончить"></button>
    <div class="s-bar" id="sbar"><i id="pbar"></i></div>
    <span class="s-count" id="ptext"></span>
    <button class="mode-chip" id="btnMode" hidden></button>
  </header>
  <div class="s-tag" id="modeTag"></div>
  <main class="stage" id="stage"></main>
  <footer class="s-actions" id="actions"></footer>
</div>

<div id="resultsWrap" class="results-scroll" hidden><div id="results" class="results"></div></div>
<div id="toast" class="toast" role="status"></div>

<script>

   НАСТРОЙКИ

const SRS_INTERVALS_MIN = { 1: 15, 2: 30, 3: 60, 4: 180, 5: 360, 6: 720, 7: 1440, 8: 2160, 9: 4320, 10: 10080, 11: 20160, 12: 43200, 13: 86400 };
const SRS_MASTERED_BOX = 13;

/* ---------- иконки (встроенные, без внешней библиотеки) ---------- */

  check: '<path d="M20 6 9 17l-5-5"/>', undo: '<path d="M3 12a9 9 0 1 0 2.8-6.5L3 8"/><path d="M3 3v5h5"/>', chevD: '<path d="m6 9 6 6 6-6"/>',
  chevL: '<path d="m15 18-6-6 6-6"/>', chevR: '<path d="m9 18 6-6-6-6"/>', bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/>',

async function getUser() {

function fail(msg) {

async function loadProgress() {
  const PAGE = 1000; let rows = [], from = 0;
  while (true) {
    const { data, error } = await sb.from('user_word_progress')
      .select('word, correct_count, manually_marked, box, due_at, lapses, first_seen_at, last_result, last_reviewed_at')
      .eq('user_id', user.id).order('word', { ascending: true }).range(from, from + PAGE - 1);
    if (error) { console.error('Ошибка загрузки прогресса:', error); break; }
    rows = rows.concat(data || []);
    if (!data || data.length < PAGE) break;
    from += PAGE; if (from > 100000) break;
  }
  srs = {};
  rows.forEach(r => { const k = norm(r.word), p = srs[k]; if (p && (p.box || 0) >= (r.box || 0)) return; srs[k] = r; });
}
async function fetchWordsByNames(names) {
  const uniq = Array.from(new Set(names.filter(Boolean)));
  let rows = [];
  for (let i = 0; i < uniq.length; i += 150) {
    const { data, error } = await sb.from('words').select('*').in('word', uniq.slice(i, i + 150));
    if (error) { console.error('Ошибка таблицы words:', error); return null; }
    rows = rows.concat(data || []);
  }
  const byKey = new Map();
  rows.forEach(w => { const k = norm(w.word); if (!byKey.has(k)) byKey.set(k, w); });
  const out = [], seen = new Set();
  uniq.forEach(n => { const k = norm(n); if (byKey.has(k) && !seen.has(k)) { out.push(byKey.get(k)); seen.add(k); } });
  return out;
}
const box = w => ((srs[norm(w.word)] || {}).box) || 0;
const manual = w => !!(srs[norm(w.word)] || {}).manually_marked;

// Старый формат настроек (классическая страница): выбираем слова по спискам сами
async function legacySelect() {
  const { data, error } = await sb.from('user_vocabulary').select('word, list_name').eq('user_id', user.id);
  if (error) { fail('Не удалось загрузить ваши списки'); return null; }
  const names = (data || []).filter(r => (cfg.lists || []).includes(r.list_name)).map(r => r.word);
  let base = await fetchWordsByNames(names);
  if (!base) return null;
  if (isBrowse) {
    if (cfg.practiceScope === 'in_progress') base = base.filter(w => box(w) > 0 && box(w) < SRS_MASTERED_BOX);
    return shuffle(base);
  }
  base = base.filter(w => !manual(w));
  const now = Date.now();
  const due = shuffle(base.filter(w => { const p = srs[norm(w.word)]; return p && p.box && p.box < SRS_MASTERED_BOX && (!p.due_at || Date.parse(p.due_at) <= now); })).slice(0, MAX_REVIEWS);
  const fresh = shuffle(base.filter(w => !box(w)));
  const goal = cfg.dailyGoal || 10;
  let out = cfg.practiceScope === 'new' ? fresh.slice(0, goal) : cfg.practiceScope === 'in_progress' ? due : due.concat(fresh.slice(0, goal));

}
// Слова-«обманки» для выбора ответа: из тех же категорий
async function loadDistractors(base) {

  let pool = base.slice();
  try {
    if (cats.length) {
      const { data } = await sb.from('words').select('word, part, definition, category').in('category', cats.slice(0, 30)).limit(500);
      pool = pool.concat(data || []);
    }
    if (pool.length < 12) {
      const { data } = await sb.from('words').select('word, part, definition, category').limit(300);
      pool = pool.concat(data || []);
    }
  } catch (e) { console.warn('distractors:', e); }
  const m = new Map(); pool.forEach(w => { const k = norm(w.word); if (k && !m.has(k)) m.set(k, w); });
  distractors = Array.from(m.values());
}

const lettersOnly = w => (String(w.word).match(/[a-z]/gi) || []).length;

  [3, ['choice', 'letters', 'typing', 'flashcards_rev']],
  [7, ['letters', 'typing', 'dictation', 'choice']],

// Заучивание: карточка «слово → значение», потом «значение → слово», потом

  set = set.filter(m => m !== 'view' && m !== 'browse');
  // старое значение «Карточки» = обе стороны вперемешку
  if (set.length === 1 && set[0] === 'flashcards' && !Array.isArray(cfg.modes)) set = ['flashcards', 'flashcards_rev'];

  let pool = set.filter(m => feasible(m, item.w));

function pickNextLearn() {

  const pool = learnPool.length > 1 ? learnPool.filter(it => norm(it.w.word) !== lastShown) : learnPool;
  let best = pool[0], bs = learnSeen[norm(best.w.word)] || 0;
  pool.forEach(it => { const s = learnSeen[norm(it.w.word)] || 0; if (s < bs) { best = it; bs = s; } });
  return best;
}
function show() {

  if (isLearn) { item = pickNextLearn(); if (!item) return finish(); lastShown = norm(item.w.word); }
  else { if (idx >= items.length) return finish(); item = items[idx]; }
  cur = { item, w: item.w, mode: effectiveMode(item), done: false, attempts: 0, hint: false, flipped: false };
  const fam = family(cur.mode); modeUse[fam] = (modeUse[fam] || 0) + 1; lastFamily = fam;

function trMode() {

  try { return localStorage.getItem('vocabShowTranslation') === '1' ? 'always' : 'tap'; } catch (e) { return 'tap'; }
}
function autoplayOn() { return !cfg || cfg.autoplay !== false; }
function trHtml(w) {

  if (m === 'always' || (m === 'basic' && (c === 'A1' || c === 'A2'))) return `<p class="tr-text">${esc(w.translation_ru)}</p>`;

  if (!Array.isArray(f)) return '';
  f = f.map(x => { if (!x) return null; if (typeof x === 'string') { const m = x.match(/^(.+?)\s*\(([^)]+)\)\s*$/); return m ? { w: m[1], p: m[2] } : { w: x, p: '' }; } const a = x.w || x.word || x.form || '', b = x.p || x.part || x.pos || ''; return a ? { w: a, p: b } : null; }).filter(Boolean);

}
// Пример с вырезанным словом — чтобы он не подсказывал ответ
function exMasked(w) {
  if (!w.example) return '';
  const base = String(w.word || '').trim();
  if (!base) return '';
  const stem = base.length > 4 ? base.slice(0, base.length - (/(e|y)$/i.test(base) ? 1 : 0)) : base;
  const re = new RegExp('\\b' + stem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[a-z]*', 'ig');
  if (!re.test(w.example)) return '';
  return `<p class="ex" style="border:0;padding:0;color:var(--muted);margin-top:10px">${esc(w.example).replace(re, '_____')}</p>`;
}
function sayBtn(dark) { return `<button type="button" class="say ${dark ? 'on-dark' : ''}" data-say aria-label="Произнести">${ic('volume', 22)}</button>`; }

/* ---------- КАРТОЧКИ ---------- */
function renderCard(rev) {
  const w = cur.w, browse = cur.mode === 'browse';
  const wordFace = `<div class="face-in"><span class="pill">${esc(w.part || '')}</span><div class="big-word">${esc(w.word)}</div>${sayBtn(false)}<div class="tap-hint">Нажмите, чтобы перевернуть</div></div>`;
  const defBack = `<div class="face-in"><p class="def-text">${esc(w.definition || '')}</p>${trHtml(w)}${famHtml(w)}${exHtml(w)}</div>`;
  const defFace = `<div class="face-in"><span class="pill">${esc(w.part || '')}</span><p class="def-text">${esc(w.definition || '')}</p>${trHtml(w)}<div class="tap-hint">Вспомните слово и переверните</div></div>`;
  const wordBack = `<div class="face-in"><div class="big-word">${esc(w.word)}</div>${sayBtn(true)}${famHtml(w)}${exHtml(w)}</div>`;

      ${browse ? '' : `<div class="stamp stamp-l" id="stL">${left}</div><div class="stamp stamp-r" id="stR">${right}</div>`}
    </div><p class="swipe-help" id="swipeHelp">${browse ? 'Смахните влево — следующее слово' : ''}</p></div>`;
  cardActions();
  attachSwipe($('#swipe'));
  if (!rev && autoplayOn()) setTimeout(() => say(w.word), 250);
}
function flip() {
  const c = $('#fcard'); if (!c) return;
  c.classList.toggle('flipped');
  if (!cur.flipped) {
    cur.flipped = true;
    if (cur.mode === 'flashcards_rev') say(cur.w.word);   // слово открылось — теперь можно и озвучить
    cardActions();
    const h = $('#swipeHelp'); if (h && cur.mode !== 'browse') h.textContent = 'Смахните вправо — помню, влево — нет';
  }
}
function cardActions() {
  const a = $('#actions');
  if (cur.mode === 'browse') {
    a.innerHTML = `<button class="btn btn-soft" data-a="prev" ${idx ? '' : 'disabled'}>${ic('chevL', 20)}Назад</button><button class="btn btn-dark" data-a="next">Дальше${ic('chevR', 20)}</button>`;
    return;
  }
  if (!cur.flipped) { a.innerHTML = `<button class="btn btn-dark" data-a="flip">Показать ответ</button>`; return; }
  a.innerHTML = isLearn
    ? `<button class="btn btn-amber" data-a="again">${ic('repeat', 19)}Ещё раз</button><button class="btn btn-mint" data-a="remember">${ic('check', 19)}Помню</button>`
    : `<button class="btn btn-rose" data-a="forgot">Не помню</button><button class="btn btn-mint" data-a="knew">${ic('check', 19)}Помню</button>`;
}
// Свайп карточки: вправо — «помню», влево — «не помню».
// В пролистывании: влево — следующее, вправо — предыдущее.
function attachSwipe(el) {
  let x0 = 0, y0 = 0, dx = 0, pid = null, drag = false, moved = false;
  const browse = cur.mode === 'browse';
  const can = () => browse || cur.flipped;
  const stL = $('#stL'), stR = $('#stR');
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; pid = e.pointerId; drag = true; moved = false;
    el.style.transition = 'none';
  });
  el.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== pid) return;
    dx = e.clientX - x0; const dy = e.clientY - y0;
    if (!moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { moved = true; try { el.setPointerCapture(pid); } catch (er) {} }
    if (!moved) return;
    const d = can() ? dx : dx * .18;
    el.style.transform = `translateX(${d}px) rotate(${d / 22}deg)`;
    if (stL && stR && can()) { stR.style.opacity = Math.max(0, Math.min(1, dx / 110)); stL.style.opacity = Math.max(0, Math.min(1, -dx / 110)); }
  });
  const end = e => {
    if (!drag) return; drag = false;
    el.style.transition = 'transform .25s ease-out';
    if (!moved) { el.style.transform = ''; if (e.type === 'pointerup' && !e.target.closest('button')) flip(); return; }
    if (can() && Math.abs(dx) > 95) {
      const dir = dx > 0 ? 1 : -1;
      el.style.transform = `translateX(${dir * window.innerWidth}px) rotate(${dir * 18}deg)`;
      haptic(12);
      setTimeout(() => browse ? (dir < 0 ? browseStep(1) : browseStep(-1)) : judgeCard(dir > 0), 170);
    } else {
      el.style.transform = '';
      if (stL) stL.style.opacity = 0; if (stR) stR.style.opacity = 0;
    }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
function judgeCard(ok) {
  if (cur.done) return; cur.done = true;
  if (isLearn) {
    const k = norm(cur.w.word);
    learnSeen[k] = (learnSeen[k] || 0) + 1;
    // «Помню» на «слово → значение» → «значение → слово»; там «Помню» → написать
    learnStage[k] = ok ? (cur.mode === 'flashcards' ? 1 : 2) : 0;
    logAct({ reviews: 1 });
    show();
    return;
  }
  const snap = makeUndo(ok);
  judge(ok, 1);
  next();
  lastUndo = snap;
  toast(ok ? 'Помню' : 'Не помню — вернётся в конце', 'Отменить', undo);
}
function browseStep(d) {
  idx = Math.max(0, idx + d);
  show();
}

/* ---------- ВЫБОР ОТВЕТА ---------- */
function renderChoice() {
  const w = cur.w;
  cur.options = shuffle([w].concat(pickDistractors(w, 3)));
  $('#stage').innerHTML = `<div class="prompt"><div class="prompt-top"><span class="pill">${esc(w.part || '')}</span></div><p class="def-text">${esc(w.definition || '')}</p>${trHtml(w)}</div>
    <div id="after"></div>
    <div class="bottom"><div class="options" id="opts" style="margin-top:0">${cur.options.map((o, i) => `<button class="opt" data-pick="${i}"><span class="opt-k">${i + 1}</span>${esc(o.word)}</button>`).join('')}</div>
    </div>`;
  $('#actions').innerHTML = `<button class="btn btn-soft" data-pick="-1">Не помню</button>`;
}
function pick(i) {
  if (cur.done) return;
  const right = cur.options.findIndex(o => norm(o.word) === norm(cur.w.word));
  const ok = i === right;
  document.querySelectorAll('.opt').forEach((b, j) => b.classList.add(j === right ? 'good' : j === i ? 'bad' : 'dim'));
  answered(ok, 1);
}

/* ---------- СОБРАТЬ ИЗ БУКВ ---------- */
function renderLetters() {
  const w = cur.w, target = String(w.word).trim();
  cur.slots = [...target].map(ch => /[a-z]/i.test(ch) ? { ch: ch.toLowerCase(), val: null, tile: null } : { ch, fixed: true });
  const letters = cur.slots.filter(s => !s.fixed).map(s => s.ch);
  let mixed = shuffle(letters), guard = 0;
  while (mixed.join('') === letters.join('') && letters.length > 1 && guard++ < 10) mixed = shuffle(letters);
  cur.tiles = mixed.map((ch, id) => ({ ch, id, used: false }));
  $('#stage').innerHTML = `<div class="prompt"><div class="prompt-top"><span class="pill">${esc(w.part || '')}</span></div><p class="def-text">${esc(w.definition || '')}</p>${trHtml(w)}${exMasked(w)}</div>
    <div id="after"></div>
    <div class="answer-zone bottom"><div class="slots" id="slots"></div><div class="feedback" id="fb"></div><div class="tiles" id="tiles" style="margin-top:10px"></div></div>`;
  $('#actions').innerHTML = `<button class="btn btn-soft" data-a="erase">${ic('back', 20)}Стереть</button><button class="btn btn-soft" data-a="giveup">Не помню</button>`;
  drawLetters();
}
function drawLetters(state) {
  $('#slots').innerHTML = cur.slots.map((s, i) => s.fixed ? `<span class="slot fixed">${s.ch === ' ' ? '' : esc(s.ch)}</span>` :
    `<button class="slot ${s.val ? 'filled' : ''} ${state || ''}" data-slot="${i}" aria-label="буква ${i + 1}">${s.val ? esc(s.val) : ''}</button>`).join('');
  $('#tiles').innerHTML = cur.tiles.map(t => `<button class="tile ${t.used ? 'used' : ''}" data-tile="${t.id}">${esc(t.ch)}</button>`).join('');
}
function placeTile(id) {
  if (cur.done) return;
  const t = cur.tiles.find(x => x.id === id && !x.used); if (!t) return;
  const s = cur.slots.find(x => !x.fixed && !x.val); if (!s) return;
  s.val = t.ch; s.tile = t.id; t.used = true; haptic(5);
  drawLetters();
  if (cur.slots.every(x => x.fixed || x.val)) {
    const ans = cur.slots.map(x => x.fixed ? x.ch : x.val).join('');
    const ok = normAns(ans) === normAns(cur.w.word);
    if (ok) { drawLetters('ok'); answered(true, 1); }
    else if (cur.attempts === 0) {
      cur.attempts++;
      drawLetters('bad'); $('#slots').classList.add('shake');
      $('#fb').className = 'feedback almost'; $('#fb').textContent = 'Не совсем — поменяйте буквы местами';
      setTimeout(() => { const el = $('#slots'); if (el) el.classList.remove('shake'); }, 450);
    } else { revealLetters(); answered(false, 1); }
  }
}
function unplace(i) {
  if (cur.done) return;
  const s = cur.slots[i]; if (!s || s.fixed || !s.val) return;
  const t = cur.tiles.find(x => x.id === s.tile); if (t) t.used = false;
  s.val = null; s.tile = null; drawLetters();
}
function eraseLast() {
  for (let i = cur.slots.length - 1; i >= 0; i--) if (!cur.slots[i].fixed && cur.slots[i].val) { unplace(i); return; }
}
function revealLetters() {
  cur.slots.forEach(s => { if (!s.fixed) s.val = s.ch; });
  cur.tiles.forEach(t => t.used = true);
  drawLetters('bad');
}

/* ---------- НАПИСАТЬ / НА СЛУХ ---------- */
const INPUT_ATTRS = 'autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done"';
function renderTyping() {
  const w = cur.w;
  $('#stage').innerHTML = `<div class="prompt"><div class="prompt-top"><span class="pill">${esc(w.part || '')}</span></div><p class="def-text">${esc(w.definition || '')}</p>${trHtml(w)}${exMasked(w)}</div>
    <div class="answer-zone"><input id="inp" class="inp" ${INPUT_ATTRS} placeholder="Ваш ответ" aria-label="Ответ">
    <div class="mask" id="mask" hidden></div><div class="feedback" id="fb"></div>
    <div class="inline-actions" id="ia"><button class="btn btn-soft" data-a="hint" aria-label="Подсказка">${ic('bulb', 20)}</button><button class="btn btn-soft" data-a="dunno">Не помню</button><button class="btn btn-dark" data-a="check">Проверить</button></div>
    <div id="after"></div></div>`;
  $('#actions').innerHTML = '';

}
function renderDictation() {
  const w = cur.w;

      <div class="play-row"><button class="btn btn-soft btn-sm" data-a="slow">${ic('turtle', 18)}Медленнее</button></div></div>
    <div class="answer-zone"><input id="inp" class="inp center" ${INPUT_ATTRS} placeholder="Что вы услышали?" aria-label="Ответ">

    <div class="inline-actions one" id="ia"><button class="btn btn-soft" data-a="dunno">Не помню</button><button class="btn btn-dark" data-a="check">Проверить</button></div>
    <div id="after"></div></div>`;

}
function focusInput() {
  const i = $('#inp'); if (!i) return;
  // На телефоне клавиатура появляется только по касанию — фокус ставим
  // сразу лишь на компьютере, чтобы экран не прыгал.
  if (window.matchMedia('(hover:hover) and (pointer:fine)').matches) setTimeout(() => i.focus(), 60);
}
function hint() {
  if (cur.done) return;
  cur.hint = true;
  const t = String(cur.w.word).trim();
  const m = $('#mask'); m.hidden = false;
  m.textContent = [...t].map((ch, i) => i === 0 ? ch : (/[a-z]/i.test(ch) ? '_' : ch)).join('');
  $('#inp').focus();
}
function check() {
  if (cur.done) { finalize(cur.ok ? 'remember' : 'next'); return; }
  const inp = $('#inp'), ans = normAns(inp.value), target = normAns(cur.w.word);
  if (!ans) { inp.classList.add('shake'); setTimeout(() => inp.classList.remove('shake'), 420); inp.focus(); return; }
  if (ans === target) { answered(true, cur.mode === 'typing' ? (cur.hint ? 1 : 2) : 1); return; }
  // Одна опечатка в длинном слове — даём исправить, а не обнуляем прогресс
  if (cur.attempts === 0 && target.length >= 4 && lev(ans, target) === 1) {
    cur.attempts++;
    const fb = $('#fb'); fb.className = 'feedback almost'; fb.textContent = 'Почти! Одна буква не та — попробуйте ещё раз';
    inp.classList.add('shake'); setTimeout(() => inp.classList.remove('shake'), 420);
    inp.focus(); inp.select(); haptic([8, 40, 8]);

/* ---------- ОТВЕТ ПРИНЯТ ---------- */
// Ответ проверен — но ничего не засчитываем, пока ученик не нажмёт кнопку.
// Верно → «Ещё раз» (подсмотрел / угадал — слово вернётся в этой серии) или «Помню».
// Неверно → слово и так вернётся; в пролистывании можно выбрать «Ещё раз» или «Дальше».
function answered(ok, inc) {
  if (cur.done) return;
  cur.done = true; cur.ok = ok; cur.inc = inc;
  const w = cur.w;
  haptic(ok ? 15 : [20, 60, 20]);
  say(w.word);
  const inp = $('#inp');
  if (inp) { inp.disabled = true; inp.classList.add(ok ? 'ok' : 'bad'); inp.blur(); }
  const fb = $('#fb');
  if (fb) { fb.className = 'feedback ' + (ok ? 'ok' : 'bad'); fb.innerHTML = ok ? 'Верно!' : 'Правильно: <b>' + esc(w.word) + '</b>'; }
  const after = $('#after');
  if (after) after.innerHTML = `<div class="reveal"><div class="reveal-word"><b>${esc(w.word)}</b>${sayBtn(false)}</div>
      ${cur.mode === 'dictation' ? `<p style="color:var(--ink-2);font-weight:600">${esc(w.definition || '')}</p>` : ''}${trHtml(w)}${famHtml(w).replace('class="fam"', 'class="fam" style="color:var(--muted)"')}${exHtml(w)}</div>`;
  const ia = $('#ia'); if (ia) ia.remove();
  const again = `<button class="btn btn-amber" data-a="againLater">${ic('repeat', 19)}Ещё раз</button>`;
  if (ok) {
    $('#actions').innerHTML = again + `<button class="btn btn-mint" data-a="okNext">${ic('check', 19)}Помню</button>`;
    if (after) after.insertAdjacentHTML('afterbegin', '<p class="fb-hint">Подсмотрели или угадали? Нажмите «Ещё раз» — слово вернётся позже</p>');
  } else if (noRequeue) {
    $('#actions').innerHTML = again + `<button class="btn btn-dark" data-a="wrongNext">Дальше${ic('chevR', 20)}</button>`;
  } else {
    $('#actions').innerHTML = `<button class="btn btn-dark" data-a="wrongNext">Дальше — слово вернётся позже${ic('chevR', 20)}</button>`;
  }
}
// Ученик выбрал: 'remember' (засчитать), 'again' (повторить ещё раз), 'next' (после ошибки)
function finalize(action) {
  if (!cur || !cur.done || cur.finalized) return;
  cur.finalized = true;
  const w = cur.w, k = norm(w.word);
  const ok = cur.ok && action === 'remember';
  if (isLearn) {
    logAct({ reviews: 1 });
    trackResult(w, ok);
    if (cur.mode === 'typing' && ok) learnLearned(cur.item);      // сам написал и сам подтвердил — выучено
    else { learnSeen[k] = (learnSeen[k] || 0) + 1; learnStage[k] = 1; }   // снова карточка, потом снова написать
  } else {
    judge(ok, cur.inc, action === 'again');
  }
  next();
}
function next() {
  clearTimeout(autoTimer);
  if (isLearn) { show(); return; }
  idx++; show();
}

/* =====================================================================
   ЗАПИСЬ ПРОГРЕССА
   ===================================================================== */
function trackResult(w, ok) {
  const r = results.get(norm(w.word)); if (!r) return;
  r.tries++; if (r.first === null) r.first = ok;
}
// Повторение: оценка пишется один раз за сессию — по первой попытке.
// Забытое слово возвращается в конец и крутится, пока не вспомнится.
function judge(ok, inc, forceRequeue) {
  answeredAny = true;
  const w = cur.w, k = norm(w.word);
  trackResult(w, ok);
  const first = !recorded.has(k);
  if (first) { recorded.add(k); if (!isPractice) recordWordProgress(w, ok, inc); if (ok) correctFirst++; }
  // Тренировка трудных слов идёт в серию и календарь, но не в точность и не в расписание
  logAct(isPractice ? { reviews: 1 } : { reviews: 1, correct: first && ok ? 1 : 0, wrong: first && !ok ? 1 : 0 });
  if (!ok && (!noRequeue || forceRequeue)) { const copy = { w, isRetry: true }; items.push(copy); }
}
function learnLearned(item) {
  answeredAny = true;
  const k = norm(item.w.word);
  recordWordProgress(item.w, true, 1);
  correctFirst++;
  learnPool = learnPool.filter(x => norm(x.w.word) !== k);
  learnDone.push(item);
  if (learnQueue.length) learnPool.push(learnQueue.shift());
  logAct({ learned: 1 });
}
function nextDueDate(b) { return new Date(Date.now() + (SRS_INTERVALS_MIN[b] || 10) * 60000).toISOString(); }
function recordWordProgress(w, ok, inc) {
  const k = norm(w.word), prev = srs[k] || { box: 0, lapses: 0, correct_count: 0 };
  const isFirst = !prev.box, now = new Date().toISOString();
  let b = prev.box || 0, lapses = prev.lapses || 0;
  if (ok) b = Math.min(b + 1, SRS_MASTERED_BOX);
  else { if (b > 0) lapses++; b = 1; }
  const due_at = nextDueDate(b);
  const cc = ok ? Math.round(((prev.correct_count || 0) + (inc || 1)) * 10) / 10 : (prev.correct_count || 0);
  srs[k] = Object.assign({}, prev, { word: prev.word || w.word, box: b, due_at, lapses, correct_count: cc, last_result: ok, last_reviewed_at: now }, isFirst ? { first_seen_at: now } : {});
  writeRow(prev.word || w.word, Object.assign({ correct_count: cc, box: b, due_at, lapses, last_result: ok, last_reviewed_at: now }, isFirst ? { first_seen_at: now } : {}));
}
function writeRow(word, fields) {
  return sb.from('user_word_progress').upsert(Object.assign({ user_id: user.id, word }, fields), { onConflict: 'user_id,word' })
    .then(({ error }) => { if (error) { console.error('Ошибка сохранения прогресса:', error); toast('Ответ не сохранился — проверьте интернет'); } });
}
// Календарь активности: одна строка на день, счётчики растут на сервере
let actDisabled = false;
function logAct(d) {
  if (actDisabled || !user) return;
  sb.rpc('log_vocab_activity', { p_day: dayKey(new Date()), p_reviews: d.reviews || 0, p_learned: d.learned || 0, p_correct: d.correct || 0, p_wrong: d.wrong || 0 })
    .then(({ error }) => { if (error) { actDisabled = true; console.info('log_vocab_activity недоступна (SQL не запущен?):', error.message); } });
}

/* --- «Отменить» для случайного свайпа --- */
function makeUndo(ok) {
  const k = norm(cur.w.word);
  return { idx, k, w: cur.w, ok, prev: srs[k] ? Object.assign({}, srs[k]) : null, wasRecorded: recorded.has(k),
           itemsLen: items.length, res: Object.assign({}, results.get(k)) };
}
function undo() {
  const u = lastUndo; lastUndo = null;
  if (!u || idx !== u.idx + 1) return;
  if (!u.wasRecorded) {
    recorded.delete(u.k);
    if (u.ok) correctFirst--;
    if (u.prev && !isPractice) {
      srs[u.k] = u.prev;
      const f = {}; ['correct_count', 'box', 'due_at', 'lapses', 'last_result', 'last_reviewed_at'].forEach(x => { f[x] = u.prev[x] === undefined ? null : u.prev[x]; });
      writeRow(u.prev.word || u.w.word, f);
    }
    logAct(isPractice ? { reviews: -1 } : { reviews: -1, correct: u.ok ? -1 : 0, wrong: u.ok ? 0 : -1 });
  } else logAct({ reviews: -1 });
  items.length = u.itemsLen;
  results.set(u.k, u.res);
  idx = u.idx;
  $('#resultsWrap').hidden = true; $('#session').hidden = false;   // отмена после последней карточки
  show();
}

/* =====================================================================
   ИТОГИ
   ===================================================================== */
async function finish() {
  clearTimeout(autoTimer);
  try { speechSynthesis.cancel(); } catch (e) {}
  $('#session').hidden = true;
  $('#resultsWrap').hidden = false;
  const R = $('#results');
  const mins = Math.max(1, Math.round((Date.now() - startedAt) / 60000));
  const list = Array.from(results.values());
  let hero, stats;
  if (isBrowse) {
    hero = `<div class="ring" style="width:120px;height:120px;background:var(--surface-2);border-radius:50%">${ic('eye', 44)}</div><h1>Просмотрено</h1><p>${items.length} ${plural(items.length, 'слово', 'слова', 'слов')} · прогресс не менялся</p>`;
    stats = '';
  } else {
    const total = isLearn ? learnDone.length : recorded.size;
    const pct = total ? Math.round(correctFirst / total * 100) : 0;
    const r = 52, c = 2 * Math.PI * r;
    const ringSvg = (val, color) => `<div class="ring" style="width:124px;height:124px"><svg width="124" height="124"><circle cx="62" cy="62" r="${r}" fill="none" stroke="#e6e9f0" stroke-width="10"/><circle cx="62" cy="62" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - val)}"/></svg><b>${isLearn ? learnDone.length : pct + '%'}</b></div>`;
    if (isLearn) {
      hero = ringSvg(1, 'var(--mint)') + `<h1>${learnDone.length} ${plural(learnDone.length, 'новое слово', 'новых слова', 'новых слов')}</h1><p>Ушли в повторение — вернутся по расписанию</p>`;
    } else {
      hero = ringSvg(pct / 100, pct >= 80 ? 'var(--mint)' : pct >= 50 ? 'var(--primary)' : 'var(--amber)') + `<h1>${pct >= 90 ? 'Отлично!' : pct >= 70 ? 'Хорошо!' : 'Готово'}</h1><p>С первой попытки: ${correctFirst} из ${total}${isPractice ? '<br>' + (cfg.kind === 'browse' ? 'Пролистывание без зачёта — прогресс не менялся' : 'Тренировка без зачёта — расписание повторений не менялось') : ''}</p>`;
    }
    const retries = list.filter(x => x.tries > 1).length;
    stats = `<div class="res-stats"><div class="res-stat"><b>${total}</b><span>${plural(total, 'слово', 'слова', 'слов')}</span></div><div class="res-stat"><b>${retries}</b><span>с повтором</span></div><div class="res-stat"><b>${mins}</b><span>мин</span></div></div>`;
  }
  const rows = isBrowse ? '' : list.filter(x => x.tries > 0).sort((a, b) => (a.first === b.first ? b.tries - a.tries : a.first ? 1 : -1)).map(x => `<div class="res-row">
      <span style="color:${x.first ? 'var(--mint)' : 'var(--amber)'}">${x.first ? ic('check', 20) : ic('repeat', 20)}</span><b>${esc(x.w.word)}</b>
      <small style="color:${x.first ? 'var(--mint-ink)' : 'var(--amber-ink)'}">${x.first ? 'с первого раза' : (x.tries - 1) + ' ' + plural(x.tries - 1, 'повтор', 'повтора', 'повторов')}</small></div>`).join('');
  const back = 'vocabulary.html' + (cfg.returnTo && cfg.returnTo.startsWith('#') ? cfg.returnTo : '#home');
  R.innerHTML = `<div class="res-hero">${hero}</div>${stats}<div id="streakSlot"></div>
    ${rows ? `<div class="res-sec">Слова тренировки</div><div class="res-list">${rows}</div>` : ''}
    <a class="btn btn-primary" href="${back}" style="margin-top:6px">Готово</a>`;
  if (!isBrowse && answeredAny) {
    const n = await fetchStreak();
    if (n) $('#streakSlot').innerHTML = `<div class="streak-box">${ic('flame', 26)}<div>${n} ${plural(n, 'день', 'дня', 'дней')} подряд<div style="font-weight:600;font-size:13px;opacity:.85">Сегодня засчитано — до завтра!</div></div></div>`;
  }
}
async function fetchStreak() {
  try {
    const { data, error } = await sb.from('vocab_activity').select('day, reviews, learned').eq('user_id', user.id).order('day', { ascending: false }).limit(400);
    if (error) return 0;
    const days = new Set((data || []).filter(r => (r.reviews || 0) + (r.learned || 0) > 0).map(r => String(r.day).slice(0, 10)));
    days.add(dayKey(new Date()));
    let n = 0, d = new Date();
    while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  } catch (e) { return 0; }
}

/* =====================================================================
   РЕЖИМ ПРЯМО ВО ВРЕМЯ ПОВТОРЕНИЯ
   ===================================================================== */
function setupModeChip() {
  const b = $('#btnMode');
  b.hidden = isLearn || isBrowse;   // в «просто смотреть» и в заучивании режим не меняется
}
function setLabel(set) {
  if (set.includes('auto')) return { i: 'sparkles', t: 'Авто' };
  if (set.length === 1) return { i: MODES[set[0]].i, t: MODES[set[0]].t };
  return { i: 'sparkles', t: set.length + ' ' + plural(set.length, 'режим', 'режима', 'режимов') };
}
function updateModeChip() {
  const b = $('#btnMode'); if (b.hidden) return;
  const l = setLabel(modeSet());
  b.innerHTML = `${ic(l.i, 15)}${esc(l.t)}${ic('chevD', 15)}`;
}
let openSheetEl = null;
function openModeSheet() {
  let sel = modeSet().slice();
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  const draw = () => {
    wrap.querySelector('.sheet').innerHTML = `<h3>Как повторять</h3><p style="color:var(--muted);font-size:13.5px;margin-bottom:6px">Можно выбрать несколько — они будут чередоваться</p>
      ${Object.entries(MODES).map(([id, m]) => { const on = sel.includes(id); return `<button class="m-row ${on ? 'on' : ''}" data-mode="${id}"><span class="m-ico">${ic(m.i, 19)}</span><span style="flex:1"><b>${m.t}</b><span>${m.h}</span></span><span class="mchk ${on ? 'on' : ''}">${on ? ic('check', 15) : ''}</span></button>`; }).join('')}
      <label class="check"><input type="checkbox" id="modeDefault"> Сохранить как режим по умолчанию</label>
      <button class="btn btn-primary" style="width:100%;margin-top:14px" data-apply>Готово</button>`;
    wrap.querySelectorAll('[data-mode]').forEach(btn => btn.onclick = () => {
      const id = btn.dataset.mode;
      if (id === 'auto') sel = ['auto'];
      else {
        sel = sel.filter(x => x !== 'auto');
        sel = sel.includes(id) ? sel.filter(x => x !== id) : sel.concat(id);
        if (!sel.length) sel = ['auto'];
      }
      const keep = $('#modeDefault').checked; draw(); $('#modeDefault').checked = keep;
    });
    wrap.querySelector('[data-apply]').onclick = () => {
      modeOverride = sel.slice();
      if ($('#modeDefault').checked) saveDefaultModes(sel);
      closeSheet();
      items.forEach(it => { delete it.setMode; });
      if (cur && !cur.done && !cur.flipped) { cur.mode = effectiveMode(cur.item); show(); }
      else updateModeChip();
    };
  };
  wrap.innerHTML = `<div class="sheet-backdrop"></div><div class="sheet" role="dialog" aria-label="Режим"></div>`;
  draw();
  document.body.appendChild(wrap);
  openSheetEl = wrap;
  history.pushState({ sheet: 1 }, '');
  wrap.querySelector('.sheet-backdrop').onclick = () => closeSheet();
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
}
// Сохраняем выбор как настройку по умолчанию — так же, как это делает экран «Настройки»
function saveDefaultModes(sel) {
  let prefs = {};
  try { prefs = JSON.parse(localStorage.getItem('vocabPrefs') || '{}') || {}; } catch (e) {}
  prefs.reviewModes = sel.slice();
  try { localStorage.setItem('vocabPrefs', JSON.stringify(prefs)); } catch (e) {}
  const col = sel.includes('auto') ? 'auto' : (sel[0] === 'flashcards_rev' ? 'flashcards' : sel[0]);
  cfg.modes = sel.slice(); cfg.mode = col;
  sb.from('profiles').update({ vocab_mode: col, vocab_prefs: prefs }).eq('id', user.id).then(({ error }) => {
    if (error) sb.from('profiles').update({ vocab_mode: col }).eq('id', user.id).then(() => {});
  });
}
function closeSheet(fromPop) {
  const w = openSheetEl; if (!w) return;
  openSheetEl = null;
  w.classList.remove('open'); setTimeout(() => w.remove(), 300);
  if (!fromPop) { ignorePop++; history.back(); }
}
function askExit() {
  if (!answeredAny || isBrowse) { leave(); return; }
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-backdrop"></div><div class="sheet" role="dialog"><h3>Закончить сейчас?</h3><p style="color:var(--muted);margin-bottom:16px">Ответы уже сохранены — оставшиеся слова никуда не денутся.</p>
    <div style="display:grid;gap:10px"><button class="btn btn-primary" data-x="stay">Продолжить</button><button class="btn btn-soft" data-x="leave">Выйти</button></div></div>`;
  document.body.appendChild(wrap);
  openSheetEl = wrap;
  history.pushState({ sheet: 1 }, '');
  wrap.querySelector('.sheet-backdrop').onclick = () => closeSheet();
  wrap.querySelector('[data-x=stay]').onclick = () => closeSheet();
  wrap.querySelector('[data-x=leave]').onclick = () => { openSheetEl = null; leave(); };
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
}
function leave() { location.href = 'vocabulary.html' + (cfg && cfg.returnTo && cfg.returnTo.startsWith('#') ? cfg.returnTo : '#home'); }

/* =====================================================================
   ОЗВУЧКА
   ===================================================================== */
let _voice = null;
function pickVoice() {
  if (_voice) return _voice;
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const en = vs.filter(v => /^en[-_]/i.test(v.lang || ''));
  if (!en.length) return null;
  const pref = ['Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Samantha', 'Alex', 'Google UK English Female'];
  for (const n of pref) { const h = en.find(v => (v.name || '').includes(n)); if (h) return (_voice = h); }
  return (_voice = en.find(v => /en[-_](US|GB)/i.test(v.lang)) || en[0]);
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { _voice = null; pickVoice(); };
function say(text, rate) {
  try {
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = rate || 0.9;
    const v = pickVoice(); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* =====================================================================
   ТОСТ
   ===================================================================== */
let toastTimer = null;
function toast(msg, label, fn) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (label ? `<button type="button">${ic('undo', 15)} ${esc(label)}</button>` : '');
  if (label) el.querySelector('button').onclick = () => { el.classList.remove('show'); fn && fn(); };
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), label ? 3500 : 2600);
}

/* =====================================================================
   УПРАВЛЕНИЕ: касания и клавиатура
   ===================================================================== */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-tr]')) { const b = t.closest('[data-tr]'); b.hidden = true; const p = b.nextElementSibling; if (p) p.hidden = false; e.stopPropagation(); return; }
  if (t.closest('[data-say]')) { say(cur && cur.w.word); return; }
  const tile = t.closest('[data-tile]'); if (tile) { placeTile(Number(tile.dataset.tile)); return; }
  const slot = t.closest('[data-slot]'); if (slot) { unplace(Number(slot.dataset.slot)); return; }
  const pk = t.closest('[data-pick]'); if (pk) { pick(Number(pk.dataset.pick)); return; }
  const a = t.closest('[data-a]'); if (!a) return;
  ({
    flip, next, check, hint,
    prev: () => browseStep(-1),
    knew: () => judgeCard(true), forgot: () => judgeCard(false),
    remember: () => judgeCard(true), again: () => judgeCard(false),
    erase: eraseLast,
    giveup: () => { if (cur.done) return; revealLetters(); answered(false, 1); },
    dunno: () => { if (cur.done) return; const i = $('#inp'); if (i) i.value = ''; answered(false, 1); },
    okNext: () => finalize('remember'), againLater: () => finalize('again'), wrongNext: () => finalize('next'),
    play: () => say(cur.w.word), slow: () => say(cur.w.word, 0.55)
  })[a.dataset.a]?.();
});
$('#btnClose').addEventListener('click', askExit);
$('#btnMode').addEventListener('click', openModeSheet);
document.addEventListener('keydown', e => {
  if (!cur || $('#session').hidden || openSheetEl) { if (e.key === 'Escape' && openSheetEl) closeSheet(); return; }
  const inInput = e.target && e.target.id === 'inp';
  if (inInput) { if (e.key === 'Enter') { e.preventDefault(); check(); } return; }
  const m = cur.mode;
  if (m === 'flashcards' || m === 'flashcards_rev' || m === 'browse') {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (m === 'browse' || !cur.flipped) flip(); else return; }
    if (m === 'browse') { if (e.key === 'ArrowRight') browseStep(1); if (e.key === 'ArrowLeft') browseStep(-1); return; }
    if (cur.flipped && e.key === 'ArrowRight') judgeCard(true);
    if (cur.flipped && e.key === 'ArrowLeft') judgeCard(false);
    return;
  }
  if (cur.done && e.key === 'Enter') { e.preventDefault(); finalize(cur.ok ? 'remember' : 'next'); return; }
  if (m === 'choice' && /^[1-4]$/.test(e.key)) pick(Number(e.key) - 1);
  if (m === 'letters') {
    if (e.key === 'Backspace') { e.preventDefault(); eraseLast(); return; }
    if (/^[a-z]$/i.test(e.key)) { const t = cur.tiles.find(x => !x.used && x.ch === e.key.toLowerCase()); if (t) placeTile(t.id); }
  }
});
function applyDyslexia() { let on = false; try { on = localStorage.getItem('dyslexiaMode') === 'true'; } catch (e) {} document.body.classList.toggle('dyslexia-mode', on); }

try { history.scrollRestoration = 'manual'; } catch (e) {}
window.addEventListener('pageshow', () => window.scrollTo(0, 0));
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
boot();
</script>
