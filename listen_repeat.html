<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listen and Repeat — TOEFL Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Если CDN иконок не ответил, страница не должна падать на lucide.createIcons()
        if (!window.lucide || typeof window.lucide.createIcons !== 'function') window.lucide = { createIcons: function () {} };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Подключаем auth.js для получения текущего пользователя и _supabase -->
    <script src="auth.js"></script>
    <script src="practice-next.js"></script>
    <script>
        // Бесплатная версия (auth.js): в списке видны все задания, закрытые — под замочком
        var gMerge = (table, rows, opts) => (typeof authGuestMerge === 'function' ? authGuestMerge(table, rows, opts) : Promise.resolve(rows || []));
        var gCard = (html, row) => (typeof authGuestCard === 'function' ? authGuestCard(html, row) : html);
        var gNote = () => (typeof authL === 'function' ? authL('Available with full access', 'Доступно в полной версии') : 'Available with full access');
    </script>
    <script src="topic-filter.js"></script>
    <script src="content-visibility.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fa; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col md:flex-row">

    <div id="app-sidebar"></div>
    <script src="nav.js"></script>

    <main class="flex-1 p-6 overflow-y-auto pb-24 md:pb-6 max-w-5xl mx-auto">
        
        <div class="mb-8 mt-4">
            <a href="speaking.html" class="inline-flex items-center text-xs font-bold text-gray-400 hover:text-slate-700 uppercase tracking-wider mb-4 transition">
                <i data-lucide="arrow-left" class="w-3 h-3 mr-1"></i> Back to Speaking
            </a>
            <h1 class="text-[28px] font-extrabold text-slate-900 tracking-tight">Listen and Repeat</h1>
            <p class="text-sm text-gray-500 mt-1.5 max-w-md">Listen to short audio clips and repeat exactly what you hear. Select a test to practice.</p>
        </div>

        <!-- Фильтр по темам (topic-filter.js): появляется, когда у тестов заполнена колонка topic -->
        <div id="topicFilter" class="hidden flex-wrap gap-2 mb-6" role="group" aria-label="Filter by topic"></div>

        <div id="tests-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Карточки тестов будут загружены сюда -->
        </div>
    </main>

    <script>
        lucide.createIcons();
        let currentUser = null;

        function spListEsc(s) {
            return String(s === null || s === undefined ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ---------- ФИЛЬТР ПО ТЕМАМ ----------
        // Тема хранится в speaking_tests.topic, порядок кнопок — в topic-filter.js
        // (TopicFilter.SPEAKING_TOPICS.listen_repeat). Тесты без темы — в «Other».
        // Если topic-filter.js не загрузился, список показывается целиком, как раньше.
        const topicFilter = window.TopicFilter ? TopicFilter.create({
            bar: document.getElementById('topicFilter'),
            list: document.getElementById('tests-container'),
            storageKey: 'speakingTopic:listen_repeat',
            order: (TopicFilter.SPEAKING_TOPICS && TopicFilter.SPEAKING_TOPICS.listen_repeat) || [],
            afterRender: () => { lucide.createIcons(); rememberOrder(); }
        }) : null;

        // Порядок карточек для кнопки «Следующий тест» на странице результатов (practice-next.js)
        function rememberOrder() {
            if (window.PracticeNext) PracticeNext.remember('s-listen_repeat', document.getElementById('tests-container'), currentUser && currentUser.id);
        }

        // Глазик преподавателя (content-visibility.js). Если файл не загрузился,
        // страница работает как раньше, а скрытое всё равно не попадает к ученикам.
        const CV = window.ContentVisibility || {
            init() {}, cardClass() { return ''; }, withEye(html) { return html; }, eye() { return ''; },
            visibleFor(rows) { return (rows || []).filter(r => r.is_hidden !== true); }
        };

        function showCards(cards, opts) {
            if (topicFilter) return topicFilter.setCards(cards, opts);
            document.getElementById('tests-container').innerHTML = cards.map(c => c.html).join('');
            lucide.createIcons();
            rememberOrder();
        }


        async function loadTests() {
            const container = document.getElementById('tests-container');
            container.innerHTML = '<p class="text-sm text-gray-500 col-span-full">Loading tests from database...</p>';

            try {
                // 1. Проверяем авторизацию
                if (typeof requireAuth !== 'function') throw new Error("auth.js is missing.");
                currentUser = await requireAuth();
                if (!currentUser) return; // Если не авторизован, auth.js сам перекинет на логин

                // 2. Запрашиваем тесты из базы
                const { data: testsAll, error: testsError } = await _supabase
                    .from('speaking_tests')
                    .select('*')
                    .eq('type', 'listen_repeat')
                    .order('created_at', { ascending: true });

                if (testsError) throw testsError;
                // Скрытый глазиком набор ученице не показываем (в мок-тестах его вопросы остаются)
                CV.init({ user: currentUser, reload: loadTests });
                const tests = await gMerge('speaking_tests', CV.visibleFor(testsAll || [], currentUser),
                    { keep: r => String(r.type || '') === 'listen_repeat', order: 'created_at' });

                // 3. Запрашиваем попытки текущего пользователя, чтобы знать, что он уже решал
                const { data: attempts, error: attemptsError } = await _supabase
                    .from('speaking_attempts')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false }); // Сортируем, чтобы первой была последняя попытка

                if (attemptsError) throw attemptsError;

                // Сколько записей в каждой попытке. Попытка создавалась при открытии
                // плеера, и даже пустая (ничего не записано) показывалась как
                // Completed с кнопкой Review.
                const answeredByAttempt = {};
                const attemptIds = (attempts || []).map(a => a.id);
                if (attemptIds.length) {
                    const { data: resps, error: respErr } = await _supabase
                        .from('speaking_responses').select('attempt_id, question_id').in('attempt_id', attemptIds);
                    if (respErr) throw respErr;
                    (resps || []).forEach(r => {
                        const k = String(r.attempt_id);
                        (answeredByAttempt[k] = answeredByAttempt[k] || new Set()).add(String(r.question_id));
                    });
                }

                container.innerHTML = '';

                if (!tests || tests.length === 0) {
                    showCards([], { enabled: false });
                    container.innerHTML = `
                        <div class="col-span-full bg-white p-8 rounded-2xl border border-gray-100 text-center">
                            <i data-lucide="inbox" class="w-8 h-8 text-gray-300 mx-auto mb-3"></i>
                            <p class="text-sm text-gray-500">No tests available yet. Add them in Supabase!</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                // 4. Отрисовываем карточки
                // Номер Set считается по всему списку до фильтра — при выборе темы он не меняется
                const cards = [];
                tests.forEach((test, index) => {
                    const setNumber = index + 1;
                    const topic = String(test.topic || '').trim();
                    
                    // Ищем, есть ли попытка для этого конкретного теста
                    // Берем самую свежую попытку благодаря сортировке выше
                    // Последняя попытка, в которой есть хотя бы одна запись
                    const testAttempt = (attempts || []).find(a => String(a.test_id) === String(test.id) && answeredByAttempt[String(a.id)]) || null;
                    const answered = testAttempt ? answeredByAttempt[String(testAttempt.id)].size : 0;
                    const total = Number(test.total_questions) || 0;
                    const isPartial = testAttempt && total > 0 && answered < total;
                    const hasScore = testAttempt && testAttempt.score !== null && testAttempt.score !== undefined && testAttempt.score !== '';
                    
                    const isHiddenSet = test.is_hidden === true;
                    const eyeBtn = CV.eye('speaking_tests', [test.id], isHiddenSet, { compact: true });
                    let buttonsHTML = '';

                    // Если попытка есть, показываем Review и Retake
                    if (testAttempt) {
                        buttonsHTML = `
                            <div class="mt-auto flex space-x-2 w-full pt-4">
                                <a href="speaking_results.html?attempt_id=${encodeURIComponent(testAttempt.id)}&type=listen_repeat" class="flex-1 py-2.5 bg-teal-50 hover:bg-teal-100 text-teal-600 text-xs font-bold rounded-xl flex items-center justify-center transition border border-teal-200 shadow-sm">
                                    Review <i data-lucide="headphones" class="w-3.5 h-3.5 ml-1.5"></i>
                                </a>
                                <a href="speaking_player.html?type=listen_repeat&id=${encodeURIComponent(test.id)}" class="flex-1 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl flex items-center justify-center transition shadow-sm">
                                    Retake <i data-lucide="rotate-cw" class="w-3.5 h-3.5 ml-1.5"></i>
                                </a>${eyeBtn}
                            </div>
                        `;
                    } else {
                        // Если попыток нет, показываем стандартную кнопку старта
                        buttonsHTML = `
                            <div class="mt-auto pt-4 flex gap-2">
                                <a href="speaking_player.html?type=listen_repeat&id=${encodeURIComponent(test.id)}" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl flex items-center justify-center transition shadow-sm">
                                    Start Practice <i data-lucide="arrow-right" class="w-3.5 h-3.5 ml-1.5"></i>
                                </a>${eyeBtn}
                            </div>
                        `;
                    }

                    const cardStatus = hasScore
                        ? `<span class="text-[10px] font-bold tracking-wider text-emerald-700 uppercase bg-emerald-50 px-2 py-1 rounded border border-emerald-200">Score ${Number(testAttempt.score).toFixed(1)}</span>`
                        : isPartial
                        ? `<span class="text-[10px] font-bold tracking-wider text-amber-700 uppercase bg-amber-50 px-2 py-1 rounded border border-amber-200">${answered}/${total} done</span>`
                        : testAttempt
                        ? `<span class="text-[10px] font-bold tracking-wider text-teal-600 uppercase bg-teal-100 px-2 py-1 rounded border border-teal-200">Completed</span>`
                        : `<span class="text-[10px] font-bold tracking-wider text-slate-500 uppercase bg-slate-100 px-2 py-1 rounded border border-slate-200">New</span>`;

                    // Плашка-этикетка в углу карточки для тестов с вопросами, реально встречавшимися на настоящем TOEFL
                    const realToeflRibbon = test.is_real_toefl
                        ? `<div class="absolute top-[15px] right-[-38px] w-[150px] rotate-45 bg-violet-600 text-white text-[9px] font-extrabold tracking-[0.15em] text-center py-1 shadow-sm z-10">TOEFL</div>`
                        : '';

                    const cardHTML = `
                        <div class="relative overflow-hidden bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col hover:shadow-md hover:border-indigo-100 transition-all duration-200 ${CV.cardClass(isHiddenSet)}">
                            ${realToeflRibbon}
                            <div class="flex items-center gap-1.5 mb-2">
                                <span class="text-[10px] font-bold tracking-wider text-indigo-500 uppercase bg-indigo-50 px-2 py-1 rounded border border-indigo-100">Set ${setNumber}</span>
                                ${cardStatus}
                            </div>
                            <h3 class="font-bold text-slate-800 text-[15px] leading-snug mb-1 mt-3 pr-4">${spListEsc(test.title)}</h3>
                            <p class="text-xs text-gray-400 mb-2">${topic ? `<span class="font-semibold text-slate-500">${spListEsc(topic)}</span> • ` : ''}${test.total_questions} Questions • Audio recording</p>
                            
                            ${buttonsHTML}
                        </div>
                    `;
                    cards.push({ topic, html: gCard(cardHTML, test) });
                });

                showCards(cards);

            } catch (err) {
                console.error("Error loading tests:", err.message);
                showCards([], { enabled: false });
                container.innerHTML = '<p class="text-sm text-rose-500 col-span-full font-medium p-4 bg-rose-50 rounded-xl">Failed to load tests. Please check console.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadTests);
    </script>
</body>
</html>
