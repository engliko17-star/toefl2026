<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col md:flex-row antialiased">

    <aside class="hidden md:flex flex-col w-64 bg-[#f8f9fa] border-r border-gray-100 px-4 py-6 h-screen sticky top-0 shrink-0">
        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span><span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>
        <nav class="flex-1 space-y-1">
            <a href="index.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-100 transition"><i data-lucide="home" class="w-5 h-5"></i><span class="text-sm">Dashboard</span></a>
            <a href="writing.html" class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900 text-white font-medium shadow-sm"><i data-lucide="pen-tool" class="w-5 h-5"></i><span class="text-sm">Writing</span></a>
        </nav>
    </aside>

    <main class="flex-1 p-6 lg:p-12 overflow-y-auto">
        <div class="max-w-3xl mx-auto pb-20">
            
            <a href="writing-articles.html" class="inline-flex items-center text-[11px] font-bold text-gray-400 hover:text-indigo-600 uppercase tracking-wider mb-10 transition">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-1.5"></i> Back to Guides
            </a>

            <div class="mb-10 border-b border-gray-100 pb-10">
                <span id="art-category" class="inline-block bg-gray-100 text-gray-600 text-[9px] font-extrabold px-2.5 py-1 rounded uppercase tracking-widest mb-4">...</span>
                <h1 id="art-title" class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight leading-tight mb-4">Loading article...</h1>
                <div class="flex items-center text-xs font-medium text-gray-400">
                    <i data-lucide="clock" class="w-3.5 h-3.5 mr-1.5"></i>
                    <span id="art-time">-- min read</span>
                </div>
            </div>

            <div id="art-content" class="prose prose-slate prose-img:rounded-xl max-w-none text-slate-700 leading-relaxed">
                </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        // БАЗА ДАННЫХ СТАТЕЙ ПРЯМО В КОДЕ
        const ARTICLES = {
            'academic_template': {
                title: "The Perfect Academic Template",
                category: "Template",
                badgeClass: "bg-teal-50 text-teal-600",
                time: "3 min read",
                content: `
                    <p class="text-lg text-gray-500 mb-8">The brand new TOEFL Academic Discussion task requires you to post in an online university forum. You have only 10 minutes to read the prompt, other students' responses, and write at least 100 words. Use this tactical structure to save time.</p>
                    
                    <div class="bg-slate-50 p-6 rounded-2xl border border-gray-100 font-mono text-sm text-slate-600 space-y-4 mb-8">
                        <p class="font-bold text-slate-800">[Paragraph 1: State your stance + Reference another student]</p>
                        <p>"While I understand <strong>[Student Name]’s</strong> perspective that <strong>[Summarize their point in 3-5 words]</strong>, I strongly agree with <strong>[Other Student Name]’s</strong> view regarding <strong>[Topic]</strong>. In my opinion,..."</p>
                        <p class="font-bold text-slate-800 mt-6">[Paragraph 2: Deliver your unique point + Real-world example]</p>
                        <p>"Furthermore, an essential factor to consider is that... <strong>[Your independent argument]</strong>. For instance, a recent study from..."</p>
                    </div>

                    <h3 class="font-bold text-slate-900 text-lg mb-3 mt-8">Key Strategy Rules:</h3>
                    <ul class="list-disc pl-5 space-y-2 text-gray-600 mb-8">
                        <li><strong>Never copy:</strong> Do not copy chunks of words from the prompt or other students. Paraphrase everything.</li>
                        <li><strong>Be unique:</strong> Do not just echo what "Paul" or "Kelly" said. Bring a completely new angle or specific examples.</li>
                        <li><strong>Grammar over length:</strong> 120-140 perfectly polished words will score higher than 200 words packed with typos.</li>
                    </ul>
                `
            },
            'transitions': {
                title: "Transition Words Cheat Sheet",
                category: "Vocabulary",
                badgeClass: "bg-indigo-50 text-indigo-600",
                time: "4 min read",
                content: `
                    <p class="text-lg text-gray-500 mb-8">To achieve a 4.5+ score out of 5 in Cohesion, you must avoid basic transition words like <em>"And"</em>, <em>"But"</em>, or <em>"So"</em>. Use these high-level alternatives instead.</p>
                    
                    <div class="space-y-6">
                        <div class="bg-white border border-gray-100 p-5 rounded-2xl shadow-sm">
                            <h4 class="font-bold text-xs uppercase tracking-wider text-indigo-600 mb-2">1. Adding Information (Instead of "Also")</h4>
                            <p class="text-sm text-gray-600"><strong class="text-slate-900">Furthermore, Moreover, In addition, Additionally.</strong><br><br><em>Example:</em> "Furthermore, implementing green spaces in urban environments drastically drops local temperatures."</p>
                        </div>
                        <div class="bg-white border border-gray-100 p-5 rounded-2xl shadow-sm">
                            <h4 class="font-bold text-xs uppercase tracking-wider text-rose-500 mb-2">2. Showing Contrast (Instead of "But")</h4>
                            <p class="text-sm text-gray-600"><strong class="text-slate-900">Conversely, On the other hand, Nevertheless, Paradoxically.</strong><br><br><em>Example:</em> "Conversely, remote learning might diminish interpersonal communication skills."</p>
                        </div>
                        <div class="bg-white border border-gray-100 p-5 rounded-2xl shadow-sm">
                            <h4 class="font-bold text-xs uppercase tracking-wider text-emerald-600 mb-2">3. Cause & Effect (Instead of "Because / So")</h4>
                            <p class="text-sm text-gray-600"><strong class="text-slate-900">Consequently, Therefore, As a result, Thereby (+ -ing).</strong><br><br><em>Example:</em> "Governments reduced taxes; consequently, startups flourished throughout the quarter."</p>
                        </div>
                    </div>
                `
            }
        };

        // Загружаем статью при открытии страницы
        const params = new URLSearchParams(window.location.search);
        const articleId = params.get('id');
        const article = ARTICLES[articleId];

        if (article) {
            document.getElementById('art-title').innerText = article.title;
            document.getElementById('art-time').innerText = article.time;
            
            const badge = document.getElementById('art-category');
            badge.innerText = article.category;
            badge.className = `inline-block text-[9px] font-extrabold px-2.5 py-1 rounded uppercase tracking-widest mb-4 ${article.badgeClass}`;
            
            document.getElementById('art-content').innerHTML = article.content;
        } else {
            document.getElementById('art-content').innerHTML = "<p class='text-red-500'>Article not found. Please go back.</p>";
        }
    </script>
</body>
</html>
