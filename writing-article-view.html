                                <p class="mb-3">The sentence "I will if I finish the lab report that's due today." demonstrates correct sentence-level grammar and contextual appropriateness. Grammatically, the sentence is a complex conditional structure composed of two clauses: the main clause "I will" and the conditional clause "if I finish the lab report that's due today." The auxiliary verb "will" correctly indicates future intention, while the conditional "if" introduces the requirement for that intention to occur. The subject "I" is consistent across both clauses. The verb "finish" is in its base form, which is appropriate after "if." The phrase "the lab report that's due today" includes a relative clause ("that's due today") modifying "lab report," adding specificity and clarity.</p>

                    </div>

                    <div class="mb-10">

                                    I'm not sure

        if (article) {

            badge.className = `inline-block text-[9px] font-extrabold px-2.5 py-1 rounded uppercase tracking-widest mb-4 ${article.badgeClass}`;
            
            document.getElementById('art-content').innerHTML = article.content;

                lucide.createIcons();
            }, 50);
