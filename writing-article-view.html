<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Скрываем маркер у details (аккордеона) для кроссбраузерности */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col md:flex-row antialiased">

    <aside class="hidden md:flex flex-col w-64 bg-[#f8f9fa] border-r border-gray-100 px-4 py-6 h-screen sticky top-0 shrink-0">
        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span><span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>
        <nav class="flex-1 space-y-1">
            <a href="index.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-100 transition"><i data-lucide="home" class="w-5 h-5"></i><span class="text-sm">Dashboard</span></a>
            <a href="writing.html" class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900 text-white font-medium shadow-sm"><i data-lucide="pen-tool" class="w-5 h-5"></i><span class="text-sm">Writing</span></a>
        </nav>
    </aside>

    <main class="flex-1 p-6 lg:p-12 overflow-y-auto">
        <div class="max-w-3xl mx-auto pb-20">
            
            <a href="writing-articles.html" class="inline-flex items-center text-[11px] font-bold text-gray-400 hover:text-indigo-600 uppercase tracking-wider mb-10 transition">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-1.5"></i> Back to Guides
            </a>

            <div class="mb-10 border-b border-gray-100 pb-10">
                <span id="art-category" class="inline-block bg-gray-100 text-gray-600 text-[9px] font-extrabold px-2.5 py-1 rounded uppercase tracking-widest mb-4">...</span>
                <h1 id="art-title" class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight leading-tight mb-4">Loading article...</h1>
                <div class="flex items-center text-xs font-medium text-gray-400">
                    <i data-lucide="clock" class="w-3.5 h-3.5 mr-1.5"></i>
                    <span id="art-time">-- min read</span>
                </div>
            </div>

            <div id="art-content" class="prose prose-slate prose-img:rounded-xl max-w-none text-slate-700 leading-relaxed">
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        // БАЗА ДАННЫХ СТАТЕЙ
        const ARTICLES = {
            'academic_template': {
                title: "The Perfect Academic Template",
                category: "Template",
                badgeClass: "bg-teal-50 text-teal-600",
                time: "3 min read",
                content: `
                    <p class="text-lg text-gray-500 mb-8">The brand new TOEFL Academic Discussion task requires you to post in an online university forum. You have only 10 minutes to read the prompt, other students' responses, and write at least 100 words. Use this tactical structure to save time.</p>
                    
                    <div class="bg-slate-50 p-6 rounded-2xl border border-gray-100 font-mono text-sm text-slate-600 space-y-4 mb-8">
                        <p class="font-bold text-slate-800">[Paragraph 1: State your stance + Reference another student]</p>
                        <p>"While I understand <strong>[Student Name]’s</strong> perspective that <strong>[Summarize their point in 3-5 words]</strong>, I strongly agree with <strong>[Other Student Name]’s</strong> view regarding <strong>[Topic]</strong>. In my opinion,..."</p>
                        <p class="font-bold text-slate-800 mt-6">[Paragraph 2: Deliver your unique point + Real-world example]</p>
                        <p>"Furthermore, an essential factor to consider is that... <strong>[Your independent argument]</strong>. For instance, a recent study from..."</p>
                    </div>

                    <h3 class="font-bold text-slate-900 text-lg mb-3 mt-8">Key Strategy Rules:</h3>
                    <ul class="list-disc pl-5 space-y-2 text-gray-600 mb-8">
                        <li><strong>Never copy:</strong> Do not copy chunks of words from the prompt or other students. Paraphrase everything.</li>
                        <li><strong>Be unique:</strong> Do not just echo what "Paul" or "Kelly" said. Bring a completely new angle or specific examples.</li>
                        <li><strong>Grammar over length:</strong> 120-140 perfectly polished words will score higher than 200 words packed with typos.</li>
                    </ul>
                `
            },
            'transitions': {
                title: "Transition Words Cheat Sheet",
                category: "Vocabulary",
                badgeClass: "bg-indigo-50 text-indigo-600",
                time: "4 min read",
                content: `
                    <p class="text-lg text-gray-500 mb-8">To achieve a 4.5+ score out of 5 in Cohesion, you must avoid basic transition words like <em>"And"</em>, <em>"But"</em>, or <em>"So"</em>. Use these high-level alternatives instead.</p>
                    
                    <div class="space-y-6">
                        <div class="bg-white border border-gray-100 p-5 rounded-2xl shadow-sm">
                            <h4 class="font-bold text-xs uppercase tracking-wider text-indigo-600 mb-2">1. Adding Information (Instead of "Also")</h4>
                            <p class="text-sm text-gray-600"><strong class="text-slate-900">Furthermore, Moreover, In addition, Additionally.</strong><br><br><em>Example:</em> "Furthermore, implementing green spaces in urban environments drastically drops local temperatures."</p>
                        </div>
                        <div class="bg-white border border-gray-100 p-5 rounded-2xl shadow-sm">
                            <h4 class="font-bold text-xs uppercase tracking-wider text-rose-500 mb-2">2. Showing Contrast (Instead of "But")</h4>
                            <p class="text-sm text-gray-600"><strong class="text-slate-900">Conversely, On the other hand, Nevertheless, Paradoxically.</strong><br><br><em>Example:</em> "Conversely, remote learning might diminish interpersonal communication skills."</p>
                        </div>
                        <div class="bg-white border border-gray-100 p-5 rounded-2xl shadow-sm">
                            <h4 class="font-bold text-xs uppercase tracking-wider text-emerald-600 mb-2">3. Cause & Effect (Instead of "Because / So")</h4>
                            <p class="text-sm text-gray-600"><strong class="text-slate-900">Consequently, Therefore, As a result, Thereby (+ -ing).</strong><br><br><em>Example:</em> "Governments reduced taxes; consequently, startups flourished throughout the quarter."</p>
                        </div>
                    </div>
                `
            },
            'build_sentence': {
                title: "Build a Sentence Task",
                category: "Grammar",
                badgeClass: "bg-blue-50 text-blue-600",
                time: "6 min read",
                content: `
                    <p class="text-lg text-slate-500 mb-8">In this task, you will see a short exchange between 2 people in an everyday campus setting. They may discuss a variety of topics, such as submitting class assignments, registering for events, or meeting with peers.</p>
                    
                    <p class="mb-6">The first sentence of the exchange is complete, while the second sentence contains several blanks. Along with the blanks, you will see words or phrases presented in an incorrect order. Your job is to rearrange these words or phrases to complete the second sentence so that it is both grammatically correct and contextually appropriate. Note that, in some questions, there is an <span class="bg-indigo-50 text-indigo-700 px-1 rounded font-medium">extra word or phrase that you will NOT use</span>.</p>

                    <div class="bg-gray-50 border border-gray-200 rounded-2xl p-6 shadow-sm flex flex-col md:flex-row gap-6 items-start md:items-center my-8">
                        <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center shrink-0">
                            <i data-lucide="info" class="w-6 h-6 text-indigo-600"></i>
                        </div>
                        <div>
                            <p class="text-slate-700 m-0">
                                You will complete <strong class="text-slate-900">10 Build a Sentence (3-7 blanks) questions</strong> in the Writing section, and you will have <strong class="text-slate-900">about 6 minutes</strong> to complete the section. Each question is scored as either correct or incorrect; no partial credit is awarded.
                            </p>
                        </div>
                    </div>

                    <div class="mb-12">
                        <p class="font-bold text-slate-900 mb-2">This task evaluates the following:</p>
                        <ul class="list-disc pl-5 space-y-1 text-slate-700 marker:text-indigo-400">
                            <li>Your knowledge of sentence-level grammar</li>
                            <li>Your ability to construct appropriate responses in short interactions</li>
                        </ul>
                    </div>

                    <h2 class="text-xl font-extrabold text-slate-900 mt-12 mb-6 uppercase tracking-wider text-[13px] border-b border-gray-200 pb-2">How it looks</h2>
                    
                    <div class="border border-gray-300 rounded-lg overflow-hidden mb-12 bg-white shadow-sm font-sans select-none not-prose">
                        <div class="bg-[#474747] text-white flex justify-between items-center px-4 py-2.5">
                            <div class="font-bold text-lg tracking-wider flex items-center gap-1.5">
                                <i data-lucide="asterisk" class="w-5 h-5"></i> toefl ibt<span class="text-[10px] align-top mt-1">®</span>
                            </div>
                            <div class="flex gap-2 hidden sm:flex">
                                <button class="border border-white/60 px-3 py-1 rounded text-[11px] font-bold hover:bg-white/10 flex items-center gap-1.5">Help <i data-lucide="help-circle" class="w-3.5 h-3.5 fill-white text-[#474747]"></i></button>
                                <button class="border border-white/60 px-3 py-1 rounded text-[11px] font-bold hover:bg-white/10 flex items-center gap-1.5">Review <i data-lucide="bookmark" class="w-3.5 h-3.5 fill-white text-[#474747]"></i></button>
                                <button class="bg-white text-slate-900 px-4 py-1 rounded text-[11px] font-bold hover:bg-gray-100 flex items-center gap-1">Next <i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                        <div class="bg-white border-b border-black px-4 py-1 text-[11px] font-bold flex justify-between items-center text-black">
                            <div>Writing &nbsp;|&nbsp; Question 1 of 10</div>
                            <div class="flex items-center gap-2">00:05:45 <i data-lucide="eye-off" class="w-4 h-4"></i> Hide Time</div>
                        </div>
                        <div class="px-6 py-12 md:py-16 flex flex-col items-center min-h-[400px]">
                            <h3 class="text-[22px] font-bold mb-14 text-black tracking-tight text-center">Make an appropriate sentence.</h3>
                            
                            <div class="w-full max-w-xl flex flex-col gap-10">
                                <div class="flex items-center gap-5">
                                    <div class="w-16 h-16 rounded-full border border-gray-300 bg-gray-50 flex-shrink-0 flex justify-center items-center">
                                        <i data-lucide="user" class="w-8 h-8 text-gray-300"></i>
                                    </div>
                                    <div class="font-bold text-[17px] text-black">I need to buy a new laptop.</div>
                                </div>
                                <div class="flex items-center gap-5">
                                    <div class="w-16 h-16 rounded-full border border-gray-300 bg-gray-50 flex-shrink-0 flex justify-center items-center">
                                        <i data-lucide="user" class="w-8 h-8 text-gray-300"></i>
                                    </div>
                                    <div class="flex flex-wrap items-end gap-y-3 gap-x-2">
                                        <span class="inline-block w-10 sm:w-12 border-b-2 border-black"></span>
                                        <span class="inline-block w-10 sm:w-12 border-b-2 border-black"></span>
                                        <span class="inline-block w-10 sm:w-12 border-b-2 border-black"></span>
                                        <span class="inline-block w-10 sm:w-12 border-b-2 border-black"></span>
                                        <span class="inline-block w-10 sm:w-12 border-b-2 border-black"></span>
                                        <span class="font-bold text-black text-lg pb-0.5">?</span>
                                    </div>
                                </div>
                                
                                <div class="flex flex-wrap justify-center gap-3 sm:gap-5 mt-8">
                                    <span class="text-[15px] text-black font-medium">has</span>
                                    <span class="text-[15px] text-black font-medium">the best</span>
                                    <span class="text-[15px] text-black font-medium">which</span>
                                    <span class="text-[15px] text-black font-medium">store</span>
                                    <span class="text-[15px] text-black font-medium">deals</span>
                                </div>
                            </div>
                        </div>
                        <div class="border-t border-black px-6 py-5 bg-white text-black text-sm md:text-[15px]">
                            Note: In the actual test, after you move a word or phrase to the first blank of the sentence, it will automatically become capitalized.
                        </div>
                    </div>

                    <h2 class="text-xl font-extrabold text-slate-900 mt-12 mb-6 uppercase tracking-wider text-[13px] border-b border-gray-200 pb-2">Strategies</h2>

                    <div class="bg-blue-50/40 border border-indigo-100 rounded-[1.5rem] p-6 md:p-10 my-8 shadow-sm">
                        <ul class="space-y-6 text-[15px] text-slate-700 m-0 list-none pl-0">
                            <li class="flex items-start">
                                <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full mt-2 mr-4 flex-shrink-0"></span>
                                <p class="m-0"><strong class="text-slate-900">Identify the sentence type.</strong> Start by recognizing whether the sentence is a question, statement, or command. This helps determine the correct word order and grammatical structure. For example, questions often begin with words like "what", "where", "how", or "why" and follow specific patterns.</p>
                            </li>
                            <li class="flex items-start">
                                <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full mt-2 mr-4 flex-shrink-0"></span>
                                <p class="m-0"><strong class="text-slate-900">Locate the subject and verb.</strong> Find the subject (who or what the sentence is about) and the main verb (what the subject is doing). This anchors the sentence and helps organize the remaining words around it.</p>
                            </li>
                            <li class="flex items-start">
                                <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full mt-2 mr-4 flex-shrink-0"></span>
                                <p class="m-0"><strong class="text-slate-900">Use clues from the first sentence.</strong> The first sentence in the exchange provides context. Use it to understand the setting, tone, and topic so you can choose words that are contextually appropriate.</p>
                            </li>
                            <li class="flex items-start">
                                <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full mt-2 mr-4 flex-shrink-0"></span>
                                <p class="m-0"><strong class="text-slate-900">Rearrange words logically.</strong> Look at the jumbled words and mentally test different arrangements. Use your knowledge of English syntax (e.g., subject-verb-object order, placement of adverbs) to find a grammatically correct structure.</p>
                            </li>
                            <li class="flex items-start">
                                <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full mt-2 mr-4 flex-shrink-0"></span>
                                <p class="m-0"><strong class="text-slate-900">Eliminate extra words.</strong> Remember that some tasks include an extra word or phrase that doesn't fit. If a word seems redundant or grammatically incompatible, consider leaving it out.</p>
                            </li>
                            <li class="flex items-start">
                                <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full mt-2 mr-4 flex-shrink-0"></span>
                                <p class="m-0"><strong class="text-slate-900">Read the sentence aloud.</strong> Once you have arranged the words, read the sentence aloud (or silently) to check for natural flow and correctness. If it sounds awkward or confusing, try a different arrangement.</p>
                            </li>
                            <li class="flex items-start">
                                <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full mt-2 mr-4 flex-shrink-0"></span>
                                <p class="m-0"><strong class="text-slate-900">Practice common patterns.</strong> Familiarize yourself with common sentence structures, especially for questions and short exchanges. This builds intuition and speeds up your response time during the test.</p>
                            </li>
                        </ul>
                    </div>

                    <h2 class="text-xl font-extrabold text-slate-900 mt-12 mb-6 uppercase tracking-wider text-[13px] border-b border-gray-200 pb-2">Examples</h2>

                    <div class="border border-indigo-100 rounded-2xl overflow-hidden mb-6 bg-white shadow-sm mx-auto not-prose">
                       <div class="border-b border-indigo-50/80 p-6 md:p-8 flex items-center gap-6">
                            <div class="w-[72px] h-[72px] rounded-full border border-gray-200 flex-shrink-0 flex items-center justify-center bg-gray-50 hidden sm:flex">
                                <i data-lucide="user" class="w-8 h-8 text-gray-300"></i>
                            </div>
                            <div class="text-[17px] text-slate-800 font-medium">I'm thinking about volunteering at the city animal shelter this summer.</div>
                       </div>
                       <div class="border-b border-indigo-50/80 p-6 md:p-8 flex items-center gap-6 bg-[#fafbfc]">
                            <div class="w-[72px] h-[72px] rounded-full border border-gray-200 flex-shrink-0 flex items-center justify-center bg-gray-50 hidden sm:flex">
                                <i data-lucide="user" class="w-8 h-8 text-gray-300"></i>
                            </div>
                            <div class="flex flex-wrap items-end gap-y-4 gap-x-2">
                                <span class="inline-block w-[60px] md:w-[72px] border-b-2 border-slate-700"></span>
                                <span class="inline-block w-[60px] md:w-[72px] border-b-2 border-slate-700"></span>
                                <span class="inline-block w-[60px] md:w-[72px] border-b-2 border-slate-700"></span>
                                <span class="inline-block w-[60px] md:w-[72px] border-b-2 border-slate-700"></span>
                                <span class="inline-block w-[60px] md:w-[72px] border-b-2 border-slate-700"></span>
                                <span class="inline-block w-[60px] md:w-[72px] border-b-2 border-slate-700"></span>
                                <span class="pb-1 text-slate-800 text-[17px] font-medium">there?</span>
                            </div>
                       </div>
                       <div class="p-6 text-center text-[15px] md:text-[17px] text-slate-800 tracking-wide bg-white">
                           volunteers / usually / have / responsibilities / do / what
                       </div>
                    </div>

                    <details class="group bg-white border border-indigo-100 rounded-[1.5rem] shadow-sm mb-10 overflow-hidden cursor-pointer hover:border-indigo-200 transition-colors not-prose">
                        <summary class="flex justify-between items-center p-6 bg-indigo-50/30 group-hover:bg-indigo-50/60 transition-colors font-bold text-slate-800 outline-none">
                            <div class="flex items-center gap-3">
                                <i data-lucide="lightbulb" class="w-5 h-5 text-indigo-500"></i>
                                <span class="tracking-wide text-sm sm:text-base">View Answer & Explanation</span>
                            </div>
                            <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm">
                                <i data-lucide="chevron-down" class="w-4 h-4 text-indigo-500 group-open:rotate-180 transition-transform duration-300"></i>
                            </div>
                        </summary>
                        <div class="p-6 border-t border-indigo-50 bg-white">
                            <div class="mb-8 px-2">
                                <span class="font-extrabold text-[#2e266d] text-base block mb-1">Correct answer:</span>
                                <span class="text-lg text-slate-800">What responsibilities do volunteers usually have there?</span>
                            </div>
                            
                            <div class="rounded-xl overflow-hidden border border-[#2e266d]/10 bg-indigo-50/40">
                                <div class="bg-[#363273] text-white font-bold py-3 px-6 text-sm tracking-widest uppercase">
                                    Explanation
                                </div>
                                <div class="p-6 md:p-8 text-slate-700 text-[15px] leading-relaxed space-y-5">
                                    <p class="m-0">The sentence "What responsibilities do volunteers usually have there?" demonstrates proper sentence-level grammar and contextual appropriateness. Grammatically, it is structured as a question, beginning with the interrogative word "What," followed by the auxiliary verb "do," the plural subject "volunteers," and the main verb "have." The adverb "usually" is correctly placed between the auxiliary verb and main verb to indicate frequency, and "there" appropriately concludes the sentence by specifying the location. This structure adheres to standard English question formation rules.</p>
                                    <p class="m-0">Contextually, the sentence is a natural and relevant follow-up to the preceding statement, "I'm thinking about volunteering at the city animal shelter this summer." It seeks information about typical duties at the shelter, aligning with the social and academic context of the exchange. The question is clear, concise, and appropriately framed for the situation, making it both grammatically correct and contextually suitable.</p>
                                </div>
                            </div>
                        </div>
                    </details>
                `
            }
        };

        // Логика загрузки
        const params = new URLSearchParams(window.location.search);
        const articleId = params.get('id');
        const article = ARTICLES[articleId];

        if (article) {
            document.getElementById('art-title').innerText = article.title;
            document.getElementById('art-time').innerText = article.time;
            
            const badge = document.getElementById('art-category');
            badge.innerText = article.category;
            badge.className = `inline-block text-[9px] font-extrabold px-2.5 py-1 rounded uppercase tracking-widest mb-4 ${article.badgeClass}`;
            
            document.getElementById('art-content').innerHTML = article.content;
            
            // Инициализируем иконки, которые появились внутри контента статьи
            setTimeout(() => {
                lucide.createIcons();
            }, 50);
        } else {
            document.getElementById('art-content').innerHTML = "<p class='text-red-500'>Article not found. Please go back.</p>";
        }
    </script>
</body>
</html>
