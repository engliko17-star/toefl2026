          model: "[A] My friends mostly like action and sci-fi movies, while my family prefers comedies. [R] My friends are students, and after a stressful week, they want something exciting with special effects. My parents work a lot, so in the evening they just want to laugh and relax. [E] For example, last month my friends and I went to the cinema to see a new sci-fi film, and it kept us on the edge of our seats for three hours. At home, my parents watch the same old comedies every New Year, and they still laugh at every joke. My dad also loves documentaries about music. [C] So it depends on who I'm with — action with friends, comedy with family.",
          model5: "[A] My friends lean toward action and sci-fi, whereas my family is firmly in the comedy camp. [R] My friends are students, and after a stressful week, they want something fast-paced and visually spectacular. My parents, on the other hand, work long hours, so by evening all they want is something light that makes them laugh. [E] Last month, for instance, my friends and I saw a new sci-fi epic at the cinema, and it kept us **on the edge of our seats** for nearly three hours. My parents, meanwhile, rewatch the same classic comedies every New Year and still laugh at every joke, while my dad also has a soft spot for music documentaries. [C] So my viewing depends entirely on the company: spectacle with friends, comedy with family." },
        { q: "When you watch a movie, do you prefer to watch after work or school on weekdays? Or do you like to watch during the weekends? Why?",
          lx: ["unwind", "lose track of time", "movie night"],
          model: "[A] I prefer to watch movies on weekends. [R] On weekdays, I'm busy with classes, homework and my part-time job, and if I start a long movie in the evening, I go to bed too late. On weekends, I can relax and really enjoy the film without looking at the time. [E] For example, every Friday night, my roommates and I have a movie night in our dorm. We make popcorn, turn off the lights and watch something we've chosen together during the week. On weekdays, I watch only one short episode of a series to relax. [C] So weekends are for movies, and weekdays are for short episodes.",
          model5: "[A] Definitely on weekends. [R] My weekdays are packed with lectures, assignments and shifts at the café, and starting a two-hour film in the evening inevitably pushes my bedtime far too late. At the weekend, by contrast, I can settle in and fully immerse myself in a story without glancing at the clock. [E] Every Friday, for instance, my roommates and I hold a movie night in our dorm: we make popcorn, switch off the lights and watch a film we've voted on during the week. On weeknights, I limit myself to a single short episode of a series to **unwind**. [C] So weekends are reserved for films, while weekdays get bite-sized episodes at most." },
        { q: "In the past, people mostly watched movies in theaters. Today, many people watch movies at home. Do you think that movie theaters will continue to exist in the future? Why or why not?",
          lx: ["go to the cinema", "streaming platform", "experience"],
          model: "[A] Yes, I think movie theaters will continue to exist, but there will be fewer of them. [R] Streaming is cheap and convenient, so people will watch most films at home. But going to the cinema is a special experience — the huge screen, the sound and watching with other people. [E] For example, I watch most films on my laptop, but when a big sci-fi film comes out, I always go to the cinema, because at home it's just not the same. Also, some cinemas in my city now offer comfortable sofas, food and special events, and they're always full. [C] So cinemas will survive, but as a special experience, not an everyday thing.",
          model5: "[A] I believe they'll survive, though probably in smaller numbers and in a different form. [R] Streaming is cheap and convenient, so most everyday viewing will happen at home; however, cinemas offer something streaming can't replicate — a giant screen, immersive sound and the shared reaction of an audience. [E] I watch most films on my laptop, for instance, but whenever a major sci-fi release comes out, I insist on the cinema, because the experience simply isn't comparable at home. Several cinemas in my city have also reinvented themselves with reclining seats, proper food and themed screenings, and they're consistently sold out. [C] So cinemas won't disappear, but they'll increasingly be treated as an occasion rather than a routine." },
        { q: "Some people believe that movies can be a powerful tool for educating people and raising awareness about important issues. Do you agree with this idea? Or do you think there are other, more effective ways to educate people? Explain why you think so.",
          lx: ["raise awareness", "thought-provoking", "based on a true story"],
          model: "[A] I agree that movies are a powerful tool for raising awareness. [R] Films show real people and emotions, so viewers feel the problem, not just learn facts about it. Many people who never read reports will watch a film. [E] For example, I watched a documentary about plastic in the ocean, and after that, I completely stopped buying bottled water. A report with the same facts would never affect me so much. But films can also simplify things, so we should check the facts after watching. [C] So movies are a great way to start caring about an issue, but not the only way to learn about it.",
          model5: "[A] I strongly agree, although films work best as a starting point rather than the whole education. [R] Movies make issues emotional and personal, so viewers feel a problem instead of merely processing information, and they reach audiences who would never read a report. [E] A documentary about ocean plastic, for instance, made me stop buying bottled water entirely, something a statistics-heavy article had never managed. That said, films inevitably simplify and sometimes dramatize, so it's worth checking the facts afterwards. [C] So films are arguably the most effective way to make people care, while books and reliable journalism are better at helping them understand." }
      ]
    },
    { id: "s103", badge: "official", title: "Reading Habits", src: "Official TOEFL · 103",
      scenario: "You have agreed to participate in a research study about reading habits. You will have a short online interview with a researcher. The researcher will ask you some questions.",
      questions: [
        { q: "First, what kind of books do your family or friends generally like to read? For example, do they prefer fiction, nonfiction, biographies, or other types?",
          lx: ["fiction / nonfiction", "biography", "a bookworm"],
          model: "[A] My family and friends read different kinds of books, but most of them prefer fiction. [R] They read mainly to relax, and a good story helps them forget about work or studies. Only my dad prefers nonfiction. [E] For example, my younger sister is a real bookworm — she reads fantasy novels and finishes a big book in three days. My mom likes detective stories, and my dad reads biographies of famous musicians, especially jazz players. My friends mostly read on their phones, usually popular novels that they find on social media. [C] So fiction is the favorite in my circle, but everyone has their own genre.",
          model5: "[A] Fiction dominates in my circle, although everyone has their own niche. [R] Most people around me read primarily to relax, and a gripping story is the easiest way to switch off from work or studies; my dad is the notable exception. [E] My younger sister, for instance, is a genuine **bookworm** who devours fantasy novels, often finishing a five-hundred-page book in three days. My mother is hooked on detective fiction, while my father reads **biographies** of musicians, particularly jazz legends. My friends, meanwhile, tend to read on their phones, usually novels that have gone viral on social media. [C] So fiction is the common favorite, but each person's taste reflects what they need from reading." },
        { q: "When you read your favorite book, do you prefer to read it in a quiet place, or do you like to read it where there is some background noise? Why?",
          lx: ["curl up with a good book", "get into a book", "concentrate"],
          model: "[A] I prefer to read in a quiet place. [R] When there's noise around me, I can't concentrate, and I read the same sentence again and again. In silence, I can really get into the story and forget about everything else. [E] For example, my favorite time to read is at night in bed, when my roommates are asleep and my phone is on my desk. I read for twenty minutes, and I feel calm and ready to sleep. On the bus, it's too noisy, so I listen to podcasts instead of reading. [C] So for me, reading needs silence, but for other activities, a bit of noise is fine.",
          model5: "[A] I need quiet, otherwise I simply can't get absorbed in a book. [R] Background noise constantly pulls my attention away, so I end up rereading the same sentence; in silence, by contrast, I can fully **get into** the story and forget everything else. [E] My favorite time to read, for instance, is late at night in bed, when my roommates are asleep and my phone is charging on my desk; twenty minutes with a novel leaves me calm and ready to sleep. On noisy buses, I don't even attempt to read and listen to podcasts instead. [C] So reading, for me, is a quiet ritual, whereas noisier settings suit audio formats much better." },
        { q: "If you have time to read one novel, do you think it more worthwhile to read an old classic that many readers love, or would you choose a newly published novel that tells a modern story? Why?",
          lx: ["classic", "relatable", "stand the test of time"],
          model: "[A] I would choose an old classic. [R] Classics have been loved by readers for many years, so I know the book is good. A new novel might be popular now, but people may forget it in a few years. Classics also help me understand culture and history. [E] For example, last summer I read a famous Russian classic that I had avoided at school because it was so long. I was surprised that the characters had the same problems as people today — love, money and family. It's still one of the best books I've read. [C] So if I have time for only one book, I want something that has already proved itself.",
          model5: "[A] With time for just one, I'd choose a classic. [R] A classic has effectively been tested by generations of readers, so its quality is almost guaranteed, whereas many new releases are fashionable for a season and then forgotten. Classics also offer insight into the culture and history that shaped later writers. [E] Last summer, for instance, I finally read a long Russian classic I'd avoided at school, and I was struck by how **relatable** its characters were; they struggled with love, money and family pressure exactly as people do now. It remains one of the best books I've ever read. [C] So with limited time, I'd choose a book that has already **stood the test of time**." },
        { q: "Some people believe that reading helps improve one's imagination and creativity. Do you agree with this idea or do you think there are other activities that can also enhance these skills? Explain why you think so.",
          lx: ["imagination", "immerse yourself in", "read between the lines"],
          model: "[A] I agree that reading improves imagination, but I think other activities like music and art also help. [R] When we read, we create the faces, places and voices ourselves, so our brain works much more than when we watch a film. But playing music or drawing also makes us create something new. [E] For example, when I read fantasy novels, I imagine whole worlds in my head, and sometimes I even dream about them. But I feel most creative when I play guitar and try to write my own melodies. My best friend, who paints, says that she gets ideas from walking in nature, not from books. [C] So reading is great for imagination, but it's not the only way.",
          model5: "[A] I agree, though I'd argue reading is one of several powerful routes to creativity rather than the only one. [R] When we read, we have to construct faces, places and voices ourselves, so our imagination does far more work than when a film supplies everything visually. Creating something, however, such as music or art, develops creativity in a more active way. [E] When I read fantasy novels, for instance, I build entire worlds in my head and occasionally even dream about them. Yet I feel most creative when I'm improvising melodies on my guitar, and my best friend, who paints, says her ideas come mostly from walks in nature. [C] So reading feeds the imagination, but creativity grows best when we also make things ourselves." }
      ]
    },
    { id: "s084", badge: "official", title: "Books and Reading", src: "Official TOEFL · 084",
      scenario: "You have signed up for a study run by a university research group that is investigating people's experiences with books and reading. You will have a short online interview with a researcher. The researcher will ask you some questions.",
      questions: [
        { q: "Was there a time in your life when you read more, or less, than you do now? What changed?",
          lx: ["read for pleasure", "attention span", "a page-turner"],
          model: "[A] Yes, I read much more when I was about twelve or thirteen. [R] At that age, I had more free time and no smartphone, so books were my main entertainment. Later, at university, I had to read a lot for classes, and in my free time I preferred my phone. [E] For example, as a child, I read a whole seven-book fantasy series in one summer, sometimes until two in the morning. In my first year of university, I almost stopped reading for pleasure. Last year, I noticed I couldn't focus, so I started reading for twenty minutes every night. Now I read about one book a month. [C] So I read less than before, but I'm slowly coming back.",
          model5: "[A] Yes, I read far more as a young teenager than I do now. [R] Back then, I had plenty of free time and no smartphone, so books were my main source of entertainment. At university, though, academic reading took over, and in my spare time I reached for my phone instead. [E] At twelve, for instance, I'd read until two in the morning, getting through an entire fantasy series in one summer. In my first year at university, by contrast, I barely read for pleasure at all, and last year I noticed my **attention span** had shrunk so much that I couldn't focus for ten minutes. So I committed to twenty minutes of reading every night, and I'm now back to about a book a month. [C] So I read less than I once did, but I'm gradually rebuilding the habit." },
        { q: "In your opinion, is reading for pleasure a popular way people spend their free time where you live? Why do you think that is?",
          lx: ["read for pleasure", "streaming platform", "attention span"],
          model: "[A] I think reading for pleasure is less popular now than other free-time activities where I live. [R] Most people are busy and tired after work or study, and it's easier to watch a series or scroll social media than to concentrate on a book. Also, books are quite expensive. [E] For example, on the metro in my city, I see maybe one or two people with a book, while everyone else is looking at their phones. But there's also a new trend — young people share book reviews on social media, and my local bookstore now has a special table of popular books from there. [C] So reading is not the most popular hobby, but it's becoming more fashionable again.",
          model5: "[A] It's not among the most popular pastimes where I live, although there are signs of a revival. [R] After long days at work or university, most people are exhausted, and streaming or scrolling demands far less effort than concentrating on a book; books are also relatively expensive. [E] On the metro, for instance, I typically see one or two people reading, while everyone else stares at a screen. Interestingly, though, young people have started sharing book recommendations on social media, and my local bookstore now dedicates an entire table to titles that went viral online. [C] So reading for pleasure is a minority activity for now, but it seems to be becoming fashionable again among younger people." },
        { q: "Do you think reading different types of books helps people understand each other and get along better? Why or why not?",
          lx: ["empathy", "broaden your horizons", "see the world through someone else's eyes"],
          model: "[A] Yes, I think reading different types of books helps people understand each other. [R] When we read a story, we see the world through the eyes of another person — maybe from a different country, religion or generation. This helps us develop empathy and become less judgmental. [E] For example, last year I read a novel about a refugee family who moved to Europe. After reading it, I understood much better the people I meet at the refugee center where I volunteer — their fears, their hopes and why small things are so difficult for them. [C] So books can help us understand people we never met.",
          model5: "[A] I'm convinced they do. [R] Fiction, in particular, allows us to **see the world through someone else's eyes**, whether that person belongs to a different culture, faith or generation, and this naturally builds **empathy** and makes us slower to judge. [E] Last year, for instance, I read a novel about a refugee family rebuilding their lives in Europe, and it transformed how I relate to the people I meet at the refugee center where I volunteer; I now understand far better their anxieties, their hopes and why everyday tasks can feel overwhelming. [C] So reading widely won't solve every conflict, but it can turn strangers into people we genuinely understand." },
        { q: "Looking ahead, some people believe that future generations will read less than today's generation. Do you agree or disagree? Why?",
          lx: ["attention span", "e-book / audiobook", "format"],
          model: "[A] I disagree — I think future generations will read differently, but not necessarily less. [R] People already read a lot every day — messages, articles, posts. Also, new formats like audiobooks and e-books make reading easier for busy people. The problem is more about long, deep reading. [E] For example, my younger cousins hardly read paper books, but they listen to audiobooks on the way to school and read long stories online. My sister reads on her phone every night. So they're reading, just in another way. Schools will need to teach children how to focus on long texts. [C] So the format will change, but reading won't disappear.",
          model5: "[A] I'd disagree; I suspect future generations will read differently rather than less. [R] Young people already read constantly — messages, articles, posts — and audiobooks and e-books make longer texts more accessible than ever. The real risk, in my view, is not the quantity of reading but the decline of deep, sustained reading. [E] My younger cousins, for instance, rarely pick up paper books, yet they listen to audiobooks on the way to school and read lengthy stories online, while my sister reads on her phone every night. Schools will therefore need to teach children to concentrate on long texts deliberately. [C] So the **format** will keep evolving, but reading itself isn't going anywhere." }
      ]
    },
    { id: "srh", badge: "platform", title: "Reading Habits & Preferences", src: "Практика платформы",
      scenario: "We're exploring how people engage with reading and what kinds of materials they enjoy. I'd like to ask you a few questions about your reading habits and preferences.",
      questions: [
        { q: "What kinds of books or reading materials do you usually read—fiction, nonfiction, news articles, magazines, or something else? And how often do you make time for reading?",
          lx: ["novel", "fiction / nonfiction", "read for pleasure"],
          model: "[A] I usually read novels, especially fantasy and historical fiction, plus news articles. [R] Novels help me relax and escape from studying, and news articles help me stay informed. I read every day, but not always books. [E] For example, every night I read a novel in bed for about twenty minutes, without my phone. Right now, I'm reading a historical novel set in Portugal in the sixteenth century — I chose it because I traveled there last summer. In the morning, while I have coffee, I read the news on a news app. [C] So I read every day — news for information and novels for pleasure.",
          model5: "[A] Mainly novels, particularly fantasy and historical fiction, alongside news articles. [R] Novels are my way to unwind and escape from academic reading, whereas the news keeps me informed. I read daily, although not always books. [E] Every night, for instance, I spend about twenty minutes reading in bed with my phone well out of reach. At the moment, I'm halfway through a historical novel set in sixteenth-century Portugal, which I picked because I traveled there last summer. In the mornings, over coffee, I skim the headlines on a news app. [C] So reading is part of my daily routine: news for information and fiction for pleasure." },
        { q: "What usually motivates you to pick up something to read? And how do you typically decide what to read next?",
          lx: ["recommend a book to", "reviews", "get into a book"],
          model: "[A] I usually read to relax or to learn about a place or topic that interests me, and I choose books mostly by recommendations. [R] I trust people who know me, because they know my taste. I also sometimes read a book after I watch a film or visit a new place. [E] For example, my sister recommended a fantasy series to me last year, and I loved it. Before my trip to Barcelona, I read a novel set in the city, and it made the trip much more interesting. I also check reviews online before I buy a book, because books are expensive. [C] So recommendations and my own interests decide what I read next.",
          model5: "[A] I'm motivated mainly by curiosity and the need to switch off, and I usually choose based on personal recommendations. [R] People who know me understand my taste far better than any algorithm, although a film or a trip often sparks my interest in a particular book too. [E] My sister **recommended** a fantasy series **to me** last year, for instance, and I was hooked within twenty pages. Before visiting Barcelona, I read a novel set in the city, which made walking its streets far more meaningful. And since books aren't cheap, I always skim a few reader reviews before buying. [C] So my next book is usually chosen by a mix of trusted recommendations and whatever I'm curious about at that moment." },
        { q: "Do you have a preferred format when you read—do you like physical books, digital screens, or listening to audiobooks? What do you like or dislike about that format?",
          lx: ["e-book / audiobook", "paper book", "screen"],
          model: "[A] I prefer physical books, although I use audiobooks too. [R] With a paper book, I can concentrate better, and I like the feeling of turning pages. On a screen, I get distracted by notifications and my eyes get tired. But paper books are heavy and take up space. [E] For example, at night I always read a paper book, because it helps me fall asleep. On the bus or when I go running, I listen to audiobooks — last month I finished a whole history book during my runs! I tried e-books, but I kept switching to social media. [C] So paper is my favorite, and audiobooks are for when my hands are busy.",
          model5: "[A] Physical books are my clear favorite, with audiobooks as a useful supplement. [R] Paper helps me concentrate, and I genuinely enjoy the tactile experience of turning pages, whereas screens expose me to notifications and leave my eyes tired. Paper books do have drawbacks, however: they're heavy, pricey and take up space. [E] At night, for instance, I always read a paper book, as it helps me wind down. On buses or during runs, I switch to **audiobooks**; last month, I got through an entire history book purely while running. I did experiment with **e-books**, but I kept drifting to social media. [C] So paper is for deep reading, while audio fills the moments when my hands and eyes are busy." },
        { q: "With social media, streaming, and other distractions, many people believe that reading habits are changing—especially among younger generations. From your perspective, do you think people are reading more or less now than in the past? And what do you think is causing that change?",
          lx: ["attention span", "binge-watch", "short videos"],
          model: "[A] I think people read fewer books now than in the past, although they read a lot of short texts online. [R] Social media and streaming are designed to keep our attention, and short videos make it harder to concentrate on long texts. Also, people are busier and more tired. [E] For example, my grandmother says that when she was young, everyone on the train was reading a book or a newspaper. Today, people watch videos. I noticed this problem myself — last year I couldn't read for more than ten minutes without checking my phone. After a month of practice, I could read for an hour again. [C] So people read less deeply, mostly because of digital distractions.",
          model5: "[A] I'd say people read fewer books, although they consume more short-form text than ever. [R] Social media and streaming platforms are deliberately designed to capture our attention, and a diet of short videos makes sustained reading genuinely harder, a problem compounded by busier lives. [E] My grandmother, for instance, recalls that in her youth almost every train passenger had a book or newspaper, whereas today nearly everyone watches videos. I experienced the effect myself: last year, I couldn't read for more than ten minutes without checking my phone, and it took a month of deliberate practice to rebuild my focus. [C] So the main change isn't how much we read, but how deeply, and digital distractions are largely responsible." }
      ]
    },
    { id: "stv", badge: "platform", title: "TV & Streaming Habits", src: "Практика платформы",
      scenario: "I'm conducting a study on people's habits when it comes to watching television and streaming content. I'll ask you a few questions to understand how entertainment fits into your routine.",
      questions: [
        { q: "Can you tell me roughly how much time you spend watching TV or streaming shows and movies in a typical week? Are your viewing habits more regular, or do you tend to watch in longer sessions less frequently?",
          lx: ["episode", "binge-watch", "movie night"],
          model: "[A] I spend about seven or eight hours a week watching shows and movies. [R] On weekdays, I'm busy, so I watch just a little to relax, and on weekends, I have more time for longer sessions. [E] For example, from Monday to Thursday, I watch one episode of a series, about forty minutes, before I read and go to sleep. On Friday, my roommates and I have a movie night. And sometimes on Sunday, when a new season of my favorite series comes out, I watch three or four episodes in a row. [C] So I watch a bit every day, and a little more on weekends.",
          model5: "[A] Roughly seven or eight hours a week, split between short regular sessions and the occasional longer one. [R] Weekdays are busy, so I limit myself to something brief to unwind, whereas weekends leave room for longer viewing. [E] From Monday to Thursday, for instance, I watch a single forty-minute **episode** before reading and going to sleep. On Fridays, my roommates and I have our movie night, and when a new season of a favorite show comes out, I'll admit to watching three or four episodes back-to-back on a Sunday. [C] So my viewing is mostly regular and moderate, with the odd weekend exception." },
        { q: "What kinds of shows or films do you enjoy the most—dramas, comedies, documentaries, something else? And what draws you to those genres or stories?",
          lx: ["genre", "gripping", "thought-provoking"],
          model: "[A] I enjoy sci-fi series and documentaries the most. [R] Sci-fi stories are exciting, but they also make me think about the future, technology and what it means to be human. Documentaries help me learn something new in a relaxing way. [E] For example, my favorite series is about a group of people living on a spaceship after Earth becomes unlivable. It's gripping, but it also asks big questions about leadership and survival. I also watch nature documentaries with my dad when I'm at home — he loves them, and it's our time together. [C] So I like stories that are exciting and make me think at the same time.",
          model5: "[A] Sci-fi series and documentaries are my favorites. [R] Good science fiction is gripping on the surface, yet underneath it raises **thought-provoking** questions about technology, society and what it means to be human; documentaries, meanwhile, let me learn without it feeling like work. [E] My current favorite, for instance, follows a community living aboard a spaceship after Earth has become uninhabitable, and alongside the action, it explores leadership, survival and moral compromise. When I'm home, I also watch nature documentaries with my dad, which has become a small ritual we both treasure. [C] So I'm drawn to stories that entertain me and make me think at the same time." },
        { q: "Many people have access to multiple streaming platforms. Do you find it convenient to have so many options, or does it sometimes feel overwhelming to decide what to watch? How do you usually pick something?",
          lx: ["streaming platform", "recommend", "reviews"],
          model: "[A] It's convenient, but honestly, it often feels overwhelming. [R] There are so many shows that I sometimes spend half an hour scrolling and then watch nothing. Also, having many platforms is expensive, and the shows I want are always on different ones. [E] For example, last Saturday, my roommate and I spent forty minutes choosing a film, and in the end we were too tired to watch it! Now I have a list on my phone of films that friends recommend, so I just pick from the list. We also share one platform with my family to save money. [C] So more choice isn't always better — a short list helps me a lot.",
          model5: "[A] Convenient in theory, but frequently overwhelming in practice. [R] With endless options, I sometimes spend half an hour scrolling only to watch nothing, and subscribing to several platforms is expensive, especially when the shows I want are scattered across all of them. [E] Last Saturday, for instance, my roommate and I spent forty minutes debating what to watch, by which point we were too tired to start anything. To solve this, I now keep a list on my phone of films friends have recommended, so I simply choose from that, and my family shares a single subscription to keep costs down. [C] So more choice isn't necessarily better; a short, trusted list works far better for me." },
        { q: "Some experts have raised concerns about binge-watching—saying it can lead to sleep disruption, decreased productivity, or screen fatigue. Are those concerns valid based on your experience? What, if anything, do you do to manage your screen time?",
          lx: ["binge-watch", "lose track of time", "screen time"],
          model: "[A] Yes, I think those concerns are valid, because I've experienced them myself. [R] Series are made so that every episode ends with a surprise, and it's very hard to stop. When I watch late at night, I sleep badly and feel tired the next day. [E] For example, last winter I binge-watched a whole season in one night and went to bed at four in the morning. The next day, I missed an important lecture. After that, I made two rules: no more than one episode on weekdays, and no screens after eleven. I also turned off autoplay. [C] So binge-watching is fun, but I need clear rules to control it.",
          model5: "[A] They're absolutely valid; I've experienced every one of them. [R] Series are deliberately structured so that each episode ends on a cliffhanger, which makes stopping remarkably difficult, and late-night viewing reliably wrecks my sleep and my concentration the next day. [E] Last winter, for instance, I **binge-watched** an entire season in one night, went to bed at four in the morning and slept through an important lecture. Since then, I've followed two rules — a single episode on weeknights and no screens after eleven — and I've switched off autoplay, which removes the temptation of the next episode starting automatically. [C] So binge-watching can be fun occasionally, but without firm rules, it quietly eats into sleep and productivity." }
      ]
    }
