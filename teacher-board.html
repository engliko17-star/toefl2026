<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ученики и Расписание — TOEFL CRM</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Прокрутка для календаря */
        .calendar-scroll::-webkit-scrollbar { width: 6px; }
        .calendar-scroll::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <!-- БОКОВОЕ МЕНЮ -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-100 px-4 py-6 h-screen sticky top-0 shrink-0">
        <div class="font-bold text-2xl tracking-tighter mb-8 px-2 flex items-center space-x-2">
            <span>TOEFL</span><span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mt-2"></span>
        </div>
        
        <nav class="flex-1 flex flex-col justify-between">
            <div class="space-y-1">
                <a href="index.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span class="text-sm font-medium">Dashboard</span>
                </a>
                
                <div class="pt-4 pb-2 px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider">Teacher CRM</div>
                <a href="teacher-board.html" class="flex items-center space-x-3 p-3 rounded-xl bg-indigo-50 text-indigo-700 font-bold transition border border-indigo-200 shadow-sm">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span class="text-sm">CRM Панель</span>
                </a>
            </div>

            <button onclick="logoutUser()" class="flex items-center space-x-3 p-3 rounded-xl text-rose-500 hover:bg-rose-50/50 transition cursor-pointer mt-auto border border-dashed border-transparent hover:border-rose-100">
                <i data-lucide="log-out" class="w-5 h-5"></i>
                <span class="text-sm font-medium">Log Out</span>
            </button>
        </nav>
    </aside>

    <main class="flex-1 p-6 lg:p-10 overflow-y-auto">
        <!-- ШАПКА -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Панель преподавателя</h1>
                <p class="text-xs text-gray-400 mt-1">Управление доступами, классификация и расписание</p>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="relative w-full sm:w-72" id="searchContainer">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                    <input type="text" id="searchInput" placeholder="Поиск учеников..." class="w-full pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-100 transition shadow-xs">
                </div>
            </div>
        </div>

        <!-- ВКЛАДКИ -->
        <div class="flex space-x-6 border-b border-gray-200 mb-8">
            <button onclick="switchTab('students')" id="tab-students" class="pb-3 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 transition flex items-center space-x-2">
                <i data-lucide="users" class="w-4 h-4"></i>
                <span>Доступы и Ученики</span>
            </button>
            <button onclick="switchTab('calendar')" id="tab-calendar" class="pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-slate-700 transition flex items-center space-x-2">
                <i data-lucide="calendar-days" class="w-4 h-4"></i>
                <span>Расписание занятий</span>
            </button>
        </div>

        <!-- ========================================== -->
        <!-- РАЗДЕЛ 1: УЧЕНИКИ И ДОСТУПЫ (STUDENTS VIEW) -->
        <!-- ========================================== -->
        <div id="studentsView" class="block">
            <!-- СТАТИСТИЧЕСКИЕ ПЛИТКИ -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-xs flex items-center space-x-3">
                    <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl"><i data-lucide="users" class="w-5 h-5"></i></div>
                    <div>
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Всего учеников</span>
                        <div id="statTotal" class="text-lg font-extrabold text-slate-900">0</div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-xs flex items-center space-x-3">
                    <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
                    <div>
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Активные</span>
                        <div id="statActive" class="text-lg font-extrabold text-slate-900">0</div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-xs flex items-center space-x-3">
                    <div class="p-3 bg-amber-50 text-amber-600 rounded-xl"><i data-lucide="clock" class="w-5 h-5"></i></div>
                    <div>
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Ожидают доступа</span>
                        <div id="statPending" class="text-lg font-extrabold text-slate-900">0</div>
                    </div>
                </div>
            </div>

            <!-- СЕТКА КАРТОЧЕК СТУДЕНТОВ -->
            <div id="studentsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-12 text-gray-400 text-sm">
                    Загрузка списка учеников...
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- РАЗДЕЛ 2: КАЛЕНДАРЬ ЗАНЯТИЙ (CALENDAR VIEW) -->
        <!-- ========================================== -->
        <div id="calendarView" class="hidden">
            <div class="bg-white rounded-3xl border border-gray-100 shadow-xs p-6 h-[70vh] flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-slate-900">Предстоящие уроки</h2>
                    <button onclick="alert('Функция добавления урока')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition shadow-xs flex items-center space-x-2">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Новый урок</span>
                    </button>
                </div>
                
                <div class="flex-1 overflow-y-auto calendar-scroll pr-2 space-y-3" id="lessonsList">
                    <div class="text-center py-12 text-gray-400 text-sm">
                        Загрузка расписания...
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        let allStudents = [];
        let allLessons = [];

        window.onload = async () => {
            const user = await requireAuth();
            if (!user) return;
            
            if (user.role !== 'teacher') {
                window.location.href = 'index.html';
                return;
            }

            await loadStudents();
            lucide.createIcons();
        };

        // ТАБЫ: ПЕРЕКЛЮЧЕНИЕ ВИДОВ
        function switchTab(tab) {
            const studentsTab = document.getElementById('tab-students');
            const calendarTab = document.getElementById('tab-calendar');
            const studentsView = document.getElementById('studentsView');
            const calendarView = document.getElementById('calendarView');
            const searchContainer = document.getElementById('searchContainer');

            if (tab === 'students') {
                // Активируем вкладку Студентов
                studentsTab.className = "pb-3 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 transition flex items-center space-x-2";
                calendarTab.className = "pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-slate-700 transition flex items-center space-x-2";
                studentsView.classList.remove('hidden');
                calendarView.classList.add('hidden');
                searchContainer.classList.remove('hidden');
            } else {
                // Активируем вкладку Календаря
                calendarTab.className = "pb-3 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 transition flex items-center space-x-2";
                studentsTab.className = "pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-slate-700 transition flex items-center space-x-2";
                studentsView.classList.add('hidden');
                calendarView.classList.remove('hidden');
                searchContainer.classList.add('hidden');
                loadLessons(); // Подгружаем расписание при открытии вкладки
            }
        }

        // ЗАГРУЗКА И РЕНДЕР СТУДЕНТОВ
        async function loadStudents() {
            const { data: students, error } = await _supabase
                .from('profiles')
                .select('*')
                .eq('role', 'student');

            if (error) {
                console.error("Ошибка загрузки учеников:", error);
                document.getElementById('studentsGrid').innerHTML = `<div class="text-rose-500 col-span-full text-center py-10">Ошибка загрузки данных.</div>`;
                return;
            }

            allStudents = students || [];
            updateStats();
            renderStudents(allStudents);
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = allStudents.length;
            document.getElementById('statActive').innerText = allStudents.filter(s => s.is_approved).length;
            document.getElementById('statPending').innerText = allStudents.filter(s => !s.is_approved).length;
        }

        function renderStudents(studentsToRender) {
            const grid = document.getElementById('studentsGrid');
            grid.innerHTML = '';

            if (studentsToRender.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-white rounded-2xl p-10 text-center border border-gray-100 shadow-xs">
                        <i data-lucide="user-x" class="w-10 h-10 text-gray-300 mx-auto mb-3"></i>
                        <h3 class="text-sm font-bold text-slate-700">Ученики не найдены</h3>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            studentsToRender.forEach(student => {
                const displayName = student.full_name || student.name || (student.email ? student.email.split('@')[0] : 'Без имени');
                const initial = displayName.charAt(0).toUpperCase();

                // Классификация (заглушки, если полей еще нет в БД)
                const examDate = student.exam_date ? new Date(student.exam_date).toLocaleDateString('ru-RU') : 'Не назначено';
                const targetScore = student.target_score ? student.target_score : 'TBD';

                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-3xl border border-gray-100 shadow-xs hover:shadow-md hover:border-indigo-100 transition flex flex-col justify-between space-y-4 relative";
                
                card.innerHTML = `
                    <!-- ВЕРХНЯЯ ЧАСТЬ: ИНФО О СТУДЕНТЕ -->
                    <div class="space-y-4">
                        <div class="flex justify-between items-start gap-2">
                            <div class="flex items-center space-x-3 min-w-0">
                                <div class="w-11 h-11 rounded-2xl bg-indigo-50 text-indigo-600 font-extrabold flex items-center justify-center text-base border border-indigo-100 shrink-0 shadow-xs">
                                    ${initial}
                                </div>
                                <div class="min-w-0">
                                    <h3 class="text-sm font-bold text-slate-900 truncate" title="${displayName}">${displayName}</h3>
                                    <p class="text-[11px] text-gray-400 truncate">${student.email || '—'}</p>
                                </div>
                            </div>

                            <button onclick="toggleStudentApproval('${student.id}', ${student.is_approved})" 
                                class="px-2.5 py-1 rounded-xl text-[10px] font-bold border transition cursor-pointer shrink-0 flex items-center space-x-1 ${
                                    student.is_approved 
                                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100' 
                                    : 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'
                                }">
                                <span class="w-1.5 h-1.5 rounded-full ${student.is_approved ? 'bg-emerald-500' : 'bg-amber-500'}"></span>
                                <span>${student.is_approved ? 'Активен' : 'В очереди'}</span>
                            </button>
                        </div>

                        <!-- КЛАССИФИКАЦИЯ (ТЕГИ ФОКУСА/ЦЕЛИ) -->
                        <div class="flex space-x-2">
                            <div class="px-2 py-1 bg-purple-50 text-purple-700 rounded-lg text-[10px] font-bold flex items-center space-x-1 border border-purple-100">
                                <i data-lucide="calendar-check" class="w-3 h-3"></i>
                                <span>Экзамен: ${examDate}</span>
                            </div>
                            <div class="px-2 py-1 bg-blue-50 text-blue-700 rounded-lg text-[10px] font-bold flex items-center space-x-1 border border-blue-100">
                                <i data-lucide="target" class="w-3 h-3"></i>
                                <span>Цель: ${targetScore}</span>
                            </div>
                        </div>

                        <!-- НАСТРОЙКА ДОСТУПА К МОДУЛЯМ (ЧИПЫ) -->
                        <div class="bg-slate-50/70 p-3 rounded-2xl border border-gray-100/80 space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Доступ к модулям</span>
                            </div>
                            <div class="grid grid-cols-5 gap-1.5 pt-0.5">
                                ${renderModuleBadge(student.id, 'access_reading', 'Reading', 'R', student.access_reading)}
                                ${renderModuleBadge(student.id, 'access_listening', 'Listening', 'L', student.access_listening)}
                                ${renderModuleBadge(student.id, 'access_writing', 'Writing', 'W', student.access_writing)}
                                ${renderModuleBadge(student.id, 'access_speaking', 'Speaking', 'S', student.access_speaking)}
                                ${renderModuleBadge(student.id, 'access_tests', 'Mock Tests', 'Tests', student.access_tests)}
                            </div>
                        </div>
                    </div>

                    <!-- НИЖНЯЯ ЧАСТЬ: КНОПКА ПЕРЕХОДА -->
                    <div class="pt-2 flex items-center justify-end">
                        <a href="student-profile.html?id=${student.id}" class="inline-flex items-center space-x-1.5 px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-xl transition shadow-xs cursor-pointer">
                            <span>Карточка ученика</span>
                            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                        </a>
                    </div>
                `;
                
                grid.appendChild(card);
            });

            lucide.createIcons();
        }

        function renderModuleBadge(studentId, field, fullName, label, isEnabled) {
            return `
                <button title="${fullName}: ${isEnabled ? 'Доступен' : 'Закрыт'}" 
                        onclick="toggleModuleAccess('${studentId}', '${field}', ${isEnabled})" 
                        class="py-1.5 px-1 rounded-xl text-[10px] font-extrabold border text-center transition cursor-pointer select-none ${
                            isEnabled 
                            ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs' 
                            : 'bg-white text-gray-400 border-gray-200 hover:border-gray-300'
                        }">
                    ${label}
                </button>
            `;
        }

        // ЗАГРУЗКА И РЕНДЕР КАЛЕНДАРЯ
        async function loadLessons() {
            // Подтягиваем уроки из БД (ожидаем таблицу lessons)
            const { data: lessons, error } = await _supabase
                .from('lessons')
                .select('*, profiles(full_name, email)')
                .order('lesson_date', { ascending: true });

            const list = document.getElementById('lessonsList');
            list.innerHTML = '';

            if (error || !lessons || lessons.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-10 bg-slate-50 rounded-2xl border border-dashed border-gray-200">
                        <i data-lucide="calendar-x" class="w-8 h-8 text-gray-300 mx-auto mb-2"></i>
                        <p class="text-sm font-bold text-gray-500">Нет запланированных уроков</p>
                        <p class="text-xs text-gray-400 mt-1">Добавьте уроки для учеников, чтобы они появились здесь</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // Рендер списка уроков
            lessons.forEach(lesson => {
                const dateObj = new Date(lesson.lesson_date);
                const dateStr = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
                const timeStr = dateObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute:'2-digit' });
                
                const studentName = lesson.profiles?.full_name || lesson.profiles?.email || 'Неизвестный ученик';
                
                // Цвета секций (Writing, Speaking и тд)
                const sectionColors = {
                    'Reading': 'bg-blue-50 text-blue-700 border-blue-100',
                    'Listening': 'bg-emerald-50 text-emerald-700 border-emerald-100',
                    'Speaking': 'bg-amber-50 text-amber-700 border-amber-100',
                    'Writing': 'bg-purple-50 text-purple-700 border-purple-100',
                    'Mock Test': 'bg-rose-50 text-rose-700 border-rose-100'
                };
                const badgeClass = sectionColors[lesson.section] || 'bg-gray-100 text-gray-600 border-gray-200';

                const el = document.createElement('div');
                el.className = "flex items-center justify-between p-4 bg-white border border-gray-100 rounded-2xl hover:border-indigo-100 hover:shadow-xs transition";
                el.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <div class="flex flex-col items-center justify-center w-14 h-14 bg-indigo-50 rounded-xl border border-indigo-100 shrink-0">
                            <span class="text-xs text-indigo-500 font-bold uppercase">${dateObj.toLocaleDateString('ru-RU', { weekday: 'short' })}</span>
                            <span class="text-lg font-extrabold text-indigo-700 leading-none">${dateObj.getDate()}</span>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-slate-900">${studentName}</h4>
                            <div class="flex items-center space-x-2 mt-1">
                                <span class="text-xs text-gray-500 flex items-center space-x-1">
                                    <i data-lucide="clock" class="w-3 h-3"></i>
                                    <span>${timeStr}</span>
                                </span>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${badgeClass}">
                                    ${lesson.section || 'General'}
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-medium text-slate-700">${lesson.topic || 'Тема не указана'}</p>
                        <p class="text-[10px] text-gray-400 mt-0.5">Домашка: ${lesson.homework ? 'Выдана' : 'Нет'}</p>
                    </div>
                `;
                list.appendChild(el);
            });
            
            lucide.createIcons();
        }

        // Поиск по студентам
        document.getElementById('searchInput').addEventListener('input', () => {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allStudents.filter(s => {
                const searchStr = `${s.email || ''} ${s.full_name || ''}`.toLowerCase();
                return searchStr.includes(term);
            });
            renderStudents(filtered);
        });

        // Toggle functions (как и были, без изменений)
        async function toggleStudentApproval(studentId, currentStatus) {
            const newStatus = !currentStatus;
            const student = allStudents.find(s => s.id === studentId);
            if (student) student.is_approved = newStatus;
            
            updateStats();
            // Обновляем UI без сброса поиска
            document.getElementById('searchInput').dispatchEvent(new Event('input'));

            const { error } = await _supabase.from('profiles').update({ is_approved: newStatus }).eq('id', studentId);
            if (error) alert("Не удалось изменить статус");
        }

        async function toggleModuleAccess(studentId, field, currentValue) {
            const newValue = !currentValue;
            const student = allStudents.find(s => s.id === studentId);
            if (student) student[field] = newValue;
            
            document.getElementById('searchInput').dispatchEvent(new Event('input'));

            const { error } = await _supabase.from('profiles').update({ [field]: newValue }).eq('id', studentId);
            if (error) alert("Не удалось изменить настройки");
        }
    </script>
</body>
</html>
