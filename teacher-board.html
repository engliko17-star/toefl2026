<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ученики и Календарь — TOEFL CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="review-inbox.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <!-- БОКОВОЕ МЕНЮ -->
    <div id="app-sidebar"></div>
    <script src="nav.js"></script>

    <main class="flex-1 p-6 lg:p-10 overflow-y-auto">
        <!-- ШАПКА -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Панель преподавателя</h1>
                <p class="text-xs text-gray-400 mt-1">Управление доступами, классификация и расписание</p>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="relative w-full sm:w-72" id="searchContainer">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                    <input type="text" id="searchInput" placeholder="Поиск учеников..." class="w-full pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-100 transition shadow-sm">
                </div>
            </div>
        </div>

        <!-- ВКЛАДКИ -->
        <div class="flex space-x-6 border-b border-gray-200 mb-8 overflow-x-auto whitespace-nowrap">
            <button onclick="switchTab('students')" id="tab-students" class="pb-3 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 transition flex items-center space-x-2 cursor-pointer">
                <i data-lucide="users" class="w-4 h-4"></i>
                <span>Доступы и Ученики</span>
            </button>
            <button onclick="switchTab('calendar')" id="tab-calendar" class="pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-slate-700 transition flex items-center space-x-2 cursor-pointer">
                <i data-lucide="calendar-days" class="w-4 h-4"></i>
                <span>Календарь экзаменов</span>
            </button>
            <button onclick="switchTab('review')" id="tab-review" class="pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-slate-700 transition flex items-center space-x-2 cursor-pointer">
                <i data-lucide="inbox" class="w-4 h-4"></i>
                <span>На проверку</span>
                <span id="reviewBadge" class="hidden min-w-[20px] h-5 px-1.5 rounded-full bg-rose-500 text-white text-[10px] font-extrabold items-center justify-center">0</span>
            </button>
        </div>

        <!-- ========================================== -->
        <!-- РАЗДЕЛ 1: УЧЕНИКИ И ДОСТУПЫ (STUDENTS VIEW) -->
        <!-- ========================================== -->
        <div id="studentsView" class="block">
            
            <!-- ПАПКИ КЛАССИФИКАЦИИ -->
            <div class="flex flex-wrap gap-2 items-center justify-between mb-6">
                <div class="flex p-1 bg-gray-100 rounded-xl space-x-1 max-w-full overflow-x-auto">
                    <button id="btn-in_progress" onclick="setFolder('in_progress')" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-white shadow-sm text-slate-800 transition cursor-pointer whitespace-nowrap shrink-0">
                        В процессе
                    </button>
                    <button id="btn-passed" onclick="setFolder('passed')" class="px-4 py-1.5 text-xs font-bold rounded-lg text-gray-500 hover:text-slate-700 transition cursor-pointer whitespace-nowrap shrink-0">
                        Сдали
                    </button>
                    <button id="btn-paused" onclick="setFolder('paused')" class="px-4 py-1.5 text-xs font-bold rounded-lg text-gray-500 hover:text-slate-700 transition cursor-pointer whitespace-nowrap shrink-0">
                        Пауза
                    </button>
                    <button id="btn-dropped" onclick="setFolder('dropped')" class="px-4 py-1.5 text-xs font-bold rounded-lg text-gray-500 hover:text-slate-700 transition cursor-pointer whitespace-nowrap shrink-0">
                        Отмена
                    </button>
                    <button id="btn-guests" onclick="setFolder('guests')" class="px-4 py-1.5 text-xs font-bold rounded-lg text-gray-500 hover:text-slate-700 transition cursor-pointer whitespace-nowrap shrink-0">
                        Гости <span id="guestCount" class="text-gray-400"></span>
                    </button>
                </div>
            </div>

            <!-- СТАТИСТИЧЕСКИЕ ПЛИТКИ -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex items-center space-x-3">
                    <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl"><i data-lucide="users" class="w-5 h-5"></i></div>
                    <div>
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider" id="statLabelTotal">Учеников в процессе</span>
                        <div id="statTotal" class="text-lg font-extrabold text-slate-900">0</div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex items-center space-x-3">
                    <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
                    <div>
                        <span id="statLabelActive" class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Активные доступы</span>
                        <div id="statActive" class="text-lg font-extrabold text-slate-900">0</div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex items-center space-x-3">
                    <div class="p-3 bg-amber-50 text-amber-600 rounded-xl"><i data-lucide="clock" class="w-5 h-5"></i></div>
                    <div>
                        <span id="statLabelPending" class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Ожидают доступа</span>
                        <div id="statPending" class="text-lg font-extrabold text-slate-900">0</div>
                    </div>
                </div>
            </div>

            <!-- КАРТОЧКА СРЕДНЕГО БАЛЛА (Отображается только в папке "Сдали") -->
            <div id="averageStatsCard" class="hidden mb-8 bg-slate-900 rounded-3xl p-6 text-white shadow-lg flex-col md:flex-row justify-between items-center gap-6 border border-slate-800">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-indigo-500/20 rounded-2xl flex items-center justify-center border border-indigo-500/30">
                        <i data-lucide="trophy" class="w-7 h-7 text-indigo-400"></i>
                    </div>
                    <div>
                        <p class="text-slate-400 text-[11px] font-bold uppercase tracking-widest mb-1">Средний балл выпускников</p>
                        <div class="text-3xl font-extrabold flex items-baseline gap-1">
                            <span id="avgTotalText">0.0</span>
                            <span class="text-sm font-medium text-slate-500">/ 6.0</span>
                        </div>
                    </div>
                </div>
                
                <div class="flex gap-2 sm:gap-4 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                    <div class="bg-slate-800/50 px-4 py-3 rounded-2xl border border-slate-700/50 min-w-[70px] text-center">
                        <div class="text-slate-400 text-[10px] font-bold mb-1">READING</div>
                        <div class="text-lg font-bold" id="avgRText">-</div>
                    </div>
                    <div class="bg-slate-800/50 px-4 py-3 rounded-2xl border border-slate-700/50 min-w-[70px] text-center">
                        <div class="text-slate-400 text-[10px] font-bold mb-1">LISTENING</div>
                        <div class="text-lg font-bold" id="avgLText">-</div>
                    </div>
                    <div class="bg-slate-800/50 px-4 py-3 rounded-2xl border border-slate-700/50 min-w-[70px] text-center">
                        <div class="text-slate-400 text-[10px] font-bold mb-1">WRITING</div>
                        <div class="text-lg font-bold" id="avgWText">-</div>
                    </div>
                    <div class="bg-slate-800/50 px-4 py-3 rounded-2xl border border-slate-700/50 min-w-[70px] text-center">
                        <div class="text-slate-400 text-[10px] font-bold mb-1">SPEAKING</div>
                        <div class="text-lg font-bold" id="avgSText">-</div>
                    </div>
                </div>
            </div>

            <!-- СЕТКА КАРТОЧЕК СТУДЕНТОВ -->
            <div id="studentsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-12 text-gray-400 text-sm">
                    Загрузка списка учеников...
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- РАЗДЕЛ 2: КАЛЕНДАРЬ ЭКЗАМЕНОВ (CALENDAR VIEW) -->
        <!-- ========================================== -->
        <div id="calendarView" class="hidden">
            <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6 h-auto min-h-[60vh] flex flex-col">
                
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded-xl transition cursor-pointer">
                        <i data-lucide="chevron-left" class="w-5 h-5 text-slate-600"></i>
                    </button>
                    <h2 id="calendarMonthYear" class="text-xl font-bold text-slate-900 uppercase tracking-wide"></h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded-xl transition cursor-pointer">
                        <i data-lucide="chevron-right" class="w-5 h-5 text-slate-600"></i>
                    </button>
                </div>
                
                <div class="grid grid-cols-7 gap-2 text-center mb-2">
                    <div class="text-xs font-bold text-gray-400 uppercase">Пн</div>
                    <div class="text-xs font-bold text-gray-400 uppercase">Вт</div>
                    <div class="text-xs font-bold text-gray-400 uppercase">Ср</div>
                    <div class="text-xs font-bold text-gray-400 uppercase">Чт</div>
                    <div class="text-xs font-bold text-gray-400 uppercase">Пт</div>
                    <div class="text-xs font-bold text-rose-400 uppercase">Сб</div>
                    <div class="text-xs font-bold text-rose-400 uppercase">Вс</div>
                </div>

                <div id="calendarGrid" class="grid grid-cols-7 gap-2 flex-1">
                    <!-- Рендерится через JS -->
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- РАЗДЕЛ 3: НА ПРОВЕРКУ (review-inbox.js)     -->
        <!-- ========================================== -->
        <div id="reviewView" class="hidden">
            <!-- Карточка Telegram: подключение уведомлений -->
            <div id="tgCard"></div>

            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div id="reviewFilters" class="flex p-1 bg-gray-100 rounded-xl space-x-1"></div>
                <div class="flex items-center gap-2">
                    <select id="reviewPeriod" class="text-xs font-bold text-slate-600 bg-white border border-gray-200 rounded-xl px-3 py-2 outline-none cursor-pointer">
                        <option value="all">За всё время</option>
                        <option value="30">За 30 дней</option>
                        <option value="7">За 7 дней</option>
                    </select>
                    <button type="button" data-tg="refresh" title="Обновить" class="p-2 bg-white border border-gray-200 rounded-xl text-gray-500 hover:text-slate-800 transition cursor-pointer">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div id="reviewList" class="space-y-3"></div>
        </div>

    </main>

    <script>
        let allStudents = [];
        let currentFolder = 'in_progress';
        let currentDate = new Date();

        // Экранирование текста, который вводят ученики (эссе, имена, баллы). Без него
        // ученица могла вписать в эссе или в имя HTML-код, и он выполнялся в браузере
        // преподавателя — с правами преподавателя.
        function tbEsc(s) {
            return String(s === null || s === undefined ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function parseScore(val) {
            if (val === null || val === undefined || val === '') return null;
            if (typeof val === 'string') {
                const parsed = Number(val.replace(',', '.'));
                return isNaN(parsed) ? null : parsed;
            }
            return isNaN(val) ? null : Number(val);
        }

        function getField(obj, keys) {
            for (let key of keys) {
                if (obj[key] !== undefined && obj[key] !== null && obj[key] !== '') {
                    return parseScore(obj[key]);
                }
            }
            return null;
        }

        window.onload = async () => {
            const user = await requireAuth();
            if (!user) return;
            
            if (user.role !== 'teacher') {
                window.location.href = 'index.html';
                return;
            }

            await loadStudents();
            lucide.createIcons();

            // «На проверку»: число работ на вкладке видно сразу (review-inbox.js)
            if (window.ReviewInbox) ReviewInbox.init({ teacherId: user.id, students: () => allStudents });
            // Ссылка из Telegram и кнопка «Назад» из проверки ведут сюда: teacher-board.html?tab=review
            const startTab = new URLSearchParams(location.search).get('tab');
            if (startTab === 'review' || startTab === 'calendar') switchTab(startTab);
        };

        function switchTab(tab) {
            const on = "pb-3 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 transition flex items-center space-x-2 cursor-pointer";
            const off = "pb-3 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-slate-700 transition flex items-center space-x-2 cursor-pointer";
            const views = { students: 'studentsView', calendar: 'calendarView', review: 'reviewView' };
            if (!views[tab]) tab = 'students';
            Object.keys(views).forEach(name => {
                const btn = document.getElementById('tab-' + name);
                const view = document.getElementById(views[name]);
                if (btn) btn.className = name === tab ? on : off;
                if (view) view.classList.toggle('hidden', name !== tab);
            });
            // На телефоне ряд вкладок прокручивается — выбранная должна быть видна
            const activeBtn = document.getElementById('tab-' + tab);
            if (activeBtn && activeBtn.parentElement.scrollWidth > activeBtn.parentElement.clientWidth) {
                activeBtn.parentElement.scrollLeft = activeBtn.offsetLeft - activeBtn.parentElement.offsetLeft - 16;
            }
            // Поиск учеников нужен только на первой вкладке
            document.getElementById('searchContainer').classList.toggle('hidden', tab !== 'students');
            if (tab === 'calendar') renderCalendar();
            if (tab === 'review' && window.ReviewInbox) ReviewInbox.show();
        }

        function setFolder(folder) {
            currentFolder = folder;
            
            const buttons = ['in_progress', 'passed', 'paused', 'dropped', 'guests'];
            buttons.forEach(b => {
                const btn = document.getElementById(`btn-${b}`);
                if (b === folder) {
                    btn.className = "px-4 py-1.5 text-xs font-bold rounded-lg bg-white shadow-sm text-slate-800 transition cursor-pointer whitespace-nowrap shrink-0";
                } else {
                    btn.className = "px-4 py-1.5 text-xs font-bold rounded-lg text-gray-500 hover:text-slate-700 transition cursor-pointer whitespace-nowrap shrink-0";
                }
            });

            const labels = {
                'in_progress': 'Учеников в процессе',
                'passed': 'Учеников сдали',
                'paused': 'Учеников на паузе',
                'dropped': 'Отменили занятия',
                'guests': 'Гостей (бесплатная версия)'
            };
            document.getElementById('statLabelTotal').innerText = labels[folder];
            document.getElementById('statLabelActive').innerText = folder === 'guests' ? 'Прошли пробный тест' : 'Активные доступы';
            document.getElementById('statLabelPending').innerText = folder === 'guests' ? 'Оставили Telegram' : 'Ожидают доступа';

            document.getElementById('searchInput').dispatchEvent(new Event('input'));
        }

        async function loadStudents() {
            const { data: students, error } = await _supabase
                .from('profiles')
                .select('*')
                .in('role', ['student', 'guest']);   // гости — в своей папке

            if (error) {
                console.error("Ошибка загрузки учеников:", error);
                document.getElementById('studentsGrid').innerHTML = `<div class="text-rose-500 col-span-full text-center py-10">Ошибка загрузки данных.</div>`;
                return;
            }

            allStudents = students || [];
            
            allStudents.forEach(s => {
                if (!s.status) s.status = 'in_progress';
            });
            // Новые гости — сверху
            allStudents.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
            const nGuests = allStudents.filter(s => s.role === 'guest').length;
            document.getElementById('guestCount').innerText = nGuests ? nGuests : '';

            document.getElementById('searchInput').dispatchEvent(new Event('input'));
        }

        function updateStats(filteredStudents) {
            document.getElementById('statTotal').innerText = filteredStudents.length;
            if (currentFolder === 'guests') {
                document.getElementById('statActive').innerText = filteredStudents.filter(s => s.guest_completed_demo).length;
                document.getElementById('statPending').innerText = filteredStudents.filter(s => String(s.guest_telegram || '').trim()).length;
                updateAverageStats(filteredStudents);
                return;
            }
            document.getElementById('statActive').innerText = filteredStudents.filter(s => s.is_approved).length;
            document.getElementById('statPending').innerText = filteredStudents.filter(s => !s.is_approved).length;
            
            updateAverageStats(filteredStudents);
        }

        function updateAverageStats(filteredStudents) {
            const statsCard = document.getElementById('averageStatsCard');
            
            if (currentFolder !== 'passed') {
                statsCard.classList.add('hidden');
                statsCard.classList.remove('flex', 'flex-col', 'md:flex-row');
                return;
            }

            const passedStudents = filteredStudents ? filteredStudents.filter(s => s.status === 'passed') : allStudents.filter(s => s.status === 'passed');
            
            if (passedStudents.length === 0) {
                statsCard.classList.add('hidden');
                statsCard.classList.remove('flex', 'flex-col', 'md:flex-row');
                return;
            }

            statsCard.classList.remove('hidden');
            statsCard.classList.add('flex', 'flex-col', 'md:flex-row');

            let totalScore = 0, totalR = 0, totalL = 0, totalW = 0, totalS = 0;
            let countTotal = 0, countR = 0, countL = 0, countW = 0, countS = 0;

            passedStudents.forEach(s => {
                // Добавлены ключи из БД: ibt_r, ibt_l, ibt_w, ibt_s
                const fTotal = getField(s, ['ibt_total', 'result_score', 'final_toefl_score', 'final_score', 'real_score']);
                const fR = getField(s, ['ibt_r', 'result_r', 'final_r', 'real_r']);
                const fL = getField(s, ['ibt_l', 'result_l', 'final_l', 'real_l']);
                const fW = getField(s, ['ibt_w', 'result_w', 'final_w', 'real_w']);
                const fS = getField(s, ['ibt_s', 'result_s', 'final_s', 'real_s']);

                let calculatedTotal = fTotal;

                if (calculatedTotal === null && fR !== null && fL !== null && fW !== null && fS !== null) {
                    calculatedTotal = (fR + fL + fW + fS) / 4;
                }

                if (calculatedTotal !== null && calculatedTotal > 0) { totalScore += calculatedTotal; countTotal++; }
                if (fR !== null && fR > 0) { totalR += fR; countR++; }
                if (fL !== null && fL > 0) { totalL += fL; countL++; }
                if (fW !== null && fW > 0) { totalW += fW; countW++; }
                if (fS !== null && fS > 0) { totalS += fS; countS++; }
            });

            document.getElementById('avgTotalText').innerText = countTotal > 0 ? (Math.round((totalScore / countTotal) * 2) / 2).toFixed(1) : '-';
            document.getElementById('avgRText').innerText = countR > 0 ? (Math.round((totalR / countR) * 2) / 2).toFixed(1) : '-';
            document.getElementById('avgLText').innerText = countL > 0 ? (Math.round((totalL / countL) * 2) / 2).toFixed(1) : '-';
            document.getElementById('avgWText').innerText = countW > 0 ? (Math.round((totalW / countW) * 2) / 2).toFixed(1) : '-';
            document.getElementById('avgSText').innerText = countS > 0 ? (Math.round((totalS / countS) * 2) / 2).toFixed(1) : '-';
        }

        function renderStudents(studentsToRender) {
            const grid = document.getElementById('studentsGrid');
            grid.innerHTML = '';

            if (studentsToRender.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-white rounded-2xl p-10 text-center border border-gray-100 shadow-sm">
                        <i data-lucide="folder-open" class="w-10 h-10 text-gray-300 mx-auto mb-3"></i>
                        <h3 class="text-sm font-bold text-slate-700">В этой папке пусто</h3>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            studentsToRender.forEach(student => {
                if (student.role === 'guest') { grid.appendChild(guestCard(student)); return; }
                const displayName = student.full_name || student.name || (student.email ? student.email.split('@')[0] : 'Без имени');
                const initial = displayName.charAt(0).toUpperCase();

                const examDate = student.exam_date ? new Date(student.exam_date).toLocaleDateString('ru-RU') : 'Не назначено';
                
                let targetScore = student.target_score;
                if (!targetScore && (student.target_r || student.target_l || student.target_w || student.target_s)) {
                    let sum = (Number(student.target_r) || 0) + (Number(student.target_l) || 0) + (Number(student.target_w) || 0) + (Number(student.target_s) || 0);
                    targetScore = (Math.round((sum / 4) * 2) / 2).toFixed(1);
                }
                // Значения из профиля — только как текст (ученица может менять свой профиль)
                const displayTarget = targetScore ? `${tbEsc(targetScore)} / 6.0` : 'TBD';

                // Добавлены ключи из БД: ibt_r, ibt_l, ibt_w, ibt_s
                let fTotalDisp = getField(student, ['ibt_total', 'result_score', 'final_toefl_score', 'final_score', 'real_score']);
                if (fTotalDisp === null) {
                    const fR = getField(student, ['ibt_r', 'result_r', 'final_r', 'real_r']);
                    const fL = getField(student, ['ibt_l', 'result_l', 'final_l', 'real_l']);
                    const fW = getField(student, ['ibt_w', 'result_w', 'final_w', 'real_w']);
                    const fS = getField(student, ['ibt_s', 'result_s', 'final_s', 'real_s']);
                    if (fR !== null && fL !== null && fW !== null && fS !== null) {
                        fTotalDisp = (Math.round(((fR + fL + fW + fS) / 4) * 2) / 2).toFixed(1);
                    }
                }

                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-3xl border border-gray-100 shadow-sm hover:shadow-md hover:border-indigo-100 transition flex flex-col justify-between space-y-4 relative";
                
                // Бейджик отображается только если статус "Сдал(а)" и баллы больше 0
                const finalScoreHtml = (student.status === 'passed' && fTotalDisp !== null && fTotalDisp > 0) 
                    ? `<div class="px-2 py-1 bg-emerald-50 text-emerald-700 rounded-lg text-[10px] font-bold flex items-center space-x-1 border border-emerald-100">
                           <i data-lucide="award" class="w-3 h-3"></i>
                           <span>Итог: ${tbEsc(fTotalDisp)} / 6.0</span>
                       </div>` 
                    : '';

                card.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex justify-between items-start gap-2">
                            <div class="flex items-center space-x-3 min-w-0">
                                <div class="w-11 h-11 rounded-2xl bg-indigo-50 text-indigo-600 font-extrabold flex items-center justify-center text-base border border-indigo-100 shrink-0 shadow-sm">
                                    ${tbEsc(initial)}
                                </div>
                                <div class="min-w-0 flex flex-col items-start">
                                    <h3 class="text-sm font-bold text-slate-900 truncate w-full" title="${tbEsc(displayName)}">${tbEsc(displayName)}</h3>
                                    
                                    <select onchange="updateStudentStatus('${student.id}', this.value)" class="mt-1 text-[10px] font-medium bg-slate-50 border border-slate-200 text-slate-600 rounded-md px-1.5 py-0.5 outline-none cursor-pointer">
                                        <option value="in_progress" ${student.status === 'in_progress' ? 'selected' : ''}>⏳ В процессе</option>
                                        <option value="passed" ${student.status === 'passed' ? 'selected' : ''}>✅ Сдал(а)</option>
                                        <option value="paused" ${student.status === 'paused' ? 'selected' : ''}>⏸️ Пауза</option>
                                        <option value="dropped" ${student.status === 'dropped' ? 'selected' : ''}>❌ Отмена</option>
                                    </select>
                                </div>
                            </div>

                            <button onclick="toggleStudentApproval('${student.id}', ${student.is_approved})" 
                                class="px-2.5 py-1 rounded-xl text-[10px] font-bold border transition cursor-pointer shrink-0 flex items-center space-x-1 ${
                                    student.is_approved ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100' : 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'
                                }">
                                <span class="w-1.5 h-1.5 rounded-full ${student.is_approved ? 'bg-emerald-500' : 'bg-amber-500'}"></span>
                                <span>${student.is_approved ? 'Активен' : 'В очереди'}</span>
                            </button>
                        </div>

                        <div class="flex flex-wrap gap-2">
                            <div class="px-2 py-1 bg-purple-50 text-purple-700 rounded-lg text-[10px] font-bold flex items-center space-x-1 border border-purple-100">
                                <i data-lucide="calendar-check" class="w-3 h-3"></i>
                                <span>Экзамен: ${tbEsc(examDate)}</span>
                            </div>
                            <div class="px-2 py-1 bg-blue-50 text-blue-700 rounded-lg text-[10px] font-bold flex items-center space-x-1 border border-blue-100">
                                <i data-lucide="target" class="w-3 h-3"></i>
                                <span>Цель: ${displayTarget}</span>
                            </div>
                            ${finalScoreHtml}
                        </div>

                        <div class="bg-slate-50/70 p-3 rounded-2xl border border-gray-100/80 space-y-2">
                            <div class="grid grid-cols-5 gap-1.5 pt-0.5">
                                ${renderModuleBadge(student.id, 'access_reading', 'Reading', 'R', student.access_reading)}
                                ${renderModuleBadge(student.id, 'access_listening', 'Listening', 'L', student.access_listening)}
                                ${renderModuleBadge(student.id, 'access_writing', 'Writing', 'W', student.access_writing)}
                                ${renderModuleBadge(student.id, 'access_speaking', 'Speaking', 'S', student.access_speaking)}
                                ${renderModuleBadge(student.id, 'access_tests', 'Mock Tests', 'Tests', student.access_tests)}
                            </div>
                        </div>
                    </div>

                    <div class="pt-2 flex items-center justify-end">
                        <a href="student-profile.html?id=${student.id}" class="inline-flex items-center space-x-1.5 px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-xl transition shadow-sm cursor-pointer">
                            <span>Карточка ученика</span>
                            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                        </a>
                    </div>
                `;
                
                grid.appendChild(card);
            });

            lucide.createIcons();
        }

        // ---------- Гости (бесплатная версия) ----------
        function tgLink(handle) {
            const h = String(handle || '').trim().replace(/^https?:\/\/t\.me\//i, '').replace(/^@/, '');
            return /^[A-Za-z0-9_]{3,32}$/.test(h) ? 'https://t.me/' + h : null;
        }
        function guestCard(g) {
            const name = g.full_name || g.guest_name || (g.email ? g.email.split('@')[0] : 'Гость без имени');
            const since = g.created_at ? new Date(g.created_at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) : '';
            const tg = String(g.guest_telegram || '').trim();
            const tgUrl = tgLink(tg);
            const card = document.createElement('div');
            card.className = 'bg-white p-6 rounded-3xl border border-gray-100 shadow-sm flex flex-col justify-between gap-4';
            card.innerHTML = `
                <div class="space-y-3">
                    <div class="flex items-start gap-3">
                        <div class="w-11 h-11 rounded-2xl bg-amber-50 text-amber-600 font-extrabold flex items-center justify-center text-base border border-amber-100 shrink-0">${tbEsc(name.charAt(0).toUpperCase())}</div>
                        <div class="min-w-0">
                            <h3 class="text-sm font-bold text-slate-900 truncate" title="${tbEsc(name)}">${tbEsc(name)}</h3>
                            <p class="text-xs text-gray-500 truncate">${tbEsc(g.email || 'без почты (старый вход «гость»)')}</p>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2 text-[10px] font-bold">
                        ${since ? `<span class="px-2 py-1 bg-gray-50 text-gray-500 rounded-lg border border-gray-100">С ${tbEsc(since)}</span>` : ''}
                        <span class="px-2 py-1 rounded-lg border ${g.guest_completed_demo ? 'bg-emerald-50 text-emerald-700 border-emerald-100' : 'bg-gray-50 text-gray-500 border-gray-100'}">
                            ${g.guest_completed_demo ? 'Пробный тест пройден' : 'Пробный тест не пройден'}</span>
                        ${tg ? (tgUrl ? `<a href="${tgUrl}" target="_blank" rel="noopener" class="px-2 py-1 bg-sky-50 text-sky-700 rounded-lg border border-sky-100 hover:bg-sky-100">${tbEsc(tg)}</a>`
                                      : `<span class="px-2 py-1 bg-sky-50 text-sky-700 rounded-lg border border-sky-100">${tbEsc(tg)}</span>`) : ''}
                    </div>
                </div>
                <div class="flex flex-wrap items-center justify-end gap-2 pt-1">
                    <a href="student-profile.html?id=${encodeURIComponent(g.id)}" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-slate-700 text-xs font-semibold rounded-xl transition">Карточка</a>
                    <button type="button" onclick="makeStudent('${g.id}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition cursor-pointer">Сделать ученицей</button>
                </div>`;
            return card;
        }

        // Гость → ученица: подтверждена, все разделы открыты (лишние можно закрыть на карточке)
        async function makeStudent(id) {
            const g = allStudents.find(s => s.id === id);
            if (!g) return;
            const name = g.full_name || g.email || 'гостя';
            if (!confirm(`Перевести «${name}» в ученицы? Откроются все разделы — лишние потом можно закрыть на карточке.`)) return;
            const patch = { role: 'student', is_approved: true, status: 'in_progress',
                            access_reading: true, access_listening: true, access_writing: true, access_speaking: true, access_tests: true };
            const { error } = await _supabase.from('profiles').update(patch).eq('id', id);
            if (error) { console.error('Не удалось перевести в ученицы:', error); alert('Не удалось перевести в ученицы: ' + (error.message || error)); return; }
            Object.assign(g, patch);
            const nGuests = allStudents.filter(s => s.role === 'guest').length;
            document.getElementById('guestCount').innerText = nGuests ? nGuests : '';
            document.getElementById('searchInput').dispatchEvent(new Event('input'));
        }

        function renderModuleBadge(studentId, field, fullName, label, isEnabled) {
            return `
                <button title="${fullName}: ${isEnabled ? 'Доступен' : 'Закрыт'}" 
                        onclick="toggleModuleAccess('${studentId}', '${field}', ${isEnabled})" 
                        class="py-1.5 px-1 rounded-xl text-[10px] font-extrabold border text-center transition cursor-pointer select-none ${
                            isEnabled ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-gray-400 border-gray-200 hover:border-gray-300'
                        }">
                    ${label}
                </button>
            `;
        }

        function changeMonth(step) {
            currentDate.setMonth(currentDate.getMonth() + step);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            document.getElementById('calendarMonthYear').innerText = `${monthNames[month]} ${year}`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            let firstDay = new Date(year, month, 1).getDay();
            firstDay = firstDay === 0 ? 6 : firstDay - 1; 
            
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="bg-gray-50/50 rounded-xl border border-transparent"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                const studentsWithExam = allStudents.filter(s => {
                    if (!s.exam_date) return false;
                    return s.exam_date.startsWith(dateString);
                });

                let badgesHtml = '';
                studentsWithExam.forEach(s => {
                    const name = s.full_name || s.name || (s.email ? s.email.split('@')[0] : 'Ученик');
                    badgesHtml += `
                        <div class="mt-1 px-1.5 py-0.5 bg-purple-100 border border-purple-200 text-purple-700 text-[9px] font-bold rounded shadow-sm truncate w-full text-center" title="${tbEsc(name)}">
                            ${tbEsc(name)}
                        </div>
                    `;
                });

                const isToday = new Date().toDateString() === new Date(year, month, day).toDateString();
                const todayClass = isToday ? 'ring-2 ring-indigo-500 bg-indigo-50/30' : 'bg-white hover:bg-gray-50';

                grid.innerHTML += `
                    <div class="min-h-[80px] p-2 rounded-xl border border-gray-100 flex flex-col items-center transition ${todayClass}">
                        <span class="text-sm font-bold ${isToday ? 'text-indigo-600' : 'text-slate-700'}">${day}</span>
                        <div class="w-full flex flex-col gap-1 mt-1">
                            ${badgesHtml}
                        </div>
                    </div>
                `;
            }
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filtered = allStudents.filter(s => {
                const matchesFolder = currentFolder === 'guests' ? s.role === 'guest' : (s.role !== 'guest' && s.status === currentFolder);
                const searchStr = `${s.email || ''} ${s.full_name || ''}`.toLowerCase();
                const matchesSearch = searchStr.includes(term);
                return matchesFolder && matchesSearch;
            });
            
            updateStats(filtered);
            renderStudents(filtered);
        });

        async function updateStudentStatus(studentId, newStatus) {
            const student = allStudents.find(s => s.id === studentId);
            if (student) {
                student.status = newStatus;
                document.getElementById('searchInput').dispatchEvent(new Event('input'));
            }

            const { error } = await _supabase
                .from('profiles')
                .update({ status: newStatus })
                .eq('id', studentId);

            if (error) {
                console.error("Ошибка при смене статуса:", error);
                alert("Не удалось изменить статус. Проверьте права и подключение к Supabase.");
            }
        }

        async function toggleStudentApproval(studentId, currentStatus) {
            const newStatus = !currentStatus;
            const student = allStudents.find(s => s.id === studentId);
            if (student) student.is_approved = newStatus;
            
            document.getElementById('searchInput').dispatchEvent(new Event('input'));

            const { error } = await _supabase.from('profiles').update({ is_approved: newStatus }).eq('id', studentId);
            if (error) alert("Не удалось изменить статус");
        }

        async function toggleModuleAccess(studentId, field, currentValue) {
            const newValue = !currentValue;
            const student = allStudents.find(s => s.id === studentId);
            if (student) student[field] = newValue;
            
            document.getElementById('searchInput').dispatchEvent(new Event('input'));

            const { error } = await _supabase.from('profiles').update({ [field]: newValue }).eq('id', studentId);
            if (error) alert("Не удалось изменить настройки");
        }
    </script>
</body>
</html>
