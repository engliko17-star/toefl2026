<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Task</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</head>
<body class="bg-[#f8f9fa] p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-6" id="categoryTitle">Tasks</h1>
        <div id="taskList" class="grid gap-4">
            </div>
    </div>

    <script>
        const category = new URLSearchParams(window.location.search).get('category');
        document.getElementById('categoryTitle').innerText = category.toUpperCase() + " TASKS";

        async function loadTasks() {
            const { data: tasks, error } = await supabase
                .from('writing_tasks')
                .select('id, title')
                .eq('category', category);

            const list = document.getElementById('taskList');
            tasks.forEach(task => {
                list.innerHTML += `
                    <a href="writing-practice.html?id=${task.id}&type=${category}" 
                       class="block bg-white p-6 rounded-2xl border border-gray-200 hover:border-slate-900 transition shadow-sm">
                        <h2 class="font-bold">${task.title}</h2>
                        <p class="text-xs text-gray-400">Click to start practicing</p>
                    </a>
                `;
            });
        }
        loadTasks();
    </script>
</body>
</html>
