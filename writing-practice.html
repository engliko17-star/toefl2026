<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing Practice Engine — TOEFL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        .sortable-ghost { opacity: 0.2; background-color: #f1f5f9; border: 2px dashed #94a3b8; color: transparent; }
        .sortable-drag { cursor: grabbing !important; transform: scale(1.03); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        
        .word-slot { min-width: 90px; min-height: 40px; transition: all 0.2s; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-900 min-h-screen flex flex-col antialiased">

    <header class="bg-white px-6 py-4 flex items-center justify-between border-b border-gray-100 shrink-0 sticky top-0 z-10 shadow-sm">
        <div class="flex items-center space-x-4">
            <a id="backBtn" href="writing.html" class="flex items-center justify-center w-10 h-10 rounded-xl border border-gray-200 text-gray-500 hover:bg-gray-50 hover:text-slate-800 transition">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="text-sm font-bold text-slate-900" id="taskTitle">Loading Task...</h1>
                <p class="text-[11px] font-bold text-gray-400 mt-0.5 uppercase tracking-wider" id="questionProgress">Question — of —</p>
            </div>
        </div>
        
        <button onclick="handleSubmitResponse()" class="bg-slate-900 text-white text-sm font-bold px-5 py-2.5 rounded-xl hover:bg-slate-800 transition flex items-center space-x-2 shadow-sm">
            <span>Submit Task</span> <i data-lucide="check-circle" class="w-4 h-4"></i>
        </button>
    </header>

    <main class="flex-1 flex flex-col overflow-hidden bg-white" id="workspaceContainer">
        <div class="flex-1 flex items-center justify-center">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-slate-900"></div>
        </div>
    </main>

    <script>
        // Инициализируем клиент Supabase
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const taskType = urlParams.get('type') || 'sentence';
        const taskId = urlParams.get('id') || '1';

        let currentQuestion = null;
        let wordCountVisible = true;

        // Корректируем ссылку "Назад", чтобы возвращала в список по типу
        document.getElementById('backBtn').href = `task-list.html?type=${taskType}`;

        const MOCK_DATA = {
            sentence: {
                title: "Build a Sentence",
                progress: "Question 1 of 5",
                prompt_context: "The new office is very far from here.",
                avatar_left: "👨‍💼",
                avatar_right: "👩‍💼",
                structure: [
                    { type: 'text', value: 'Commuting' },
                    { type: 'slot' }, { type: 'slot' }, { type: 'slot' }, { type: 'slot' }, { type: 'slot' }
                ],
                bank: ["such", "a long", "distance", "must", "be exhausting", "everyday"]
            },
            email: {
                title: "Write an Email",
                progress: "Question 1 of 1",
                prompt_context: "You are planning a camping trip to the mountains during the upcoming semester break. Your friend Daniel recently spent a few days camping in the same area and told you he had a great experience. You would like to ask him for advice before you finalize your plans.",
                instructions: [
                    "Tell Daniel about your plans for the camping trip",
                    "Ask Daniel for advice about the area",
                    "Mention any preferences or concerns you have about the trip"
                ],
                meta_to: "Daniel",
                meta_subject: "Camping recommendations"
            },
            academic: {
                title: "Academic Discussion",
                progress: "Question 1 of 1",
                professor_name: "Prof. Delgado",
                professor_avatar: "👨‍🏫",
                professor_prompt: "In sociology, researchers often study geographic mobility, which refers to how frequently people move to different cities or regions during their lives. Some scholars argue that high geographic mobility benefits individuals because moving to new places exposes people to different cultures, ideas, and opportunities. Others believe that living in the same place for a long time is more beneficial because it provides stability. What is your opinion on this?",
                instruction_box: "In your response, you should express and support your opinion, making a contribution to the discussion. An effective response will contain at least 100 words.",
                peers: [
                    { name: "Elena", avatar: "👩", text: "I believe geographic mobility is beneficial because it allows people to experience different cultures and perspectives. When individuals move to new cities, they encounter different lifestyles." },
                    { name: "Marcus", avatar: "👨", text: "In my opinion, living in one place for a long time is more beneficial. When people remain in the same community, they are able to build stronger relationships with neighbors." }
                ]
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchTaskData();
            lucide.createIcons();
        });

        async function fetchTaskData() {
            if (db) {
                try {
                    const { data, error } = await db
                        .from('writing_tasks')
                        .select('*')
                        .eq('id', taskId)
                        .single();
                    
                    if (data && !error) {
                        currentQuestion = data;
                        
                        // Безопасный парсинг JSON полей на случай хранения в виде строк
                        if (typeof currentQuestion.structure === 'string') {
                            currentQuestion.structure = JSON.parse(currentQuestion.structure);
                        }
                        if (typeof currentQuestion.bank === 'string') {
                            currentQuestion.bank = JSON.parse(currentQuestion.bank);
                        }
                        if (typeof currentQuestion.instructions === 'string') {
                            currentQuestion.instructions = JSON.parse(currentQuestion.instructions);
                        }
                        if (typeof currentQuestion.peers === 'string') {
                            currentQuestion.peers = JSON.parse(currentQuestion.peers);
                        }

                        renderWorkspace();
                        return;
                    }
                } catch (e) {
                    console.warn("Supabase data parse error. Loading mock fallback.", e);
                }
            }
            
            currentQuestion = MOCK_DATA[taskType];
            renderWorkspace();
        }

        function renderWorkspace() {
            const container = document.getElementById('workspaceContainer');
            document.getElementById('taskTitle').innerText = currentQuestion.title || "Writing Exercise";
            document.getElementById('questionProgress').innerText = currentQuestion.progress || "";

            if (taskType === 'sentence') {
                let sentenceHTML = '';
                currentQuestion.structure.forEach((item, index) => {
                    if (item.type === 'text') {
                        sentenceHTML += `<div class="inline-flex items-center justify-center px-1.5 py-2 text-sm font-bold text-slate-800 select-none">${item.value}</div>`;
                    } else if (item.type === 'slot') {
                        sentenceHTML += `<div class="word-slot inline-flex items-center justify-center border-b-2 border-gray-300 mx-1 pb-1 align-bottom" id="slot-${index}"></div>`;
                    }
                });
                sentenceHTML += `<span class="text-2xl font-bold text-slate-400 select-none ml-1 align-bottom leading-none">.</span>`;

                container.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center p-6 max-w-4xl mx-auto w-full bg-[#f8f9fa]">
                        <h2 class="text-xl font-bold text-center tracking-tight mb-8 text-slate-800">Make an appropriate sentence.</h2>
                        <div class="w-full space-y-8 mb-12 bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                            <div class="flex items-start space-x-4">
                                <div class="text-2xl p-2 bg-blue-50 border border-blue-100 rounded-full shrink-0">${currentQuestion.avatar_left || '👨‍💼'}</div>
                                <div class="bg-gray-50 border border-gray-100 rounded-2xl px-5 py-3 text-sm font-medium text-slate-700 max-w-md mt-1">
                                    ${currentQuestion.prompt_context}
                                </div>
                            </div>
                            <div class="flex items-start space-x-4 pt-4 border-t border-dashed border-gray-100">
                                <div class="text-2xl p-2 bg-rose-50 border border-rose-100 rounded-full shrink-0">${currentQuestion.avatar_right || '👩‍💼'}</div>
                                <div class="flex-1 flex flex-wrap items-end gap-y-3 pt-2" id="sentenceDropzoneContainer">
                                    ${sentenceHTML}
                                </div>
                            </div>
                        </div>
                        <div class="w-full max-w-2xl">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider text-center mb-3">Drag words to the empty slots above</p>
                            <div class="flex flex-wrap justify-center gap-2.5 bg-white border border-gray-200 p-5 rounded-3xl min-h-[80px] shadow-sm" id="wordBankContainer"></div>
                        </div>
                    </div>
                `;
                initSentenceDragAndDrop();

            } else if (taskType === 'email') {
                let instructionsHTML = (currentQuestion.instructions || []).map(li => `<li>${li}</li>`).join('');
                container.innerHTML = `
                    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100 h-full overflow-hidden">
                        <div class="p-8 overflow-y-auto space-y-6 bg-white">
                            <div class="prose prose-slate max-w-none">
                                <p class="text-sm text-slate-700 leading-relaxed font-medium">${currentQuestion.prompt_context}</p>
                                <div class="h-px bg-gray-100 my-6"></div>
                                <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wide">Write an email to ${currentQuestion.meta_to || 'Receiver'}. In the email, do each of the following:</h3>
                                <ul class="list-disc pl-5 text-sm text-slate-600 space-y-2.5 mt-3">${instructionsHTML}</ul>
                            </div>
                        </div>
                        <div class="p-6 bg-[#f8f9fa] flex flex-col overflow-hidden h-full">
                            <div class="bg-white border border-gray-200 rounded-3xl p-6 flex flex-col flex-1 shadow-sm overflow-hidden">
                                <div class="space-y-1.5 text-xs text-slate-500 mb-4 border-b border-gray-100 pb-4">
                                    <div class="flex items-center mt-1"><span class="w-16 font-bold text-gray-400">To:</span> <span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded-md font-semibold">${currentQuestion.meta_to || 'Receiver'}</span></div>
                                    <div class="flex items-center"><span class="w-16 font-bold text-gray-400">Subject:</span> <span class="text-slate-800 font-semibold">${currentQuestion.meta_subject || 'No Subject'}</span></div>
                                </div>
                                ${renderToolbar()}
                                <div class="flex-1 relative overflow-hidden">
                                    <textarea id="editorArea" oninput="updateWordCount()" placeholder="Write your response here..." class="w-full h-full resize-none border-0 outline-none p-1 text-sm leading-relaxed text-slate-800 placeholder-gray-300 focus:ring-0"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

            } else if (taskType === 'academic') {
                let peersHTML = (currentQuestion.peers || []).map(peer => `
                    <div class="flex items-start space-x-3 bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                        <div class="flex flex-col items-center shrink-0">
                            <div class="w-10 h-10 rounded-full bg-slate-50 border border-gray-100 flex items-center justify-center text-lg shadow-sm">${peer.avatar || '👤'}</div>
                            <span class="text-[9px] font-bold text-gray-400 mt-1">${peer.name}</span>
                        </div>
                        <p class="text-xs text-slate-600 leading-relaxed mt-1">${peer.text}</p>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100 h-full overflow-hidden">
                        <div class="p-8 overflow-y-auto space-y-6 bg-white">
                            <div class="prose prose-slate max-w-none">
                                <div class="bg-teal-50 border border-teal-100 rounded-xl px-4 py-3 text-xs font-bold text-teal-800 mb-6 leading-relaxed">${currentQuestion.instruction_box || 'Respond to the professor.'}</div>
                                <div class="flex items-start space-x-4 bg-gray-50/80 p-5 rounded-2xl border border-gray-100">
                                    <div class="flex flex-col items-center text-center shrink-0">
                                        <div class="text-2xl p-2 bg-white rounded-full shadow-sm border border-gray-100">${currentQuestion.professor_avatar || '👨‍🏫'}</div>
                                        <span class="text-[10px] font-bold text-slate-800 mt-2">${currentQuestion.professor_name || 'Professor'}</span>
                                    </div>
                                    <p class="text-xs text-slate-600 leading-relaxed font-medium pt-1">${currentQuestion.professor_prompt}</p>
                                </div>
                            </div>
                        </div>
                        <div class="p-6 bg-[#f8f9fa] flex flex-col overflow-hidden h-full space-y-4">
                            <div class="flex-1 overflow-y-auto space-y-3 pr-2 max-h-[45%] pb-2">${peersHTML}</div>
                            <div class="bg-white border border-gray-200 rounded-3xl p-5 flex flex-col h-[55%] shadow-sm overflow-hidden">
                                ${renderToolbar()}
                                <div class="flex-1 overflow-hidden relative">
                                    <textarea id="editorArea" oninput="updateWordCount()" placeholder="Write your contribution here..." class="w-full h-full resize-none border-0 outline-none text-sm leading-relaxed text-slate-800 placeholder-gray-300 focus:ring-0 p-1"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function renderToolbar() {
            return `
                <div class="flex items-center justify-between bg-gray-50 border border-gray-100 px-3 py-1.5 rounded-xl mb-3 text-[11px] font-bold text-slate-600">
                    <div class="flex items-center space-x-1">
                        <button class="px-2.5 py-1 rounded hover:bg-gray-200 transition" onclick="document.getElementById('editorArea').focus()">Edit</button>
                    </div>
                    <button onclick="toggleWordCount()" class="flex items-center space-x-1.5 text-gray-400 hover:text-slate-800 transition py-1 px-2 rounded bg-white border border-gray-200 shadow-sm">
                        <i data-lucide="eye" class="w-3 h-3"></i>
                        <span id="wordCountLabel">Words : 0</span>
                    </button>
                </div>
            `;
        }

        function initSentenceDragAndDrop() {
            const bankContainer = document.getElementById('wordBankContainer');
            const slots = document.querySelectorAll('.word-slot');
            if(!bankContainer) return;

            (currentQuestion.bank || []).forEach((word) => {
                bankContainer.innerHTML += `
                    <div class="draggable-word bg-white border border-gray-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-xl shadow-sm cursor-grab active:cursor-grabbing hover:border-slate-400 hover:text-slate-900 transition touch-manipulation select-none flex-shrink-0">
                        ${word}
                    </div>
                `;
            });

            new Sortable(bankContainer, {
                group: 'shared',
                animation: 150,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag'
            });

            slots.forEach(slot => {
                new Sortable(slot, {
                    group: 'shared',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    onAdd: function (evt) {
                        const currentSlot = evt.to;
                        if (currentSlot.children.length > 1) {
                            Array.from(currentSlot.children).forEach(child => {
                                if (child !== evt.item) {
                                    bankContainer.appendChild(child);
                                }
                            });
                        }
                    }
                });
            });
        }

        let actualCount = 0;
        function updateWordCount() {
            const text = document.getElementById('editorArea').value.trim();
            actualCount = text === "" ? 0 : text.split(/\s+/).length;
            const label = document.getElementById('wordCountLabel');
            if (label) {
                label.innerText = wordCountVisible ? `Words : ${actualCount}` : `Hidden`;
            }
        }

        function toggleWordCount() {
            wordCountVisible = !wordCountVisible;
            updateWordCount();
        }

        async function handleSubmitResponse() {
            let userResult = "";

            if (taskType === 'sentence') {
                let parts = [];
                currentQuestion.structure.forEach((item, index) => {
                    if (item.type === 'text') {
                        parts.push(item.value);
                    } else {
                        const slotNode = document.getElementById(`slot-${index}`);
                        if (slotNode && slotNode.children.length > 0) {
                            parts.push(slotNode.children[0].innerText.trim());
                        } else {
                            parts.push("____");
                        }
                    }
                });
                userResult = parts.join(" ") + ".";
            } else {
                const editor = document.getElementById('editorArea');
                userResult = editor ? editor.value.trim() : "";
            }

            if (!userResult || userResult === "." || userResult === "____.") {
                alert("Please complete the task before submitting.");
                return;
            }

            if (db) {
                try {
                    const { data: { session }, error: sessionError } = await db.auth.getSession();
                    
                    if (sessionError || !session) {
                        alert("Session not found. Please log in first.");
                        window.location.href = 'index.html';
                        return;
                    }

                    const userId = session.user.id;

                    const { error } = await db
                        .from('student_responses')
                        .insert([
                            { 
                                task_id: taskId, 
                                task_type: taskType, 
                                response_content: userResult,
                                user_id: userId,
                                score: null // Изначально пустой балл (на проверку преподавателю)
                            }
                        ]);
                        
                    if (error) throw error;
                    
                    alert("Your answer was successfully saved!");
                    // Перенаправляем обратно в список задач нужного типа
                    window.location.href = `task-list.html?type=${taskType}`;

                } catch (err) {
                    alert("Database write error: " + err.message);
                }
            } else {
                alert(`No database script detected. Mock redirect.`);
                window.location.href = `task-list.html?type=${taskType}`;
            }
        }
    </script>
</body>
</html>
