<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing Practice Engine — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Подключаем библиотеку для плавного Drag & Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Стилизация скроллбара для текстовых полей */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        /* Класс-призрак при перетаскивании слова */
        .sortable-ghost { opacity: 0.4; background-color: #f8f9fa; border: 1px dashed #cbd5e1; color: transparent; }
        .sortable-drag { cursor: grabbing !important; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-900 min-h-screen flex flex-col antialiased">

    <!-- СОВРЕМЕННАЯ ШАПКА В СТИЛЕ ПРИЛОЖЕНИЯ -->
    <header class="bg-white px-6 py-4 flex items-center justify-between border-b border-gray-100 shrink-0 sticky top-0 z-10 shadow-sm">
        <div class="flex items-center space-x-4">
            <a href="writing.html" class="flex items-center justify-center w-10 h-10 rounded-xl border border-gray-200 text-gray-500 hover:bg-gray-50 hover:text-slate-800 transition">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="text-sm font-bold text-slate-900">Writing Practice</h1>
                <p class="text-[11px] font-bold text-gray-400 mt-0.5 uppercase tracking-wider" id="questionProgress">Question 1 of 1</p>
            </div>
        </div>
        
        <button onclick="handleNextQuestion()" class="bg-slate-900 text-white text-sm font-bold px-5 py-2.5 rounded-xl hover:bg-slate-800 transition flex items-center space-x-2 shadow-sm">
            <span>Submit Task</span> <i data-lucide="check-circle" class="w-4 h-4"></i>
        </button>
    </header>

    <!-- КОНТЕЙНЕР ДЛЯ ЗАДАНИЙ -->
    <main class="flex-1 flex flex-col overflow-hidden bg-white" id="workspaceContainer">
        <!-- Контент подставится сюда через JS в зависимости от ?type= -->
    </main>

    <script>
        // Определяем тип задания из URL
        const urlParams = new URLSearchParams(window.location.search);
        const taskType = urlParams.get('type') || 'sentence';

        let sentenceBank = ["must", "a long", "commuting", "be exhausting", "such", "distance"];
        let wordCountVisible = true;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderTask();
        });

        function renderTask() {
            const container = document.getElementById('workspaceContainer');
            const progressText = document.getElementById('questionProgress');

            if (taskType === 'sentence') {
                progressText.innerText = "Question 1 of 5";
                container.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center p-8 max-w-4xl mx-auto w-full bg-[#f8f9fa]">
                        <h2 class="text-2xl font-bold text-center tracking-tight mb-12 text-slate-800">Make an appropriate sentence.</h2>
                        
                        <div class="w-full space-y-8 mb-16 bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                            <!-- Фраза 1 -->
                            <div class="flex items-start space-x-4">
                                <div class="flex flex-col items-center shrink-0">
                                    <div class="w-12 h-12 rounded-full border-2 border-blue-100 bg-blue-50 flex items-center justify-center overflow-hidden font-bold text-xl shadow-sm">👨‍💼</div>
                                </div>
                                <div class="bg-gray-50 border border-gray-100 rounded-2xl px-5 py-3.5 text-sm font-medium text-slate-700 max-w-md mt-1">
                                    The new office is very far from here.
                                </div>
                            </div>

                            <!-- Зона сборки предложения (Dropzone) -->
                            <div class="flex items-start space-x-4 pt-2">
                                <div class="flex flex-col items-center shrink-0">
                                    <div class="w-12 h-12 rounded-full border-2 border-rose-100 bg-rose-50 flex items-center justify-center overflow-hidden font-bold text-xl shadow-sm">👩‍💼</div>
                                </div>
                                
                                <div class="flex-1 flex items-end min-h-[60px]">
                                    <!-- Зона куда перетаскивать -->
                                    <div class="flex-1 flex flex-wrap items-center gap-2 border-b-2 border-dashed border-gray-300 pb-2 min-h-[50px] p-2 bg-gray-50/50 rounded-t-xl transition-colors" id="sentenceDropzone">
                                        <!-- Сюда падают слова -->
                                    </div>
                                    <span class="text-3xl font-bold text-slate-400 select-none pb-2 pl-2">.</span>
                                </div>
                            </div>
                        </div>

                        <!-- Нижний банк слов -->
                        <div class="w-full max-w-2xl">
                            <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider text-center mb-3">Drag & Drop words above</p>
                            <div class="flex flex-wrap justify-center gap-3 bg-white border border-gray-200 p-6 rounded-3xl min-h-[90px] shadow-sm" id="wordBankContainer">
                                <!-- Слова рендерятся тут -->
                            </div>
                        </div>
                    </div>
                `;
                initDragAndDrop();

            } else if (taskType === 'email') {
                progressText.innerText = "Question 1 of 1";
                container.innerHTML = `
                    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100 h-full overflow-hidden">
                        
                        <!-- ЛЕВАЯ ПАНЕЛЬ -->
                        <div class="p-8 overflow-y-auto space-y-6 bg-white">
                            <div class="prose prose-slate max-w-none">
                                <p class="text-sm text-slate-700 leading-relaxed font-medium">
                                    You are planning a camping trip to the mountains during the upcoming semester break. Your friend Daniel recently spent a few days camping in the same area and told you he had a great experience. You would like to ask him for advice before you finalize your plans.
                                </p>
                                <div class="h-px bg-gray-100 my-6"></div>
                                <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wide">Write an email to Daniel. In the email, do each of the following:</h3>
                                <ul class="list-disc pl-5 text-sm text-slate-600 space-y-2.5 mt-3">
                                    <li>Tell Daniel about your plans for the camping trip</li>
                                    <li>Ask Daniel for advice about the area</li>
                                    <li>Mention any preferences or concerns you have about the trip</li>
                                </ul>
                                <p class="text-xs font-semibold text-gray-400 mt-6 italic">
                                    Write as much as you can and in complete sentences.
                                </p>
                            </div>
                        </div>

                        <!-- ПРАВАЯ ПАНЕЛЬ -->
                        <div class="p-6 md:p-8 bg-[#f8f9fa] flex flex-col overflow-hidden h-full">
                            <div class="bg-white border border-gray-200 rounded-3xl p-6 flex flex-col flex-1 shadow-sm overflow-hidden">
                                <div class="space-y-1.5 text-xs font-medium text-slate-500 mb-4 border-b border-gray-100 pb-4">
                                    <div class="flex"><span class="w-20 font-bold text-gray-400">Your response:</span></div>
                                    <div class="flex items-center mt-2"><span class="w-16 font-bold text-gray-400">To:</span> <span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded-md font-semibold">Daniel</span></div>
                                    <div class="flex items-center"><span class="w-16 font-bold text-gray-400">Subject:</span> <span class="text-slate-800 font-semibold">Camping recommendations</span></div>
                                </div>

                                <div class="flex items-center justify-between bg-gray-50 border border-gray-100 px-3 py-1.5 rounded-xl mb-4 text-xs font-bold text-slate-600">
                                    <div class="flex items-center space-x-1">
                                        <button class="px-3 py-1.5 rounded hover:bg-gray-200/70 transition">Cut</button>
                                        <button class="px-3 py-1.5 rounded hover:bg-gray-200/70 transition">Paste</button>
                                        <button class="px-3 py-1.5 rounded hover:bg-gray-200/70 transition">Undo</button>
                                        <button class="px-3 py-1.5 rounded hover:bg-gray-200/70 transition">Redo</button>
                                    </div>
                                    <button onclick="toggleWordCount()" class="flex items-center space-x-1.5 text-gray-400 hover:text-slate-800 transition py-1 px-2 rounded bg-white border border-gray-200 shadow-sm">
                                        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                        <span id="wordCountLabel">Words : 0</span>
                                    </button>
                                </div>

                                <div class="flex-1 relative overflow-hidden">
                                    <textarea id="editorArea" oninput="updateWordCount()" placeholder="Write your response here..." class="w-full h-full resize-none border-0 outline-none p-2 text-sm leading-relaxed text-slate-800 placeholder-gray-300 focus:ring-0"></textarea>
                                </div>
                            </div>
                        </div>

                    </div>
                `;
            } else if (taskType === 'academic') {
                progressText.innerText = "Question 1 of 1";
                container.innerHTML = `
                    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100 h-full overflow-hidden">
                        
                        <!-- ЛЕВАЯ ПАНЕЛЬ -->
                        <div class="p-8 overflow-y-auto space-y-6 bg-white">
                            <div class="prose prose-slate max-w-none">
                                <p class="text-sm text-slate-700 font-medium leading-relaxed">
                                    Your professor is teaching a class on sociology. Write a post responding to the professor's question.
                                </p>
                                <div class="bg-teal-50 border border-teal-100 rounded-xl px-4 py-3 text-xs font-bold text-teal-800 mt-2 leading-relaxed">
                                    In your response, you should express and support your opinion, making a contribution to the discussion. An effective response will contain at least 100 words.
                                </div>
                                
                                <div class="h-px bg-gray-100 my-6"></div>

                                <div class="flex items-start space-x-4 bg-gray-50/80 p-5 rounded-2xl border border-gray-100">
                                    <div class="flex flex-col items-center text-center shrink-0">
                                        <div class="w-12 h-12 rounded-full border-2 border-teal-100 bg-white flex items-center justify-center overflow-hidden text-xl shadow-sm">👨‍🏫</div>
                                        <span class="text-[10px] font-bold text-slate-800 mt-2">Prof. Delgado</span>
                                    </div>
                                    <p class="text-sm text-slate-600 leading-relaxed font-medium pt-1">
                                        In sociology, researchers often study geographic mobility... Some scholars argue that high geographic mobility benefits individuals because moving to new places exposes people to different cultures, ideas, and opportunities. Others believe that living in the same place for a long time is more beneficial because it provides stability. What is your opinion on this?
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- ПРАВАЯ ПАНЕЛЬ -->
                        <div class="p-6 md:p-8 bg-[#f8f9fa] flex flex-col overflow-hidden h-full space-y-4">
                            
                            <!-- Лента ответов -->
                            <div class="flex-1 overflow-y-auto space-y-4 pr-2 max-h-[45%] pb-2">
                                <div class="flex items-start space-x-3 bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                                    <div class="flex flex-col items-center shrink-0">
                                        <div class="w-10 h-10 rounded-full bg-indigo-50 border border-indigo-100 flex items-center justify-center text-lg shadow-sm">👩</div>
                                        <span class="text-[9px] font-bold text-gray-400 mt-1">Elena</span>
                                    </div>
                                    <p class="text-xs text-slate-600 leading-relaxed mt-1">
                                        I believe geographic mobility is beneficial because it allows people to experience different cultures and perspectives...
                                    </p>
                                </div>

                                <div class="flex items-start space-x-3 bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                                    <div class="flex flex-col items-center shrink-0">
                                        <div class="w-10 h-10 rounded-full bg-blue-50 border border-blue-100 flex items-center justify-center text-lg shadow-sm">👨</div>
                                        <span class="text-[9px] font-bold text-gray-400 mt-1">Marcus</span>
                                    </div>
                                    <p class="text-xs text-slate-600 leading-relaxed mt-1">
                                        In my opinion, living in one place for a long time is more beneficial. When people remain in the same community...
                                    </p>
                                </div>
                            </div>

                            <!-- Поле ввода -->
                            <div class="bg-white border border-gray-200 rounded-3xl p-5 flex flex-col h-[55%] shadow-sm overflow-hidden">
                                <div class="flex items-center justify-between bg-gray-50 border border-gray-100 px-3 py-1.5 rounded-xl mb-3 text-[11px] font-bold text-slate-600">
                                    <div class="flex items-center space-x-1">
                                        <button class="px-2.5 py-1 rounded hover:bg-gray-200 transition">Cut</button>
                                        <button class="px-2.5 py-1 rounded hover:bg-gray-200 transition">Paste</button>
                                    </div>
                                    <button onclick="toggleWordCount()" class="flex items-center space-x-1.5 text-gray-400 hover:text-slate-800 transition py-1 px-2 rounded bg-white border border-gray-200 shadow-sm">
                                        <i data-lucide="eye" class="w-3 h-3"></i>
                                        <span id="wordCountLabel">Words : 0</span>
                                    </button>
                                </div>

                                <div class="flex-1 overflow-hidden relative">
                                    <textarea id="editorArea" oninput="updateWordCount()" placeholder="Write your contribution here..." class="w-full h-full resize-none border-0 outline-none text-sm leading-relaxed text-slate-800 placeholder-gray-300 focus:ring-0 p-1"></textarea>
                                </div>
                            </div>

                        </div>

                    </div>
                `;
            }
            lucide.createIcons();
        }

        // --- ЛОГИКА DRAG AND DROP (Только для Build a Sentence) ---
        function initDragAndDrop() {
            const bankContainer = document.getElementById('wordBankContainer');
            const dropzoneContainer = document.getElementById('sentenceDropzone');

            // Заполняем банк изначальными словами
            sentenceBank.forEach((word) => {
                bankContainer.innerHTML += `
                    <div class="bg-white border border-gray-200 text-slate-700 text-sm font-bold px-5 py-2.5 rounded-xl shadow-sm cursor-grab active:cursor-grabbing hover:border-teal-500 hover:text-teal-600 transition touch-manipulation select-none">
                        ${word}
                    </div>
                `;
            });

            // Инициализируем Sortable.js для банка слов
            new Sortable(bankContainer, {
                group: 'shared', // позволяет переносить элементы между списками
                animation: 150,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag'
            });

            // Инициализируем Sortable.js для зоны сбора предложения
            new Sortable(dropzoneContainer, {
                group: 'shared',
                animation: 150,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag'
            });
        }

        // --- ЛОГИКА ПОДСЧЕТА СЛОВ ---
        let actualCount = 0;
        function updateWordCount() {
            const text = document.getElementById('editorArea').value.trim();
            actualCount = text === "" ? 0 : text.split(/\s+/).length;
            
            const label = document.getElementById('wordCountLabel');
            if (wordCountVisible) {
                label.innerText = `Words : ${actualCount}`;
            } else {
                label.innerText = `Hidden`;
            }
        }

        function toggleWordCount() {
            wordCountVisible = !wordCountVisible;
            updateWordCount();
        }

        // --- НАВИГАЦИЯ ---
        function handleNextQuestion() {
            alert("Your response has been saved. Processing evaluation criteria...");
            window.location.href = 'writing.html';
        }
    </script>
</body>
</html>
