<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing Practice Engine — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        .sortable-ghost { opacity: 0.2; background-color: #f1f5f9; border: 2px dashed #94a3b8; color: transparent; }
        .sortable-drag { cursor: grabbing !important; transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        /* Стили для слотов (подчеркиваний) */
        .word-slot { min-width: 90px; min-height: 44px; transition: all 0.2s; }
        .word-slot.highlight { background-color: #f8fafc; border-color: #3b82f6; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-900 min-h-screen flex flex-col antialiased">

    <!-- ШАПКА -->
    <header class="bg-white px-6 py-4 flex items-center justify-between border-b border-gray-100 shrink-0 sticky top-0 z-10 shadow-sm">
        <div class="flex items-center space-x-4">
            <a href="writing.html" class="flex items-center justify-center w-10 h-10 rounded-xl border border-gray-200 text-gray-500 hover:bg-gray-50 hover:text-slate-800 transition">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="text-sm font-bold text-slate-900">Writing Practice</h1>
                <p class="text-[11px] font-bold text-gray-400 mt-0.5 uppercase tracking-wider" id="questionProgress">Question 1 of 1</p>
            </div>
        </div>
        
        <button onclick="handleNextQuestion()" class="bg-slate-900 text-white text-sm font-bold px-5 py-2.5 rounded-xl hover:bg-slate-800 transition flex items-center space-x-2 shadow-sm">
            <span>Submit Task</span> <i data-lucide="check-circle" class="w-4 h-4"></i>
        </button>
    </header>

    <!-- КОНТЕЙНЕР ДЛЯ ЗАДАНИЙ -->
    <main class="flex-1 flex flex-col overflow-hidden bg-white" id="workspaceContainer">
        <!-- Контент подставится сюда через JS -->
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const taskType = urlParams.get('type') || 'sentence';

        let wordCountVisible = true;

        // Конфигурация для задания Build a Sentence
        const sentenceStructure = [
            { type: 'text', value: 'Commuting' }, // Предустановленное слово (помощь)
            { type: 'slot' },
            { type: 'slot' },
            { type: 'slot' },
            { type: 'slot' },
            { type: 'slot' }
        ];
        
        // Банк слов (включая лишнее слово "everyday" для усложнения)
        const sentenceBank = ["such", "a long", "distance", "must", "be exhausting", "everyday"];

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderTask();
        });

        function renderTask() {
            const container = document.getElementById('workspaceContainer');
            const progressText = document.getElementById('questionProgress');

            if (taskType === 'sentence') {
                progressText.innerText = "Question 1 of 5";
                
                // Генерируем HTML для структуры предложения
                let sentenceHTML = '';
                sentenceStructure.forEach((item, index) => {
                    if (item.type === 'text') {
                        sentenceHTML += `<div class="inline-flex items-center justify-center px-2 py-2 text-sm font-bold text-slate-800 select-none">${item.value}</div>`;
                    } else if (item.type === 'slot') {
                        sentenceHTML += `<div class="word-slot inline-flex items-center justify-center border-b-2 border-gray-300 mx-1.5 pb-1 align-bottom" id="slot-${index}"></div>`;
                    }
                });
                sentenceHTML += `<span class="text-3xl font-bold text-slate-400 select-none ml-1 align-bottom leading-none">.</span>`;

                container.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center p-8 max-w-4xl mx-auto w-full bg-[#f8f9fa]">
                        <h2 class="text-2xl font-bold text-center tracking-tight mb-12 text-slate-800">Make an appropriate sentence.</h2>
                        
                        <div class="w-full space-y-10 mb-16 bg-white p-8 md:p-10 rounded-3xl border border-gray-100 shadow-sm">
                            
                            <!-- Фраза 1 (Контекст) -->
                            <div class="flex items-start space-x-4">
                                <div class="flex flex-col items-center shrink-0">
                                    <div class="w-12 h-12 rounded-full border-2 border-blue-100 bg-blue-50 flex items-center justify-center overflow-hidden font-bold text-xl shadow-sm">👨‍💼</div>
                                </div>
                                <div class="bg-gray-50 border border-gray-100 rounded-2xl px-5 py-3.5 text-sm font-medium text-slate-700 max-w-md mt-1">
                                    The new office is very far from here.
                                </div>
                            </div>

                            <!-- Зона сборки предложения -->
                            <div class="flex items-start space-x-4 pt-4 border-t border-dashed border-gray-100">
                                <div class="flex flex-col items-center shrink-0">
                                    <div class="w-12 h-12 rounded-full border-2 border-rose-100 bg-rose-50 flex items-center justify-center overflow-hidden font-bold text-xl shadow-sm">👩‍💼</div>
                                </div>
                                
                                <div class="flex-1 flex flex-wrap items-end gap-y-4 pt-1" id="sentenceDropzoneContainer">
                                    ${sentenceHTML}
                                </div>
                            </div>
                        </div>

                        <!-- Нижний банк слов -->
                        <div class="w-full max-w-3xl">
                            <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider text-center mb-4">Drag words to the empty slots above</p>
                            <div class="flex flex-wrap justify-center gap-3 bg-white border border-gray-200 p-6 rounded-3xl min-h-[90px] shadow-sm" id="wordBankContainer">
                                <!-- Слова рендерятся тут -->
                            </div>
                        </div>
                    </div>
                `;
                initDragAndDrop();

            } else if (taskType === 'email') {
                // ... (Код для Email остается без изменений, см. прошлый ответ)
                progressText.innerText = "Question 1 of 1";
                container.innerHTML = `<div class="flex-1 flex items-center justify-center text-gray-400">Email Module Loaded (refer to previous code snippet for the full HTML)</div>`;
            } else if (taskType === 'academic') {
                // ... (Код для Academic остается без изменений, см. прошлый ответ)
                progressText.innerText = "Question 1 of 1";
                container.innerHTML = `<div class="flex-1 flex items-center justify-center text-gray-400">Academic Module Loaded (refer to previous code snippet for the full HTML)</div>`;
            }
        }

        // --- ЛОГИКА DRAG AND DROP ---
        function initDragAndDrop() {
            const bankContainer = document.getElementById('wordBankContainer');
            const slots = document.querySelectorAll('.word-slot');

            // Заполняем банк словами
            sentenceBank.forEach((word) => {
                bankContainer.innerHTML += `
                    <div class="draggable-word bg-white border border-gray-200 text-slate-700 text-sm font-bold px-4 py-2 rounded-xl shadow-sm cursor-grab active:cursor-grabbing hover:border-teal-500 hover:text-teal-600 transition touch-manipulation select-none flex-shrink-0">
                        ${word}
                    </div>
                `;
            });

            // Настраиваем банк слов
            new Sortable(bankContainer, {
                group: 'shared',
                animation: 150,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag'
            });

            // Настраиваем каждый слот-подчеркивание
            slots.forEach(slot => {
                new Sortable(slot, {
                    group: 'shared',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    
                    // Когда слово бросают в слот
                    onAdd: function (evt) {
                        const currentSlot = evt.to;
                        
                        // Если в слоте уже есть слово (больше 1 элемента)
                        if (currentSlot.children.length > 1) {
                            // Находим старое слово и выкидываем его обратно в банк
                            Array.from(currentSlot.children).forEach(child => {
                                if (child !== evt.item) {
                                    bankContainer.appendChild(child);
                                }
                            });
                        }
                    }
                });
            });
        }

        function handleNextQuestion() {
            alert("Your response has been saved. Processing evaluation criteria...");
            window.location.href = 'writing.html';
        }
    </script>
</body>
</html>
