<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Engine — TOEFL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .word-slot { min-width: 90px; min-height: 40px; transition: all 0.2s; }
        .sortable-ghost { opacity: 0.2; background-color: #f1f5f9; border: 2px dashed #94a3b8; color: transparent; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-900 min-h-screen flex flex-col antialiased">

    <header class="bg-white px-6 py-4 flex items-center justify-between border-b border-gray-100 shrink-0 sticky top-0 z-50 shadow-sm">
        
        <div class="flex items-center space-x-4">
            <a id="backBtn" href="#" class="flex items-center justify-center w-10 h-10 rounded-xl border border-gray-200 bg-gray-50 hover:bg-gray-100 transition">
                <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Symbols/Left%20Arrow.png" class="w-5 h-5" alt="Back" />
            </a>
            <div>
                <h1 class="text-sm font-bold text-slate-900" id="testHeaderTitle">Loading Test...</h1>
                <p class="text-[11px] font-bold text-gray-400 mt-0.5 uppercase tracking-wider">Writing Section</p>
            </div>
        </div>

        <div id="topNavigation" class="hidden flex items-center space-x-6">
            
            <div class="flex items-center space-x-4">
                <div class="text-sm font-bold text-slate-700">
                    Question <span id="current-q-label">1</span> of <span id="total-q-label">1</span>
                </div>
                
                <div class="flex items-center space-x-1.5 text-sm font-bold text-slate-700 bg-gray-50 border border-gray-200 px-3 py-1.5 rounded-lg shadow-sm">
                    <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Travel%20and%20places/Stopwatch.png" class="w-4 h-4" alt="Clock" />
                    <span id="timerDisplay" class="tabular-nums tracking-wide transition-colors duration-300">00:00</span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button id="btn-prev" onclick="prevSlide()" class="flex items-center px-4 py-2 text-sm font-bold text-slate-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Symbols/Left%20Arrow.png" class="w-4 h-4 mr-1" alt="Back" /> Back
                </button>
                
                <button id="btn-next" onclick="nextSlide()" class="flex items-center px-4 py-2 text-sm font-bold text-white bg-slate-900 hover:bg-slate-800 rounded-lg shadow-sm transition-colors">
                    Next <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Symbols/Right%20Arrow.png" class="w-4 h-4 ml-1" alt="Next" />
                </button>

                <button id="btn-submit" onclick="submitEntireTest()" class="hidden flex items-center px-4 py-2 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-sm transition-colors">
                    Submit <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Symbols/Check%20Mark%20Button.png" class="w-4 h-4 ml-1" alt="Submit" />
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col overflow-hidden relative bg-[#f8f9fa]" id="sliderContainer">
        <div class="flex-1 flex items-center justify-center">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-slate-900"></div>
        </div>
    </main>

    <div id="timeModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl flex flex-col items-center text-center transform scale-100 transition-transform">
            <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Travel%20and%20places/Alarm%20Clock.png" class="w-24 h-24 mb-5 drop-shadow-md" alt="Time up" />
            <h3 class="text-2xl font-black text-slate-800 mb-2">Время вышло!</h3>
            <p class="text-slate-500 text-sm font-medium mb-8 leading-relaxed">Отведенное на это задание время закончилось. Таймер продолжит идти в минус, чтобы вы увидели, сколько дополнительного времени вам потребовалось.</p>
            <button onclick="continueAfterTimeUp()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl hover:bg-slate-800 transition shadow-md active:scale-[0.98]">
                Продолжить
            </button>
        </div>
    </div>

    <script>
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const urlParams = new URLSearchParams(window.location.search);
        const taskType = urlParams.get('type') || 'sentence';
        const taskId = urlParams.get('id') || '1';

        document.getElementById('backBtn').href = `task-list.html?type=${taskType}`;

        let testQuestions = [];
        let studentResponses = [];
        let currentSlide = 0;
        let isTestCompleted = false;
        let wordCountStates = {}; 
        let currentUserId = null;

        // --- ЛОГИКА ТАЙМЕРА ---
        let timerInterval = null;
        let timeRemaining = 0; 
        let timeExpiredModalShown = false;

        function initTimer() {
            // Устанавливаем время в зависимости от типа задания (в секундах)
            if (taskType === 'sentence') {
                timeRemaining = 6 * 60;
            } else if (taskType === 'email') {
                timeRemaining = 7 * 60;
            } else if (taskType === 'academic') {
                timeRemaining = 10 * 60;
            } else {
                timeRemaining = 6 * 60; // fallback
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            // Сразу показываем стартовое время
            const display = document.getElementById('timerDisplay');
            display.innerText = formatTime(timeRemaining);
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                display.innerText = formatTime(timeRemaining);
                
                // Визуальный сигнал, если ушли в минус
                if (timeRemaining < 0) {
                    display.classList.remove('text-slate-700');
                    display.classList.add('text-red-500');
                }

                // Показываем окно ровно на 00:00 (один раз)
                if (timeRemaining === 0 && !timeExpiredModalShown) {
                    showTimeExpiredModal();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function formatTime(seconds) {
            const isNegative = seconds < 0;
            const absSeconds = Math.abs(seconds);
            const m = Math.floor(absSeconds / 60).toString().padStart(2, '0');
            const s = (absSeconds % 60).toString().padStart(2, '0');
            return isNegative ? `-${m}:${s}` : `${m}:${s}`;
        }

        function showTimeExpiredModal() {
            timeExpiredModalShown = true;
            const modal = document.getElementById('timeModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function continueAfterTimeUp() {
            const modal = document.getElementById('timeModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
        // --- КОНЕЦ ЛОГИКИ ТАЙМЕРА ---

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchTestContext();
        });

        async function fetchTestContext() {
            try {
                const { data: { session } } = await db.auth.getSession();
                currentUserId = session ? session.user.id : null;

                const { data: firstTask } = await db.from('writing_tasks').select('*').eq('id', taskId).single();
                
                if (firstTask) {
                    if (firstTask.test_id) {
                        const { data: allTestTasks } = await db.from('writing_tasks').select('*').eq('test_id', firstTask.test_id).order('id', { ascending: true });
                        testQuestions = allTestTasks;
                        document.getElementById('testHeaderTitle').innerText = `Practice Set ${firstTask.test_id}`;
                    } else {
                        testQuestions = [firstTask];
                        document.getElementById('testHeaderTitle').innerText = firstTask.title || "Writing Exercise";
                    }

                    testQuestions.forEach(q => {
                        if (typeof q.structure === 'string') q.structure = JSON.parse(q.structure);
                        if (typeof q.bank === 'string') q.bank = JSON.parse(q.bank);
                        if (typeof q.instructions === 'string') q.instructions = JSON.parse(q.instructions);
                        if (typeof q.peers === 'string') q.peers = JSON.parse(q.peers);
                    });

                    if (currentUserId) {
                        const questionIds = testQuestions.map(q => q.id);
                        const { data: resps } = await db.from('student_responses').select('*').eq('user_id', currentUserId).in('task_id', questionIds);
                        studentResponses = resps || [];
                        isTestCompleted = studentResponses.length === testQuestions.length && testQuestions.length > 0;
                    }
                }

                renderTestSlider();
            } catch (e) {
                console.error("Error loading test:", e);
                document.getElementById('sliderContainer').innerHTML = `<div class="text-center p-10 text-red-500 font-bold">Error loading test data.</div>`;
            }
        }

        function renderTestSlider() {
            const container = document.getElementById('sliderContainer');
            const topNav = document.getElementById('topNavigation');
            container.innerHTML = ''; 

            if (isTestCompleted) {
                if (topNav) topNav.classList.add('hidden');
                container.innerHTML = generateFullResultsView();
            } else {
                if (topNav) topNav.classList.remove('hidden');
                
                // Инициализация и запуск таймера
                initTimer();
                startTimer();
                
                testQuestions.forEach((q, index) => {
                    wordCountStates[index] = true; 
                    
                    const displayClass = index === 0 ? 'flex' : 'hidden'; 
                    let slideHTML = `<div id="slide-${index}" class="slide-container ${displayClass} flex-col h-full w-full absolute inset-0 bg-white">`;
                    
                    slideHTML += generatePracticeView(q, index);
                    slideHTML += `</div>`;

                    container.insertAdjacentHTML('beforeend', slideHTML);
                });

                if (taskType === 'sentence') {
                    testQuestions.forEach((q, index) => {
                        initSentenceDragAndDrop(q, index);
                    });
                }
                
                updateTopNavigation(0);
            }
        }

        function updateTopNavigation(index) {
            const total = testQuestions.length;
            
            document.getElementById('current-q-label').innerText = index + 1;
            document.getElementById('total-q-label').innerText = total;

            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const btnSubmit = document.getElementById('btn-submit');

            if (index === 0) {
                btnPrev.disabled = true;
                btnPrev.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                btnPrev.disabled = false;
                btnPrev.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            if (index === total - 1) {
                btnNext.classList.add('hidden');
                btnSubmit.classList.remove('hidden');
                btnSubmit.classList.add('flex');
            } else {
                btnNext.classList.remove('hidden');
                btnNext.classList.add('flex');
                btnSubmit.classList.add('hidden');
            }
        }

        function showSlide(index) {
            document.querySelectorAll('.slide-container').forEach((el, i) => {
                if (i === index) {
                    el.classList.remove('hidden');
                    el.classList.add('flex');
                } else {
                    el.classList.add('hidden');
                    el.classList.remove('flex');
                }
            });
            currentSlide = index;
            updateTopNavigation(index);
        }

        function nextSlide() {
            if (currentSlide < testQuestions.length - 1) showSlide(currentSlide + 1);
        }

        function prevSlide() {
            if (currentSlide > 0) showSlide(currentSlide - 1);
        }

        function generateFullResultsView() {
            let totalEarned = 0;
            let totalMax = 0;
            let hasScores = false;

            studentResponses.forEach(r => {
                if (r.score && String(r.score).includes('/')) {
                    const [e, m] = String(r.score).split('/').map(Number);
                    totalEarned += e;
                    totalMax += m;
                    hasScores = true;
                }
            });

            let scoreDisplay = 'Awaiting';
            if (hasScores) {
                if (taskType === 'sentence') {
                    scoreDisplay = `${totalEarned} / ${totalMax}`;
                } else {
                    scoreDisplay = Number.isInteger(totalEarned) ? totalEarned.toString() : totalEarned.toFixed(1);
                }
            }

            // ЧТЕНИЕ СОХРАНЕННОГО ВРЕМЕНИ (теперь это time_left_seconds)
            let savedTimeStr = null;
            if (studentResponses.length > 0 && studentResponses[0].time_left_seconds !== undefined) {
                savedTimeStr = studentResponses[0].time_left_seconds;
            }

            let timeCardHtml = '';
            if (savedTimeStr !== null) {
                const timeNum = parseInt(savedTimeStr, 10);
                const isOvertime = timeNum < 0; // Проверяем, не ушел ли ученик в минус
                const formattedSavedTime = formatTime(timeNum);
                
                // Динамические классы для карточки времени
                const bgColorClass = isOvertime ? 'bg-rose-50 border-rose-100' : 'bg-indigo-50 border-indigo-100';
                const iconColorClass = isOvertime ? 'text-rose-600' : 'text-indigo-600';
                const textColorClass = isOvertime ? 'text-rose-700' : 'text-indigo-700';
                const labelText = isOvertime ? 'Extra Time Used' : 'Time Left';

                timeCardHtml = `
                    <div class="${bgColorClass} border rounded-3xl p-5 flex flex-col items-center justify-center shadow-sm shrink-0">
                        <span class="text-[10px] font-bold ${iconColorClass} uppercase tracking-wider mb-1.5 flex items-center gap-1">
                            <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Travel%20and%20places/Stopwatch.png" class="w-3 h-3" alt="Clock" /> ${labelText}
                        </span>
                        <span class="text-2xl font-black ${textColorClass}">${formattedSavedTime}</span>
                    </div>
                `;
            }

            let leftPanelContent = '';
            if (taskType === 'sentence') {
                leftPanelContent = `
                    <div class="flex-1 flex flex-col items-center justify-center text-center mt-8">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-100 mb-4 shadow-sm border border-emerald-200">
                            <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Symbols/Check%20Mark%20Button.png" class="w-8 h-8" alt="Complete" />
                        </div>
                        <h3 class="text-lg font-bold text-slate-800">Practice Completed</h3>
                        <p class="text-sm text-slate-500 mt-2 max-w-[250px] mx-auto leading-relaxed">You have successfully submitted answers for all questions in this set.</p>
                    </div>
                `;
            } else {
                const mainPrompt = testQuestions[0].prompt_context || testQuestions[0].instruction_box || '';
                leftPanelContent = `
                    <div class="prose prose-sm prose-slate max-w-none mt-8 border-t border-gray-100 pt-6">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Original Context</h3>
                        <div class="text-sm text-slate-700 bg-gray-50 p-4 rounded-2xl border border-gray-100 leading-relaxed font-medium">${mainPrompt}</div>
                    </div>
                `;
            }

            const questionsHtml = testQuestions.map((q, index) => {
                const resp = studentResponses.find(r => String(r.task_id) === String(q.id)) || {};
                let qScore = 'Awaiting';
                
                if (resp.score) {
                    if (taskType === 'sentence') {
                        qScore = String(resp.score).replace('/', ' / ');
                    } else {
                        const earned = parseFloat(String(resp.score).split('/')[0]);
                        qScore = isNaN(earned) ? 'Awaiting' : (Number.isInteger(earned) ? earned.toString() : earned.toFixed(1));
                    }
                }

                const hasExplanation = q.explanation && q.explanation.trim().toLowerCase() !== 'none' && q.explanation.trim() !== '';

                return `
                    <div class="bg-white rounded-3xl border border-gray-200 shadow-sm p-6 relative">
                        <div class="flex items-start justify-between mb-5 border-b border-gray-50 pb-4">
                            <div class="flex items-start space-x-3 pr-4">
                                <span class="flex items-center justify-center w-6 h-6 rounded-full bg-rose-50 text-rose-600 border border-rose-100 text-xs font-bold shrink-0 mt-0.5">${index + 1}</span>
                                <h3 class="text-sm font-bold text-slate-800 leading-relaxed">${q.prompt_context || q.title || 'Writing Task'}</h3>
                            </div>
                            <div class="shrink-0">
                                <span class="text-[11px] font-bold px-2.5 py-1 rounded-md bg-gray-100 text-slate-600 border border-gray-200">${qScore}</span>
                            </div>
                        </div>

                        <div class="space-y-4 md:pl-9">
                            <div class="space-y-1.5">
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Your Answer</span>
                                <div class="text-sm text-slate-700 bg-gray-50 border border-gray-100 rounded-xl p-3.5 leading-relaxed whitespace-pre-wrap font-medium">${resp.response_content || 'No answer provided'}</div>
                            </div>

                            ${resp.correction ? `
                            <div class="space-y-1.5 pt-1">
                                <span class="text-[10px] font-bold text-teal-600 uppercase tracking-wider flex items-center gap-1">
                                    <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Fountain%20Pen.png" class="w-3 h-3" alt="Correction" /> Teacher's Correction
                                </span>
                                <div class="text-sm text-teal-950 bg-teal-50/40 border border-teal-100 rounded-xl p-3.5 leading-relaxed whitespace-pre-wrap font-medium">${resp.correction}</div>
                            </div>
                            ` : ''}

                            ${q.sample_answer ? `
                            <div class="space-y-1.5">
                                <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-1">
                                    <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Open%20Book.png" class="w-3 h-3" alt="Sample" /> Sample Answer
                                </span>
                                <div class="text-sm text-indigo-950 bg-indigo-50/50 border border-indigo-100 rounded-xl p-3.5 leading-relaxed whitespace-pre-wrap font-medium">${q.sample_answer}</div>
                            </div>
                            ` : ''}

                            ${hasExplanation ? `
                            <div class="space-y-1.5 pt-2">
                                <span class="text-[10px] font-bold text-amber-500 uppercase tracking-wider flex items-center gap-1">
                                    <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Light%20Bulb.png" class="w-3 h-3" alt="Note" /> Teacher's Note
                                </span>
                                <div class="text-sm text-amber-900 bg-amber-50/50 border border-amber-100 rounded-xl p-3.5 leading-relaxed whitespace-pre-wrap font-medium">${hasExplanation ? q.explanation : ''}</div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="flex-1 grid grid-cols-1 md:grid-cols-[300px_1fr] lg:grid-cols-[380px_1fr] divide-y md:divide-y-0 md:divide-x divide-gray-100 h-full overflow-hidden w-full bg-white relative">
                    <div class="flex flex-col h-full bg-white relative z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
                        <div class="p-6 md:p-8 overflow-y-auto flex-1 flex flex-col">
                            <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                                <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Bar%20Chart.png" class="w-5 h-5" alt="Chart" /> Results Overview
                            </h2>
                            
                            <div class="${savedTimeStr !== null ? 'grid grid-cols-2 gap-3' : 'flex flex-col'} mb-2">
                                <div class="bg-emerald-50 border border-emerald-100 rounded-3xl p-5 flex flex-col items-center justify-center shadow-sm shrink-0">
                                    <span class="text-[10px] font-bold text-emerald-600 uppercase tracking-wider mb-1.5">Total Score</span>
                                    <span class="${savedTimeStr !== null ? 'text-2xl' : 'text-4xl'} font-black text-emerald-700">${scoreDisplay}</span>
                                </div>
                                ${timeCardHtml}
                            </div>

                            ${leftPanelContent}
                        </div>
                        
                        <div class="p-6 border-t border-gray-100 bg-gray-50/50 shrink-0">
                            <a href="task-list.html?type=${taskType}" class="w-full flex items-center justify-center space-x-2 py-3.5 bg-white border border-gray-200 text-slate-700 font-bold rounded-xl text-sm hover:bg-gray-50 hover:text-slate-900 hover:border-gray-300 transition shadow-sm">
                                <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/File%20Folder.png" class="w-4 h-4" alt="Dashboard" />
                                <span>Back to Dashboard</span>
                            </a>
                        </div>
                    </div>

                    <div class="bg-[#f4f6f8] h-full overflow-y-auto p-4 md:p-8">
                        <div class="max-w-3xl mx-auto space-y-6 pb-12">
                            ${questionsHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function generatePracticeView(q, qIndex) {
            if (taskType === 'sentence') {
                let sentenceHTML = '';
                (q.structure || []).forEach((item, slotIndex) => {
                    if (item.type === 'text') {
                        sentenceHTML += `<div class="inline-flex items-center justify-center px-1.5 py-2 text-sm font-bold text-slate-800 select-none">${item.value}</div>`;
                    } else if (item.type === 'slot') {
                        sentenceHTML += `<div class="word-slot inline-flex items-center justify-center border-b-2 border-gray-300 mx-1 pb-1 align-bottom" id="slot-${qIndex}-${slotIndex}"></div>`;
                    }
                });
                
                let endMark = ".";
                if (q.sample_answer) {
                    const lastChar = q.sample_answer.trim().slice(-1);
                    if (['.', '?', '!'].includes(lastChar)) endMark = lastChar;
                }
                sentenceHTML += `<span class="text-2xl font-bold text-slate-400 select-none ml-1 align-bottom leading-none">${endMark}</span>`;

                const avatarLeft = q.avatar_left || `<img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/People%20with%20professions/Man%20Teacher%20Light%20Skin%20Tone.png" class="w-8 h-8 inline-block" alt="Man" />`;
                const avatarRight = q.avatar_right || `<img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/People%20with%20professions/Woman%20Teacher%20Light%20Skin%20Tone.png" class="w-8 h-8 inline-block" alt="Woman" />`;

                return `
                    <div class="flex-1 overflow-y-auto flex flex-col items-center justify-center p-6 w-full">
                        <div class="max-w-4xl w-full">
                            <h2 class="text-xl font-bold text-center tracking-tight mb-8 text-slate-800">${q.title || 'Make an appropriate sentence'}</h2>
                            <div class="w-full space-y-8 mb-12 bg-[#f8f9fa] p-8 rounded-3xl border border-gray-100 shadow-sm">
                                <div class="flex items-start space-x-4">
                                    <div class="flex items-center justify-center w-12 h-12 bg-blue-50 border border-blue-100 rounded-full shrink-0 shadow-sm">${avatarLeft}</div>
                                    <div class="bg-white border border-gray-100 rounded-2xl px-5 py-3 text-sm font-medium text-slate-700 max-w-md mt-1">${q.prompt_context}</div>
                                </div>
                                <div class="flex items-start space-x-4 pt-4 border-t border-dashed border-gray-200">
                                    <div class="flex items-center justify-center w-12 h-12 bg-rose-50 border border-rose-100 rounded-full shrink-0 shadow-sm">${avatarRight}</div>
                                    <div class="flex-1 flex flex-wrap items-end gap-y-3 pt-2" id="sentenceDropzoneContainer-${qIndex}">${sentenceHTML}</div>
                                </div>
                            </div>
                            <div class="w-full max-w-2xl mx-auto">
                                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider text-center mb-3">Drag words to the empty slots above</p>
                                <div class="flex flex-wrap justify-center gap-2.5 bg-gray-50 border border-gray-200 p-5 rounded-3xl min-h-[80px]" id="wordBankContainer-${qIndex}"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (taskType === 'email') {
                let instructionsHTML = (q.instructions || []).map(li => `<li>${li}</li>`).join('');
                return `
                    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100 overflow-hidden">
                        <div class="p-8 overflow-y-auto space-y-6 bg-white">
                            <h2 class="text-lg font-bold mb-4 text-slate-900">${q.title}</h2>
                            <div class="prose prose-slate max-w-none">
                                <p class="text-sm text-slate-700 leading-relaxed font-medium">${q.prompt_context}</p>
                                <div class="h-px bg-gray-100 my-6"></div>
                                <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wide">Write an email to ${q.meta_to || 'Daniel'}. In the email, do each of the following:</h3>
                                <ul class="list-disc pl-5 text-sm text-slate-600 space-y-2.5 mt-3">${instructionsHTML}</ul>
                            </div>
                        </div>
                        <div class="p-6 bg-[#f8f9fa] flex flex-col overflow-hidden h-full">
                            <div class="bg-white border border-gray-200 rounded-3xl p-6 flex flex-col flex-1 shadow-sm overflow-hidden">
                                <div class="space-y-1.5 text-xs text-slate-500 mb-4 border-b border-gray-100 pb-4">
                                    <div class="flex items-center mt-1"><span class="w-16 font-bold text-gray-400">To:</span> <span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded-md font-semibold">${q.meta_to || 'Recipient'}</span></div>
                                    <div class="flex items-center"><span class="w-16 font-bold text-gray-400">Subject:</span> <span class="text-slate-800 font-semibold">${q.meta_subject || 'Topic'}</span></div>
                                </div>
                                ${generateToolbar(qIndex)}
                                <div class="flex-1 relative overflow-hidden">
                                    <textarea id="editorArea-${qIndex}" oninput="updateWordCount(${qIndex})" placeholder="Write your response here..." class="w-full h-full resize-none border-0 outline-none p-1 text-sm leading-relaxed text-slate-800 placeholder-gray-300 focus:ring-0"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (taskType === 'academic') {
                let peersHTML = (q.peers || []).map(peer => `
                    <div class="flex items-start space-x-3 bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                        <div class="flex flex-col items-center shrink-0">
                            <div class="w-10 h-10 rounded-full bg-slate-50 border border-gray-100 flex items-center justify-center text-lg">${peer.avatar}</div>
                            <span class="text-[9px] font-bold text-gray-400 mt-1">${peer.name}</span>
                        </div>
                        <p class="text-xs text-slate-600 leading-relaxed mt-1">${peer.text}</p>
                    </div>
                `).join('');

                return `
                    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100 overflow-hidden">
                        <div class="p-8 overflow-y-auto space-y-6 bg-white">
                            <h2 class="text-lg font-bold mb-4 text-slate-900">${q.title}</h2>
                            <div class="bg-teal-50 border border-teal-100 rounded-xl px-4 py-3 text-xs font-bold text-teal-800 mb-6">${q.instruction_box}</div>
                            <div class="flex items-start space-x-4 bg-gray-50/80 p-5 rounded-2xl border border-gray-100">
                                <div class="flex flex-col items-center shrink-0">
                                    <div class="text-2xl p-2 bg-white rounded-full shadow-sm border border-gray-100">${q.professor_avatar}</div>
                                    <span class="text-[10px] font-bold text-slate-800 mt-2">${q.professor_name}</span>
                                </div>
                                <p class="text-xs text-slate-600 leading-relaxed font-medium pt-1">${q.professor_prompt}</p>
                            </div>
                        </div>
                        <div class="p-6 bg-[#f8f9fa] flex flex-col overflow-hidden h-full space-y-4">
                            <div class="flex-1 overflow-y-auto space-y-3 pr-2 max-h-[45%]">${peersHTML}</div>
                            <div class="bg-white border border-gray-200 rounded-3xl p-5 flex flex-col h-[55%] shadow-sm overflow-hidden">
                                ${generateToolbar(qIndex)}
                                <div class="flex-1 overflow-hidden relative">
                                    <textarea id="editorArea-${qIndex}" oninput="updateWordCount(${qIndex})" placeholder="Write your contribution here..." class="w-full h-full resize-none border-0 outline-none text-sm leading-relaxed text-slate-800 placeholder-gray-300 focus:ring-0 p-1"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function generateToolbar(qIndex) {
            return `
                <div class="flex items-center justify-between bg-gray-50 border border-gray-100 px-3 py-1.5 rounded-xl mb-3 text-[11px] font-bold text-slate-600 shrink-0">
                    <span class="text-gray-400">TOEFL Editor</span>
                    <button onclick="toggleWordCount(${qIndex})" class="flex items-center space-x-1.5 text-gray-400 hover:text-slate-800 transition py-1 px-2 rounded bg-white border border-gray-200 shadow-sm">
                        <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Body%20parts/Eye.png" class="w-3 h-3" alt="Eye" /> <span id="wordCountLabel-${qIndex}">Words : 0</span>
                    </button>
                </div>
            `;
        }

        function initSentenceDragAndDrop(q, qIndex) {
            const bankContainer = document.getElementById(`wordBankContainer-${qIndex}`);
            const slots = document.querySelectorAll(`[id^="slot-${qIndex}-"]`);
            if(!bankContainer) return;

            const words = q.bank || [];
            const shuffledWords = shuffleArray(words);

            shuffledWords.forEach(word => {
                bankContainer.innerHTML += `<div class="draggable-word bg-white border border-gray-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-xl shadow-sm cursor-grab active:cursor-grabbing hover:border-slate-400 select-none">${word}</div>`;
            });

            new Sortable(bankContainer, { group: `shared-${qIndex}`, animation: 150, ghostClass: 'sortable-ghost' });
            slots.forEach(slot => {
                new Sortable(slot, {
                    group: `shared-${qIndex}`, animation: 150, ghostClass: 'sortable-ghost',
                    onAdd: function (evt) {
                        if (evt.to.children.length > 1) {
                            Array.from(evt.to.children).forEach(child => { if (child !== evt.item) bankContainer.appendChild(child); });
                        }
                    }
                });
            });
        }

        function updateWordCount(qIndex) {
            const area = document.getElementById(`editorArea-${qIndex}`);
            if (!area) return;
            const text = area.value.trim();
            const actualCount = text === "" ? 0 : text.split(/\s+/).length;
            const label = document.getElementById(`wordCountLabel-${qIndex}`);
            if (label) label.innerText = wordCountStates[qIndex] ? `Words : ${actualCount}` : `Hidden`;
        }

        function toggleWordCount(qIndex) { 
            wordCountStates[qIndex] = !wordCountStates[qIndex]; 
            updateWordCount(qIndex); 
        }

        function extractAnswerFromUI(q, qIndex) {
            if (taskType === 'sentence') {
                let parts = [];
                (q.structure || []).forEach((item, slotIndex) => {
                    if (item.type === 'text') {
                        parts.push(item.value);
                    } else if (item.type === 'slot') {
                        const s = document.getElementById(`slot-${qIndex}-${slotIndex}`);
                        parts.push(s && s.children.length > 0 ? s.children[0].textContent.trim() : "____");
                    }
                });
                
                let userResult = parts.join(" ").replace(/\s+([.?!])/g, "$1").trim();
                
                let endMark = ".";
                if (q.sample_answer) {
                    const lastChar = q.sample_answer.trim().slice(-1);
                    if (['.', '?', '!'].includes(lastChar)) endMark = lastChar;
                }
                
                if (!userResult.endsWith(endMark)) userResult += endMark;
                return userResult;
            } else {
                return document.getElementById(`editorArea-${qIndex}`)?.value.trim() || "";
            }
        }

        function calculateScore(q, userResult) {
            if (taskType !== 'sentence') return "0/6.0"; 
            if (!q.sample_answer) return null;
            
            const prepareSentences = (text) => {
                return text
                    .replace(/p\.m\./gi, 'pm')
                    .replace(/a\.m\./gi, 'am')
                    .split(/[.?!]/)
                    .map(s => s.replace(/\s+/g, ' ').trim().toLowerCase())
                    .filter(s => s.length > 0);
            };

            const sampleSents = prepareSentences(q.sample_answer);
            const userSents = prepareSentences(userResult);
            
            let maxScore = sampleSents.length > 0 ? sampleSents.length : 1;
            let correctCount = 0;
            
            sampleSents.forEach((sent, index) => {
                if (userSents[index] === sent) correctCount++;
            });

            if (maxScore === 1 && correctCount === 0) {
                const cleanUser = userResult.replace(/[^\w\s]/gi, '').replace(/\s+/g, ' ').trim().toLowerCase();
                const cleanSample = q.sample_answer.replace(/[^\w\s]/gi, '').replace(/\s+/g, ' ').trim().toLowerCase();
                if (cleanUser === cleanSample && cleanSample !== "") correctCount = 1;
            }
            return `${correctCount}/${maxScore}`;
        }

        async function submitEntireTest() {
            if (!currentUserId) return alert("Please log in first.");

            stopTimer();

            let payloads = [];

            for (let i = 0; i < testQuestions.length; i++) {
                const q = testQuestions[i];
                const ans = extractAnswerFromUI(q, i);
                
                if (!ans || ans === "." || ans === "?" || ans === "!" || ans.includes("____")) {
                    alert(`Question ${i + 1} is incomplete. Please finish it before submitting the test.`);
                    showSlide(i); 
                    
                    startTimer();
                    return;
                }

                payloads.push({
                    task_id: q.id,
                    task_type: taskType,
                    response_content: ans,
                    user_id: currentUserId,
                    score: calculateScore(q, ans),
                    time_left_seconds: timeRemaining // Теперь мы сохраняем оставшееся время (может быть с минусом)
                });
            }

            try {
                document.body.style.cursor = 'wait';
                const { error } = await db.from('student_responses').insert(payloads);
                if (error) throw error;
                
                window.location.reload();
            } catch (err) {
                alert("Error saving test: " + err.message);
                startTimer();
            } finally {
                document.body.style.cursor = 'default';
            }
        }
    </script>
</body>
</html>
