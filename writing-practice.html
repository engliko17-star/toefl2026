<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Engine — TOEFL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .word-slot { min-width: 90px; min-height: 40px; transition: all 0.2s; }
        .sortable-ghost { opacity: 0.2; background-color: #f1f5f9; border: 2px dashed #94a3b8; color: transparent; }

        /* Не даём браузеру перехватывать жест как скролл страницы во время drag на тач-устройствах */
        .draggable-word { touch-action: none; }
        /* Элемент под пальцем в fallback-режиме (без этого он почти не виден) */
        .sortable-fallback { opacity: 1 !important; transform: scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,.18); }
        /* Пустой пропуск без размеров — это линия нулевой ширины: мышью
           в неё попасть можно, пальцем практически нет. */
        .word-slot { touch-action: none; min-width: 72px; min-height: 36px; }
        .word-slot:empty { background: rgba(99, 102, 241, 0.06); border-radius: 8px 8px 0 0; }
        /* Банк слов тоже не должен отдавать жест прокрутке */
        [id^="wordBankContainer-"] { touch-action: none; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-900 min-h-screen flex flex-col antialiased">

    <header class="bg-white px-6 py-4 flex items-center justify-between border-b border-gray-100 shrink-0 sticky top-0 z-50 shadow-sm">
        
        <div class="flex items-center space-x-4">
            <a id="backBtn" href="#" class="flex items-center justify-center w-10 h-10 rounded-xl border border-gray-200 bg-gray-50 hover:bg-gray-100 transition">
                <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Symbols/Left%20Arrow.png" class="w-5 h-5" alt="Back" />
            </a>
            <div>
                <h1 class="text-sm font-bold text-slate-900" id="testHeaderTitle">Loading Test...</h1>
                <p class="text-[11px] font-bold text-gray-400 mt-0.5 uppercase tracking-wider">Writing Section</p>
            </div>
        </div>

        <div id="topNavigation" class="hidden flex items-center space-x-6">
            
            <div class="flex items-center space-x-4">
                <div class="text-sm font-bold text-slate-700">
                    Question <span id="current-q-label">1</span> of <span id="total-q-label">1</span>
                </div>
                
                <div class="flex items-center space-x-1.5 text-sm font-bold text-slate-700 bg-gray-50 border border-gray-200 px-3 py-1.5 rounded-lg shadow-sm">
                    <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Travel%20and%20places/Stopwatch.png" class="w-4 h-4" alt="Clock" />
                    <span id="timerDisplay" class="tabular-nums tracking-wide transition-colors duration-300">00:00</span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button id="btn-prev" onclick="prevSlide()" class="flex items-center px-4 py-2 text-sm font-bold text-slate-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Symbols/Left%20Arrow.png" class="w-4 h-4 mr-1" alt="Back" /> Back
                </button>
                
                <button id="btn-next" onclick="nextSlide()" class="flex items-center px-4 py-2 text-sm font-bold text-white bg-slate-900 hover:bg-slate-800 rounded-lg shadow-sm transition-colors">
                    Next <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Symbols/Right%20Arrow.png" class="w-4 h-4 ml-1" alt="Next" />
                </button>

                <button id="btn-submit" onclick="submitEntireTest()" class="hidden flex items-center px-4 py-2 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-sm transition-colors">
                    Submit <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Symbols/Check%20Mark%20Button.png" class="w-4 h-4 ml-1" alt="Submit" />
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col overflow-hidden relative bg-[#f8f9fa]" id="sliderContainer">
        <div class="flex-1 flex items-center justify-center">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-slate-900"></div>
        </div>
    </main>

    <div id="timeModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl flex flex-col items-center text-center transform scale-100 transition-transform">
            <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Travel%20and%20places/Alarm%20Clock.png" class="w-24 h-24 mb-5 drop-shadow-md" alt="Time up" />
            <h3 class="text-2xl font-black text-slate-800 mb-2">Время вышло!</h3>
            <p class="text-slate-500 text-sm font-medium mb-8 leading-relaxed">Отведенное на это задание время закончилось. Таймер продолжит идти в минус, чтобы вы увидели, сколько дополнительного времени вам потребовалось.</p>
            <button onclick="continueAfterTimeUp()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl hover:bg-slate-800 transition shadow-md active:scale-[0.98]">
                Продолжить
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // WRITING PRACTICE: Build a Sentence / Email / Academic Discussion
        // ==========================================
        // После ревизии:
        //  • один клиент базы (тот, что создал auth.js) и проверка через requireAuth;
        //  • тип задания берётся из самого задания, а не из адреса страницы;
        //  • набор собирается так же, как в списке: тот же test_id, тот же тип,
        //    без заданий «только для мока»;
        //  • эссе сохраняется без балла — его ставит преподаватель (раньше
        //    сохранялось «0/6.0», и работа выглядела уже проверенной на 0);
        //  • ученица видит и правки, и объяснение преподавателя;
        //  • текст эссе и собранные предложения сохраняются на устройстве на
        //    каждом шаге — перезагрузка или вылет не теряют работу;
        //  • «Resume Test» показывает только задания, на которые ещё нет ответа,
        //    и не задваивает уже сохранённые ответы.
        const db = window.supabaseClient;
        const urlParams = new URLSearchParams(window.location.search);
        const TASK_TYPES = ['sentence', 'email', 'academic'];
        const urlType = String(urlParams.get('type') || '').toLowerCase();
        let taskType = TASK_TYPES.includes(urlType) ? urlType : 'sentence';
        const taskId = urlParams.get('id');

        let testQuestions = [];       // весь набор (для разбора)
        let practiceQuestions = [];   // то, что осталось сделать
        let studentResponses = [];    // последний ответ на каждое задание набора
        let currentSlide = 0;
        let isTestCompleted = false;
        let wordCountStates = {};
        let currentUserId = null;
        let draftKey = null;
        let isSubmitting = false;
        let dragJustEnded = false;

        // ---------- ПОПЫТКИ ЭССЕ (Email и Academic Discussion) ----------
        // До 3 попыток на одно эссе. Следующая открывается, когда преподаватель
        // проверил предыдущую. Каждая попытка — отдельная строка student_responses,
        // старые не удаляются. Номер попытки (attempt_no) ставит база; пока колонки
        // нет, попытки упорядочиваются по дате отправки.
        const MAX_ATTEMPTS = 3;
        const wantRewrite = urlParams.get('rewrite') === '1';
        const CRITERIA = [
            { key: 'grammar_score',    label: 'Grammar',               bar: 'bg-indigo-500' },
            { key: 'vocabulary_score', label: 'Vocabulary',            bar: 'bg-sky-500' },
            { key: 'purpose_score',    label: 'Communicative purpose', bar: 'bg-emerald-500' }
        ];
        let isEssaySet = false;     // эссе из одного задания — тогда работают попытки
        let essayAttempts = [];     // все попытки этого эссе, от первой к последней
        let attemptNo = 1;          // номер попытки, которая сейчас пишется

        function critVal(r, key) {
            if (!r || r[key] === null || r[key] === undefined || r[key] === '') return null;
            const v = parseFloat(r[key]);
            return isNaN(v) ? null : v;
        }
        function fmtScore(v) {
            return v === null || v === undefined ? '' : (Number.isInteger(v) ? String(v) : String(+v.toFixed(2)));
        }
        function canStartNextAttempt() {
            const last = essayAttempts[essayAttempts.length - 1];
            return essayAttempts.length > 0 && essayAttempts.length < MAX_ATTEMPTS && isReviewed(last);
        }
        function resultsUrl() {
            return `writing-practice.html?type=${encodeURIComponent(taskType)}&id=${encodeURIComponent(taskId)}`;
        }
        function sortAttempts(list) {
            return [...list].sort((a, b) => {
                const an = Number(a.attempt_no), bn = Number(b.attempt_no);
                if (an && bn && an !== bn) return an - bn;
                const at = String(a.created_at || ''), bt = String(b.created_at || '');
                if (at !== bt) return at < bt ? -1 : 1;
                return Number(a.id) - Number(b.id);
            });
        }

        function wpEsc(s) {
            return String(s === null || s === undefined ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function normalizeType(t) {
            const s = String(t || '').toLowerCase();
            if (s.includes('sentence')) return 'sentence';
            if (s.includes('email')) return 'email';
            if (s.includes('academic') || s.includes('discussion')) return 'academic';
            return null;
        }

        function parseJson(v, fallback) {
            if (typeof v !== 'string') return v === null || v === undefined ? fallback : v;
            try { return JSON.parse(v); } catch (e) { return fallback; }
        }

        // Счёт слов как в обычных редакторах и в мини-моке: токены через пробел
        function countWords(text) {
            const trimmed = (text || '').trim();
            return trimmed ? trimmed.split(/\s+/).length : 0;
        }

        // Сравниваются слова и их порядок; знаки препинания не влияют,
        // апостроф влияет (its ≠ it's). Та же функция — в моках и в профиле.
        function normalizeForCompare(text) {
            return String(text || '')
                .replace(/[‘’‛`´]/g, "'")
                .toLowerCase()
                .replace(/[^\p{L}\p{N}'\s-]/gu, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // Балл эссе в базе бывает в двух видах: «4.5» и «4.5/6.0» (так сохранялись
        // оценки раньше). «0/6.0» — заглушка старой практики, а не оценка.
        function essayScoreOf(r) {
            if (!r || r.score === null || r.score === undefined) return null;
            const s = String(r.score).trim();
            if (!s || /^0\s*\/\s*6(\.0+)?$/.test(s)) return null;
            const m = s.match(/^(\d+(?:\.\d+)?)(?:\s*\/\s*6(?:\.0+)?)?$/);
            return m ? parseFloat(m[1]) : null;
        }
        function isEssayGraded(r) { return essayScoreOf(r) !== null; }
        // Попытка проверена: есть балл, правки, объяснение или оценка по критерию.
        // Так же считает база (wa_attempt_reviewed) и список заданий.
        function isReviewed(r) {
            if (!r) return false;
            const filled = v => String(v || '').trim() !== '';
            return filled(r.correction) || filled(r.teacher_correction) || essayScoreOf(r) !== null
                || CRITERIA.some(c => critVal(r, c.key) !== null);
        }

        // --- ЛОГИКА ТАЙМЕРА ---
        let timerInterval = null;
        let timeRemaining = 0;
        let timeExpiredModalShown = false;

        function initTimer() {
            timeRemaining = (taskType === 'email' ? 7 : taskType === 'academic' ? 10 : 6) * 60;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const display = document.getElementById('timerDisplay');
            display.innerText = formatTime(timeRemaining);
            timerInterval = setInterval(() => {
                timeRemaining--;
                display.innerText = formatTime(timeRemaining);
                if (timeRemaining < 0) {
                    display.classList.remove('text-slate-700');
                    display.classList.add('text-red-500');
                }
                saveDraft();
                if (timeRemaining === 0 && !timeExpiredModalShown) {
                    stopTimer();
                    showTimeExpiredModal();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function formatTime(seconds) {
            const isNegative = seconds < 0;
            const absSeconds = Math.abs(seconds);
            const m = Math.floor(absSeconds / 60).toString().padStart(2, '0');
            const s = (absSeconds % 60).toString().padStart(2, '0');
            return isNegative ? `-${m}:${s}` : `${m}:${s}`;
        }

        function showTimeExpiredModal() {
            timeExpiredModalShown = true;
            const modal = document.getElementById('timeModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function continueAfterTimeUp() {
            const modal = document.getElementById('timeModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            startTimer();
        }
        // --- КОНЕЦ ЛОГИКИ ТАЙМЕРА ---

        // --- ЧЕРНОВИК НА УСТРОЙСТВЕ ---
        function readDraft() {
            if (!draftKey) return null;
            try { return JSON.parse(localStorage.getItem(draftKey)) || null; } catch (e) { return null; }
        }
        function clearDraft() {
            if (!draftKey) return;
            try { localStorage.removeItem(draftKey); } catch (e) {}
        }
        function saveDraft() {
            if (!draftKey || isTestCompleted || !practiceQuestions.length) return;
            const answers = {};
            practiceQuestions.forEach((q, i) => {
                if (taskType === 'sentence') {
                    answers[q.id] = [...document.querySelectorAll(`[id^="slot-${i}-"]`)].map(sl => sl.children.length ? sl.children[0].textContent.trim() : null);
                } else {
                    const area = document.getElementById(`editorArea-${i}`);
                    if (area) answers[q.id] = area.value;
                }
            });
            try {
                localStorage.setItem(draftKey, JSON.stringify({ v: 1, type: taskType, answers, timeRemaining, timeExpiredModalShown, savedAt: new Date().toISOString() }));
            } catch (e) { /* хранилище недоступно — работаем без черновика */ }
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function showPageMessage(message) {
            document.getElementById('topNavigation').classList.add('hidden');
            document.getElementById('sliderContainer').innerHTML = `
                <div class="flex-1 flex items-center justify-center p-10">
                    <div class="text-center max-w-md">
                        <p class="text-slate-700 font-bold mb-5">${wpEsc(message)}</p>
                        <a href="task-list.html?type=${encodeURIComponent(taskType)}" class="inline-flex bg-slate-900 text-white px-6 py-3 rounded-xl text-sm font-bold hover:bg-slate-800">Back to the list</a>
                    </div>
                </div>`;
        }

        function setBackLink() {
            document.getElementById('backBtn').href = `task-list.html?type=${encodeURIComponent(taskType)}`;
        }
        setBackLink();

        document.addEventListener('DOMContentLoaded', async () => {
            await fetchTestContext();
        });

        async function fetchTestContext() {
            try {
                if (typeof requireAuth !== 'function' || !db) throw new Error('Page failed to load');
                const user = await requireAuth();
                if (!user) return;   // auth.js уже показал нужный экран
                currentUserId = user.id;

                if (!taskId) return showPageMessage('No task selected.');

                const { data: firstTask, error: firstErr } = await db.from('writing_tasks').select('*').eq('id', taskId).maybeSingle();
                if (firstErr) throw firstErr;
                if (!firstTask) return showPageMessage('This task is not available.');

                const realType = normalizeType(firstTask.type);
                if (!realType) return showPageMessage('This task has an unknown type. Please tell your teacher.');
                taskType = realType;
                setBackLink();

                if (firstTask.test_id !== null && firstTask.test_id !== undefined) {
                    // Тот же набор, что показывает список: тот же test_id и тип,
                    // без заданий «только для мока» (если открыто не мок-задание)
                    let q = db.from('writing_tasks').select('*').eq('test_id', firstTask.test_id).ilike('type', firstTask.type);
                    if (firstTask.is_mock_only !== true) q = q.or('is_mock_only.eq.false,is_mock_only.is.null');
                    const { data: allTestTasks, error: setErr } = await q.order('id', { ascending: true });
                    if (setErr) throw setErr;
                    testQuestions = (allTestTasks && allTestTasks.length) ? allTestTasks : [firstTask];
                    document.getElementById('testHeaderTitle').innerText = `Practice Set ${firstTask.test_id}`;
                } else {
                    testQuestions = [firstTask];
                    document.getElementById('testHeaderTitle').innerText = firstTask.title || 'Writing Exercise';
                }

                testQuestions.forEach(q => {
                    q.structure = parseJson(q.structure, []);
                    q.bank = parseJson(q.bank, []);
                    q.instructions = parseJson(q.instructions, []);
                    q.peers = parseJson(q.peers, []);
                });

                const questionIds = testQuestions.map(q => q.id);
                const { data: resps, error: respErr } = await db.from('student_responses')
                    .select('*')
                    .eq('user_id', currentUserId)
                    .in('task_id', questionIds)
                    .order('created_at', { ascending: false });
                if (respErr) throw respErr;

                // По одному (последнему) ответу на задание: раньше в итог шли все
                // строки подряд, включая повторы, и балл набора завышался
                const latest = {};
                (resps || []).forEach(r => { if (!latest[String(r.task_id)]) latest[String(r.task_id)] = r; });
                studentResponses = testQuestions.map(q => latest[String(q.id)]).filter(Boolean);

                practiceQuestions = testQuestions.filter(q => !latest[String(q.id)]);

                // Эссе: все попытки по порядку; новая попытка — по кнопке Rewrite (?rewrite=1),
                // только если прошлая проверена и попыток меньше трёх
                isEssaySet = taskType !== 'sentence' && testQuestions.length === 1;
                if (isEssaySet) {
                    const q0 = testQuestions[0];
                    essayAttempts = sortAttempts((resps || []).filter(r => String(r.task_id) === String(q0.id)));
                    if (wantRewrite) {
                        if (canStartNextAttempt()) {
                            practiceQuestions = [q0];
                            attemptNo = essayAttempts.length + 1;
                        } else {
                            history.replaceState(null, '', resultsUrl());
                        }
                    }
                }

                isTestCompleted = practiceQuestions.length === 0;
                // У 2-й и 3-й попытки свой черновик: текст прошлой попытки в поле не попадает
                draftKey = `wp_draft_v1:${currentUserId}:${questionIds.join(',')}` + (attemptNo > 1 ? `:a${attemptNo}` : '');
                if (isTestCompleted) clearDraft();
                if (attemptNo > 1) {
                    document.getElementById('testHeaderTitle').innerText += ` · Attempt ${attemptNo} of ${MAX_ATTEMPTS}`;
                }

                renderTestSlider();
            } catch (e) {
                console.error('Error loading test:', e);
                document.getElementById('sliderContainer').innerHTML = `<div class="text-center p-10 text-red-500 font-bold">Error loading test data. Check your connection and refresh the page.</div>`;
            }
        }

        function renderTestSlider() {
            const container = document.getElementById('sliderContainer');
            const topNav = document.getElementById('topNavigation');
            container.innerHTML = '';

            if (isTestCompleted) {
                if (topNav) topNav.classList.add('hidden');
                container.innerHTML = generateFullResultsView();
                return;
            }

            if (topNav) topNav.classList.remove('hidden');
            const draft = readDraft();
            initTimer();
            if (draft && draft.type === taskType && typeof draft.timeRemaining === 'number') {
                timeRemaining = draft.timeRemaining;
                timeExpiredModalShown = !!draft.timeExpiredModalShown || timeRemaining <= 0;
            }

            practiceQuestions.forEach((q, index) => {
                wordCountStates[index] = true;
                const displayClass = index === 0 ? 'flex' : 'hidden';
                container.insertAdjacentHTML('beforeend',
                    `<div id="slide-${index}" class="slide-container ${displayClass} flex-col h-full w-full absolute inset-0 bg-white">${generatePracticeView(q, index)}</div>`);
            });

            const saved = (draft && draft.type === taskType && draft.answers) || {};
            if (taskType === 'sentence') {
                practiceQuestions.forEach((q, index) => initSentenceDragAndDrop(q, index, saved[q.id]));
            } else {
                practiceQuestions.forEach((q, index) => {
                    const area = document.getElementById(`editorArea-${index}`);
                    if (area && typeof saved[q.id] === 'string') area.value = saved[q.id];
                    updateWordCount(index);
                });
            }

            startTimer();
            updateTopNavigation(0);
        }

        function updateTopNavigation(index) {
            const total = practiceQuestions.length;
            document.getElementById('current-q-label').innerText = index + 1;
            document.getElementById('total-q-label').innerText = total;

            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const btnSubmit = document.getElementById('btn-submit');

            btnPrev.disabled = index === 0;
            btnPrev.classList.toggle('opacity-50', index === 0);
            btnPrev.classList.toggle('cursor-not-allowed', index === 0);

            if (index === total - 1) {
                btnNext.classList.add('hidden');
                btnSubmit.classList.remove('hidden');
                btnSubmit.classList.add('flex');
            } else {
                btnNext.classList.remove('hidden');
                btnNext.classList.add('flex');
                btnSubmit.classList.add('hidden');
            }

        // ---------- РАЗБОР ЭССЕ С ПОПЫТКАМИ ----------

        function attemptDate(r) {

        function attemptStatusHTML(r) {

            if (isReviewed(r)) return `<span class="font-bold text-emerald-700">Reviewed</span>`;
            return `<span class="font-bold text-amber-600">Waiting for review</span>`;
        }

        function criteriaBarsHTML() {

                <div class="flex-1 grid grid-cols-1 md:grid-cols-[300px_1fr] lg:grid-cols-[380px_1fr] divide-y md:divide-y-0 md:divide-x divide-gray-100 h-full overflow-hidden w-full bg-white relative">
                    <div class="flex flex-col h-full bg-white relative z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
                        <div class="p-6 md:p-8 overflow-y-auto flex-1 flex flex-col">
                            <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                                <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Bar%20Chart.png" class="w-5 h-5" alt="Chart" /> Results Overview
                            </h2>

                            <div class="${timeCardHtml ? 'grid grid-cols-2 gap-3' : 'flex flex-col'} mb-2">
                                <div class="bg-emerald-50 border border-emerald-100 rounded-3xl p-5 flex flex-col items-center justify-center shadow-sm shrink-0">
                                    <span class="text-[10px] font-bold text-emerald-600 uppercase tracking-wider mb-1.5">${taskType === 'sentence' ? 'Total Score' : 'Teacher Score'}</span>
                                    <span class="${timeCardHtml ? 'text-2xl' : 'text-4xl'} font-black text-emerald-700">${wpEsc(scoreDisplay)}</span>
                                </div>
                                ${timeCardHtml}
                            </div>

                            ${leftPanelContent}
                        </div>

                        <div class="p-6 border-t border-gray-100 bg-gray-50/50 shrink-0">
                            <a href="task-list.html?type=${encodeURIComponent(taskType)}" class="w-full flex items-center justify-center space-x-2 py-3.5 bg-white border border-gray-200 text-slate-700 font-bold rounded-xl text-sm hover:bg-gray-50 hover:text-slate-900 hover:border-gray-300 transition shadow-sm">
                                <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/File%20Folder.png" class="w-4 h-4" alt="Dashboard" />
                                <span>Back to Dashboard</span>
                            </a>
                        </div>
                    </div>

                    <div class="bg-[#f4f6f8] h-full overflow-y-auto p-4 md:p-8">
                        <div class="max-w-3xl mx-auto space-y-6 pb-12">
                            ${questionsHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function getEndMark(q) {
            const lastChar = (q.sample_answer || '').trim().slice(-1);
            return ['.', '?', '!'].includes(lastChar) ? lastChar : '.';
        }

        function generatePracticeView(q, qIndex) {
            if (taskType === 'sentence') {
                let sentenceHTML = '';
                const items = Array.isArray(q.structure) ? q.structure : [];
                items.forEach((item, slotIndex) => {
                    if (item.type === 'text') {
                        sentenceHTML += `<div class="inline-flex items-center justify-center px-1.5 py-2 text-sm font-bold text-slate-800 select-none">${wpEsc(item.value)}</div>`;
                    } else if (item.type === 'slot') {
                        sentenceHTML += `<div class="word-slot inline-flex items-center justify-center border-b-2 border-gray-300 mx-1 pb-1 align-bottom" id="slot-${qIndex}-${slotIndex}"></div>`;
                    }
                });
                // Знак в конце — только если структура сама им не заканчивается (иначе было «?.»)
                const last = items[items.length - 1];
                if (!(last && last.type === 'text' && /[.?!]\s*$/.test(String(last.value || '')))) {
                    sentenceHTML += `<span class="text-2xl font-bold text-slate-400 select-none ml-1 align-bottom leading-none">${getEndMark(q)}</span>`;
                }

                const avatarLeft = q.avatar_left ? wpEsc(q.avatar_left) : `<img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/People%20with%20professions/Man%20Teacher%20Light%20Skin%20Tone.png" class="w-8 h-8 inline-block" alt="Man" />`;
                const avatarRight = q.avatar_right ? wpEsc(q.avatar_right) : `<img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/People%20with%20professions/Woman%20Teacher%20Light%20Skin%20Tone.png" class="w-8 h-8 inline-block" alt="Woman" />`;

                return `
                    <div class="flex-1 overflow-y-auto flex flex-col items-center justify-center p-6 w-full">
                        <div class="max-w-4xl w-full">
                            <h2 class="text-xl font-bold text-center tracking-tight mb-8 text-slate-800">${q.title || 'Make an appropriate sentence'}</h2>
                            <div class="w-full space-y-8 mb-12 bg-[#f8f9fa] p-8 rounded-3xl border border-gray-100 shadow-sm">
                                <div class="flex items-start space-x-4">
                                    <div class="flex items-center justify-center w-12 h-12 bg-blue-50 border border-blue-100 rounded-full shrink-0 shadow-sm">${avatarLeft}</div>
                                    <div class="bg-white border border-gray-100 rounded-2xl px-5 py-3 text-sm font-medium text-slate-700 max-w-md mt-1">${q.prompt_context || ''}</div>
                                </div>
                                <div class="flex items-start space-x-4 pt-4 border-t border-dashed border-gray-200">
                                    <div class="flex items-center justify-center w-12 h-12 bg-rose-50 border border-rose-100 rounded-full shrink-0 shadow-sm">${avatarRight}</div>
                                    <div class="flex-1 flex flex-wrap items-end gap-y-3 pt-2" id="sentenceDropzoneContainer-${qIndex}">${sentenceHTML}</div>
                                </div>
                            </div>
                            <div class="w-full max-w-2xl mx-auto">
                                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider text-center mb-3">Drag words to the empty slots above, or tap a word to place it</p>
                                <div class="flex flex-wrap justify-center gap-2.5 bg-gray-50 border border-gray-200 p-5 rounded-3xl min-h-[80px]" id="wordBankContainer-${qIndex}"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (taskType === 'email') {
                const instructionsHTML = (Array.isArray(q.instructions) ? q.instructions : []).map(li => `<li>${li}</li>`).join('');
                return `
                    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100 overflow-hidden">
                        <div class="p-8 overflow-y-auto space-y-6 bg-white">
                            <h2 class="text-lg font-bold mb-4 text-slate-900">${q.title || 'Write an Email'}</h2>
                            <div class="prose prose-slate max-w-none">
                                <p class="text-sm text-slate-700 leading-relaxed font-medium">${q.prompt_context || ''}</p>
                                <div class="h-px bg-gray-100 my-6"></div>
                                <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wide">Write an email to ${q.meta_to || 'Daniel'}. In the email, do each of the following:</h3>
                                <ul class="list-disc pl-5 text-sm text-slate-600 space-y-2.5 mt-3">${instructionsHTML}</ul>
                            </div>
                        </div>
                        <div class="p-6 bg-[#f8f9fa] flex flex-col overflow-hidden h-full">
                            <div class="bg-white border border-gray-200 rounded-3xl p-6 flex flex-col flex-1 shadow-sm overflow-hidden">
                                <div class="space-y-1.5 text-xs text-slate-500 mb-4 border-b border-gray-100 pb-4">
                                    <div class="flex items-center mt-1"><span class="w-16 font-bold text-gray-400">To:</span> <span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded-md font-semibold">${q.meta_to || 'Recipient'}</span></div>
                                    <div class="flex items-center"><span class="w-16 font-bold text-gray-400">Subject:</span> <span class="text-slate-800 font-semibold">${q.meta_subject || 'Topic'}</span></div>
                                </div>
                                ${generateToolbar(qIndex)}
                                <div class="flex-1 relative overflow-hidden">
                                    <textarea id="editorArea-${qIndex}" oninput="onEditorInput(${qIndex})" spellcheck="false" autocomplete="off" placeholder="Write your response here..." class="w-full h-full resize-none border-0 outline-none p-1 text-sm leading-relaxed text-slate-800 placeholder-gray-300 focus:ring-0"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                const peersHTML = (Array.isArray(q.peers) ? q.peers : []).map(peer => `
                    <div class="flex items-start space-x-3 bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                        <div class="flex flex-col items-center shrink-0">
                            <div class="w-10 h-10 rounded-full bg-slate-50 border border-gray-100 flex items-center justify-center text-lg">${peer.avatar || '👤'}</div>
                            <span class="text-[9px] font-bold text-gray-400 mt-1">${peer.name || ''}</span>
                        </div>
                        <p class="text-xs text-slate-600 leading-relaxed mt-1">${peer.text || ''}</p>
                    </div>
                `).join('');

                return `
                    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100 overflow-hidden">
                        <div class="p-8 overflow-y-auto space-y-6 bg-white">
                            <h2 class="text-lg font-bold mb-4 text-slate-900">${q.title || 'Academic Discussion'}</h2>
                            ${q.instruction_box ? `<div class="bg-teal-50 border border-teal-100 rounded-xl px-4 py-3 text-xs font-bold text-teal-800 mb-6">${q.instruction_box}</div>` : ''}
                            <div class="flex items-start space-x-4 bg-gray-50/80 p-5 rounded-2xl border border-gray-100">
                                <div class="flex flex-col items-center shrink-0">
                                    <div class="text-2xl p-2 bg-white rounded-full shadow-sm border border-gray-100">${q.professor_avatar || '🎓'}</div>
                                    <span class="text-[10px] font-bold text-slate-800 mt-2">${q.professor_name || 'Professor'}</span>
                                </div>
                                <p class="text-xs text-slate-600 leading-relaxed font-medium pt-1">${q.professor_prompt || ''}</p>
                            </div>
                        </div>
                        <div class="p-6 bg-[#f8f9fa] flex flex-col overflow-hidden h-full space-y-4">
                            <div class="flex-1 overflow-y-auto space-y-3 pr-2 max-h-[45%]">${peersHTML}</div>
                            <div class="bg-white border border-gray-200 rounded-3xl p-5 flex flex-col h-[55%] shadow-sm overflow-hidden">
                                ${generateToolbar(qIndex)}
                                <div class="flex-1 overflow-hidden relative">
                                    <textarea id="editorArea-${qIndex}" oninput="onEditorInput(${qIndex})" spellcheck="false" autocomplete="off" placeholder="Write your contribution here..." class="w-full h-full resize-none border-0 outline-none text-sm leading-relaxed text-slate-800 placeholder-gray-300 focus:ring-0 p-1"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function generateToolbar(qIndex) {
            return `
                <div class="flex items-center justify-between bg-gray-50 border border-gray-100 px-3 py-1.5 rounded-xl mb-3 text-[11px] font-bold text-slate-600 shrink-0">
                    <span class="text-gray-400">TOEFL Editor</span>
                    <button onclick="toggleWordCount(${qIndex})" class="flex items-center space-x-1.5 text-gray-400 hover:text-slate-800 transition py-1 px-2 rounded bg-white border border-gray-200 shadow-sm">
                        <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Body%20parts/Eye.png" class="w-3 h-3" alt="Eye" /> <span id="wordCountLabel-${qIndex}">Words : 0</span>
                    </button>
                </div>
            `;
        }

        function initSentenceDragAndDrop(q, qIndex, savedSlots) {
            const bankContainer = document.getElementById(`wordBankContainer-${qIndex}`);
            const slots = [...document.querySelectorAll(`[id^="slot-${qIndex}-"]`)];
            if (!bankContainer) return;

            shuffleArray(Array.isArray(q.bank) ? q.bank : []).forEach(word => {
                bankContainer.insertAdjacentHTML('beforeend', `<div class="draggable-word bg-white border border-gray-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-xl shadow-sm cursor-grab active:cursor-grabbing hover:border-slate-400 select-none">${wpEsc(word)}</div>`);
            });

            // Продолжение: раскладываем сохранённые слова по ячейкам
            if (Array.isArray(savedSlots)) {
                savedSlots.forEach((w, k) => {
                    if (!w || !slots[k]) return;
                    const el = [...bankContainer.querySelectorAll('.draggable-word')].find(x => x.textContent.trim() === w);
                    if (el) slots[k].appendChild(el);
                });
            }

            const sortableTouchOptions = {
                // КРИТИЧНО ДЛЯ ANDROID/ПЛАНШЕТОВ: без forceFallback SortableJS
                // использует нативный HTML5 drag-and-drop, который на Android
                // с сенсорным вводом не запускает перетаскивание.
                forceFallback: true,
                fallbackOnBody: true,
                fallbackTolerance: 3
            };
            const onEnd = () => { dragJustEnded = true; setTimeout(() => { dragJustEnded = false; }, 80); saveDraft(); };

            if (typeof Sortable !== 'undefined') {
                new Sortable(bankContainer, { group: `shared-${qIndex}`, animation: 150, ghostClass: 'sortable-ghost', onEnd, ...sortableTouchOptions });
                slots.forEach(slot => {
                    new Sortable(slot, {
                        group: `shared-${qIndex}`, animation: 150, ghostClass: 'sortable-ghost', onEnd,
                        ...sortableTouchOptions,
                        onAdd: function (evt) {
                            if (evt.to.children.length > 1) {
                                Array.from(evt.to.children).forEach(child => { if (child !== evt.item) bankContainer.appendChild(child); });
                            }
                        }
                    });
                });
            }

            // Размещение нажатием (телефон, или если SortableJS не загрузился)
            const slide = document.getElementById(`slide-${qIndex}`);
            slide.addEventListener('click', e => {
                if (dragJustEnded) return;
                const word = e.target.closest('.draggable-word');
                if (!word || !slide.contains(word)) return;
                if (word.parentElement === bankContainer) {
                    const empty = slots.find(s => s.children.length === 0);
                    if (empty) empty.appendChild(word);
                } else {
                    bankContainer.appendChild(word);
                }
                saveDraft();
            });
        }

        function onEditorInput(qIndex) {
            updateWordCount(qIndex);
            saveDraft();
        }

        function updateWordCount(qIndex) {
            const area = document.getElementById(`editorArea-${qIndex}`);
            if (!area) return;
            const label = document.getElementById(`wordCountLabel-${qIndex}`);
            if (label) label.innerText = wordCountStates[qIndex] ? `Words : ${countWords(area.value)}` : 'Hidden';
        }

        function toggleWordCount(qIndex) {
            wordCountStates[qIndex] = !wordCountStates[qIndex];
            updateWordCount(qIndex);
        }

        function extractAnswerFromUI(q, qIndex) {
            if (taskType === 'sentence') {
                const parts = [];
                let filled = 0;
                (Array.isArray(q.structure) ? q.structure : []).forEach((item, slotIndex) => {
                    if (item.type === 'text') parts.push(item.value);
                    else if (item.type === 'slot') {
                        const s = document.getElementById(`slot-${qIndex}-${slotIndex}`);
                        if (s && s.children.length > 0) { parts.push(s.children[0].textContent.trim()); filled++; }
                        else parts.push('____');
                    }
                });
                if (filled === 0) return '';
                let userResult = parts.join(' ').replace(/\s+/g, ' ').replace(/\s+([.?!,;:])/g, '$1').trim();
                if (!['.', '?', '!'].includes(userResult.slice(-1))) userResult += getEndMark(q);
                return userResult;
            }
            return (document.getElementById(`editorArea-${qIndex}`)?.value || '').trim();
        }

        // Build a Sentence — проверка сразу: «1/1» или «0/1».
        // Эссе — без балла (null): его ставит преподаватель.
        function calculateScore(q, userResult) {
            if (taskType !== 'sentence') return null;
            if (!q.sample_answer) return null;
            return normalizeForCompare(userResult) === normalizeForCompare(q.sample_answer) ? '1/1' : '0/1';
        }

        async function submitEntireTest() {
            if (isSubmitting) return;
            if (!currentUserId) return alert('Please log in first.');

            const payloads = [];
            for (let i = 0; i < practiceQuestions.length; i++) {
                const q = practiceQuestions[i];
                const ans = extractAnswerFromUI(q, i);
                if (!ans || ans.includes('____')) {
                    alert(`Question ${i + 1} is incomplete. Please finish it before submitting.`);
                    showSlide(i);
                    return;
                }
                payloads.push({
                    task_id: q.id,
                    task_type: taskType,
                    response_content: ans,
                    user_id: currentUserId,
                    score: calculateScore(q, ans),
                    time_left_seconds: timeRemaining
                });
            }

            isSubmitting = true;
            stopTimer();
            saveDraft();
            const submitBtn = document.getElementById('btn-submit');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            document.body.style.cursor = 'wait';

            try {
                // Если ответ на задание уже есть (вторая вкладка, повторная отправка) —
                // второй раз его не записываем
                const { data: existing, error: exErr } = await db.from('student_responses')
                    .select('task_id').eq('user_id', currentUserId).in('task_id', payloads.map(p => p.task_id));
                if (exErr) throw exErr;
                let toInsert;
                if (isEssaySet) {
                    // Эссе: новая попытка записывается, если с момента открытия страницы
                    // в базе не появилось новых ответов на это задание (вторая вкладка)
                    toInsert = (existing || []).length > essayAttempts.length ? [] : payloads;
                } else {
                    const have = new Set((existing || []).map(r => String(r.task_id)));
                    toInsert = payloads.filter(p => !have.has(String(p.task_id)));
                }
                if (toInsert.length) {
                    const { error } = await db.from('student_responses').insert(toInsert);
                    if (error) throw error;
                }
                clearDraft();
                isTestCompleted = true;
                if (isEssaySet) window.location.replace(resultsUrl());
                else window.location.reload();
            } catch (err) {
                console.error('Error saving test:', err);
                // Правило попыток в базе: прошлая попытка ещё не проверена или все 3 использованы
                if (err && (err.hint === 'wa_wait' || err.hint === 'wa_limit')) {
                    alert(err.message + '\n\nYour text is kept on this device.');
                    window.location.replace(resultsUrl());
                    return;
                }
                alert('Your answers were not saved yet (they are kept on this device).\n\n'
                    + (err && err.code ? 'The server did not accept them — please tell your teacher.\n' : 'Check your internet connection and press Submit again.\n')
                    + (err && err.message ? err.message : ''));
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                startTimer();
            } finally {
                document.body.style.cursor = 'default';
            }
        }
    </script>
</body>
</html>
