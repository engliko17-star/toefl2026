<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Test Environment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        /* Эффект выделения предложений при наведении в режиме Insert Text */
        .clickable-sentence { transition: all 0.2s ease; cursor: pointer; border-radius: 4px; padding: 1px 2px; }
        .insert-mode .clickable-sentence:hover { background-color: #fee2e2; color: #991b1b; }
        .insert-mode .clickable-sentence.selected-sentence { background-color: #ef4444; color: white; font-weight: 500; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-4">
            <a href="read-academic.html" class="text-slate-500 hover:text-slate-800 transition flex items-center text-sm font-medium">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-1.5"></i> Exit Test
            </a>
            <span class="text-slate-300">|</span>
            <h1 id="taskTitle" class="text-base font-bold text-slate-800">Loading Academic Test...</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span id="progressText" class="text-xs font-bold text-slate-700">0 / 0</span>
            <div class="w-32 bg-slate-100 h-2 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden min-h-0">
        
        <section id="passageWrapper" class="w-1/2 bg-white p-8 overflow-y-auto custom-scrollbar border-r border-slate-200 prose max-w-none">
            <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Academic Reading Passage</h2>
            <div id="passageContent" class="text-sm text-slate-700 leading-relaxed space-y-4"></div>
        </section>

        <section class="w-1/2 bg-slate-50/50 p-8 overflow-y-auto custom-scrollbar flex flex-col">
            
            <div id="quizContainer" class="flex-1 flex flex-col justify-between">
                <div class="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-xs">
                    <div class="flex items-center justify-between mb-4">
                        <span id="questionNumber" class="text-xs font-semibold text-indigo-600 uppercase">Question 1</span>
                        <span id="questionTypeBadge" class="px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-md text-[10px] font-bold uppercase tracking-wider">Detail</span>
                    </div>
                    
                    <p id="questionText" class="text-sm font-semibold text-slate-800 mb-6 leading-snug"></p>
                    <div id="optionsContainer" class="space-y-2.5"></div>
                </div>

                <div class="flex items-center justify-between pt-6 border-t border-slate-200 mt-6">
                    <button id="prevBtn" class="px-5 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-700 text-xs font-bold disabled:opacity-50">Previous</button>
                    <button id="nextBtn" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-indigo-600">Next Question</button>
                </div>
            </div>

            <div id="resultsContainer" class="hidden w-full space-y-6 max-w-2xl mx-auto pb-12">
                <div class="bg-white rounded-2xl border border-slate-200 p-6 text-center shadow-xs">
                    <h3 class="text-base font-bold text-slate-800 mb-4">Academic Evaluation Completed!</h3>
                    <div class="bg-slate-50 rounded-xl p-4 flex justify-around mb-4 max-w-sm mx-auto">
                        <div>
                            <span class="text-[10px] text-slate-400 block uppercase font-bold">Accuracy</span>
                            <span id="finalScorePercent" class="text-lg font-black text-slate-800">0%</span>
                        </div>
                        <div class="border-r border-slate-200"></div>
                        <div>
                            <span class="text-[10px] text-slate-400 block uppercase font-bold">Score</span>
                            <span id="finalScoreRaw" class="text-lg font-black text-slate-800">0 / 0</span>
                        </div>
                    </div>
                    <a href="read-academic.html" class="px-6 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl hover:bg-indigo-700 transition">Return to List</a>
                </div>
                <div id="explanationsList" class="space-y-4"></div>
            </div>

        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';

        let currentTask = null, currentQuestionIdx = 0, userAnswers = {};

        const taskTitle = document.getElementById('taskTitle'), progressText = document.getElementById('progressText'), progressBar = document.getElementById('progressBar'), passageContent = document.getElementById('passageContent'), questionNumber = document.getElementById('questionNumber'), questionTypeBadge = document.getElementById('questionTypeBadge'), questionText = document.getElementById('questionText'), optionsContainer = document.getElementById('optionsContainer'), prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn'), quizContainer = document.getElementById('quizContainer'), resultsContainer = document.getElementById('resultsContainer'), explanationsList = document.getElementById('explanationsList'), passageWrapper = document.getElementById('passageWrapper');

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const taskId = urlParams.get('id') || 1;

            try {
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { data, error } = await supabaseClient.from('academic_tasks').select('*').eq('id', taskId).single();
                if (error) throw error;
                currentTask = data;
                if (typeof currentTask.questions === 'string') currentTask.questions = JSON.parse(currentTask.questions);
                
                // Превращаем маркеры [s1], [s2] в красивую HTML разметку
                let formattedPassage = currentTask.passage;
                formattedPassage = formattedPassage.replace(/\[s(\d+)\]\s*([^\[<]+)/g, function(match, id, text) {
                    return `<span class="clickable-sentence" data-sentence="${id}">${text.trim()}</span> `;
                });
                
                taskTitle.innerText = currentTask.title;
                passageContent.innerHTML = formattedPassage;
                showQuestion(0);
            } catch (e) { console.error(e); }
        }

        function showQuestion(idx) {
            currentQuestionIdx = idx;
            const q = currentTask.questions[idx];
            
            progressText.innerText = `${idx + 1} / ${currentTask.questions.length}`;
            progressBar.style.width = `${((idx + 1) / currentTask.questions.length) * 100}%`;
            questionNumber.innerText = `Question ${idx + 1}`;
            questionTypeBadge.innerText = q.type;
            questionText.innerText = q.text;

            // Сбрасываем старые стили выделения предложений в тексте
            document.querySelectorAll('.clickable-sentence').forEach(el => el.classList.remove('selected-sentence'));

            if (q.type === "Insert Text") {
                // Включаем специальный интерактивный режим для левой половины экрана
                passageWrapper.classList.add('insert-mode');
                optionsContainer.innerHTML = `<div class="p-4 bg-amber-50 text-amber-800 rounded-xl border border-amber-200 text-xs font-semibold flex items-center"><i data-lucide="mouse-pointer-click" class="w-4 h-4 mr-2"></i> [INSERT TEXT MODE] Click directly on the sentence inside the left passage text to select your answer!</div>`;
                
                // Если студент уже выбирал предложение ранее, подсвечиваем его
                if (userAnswers[idx] !== undefined) {
                    const activeSent = document.querySelector(`.clickable-sentence[data-sentence="${userAnswers[idx]}"]`);
                    if (activeSent) activeSent.classList.add('selected-sentence');
                }

                // Навешиваем обработчики кликов на текст слева
                document.querySelectorAll('.clickable-sentence').forEach(el => {
                    el.onclick = function() {
                        if (currentTask.questions[currentQuestionIdx].type !== "Insert Text") return;
                        document.querySelectorAll('.clickable-sentence').forEach(s => s.classList.remove('selected-sentence'));
                        this.classList.add('selected-sentence');
                        userAnswers[currentQuestionIdx] = parseInt(this.getAttribute('data-sentence'));
                    };
                });
            } else {
                // Обычный режим вопросов с радиокнопками
                passageWrapper.classList.remove('insert-mode');
                optionsContainer.innerHTML = '';
                q.options.forEach((option, i) => {
                    const isChecked = userAnswers[idx] === i;
                    optionsContainer.innerHTML += `
                        <label class="flex items-center p-3.5 rounded-xl border ${isChecked ? 'border-indigo-600 bg-indigo-50/40 font-semibold' : 'border-slate-200 bg-white'} transition cursor-pointer text-xs">
                            <input type="radio" name="acad_option" value="${i}" ${isChecked ? 'checked' : ''} class="w-4 h-4 mr-3 text-indigo-600">
                            <span>${option}</span>
                        </label>
                    `;
                });

                optionsContainer.querySelectorAll('input').forEach(input => {
                    input.onchange = function() {
                        userAnswers[currentQuestionIdx] = parseInt(this.value);
                        showQuestion(currentQuestionIdx);
                    };
                });
            }

            prevBtn.disabled = idx === 0;
            nextBtn.innerHTML = idx === currentTask.questions.length - 1 ? 'Submit Test' : 'Next Question';
            lucide.createIcons();
        }

        prevBtn.onclick = () => { if (currentQuestionIdx > 0) showQuestion(currentQuestionIdx - 1); };
        nextBtn.onclick = () => {
            if (userAnswers[currentQuestionIdx] === undefined) { alert("Please provide an answer first!"); return; }
            if (currentQuestionIdx < currentTask.questions.length - 1) { showQuestion(currentQuestionIdx + 1); } else { processResults(); }
        };

        function processResults() {
            let correctCount = 0;
            explanationsList.innerHTML = '';
            // Снимаем режим кликов по тексту
            passageWrapper.classList.remove('insert-mode');

            currentTask.questions.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                const isCorrect = userAns === q.correct;
                if (isCorrect) correctCount++;

                let reviewBody = '';
                if (q.type === "Insert Text") {
                    reviewBody = `
                        <div class="text-[11px] space-y-1">
                            <div>Your choice: <span class="font-bold ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}">Sentence ${userAns}</span></div>
                            <div>Correct choice: <span class="font-bold text-emerald-600">Sentence ${q.correct}</span></div>
                        </div>
                    `;
                } else {
                    q.options.forEach((opt, i) => {
                        let bg = 'bg-slate-50 border-slate-100 text-slate-600';
                        if (i === q.correct) bg = 'bg-emerald-50 text-emerald-900 border-emerald-200 font-medium';
                        else if (i === userAns) bg = 'bg-rose-50 text-rose-900 border-rose-200 line-through';
                        reviewBody += `<div class="p-2 rounded-lg text-[11px] border ${bg}">${opt}</div>`;
                    });
                }

                explanationsList.innerHTML += `
                    <div class="bg-white rounded-2xl border ${isCorrect ? 'border-emerald-100' : 'border-rose-100'} p-5 shadow-xs space-y-3">
                        <div class="flex justify-between items-center text-[10px] font-bold ${isCorrect ? 'text-emerald-600' : 'text-rose-600'} uppercase">
                            <span>Question ${idx + 1} — ${isCorrect ? 'Correct' : 'Incorrect'}</span>
                            <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${q.type}</span>
                        </div>
                        <p class="text-xs font-bold text-slate-800">${q.text}</p>
                        <div class="space-y-1.5">${reviewBody}</div>
                        <div class="bg-indigo-50/40 p-3 rounded-xl border border-indigo-100/50 text-[11px] text-indigo-950">
                            <span class="font-bold block text-indigo-900 mb-0.5 uppercase tracking-wider text-[10px]">Explanation:</span> ${q.explanation}
                        </div>
                    </div>
                `;
            });

            const percent = Math.round((correctCount / currentTask.questions.length) * 100);
            localStorage.setItem(`academic_test_score_${currentTask.id}`, percent);

            quizContainer.classList.add('hidden');
            resultsContainer.classList.remove('hidden');
            document.getElementById('finalScorePercent').innerText = `${percent}%`;
            document.getElementById('finalScoreRaw').innerText = `${correctCount} / ${currentTask.questions.length}`;
            lucide.createIcons();
        }

        init();
    </script>
</body>
</html>
