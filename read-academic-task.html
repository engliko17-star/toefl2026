<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academic Reading Task — TOEFL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://gmsdixqjhlycovsgwbzq.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ";
        
        window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        .select-sentence-mode .clickable-sentence { cursor: pointer; border-radius: 4px; transition: background-color 0.2s; }
        .select-sentence-mode .clickable-sentence:hover { background-color: #fee2e2; }
        .select-sentence-mode .clickable-sentence.selected { background-color: #4f46e5; color: white; }

        .insert-square { display: none; margin: 0 4px; cursor: pointer; font-size: 1.2em; color: #94a3b8; transition: all 0.2s; vertical-align: middle; line-height: 1; }
        .insert-text-mode .insert-square { display: inline-block; }
        .insert-text-mode .insert-square:hover { color: #4f46e5; transform: scale(1.3); }
        .insert-text-mode .insert-square.selected { color: #312e81; transform: scale(1.2); }

        .review-correct { background-color: #d1fae5 !important; color: #065f46 !important; border-radius: 4px; padding: 0 2px; }
        .review-wrong { background-color: #fee2e2 !important; color: #991b1b !important; border-radius: 4px; text-decoration: line-through; padding: 0 2px; }
        .review-square-correct { color: #10b981 !important; transform: scale(1.3); display: inline-block !important; }
        .review-square-wrong { color: #ef4444 !important; transform: scale(1.3); display: inline-block !important; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 m-0 p-0" style="height: 100dvh; display: flex; flex-direction: column; overflow: hidden;">

    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-4">
            <a href="read-academic.html" class="text-gray-400 hover:text-slate-900 transition flex items-center text-sm font-bold pt-0.5 cursor-pointer">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Exit Test
            </a>
            <div class="h-4 w-px bg-gray-200"></div>
            <h1 id="passageTitle" class="text-sm font-bold text-slate-900">Loading...</h1>
        </div>
        <div class="flex items-center space-x-3 text-sm font-bold text-slate-500">
            <span id="questionCounter">1 / 3</span>
            <div class="w-24 sm:w-32 bg-gray-100 rounded-full h-2">
                <div id="progressBar" class="bg-indigo-600 h-2 rounded-full transition-all" style="width: 33%"></div>
            </div>
        </div>
    </header>

    <main class="flex-col md:flex-row w-full" style="display: flex; flex: 1; min-height: 0; overflow: hidden;">
        
        <div class="w-full md:w-1/2 bg-white border-b md:border-b-0 md:border-r border-gray-200 p-6 md:p-8 lg:p-12 z-10" style="overflow-y: auto; height: 100%;">
            <h2 class="text-xl font-bold text-slate-900 mb-6">Academic Reading Passage</h2>
            <div id="passageContent" class="text-slate-700 leading-relaxed space-y-4 text-sm"></div>
        </div>

        <div class="w-full md:w-1/2 bg-[#f8f9fa]" style="display: flex; flex-direction: column; height: 100%; position: relative;">
            
            <div class="p-6 md:p-8 lg:p-12 w-full" style="flex: 1; overflow-y: auto; min-height: 0;">
                
                <div id="quizContainer" class="w-full space-y-1">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md uppercase tracking-wider">Question <span id="qNumBadge">1</span></span>
                        <span id="qTypeBadge" class="text-[10px] font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-md uppercase tracking-wider">Detail</span>
                    </div>

                    <h3 id="questionText" class="text-base font-bold text-slate-900 mb-6 leading-snug">Loading question...</h3>

                    <div id="interactiveInstruction" class="hidden mb-6 bg-amber-50 border border-amber-100 p-4 rounded-xl text-xs font-medium text-amber-800 flex items-start">
                        <i data-lucide="mouse-pointer-click" class="w-4 h-4 mr-3 mt-0.5 shrink-0"></i>
                        <span id="instructionText">Click directly on the text on the left to select your answer!</span>
                    </div>

                    <div id="optionsContainer" class="space-y-3 w-full"></div>
                </div>
                
                <div id="resultsContainer" class="hidden w-full space-y-6 max-w-2xl mx-auto pb-12">
                    
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 text-center shadow-xs">
                        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i data-lucide="trophy" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-base font-bold text-slate-800 mb-4">Test Completed!</h3>
                        
                        <div class="bg-slate-50 rounded-xl p-4 flex justify-around mb-4 max-w-sm mx-auto">
                            <div>
                                <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-0.5">Accuracy</span>
                                <span id="finalScorePercent" class="text-lg font-black text-slate-800">0%</span>
                            </div>
                            <div class="border-r border-slate-200"></div>
                            <div>
                                <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-0.5">Raw Score</span>
                                <span id="finalScoreRaw" class="text-lg font-black text-slate-800">0 / 0</span>
                            </div>
                        </div>

                        <div class="flex items-center justify-center gap-3 max-w-sm mx-auto">
                            <button onclick="resetAndRestartTest()" class="flex-1 px-4 py-2 bg-slate-900 hover:bg-indigo-600 text-white font-bold text-xs rounded-xl transition shadow-xs flex items-center justify-center cursor-pointer">
                                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 mr-1.5"></i> Try Again
                            </button>
                            <a href="read-academic.html" class="flex-1 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition flex items-center justify-center">
                                Dashboard
                            </a>
                        </div>
                    </div>

                    <div>
                        <h4 class="text-sm font-bold text-slate-700 mb-3 px-1 flex items-center">
                            <i data-lucide="list-checks" class="w-4 h-4 mr-1.5 text-indigo-500"></i> Review Answers & Explanations
                        </h4>
                        <div id="explanationsList" class="space-y-4"></div>
                    </div>
                </div>

                <div class="pb-8"></div>
            </div>

            <div id="navFooter" class="bg-white border-t border-gray-200 px-6 py-4 flex justify-between items-center w-full z-20 shadow-[0_-4px_10px_rgba(0,0,0,0.03)]" style="flex-shrink: 0;">
                <button id="btnPrev" class="px-6 py-2.5 rounded-xl text-xs font-bold text-gray-500 hover:bg-gray-200 transition disabled:opacity-50 cursor-pointer" disabled>Previous</button>
                <button id="btnNext" class="px-6 py-2.5 rounded-xl text-xs font-bold text-white transition shadow-sm cursor-pointer" style="background-color: #0f172a;">Next</button>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        const task = {
            title: "The Cretaceous Extinction",
            passage: "For many years, scientists debated the primary cause behind the sudden demise of the non-avian dinosaurs approximately 66 million years ago. [s1]Traditional theories pointed toward long-term climate adjustments triggered by massive volcanic eruptions in the Deccan Traps.[sq1] [s2]However, the discovery of a distinct, global iridium layer led directly to the famous Alvarez impact hypothesis.[sq2] [s3]This impact theory suggests that a massive asteroid struck Earth, generating an immense dust cloud that completely blocked out vital solar radiation for months.[sq3] \n\nThe resulting collapse of photosynthetic life quickly rippled through the global food chains. [sq4] [s4]Herbivorous dinosaurs starved first, followed immediately by the apex predators that hunted them. [s5]Smaller, omnivorous mammals managed to survive by scavenging in the dark.",
            questions: [
                {
                    type: "Detail",
                    question: "According to the passage, what did traditional theories blame for the dinosaur extinction?",
                    options: [
                        "A massive asteroid strike",
                        "Long-term climate adjustments from volcanic eruptions",
                        "The collapse of global food chains",
                        "The survival of small mammals"
                    ],
                    correct: 1,
                    explanation: "Sentence 2 explicitly states: 'Traditional theories pointed toward long-term climate adjustments triggered by massive volcanic eruptions in the Deccan Traps.'"
                },
                {
                    type: "Select a Sentence",
                    question: "In which sentence does the author discuss the immediate consequence of the loss of plant life? Click on the correct sentence in the text.",
                    correct: 4,
                    explanation: "Sentence 4 ('Herbivorous dinosaurs starved first...') shows the direct and immediate consequence of the food chain collapse caused by the lack of plants."
                },
                {
                    type: "Insert Text",
                    question: "Where would the following sentence best fit?\n\n\"This period of prolonged darkness prevented plants from creating energy, leading to massive flora die-offs.\"",
                    correct: 4,
                    explanation: "This sentence perfectly bridges the gap between the dust cloud blocking solar radiation (Sentence 3) and the collapse of the global food chains described in the second paragraph."
                }
            ]
        };

        let currentQuestionIdx = 0;
        let userAnswers = {}; 

        function initTask() {
            document.getElementById('passageTitle').innerText = task.title;

            let parsedText = task.passage
                .replace(/\[s(\d+)\](.*?)(?=\[s\d+\]|\[sq\d+\]|$)/gs, '<span class="clickable-sentence" data-id="$1">$2</span>')
                .replace(/\[sq(\d+)\]/g, '<span class="insert-square" data-sq="$1">■</span>');

            parsedText = parsedText.split('\n\n').map(p => `<p class="mb-4">${p}</p>`).join('');
            document.getElementById('passageContent').innerHTML = parsedText;

            setupInteractiveClicks();
            showQuestion(currentQuestionIdx);
        }

        function setupInteractiveClicks() {
            document.querySelectorAll('.clickable-sentence').forEach(el => {
                el.onclick = function() {
                    if (task.questions[currentQuestionIdx].type !== "Select a Sentence") return;
                    document.querySelectorAll('.clickable-sentence').forEach(s => s.classList.remove('selected'));
                    this.classList.add('selected');
                    userAnswers[currentQuestionIdx] = parseInt(this.getAttribute('data-id'));
                };
            });

            document.querySelectorAll('.insert-square').forEach(el => {
                el.onclick = function() {
                    if (task.questions[currentQuestionIdx].type !== "Insert Text") return;
                    document.querySelectorAll('.insert-square').forEach(s => s.classList.remove('selected'));
                    this.classList.add('selected');
                    userAnswers[currentQuestionIdx] = parseInt(this.getAttribute('data-sq'));
                };
            });
        }

        function showQuestion(idx) {
            const q = task.questions[idx];
            
            document.getElementById('qNumBadge').innerText = idx + 1;
            document.getElementById('questionCounter').innerText = `${idx + 1} / ${task.questions.length}`;
            document.getElementById('progressBar').style.width = `${((idx + 1) / task.questions.length) * 100}%`;
            document.getElementById('qTypeBadge').innerText = q.type;
            document.getElementById('questionText').innerText = q.question;

            const optionsContainer = document.getElementById('optionsContainer');
            const instruction = document.getElementById('interactiveInstruction');
            const passageContainer = document.getElementById('passageContent');

            passageContainer.classList.remove('select-sentence-mode', 'insert-text-mode');
            document.querySelectorAll('.clickable-sentence').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('.insert-square').forEach(el => el.classList.remove('selected'));

            if (q.type === "Select a Sentence" || q.type === "Insert Text") {
                optionsContainer.innerHTML = '';
                instruction.classList.remove('hidden');
                
                if (q.type === "Select a Sentence") {
                    passageContainer.classList.add('select-sentence-mode');
                    document.getElementById('instructionText').innerText = "Click directly on the sentence inside the left passage text to select your answer.";
                    if (userAnswers[idx]) document.querySelector(`.clickable-sentence[data-id="${userAnswers[idx]}"]`)?.classList.add('selected');
                } else {
                    passageContainer.classList.add('insert-text-mode');
                    document.getElementById('instructionText').innerText = "Click on one of the squares [■] in the left passage to insert the sentence.";
                    if (userAnswers[idx]) document.querySelector(`.insert-square[data-sq="${userAnswers[idx]}"]`)?.classList.add('selected');
                }
            } else {
                instruction.classList.add('hidden');
                optionsContainer.innerHTML = '';
                
                q.options.forEach((opt, optIdx) => {
                    const isChecked = userAnswers[idx] === optIdx ? 'checked' : '';
                    optionsContainer.innerHTML += `
                        <label class="flex items-start p-3.5 border rounded-xl cursor-pointer transition w-full border-gray-200 hover:border-indigo-300 text-xs bg-white">
                            <input type="radio" name="q${idx}" value="${optIdx}" ${isChecked} onchange="saveRadioAnswer(${idx}, ${optIdx})" class="mt-0.5 w-4 h-4 text-indigo-600 border-gray-300">
                            <span class="ml-3 text-slate-700">${opt}</span>
                        </label>
                    `;
                });
            }

            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');

            btnPrev.disabled = idx === 0;

            if (idx === task.questions.length - 1) {
                btnNext.innerText = "Submit Test";
                btnNext.style.backgroundColor = '#10b981'; 
                btnNext.onclick = finishTest;
            } else {
                btnNext.innerText = "Next";
                btnNext.style.backgroundColor = '#0f172a'; 
                btnNext.onclick = () => { currentQuestionIdx++; showQuestion(currentQuestionIdx); };
            }

            btnPrev.onclick = () => {
                if (currentQuestionIdx > 0) { currentQuestionIdx--; showQuestion(currentQuestionIdx); }
            };
        }

        window.saveRadioAnswer = function(qIdx, optIdx) { userAnswers[qIdx] = optIdx; };

        // НОВАЯ ФУНКЦИЯ ДЛЯ СБРОСА И ПЕРЕЗАПУСКА ТЕСТА ЗАНОГО
        window.resetAndRestartTest = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const taskId = urlParams.get('id') || 1;

            // Удаляем результаты текущего теста из localStorage
            localStorage.removeItem(`academic_test_score_${task.title}`);
            localStorage.removeItem(`academic_test_score_${taskId}`);

            // Сбрасываем переменные состояния
            currentQuestionIdx = 0;
            userAnswers = {};

            // Очищаем стили визуального разбора в тексте слева
            document.body.classList.remove('insert-text-mode');
            document.querySelectorAll('.clickable-sentence').forEach(el => {
                el.classList.remove('review-correct', 'review-wrong', 'selected');
            });
            document.querySelectorAll('.insert-square').forEach(el => {
                el.classList.remove('review-square-correct', 'review-square-wrong', 'selected');
            });

            // Переключаем интерфейс обратно на окна вопросов
            document.getElementById('resultsContainer').classList.add('hidden');
            document.getElementById('quizContainer').classList.remove('hidden');
            document.getElementById('navFooter').classList.remove('hidden');

            // Запускаем тест заново с первого вопроса
            showQuestion(currentQuestionIdx);
            lucide.createIcons();
        };

        async function finishTest() {
            let score = 0;
            let stats = {}; 
            const explanationsList = document.getElementById('explanationsList');
            explanationsList.innerHTML = ''; 

            task.questions.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                const isCorrect = userAns === q.correct;
                if (isCorrect) score++;

                if (!stats[q.type]) stats[q.type] = { earned: 0, total: 0 };
                stats[q.type].total += 1;
                if (isCorrect) stats[q.type].earned += 1;

                let optionsReviewHtml = '';
                
                if (q.type === "Detail") {
                    q.options.forEach((option, i) => {
                        let bgStyle = 'bg-slate-50 text-slate-600 border border-slate-100';
                        let icon = '';

                        if (i === q.correct) {
                            bgStyle = 'bg-emerald-50 text-emerald-900 border border-emerald-200 font-medium';
                            icon = '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600 mr-2 shrink-0"></i>';
                        } else if (i === userAns) {
                            bgStyle = 'bg-rose-50 text-rose-900 border border-rose-200 line-through';
                            icon = '<i data-lucide="x" class="w-3.5 h-3.5 text-rose-600 mr-2 shrink-0"></i>';
                        }

                        optionsReviewHtml += `
                            <div class="flex items-center p-2.5 rounded-lg text-[11px] ${bgStyle}">
                                ${icon} <span>${option}</span>
                            </div>
                        `;
                    });
                } else if (q.type === "Select a Sentence") {
                    document.querySelector(`.clickable-sentence[data-id="${q.correct}"]`)?.classList.add('review-correct');
                    if (userAns && !isCorrect) {
                        document.querySelector(`.clickable-sentence[data-id="${userAns}"]`)?.classList.add('review-wrong');
                    }

                    optionsReviewHtml = `
                        <div class="space-y-1.5">
                            <div class="flex items-center p-2.5 rounded-lg text-[11px] bg-emerald-50 text-emerald-900 border border-emerald-200 font-medium">
                                <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600 mr-2 shrink-0"></i> <span>Correct Answer: Sentence [s${q.correct}]</span>
                            </div>
                            ${!isCorrect ? `
                            <div class="flex items-center p-2.5 rounded-lg text-[11px] bg-rose-50 text-rose-900 border border-rose-200 line-through">
                                <i data-lucide="x" class="w-3.5 h-3.5 text-rose-600 mr-2 shrink-0"></i> <span>Your Selection: Sentence [s${userAns || 'None'}]</span>
                            </div>` : ''}
                        </div>
                    `;
                } else if (q.type === "Insert Text") {
                    document.querySelector(`.insert-square[data-sq="${q.correct}"]`)?.classList.add('review-square-correct');
                    if (userAns && !isCorrect) {
                        document.querySelector(`.insert-square[data-sq="${userAns}"]`)?.classList.add('review-square-wrong');
                    }

                    [1, 2, 3, 4].forEach(sqNum => {
                        let bgStyle = 'bg-slate-50 text-slate-600 border border-slate-100';
                        let icon = '';

                        if (sqNum === q.correct) {
                            bgStyle = 'bg-emerald-50 text-emerald-900 border border-emerald-200 font-medium';
                            icon = '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600 mr-2 shrink-0"></i>';
                        } else if (sqNum === userAns) {
                            bgStyle = 'bg-rose-50 text-rose-900 border border-rose-200 line-through';
                            icon = '<i data-lucide="x" class="w-3.5 h-3.5 text-rose-600 mr-2 shrink-0"></i>';
                        }

                        optionsReviewHtml += `
                            <div class="flex items-center p-2.5 rounded-lg text-[11px] ${bgStyle}">
                                ${icon} <span>Square [sq${sqNum}]</span>
                            </div>
                        `;
                    });
                }

                const qCard = `
                    <div class="bg-white rounded-2xl border ${isCorrect ? 'border-emerald-100' : 'border-rose-100'} p-5 shadow-xs">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[10px] font-bold ${isCorrect ? 'text-emerald-600' : 'text-rose-600'} uppercase tracking-wider">
                                Question ${idx + 1} — ${isCorrect ? 'Correct' : 'Incorrect'}
                            </span>
                            <span class="text-[9px] px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md font-medium uppercase">${q.type}</span>
                        </div>
                        <p class="text-xs font-bold text-slate-800 mb-3 leading-snug">${q.question}</p>
                        
                        <div class="space-y-1.5 mb-4">${optionsReviewHtml}</div>
                        
                        <div class="bg-indigo-50/40 rounded-xl p-3.5 border border-indigo-100/50">
                            <span class="text-[10px] font-bold text-indigo-900 block mb-1 uppercase tracking-wider flex items-center">
                                <i data-lucide="lightbulb" class="w-3.5 h-3.5 mr-1 text-indigo-600"></i> Explanation
                            </span>
                            <p class="text-[11px] text-indigo-950/80 leading-relaxed font-medium">
                                ${q.explanation || 'No explanation provided.'}
                            </p>
                        </div>
                    </div>
                `;
                explanationsList.innerHTML += qCard;
            });

            document.body.classList.add('insert-text-mode');

            const scorePercent = Math.round((score / task.questions.length) * 100);
            localStorage.setItem(`academic_test_score_${task.title}`, scorePercent);

            if (window.supabase) {
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const taskId = urlParams.get('id') || 1;

                    const { error } = await supabase
                        .from('reading_results')
                        .insert([
                            {
                                task_id: parseInt(taskId),
                                task_type: 'academic', 
                                score_earned: score,
                                score_total: task.questions.length,
                                time_spent_seconds: 420,
                                category_stats: stats 
                            }
                        ]);

                    if (error) console.error("Error saving to Supabase:", error);
                } catch (err) {
                    console.error("Failed to connect with Supabase:", err);
                }
            }

            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('navFooter').classList.add('hidden');
            document.getElementById('resultsContainer').classList.remove('hidden');

            document.getElementById('finalScorePercent').innerText = `${scorePercent}%`;
            document.getElementById('finalScoreRaw').innerText = `${score} / ${task.questions.length}`;
            
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', initTask);
    </script>
</body>
</html>
