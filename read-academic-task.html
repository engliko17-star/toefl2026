<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Reading Task — TOEFL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        /* --- РЕЖИМ: Select a Sentence --- */
        .select-sentence-mode .clickable-sentence {
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .select-sentence-mode .clickable-sentence:hover {
            background-color: #fee2e2; /* светло-красный */
        }
        .select-sentence-mode .clickable-sentence.selected {
            background-color: #ef4444; /* яркий красный */
            color: white;
        }

        /* --- РЕЖИМ: Insert Text (Квадратики) --- */
        .insert-square {
            display: none; /* Скрыты по умолчанию */
            margin: 0 4px;
            cursor: pointer;
            font-size: 1.2em;
            color: #94a3b8; /* серый */
            transition: all 0.2s;
            vertical-align: middle;
            line-height: 1;
        }
        .insert-text-mode .insert-square {
            display: inline-block; /* Показываем только в режиме Insert Text */
        }
        .insert-text-mode .insert-square:hover {
            color: #4f46e5; /* индиго */
            transform: scale(1.3);
        }
        .insert-text-mode .insert-square.selected {
            color: #312e81; /* темно-синий */
            transform: scale(1.2);
        }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b border-gray-100 px-6 py-4 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-4">
            <button onclick="window.history.back()" class="text-gray-400 hover:text-slate-900 transition flex items-center text-sm font-bold">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Exit Test
            </button>
            <div class="h-4 w-px bg-gray-200"></div>
            <h1 id="passageTitle" class="text-sm font-bold text-slate-900">Loading...</h1>
        </div>
        <div class="flex items-center space-x-3 text-sm font-bold text-slate-500">
            <span id="questionCounter">1 / 3</span>
            <div class="w-32 bg-gray-100 rounded-full h-2">
                <div id="progressBar" class="bg-indigo-600 h-2 rounded-full transition-all" style="width: 33%"></div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        
        <div class="w-1/2 bg-white border-r border-gray-100 overflow-y-auto p-8 lg:p-12 shadow-sm z-10">
            <h2 class="text-xl font-bold text-slate-900 mb-6">Academic Reading Passage</h2>
            <div id="passageContent" class="text-slate-700 leading-relaxed space-y-4">
                </div>
        </div>

        <div class="w-1/2 bg-[#f8f9fa] overflow-y-auto p-8 lg:p-12 relative flex flex-col">
            
            <div class="flex justify-between items-center mb-6">
                <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md uppercase tracking-wider">Question <span id="qNumBadge">1</span></span>
                <span id="qTypeBadge" class="text-[10px] font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-md uppercase tracking-wider">Detail</span>
            </div>

            <h3 id="questionText" class="text-lg font-bold text-slate-900 mb-6">Loading question...</h3>

            <div id="interactiveInstruction" class="hidden mb-6 bg-amber-50 border border-amber-100 p-4 rounded-xl text-sm font-medium text-amber-800 flex items-start">
                <i data-lucide="mouse-pointer-click" class="w-5 h-5 mr-3 mt-0.5 shrink-0"></i>
                <span id="instructionText">Click directly on the text on the left to select your answer!</span>
            </div>

            <div id="optionsContainer" class="space-y-3 flex-1">
                </div>

            <div class="mt-8 pt-6 border-t border-gray-200/60 flex justify-between">
                <button id="btnPrev" class="px-6 py-2.5 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-200 transition disabled:opacity-50" disabled>Previous</button>
                <button id="btnNext" class="px-6 py-2.5 rounded-xl text-sm font-bold text-white bg-slate-900 hover:bg-slate-800 shadow-sm transition">Next</button>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        // --- ТЕСТОВЫЕ ДАННЫЕ (Замени потом на запрос к Supabase) ---
        const task = {
            title: "The Cretaceous Extinction",
            passage: "For many years, scientists debated the primary cause behind the sudden demise of the non-avian dinosaurs approximately 66 million years ago. [s1]Traditional theories pointed toward long-term climate adjustments triggered by massive volcanic eruptions in the Deccan Traps.[sq1] [s2]However, the discovery of a distinct, global iridium layer led directly to the famous Alvarez impact hypothesis.[sq2] [s3]This impact theory suggests that a massive asteroid struck Earth, generating an immense dust cloud that completely blocked out vital solar radiation for months.[sq3] \n\nThe resulting collapse of photosynthetic life quickly rippled through the global food chains. [sq4] [s4]Herbivorous dinosaurs starved first, followed immediately by the apex predators that hunted them. [s5]Smaller, omnivorous mammals managed to survive by scavenging in the dark.",
            questions: [
                {
                    type: "Detail",
                    question: "According to the passage, what did traditional theories blame for the dinosaur extinction?",
                    options: [
                        "A massive asteroid strike",
                        "Long-term climate adjustments from volcanic eruptions",
                        "The collapse of global food chains",
                        "The survival of small mammals"
                    ],
                    correct: 1 // индекс правильного ответа (от 0)
                },
                {
                    type: "Select a Sentence",
                    question: "In which sentence does the author discuss the immediate consequence of the loss of plant life? Click on the correct sentence in the text.",
                    correct: 4 // правильный номер предложения [s4]
                },
                {
                    type: "Insert Text",
                    question: "Where would the following sentence best fit?\n\n\"This period of prolonged darkness prevented plants from creating energy, leading to massive flora die-offs.\"",
                    correct: 4 // правильный квадрат [sq4]
                }
            ]
        };

        // Глобальные переменные состояния
        let currentQuestionIdx = 0;
        let userAnswers = {}; // { 0: 1, 1: 4, 2: 4 } - хранит ответы юзера

        // Инициализация при загрузке страницы
        function initTask() {
            document.getElementById('passageTitle').innerText = task.title;

            // 1. Превращаем маркеры в HTML-элементы
            // Регулярка для предложений: ищет [s1]... до следующего тега или конца
            let parsedText = task.passage
                .replace(/\[s(\d+)\](.*?)(?=\[s\d+\]|\[sq\d+\]|$)/gs, '<span class="clickable-sentence" data-id="$1">$2</span>')
                // Регулярка для квадратиков
                .replace(/\[sq(\d+)\]/g, '<span class="insert-square" data-sq="$1">■</span>');

            // Заменяем переносы строк на теги параграфов
            parsedText = parsedText.split('\n\n').map(p => `<p>${p}</p>`).join('');
            document.getElementById('passageContent').innerHTML = parsedText;

            // 2. Вешаем обработчики кликов на текст (для интерактивных вопросов)
            setupInteractiveClicks();

            // 3. Показываем первый вопрос
            showQuestion(currentQuestionIdx);
        }

        function setupInteractiveClicks() {
            // Клики по предложениям (Select a Sentence)
            document.querySelectorAll('.clickable-sentence').forEach(el => {
                el.onclick = function() {
                    const qType = task.questions[currentQuestionIdx].type;
                    if (qType !== "Select a Sentence") return; // Реагируем только в нужном режиме
                    
                    document.querySelectorAll('.clickable-sentence').forEach(s => s.classList.remove('selected'));
                    this.classList.add('selected');
                    userAnswers[currentQuestionIdx] = parseInt(this.getAttribute('data-id'));
                };
            });

            // Клики по квадратам (Insert Text)
            document.querySelectorAll('.insert-square').forEach(el => {
                el.onclick = function() {
                    const qType = task.questions[currentQuestionIdx].type;
                    if (qType !== "Insert Text") return; // Реагируем только в нужном режиме
                    
                    document.querySelectorAll('.insert-square').forEach(s => s.classList.remove('selected'));
                    this.classList.add('selected');
                    userAnswers[currentQuestionIdx] = parseInt(this.getAttribute('data-sq'));
                };
            });
        }

        function showQuestion(idx) {
            const q = task.questions[idx];
            
            // Обновляем шапку и счетчики
            document.getElementById('qNumBadge').innerText = idx + 1;
            document.getElementById('questionCounter').innerText = `${idx + 1} / ${task.questions.length}`;
            document.getElementById('progressBar').style.width = `${((idx + 1) / task.questions.length) * 100}%`;
            document.getElementById('qTypeBadge').innerText = q.type;
            document.getElementById('questionText').innerText = q.question;

            // Настройка UI
            const optionsContainer = document.getElementById('optionsContainer');
            const instruction = document.getElementById('interactiveInstruction');
            const passageContainer = document.getElementById('passageContent');

            // Сбрасываем режимы текста
            passageContainer.classList.remove('select-sentence-mode', 'insert-text-mode');
            document.querySelectorAll('.clickable-sentence, .insert-square').forEach(el => el.classList.remove('selected'));

            if (q.type === "Select a Sentence" || q.type === "Insert Text") {
                // Включаем интерактивный режим
                optionsContainer.innerHTML = '';
                instruction.classList.remove('hidden');

                if (q.type === "Select a Sentence") {
                    passageContainer.classList.add('select-sentence-mode');
                    document.getElementById('instructionText').innerText = "Click directly on the sentence inside the left passage text to select your answer.";
                    
                    // Восстанавливаем ответ, если был
                    if (userAnswers[idx]) {
                        document.querySelector(`.clickable-sentence[data-id="${userAnswers[idx]}"]`)?.classList.add('selected');
                    }
                } else {
                    passageContainer.classList.add('insert-text-mode');
                    document.getElementById('instructionText').innerText = "Click on one of the squares [■] in the left passage to insert the sentence.";
                    
                    // Восстанавливаем ответ, если был
                    if (userAnswers[idx]) {
                        document.querySelector(`.insert-square[data-sq="${userAnswers[idx]}"]`)?.classList.add('selected');
                    }
                }
            } else {
                // Обычный режим с радио-кнопками
                instruction.classList.add('hidden');
                optionsContainer.innerHTML = '';
                
                q.options.forEach((opt, optIdx) => {
                    const isChecked = userAnswers[idx] === optIdx ? 'checked' : '';
                    const html = `
                        <label class="flex items-start p-4 bg-white border border-gray-200 rounded-xl cursor-pointer hover:border-indigo-300 transition">
                            <input type="radio" name="q${idx}" value="${optIdx}" ${isChecked} onchange="saveRadioAnswer(${idx}, ${optIdx})" class="mt-0.5 w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-gray-300">
                            <span class="ml-3 text-sm text-slate-700">${opt}</span>
                        </label>
                    `;
                    optionsContainer.innerHTML += html;
                });
            }

            // Настройка кнопок навигации
            document.getElementById('btnPrev').disabled = idx === 0;
            const btnNext = document.getElementById('btnNext');
            if (idx === task.questions.length - 1) {
                btnNext.innerText = "Submit Test";
                btnNext.classList.replace('bg-slate-900', 'bg-indigo-600');
                btnNext.classList.replace('hover:bg-slate-800', 'hover:bg-indigo-700');
                btnNext.onclick = finishTest;
            } else {
                btnNext.innerText = "Next";
                btnNext.classList.replace('bg-indigo-600', 'bg-slate-900');
                btnNext.classList.replace('hover:bg-indigo-700', 'hover:bg-slate-800');
                btnNext.onclick = () => {
                    currentQuestionIdx++;
                    showQuestion(currentQuestionIdx);
                };
            }

            document.getElementById('btnPrev').onclick = () => {
                if (currentQuestionIdx > 0) {
                    currentQuestionIdx--;
                    showQuestion(currentQuestionIdx);
                }
            };
        }

        // Сохранение обычных ответов (радио-кнопки)
        window.saveRadioAnswer = function(qIdx, optIdx) {
            userAnswers[qIdx] = optIdx;
        };

        // Завершение теста
        function finishTest() {
            let score = 0;
            task.questions.forEach((q, i) => {
                if (userAnswers[i] === q.correct) score++;
            });
            alert(`Test Finished!\nYour Score: ${score} out of ${task.questions.length}`);
            // Здесь будет твой код редиректа на страницу с результатами
        }

        // Запуск
        document.addEventListener('DOMContentLoaded', initTask);

    </script>
</body>
</html>
