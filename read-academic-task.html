<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academic Reading Task — TOEFL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        .select-sentence-mode .clickable-sentence { cursor: pointer; border-radius: 4px; transition: background-color 0.2s; }
        .select-sentence-mode .clickable-sentence:hover { background-color: #fee2e2; }
        .select-sentence-mode .clickable-sentence.selected { background-color: #4f46e5; color: white; }

        .insert-square { display: none; margin: 0 4px; cursor: pointer; font-size: 1.2em; color: #94a3b8; transition: all 0.2s; vertical-align: middle; line-height: 1; }
        .insert-text-mode .insert-square { display: inline-block; }
        .insert-text-mode .insert-square:hover { color: #4f46e5; transform: scale(1.3); }
        .insert-text-mode .insert-square.selected { color: #312e81; transform: scale(1.2); }

        .review-correct { background-color: #d1fae5 !important; color: #065f46 !important; border-radius: 4px; padding: 0 2px; }
        .review-wrong { background-color: #fee2e2 !important; color: #991b1b !important; border-radius: 4px; text-decoration: line-through; padding: 0 2px; }
        .review-square-correct { color: #10b981 !important; transform: scale(1.3); display: inline-block !important; }
        .review-square-wrong { color: #ef4444 !important; transform: scale(1.3); display: inline-block !important; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 m-0 p-0" style="height: 100dvh; display: flex; flex-direction: column; overflow: hidden;">

    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0 z-10 shadow-sm relative">
        <div class="flex items-center space-x-4">
            <a href="read-academic.html" class="text-gray-400 hover:text-slate-900 transition flex items-center text-sm font-bold pt-0.5 cursor-pointer">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Exit Test
            </a>
            <div class="h-4 w-px bg-gray-200"></div>
            <h1 id="passageTitle" class="text-sm font-bold text-slate-900">Loading test...</h1>
        </div>
        
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-3 text-sm font-bold text-slate-500">
                <span id="questionCounter">0 / 0</span>
                <div class="w-24 sm:w-32 bg-gray-100 rounded-full h-2">
                    <div id="progressBar" class="bg-indigo-600 h-2 rounded-full transition-all" style="width: 0%"></div>
                </div>
            </div>

            <span class="text-gray-300 block" id="headerSeparator">|</span>

            <div class="flex items-center space-x-3" id="topNavButtons">
                <button id="btnPrev" class="px-4 py-2 rounded-lg border border-gray-200 bg-white text-slate-700 text-xs font-bold hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed transition flex items-center shadow-xs" disabled>
                    <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i> Back
                </button>
                <button id="btnNext" class="px-4 py-2 rounded-lg bg-slate-900 text-white text-xs font-bold hover:bg-indigo-600 transition flex items-center shadow-xs cursor-pointer">
                    Next <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-col md:flex-row w-full" style="display: flex; flex: 1; min-height: 0; overflow: hidden;">
        
        <div class="w-full md:w-1/2 bg-white border-b md:border-b-0 md:border-r border-gray-200 p-6 md:p-8 lg:p-12 z-10" style="overflow-y: auto; height: 100%;">
            <h2 class="text-xl font-bold text-slate-900 mb-6">Academic Reading Passage</h2>
            <div id="passageContent" class="text-slate-700 leading-relaxed space-y-4 text-sm">
                <div class="flex items-center space-x-2 text-slate-400">
                    <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
                    <span>Loading text from database...</span>
                </div>
            </div>
        </div>

        <div class="w-full md:w-1/2 bg-[#f8f9fa]" style="display: flex; flex-direction: column; height: 100%; position: relative;">
            
            <div class="p-6 md:p-8 lg:p-12 w-full custom-scrollbar" style="flex: 1; overflow-y: auto; min-height: 0;">
                
                <div id="quizContainer" class="w-full space-y-1 hidden">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md uppercase tracking-wider">Question <span id="qNumBadge">1</span></span>
                        <span id="qTypeBadge" class="text-[10px] font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-md uppercase tracking-wider">Detail</span>
                    </div>

                    <h3 id="questionText" class="text-base font-bold text-slate-900 mb-6 leading-snug">Loading question...</h3>

                    <div id="interactiveInstruction" class="hidden mb-6 bg-amber-50 border border-amber-100 p-4 rounded-xl text-xs font-medium text-amber-800 flex items-start">
                        <i data-lucide="mouse-pointer-click" class="w-4 h-4 mr-3 mt-0.5 shrink-0"></i>
                        <span id="instructionText">Click directly on the text on the left to select your answer!</span>
                    </div>

                    <div id="optionsContainer" class="space-y-3 w-full"></div>
                </div>
                
                <div id="resultsContainer" class="hidden w-full space-y-6 max-w-2xl mx-auto pb-12">
                    
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 text-center shadow-xs">
                        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i data-lucide="trophy" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-base font-bold text-slate-800 mb-4">Test Completed!</h3>
                        
                        <div class="bg-slate-50 rounded-xl p-4 flex justify-around mb-4 max-w-sm mx-auto">
                            <div>
                                <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-0.5">Accuracy</span>
                                <span id="finalScorePercent" class="text-lg font-black text-slate-800">0%</span>
                            </div>
                            <div class="border-r border-slate-200"></div>
                            <div>
                                <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-0.5">Raw Score</span>
                                <span id="finalScoreRaw" class="text-lg font-black text-slate-800">0 / 0</span>
                            </div>
                        </div>

                        <div class="flex items-center justify-center gap-3 max-w-sm mx-auto">
                            <button onclick="resetAndRestartTest()" class="flex-1 px-4 py-2 bg-slate-900 hover:bg-indigo-600 text-white font-bold text-xs rounded-xl transition shadow-xs flex items-center justify-center cursor-pointer">
                                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 mr-1.5"></i> Try Again
                            </button>
                            <a href="read-academic.html" class="flex-1 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition flex items-center justify-center">
                                Dashboard
                            </a>
                        </div>
                    </div>

                    <div>
                        <h4 class="text-sm font-bold text-slate-700 mb-3 px-1 flex items-center">
                            <i data-lucide="list-checks" class="w-4 h-4 mr-1.5 text-indigo-500"></i> Review Answers & Explanations
                        </h4>
                        <div id="explanationsList" class="space-y-4"></div>
                    </div>
                </div>

                <div class="pb-8"></div>
            </div>
            
            </div>
    </main>

    <script>
        lucide.createIcons();

        let currentTask = null;
        let currentQuestionIdx = 0;
        let userAnswers = {}; 
        let startTime = Date.now();
        let currentUser = null;

        const topNavButtons = document.getElementById('topNavButtons');
        const headerSeparator = document.getElementById('headerSeparator');

        function getDatabaseClient() {
            if (typeof supabaseClient !== 'undefined') return supabaseClient;
            if (typeof window !== 'undefined' && window.supabaseClient) return window.supabaseClient;
            
            const fallbackUrl = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
            const fallbackKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
            return window.supabase.createClient(fallbackUrl, fallbackKey);
        }

        const db = getDatabaseClient();

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                if (typeof requireAuth !== 'function') throw new Error("auth.js не найден.");
                
                currentUser = await requireAuth();
                if (!currentUser) return;

                const urlParams = new URLSearchParams(window.location.search);
                const taskId = urlParams.get('id');
                const isReviewMode = urlParams.get('mode') === 'review';

                if (!taskId) {
                    document.getElementById('passageTitle').innerText = "Error: No Test ID";
                    document.getElementById('passageContent').innerHTML = "<p class='text-red-500'>Test ID is missing in URL.</p>";
                    return;
                }

                const { data, error } = await db
                    .from('academic_tasks')
                    .select('*')
                    .eq('id', taskId)
                    .single();

                if (error) throw error;

                if (data) {
                    currentTask = data;
                    if (typeof currentTask.questions === 'string') {
                        currentTask.questions = JSON.parse(currentTask.questions);
                    }
                    
                    // 1. Сначала подгружаем текст задания на страницу
                    initTask();

                    // 2. В зависимости от режима либо загружаем результаты, либо запускаем тест
                    if (isReviewMode) {
                        await loadAndShowReview(taskId);
                    } else {
                        startTime = Date.now();
                        document.getElementById('quizContainer').classList.remove('hidden');
                        topNavButtons.classList.remove('hidden');
                        headerSeparator.classList.remove('hidden');
                        showQuestion(currentQuestionIdx);
                    }
                }
            } catch (err) {
                console.error(err);
                document.getElementById('passageTitle').innerText = "Error loading content";
                document.getElementById('passageContent').innerHTML = `<p class='text-red-500 font-bold'>${err.message}</p>`;
            }
        });

        function initTask() {
            if (!currentTask) return;
            
            document.getElementById('passageTitle').innerText = currentTask.title;

            let parsedText = (currentTask.passage || "")
                .replace(/\[s(\d+)\](.*?)(?=\[s\d+\]|\[sq\d+\]|$)/gs, '<span class="clickable-sentence" data-id="$1">$2</span>')
                .replace(/\[sq(\d+)\]/g, '<span class="insert-square" data-sq="$1">■</span>');

            parsedText = parsedText.split('\n\n').map(p => `<p class="mb-4">${p}</p>`).join('');
            document.getElementById('passageContent').innerHTML = parsedText;

            setupInteractiveClicks();
            // Убрали отсюда автоматический вызов showQuestion(currentQuestionIdx)
        }

        function setupInteractiveClicks() {
            document.querySelectorAll('.clickable-sentence').forEach(el => {
                el.onclick = function() {
                    if (currentTask.questions[currentQuestionIdx].type !== "Select a Sentence") return;
                    document.querySelectorAll('.clickable-sentence').forEach(s => s.classList.remove('selected'));
                    this.classList.add('selected');
                    userAnswers[currentQuestionIdx] = parseInt(this.getAttribute('data-id'));
                };
            });

            document.querySelectorAll('.insert-square').forEach(el => {
                el.onclick = function() {
                    if (currentTask.questions[currentQuestionIdx].type !== "Insert Text") return;
                    document.querySelectorAll('.insert-square').forEach(s => s.classList.remove('selected'));
                    this.classList.add('selected');
                    userAnswers[currentQuestionIdx] = parseInt(this.getAttribute('data-sq'));
                };
            });
        }

        function showQuestion(idx) {
            const q = currentTask.questions[idx];
            
            document.getElementById('qNumBadge').innerText = idx + 1;
            document.getElementById('questionCounter').innerText = `${idx + 1} / ${currentTask.questions.length}`;
            document.getElementById('progressBar').style.width = `${((idx + 1) / currentTask.questions.length) * 100}%`;
            document.getElementById('qTypeBadge').innerText = q.type || "Detail";
            
            document.getElementById('questionText').innerText = q.question || q.text;

            const optionsContainer = document.getElementById('optionsContainer');
            const instruction = document.getElementById('interactiveInstruction');
            const passageContainer = document.getElementById('passageContent');

            passageContainer.classList.remove('select-sentence-mode', 'insert-text-mode');
            document.querySelectorAll('.clickable-sentence').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('.insert-square').forEach(el => el.classList.remove('selected'));

            if (q.type === "Select a Sentence" || q.type === "Insert Text") {
                optionsContainer.innerHTML = '';
                instruction.classList.remove('hidden');
                
                if (q.type === "Select a Sentence") {
                    passageContainer.classList.add('select-sentence-mode');
                    document.getElementById('instructionText').innerText = "Click directly on the sentence inside the left passage text to select your answer.";
                    if (userAnswers[idx] !== undefined) document.querySelector(`.clickable-sentence[data-id="${userAnswers[idx]}"]`)?.classList.add('selected');
                } else {
                    passageContainer.classList.add('insert-text-mode');
                    document.getElementById('instructionText').innerText = "Click on one of the squares [■] in the left passage to insert the sentence.";
                    if (userAnswers[idx] !== undefined) document.querySelector(`.insert-square[data-sq="${userAnswers[idx]}"]`)?.classList.add('selected');
                }
            } else {
                instruction.classList.add('hidden');
                optionsContainer.innerHTML = '';
                
                if (q.options) {
                    q.options.forEach((opt, optIdx) => {
                        const isChecked = userAnswers[idx] === optIdx ? 'checked' : '';
                        optionsContainer.innerHTML += `
                            <label class="flex items-start p-3.5 border rounded-xl cursor-pointer transition w-full border-gray-200 hover:border-indigo-300 text-xs bg-white">
                                <input type="radio" name="q${idx}" value="${optIdx}" ${isChecked} onchange="saveRadioAnswer(${idx}, ${optIdx})" class="mt-0.5 w-4 h-4 text-indigo-600 border-gray-300">
                                <span class="ml-3 text-slate-700">${opt}</span>
                            </label>
                        `;
                    });
                }
            }

            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');

            btnPrev.disabled = idx === 0;

            if (idx === currentTask.questions.length - 1) {
                btnNext.innerHTML = `Submit Test <i data-lucide="check" class="w-4 h-4 ml-1"></i>`;
                btnNext.className = "px-4 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700 transition flex items-center shadow-xs cursor-pointer";
                btnNext.onclick = finishTest;
            } else {
                btnNext.innerHTML = `Next <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i>`;
                btnNext.className = "px-4 py-2 rounded-lg bg-slate-900 text-white text-xs font-bold hover:bg-indigo-600 transition flex items-center shadow-xs cursor-pointer";
                btnNext.onclick = () => { 
                    if (userAnswers[idx] === undefined) {
                        alert("Please select an answer!");
                        return;
                    }
                    currentQuestionIdx++; 
                    showQuestion(currentQuestionIdx); 
                };
            }

            btnPrev.onclick = () => {
                if (currentQuestionIdx > 0) { currentQuestionIdx--; showQuestion(currentQuestionIdx); }
            };
            
            lucide.createIcons();
        }

        window.saveRadioAnswer = function(qIdx, optIdx) { userAnswers[qIdx] = optIdx; };

        window.resetAndRestartTest = function() {
            if (!currentTask) return;

            currentQuestionIdx = 0;
            userAnswers = {};
            startTime = Date.now();

            document.body.classList.remove('insert-text-mode');
            document.querySelectorAll('.clickable-sentence').forEach(el => {
                el.classList.remove('review-correct', 'review-wrong', 'selected');
            });
            document.querySelectorAll('.insert-square').forEach(el => {
                el.classList.remove('review-square-correct', 'review-square-wrong', 'selected');
            });

            document.getElementById('resultsContainer').classList.add('hidden');
            document.getElementById('quizContainer').classList.remove('hidden');
            
            topNavButtons.classList.remove('hidden');
            headerSeparator.classList.remove('hidden');

            showQuestion(currentQuestionIdx);
        };

        // Загрузка сохранённого ранее результата из Supabase при режиме review
        async function loadAndShowReview(taskId) {
            let scoreEarned = 0;
            let scoreTotal = currentTask.questions.length;

            if (currentUser && db) {
                try {
                    const { data, error } = await db
                        .from('reading_results')
                        .select('score_earned, score_total')
                        .eq('user_id', currentUser.id)
                        .eq('task_id', parseInt(taskId))
                        .eq('task_type', 'academic')
                        .order('id', { ascending: false }) // На случай, если записей несколько, берем последнюю
                        .limit(1)
                        .maybeSingle();

                    if (!error && data) {
                        scoreEarned = data.score_earned;
                        scoreTotal = data.score_total;
                    }
                } catch (err) {
                    console.error("Error fetching results for review:", err);
                }
            }

            renderReviewUI(scoreEarned, scoreTotal);
        }

        // Вывод результатов и разбора ошибок
        function renderReviewUI(scoreEarned, scoreTotal) {
            const explanationsList = document.getElementById('explanationsList');
            explanationsList.innerHTML = ''; 

            // Включаем отображение квадратов для правильного рендеринга текста
            document.body.classList.add('insert-text-mode');

            // Проверяем, есть ли у нас детальные ответы пользователя (для режима прохождения в реальном времени)
            const hasUserAnswers = Object.keys(userAnswers).length > 0;

            currentTask.questions.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                const isCorrect = hasUserAnswers ? (userAns === q.correct) : true;

                let optionsReviewHtml = '';
                
                if (q.type === "Select a Sentence" || q.type === "Insert Text") {
                    if (q.type === "Select a Sentence") {
                        document.querySelector(`.clickable-sentence[data-id="${q.correct}"]`)?.classList.add('review-correct');
                        if (hasUserAnswers && userAns !== undefined && !isCorrect) {
                            document.querySelector(`.clickable-sentence[data-id="${userAns}"]`)?.classList.add('review-wrong');
                        }
                        optionsReviewHtml = `
                            <div class="space-y-1.5">
                                <div class="flex items-center p-2.5 rounded-lg text-[11px] bg-emerald-50 text-emerald-900 border border-emerald-200 font-medium">
                                    <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600 mr-2 shrink-0"></i> <span>Correct Answer: Sentence [s${q.correct}]</span>
                                </div>
                                ${(hasUserAnswers && !isCorrect) ? `
                                <div class="flex items-center p-2.5 rounded-lg text-[11px] bg-rose-50 text-rose-900 border border-rose-200 line-through">
                                    <i data-lucide="x" class="w-3.5 h-3.5 text-rose-600 mr-2 shrink-0"></i> <span>Your Selection: Sentence [s${userAns !== undefined ? userAns : 'None'}]</span>
                                </div>` : ''}
                            </div>
                        `;
                    } else {
                        document.querySelector(`.insert-square[data-sq="${q.correct}"]`)?.classList.add('review-square-correct');
                        if (hasUserAnswers && userAns !== undefined && !isCorrect) {
                            document.querySelector(`.insert-square[data-sq="${userAns}"]`)?.classList.add('review-square-wrong');
                        }
                        [1, 2, 3, 4].forEach(sqNum => {
                            let bgStyle = 'bg-slate-50 text-slate-600 border border-slate-100';
                            let icon = '';

                            if (sqNum === q.correct) {
                                bgStyle = 'bg-emerald-50 text-emerald-900 border border-emerald-200 font-medium';
                                icon = '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600 mr-2 shrink-0"></i>';
                            } else if (hasUserAnswers && sqNum === userAns) {
                                bgStyle = 'bg-rose-50 text-rose-900 border border-rose-200 line-through';
                                icon = '<i data-lucide="x" class="w-3.5 h-3.5 text-rose-600 mr-2 shrink-0"></i>';
                            }
                            optionsReviewHtml += `
                                <div class="flex items-center p-2.5 rounded-lg text-[11px] ${bgStyle}">
                                    ${icon} <span>Square [sq${sqNum}]</span>
                                </div>
                            `;
                        });
                    }
                } else {
                    if (q.options) {
                        q.options.forEach((option, i) => {
                            let bgStyle = 'bg-slate-50 text-slate-600 border border-slate-100';
                            let icon = '';

                            if (i === q.correct) {
                                bgStyle = 'bg-emerald-50 text-emerald-900 border border-emerald-200 font-medium';
                                icon = '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600 mr-2 shrink-0"></i>';
                            } else if (hasUserAnswers && i === userAns) {
                                bgStyle = 'bg-rose-50 text-rose-900 border border-rose-200 line-through';
                                icon = '<i data-lucide="x" class="w-3.5 h-3.5 text-rose-600 mr-2 shrink-0"></i>';
                            }

                            optionsReviewHtml += `
                                <div class="flex items-center p-2.5 rounded-lg text-[11px] ${bgStyle}">
                                    ${icon} <span>${option}</span>
                                </div>
                            `;
                        });
                    }
                }

                const questionContent = q.question || q.text || '';
                const qType = q.type || 'Detail';
                
                // Стиль статуса карточки вопроса (в зависимости от наличия ответов пользователя)
                const statusLabel = hasUserAnswers ? (isCorrect ? 'Correct' : 'Incorrect') : 'Practice Question';
                const statusColorClass = hasUserAnswers ? (isCorrect ? 'text-emerald-600' : 'text-rose-600') : 'text-indigo-600';
                const cardBorderClass = hasUserAnswers ? (isCorrect ? 'border-emerald-100' : 'border-rose-100') : 'border-slate-100';

                const qCard = `
                    <div class="bg-white rounded-2xl border ${cardBorderClass} p-5 shadow-xs">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[10px] font-bold ${statusColorClass} uppercase tracking-wider">
                                Question ${idx + 1} — ${statusLabel}
                            </span>
                            <span class="text-[9px] px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md font-medium uppercase">${qType}</span>
                        </div>
                        <p class="text-xs font-bold text-slate-800 mb-3 leading-snug">${questionContent}</p>
                        
                        <div class="space-y-1.5 mb-4">${optionsReviewHtml}</div>
                        
                        <div class="bg-indigo-50/40 rounded-xl p-3.5 border border-indigo-100/50">
                            <span class="text-[10px] font-bold text-indigo-900 block mb-1 uppercase tracking-wider flex items-center">
                                <i data-lucide="lightbulb" class="w-3.5 h-3.5 mr-1 text-indigo-600"></i> Explanation
                            </span>
                            <p class="text-[11px] text-indigo-950/80 leading-relaxed font-medium">
                                ${q.explanation || 'No explanation provided.'}
                            </p>
                        </div>
                    </div>
                `;
                explanationsList.innerHTML += qCard;
            });

            const scorePercent = Math.round((scoreEarned / scoreTotal) * 100);

            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('resultsContainer').classList.remove('hidden');
            
            topNavButtons.classList.add('hidden');
            headerSeparator.classList.add('hidden');

            document.getElementById('finalScorePercent').innerText = `${scorePercent}%`;
            document.getElementById('finalScoreRaw').innerText = `${scoreEarned} / ${scoreTotal}`;
            
            lucide.createIcons();
        }

        async function finishTest() {
            if (userAnswers[currentQuestionIdx] === undefined) {
                alert("Please select an answer for the final question!");
                return;
            }

            let score = 0;
            let stats = {}; 
            const timeSpentSeconds = Math.round((Date.now() - startTime) / 1000);

            currentTask.questions.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                const isCorrect = userAns === q.correct;
                if (isCorrect) score++;

                const qType = q.type || 'Detail';
                if (!stats[qType]) stats[qType] = { earned: 0, total: 0 };
                stats[qType].total += 1;
                if (isCorrect) stats[qType].earned += 1;
            });

            if (currentUser && db) {
                try {
                    const { error } = await db
                        .from('reading_results')
                        .insert([
                            {
                                user_id: currentUser.id,
                                task_id: parseInt(currentTask.id),
                                task_type: 'academic', 
                                score_earned: score,
                                score_total: currentTask.questions.length,
                                time_spent_seconds: timeSpentSeconds,
                                category_stats: stats 
                                // Примечание: Если в таблице Supabase появится колонка "user_answers" (JSONB),
                                // вы сможете сохранять индивидуальные ответы пользователя:
                                // user_answers: userAnswers
                            }
                        ]);

                    if (error) console.error("Error saving to Supabase:", error.message);
                } catch (err) {
                    console.error("Failed to connect with Supabase:", err);
                }
            }

            // Рендерим UI разбора на основе текущего прохождения
            renderReviewUI(score, currentTask.questions.length);
        }
    </script>
