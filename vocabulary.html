  wsPrev: () => stepWord(-1), wsNext: () => stepWord(1),
  say: w => speak(w),
  revealTr: (a, el) => { el.hidden = true; const p = el.nextElementSibling; if (p) p.hidden = false; },
  statTap: word => { const s = status(word); if (s === 'new' || s === 'learning') { haptic(12); markKnown(word); } else resetProgress(word); },
  known: word => { haptic(12); markKnown(word); },
  reset: word => resetProgress(word),
  listPicker: word => openListPicker(word),
  pickList: async (name, el) => {
    const entry = sheetEntryOf(el), word = entry.opts.word;
    const on = S.lists[name].some(x => norm(x) === norm(word));
    if (on) { const stored = S.lists[name].find(x => norm(x) === norm(word)); await removeFromList(stored, name); }
    else { haptic(8); await addToList(word, name); }
  },
  createListWithWord: async () => {
    const entry = sheets[sheets.length - 1], inp = $('#newListInput');
    const name = (inp && inp.value || '').trim();
    if (!name) { inp && inp.focus(); return; }
    if (await addToList(entry.opts.word, name)) toast(`Добавлено в «${name}»`);
  },
  newList: () => {
    openSheet({ title: 'Новый список', render: e => {
      e.body.innerHTML = `<input id="newListName" class="text-input" placeholder="Например: Unit 3" maxlength="60" enterkeyhint="done">
        <p class="small muted" style="margin-top:10px">Слова добавляются из карточки слова — кнопкой «В список». Список сохранится, как только в нём появится первое слово.</p>`;
      e.foot.hidden = false;
      e.foot.innerHTML = `<button class="btn btn-primary" data-act="createList">Создать</button>`;
      const inp = e.body.querySelector('input');
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') ACTIONS.createList(); });
      setTimeout(() => inp.focus(), 320);
    } });
  },
  createList: () => {
    const inp = $('#newListName'), name = (inp && inp.value || '').trim();
    if (!name) { inp && inp.focus(); return; }
    if (!S.lists[name]) S.lists[name] = [];
    go('#dict/list/' + encodeURIComponent(name), true);
  },
  listMenu: name => {
    openSheet({ title: name, render: e => {
      e.body.innerHTML = `<div class="group"><button class="set-row" data-act="deleteList" data-arg="${esc(name)}" style="color:var(--rose)"><span class="row-ico" style="background:var(--rose-soft)">${ic('trash', 19)}</span><span class="row-main"><span class="set-label">Удалить список</span><span class="set-hint" style="color:var(--muted)">Сами слова и прогресс по ним останутся</span></span></button></div>`;
    } });
  },
  deleteList: name => { if (confirm(`Удалить список «${name}»?`)) deleteList(name); },
  sources: () => openSources(),
  srcToggle: key => { toggleSource(key); haptic(6); refreshOpenSheet(); rerender(); },
  toggleSource: key => { toggleSource(key); toast(getSources().includes(key) ? 'Новые слова будут приходить отсюда' : 'Убрано из ежедневной учёбы'); rerender(); },
  closeSheet: () => closeSheet(),
  learn: arg => startLearn(null, arg === 'extra'),
  review: () => startReview(),
  hard: () => startHard(),
  browse: () => openBrowse(),
  browseSet: (arg, el) => { const [f, v] = arg.split('|'); const e = sheetEntryOf(el); e.opts.browseState[f] = v; renderBrowseSheet(e, e.opts.browseState); },
  startBrowse: (a, el) => {
    const st = sheetEntryOf(el).opts.browseState;
    S.prefs.browseModes = st.modes.slice(); savePrefs();
    launch('browse', browseWords(st), { modes: st.modes.slice(), mode: st.modes.includes('view') ? 'browse' : 'auto' });
  },
  browseMode: (id, el) => { const e = sheetEntryOf(el); e.opts.browseState.modes = toggleBrowseMode(e.opts.browseState.modes, id); renderBrowseSheet(e, e.opts.browseState); },
  learnColl: key => startLearn(wordsOf(key)),
  browseColl: key => openBrowse(key),
  collSort: s => { S.coll.sort = s; if (s === 'shuffle') S.coll.seed = Math.random(); rerender(); },
  collFilter: f => { S.coll.filter = f; rerender(); },
  collLevel: l => { S.coll.level = l; rerender(); },
  toggleDefs: () => { S.coll.hideDefs = !S.coll.hideDefs; rerender(); },
  hmDay: k => {
    S.hmSel = k;
    document.querySelectorAll('.hm i.sel').forEach(i => i.classList.remove('sel'));
    const cell = document.querySelector(`.hm i[data-arg="${k}"]`); if (cell) cell.classList.add('sel');
    const info = $('#hmInfo'); if (info) info.textContent = hmInfo(k);
  },
  setGoal: n => setGoalValue(n),
  goalStep: d => setGoalValue(S.settings.dailyGoal + Number(d)),
  setMode: m => { setReviewModes(toggleModeIn(getReviewModes(), m)); rerender(); },
  setTr: t => { S.prefs.translation = t; savePrefs(); rerender(); },
  setTheme: v => { setTheme(v, true); rerender(); },
  toggleAutoplay: () => { S.prefs.autoplay = !S.prefs.autoplay; savePrefs(); rerender(); },
  toggleDyslexia: () => { const on = !document.body.classList.contains('dyslexia-mode'); try { localStorage.setItem('dyslexiaMode', String(on)); } catch (e) {} applyDyslexia(); rerender(); },
  install: () => openInstall(),
  hideDm: () => { try { sessionStorage.setItem('dmHide', '1'); } catch (e) {} $('#dmBanner').innerHTML = ''; },
  installNow: async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; closeSheet(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACTIONS[t.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(t.dataset.arg, t, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'goalInput') { if (e.target.value !== '') setGoalValue(e.target.value); return; }
  if (e.target.id === 'dictSearch') { S.dict.query = e.target.value; clearTimeout(searchTimer); searchTimer = setTimeout(updateDictBody, 120); }
});
let searchTimer = null;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheets.length) closeSheet();
  if (wordSheet && sheets[sheets.length - 1] === wordSheet && !/input|textarea|select/i.test((e.target.tagName || ''))) {
    if (e.key === 'ArrowRight') stepWord(1);
    if (e.key === 'ArrowLeft') stepWord(-1);
  }
});
$('#view').addEventListener('scroll', () => { $('#topbar').classList.toggle('scrolled', $('#view').scrollTop > 8); }, { passive: true });

/* =====================================================================
   ПОСЛЕ ОТРИСОВКИ: таймер повторения, прокрутка календаря
   ===================================================================== */
let cdTimer = null;
function afterRender() {
  clearInterval(cdTimer);
  const cd = $('#cdown');
  if (cd) {
    const st = computeStats();
    cdTimer = setInterval(() => {
      const left = st.nextDue - Date.now();
      const el = $('#cdown');
      if (!el) { clearInterval(cdTimer); return; }
      if (left <= 0) { clearInterval(cdTimer); rerender(); return; }
      el.textContent = fmtCountdown(left);
    }, 1000);
  }
  const hs = $('#hmScroll'), t = hs && hs.querySelector('.hm i.t');
  if (t) hs.scrollLeft = t.offsetLeft - hs.clientWidth / 2 + t.offsetWidth / 2;   // текущая неделя — по центру
}

// Если в Chrome на телефоне включена «Версия для ПК», браузер рисует страницу
// шириной ~980px и уменьшает её — всё становится мелкой полоской посередине.
// Исправить это может только сам ученик, поэтому подсказываем, где выключить.
function checkDesktopSiteMode() {
  try {
    const touch = window.matchMedia('(pointer:coarse)').matches;
    const tooWide = screen.width && window.innerWidth > screen.width * 1.35;
    if (!touch || !tooWide || window.innerWidth >= 1024 || sessionStorage.getItem('dmHide')) return;
    $('#dmBanner').innerHTML = `<div class="dm-banner">${ic('info', 18)}<span>В браузере включена «Версия для ПК», поэтому всё мелкое. Галочка в меню ⋮ отключает её только на минуту — выключите насовсем: ⋮ → Настройки → Настройки сайтов → Версия для ПК.</span><button data-act="hideDm">OK</button></div>`;
  } catch (e) {}
}
// ---- Тема: 'light' | 'dark' | 'auto' (как на телефоне)
function themePref() { try { return localStorage.getItem('vocabTheme') || 'auto'; } catch (e) { return 'auto'; } }
function applyTheme() {
  const pref = themePref();
  const dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#0f1117' : '#f4f5f9');
}
function setTheme(v, save) {
  try { localStorage.setItem('vocabTheme', v); } catch (e) {}
  applyTheme();
  if (save) { S.prefs.theme = v; savePrefs(); }
}
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (themePref() === 'auto') applyTheme(); }); } catch (e) {}
function applyDyslexia() {
  let on = false; try { on = localStorage.getItem('dyslexiaMode') === 'true'; } catch (e) {}
  document.body.classList.toggle('dyslexia-mode', on);
}

/* =====================================================================
   СТАРТ
   ===================================================================== */
function skeleton() {
  $('#view').innerHTML = `<div class="screen"><div class="skeleton" style="height:78px;margin-bottom:10px"></div>
    <div class="skeleton" style="height:190px;margin-bottom:10px"></div><div class="skeleton" style="height:130px;margin-bottom:12px"></div><div class="skeleton" style="height:80px"></div></div>`;
}
function fatal(msg) {
  const v = $('#view'); if (!v) return;   // экран «аккаунт на проверке» уже заменил страницу
  v.innerHTML = `<div class="fatal card"><b style="font-size:18px">${esc(msg)}</b><p class="muted" style="margin:8px 0 16px">Проверьте интернет и обновите страницу. Ваш прогресс не потерян.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" type="button" onclick="location.reload()">Обновить</button><a class="btn btn-soft" href="${PLATFORM_HOME_URL}">На платформу</a></div></div>`;
}
async function boot() {
  applyDyslexia();
  skeleton();
  S.user = await getUser();
  if (!S.user) { fatal('Войдите в аккаунт, чтобы учить слова'); return; }
  const cached = readWordsCache();
  if (cached) setWords(cached);
  await withTimeout(flushPending(S.user.id).catch(() => 0), 6000);
  try {
    await Promise.all([cached ? Promise.resolve() : loadWords(), loadProgress(), loadLists(), loadSettings(), loadActivity()]);
  } catch (e) { console.error(e); fatal('Не удалось загрузить словарь'); return; }
  S.ready = true;
  checkDesktopSiteMode();
  // Перезагрузка (в том числе когда Chrome сам перезагружает страницу при
  // переключении «Версии для ПК») возвращает на тот же экран, а не на главную.
  let navType = '';
  try { navType = (performance.getEntriesByType('navigation')[0] || {}).type || ''; } catch (e) {}
  let saved = null; try { saved = sessionStorage.getItem('vocabNav'); } catch (e) {}
  NAV = (navType === 'reload' && saved) ? saved : (location.hash || '#home');
  route();
  if (cached) loadWords().then(rerender).catch(() => {});   // тихо обновляем копию словаря
}
// Вернулись на вкладку (или из повторения через «назад») — данные могли устареть
function refreshFromDb() {
  flushPending(S.user.id).catch(() => 0)
    .then(() => Promise.all([loadProgress(), loadActivity()]))
    .then(rerender)
    .catch(e => console.warn('Не удалось обновить прогресс:', e && e.message));   // остаёмся на том, что уже загружено
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.ready) refreshFromDb(); });
window.addEventListener('pageshow', e => { if (e.persisted && S.ready) refreshFromDb(); });
window.addEventListener('online', () => { if (S.ready) refreshFromDb(); });
// Масштабирование пальцами отключено, как в обычном приложении (iOS Safari
// игнорирует запрет в meta viewport, поэтому дублируем его здесь).
try { history.scrollRestoration = 'manual'; } catch (e) {}
window.addEventListener('pageshow', () => window.scrollTo(0, 0));
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
boot();
</script>
</body>
