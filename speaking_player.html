<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Practice Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fa; }
        .recording-active { animation: pulse-red 1.5s infinite; background-color: #ef4444; color: white; border-color: #ef4444;}
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="startOverlay" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="mic" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-bold mb-2 text-slate-800" id="overlayTitle">Loading Task...</h2>
        <p class="text-gray-500 mb-8 max-w-sm text-sm" id="overlayDesc">Checking authorization and fetching your practice materials.</p>
        <button id="startBtn" class="bg-slate-900 hover:bg-indigo-600 transition text-white px-8 py-3.5 rounded-xl font-bold hidden flex items-center justify-center shadow-md cursor-pointer">
            Allow Mic & Start Practice <i data-lucide="play" class="w-4 h-4 ml-2 fill-current"></i>
        </button>
    </div>

    <!-- Directions — как на реальном TOEFL: сценарий показывается ОДИН раз перед
         всем набором (Listen & Repeat или Interview), а не разбросан по отдельным вопросам.
         Если у набора есть интро-картинка/аудио (speaking_tests.intro_image_url /
         intro_audio_url) — они показываются и проигрываются здесь же. -->
    <div id="directionsOverlay" class="hidden fixed inset-0 bg-white z-50 flex-col items-center justify-center p-6 text-center">
        <div class="max-w-lg w-full">
            <span class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mb-3 inline-block">Directions</span>
            <img id="directionsImage" class="hidden mx-auto mb-5 max-h-56 rounded-2xl border border-slate-100" src="" alt="">
            <div class="bg-slate-50 border border-slate-100 rounded-2xl p-6 text-left text-sm text-slate-700 leading-relaxed mb-5" id="directionsText"></div>
            <audio id="directionsAudio" class="hidden mx-auto mb-8 w-full max-w-sm" controls preload="auto"></audio>
            <button id="directionsBeginBtn" class="bg-slate-900 hover:bg-indigo-600 transition text-white px-8 py-3.5 rounded-xl font-bold flex items-center justify-center shadow-md mx-auto cursor-pointer">
                Begin <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
            </button>
        </div>
    </div>

    <div id="playerUI" class="w-full flex-col items-center hidden h-screen max-h-[800px]">
        <div class="w-full bg-[#f8f9fa] p-4 flex justify-between items-center max-w-4xl mx-auto shrink-0">
            <button onclick="exitPractice()" class="text-slate-400 hover:text-slate-900 transition p-2 cursor-pointer bg-white rounded-full shadow-sm">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h1 class="font-bold text-slate-800 flex-1 text-center" id="taskInstruction">Practice Task</h1>
            <div class="text-sm font-semibold text-gray-400 w-16 text-right"><span id="currentTaskNum">1</span> / <span id="totalTasks">...</span></div>
        </div>

        <div class="w-full max-w-md mt-6 mb-auto aspect-video sm:aspect-square bg-black border border-gray-200 rounded-[2rem] overflow-hidden shadow-lg flex items-center justify-center relative group cursor-pointer" id="mediaContainer">
            <video id="taskMedia" class="w-full h-full object-cover hidden" playsinline preload="auto"></video>
            <img id="taskImage" class="w-full h-full object-cover hidden" src="" alt="Task Image">

            <div id="playOverlay" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center text-white hidden backdrop-blur-sm transition">
                <i data-lucide="play-circle" class="w-16 h-16 mb-3 text-white/90 group-hover:scale-110 transition-transform"></i>
                <span class="font-bold text-sm tracking-wide">Tap to play media</span>
            </div>
        </div>

        <div class="w-full max-w-md bg-white border border-gray-200 rounded-[2rem] shadow-md flex flex-col items-center p-6 shrink-0 mt-8 mb-6">
            <div id="statusBanner" class="text-[10px] font-bold uppercase mb-4 tracking-widest text-slate-400 px-4 py-1.5 rounded-full bg-slate-50 border border-slate-100 transition-colors">Ready</div>
            <div class="flex items-center justify-center space-x-6 w-full">
                <div id="micIcon" class="w-16 h-16 rounded-full bg-gray-100 text-slate-400 flex items-center justify-center transition-colors shadow-inner shrink-0">
                    <i data-lucide="mic" class="w-6 h-6"></i>
                </div>
                <div id="timerDisplay" class="text-5xl font-mono font-black text-slate-800 tabular-nums">00:00</div>
            </div>

            <div class="w-full bg-gray-100 h-2 rounded-full mt-6 overflow-hidden">
                <div id="timeProgressBar" class="h-full bg-indigo-600 w-0 transition-all duration-1000 ease-linear"></div>
            </div>
        </div>
    </div>

    <div id="completionUI" class="hidden w-full max-w-md p-10 bg-white rounded-3xl text-center border border-gray-100 shadow-sm">
        <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="check-check" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-bold mb-2 text-slate-800">Awesome Job!</h2>
        <p class="text-sm text-slate-500 mb-8">Your speaking responses have been successfully recorded and saved to your profile.</p>
        <div class="flex space-x-3">
            <button onclick="window.location.reload()" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-slate-700 font-bold rounded-xl transition cursor-pointer">
                Retry Set
            </button>
            <a id="doneLink" href="speaking.html" class="flex-1 py-3 bg-slate-900 hover:bg-indigo-600 text-white font-bold rounded-xl transition flex items-center justify-center shadow-md">
                Done
            </a>
        </div>
    </div>

    <audio id="taskAudio" class="hidden" preload="auto"></audio>

    <script>
        lucide.createIcons();

        let currentUser = null;
        let questions = [];
        let currentIndex = 0;
        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let timerInterval = null;
        let taskType = '';
        let currentAttemptId = null;
        let audioCtx = null;
        let recordingMimeType = '';
        let testScenario = ''; // описание/сценарий сета, из speaking_tests.description
        let testIntroAudio = ''; // speaking_tests.intro_audio_url — озвучка сценария (если есть)
        let testIntroImage = ''; // speaking_tests.intro_image_url — картинка к сценарию (если есть)

        // Картинка в media_url (а не видео): у интервью вопрос тогда играет из audio_prompt_url,
        // как в Listen & Repeat. Старые интервью с mp4 в media_url работают как раньше.
        function isImageUrl(u) {
            return /\.(png|jpe?g|webp|gif|avif)(\?|#|$)/i.test(String(u || ''));
        }
        let testId = null;
        let recordingStarting = false;   // запись уже запускается (ждём микрофон)
        let practiceRunning = false;     // идёт запись набора — предупреждаем при уходе

        function spEsc(s) {
            return String(s === null || s === undefined ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Пауза при сбое сохранения: запись не теряется, ждём связь и пробуем снова
        // (так же сделано в полном тесте, speaking-engine.js)
        function waitForRetry(err) {
            return new Promise(resolve => {
                setStatus('Connection problem', 'bg-rose-100 text-rose-700 border-rose-200');
                const fromServer = err && err.code;
                const box = document.createElement('div');
                box.className = 'fixed inset-x-0 bottom-6 mx-auto w-[92%] max-w-md bg-white border border-rose-200 rounded-2xl shadow-lg p-5 text-center z-[60]';
                box.innerHTML = `
                    <p class="font-bold text-slate-900 mb-1">Не удалось сохранить ответ</p>
                    <p class="text-sm text-slate-500 mb-3">${fromServer
                        ? 'Сервер не принял запись. Она не потеряна — нажмите «Повторить»; если не поможет, сообщите преподавателю.'
                        : 'Похоже, пропал интернет. Запись не потеряна — нажмите «Повторить», когда связь вернётся.'}</p>
                    <p class="text-[11px] text-rose-500 mb-4">${spEsc(err && (err.message || err.code) || err)}</p>
                    <button class="px-6 py-2.5 bg-slate-900 text-white rounded-xl font-bold text-sm cursor-pointer">Повторить</button>`;
                document.body.appendChild(box);
                const done = () => { window.removeEventListener('online', done); box.remove(); resolve(); };
                box.querySelector('button').onclick = done;
                window.addEventListener('online', done);
            });
        }

        function exitPractice() {
            if (practiceRunning && !confirm('Выйти из практики?\n\nУже записанные ответы сохранены, но набор останется незаконченным.')) return;
            practiceRunning = false;
            window.location.href = taskType === 'interview' ? 'interview.html' : 'listen_repeat.html';
        }
        window.addEventListener('beforeunload', e => { if (practiceRunning) { e.preventDefault(); e.returnValue = ''; } });

        // Подбирает mimeType, который реально поддерживается текущим браузером.
        // Safari (iOS/macOS) не понимает audio/webm, но понимает audio/mp4 — поэтому
        // порядок важен: сначала пробуем варианты, максимально совместимые со всеми браузерами.
        function getSupportedMimeType() {
            if (typeof MediaRecorder === 'undefined' || typeof MediaRecorder.isTypeSupported !== 'function') {
                return ''; // отдадим браузеру решать самому
            }
            const candidates = [
                'audio/mp4',
                'audio/aac',
                'audio/webm;codecs=opus',
                'audio/webm',
                'audio/ogg;codecs=opus'
            ];
            for (const type of candidates) {
                try {
                    if (MediaRecorder.isTypeSupported(type)) return type;
                } catch (e) { /* игнорируем и пробуем следующий вариант */ }
            }
            return '';
        }

        async function init() {
            try {
                if (typeof requireAuth !== 'function') throw new Error("auth.js script not loaded properly.");

                currentUser = await requireAuth();
                if (!currentUser) return;

                const urlParams = new URLSearchParams(window.location.search);
                testId = urlParams.get('id');
                const urlType = urlParams.get('type');
                taskType = urlType === 'interview' ? 'interview' : 'listen_repeat';
                // Возврат в список СВОЕГО типа заданий, а не на общую страницу Speaking
                const doneLink = document.getElementById('doneLink');
                if (doneLink) doneLink.href = (taskType === 'interview') ? 'interview.html' : 'listen_repeat.html';

                if (!testId) throw new Error("No test ID provided in the URL.");

                // Набор: сценарий для Directions-экрана и ТИП. Тип берём из самого
                // набора — раньше он брался из адреса, и interview-набор мог открыться
                // как Listen & Repeat (и наоборот).
                const { data: testMeta, error: metaError } = await _supabase
                    .from('speaking_tests')
                    .select('*')
                    .eq('id', testId)
                    .maybeSingle();
                if (metaError) throw metaError;
                if (!testMeta) throw new Error("This practice set is not available.");
                if (testMeta.type === 'interview' || testMeta.type === 'listen_repeat') taskType = testMeta.type;
                testScenario = testMeta.description ? String(testMeta.description).trim() : '';
                testIntroAudio = testMeta.intro_audio_url || '';
                testIntroImage = testMeta.intro_image_url || '';
                const doneLink2 = document.getElementById('doneLink');
                if (doneLink2) doneLink2.href = (taskType === 'interview') ? 'interview.html' : 'listen_repeat.html';
                // Попытка теперь создаётся по кнопке Start, а не при открытии
                // страницы: раньше каждое открытие плеера оставляло пустую попытку,
                // и в списке набор числился пройденным.

                const { data, error } = await _supabase
                    .from('speaking_questions')
                    .select('*')
                    .eq('test_id', testId)
                    .order('order_num', { ascending: true });

                if (error) throw error;
                if (!data || data.length === 0) throw new Error("No questions found for this test in the database.");

                questions = data;

                document.getElementById('totalTasks').innerText = questions.length;
                document.getElementById('taskInstruction').innerText = taskType === 'interview' ? 'Interview Practice' : 'Listen and repeat';

                document.getElementById('overlayTitle').innerText = "Ready to start";
                document.getElementById('overlayDesc').innerText = "Make sure you are in a quiet place and your microphone is working.";
                document.getElementById('startBtn').classList.remove('hidden');

            } catch (err) {
                console.error("Initialization error:", err);
                document.getElementById('overlayTitle').innerText = "Oops!";
                document.getElementById('overlayDesc').innerText = err.message;
            }
        }

        document.getElementById('startBtn').onclick = async () => {
            if (!window.isSecureContext && location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                alert(`ОШИБКА БЕЗОПАСНОСТИ:
Браузеры блокируют микрофон на сайтах без HTTPS!

Пожалуйста, откройте сайт по безопасному адресу https:// (не http://).`);
                return;
            }

            if (typeof window.MediaRecorder === 'undefined') {
                alert(`Ваше устройство не поддерживает запись звука в этом браузере.

На iPhone/iPad/Mac это означает, что версия iOS/iPadOS/macOS слишком старая (нужна iOS 14.3 или новее, либо Safari 14.1+).

Пожалуйста, обновите систему в Настройки → Основные → Обновление ПО и попробуйте снова.`);
                return;
            }

            const startBtn = document.getElementById('startBtn');
            if (startBtn.disabled) return; // двойной клик создавал две попытки
            recordingMimeType = getSupportedMimeType();
            startBtn.disabled = true;

            // Инициализируем Web Audio API при клике пользователя
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

                const { data: attemptData, error: attemptError } = await _supabase
                    .from('speaking_attempts')
                    .insert([{ user_id: currentUser.id, test_id: testId }])
                    .select()
                    .single();
                if (attemptError || !attemptData) {
                    console.error("Ошибка создания попытки:", attemptError);
                    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
                    startBtn.disabled = false;
                    alert("Не удалось начать практику — попытка не создана в базе.\n\n"
                        + (attemptError ? attemptError.message : '') + "\n\nПроверьте интернет и нажмите Start ещё раз.");
                    return;
                }
                currentAttemptId = attemptData.id;
                practiceRunning = true;

                document.getElementById('startOverlay').classList.add('hidden');

                // Экран Directions — если у набора есть сценарий или озвученное интро
                // (раньше только у Listen & Repeat; старые интервью без описания — как раньше)
                if (testScenario || testIntroAudio) {
                    showDirectionsScreen();
                } else {
                    document.getElementById('playerUI').classList.remove('hidden');
                    document.getElementById('playerUI').classList.add('flex');
                    loadQuestion(0);
                }
            } catch (err) {
                console.error("Media access error:", err);
                startBtn.disabled = false;

                let details = "";
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    details = `Доступ к микрофону заблокирован браузером.

Как исправить:
1. Нажмите на иконку "Замок" или "Настройки сайта" слева в адресной строке.
2. Переключите доступ к Микрофону в состояние "Разрешить".
3. Перезагрузите страницу.`;
                } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    details = "Микрофон не обнаружен на вашем устройстве.";
                } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                    details = "Микрофон занят другим приложением (запись голосового, звонок в мессенджере). Закройте фоновые приложения.";
                } else if (err.name === 'SecurityError') {
                    details = "Доступ заблокирован политикой безопасности браузера (требуется SSL-сертификат HTTPS).";
                } else {
                    details = `Код ошибки браузера: ${err.name}\n${err.message}`;
                }

                alert(`Не удалось включить микрофон!\n\n${details}`);
            }
        };

        function showDirectionsScreen() {
            const overlay = document.getElementById('directionsOverlay');
            const textBox = document.getElementById('directionsText');
            const introImg = document.getElementById('directionsImage');
            const introAudio = document.getElementById('directionsAudio');
            textBox.innerText = testScenario;
            textBox.classList.toggle('hidden', !testScenario);
            if (testIntroImage) {
                introImg.src = testIntroImage;
                introImg.classList.remove('hidden');
            }
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            // Озвучка сценария: пробуем включить сразу; если браузер не дал —
            // у плеера есть кнопка ▶, а Begin доступна в любой момент
            if (testIntroAudio) {
                introAudio.src = testIntroAudio;
                introAudio.classList.remove('hidden');
                const p = introAudio.play();
                if (p !== undefined) p.catch(e => console.warn('Интро не запустилось автоматически:', e));
            }

            document.getElementById('directionsBeginBtn').onclick = () => {
                introAudio.pause();
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                document.getElementById('playerUI').classList.remove('hidden');
                document.getElementById('playerUI').classList.add('flex');
                loadQuestion(0);
            };
        }

        function playBeep() {
            return new Promise((resolve) => {
                // На iOS AudioContext засыпает — будим его синхронно,
                // resume() тут не нужно ждать: бип всё равно отыграет.
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.4);

                setTimeout(resolve, 400);
            });
        }

        function loadQuestion(i) {
            currentIndex = i;
            const q = questions[i];

            document.getElementById('currentTaskNum').innerText = i + 1;
            resetUI();

            const video = document.getElementById('taskMedia');
            const img = document.getElementById('taskImage');
            const audio = document.getElementById('taskAudio');
            const overlay = document.getElementById('playOverlay');
            const mediaContainer = document.getElementById('mediaContainer');

            video.classList.add('hidden');
            img.classList.add('hidden');
            overlay.classList.add('hidden');
            mediaContainer.onclick = null;

            // Интервью с видео (mp4 в media_url) — как раньше. Интервью с картинкой в media_url
            // идёт по второй ветке: картинка + audio_prompt_url, как Listen & Repeat.
            if (taskType === 'interview' && !isImageUrl(q.media_url)) {
                if (!q.media_url) {
                    alert("Ошибка: В базе данных не заполнена ссылка на видео (media_url) для этого вопроса!");
                    return;
                }

                video.src = q.media_url;
                video.load();
                video.classList.remove('hidden');

                setStatus('Listening to Question...', 'bg-sky-100 text-sky-700 border-sky-200');

                video.onerror = (e) => {
                    console.error("Video load error:", e);
                    alert("Ошибка загрузки видеофайла по ссылке:\n" + q.media_url + "\n\nПроверьте доступность файла в Supabase Storage.");
                };

                video.onended = async () => {
                    setStatus('Get Ready...', 'bg-amber-100 text-amber-700 border-amber-200');
                    await playBeep();
                    await startRecording(q.time_limit || 45);
                };

                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => {
                        console.error("Video play error:", e);
                        setStatus('Waiting for you to start', 'bg-amber-100 text-amber-700');
                        overlay.classList.remove('hidden');

                        mediaContainer.onclick = () => {
                            overlay.classList.add('hidden');
                            setStatus('Listening to Question...', 'bg-sky-100 text-sky-700 border-sky-200');
                            video.play().catch(err => alert("Не удалось проиграть видео: " + err.message));
                        };
                    });
                }

            } else {
                const listenLabel = taskType === 'interview' ? 'Listening to Question...' : 'Listening to Phrase...';
                const defaultLimit = taskType === 'interview' ? 45 : 8;

                if (q.media_url) {
                    img.src = q.media_url;
                    img.classList.remove('hidden');
                }

                if (q.audio_prompt_url) {
                    audio.src = q.audio_prompt_url;
                    audio.load();
                } else {
                    alert("Ошибка: Отсутствует ссылка на аудиофайле (audio_prompt_url) для этого задания.");
                    return;
                }

                setStatus(listenLabel, 'bg-sky-100 text-sky-700 border-sky-200');

                audio.onerror = (e) => {
                    console.error("Audio load error:", e);
                    alert("Ошибка загрузки аудио по ссылке:\n" + q.audio_prompt_url);
                };

                audio.onended = async () => {
                    setStatus('Get Ready...', 'bg-amber-100 text-amber-700 border-amber-200');
                    await playBeep();
                    await startRecording(q.time_limit || defaultLimit);
                };

                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => {
                        console.error("Audio play error:", e);
                        setStatus('Waiting for you to start', 'bg-amber-100 text-amber-700');
                        overlay.classList.remove('hidden');

                        mediaContainer.onclick = () => {
                            overlay.classList.add('hidden');
                            setStatus(listenLabel, 'bg-sky-100 text-sky-700 border-sky-200');
                            audio.play().catch(err => alert("Не удалось проиграть аудио: " + err.message));
                        };
                    });
                }
            }
        }

        function setStatus(text, classes) {
            const banner = document.getElementById('statusBanner');
            banner.className = `text-[10px] font-bold uppercase mb-4 tracking-widest px-4 py-1.5 rounded-full border transition-colors shadow-sm ${classes}`;
            banner.innerText = text;
        }

        function resetUI() {
            clearInterval(timerInterval);
            document.getElementById('timerDisplay').innerText = "00:00";
            document.getElementById('timeProgressBar').style.width = "0%";
            document.getElementById('micIcon').className = "w-16 h-16 rounded-full bg-gray-100 text-slate-400 flex items-center justify-center transition-colors shadow-inner shrink-0";
        }

        // КРИТИЧНО ДЛЯ iOS: на айфоне проигрывание промпта переводит аудиосессию
        // в режим воспроизведения, и микрофонный трек, полученный ДО этого,
        // остаётся формально «живым», но отдаёт тишину. Поэтому берём поток
        // заново непосредственно перед каждой записью — это заставляет iOS
        // вернуть сессию в режим записи. На Android/десктопе безвредно.
        async function acquireFreshStream() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            return mediaStream;
        }

        async function startRecording(limit) {
            if (recordingStarting || (mediaRecorder && mediaRecorder.state === 'recording')) return;
            recordingStarting = true;
            setStatus('Recording...', 'recording-active');

            try {
                await acquireFreshStream();
                recordingStarting = false;
            } catch (err) {
                recordingStarting = false;
                console.error('Не удалось перезахватить микрофон:', err);
                setStatus('Mic error', 'bg-red-100 text-red-700 border-red-200');
                alert('Не удалось получить доступ к микрофону для записи.\n\n' + (err.message || err.name));
                return;
            }


            document.getElementById('micIcon').classList.remove('bg-gray-100', 'text-slate-400');
            document.getElementById('micIcon').classList.add('bg-transparent', 'text-white');

            audioChunks = [];

            try {
                mediaRecorder = new MediaRecorder(mediaStream, recordingMimeType ? { mimeType: recordingMimeType } : undefined);
            } catch (err) {
                console.error("MediaRecorder init error:", err);
                try {
                    // Запасной вариант: пробуем создать без явного mimeType —
                    // иногда именно указание mimeType и вызывает отказ в конкретной версии Safari.
                    mediaRecorder = new MediaRecorder(mediaStream);
                } catch (err2) {
                    console.error("MediaRecorder fallback init error:", err2);
                    setStatus('Recording failed', 'bg-red-100 text-red-700 border-red-200');
                    alert(`Не удалось начать запись звука на этом устройстве.\n\nПопробуйте:\n1. Обновить iOS/Safari до последней версии.\n2. Перезагрузить страницу и разрешить доступ к микрофону заново.\n\nТехническая причина: ${err2.message || err2.name}`);
                    return;
                }
            }

            mediaRecorder.onerror = (e) => {
                console.error("MediaRecorder runtime error:", e.error || e);
                setStatus('Recording error', 'bg-red-100 text-red-700 border-red-200');
            };

            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };
            mediaRecorder.start();

            let time = limit;
            const progress = document.getElementById('timeProgressBar');
            const display = document.getElementById('timerDisplay');

            progress.style.transitionDuration = '1s';

            const updateDisplay = () => {
                display.innerText = `00:${time < 10 ? '0'+time : time}`;
                progress.style.width = `${((limit - time) / limit) * 100}%`;
            };

            updateDisplay();

            timerInterval = setInterval(() => {
                time--;
                updateDisplay();
                if (time <= 0) {
                    clearInterval(timerInterval);
                    stopRecording();
                }
            }, 1000);
        }

        async function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                setStatus('Saving to Cloud...', 'bg-amber-100 text-amber-700 border-amber-200');

                document.getElementById('micIcon').classList.remove('bg-transparent', 'text-white');
                document.getElementById('micIcon').classList.add('bg-amber-100', 'text-amber-500');

                const itemIndex = currentIndex;
                mediaRecorder.onstop = async () => {
                    const mimeType = mediaRecorder.mimeType || recordingMimeType || 'audio/webm';
                    let fileExt = 'webm';
                    if (mimeType.includes('mp4')) fileExt = 'm4a';
                    else if (mimeType.includes('aac')) fileExt = 'aac';
                    else if (mimeType.includes('ogg')) fileExt = 'ogg';

                    const blob = new Blob(audioChunks, { type: mimeType });

                    // Диагностика пустой записи: на iOS при проблеме с
                    // аудиосессией запись «проходит», но файл получается
                    // пустой. Раньше такая тишина молча уезжала в базу и
                    // обнаруживалась только учителем при проверке.
                    if (blob.size < 1000) {
                        console.warn('Пустая запись, размер:', blob.size);
                        alert('Запись получилась пустой — микрофон не передал звук.\n\nПроверьте, что: не подключены наушники с отдельным микрофоном, не идёт звонок в другом приложении, и в настройках Safari разрешён доступ к микрофону.\n\nПопробуйте пройти это задание ещё раз.');
                    }

                    const question = questions[itemIndex];
                    const fileName = `${currentUser.id}/${taskType}_q${question.id}_${Date.now()}.${fileExt}`;

                    // Сохраняем, пока не получится: раньше при сбое показывалось
                    // сообщение, и набор шёл дальше — запись терялась
                    let uploaded = false, tries = 0;
                    for (;;) {
                        try {
                            if (!uploaded) {
                                const { error: uploadError } = await _supabase.storage
                                    .from('student_recordings')
                                    .upload(fileName, blob, { contentType: mimeType, upsert: true });
                                if (uploadError) throw uploadError;
                                uploaded = true;
                            }
                            // Повтор: если ответ уже дошёл до базы, второй раз не пишем
                            if (tries > 0) {
                                const { data: existing, error: exErr } = await _supabase
                                    .from('speaking_responses').select('id')
                                    .eq('attempt_id', currentAttemptId).eq('question_id', question.id).limit(1);
                                if (exErr) throw exErr;
                                if (existing && existing.length) break;
                            }
                            const { error: dbError } = await _supabase
                                .from('speaking_responses')
                                .insert([{ attempt_id: currentAttemptId, question_id: question.id, user_audio_url: fileName }]);
                            if (dbError) throw dbError;
                            break;
                        } catch (err) {
                            tries++;
                            console.error("Save process error:", err);
                            await waitForRetry(err);
                            setStatus('Saving to Cloud...', 'bg-amber-100 text-amber-700 border-amber-200');
                        }
                    }

                    currentIndex = itemIndex + 1;
                    if (currentIndex < questions.length) {
                        loadQuestion(currentIndex);
                    } else {
                        finish();
                    }
                };
            }
        }

        async function finish() {
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            practiceRunning = false;

            if (currentAttemptId) {
                // Отметка «набор закончен» (раньше все попытки навсегда оставались
                // in_progress). Не критично: если не дошла, записи всё равно сохранены.
                try {
                    await _supabase.from('speaking_attempts')
                        .update({ status: 'completed', completed_at: new Date().toISOString() })
                        .eq('id', currentAttemptId);
                } catch (e) { console.warn('Отметка о завершении не сохранилась:', e); }
                const id = encodeURIComponent(currentAttemptId);
                if (taskType === 'interview') {
                    window.location.href = `interview_results.html?attempt_id=${id}&type=${taskType}`;
                } else {
                    window.location.href = `speaking_results.html?attempt_id=${id}&type=${taskType}`;
                }
            } else {
                document.getElementById('playerUI').classList.add('hidden');
                document.getElementById('playerUI').classList.remove('flex');
                document.getElementById('completionUI').classList.remove('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
