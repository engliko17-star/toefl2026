<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fa; }
        
        /* Анимация пульсации для записи */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-active { animation: pulse-red 1.5s infinite; background-color: #ef4444; color: white;}
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="startOverlay" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <h2 class="text-2xl font-bold mb-2 text-slate-800" id="overlayTitle">Loading Test...</h2>
        <p class="text-gray-500 mb-8 text-center max-w-sm text-sm" id="overlayDesc">Checking authorization and fetching questions.</p>
        <button id="startBtn" class="bg-slate-900 text-white px-8 py-3 rounded-xl font-bold hover:bg-slate-800 transition shadow-md flex items-center hidden">
            Start Practice <i data-lucide="play" class="w-4 h-4 ml-2"></i>
        </button>
    </div>

    <div id="playerUI" class="w-full flex flex-col items-center">
        <div class="fixed top-0 left-0 right-0 p-4 flex justify-between items-center max-w-4xl mx-auto w-full bg-[#f8f9fa] z-10">
            <h1 class="text-lg font-bold text-slate-800" id="taskInstruction">Listen and repeat only once.</h1>
            <div class="text-sm font-semibold text-gray-400">Task <span id="currentTaskNum">1</span> / <span id="totalTasks">...</span></div>
        </div>

        <div class="w-full max-w-md mx-auto mt-16 mb-24 flex flex-col items-center">
            <div id="mediaContainer" class="w-full aspect-square border border-gray-200 rounded-3xl overflow-hidden bg-white flex items-center justify-center shadow-sm">
                <img src="https://placehold.co/600x600/f3f4f6/a1a1aa?text=Loading..." alt="Task Media" class="object-cover w-full h-full" id="taskImage">
            </div>
        </div>

        <div class="fixed bottom-10 left-1/2 transform -translate-x-1/2 w-64 bg-white border border-gray-200 rounded-3xl shadow-lg overflow-hidden flex flex-col">
            <div id="statusBanner" class="bg-slate-900 text-white text-[10px] font-bold text-center py-1.5 tracking-widest uppercase transition-colors">
                Listen
            </div>
            <div class="flex items-center justify-center p-4 space-x-4">
                <div id="micIcon" class="w-12 h-12 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center transition-all">
                    <i data-lucide="mic" class="w-6 h-6"></i>
                </div>
                <div id="timerDisplay" class="text-3xl font-mono font-bold text-slate-800">
                    00:00
                </div>
            </div>
        </div>
    </div>

    <div id="completionUI" class="hidden w-full max-w-2xl mx-auto mt-10">
        <div class="bg-white p-10 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center text-center">
            <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mb-6">
                <i data-lucide="trophy" class="w-10 h-10"></i>
            </div>
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Test Completed!</h2>
            <p class="text-base text-gray-500 mb-10">Great job. Your audio responses have been successfully saved.</p>
            
            <div class="grid grid-cols-2 gap-4 w-full mb-10">
                <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100">
                    <div class="text-xs font-bold tracking-wider text-gray-400 uppercase mb-2">Raw Score</div>
                    <div class="text-2xl font-bold text-slate-800">Pending Eval.</div>
                </div>
                <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100">
                    <div class="text-xs font-bold tracking-wider text-gray-400 uppercase mb-2">Status</div>
                    <div class="text-2xl font-bold text-emerald-500 flex items-center justify-center">
                        <i data-lucide="check-circle-2" class="w-6 h-6 mr-2"></i> Saved
                    </div>
                </div>
            </div>

            <div class="flex space-x-4 w-full max-w-sm">
                <a href="speaking.html" class="flex-1 py-4 bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold rounded-2xl flex items-center justify-center transition shadow-sm">
                    Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <audio id="taskAudio" src=""></audio>

    <script>
        lucide.createIcons();

        // 1. Настройки Supabase
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Получение ID теста из URL
        const urlParams = new URLSearchParams(window.location.search);
        const testId = urlParams.get('id');
        const testType = urlParams.get('type') || 'listen_repeat';

        // Глобальные переменные
        let currentUser = null;
        let questions = [];
        let currentIndex = 0;
        let timeRemaining = 0;
        let timerInterval;

        // Запись звука
        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];

        // Элементы интерфейса
        const ui = {
            overlay: document.getElementById('startOverlay'),
            overlayTitle: document.getElementById('overlayTitle'),
            overlayDesc: document.getElementById('overlayDesc'),
            startBtn: document.getElementById('startBtn'),
            playerWrap: document.getElementById('playerUI'),
            completionWrap: document.getElementById('completionUI'),
            instruction: document.getElementById('taskInstruction'),
            currentNum: document.getElementById('currentTaskNum'),
            totalNum: document.getElementById('totalTasks'),
            image: document.getElementById('taskImage'),
            mic: document.getElementById('micIcon'),
            timer: document.getElementById('timerDisplay'),
            statusBanner: document.getElementById('statusBanner'),
            audio: document.getElementById('taskAudio')
        };

        // Загрузка пользователя и вопросов
        async function initializeTest() {
            if (!testId) {
                ui.overlayTitle.innerText = "Error";
                ui.overlayDesc.innerText = "No test ID provided.";
                return;
            }

            try {
                // Сначала проверяем, авторизован ли ученик
                const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
                if (authError || !user) {
                    ui.overlayTitle.innerText = "Access Denied";
                    ui.overlayDesc.innerText = "You must be logged in to take this test.";
                    return; // Останавливаем выполнение, если не авторизован
                }
                currentUser = user;

                // Если авторизован, грузим вопросы
                const { data, error } = await supabaseClient
                    .from('speaking_questions')
                    .select('*')
                    .eq('test_id', testId)
                    .order('order_num', { ascending: true });

                if (error) throw error;
                if (data.length === 0) {
                    ui.overlayTitle.innerText = "Empty Test";
                    ui.overlayDesc.innerText = "No questions found for this test.";
                    return;
                }

                questions = data;
                ui.totalNum.innerText = questions.length;
                if (testType === 'interview') {
                    ui.instruction.innerText = "Answer the interviewer's question.";
                }

                // Включаем кнопку
                ui.overlayTitle.innerText = "Microphone Check";
                ui.overlayDesc.innerText = "Please allow microphone access to start recording your answers.";
                ui.startBtn.classList.remove('hidden');

            } catch (err) {
                console.error(err);
                ui.overlayTitle.innerText = "Connection Error";
                ui.overlayDesc.innerText = "Could not load test data.";
            }
        }

        // Клик по кнопке старта
        ui.startBtn.addEventListener('click', async () => {
            try {
                // Запрашиваем доступ к микрофону
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                ui.overlay.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    loadQuestion(currentIndex);
                }, 300);
            } catch (err) {
                alert("Microphone access is strictly required to practice speaking.");
                console.error("Mic error:", err);
            }
        });

        // Загрузка вопроса
        function loadQuestion(index) {
            const item = questions[index];
            ui.currentNum.innerText = index + 1;
            ui.image.src = item.media_url || `https://placehold.co/600x600/f3f4f6/a1a1aa?text=Question+${index + 1}`;
            
            // Сброс интерфейса перед аудио
            ui.mic.classList.remove('recording-active');
            ui.mic.classList.add('bg-gray-100', 'text-gray-400');
            ui.statusBanner.innerText = "Listen";
            ui.statusBanner.classList.replace('bg-red-500', 'bg-slate-900');
            ui.statusBanner.classList.replace('bg-emerald-500', 'bg-slate-900');
            
            const timeLimit = item.time_limit || 8;
            formatTime(timeLimit);

            // Включаем аудио-вопрос
            if (item.audio_prompt_url) {
                ui.audio.src = item.audio_prompt_url;
                ui.audio.play().catch(err => {
                    console.log("Audio block by browser. Starting record immediately.");
                    startRecording(timeLimit);
                });
                ui.audio.onended = () => startRecording(timeLimit);
            } else {
                setTimeout(() => startRecording(timeLimit), 1000);
            }
        }

        // Старт записи и таймера
        function startRecording(limit) {
            ui.statusBanner.innerText = "Recording";
            ui.statusBanner.classList.replace('bg-slate-900', 'bg-red-500');
            ui.mic.classList.remove('bg-gray-100', 'text-gray-400');
            ui.mic.classList.add('recording-active');
            
            audioChunks = [];
            
            // Используем стандартный тип аудио
            mediaRecorder = new MediaRecorder(mediaStream);
            
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.start();
            
            timeRemaining = limit;
            formatTime(timeRemaining);

            timerInterval = setInterval(() => {
                timeRemaining--;
                formatTime(timeRemaining);
                
                if (timeRemaining <= 0) {
                    stopRecording();
                }
            }, 1000);
        }

        // Остановка записи
        function stopRecording() {
            clearInterval(timerInterval);
            
            ui.mic.classList.remove('recording-active');
            ui.mic.classList.add('bg-gray-100', 'text-gray-400');
            ui.statusBanner.innerText = "Saving...";
            ui.statusBanner.classList.replace('bg-red-500', 'bg-emerald-500');

            mediaRecorder.stop();
            
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const questionId = questions[currentIndex].id;
                
                // Запускаем выгрузку файла
                uploadAudioToSupabase(audioBlob, questionId);

                // Переход к следующему вопросу или финиш
                currentIndex++;
                if (currentIndex < questions.length) {
                    setTimeout(() => loadQuestion(currentIndex), 1500);
                } else {
                    setTimeout(finishTest, 1000);
                }
            };
        }

        // Отправка аудио в Storage
        async function uploadAudioToSupabase(blob, questionId) {
            if (!currentUser) return;

            // Имя файла с учетом ID пользователя для политики RLS: папка/файл.webm
            const fileName = `${currentUser.id}/test_${testId}_q${questionId}_${Date.now()}.webm`;
            
            const { data, error } = await supabaseClient.storage
                .from('student_recordings')
                .upload(fileName, blob, {
                    contentType: 'audio/webm',
                    cacheControl: '3600',
                    upsert: false
                });

            if (error) {
                console.error(`Ошибка загрузки ответа на вопрос ${questionId}:`, error.message);
            } else {
                console.log(`Файл сохранен:`, data.path);
            }
        }

        // Форматирование 00:00
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            ui.timer.innerText = `${m}:${s}`;
        }

        // Завершение теста и показ красивого экрана
        function finishTest() {
            // Выключаем микрофон (отключаем индикатор браузера)
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            // Переключаем экраны
            ui.playerWrap.classList.add('hidden');
            ui.completionWrap.classList.remove('hidden');
            lucide.createIcons();
        }

        // Запускаем первичную проверку при загрузке
        document.addEventListener('DOMContentLoaded', initializeTest);
    </script>
</body>
</html>
