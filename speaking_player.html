<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Подключаем Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; }
        
        /* Пульсация для кнопки записи */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-active { animation: pulse-red 1.5s infinite; background-color: #ef4444; color: white;}
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Стартовый оверлей для разрешения аудио -->
    <div id="startOverlay" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <h2 class="text-2xl font-bold mb-2 text-slate-800" id="overlayTitle">Loading Test...</h2>
        <p class="text-gray-500 mb-8 text-center max-w-sm text-sm" id="overlayDesc">Please wait while we fetch the questions.</p>
        <button id="startBtn" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md flex items-center hidden">
            Start Practice <i data-lucide="play" class="w-4 h-4 ml-2"></i>
        </button>
    </div>

    <!-- Верхняя панель -->
    <div class="fixed top-0 left-0 right-0 p-4 flex justify-between items-center max-w-4xl mx-auto w-full bg-white z-10">
        <h1 class="text-lg font-bold text-slate-800" id="taskInstruction">Listen and repeat only once.</h1>
        <div class="text-sm font-semibold text-gray-400">Task <span id="currentTaskNum">1</span> / <span id="totalTasks">...</span></div>
    </div>

    <!-- Контейнер для медиа (Картинка/Видео) -->
    <div class="w-full max-w-md mx-auto mt-16 mb-24 flex flex-col items-center">
        <div id="mediaContainer" class="w-full aspect-square border-2 border-gray-100 rounded-2xl overflow-hidden bg-gray-50 flex items-center justify-center shadow-sm">
            <img src="https://placehold.co/600x600/f3f4f6/a1a1aa?text=Loading..." alt="Task Media" class="object-cover w-full h-full" id="taskImage">
        </div>
    </div>

    <!-- Таймер и микрофон -->
    <div class="fixed bottom-10 left-1/2 transform -translate-x-1/2 w-64 bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden flex flex-col">
        <div id="statusBanner" class="bg-slate-900 text-white text-[10px] font-bold text-center py-1.5 tracking-widest uppercase transition-colors">
            Listen
        </div>
        <div class="flex items-center justify-center p-4 space-x-4">
            <div id="micIcon" class="w-10 h-10 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center transition-all">
                <i data-lucide="mic" class="w-5 h-5"></i>
            </div>
            <div id="timerDisplay" class="text-2xl font-mono font-bold text-slate-800">
                00:00
            </div>
        </div>
    </div>

    <audio id="taskAudio" src=""></audio>

    <script>
        lucide.createIcons();

        // 1. Инициализация Supabase
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Получение параметров из URL (?type=...&id=...)
        const urlParams = new URLSearchParams(window.location.search);
        const testId = urlParams.get('id');
        const testType = urlParams.get('type') || 'listen_repeat';

        // Глобальные переменные
        let questions = [];
        let currentIndex = 0;
        let timeRemaining = 0;
        let timerInterval;

        const ui = {
            overlay: document.getElementById('startOverlay'),
            overlayTitle: document.getElementById('overlayTitle'),
            overlayDesc: document.getElementById('overlayDesc'),
            startBtn: document.getElementById('startBtn'),
            instruction: document.getElementById('taskInstruction'),
            currentNum: document.getElementById('currentTaskNum'),
            totalNum: document.getElementById('totalTasks'),
            image: document.getElementById('taskImage'),
            mic: document.getElementById('micIcon'),
            timer: document.getElementById('timerDisplay'),
            statusBanner: document.getElementById('statusBanner'),
            audio: document.getElementById('taskAudio')
        };

        // Загрузка вопросов из базы
        async function fetchQuestions() {
            if (!testId) {
                ui.overlayTitle.innerText = "Error";
                ui.overlayDesc.innerText = "No test ID provided in the URL.";
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('speaking_questions')
                    .select('*')
                    .eq('test_id', testId)
                    .order('order_num', { ascending: true });

                if (error) throw error;
                
                if (data.length === 0) {
                    ui.overlayTitle.innerText = "Empty Test";
                    ui.overlayDesc.innerText = "There are no questions in this test yet.";
                    return;
                }

                questions = data;
                
                // Подготавливаем интерфейс
                ui.totalNum.innerText = questions.length;
                if (testType === 'interview') {
                    ui.instruction.innerText = "Answer the interviewer's question.";
                }

                // Включаем кнопку старта
                ui.overlayTitle.innerText = "Ready to Start";
                ui.overlayDesc.innerText = "Make sure your volume is up. The audio will play automatically.";
                ui.startBtn.classList.remove('hidden');

            } catch (err) {
                console.error(err);
                ui.overlayTitle.innerText = "Error Loading Test";
                ui.overlayDesc.innerText = "Could not connect to the database.";
            }
        }

        // Клик по кнопке старта
        ui.startBtn.addEventListener('click', () => {
            ui.overlay.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                loadQuestion(currentIndex);
            }, 300); // Небольшая задержка для плавности
        });

        // Загрузка конкретного вопроса
        function loadQuestion(index) {
            const item = questions[index];
            ui.currentNum.innerText = index + 1;
            
            // Если есть картинка, ставим её. Иначе - плейсхолдер.
            ui.image.src = item.media_url || `https://placehold.co/600x600/f3f4f6/a1a1aa?text=Question+${index + 1}`;
            
            // Сброс UI перед проигрыванием аудио
            ui.mic.classList.remove('recording-active');
            ui.mic.classList.add('bg-gray-100', 'text-gray-400');
            ui.statusBanner.innerText = "Listen";
            ui.statusBanner.classList.replace('bg-red-500', 'bg-slate-900');
            
            // Задаем время (если в базе пусто, ставим 8 сек по умолчанию)
            const timeLimit = item.time_limit || 8;
            formatTime(timeLimit);

            // Работа с аудио
            if (item.audio_prompt_url) {
                ui.audio.src = item.audio_prompt_url;
                ui.audio.play().catch(err => {
                    console.error("Audio playback failed:", err);
                    // Если вдруг аудио не сработало, запускаем запись сразу
                    startRecording(timeLimit);
                });

                // Когда аудио заканчивается, начинаем запись
                ui.audio.onended = () => {
                    startRecording(timeLimit);
                };
            } else {
                // Если аудио нет, сразу начинаем запись
                setTimeout(() => startRecording(timeLimit), 1000);
            }
        }

        // Начало записи и таймера
        function startRecording(limit) {
            ui.statusBanner.innerText = "Recording";
            ui.statusBanner.classList.replace('bg-slate-900', 'bg-red-500');
            ui.mic.classList.remove('bg-gray-100', 'text-gray-400');
            ui.mic.classList.add('recording-active');
            
            timeRemaining = limit;
            formatTime(timeRemaining);

            timerInterval = setInterval(() => {
                timeRemaining--;
                formatTime(timeRemaining);
                
                if (timeRemaining <= 0) {
                    stopRecording();
                }
            }, 1000);
        }

        // Остановка записи и переход к следующему
        function stopRecording() {
            clearInterval(timerInterval);
            ui.mic.classList.remove('recording-active');
            ui.mic.classList.add('bg-gray-100', 'text-gray-400');
            ui.statusBanner.innerText = "Saving...";
            ui.statusBanner.classList.replace('bg-red-500', 'bg-slate-500');
            
            // Здесь в будущем будет логика сохранения аудио в Supabase Storage

            currentIndex++;
            if (currentIndex < questions.length) {
                setTimeout(() => loadQuestion(currentIndex), 1500); // пауза перед след. вопросом
            } else {
                setTimeout(finishTest, 1000);
            }
        }

        // Форматирование времени
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            ui.timer.innerText = `${m}:${s}`;
        }

        // Завершение
        function finishTest() {
            alert("Test completed! Excellent work.");
            window.location.href = 'speaking.html'; // Возвращаем в меню
        }

        // Запуск при загрузке страницы
        document.addEventListener('DOMContentLoaded', fetchQuestions);
    </script>
</body>
</html>
