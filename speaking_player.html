<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fa; }
        .recording-active { animation: pulse-red 1.5s infinite; background-color: #ef4444; color: white;}
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="startOverlay" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <h2 class="text-2xl font-bold mb-2 text-slate-800" id="overlayTitle">Loading...</h2>
        <p class="text-gray-500 mb-8 text-center max-w-sm text-sm" id="overlayDesc">Checking auth and fetching questions.</p>
        <button id="startBtn" class="bg-slate-900 text-white px-8 py-3 rounded-xl font-bold hidden">Start Practice</button>
    </div>

    <div id="playerUI" class="w-full flex flex-col items-center">
        <div class="fixed top-0 p-4 w-full bg-[#f8f9fa] z-10 flex justify-between max-w-4xl">
            <h1 class="font-bold text-slate-800" id="taskInstruction">Listen and repeat.</h1>
            <div class="text-sm font-semibold text-gray-400">Task <span id="currentTaskNum">1</span> / <span id="totalTasks">...</span></div>
        </div>

        <div class="w-full max-w-md mt-16 mb-24 aspect-square bg-white border border-gray-200 rounded-3xl overflow-hidden shadow-sm">
            <img src="https://placehold.co/600x600/f3f4f6/a1a1aa?text=Image" id="taskImage" class="w-full h-full object-cover">
        </div>

        <div class="fixed bottom-10 w-64 bg-white border border-gray-200 rounded-3xl shadow-lg flex flex-col items-center p-4">
            <div id="statusBanner" class="text-[10px] font-bold uppercase mb-2">Listen</div>
            <div class="flex items-center space-x-4">
                <div id="micIcon" class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center"><i data-lucide="mic"></i></div>
                <div id="timerDisplay" class="text-3xl font-mono font-bold">00:00</div>
            </div>
        </div>
    </div>

    <div id="completionUI" class="hidden w-full max-w-lg p-10 bg-white rounded-3xl text-center">
        <h2 class="text-2xl font-bold mb-4">Test Completed!</h2>
        <a href="speaking.html" class="block py-4 bg-slate-900 text-white rounded-2xl font-bold">Dashboard</a>
    </div>

    <audio id="taskAudio"></audio>

    <script>
        lucide.createIcons();
        const supabaseClient = window.supabase.createClient('URL', 'KEY');
        let currentUser = null, questions = [], currentIndex = 0, mediaStream, mediaRecorder, audioChunks = [];

        async function init() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { alert("Вы не авторизованы!"); return; }
            currentUser = user;
            
            const { data } = await supabaseClient.from('speaking_questions').select('*').eq('test_id', new URLSearchParams(window.location.search).get('id'));
            questions = data;
            document.getElementById('overlayTitle').innerText = "Ready";
            document.getElementById('startBtn').classList.remove('hidden');
        }

        document.getElementById('startBtn').onclick = async () => {
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            document.getElementById('startOverlay').classList.add('hidden');
            loadQuestion(0);
        };

        function loadQuestion(i) {
            currentIndex = i;
            document.getElementById('taskImage').src = questions[i].media_url;
            const audio = document.getElementById('taskAudio');
            audio.src = questions[i].audio_prompt_url;
            audio.play().catch(() => startRecording(8));
            audio.onended = () => startRecording(8);
        }

        function startRecording(limit) {
            document.getElementById('statusBanner').innerText = "Recording";
            audioChunks = [];
            mediaRecorder = new MediaRecorder(mediaStream);
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.start();
            
            let time = limit;
            const interval = setInterval(() => {
                document.getElementById('timerDisplay').innerText = `00:${--time < 10 ? '0'+time : time}`;
                if (time <= 0) { clearInterval(interval); stopRecording(); }
            }, 1000);
        }

        async function stopRecording() {
            mediaRecorder.stop();
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const { error } = await supabaseClient.storage.from('student_recordings')
                    .upload(`${currentUser.id}/q_${questions[currentIndex].id}_${Date.now()}.webm`, blob);
                
                if (error) alert("Ошибка загрузки: " + error.message);
                
                currentIndex++;
                currentIndex < questions.length ? loadQuestion(currentIndex) : finish();
            };
        }

        function finish() {
            document.getElementById('playerUI').classList.add('hidden');
            document.getElementById('completionUI').classList.remove('hidden');
        }

        init();
    </script>
</body>
</html>
