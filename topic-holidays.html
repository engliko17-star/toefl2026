        { q: "Can you describe one of your favorite holiday celebrations or festivals? What do you do to mark the occasion?",
          lx: ["mark the occasion", "tradition", "ring in the New Year"],
          model: "[A] My favorite holiday is New Year. [R] It's the biggest holiday in my country, and it's the one time of the year when my whole family is together. [E] For example, on December 31st, we all make dumplings together in my grandmother's kitchen — it's our family **tradition**. In the evening, we have a big dinner, and at midnight we open champagne, make wishes and **exchange gifts**. Then we go outside to watch the fireworks with our neighbors. The next day, we usually just eat leftovers and play board games. [C] So for me, New Year is all about family and warmth.",
          model5: "[A] My favorite is undoubtedly New Year, which is the biggest holiday in my country. [R] What makes it so special is that it's the one occasion when my entire extended family gathers under one roof. [E] On New Year's Eve, for instance, we all crowd into my grandmother's kitchen to make dumplings from her mother's recipe, a **tradition** that's lasted four generations. After a long, noisy dinner, we **ring in the New Year** at midnight with champagne, wishes and an exchange of small gifts, before heading outside to watch the fireworks with our neighbors. New Year's Day, by contrast, is blissfully lazy: leftovers and board games. [C] So, to me, New Year isn't about the party, but about family and continuity." },
        { q: "Tell me about a special event that was particularly memorable for you. What made it meaningful?",
          lx: ["mark the occasion", "throw a party", "memorable"],
          model: "[A] A very memorable event was my grandparents' fiftieth wedding anniversary last year. [R] It was special because the whole family came, even relatives from other countries, and it showed me how important family is. [E] For example, my cousins and I secretly prepared a slideshow with old photos of my grandparents, from their wedding to today. When we showed it at the party, my grandmother cried and my grandfather made a funny speech about how they met. Later, everyone danced to the music from their youth. [C] So it was meaningful because it celebrated love and family history.",
          model5: "[A] The most memorable recently was my grandparents' fiftieth wedding anniversary last year. [R] It was meaningful not only because relatives flew in from three different countries, but because it brought five decades of family history into a single room. [E] My cousins and I, for instance, spent weeks secretly assembling a slideshow of old photographs, from their black-and-white wedding portraits to last summer's beach holiday. When we played it at the party, my grandmother was moved to tears, while my grandfather delivered a hilarious, rambling speech about how they'd met at a dance. The evening ended with everyone dancing to the music of their youth. [C] So it was a celebration not just of a marriage, but of everything that marriage had created." },
        { q: "Some people believe that traditional cultural observances are becoming less important in modern society. Do you agree or disagree with this viewpoint? Why?",
          lx: ["keep a tradition alive", "commercialized", "evolve"],
          model: "[A] I partly agree — some traditions are becoming less important, but others are just changing. [R] Modern life is busy, families live far from each other and many holidays have become very **commercialized**. But people still need traditions to feel connected to their family and culture. [E] For example, my grandparents went to many traditional village festivals that young people no longer attend. But my generation still celebrates New Year with family, and we even started new traditions, like video calls with relatives abroad at midnight. [C] So traditions aren't disappearing; they're adapting to modern life.",
          model5: "[A] I partly agree, although I'd say many traditions are evolving rather than disappearing. [R] Busy lifestyles, families scattered across countries and the increasing commercialization of holidays have certainly weakened some customs. Yet the underlying human need for ritual and belonging hasn't gone anywhere. [E] Many of the village festivals my grandparents attended, for instance, have quietly faded because young people moved to cities. At the same time, my generation still treats New Year as a sacred family occasion, and we've even invented new rituals, such as a midnight video call with cousins abroad, so that nobody is left out. [C] So traditions aren't so much dying as adapting, and the ones that matter most tend to find a way to survive." }
      ]},
    { id: "sht", badge: "platform", title: "Holidays and Cultural Traditions", src: "Практика платформы",
      scenario: "We're conducting a study about the role of holidays and cultural traditions in people's lives. I'd like to ask you a few questions to understand how these experiences shape your identity and community.",
      questions: [
        { q: "Can you tell me about a holiday or celebration that holds special meaning for you? What do you usually do to celebrate it, and why is it important to you?",
          lx: ["tradition", "a sense of belonging", "celebrate"],
          model: "[A] The celebration that means the most to me is my grandmother's Sunday lunch on her birthday in spring. [R] It's not an official holiday, but it's the day when four generations of my family meet, and it reminds me where I come from. [E] For example, every year, my grandmother cooks the same traditional dishes — beetroot soup, slow-cooked beef and her famous honey cake. My cousins and I help in the kitchen, the children play in the garden, and in the evening we look at old family photos together. [C] So it's important because it gives me a strong **sense of belonging**.",
          model5: "[A] For me, the most meaningful celebration isn't an official holiday at all, but my grandmother's birthday lunch every spring. [R] It's the one day when four generations of my family sit at the same table, and it's a powerful reminder of where I come from. [E] Every year, for instance, my grandmother insists on cooking the same traditional menu — beetroot soup, slow-cooked beef and her legendary honey cake — while my cousins and I act as reluctant kitchen assistants and the youngest children run wild in the garden. As evening falls, someone inevitably brings out the old photo albums, and the stories begin. [C] So it matters to me because it gives me a deep **sense of belonging** that no public holiday quite matches." },
        { q: "Traditions—whether big or small—often help bring people together and create shared memories. In your experience, what role do holidays or traditional celebrations play in your family or local community? Would you say they help strengthen relationships or foster a sense of belonging?",
          lx: ["bring people together", "a sense of belonging", "community"],
          model: "[A] Yes, I think holidays really strengthen relationships, both in my family and in my community. [R] In everyday life, everyone is busy, but holidays give us a reason to stop and spend time together. They create memories that we talk about for years. [E] For example, every summer my neighborhood has a street festival with food, music and games. People who normally just say hello in the elevator sit at long tables and talk for hours. In my family, New Year is the time when we fix arguments and feel close again. [C] So celebrations are like glue for families and communities.",
          model5: "[A] I'd say they act as a kind of social glue, both in my family and in my neighborhood. [R] Everyday life keeps people busy and apart, whereas holidays create a shared pause, a reason to slow down and reconnect, along with memories that are retold for years afterwards. [E] Every summer, for instance, my neighborhood holds a street festival with food, live music and games for children; neighbors who normally exchange no more than a nod in the elevator end up chatting for hours at long communal tables. Within my family, meanwhile, New Year often becomes the moment when old tensions quietly dissolve. [C] So celebrations genuinely **bring people together** and foster a sense of belonging that's hard to create any other way." },
        { q: "Over time, some customs evolve, while others may fade due to migration, modernization, or changing lifestyles. Do you think it's important to preserve cultural traditions? Why or why not? And how do you feel when a tradition is lost or forgotten?",
          lx: ["preserve", "heritage", "pass down"],
          model: "[A] Yes, I think it's important to **preserve** cultural traditions, but not all of them. [R] Traditions connect us to our history and our family, and they make each culture unique. But some old customs are unfair or don't fit modern values, so it's okay if they disappear. [E] For example, my great-grandmother knew many traditional songs, but nobody in my family learned them, and now they're lost. That makes me sad. On the other hand, some old wedding customs were unfair to women, and I'm glad they changed. [C] So we should keep the beautiful traditions and let the harmful ones go.",
          model5: "[A] I believe it's important to **preserve** many traditions, though not every single one. [R] Traditions link us to our history and give each culture its distinctive character; when they vanish, part of our **heritage** goes with them. Some customs, however, reflect outdated or unfair values, and their disappearance isn't necessarily a loss. [E] My great-grandmother, for instance, knew dozens of traditional folk songs, but nobody thought to learn them, and when she died, they died with her, which genuinely saddens me. Certain old wedding customs, by contrast, treated women as property, and I'm glad they've faded. [C] So I'd argue we should deliberately **pass down** the traditions that enrich us, while letting go of those that don't." },
        { q: "With societies becoming increasingly diverse, some believe that schools and public institutions should do more to recognize and celebrate a wide range of cultural traditions. Do you think promoting cultural diversity in public spaces or classrooms is beneficial? Why or why not?",
          lx: ["diversity", "inclusive", "respect"],
          model: "[A] Yes, I think promoting cultural **diversity** in schools is very beneficial. [R] When children learn about different traditions, they understand and respect each other more. Also, children from minority families feel accepted and proud of their culture. [E] For example, my younger cousin's class has an international day every year, when children bring food and share traditions from their families' countries. My cousin told me he learned about Diwali from a classmate from India, and now they're best friends. [C] So celebrating diversity helps children grow up more open-minded.",
          model5: "[A] I believe it's highly beneficial, provided it's done in an **inclusive** rather than tokenistic way. [R] Learning about one another's traditions fosters understanding and respect from an early age, while children from minority backgrounds see that their culture is valued rather than merely tolerated. [E] My younger cousin's school, for instance, holds an annual international day, when children bring dishes and share customs from their families' countries. He came home enthusing about Diwali, which a classmate from India had explained, and the two have since become inseparable. [C] So celebrating diversity in classrooms doesn't erase anyone's identity; it helps children grow into more open-minded adults." }
      ]},
    { id: "s095", badge: "official", title: "Cultural Festivals", src: "Official TOEFL · 095",
      scenario: "You have volunteered for a research study at your university about cultural festivals. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, cultural festivals are events that celebrate traditions like food, music, art, or clothing from a certain culture. Have you ever been to one? Or would you like to go to one? Why?",
          lx: ["cuisine", "try the local cuisine", "traditional dishes"],
          model: "[A] Yes, last summer I went to an international food festival in my city, and I'd love to go again. [R] It's a fun way to try food from many countries in one day and to learn about different cultures without traveling. [E] For example, I tried Ethiopian injera with spicy lentils, Korean street pancakes and Peruvian ceviche — all in one afternoon! People from each community cooked their traditional dishes and told us about their festivals and music. It felt like a small trip around the world. [C] So food festivals are a delicious way to learn about other cultures.", model5: "[A] I have — last summer I went to an international food festival in my city, and I'd go again in a heartbeat. [R] It's a wonderfully accessible way to experience other cultures: you can sample a dozen **cuisines** in an afternoon and actually talk to the people behind them, all without buying a plane ticket. [E] In a single afternoon, for instance, I tried Ethiopian injera with spiced lentils, Korean street pancakes and Peruvian ceviche. What made it special, though, was that each stall was run by members of that community, who happily explained their dishes, their festivals and even the music playing in the background. [C] So food festivals offer something rare: a genuine cultural exchange that starts with a plate of food." },
        { q: "If you were to go to a cultural festival, what would you like to see or do there?",
          lx: ["traditional", "take part in", "workshop"],
          model: "[A] At a cultural festival, I would like to try traditional food and **take part in** a dance or music workshop. [R] I think the best way to understand a culture is not only to watch but to do something together with people. [E] For example, if I went to a Mexican festival, I would love to try real tacos and tamales, watch a mariachi band and learn a few steps of a traditional dance. I'd also like to see traditional clothes and talk to the people about what the festival means to them. [C] So I'd want to taste, listen and participate.",
          model5: "[A] I'd want to experience it actively rather than just watch, ideally through food, music and a hands-on workshop. [R] In my experience, you understand a culture far better when you take part than when you simply observe from a distance. [E] At a Mexican festival, for instance, I'd love to sample authentic tamales, listen to a mariachi band and then join a workshop to learn a few steps of a traditional dance, however clumsy I'd be. Above all, I'd want to chat with the organizers about what the festival actually means to them, since the stories behind traditions are often the most fascinating part. [C] So, for me, the ideal festival is one where you **taste**, listen and **take part in** the culture." },
        { q: "If you were to participate in a cultural festival for your own culture, what would you want to share with other people and why?",
          lx: ["heritage", "traditional dishes", "pass down"],
          model: "[A] I would share our traditional food and folk music. [R] Food and music are the easiest ways to show a culture to people from other countries, and they make people smile. [E] For example, I'd make my grandmother's dumplings with people and show them how to fold them — it's fun, and everyone can try. I would also bring a traditional instrument and play some folk songs I learned at the summer festival in my region. Maybe I'd teach people a simple traditional dance too. [C] So I'd share things that people can taste, hear and do together.",
          model5: "[A] I'd focus on our food and folk music, since they're the most immediate ways to share a culture. [R] Food breaks the ice instantly, while music conveys emotion without any need for translation, so together they let people experience a culture rather than merely learn about it. [E] I'd set up a dumpling-making station, for instance, teaching visitors to fold my grandmother's dumplings — a recipe **passed down** through four generations — so that everyone left with something they'd made themselves. Alongside it, I'd play some of the folk songs I picked up at our regional summer festival and perhaps coax a few brave visitors into a simple traditional dance. [C] So I'd share the parts of my **heritage** that people can taste, hear and join in with." },
        { q: "Some people think cultural festivals are mainly just for fun, while others think that they serve an important purpose, like helping to keep traditions alive. What do you think?",
          lx: ["traditional", "evoke", "community"],
          model: "[A] I think cultural festivals are fun, but they also have an important purpose. [R] They help people, especially young people, learn about traditional music, dance, food and crafts. Without festivals, many traditions would slowly disappear. [E] For example, in my region, there's a summer folk festival where people dance traditional dances and play old instruments. As a child, I thought it was boring, but last year I went with friends and we learned a traditional dance. It was really fun, and I felt connected to my roots. [C] So festivals mix fun and tradition in a good way.", model5: "[A] I'd say the fun is precisely what allows them to serve a deeper purpose. [R] Festivals make traditional music, dance, food and crafts enjoyable and accessible, particularly for young people who might otherwise ignore them, so they play a genuine role in keeping heritage alive. [E] My region, for instance, hosts a summer folk festival featuring traditional dances and centuries-old instruments. As a child, I found it painfully old-fashioned, but last year I went with friends, joined a dance workshop and, to my surprise, loved every minute; for the first time, I felt genuinely connected to my roots. [C] So festivals aren't just entertainment; they're how traditions survive from one generation to the next." }
      ]},
    { id: "s049", badge: "official", title: "Volunteering and Community Service", src: "Official TOEFL · 049 / 066",
      scenario: "You have signed up for a study run by a university research group that is investigating volunteering and community service. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, have you ever participated in any volunteer activities? And if you do, how often do you volunteer?",
          lx: ["volunteer at", "do volunteer work", "animal shelter"],
          model: "[A] Yes, I **volunteer at** an animal shelter every Saturday morning. [R] I love animals, and I miss my family's dog, so it's a way to spend time with animals and help them. It also helps me relax after a busy week. [E] For example, every Saturday, I walk the dogs, clean their cages and play with the shy ones so they become friendly and can find a home. Sometimes I also help at adoption days. Besides that, I occasionally help with a refugee support organization when they need extra people. [C] So volunteering is a regular part of my week.",
          model5: "[A] Yes — I **volunteer at** an animal shelter every Saturday morning, and occasionally elsewhere when help is needed. [R] I started partly because I miss my family's dog, but it's become far more than that: it's the calmest part of my week and genuinely useful. [E] My Saturdays, for instance, involve walking dogs, cleaning kennels and spending time with the more nervous animals so that they become sociable enough to be adopted. On adoption days, I help introduce families to the dogs. Beyond the shelter, I lend a hand at a refugee support organization a few times a year, usually sorting donations. [C] So volunteering has become a fixed and rewarding part of my routine." },
        { q: "Can you tell me about a charity effort or a donation drive that you have heard about that made an impact on where you live?",
          lx: ["raise money for", "fundraiser", "make a difference"],
          model: "[A] Last winter, my city organized a donation drive for a family whose house burned down. [R] It made a big impact because it showed how quickly people can help each other when they work together. [E] For example, a local café posted the story on social media, and in just two days, people **raised** enough **money for** the family to rent a new apartment. Neighbors also brought clothes, furniture and toys for the children. The local newspaper wrote about it, and many people said they felt proud of our city. [C] So it showed me that a community can really **make a difference**.",
          model5: "[A] Last winter, my city rallied behind a family whose home had been destroyed by a fire. [R] What made it so impactful was the sheer speed and scale of the response, which showed how much a community can achieve when it acts together. [E] A local café, for instance, shared the family's story on social media, and within just two days residents had **raised** enough **money** to cover a year's rent on a new apartment. Neighbors, meanwhile, donated clothes, furniture and toys for the three children, and a local builder offered free repairs. When the local paper covered the story, many people said it made them proud of where they live. [C] So it demonstrated that ordinary people really can **make a difference** remarkably quickly." },
        { q: "Can you describe a public service project that you have been involved in or would like to participate in if you had the time?",
          lx: ["take part in", "tutor", "give back"],
          model: "[A] If I had more time, I would like to tutor children from poor families for free. [R] When I was at school, a teacher gave me free extra English lessons, and it changed my life. Now I want to do the same for other children. [E] For example, I imagine helping a few children with English and math twice a week at a community center. Many families can't pay for private tutors, so these children often fall behind at school. Even one or two hours a week could help them pass exams and feel more confident. [C] So tutoring would be my way to **pay it forward**.",
          model5: "[A] If I had more time, I'd love to **tutor** children from low-income families free of charge. [R] At school, a teacher gave me free extra English lessons when my family couldn't afford a tutor, and it genuinely changed the direction of my life, so this would be my way of **giving back**. [E] I picture, for instance, helping a small group of children with English and math twice a week at a local community center. Many families simply can't pay for private tutoring, so these children fall further and further behind their classmates. Even a couple of hours a week could help them pass exams and, perhaps more importantly, believe in themselves. [C] So tutoring would be my way to **pay it forward**." },
        { q: "Some people believe that volunteering should be a mandatory part of the school curriculum to help students develop a sense of community. Do you agree or disagree with this idea? Why?",
          lx: ["civic responsibility", "mandatory", "a sense of community"],
          model: "[A] I partly agree — I think schools should include volunteering, but students should choose what they do. [R] Many students never try volunteering, so a school program can show them how good it feels. But if it's forced and boring, students will hate it and never volunteer again. [E] For example, at my high school, we had to do twenty hours of community service, but we could choose where. I chose the animal shelter, and I still volunteer there today. My friend chose a project she didn't like and did only the minimum. [C] So mandatory volunteering works best when students have a real choice.",
          model5: "[A] I partly agree: I'd support it as a requirement, but only if students have genuine freedom of choice. [R] Many young people would never try volunteering otherwise, and a well-designed program can develop **civic responsibility** and **a sense of community**. If it feels forced or pointless, however, it may put students off for life. [E] My high school, for instance, required twenty hours of community service but let us choose the cause. I picked the local animal shelter and, years later, still volunteer there every week. A friend, by contrast, ended up in a project she had no interest in and simply counted down the hours. [C] So mandatory volunteering can be valuable, provided students choose something that genuinely matters to them." }
      ]},
    { id: "sce", badge: "platform", title: "Civic Engagement", src: "Практика платформы",
      scenario: "I'm researching people's experiences with volunteering and different forms of community involvement. I'll be asking you a few questions to learn more about how you engage with causes or organizations that matter to you.",
      questions: [
        { q: "Have you ever volunteered your time or skills for a cause, either formally through an organization or informally in your community? If so, what was your role, and what kind of impact did the experience have on you?",
          lx: ["volunteer at", "refugee", "make a difference"],
          model: "[A] Yes, I volunteer with a refugee support organization a few times a year. [R] I started after I saw a photography exhibition about refugees, and I wanted to do something real to help. [E] For example, my role is to sort donated clothes and help at their language café, where refugees practice the local language with volunteers. Last spring, I helped a young woman my age prepare for a job interview. When she got the job, she sent me a message, and I felt so happy. [C] So this experience made me more open and grateful.",
          model5: "[A] Yes, alongside my regular shelter work, I volunteer a few times a year with a refugee support organization. [R] I got involved after a photography exhibition about refugees profoundly changed how I saw the issue, and I wanted to do something concrete rather than just feel sympathetic. [E] My role, for instance, is a mix of sorting donated clothing and helping at their weekly language café, where newcomers practice conversation with volunteers. Last spring, I helped a young woman my own age prepare for a job interview, and when she messaged me to say she'd got the job, I was genuinely overjoyed. [C] So the experience has made me more open-minded and far more aware of how much I take for granted." },
        { q: "People volunteer for many different reasons—some are passionate about a particular cause, some want to give back to their community, and others may be looking to gain experience or connect with others. What personally motivates you—or would motivate you—to volunteer your time? And why does that reason matter to you?",
          lx: ["give back", "pay it forward", "make a difference"],
          model: "[A] My main motivation is to **give back**, because other people helped me in the past. [R] When I was at school, a teacher gave me free English lessons, and when I moved to a new city, strangers helped me a lot. I want to do the same for others. [E] For example, at the shelter, I feel happy when a shy dog finally trusts people and gets adopted. At the refugee organization, I remember how lonely I felt in a new city and try to help others feel welcome. Of course, it also feels good and helps me meet nice people. [C] So for me, volunteering is a way to **pay it forward**.",
          model5: "[A] Above all, I'm motivated by a desire to **give back**, since I've benefited so much from other people's kindness. [R] A teacher once gave me free English lessons that changed my prospects, and when I first moved to this city, strangers went out of their way to help me settle in, so volunteering feels like my way of returning the favor. [E] At the shelter, for instance, nothing beats seeing a frightened dog gradually learn to trust people and finally go home with a family. At the refugee organization, meanwhile, I draw on my own memories of loneliness in a new city to make newcomers feel welcome. The friendships I've made along the way are a lovely bonus. [C] So for me, volunteering is simply a way to **pay it forward**." },
        { q: "There's been some debate about whether schools and workplaces should require volunteer work as part of education or professional development. Supporters say it encourages civic responsibility, while critics argue it should be a personal choice. What's your opinion on this idea? Do you think requiring volunteer work is beneficial, or could it reduce the meaning of the experience?",
          lx: ["civic responsibility", "mandatory", "meaningful"],
          model: "[A] I think encouraging volunteering is good, but requiring it can make it less meaningful. [R] When people volunteer because they want to, they work with passion and really care. When they're forced, they often do the minimum, and the people they help can feel it. But a requirement can help some people discover volunteering for the first time. [E] For example, my sister's company asked every employee to do one volunteer day, and some of her colleagues complained the whole day. But one of them liked it so much that he now volunteers every month. [C] So encouragement is better than obligation.",
          model5: "[A] On balance, I'd favor encouragement over obligation, although a light requirement can have its place. [R] Volunteering derives much of its value from being freely chosen; when it's compulsory, people tend to do the bare minimum, and those being helped can often sense the reluctance. That said, a requirement can introduce people to volunteering who would never otherwise have tried it. [E] My sister's company, for instance, once made a volunteer day compulsory, and several colleagues complained throughout. Yet one of them enjoyed it so much that he now volunteers every month of his own accord. [C] So I believe institutions should create opportunities and incentives, but leave the final decision to the individual, so the experience remains **meaningful**." },
        { q: "Many people believe that volunteering plays a key role in building stronger, more connected communities. From your perspective, do you think volunteer work truly helps bring people together or foster a sense of unity? Why or why not—and have you seen examples of this in your own experience?",
          lx: ["bring people together", "a sense of belonging", "community"],
          model: "[A] Yes, I really think volunteering **brings people together**. [R] When people work together for a good cause, they forget their differences — age, background or opinions — and focus on a common goal. This creates friendships and trust. [E] For example, last spring, my neighborhood organized a park cleanup. Retired people, students and families with small children worked side by side for a whole Saturday. Afterwards, we had a picnic, and now people say hello to each other on the street and help each other more. [C] So volunteering builds real connections in a community.",
          model5: "[A] I'm convinced it does, and I've seen it happen firsthand. [R] Working toward a shared goal encourages people to look beyond differences of age, background or opinion, and the trust built through shared effort tends to outlast the project itself. [E] Last spring, for instance, my neighborhood organized a park cleanup that drew retirees, students and young families who had never spoken to one another. After a long Saturday of collecting litter and planting flowers side by side, everyone stayed for an impromptu picnic. Months later, neighbors who were once strangers greet each other by name and readily help one another out. [C] So volunteering doesn't just improve places; it builds **community** and a genuine **sense of belonging**." }
      ]},
    { id: "sci", badge: "platform", title: "Community Involvement", src: "Практика платформы",
      scenario: "I'm conducting a study on how people engage with their communities, especially through volunteering. I'd like to ask you a few questions to understand your experiences and views on this topic.",
      questions: [
        { q: "Have you ever volunteered your time, energy, or skills to support a cause, organization, or local event? If so, what kind of volunteering did you do, and what was that experience like?",
          lx: ["volunteer at", "food drive", "rewarding"],
          model: "[A] Yes, besides my regular volunteering at an animal shelter, I helped at a winter food drive last year. [R] My community center needed people to collect and sort food for families before the holidays, and I had some free time after exams. [E] For example, for three days, I stood at a supermarket entrance asking people to donate food, and then I sorted cans and packed boxes. It was tiring and cold, but when we delivered boxes to families, one little girl hugged me, and I almost cried. [C] So it was hard work, but very **rewarding**.",
          model5: "[A] Yes — apart from my weekly shifts at an animal shelter, I helped run a winter **food drive** last year. [R] My local community center was short of volunteers before the holidays, and since my exams had just finished, I signed up. [E] For three days, for instance, I stood outside a supermarket in the freezing cold, inviting shoppers to donate, before spending the evenings sorting cans and packing parcels. It was exhausting work, but when we delivered the boxes, a little girl threw her arms around me in thanks, and I had to fight back tears. [C] So it was undoubtedly hard, but also one of the most **rewarding** things I've ever done." },
        { q: "People volunteer in different ways—some do it regularly, while others participate during holidays or special campaigns. What motivates you personally to volunteer—or what do you think would encourage you to get involved? Is it a sense of giving back, gaining experience, connecting with others, or something else?",
          lx: ["give back", "connect with others", "make a difference"],
          model: "[A] For me, the main motivation is seeing that my help really changes something. [R] When I can see the result — a happy dog, a family with food, a cleaner park — I feel useful and I want to continue. Meeting nice people is also important. [E] For example, I keep going to the animal shelter because I see the dogs change week by week, and many of them find homes. I also made two good friends there. I think more people would volunteer if organizations showed them clear results and made it easy to start. [C] So real impact and good company keep me going.",
          model5: "[A] What keeps me going, more than anything, is seeing that my effort genuinely changes something. [R] Tangible results — a dog that finally trusts people, a family with food for the holidays, a cleaner park — make the time feel worthwhile, and the people I **connect with** along the way are a wonderful bonus. [E] I keep returning to the shelter, for instance, because I can watch individual dogs transform week by week before going to new homes, and I've made two close friends among the other volunteers. I suspect far more people would get involved if organizations showed volunteers the concrete impact of their work and made it easy to start with just a few hours. [C] So visible impact and good company are what motivate me most." },
        { q: "Some researchers suggest that volunteering doesn't just help the community—it can also improve the mental and emotional well-being of the person who volunteers. In your opinion, do you think volunteering is beneficial not only for the people receiving help, but also for those offering it? Why do you think that might be the case?",
          lx: ["well-being", "sense of purpose", "resilience"],
