          lx: ["stay active", "get enough sleep", "stay hydrated"],
          model: "[A] Yes, I have three main habits: running, sleep and water. [R] I sit at a desk most of the day, so I need to move, and I noticed that I feel terrible when I sleep less than seven hours. [E] For example, I run three times a week in the morning, and on other days I walk to class instead of taking the bus. I also try to go to bed before midnight, and I carry a water bottle everywhere to **stay hydrated**. These simple things give me much more energy. [C] So my routine is simple, but it works for me.",
          model5: "[A] I do — my routine rests on three simple pillars: exercise, sleep and staying hydrated. [R] Since I spend most of the day sitting in lectures, regular movement is essential, and I've learned the hard way that I function terribly on less than seven hours' sleep. [E] I run three mornings a week, for instance, and on the other days I walk to campus rather than taking the bus. I'm also strict about being in bed by midnight, and I carry a water bottle everywhere, because even mild dehydration leaves me with headaches. None of this is particularly sophisticated, yet together these habits have transformed my **energy levels**. [C] So for me, consistency with the basics matters more than any fancy regime." },
        { q: "Can you describe any dietary choices or habits that you follow to stay healthy? Give details to explain your answer.",
          lx: ["balanced diet", "cut down on", "cook at home"],
          model: "[A] I try to eat a **balanced diet**, and I cook at home most of the time. [R] When I eat fast food, I feel tired and heavy, and it's also expensive. Home-cooked food is healthier and cheaper. [E] For example, every Sunday I cook a big pot of vegetable soup or chicken with rice for three or four days. I also **cut down on** sugar — I stopped drinking soda last year, and now I drink water or tea. I still eat pizza with friends sometimes, but only once a week. [C] So I'm not perfect, but I try to make good choices most of the time.",
          model5: "[A] My main habits are cooking at home and **cutting down on** sugar, although I'm far from strict. [R] Whenever I rely on fast food, I feel sluggish and unfocused, and it drains my budget too, whereas home-cooked meals leave me feeling noticeably better. [E] Every Sunday, for example, I batch-cook something simple, such as a vegetable stew or chicken with rice, which covers three or four days. Last year I also gave up soft drinks entirely, replacing them with water and tea, and within a month my afternoon energy crashes had largely disappeared. I still enjoy pizza with friends, but it's a weekly treat rather than a habit. [C] So I aim for a **balanced diet** most of the time, not perfection." },
        { q: "If you could make one significant change to your diet or exercise routine to stay healthy, what would it be? Why would you make that particular choice?",
          lx: ["build healthy habits", "strength training", "cut down on"],
          model: "[A] I would add strength training to my exercise routine. [R] I run a lot, but I almost never train my upper body, and doctors say strong muscles protect your back and joints, especially when you get older. [E] For example, after long days at my laptop, my back and shoulders often hurt. My father started lifting weights at fifty, and his back pain disappeared. I think if I start now, at twenty, I'll avoid those problems later. [C] So two short strength workouts a week would be my one big change.",
          model5: "[A] If I could make one change, I'd add regular strength training to my routine. [R] Although I run frequently, I almost completely neglect my upper body, and there's strong evidence that muscle strength protects the back and joints, becoming increasingly important as we age. [E] After long days hunched over my laptop, for instance, my back and shoulders often ache. My father, meanwhile, took up weightlifting at fifty, and within a year his chronic back pain had vanished. If he could see such a difference starting at fifty, then starting at twenty seems like an obvious investment. [C] So two short strength sessions a week would be my one significant change — small effort now, big payoff later." },
        { q: "Some people believe that mental health is just as important as physical health and should be given equal attention. Do you agree or disagree with this viewpoint? Why?",
          lx: ["mental health", "stigma", "seek professional help"],
          model: "[A] I completely agree. [R] Our mind and body are connected. If you're stressed or depressed, you can't sleep, eat or study well, and you can even get physically sick. But people still feel embarrassed to talk about **mental health** problems. [E] For example, in my first semester, I felt very anxious and homesick, and I had headaches every day. A doctor checked my body and found nothing. Only when I talked to a university counselor did the headaches stop. [C] So we should take care of our minds as seriously as our bodies.",
          model5: "[A] I wholeheartedly agree, and I'd even argue that the two are inseparable. [R] When we're anxious or depressed, our sleep, appetite and concentration suffer, and prolonged stress can even make us physically ill. Yet there's still a **stigma** around mental health that rarely exists for a broken arm. [E] During my first semester, for example, I was so anxious and homesick that I developed daily headaches. A doctor ran several tests and found nothing physically wrong. It was only after I **sought** help from a university counselor that the headaches gradually disappeared. [C] So treating the mind with the same seriousness as the body isn't a luxury; it's simply good medicine." }
      ]},
    { id: "s063", badge: "official", title: "Sleep Habits", src: "Official TOEFL · 063",
      scenario: "You have volunteered for a research study about sleep habits. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, do you usually go to bed early or late?",
          lx: ["a night owl / an early bird", "body clock", "routine"],
          model: "[A] I usually go to bed quite late, around midnight, so I'm more of a **night owl**. [R] In the evening my brain feels more awake, and it's quiet, so I can concentrate. But because I have morning classes, I can't sleep as long as I'd like. [E] For example, I often write my essays between nine and midnight, because that's when I have the best ideas. But last semester I had eight a.m. classes and felt like a zombie every morning. Now I try to be in bed by twelve at the latest. [C] So I'm a night owl by nature, but I'm learning to be a bit of an **early bird**.", model5: "[A] I tend to go to bed fairly late, usually around midnight, so I'd call myself a **night owl**. [R] My mind simply feels sharper in the evening, when everything is quiet and there are no messages coming in. The problem, of course, is that university doesn't adjust to my body clock. [E] I write most of my essays between nine and midnight, for instance, as that's when ideas come most easily. Last semester, however, I had eight a.m. lectures and spent every morning half asleep. Since then, I've forced myself to be in bed by midnight at the latest, which has made a noticeable difference. [C] So I'm a night owl by nature, but I'm slowly training myself to be more of an **early bird**." },
        { q: "What is your typical routine before bedtime? What do you usually do before going to bed?",
          lx: ["bedtime routine", "unwind", "screen time"],
          model: "[A] My **bedtime routine** is quite simple and takes about forty minutes. [R] I learned that if I go straight from my laptop to bed, I can't **fall asleep** for a long time, so I need time to **unwind**. [E] For example, at about eleven, I stop studying and take a warm shower. Then I prepare my bag and clothes for the next day, so my morning is easier. After that, I read a paper book in bed for twenty minutes — my phone stays on my desk, not next to my bed. Usually, I fall asleep before midnight. [C] So my routine helps my brain understand it's time to sleep.",
          model5: "[A] My **bedtime routine** is fairly simple, lasting roughly forty minutes. [R] I've discovered that if I go straight from studying to bed, my mind keeps racing and I can't **fall asleep**, so I deliberately give myself time to **unwind**. [E] At around eleven, for instance, I close my laptop and take a warm shower. I then pack my bag and lay out my clothes for the next day, which makes my mornings far less chaotic. Finally, I read a paper book in bed for twenty minutes, while my phone charges on the desk across the room — out of reach and out of mind. More often than not, I'm asleep before midnight. [C] Essentially, my routine signals to my brain that the day is over." },
        { q: "Some people have trouble sleeping when they stay overnight at a hotel or at a friend's house. Are you able to sleep well in unfamiliar places? Why or why not?",
          lx: ["sleep like a log", "toss and turn", "noise"],
          model: "[A] Usually not — the first night in a new place is always hard for me. [R] New noises, a different bed and a strange room make my brain stay alert. After one or two nights, I get used to it. [E] For example, when I stayed at a hotel in Barcelona with friends, I **tossed and turned** the whole first night because of the street noise and an uncomfortable pillow. But on the second night, I was so tired from walking all day that I **slept like a log**. Now I always take earplugs and a sleep mask. [C] So I can sleep in new places, but only after one bad night.",
          model5: "[A] Not particularly well, at least on the first night. [R] Apparently, the brain stays partly alert in unfamiliar surroundings, almost as a survival instinct, so unfamiliar noises, a different bed and even the unfamiliar smell of a room keep me half awake. [E] When I stayed at a hotel in Barcelona with friends, for instance, I **tossed and turned** all night, thanks to the street noise and a rock-hard pillow. By the second night, however, I was so exhausted from exploring that I **slept like a log**. Since then, I never travel without earplugs and a sleep mask, which have made a remarkable difference. [C] So I adapt eventually, but the first night is usually a write-off." },
        { q: "Many parents worry about their teenage children getting enough sleep. Some high schools have considered starting later in the morning to allow teenage students more time to sleep each night. What do you think of this idea? Explain why.",
          lx: ["body clock", "sleep-deprived", "concentrate"],
          model: "[A] I think it's a great idea. [R] Teenagers' **body clocks** are different — they naturally fall asleep later and wake up later. If school starts at eight, they're always tired, and they can't learn well. [E] For example, when I was in high school, classes started at eight, and I was half asleep in every first lesson, especially in math. My cousin's school now starts at nine, and he says students are more awake, and fewer people are late. [C] So a later start would help teenagers learn better and be healthier.",
          model5: "[A] I think it's an excellent idea, and one backed by science. [R] During adolescence, the **body clock** naturally shifts later, so teenagers genuinely struggle to fall asleep early. Forcing them to start school at eight leaves them chronically **sleep-deprived**, which harms their concentration, mood and health. [E] When I was in high school, for example, classes began at eight, and I spent every first-period math lesson in a fog. My cousin's school, by contrast, recently moved its start time to nine, and he says students are noticeably more alert and far fewer arrive late. [C] So rather than blaming teenagers for being tired, schools should simply adapt to their biology." }
      ]},
    { id: "ssl", badge: "platform", title: "Sleep and Daily Routines", src: "Практика платформы",
      scenario: "I'm conducting a study on sleep and how people manage their time, energy, and daily schedules. I'd like to ask you a few questions to better understand your sleep habits.",
      questions: [
        { q: "First, on average, how many hours of sleep do you get on a typical night? And would you say that amount feels sufficient for your body and mind to function well?",
          lx: ["get enough sleep", "catch up on sleep", "sleep-deprived"],
          model: "[A] I usually sleep about seven hours on weekdays, and honestly, it's not quite enough. [R] I feel okay in the morning, but by the afternoon, I'm tired and can't concentrate well. I think I need about eight hours to feel really good. [E] For example, on weekends I sleep eight or nine hours, and I feel completely different — more energetic and in a better mood. But during exam weeks, I sometimes sleep only five or six hours, and then I feel terrible. [C] So I'm trying to go to bed earlier, but it isn't easy.",
          model5: "[A] On weekdays I average about seven hours, which, if I'm honest, isn't quite enough for me. [R] I function reasonably well in the mornings, but by mid-afternoon my concentration fades and I find myself rereading the same paragraph several times. I suspect my body needs closer to eight hours. [E] At weekends, for instance, when I **catch up on sleep** and get eight or nine hours, I feel like a different person — sharper, calmer and far more cheerful. During exam weeks, by contrast, I sometimes survive on five or six hours, and I become irritable and noticeably less productive. [C] So I'm gradually moving my bedtime earlier, although it's proving harder than it sounds." },
        { q: "How does sleep—or a lack of sleep—affect your mood, focus, or energy levels throughout the day? Can you give an example of how it impacts your performance at school, work, or even in social situations?",
          lx: ["sleep-deprived", "mood", "concentrate"],
          model: "[A] Lack of sleep affects me a lot — especially my mood and focus. [R] When I'm tired, I get irritated easily, I make silly mistakes and I can't remember what I read. [E] For example, last month I slept only four hours before a presentation because I was finishing the slides. During the presentation, I forgot what I wanted to say twice, and later I was rude to my friend for no reason. I had to apologize the next day. [C] So I know that a good night's sleep is more useful than a few extra hours of work.",
          model5: "[A] It affects me enormously, particularly my mood and my ability to focus. [R] When I'm **sleep-deprived**, I become irritable over trivial things, make careless mistakes and struggle to retain anything I read. [E] Last month, for instance, I stayed up until four finishing slides for a presentation. During the presentation itself, my mind went completely blank twice, and that evening I snapped at a close friend for no real reason — something I had to apologize for the next day. Ironically, the extra hours I'd spent on the slides were wiped out by how badly I delivered them. [C] So I've learned that a good night's sleep is usually worth more than a few extra hours of work." },
        { q: "Many sleep experts recommend following a routine at night—such as reducing screen time, limiting caffeine, or dimming lights—to improve sleep quality. Do you currently follow any specific bedtime routines or habits to help you sleep better? If so, what works for you, and if not, is there something you wish you could change?",
          lx: ["screen time", "cut down on", "bedtime routine"],
          model: "[A] Yes, I follow two rules, and there's one thing I want to change. [R] I noticed that coffee and phones were the main reasons I couldn't fall asleep. [E] First, I don't drink coffee after three p.m. — I switched to herbal tea in the evening. Second, my phone stays on my desk, and I read a book in bed instead. But I still study on my laptop until late, and I want to change that, because I often lie awake thinking about my assignments. [C] So my routine is better than before, but not perfect yet.",
          model5: "[A] I follow two rules quite strictly, though there's one habit I still need to change. [R] Through trial and error, I identified caffeine and screens as the main culprits behind my restless nights. [E] I never drink coffee after three p.m., for instance, having switched to herbal tea in the evenings, and my phone charges across the room while I read a paper book in bed. What I still struggle with, however, is studying on my laptop until the last minute, which leaves my mind racing with assignments as soon as I turn off the light. My next step is a one-hour, screen-free buffer before bed. [C] So my routine has improved considerably, but it's still a work in progress." },
        { q: "Some schools and workplaces have started beginning later in the morning, with the idea that more rest can improve focus and productivity. Do you think this is a good idea, and would it make a difference in your own life or community?",
          lx: ["productivity", "focus", "schedule"],
          model: "[A] Yes, I think it's a good idea. [R] Many people, especially young people, don't get enough sleep, and tired people can't focus well. If the day starts later, they can sleep more and work better. [E] For example, I had a class at eight a.m. last semester, and I was half asleep every time. This semester my first class is at ten, and I understand much more and participate in discussions. [C] So I think a later start could really improve productivity, although it may not work for every job.", model5: "[A] I think it's an excellent idea, at least for schools and office jobs. [R] Many people, teenagers and students in particular, are chronically sleep-deprived, and tired brains simply don't absorb information or solve problems effectively. [E] Last semester, for instance, I had an eight a.m. statistics class, and I spent most of it struggling to stay awake. This semester, my first class starts at ten, and the difference is striking: I follow the material easily and actually contribute to discussions. Admittedly, a later start would be impractical for hospitals or delivery services. [C] Still, wherever it's feasible, starting later seems like a simple, almost cost-free way to boost **productivity**." }
      ]},
    { id: "smh", badge: "platform", title: "Mental Health", src: "Практика платформы",
      scenario: "We're exploring how people think about mental health in their day-to-day lives, and how they respond to emotional challenges. I'd like to ask you a few questions about your own understanding and experience.",
      questions: [
        { q: "First, how would you describe your awareness or understanding of mental health issues? For example, do you feel confident recognizing signs of emotional distress in yourself or others?",
          lx: ["emotional distress", "mental health", "warning signs"],
          model: "[A] I'd say my awareness is better than before, but I'm not an expert. [R] At university, we had a workshop about **mental health**, and I also read and watch a lot about it. I can see some signs in others, but it's harder to notice them in myself. [E] For example, last year my roommate stopped going to classes and slept all day. I noticed something was wrong and encouraged her to talk to a counselor. But when I was stressed during exams, I didn't notice my own signs until my friend told me I seemed very tired and nervous. [C] So I'm learning, but I still need to listen to myself more.",
          model5: "[A] I'd say my understanding has grown considerably, though I'm certainly no expert. [R] A university workshop on **mental health**, along with plenty of reading, has taught me the common **warning signs**. Interestingly, though, I find them far easier to spot in others than in myself. [E] Last year, for instance, I noticed my roommate had stopped attending lectures and was sleeping most of the day, so I gently encouraged her to see a counselor, which she later said really helped. During my own exam period, by contrast, it was a friend who pointed out that I seemed exhausted and on edge — something I'd completely failed to notice. [C] So my awareness is improving, but self-awareness remains a work in progress." },
        { q: "When you find yourself feeling overwhelmed, mentally tired, or emotionally off-balance, what do you typically do to cope or recover? Do you have any personal strategies, habits, or routines that help you manage those moments?",
          lx: ["cope with", "clear your head", "get something off your chest"],
          model: "[A] I have three strategies: I move, I talk and I rest. [R] When I feel overwhelmed, my thoughts go round and round, so I need something to stop them. [E] First, I go for a run or a long walk without my phone — it really **clears my head**. Second, I call my sister and tell her everything; just talking about it helps me **get it off my chest**. And third, I give myself one evening without studying, just watching a comedy or cooking something nice. Usually, the next day I feel much better. [C] So movement, people and rest are my way to **cope**.",
          model5: "[A] My strategy essentially comes down to three things: moving, talking and resting. [R] When I'm overwhelmed, my thoughts tend to spiral, so I need something that physically interrupts the loop. [E] My first step is usually a long run or walk without my phone, which **clears my head** like nothing else. Then I call my older sister; simply putting my worries into words and **getting them off my chest** shrinks them remarkably. Finally, I give myself permission to take one evening completely off — cooking something comforting or watching a silly comedy — without feeling guilty. More often than not, I wake up the next day with a far clearer perspective. [C] So, for me, coping is about body, people and rest, in that order." },
        { q: "In recent years, we've seen more open conversations about mental health in schools, workplaces, and on social media. Do you think these discussions are genuinely helpful, or do they sometimes feel shallow or performative? What kind of communication actually helps reduce stigma?",
          lx: ["burnout", "workload", "well-being"],
          model: "[A] I think they are helpful, but only when companies do something real. [R] Talking about stress and **burnout** is important, because many people are afraid to say they feel bad. But if a company only talks and still gives people too much work, it's not honest. [E] For example, my friend's company sends emails about mental health every month, but everyone still works until nine p.m. Another company I know reduced overtime and offers free sessions with a psychologist, and that really helped people. [C] So words are a good start, but actions matter more.", model5: "[A] They're genuinely helpful, but only when they're backed up by real action. [R] Talking openly about stress and **burnout** reduces the stigma, so people feel able to ask for help. If a company simply talks, however, while continuing to overload its staff, the conversation feels hollow, even hypocritical. [E] A friend's company, for instance, sends out cheerful wellness newsletters every month, yet employees still routinely work until nine. Another company I know, by contrast, cut mandatory overtime and offers free counseling sessions, and staff there say it has made a real difference. [C] So these conversations are a valuable first step, but what ultimately counts is whether working conditions actually change." },
        { q: "Access to mental health care is still a challenge in many communities, whether due to cost, stigma, or lack of available services. Do you think mental health support should be free or more accessible for everyone? Why or why not—and what changes would make the biggest difference?",
          lx: ["seek professional help", "stigma", "prevention"],
          model: "[A] Yes, I strongly believe mental health support should be free or at least much cheaper. [R] Many people need help but can't pay for a therapist, so they wait until the problem becomes very serious. Helping people early is cheaper for society in the end. [E] For example, at my university, counseling is free, but the waiting list is almost a month long. A friend of mine needed help urgently and couldn't get an appointment, so she had to pay a private therapist, which was very expensive for a student. [C] So I think we need more free services and more counselors, especially in schools.",
          model5: "[A] I firmly believe it should be free, or at least far more affordable. [R] Many people who need support simply can't afford private therapy, so they wait until a manageable problem becomes a crisis. Early help, moreover, is far cheaper for society than treating serious illness later, so **prevention** makes economic sense as well as moral sense. [E] At my university, for instance, counseling is technically free, but the waiting list stretches to nearly a month. A friend who needed help urgently ended up paying for a private therapist, which put a huge strain on her student budget. [C] So the biggest difference would come from hiring more counselors, especially in schools and universities, so that free help is available when people actually need it." }
      ]}
  ],
