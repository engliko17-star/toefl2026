        { q: "Can you describe some foods that you eat on a regular basis?",
          lx: ["nutritious", "batch-cook", "leftovers"],
          model: "[A] I eat quite simple food — mostly oatmeal, rice, chicken, lentils and lots of vegetables. [R] These foods are cheap, **nutritious** and easy to cook, which is important for a busy student. [E] For example, every morning I have oatmeal with a banana and peanut butter. For lunch, I usually eat **leftovers** from dinner — maybe chicken with rice and salad. Two or three times a week, I make a big pot of lentil soup. And, of course, I drink a lot of coffee! [C] So my food is not fancy, but it keeps me full and healthy.",
          model5: "[A] My regular diet is fairly simple, built around oatmeal, rice, chicken, lentils and plenty of vegetables. [R] These staples are inexpensive, genuinely **nutritious** and quick to prepare, which matters enormously when you're juggling lectures and a part-time job. [E] Every morning, for instance, I have oatmeal topped with a banana and a spoonful of peanut butter, which keeps me full until lunch. Lunch is usually **leftovers** — chicken with rice and a salad — and a couple of times a week I **batch-cook** a big pot of lentil soup. I'll admit, though, that coffee is probably my most regular \"food\" of all. [C] So my meals aren't glamorous, but they're cheap, filling and reasonably healthy." },
        { q: "Tell me about a time when you or someone you know made a significant change to their diet. What was the change and what motivated you or the person you know to make it?",
          lx: ["go cold turkey", "cut out", "energy levels"],
          model: "[A] My father made a big change last year — he stopped eating sugar and fast food. [R] His doctor told him his blood sugar was too high and that he could get diabetes if he didn't change his diet. That really scared him. [E] He stopped eating sweets and fast food **cold turkey**. Instead, he started cooking simple meals with vegetables and fish, and he even took a cooking class. The first month was hard, but after six months, he lost ten kilos, and his blood tests were normal. [C] So a health scare motivated him, and the change really worked.",
          model5: "[A] My father overhauled his diet last year, **cutting out** sugar and fast food almost entirely. [R] The trigger was a routine check-up, at which his doctor warned him that his blood sugar was dangerously high and that he was at serious risk of developing diabetes. [E] Rather than easing into it, he **went cold turkey**, replacing his favorite pastries and burgers with home-cooked meals built around vegetables and fish; he even enrolled in an evening cooking class. The first month, by his own admission, was miserable. Six months later, however, he'd lost ten kilos, his test results were back to normal and his energy levels had soared. [C] So fear may have started the change, but the results are what made it stick." },
        { q: "Some people say they have difficulty maintaining a healthy diet because they do not like the taste of healthier foods. What do you think about that argument? Why?",
          lx: ["taste amazing", "flavor", "processed food"],
          model: "[A] I think this argument is understandable, but it's usually not true. [R] Many people think healthy food means boiled vegetables and plain chicken, but healthy food can be delicious if you cook it well. Also, our taste changes — after a few weeks without junk food, we start to like healthier food more. [E] For example, I used to hate vegetables. Then my roommate showed me how to roast them with garlic and spices, and now roasted vegetables **taste amazing** to me. Also, after I stopped drinking soda, it started to taste too sweet. [C] So it's more about cooking skills and habits than about taste.",
          model5: "[A] I'd say the argument is understandable but largely mistaken. [R] Many people equate healthy food with bland steamed vegetables and plain chicken, when in reality wholesome dishes can be packed with **flavor** if they're cooked well. Moreover, our taste buds adapt: after a few weeks away from **processed food**, healthier options genuinely start to taste better. [E] I used to detest vegetables, for instance, until my roommate showed me how to roast them with garlic, chili and olive oil; now they **taste amazing** to me. Similarly, after I gave up soda, the first sip I tried months later tasted unbearably sweet. [C] So the real obstacle isn't taste itself, but cooking skills and old habits." }
      ]},
    { id: "s102", badge: "official", title: "Dietary Habits", src: "Official TOEFL · 102",
      scenario: "You have volunteered for a research study about dietary habits. You will have a short online interview with a researcher.",
      questions: [
        { q: "When you have a meal at school or work, do you prefer to eat alone or do you like to eat with friends or co-workers? Why?",
          lx: ["grab a bite", "take a break from", "socialize"],
          model: "[A] I prefer to eat with friends. [R] Lunch is the only break in my busy day, and eating with friends helps me relax and forget about studying for a while. It's also the best time to talk and catch up. [E] For example, at university, my friends and I meet in the cafeteria at one o'clock every day. We talk about classes, plans for the weekend and funny things that happened. When I eat alone, I usually look at my phone or study, and I don't really rest. [C] So eating with friends makes lunch a real break.",
          model5: "[A] I much prefer eating with friends. [R] Lunch is often the only genuine break in my day, and sharing it with friends lets me switch off from studying completely, whereas eating alone tends to blur into more work. [E] At university, for instance, a group of us meets in the cafeteria at one o'clock almost every day, and it's become the highlight of my schedule: we catch up, make weekend plans and laugh about whatever went wrong in our lectures. On the rare days I eat alone, I inevitably end up scrolling through my phone or reviewing notes, and I return to class feeling no more rested than before. [C] So for me, a shared meal is what turns lunch into a real break." },
        { q: "What kind of meals do your family or friends generally like to eat? For example, do they prefer traditional home-cooked dishes, fast food, or other types?",
          lx: ["home-cooked", "traditional dishes", "takeout"],
          model: "[A] My family loves traditional **home-cooked** dishes, but my friends prefer fast food and international food. [R] My parents and grandparents grew up cooking at home, and for them, family meals are very important. My friends are students, so they want food that's quick and cheap. [E] For example, every Sunday my grandmother cooks a big traditional lunch with soup, meat and homemade bread, and the whole family comes. But when I'm with my friends, we usually order pizza or go to a cheap Asian restaurant near campus. [C] So the type of food depends on who I'm eating with.",
          model5: "[A] My family overwhelmingly favors traditional **home-cooked** dishes, whereas my friends lean towards fast food and international cuisine. [R] My parents' and grandparents' generations grew up cooking almost every meal at home, and shared family meals remain central to their lives. My friends, by contrast, are students with little time and even less money, so convenience usually wins. [E] Every Sunday, for instance, my grandmother prepares an elaborate lunch — soup, slow-cooked meat and homemade bread — and the whole extended family gathers around the table. With my friends, meanwhile, it's typically pizza **takeout** or a cheap noodle bar near campus. [C] So what I eat depends very much on who I'm eating with." },
        { q: "In recent years, many people have argued that plant-based diets are better for individual health and for the planet. Do you think that in the future more people will adopt plant-based diets? Why or why not?",
          lx: ["plant-based", "carbon footprint", "meat substitute"],
          model: "[A] Yes, I think more people will eat **plant-based** diets in the future, but most won't become fully vegan. [R] People are learning more about health and climate change, and plant-based food is becoming tastier and easier to find. But meat is a big part of many cultures, so it won't disappear. [E] For example, five years ago my local supermarket had almost no vegan products. Now there's a whole section with plant-based burgers and milk. Many of my friends aren't vegetarian, but they eat meat only a few times a week. [C] So I think people will eat less meat, not no meat.",
          model5: "[A] I'm fairly confident more people will adopt **plant-based** diets, though most will probably cut back on meat rather than give it up entirely. [R] Growing awareness of both health benefits and the **carbon footprint** of meat production is shifting attitudes, and plant-based options are becoming tastier, cheaper and far more widely available. That said, meat is deeply embedded in many food cultures. [E] Five years ago, for instance, my local supermarket stocked virtually no vegan products, whereas today an entire aisle is devoted to plant-based burgers, milks and cheeses. Among my friends, very few are strictly vegetarian, yet most now eat meat only a few times a week. [C] So the future, I suspect, is \"less meat\" rather than \"no meat\"." },
        { q: "Some people believe that having regular meal times contributes to better health and financial well-being. Do you agree or disagree with this idea? Explain your answer.",
          lx: ["skip breakfast", "snack", "impulse buy"],
          model: "[A] I agree with this idea. [R] When you eat at regular times, your body knows what to expect, so you have more energy and you don't feel very hungry. And when you're not starving, you don't buy expensive snacks or order fast food. [E] For example, when I **skip breakfast**, by eleven I'm so hungry that I buy a pastry and a coffee for six dollars. When I eat breakfast at home at seven-thirty, I'm fine until lunch, and I save about thirty dollars a week. [C] So regular meals are good for both your health and your wallet.",
          model5: "[A] I agree, and in my experience the two benefits are closely connected. [R] Eating at regular times keeps your energy stable and prevents extreme hunger, and it's precisely when we're ravenous that we make our worst choices, both nutritionally and financially. [E] Whenever I **skip breakfast**, for instance, by eleven o'clock I'm so hungry that I end up spending six dollars on a pastry and a latte from the campus café. When I eat a proper breakfast at home at seven-thirty, by contrast, I comfortably last until lunch. Over a week, that difference adds up to around thirty dollars, not to mention far fewer sugar crashes. [C] So regular meals are, quite literally, good for both body and wallet." }
      ]},
    { id: "s107", badge: "official", title: "Food Preferences", src: "Official TOEFL · 107",
      scenario: "You have volunteered for a research study about food preferences. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, in your opinion, what kinds of meals do people your age enjoy most? Are they traditional, modern, or something in between?",
          lx: ["cuisine", "trendy", "fusion"],
          model: "[A] I think people my age like something in between — modern food, but with traditional elements. [R] We grew up with home-cooked traditional food, but we also love trying international dishes we see on social media. [E] For example, my friends and I love sushi, ramen and Mexican tacos, but we also go to a modern café in my city that makes traditional dumplings with new fillings, like cheese and spinach. And when we visit our parents, we always want our mom's traditional dishes. [C] So we like a mix of old and new.",
          model5: "[A] I'd say people my age gravitate towards something in between: modern, international food with a traditional twist. [R] We grew up on our families' traditional cooking, but social media has exposed us to **cuisines** from all over the world, so we're far more adventurous than our parents were at our age. [E] My friends and I, for instance, regularly eat sushi, ramen and tacos, yet our favorite spot in town is a modern café that reinvents traditional dumplings with unexpected fillings such as goat cheese and spinach. And, tellingly, whenever we visit home, it's still our mothers' classic dishes we ask for. [C] So my generation's taste is essentially a fusion of the familiar and the new." },
        { q: "And what kind of meals do you usually have on busy days? Do you cook, eat out, or pick up something ready-made?",
          lx: ["have a lot on your plate", "batch-cook", "grab a bite"],
          model: "[A] On busy days, I usually eat food I prepared earlier, and sometimes I **grab a bite** on campus. [R] When I have a lot of classes and a work shift, I don't have time to cook, but buying food every day is expensive and not very healthy. [E] For example, every Sunday I cook a big pot of chili or curry and put it in containers. On busy days, I just **heat up** one portion in the microwave. If I forget my lunch, I buy a sandwich at the university café. [C] So cooking in advance is my secret for busy days.",
          model5: "[A] On busy days, I mostly rely on meals I've prepared in advance, with the occasional sandwich grabbed on campus. [R] When I **have a lot on my plate** — back-to-back lectures followed by a work shift — there's simply no time to cook, yet buying lunch every day would be both expensive and unhealthy. [E] Every Sunday, for instance, I **batch-cook** a large pot of chili or curry and divide it into containers, so on hectic days I just **heat up** a portion in the microwave between classes. If I forget my container, which happens more often than I'd like, I **grab a bite** at the university café. [C] So a couple of hours of cooking on Sunday is what gets me through the week." },
        { q: "Many people say that modern life has changed how we eat. Do you think people today have healthier eating habits than in the past? Why or why not?",
          lx: ["processed food", "home-cooked", "nutritious"],
          model: "[A] I think in some ways people eat healthier, but in other ways worse. [R] Today, we know much more about nutrition, and we can buy fresh fruit and vegetables all year. But we also eat much more **processed food**, sugar and fast food because life is so busy. [E] For example, my grandparents ate simple **home-cooked** meals every day, with no snacks or soda. Now people eat chips, energy drinks and delivery food. On the other hand, my friends read food labels and choose healthy options, which my grandparents never did. [C] So it's better in knowledge, but worse in habits.",
          model5: "[A] I'd say it's a mixed picture: we know far more about nutrition, but we often eat worse. [R] Fresh produce is now available year-round, and information about healthy eating is everywhere. Busy modern lifestyles, however, have driven a huge rise in **processed food**, sugary drinks and takeout. [E] My grandparents, for instance, ate simple **home-cooked** meals three times a day and rarely snacked, simply because convenience food barely existed. Today, by contrast, many people live on chips, energy drinks and delivery. Paradoxically, though, my friends read nutrition labels and debate protein intake — something my grandparents never once did. [C] So we're far better informed than past generations, but not necessarily better fed." },
        { q: "Some people believe that preparing traditional meals at home is an important way to stay connected to one's culture. Do you agree? Or do you think it's possible to connect with culture in other ways? Why?",
          lx: ["traditional dishes", "culinary tradition", "pass down"],
          model: "[A] I agree that cooking traditional meals is an important way to stay connected to culture, but it's not the only way. [R] Recipes carry family history and traditions, and cooking them together connects generations. But music, language, festivals and stories are also important. [E] For example, every New Year, my family makes dumplings together, using my great-grandmother's recipe. It's my favorite tradition, and I feel very connected to my roots. But my cousin, who doesn't cook at all, connects with our culture through traditional music. [C] So food is a strong connection, but there are other ways too.",
          model5: "[A] I agree that it's one of the most powerful ways, although certainly not the only one. [R] Traditional recipes carry family history, and cooking them together creates a tangible link between generations; few things evoke a sense of belonging as vividly as the smell of a dish from childhood. Culture, however, also lives in language, music, festivals and stories. [E] Every New Year, for instance, my family gathers to make dumplings from my great-grandmother's recipe, which has been **passed down** for four generations, and it's the moment I feel most connected to my roots. My cousin, by contrast, can barely boil an egg, yet she's deeply engaged with our culture through folk music. [C] So food is a wonderful bridge to culture, but there are many others." }
      ]},
    { id: "s052", badge: "official", title: "Dining Preferences", src: "Official TOEFL · 052 / 060",
      scenario: "You have volunteered for a research study at your university about dining preferences. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, how often do you eat out at restaurants? Do you do this daily, weekly, monthly, or less often?",
          lx: ["eat out", "budget", "special occasion"],
          model: "[A] I **eat out** about once or twice a month. [R] As a student, I don't have much money, and restaurants are expensive, so I usually cook at home. But I like going out for special occasions. [E] For example, last month I went to a nice Italian restaurant for my best friend's birthday, and a few weeks ago my parents visited and took me to a traditional restaurant in the city center. Sometimes, after exams, my friends and I also go to a cheap noodle place to celebrate. [C] So eating out is a treat for me, not a habit.",
          model5: "[A] I **eat out** roughly once or twice a month, mainly on special occasions. [R] On a student budget, restaurants are a luxury, so cooking at home is my default; that also makes the occasional meal out feel genuinely special. [E] Last month, for instance, a group of us celebrated my best friend's birthday at a cozy Italian place, and a few weeks before that my parents visited and treated me to dinner at a traditional restaurant in the old town. We also have an unofficial rule that the end of exam week is always celebrated at a cheap but excellent noodle bar near campus. [C] So eating out is a treat rather than a routine for me, which is probably why I enjoy it so much." },
        { q: "If you are going to eat out, what types of cuisine do you prefer? For example, do you like savory foods or desserts?",
          lx: ["savory", "cuisine", "have a sweet tooth"],
          model: "[A] I prefer **savory** food, especially Japanese and Mexican **cuisine**. [R] I love strong flavors — spicy, salty and sour — and these cuisines have a lot of them. Also, I can make simple food at home, so in a restaurant I want something I can't cook myself. [E] For example, my favorite restaurant meal is a big bowl of ramen with spicy broth, or tacos with lots of lime and chili. I don't usually order dessert, but my sister **has** a real **sweet tooth** and always orders two! [C] So for me, restaurants are for savory, interesting flavors.",
          model5: "[A] I'm firmly in the **savory** camp, with Japanese and Mexican **cuisine** as my favorites. [R] I'm drawn to bold flavors — heat, acidity, umami — and both cuisines deliver them in abundance. Besides, since I can manage simple dishes at home, when I eat out I want something I couldn't realistically make myself. [E] My ideal restaurant meal, for instance, is a steaming bowl of ramen in a rich, spicy broth, or a plate of tacos loaded with fresh lime and chili. I rarely bother with dessert, whereas my sister, who **has** an incurable **sweet tooth**, has been known to order two and skip the main course entirely. [C] So, for me, restaurants are all about bold, savory flavors." },
        { q: "Can you tell me about a memorable dining experience or meal you or a friend have had recently? What made it special or stand out?",
          lx: ["taste amazing", "atmosphere", "the local cuisine"],
          model: "[A] A memorable meal was a dinner at a small family restaurant in Portugal last summer. [R] It was special because of the food, the people and the surprise. [E] We found the restaurant by accident when it started raining. There was no menu — the owner's mother just brought us what she cooked that day: grilled fish, potatoes and salad. Everything **tasted amazing**. Then the owner played the guitar, and other guests started singing. We stayed there for four hours. [C] So it wasn't expensive, but it was the best meal of my life.",
          model5: "[A] The most memorable meal I've had recently was at a tiny family-run restaurant in Portugal last summer. [R] What made it unforgettable wasn't sophistication but authenticity — the food, the people and the sheer serendipity of it. [E] We stumbled upon the place while sheltering from a sudden downpour. There was no menu; the owner's elderly mother simply brought out whatever she'd cooked that day — grilled sardines, roast potatoes and a tomato salad — and everything **tasted amazing**. Later, the owner picked up a guitar, and before long half the room was singing along. We ended up staying for four hours. [C] So it was far from the most expensive meal I've had, but it's easily the one I'll remember longest." },
        { q: "Some people believe that the atmosphere and service at a restaurant are just as important as the food quality. Do you agree or disagree with this viewpoint? Why?",
          lx: ["atmosphere", "service", "leave a tip"],
          model: "[A] I agree that atmosphere and service are very important, almost as important as the food. [R] When we eat out, we don't just pay for food — we pay for an experience. Rude waiters or a noisy room can ruin even a delicious meal. [E] For example, last year I went to a famous restaurant with great reviews. The food was good, but the waiter was rude, and the music was so loud we couldn't talk. I never went back. But I visit a small café near my home every week because the owner remembers my name and the place feels cozy. [C] So the food matters, but the experience matters too.",
          model5: "[A] I largely agree; in my view, atmosphere and service are almost as important as the food itself. [R] When we eat out, we're paying for an entire experience rather than just a meal, and indifferent service or an unpleasant setting can easily overshadow excellent cooking. [E] Last year, for instance, I went to a highly rated restaurant whose food was genuinely impressive, but the waiter was dismissive and the music so loud that conversation was impossible; I've never returned. By contrast, I happily visit a modest café near my apartment every week, largely because the owner greets me by name and the place feels like a second living room. [C] So great food may bring people in, but it's the experience that brings them back." }
      ]},
    { id: "seh", badge: "platform", title: "Eating Habits", src: "Практика платформы",
      scenario: "We're conducting a study on everyday eating habits and how people make choices around food. I'd like to begin by asking you a few questions about your typical meals.",
      questions: [
        { q: "What kind of meals do you usually eat in a normal day—from morning to evening? Could you describe what a typical breakfast, lunch, and dinner might look like for you?",
          lx: ["leftovers", "have a snack", "home-cooked"],
          model: "[A] My meals are quite simple and mostly **home-cooked**. [R] I'm a student with a small budget and not much time, so I eat things that are cheap, quick and healthy. [E] For breakfast, I usually have oatmeal with fruit and a big coffee. For lunch, I eat **leftovers** from dinner at university — for example, chicken with rice and vegetables. In the afternoon, I **have a snack**, like an apple or some nuts. For dinner, I cook something quick, like pasta with vegetables or an omelet. On weekends, I sometimes eat out with friends. [C] So my food is simple but balanced.",
          model5: "[A] My meals are simple and mostly **home-cooked**, built around what's cheap, quick and reasonably healthy. [R] As a student juggling lectures and a part-time job, I simply don't have the time or budget for anything elaborate on weekdays. [E] Breakfast is almost always oatmeal with fruit and a generous mug of coffee. Lunch tends to be **leftovers** from the night before — chicken with rice and roasted vegetables, say — which I eat between lectures. Mid-afternoon, I **have a snack**, usually an apple or a handful of nuts, to avoid the vending machine. Dinner is something quick, like pasta with vegetables or an omelet. At weekends, I'll occasionally eat out with friends. [C] So it's nothing fancy, but it's balanced and keeps me going." },
        { q: "Many people today say it's harder to eat healthily because of busy routines, limited time, or the convenience of fast food and packaged meals. How easy or difficult do you find it to maintain a healthy, balanced diet in your own life? And what factors—like work, family, cost, or access—affect the choices you make?",
          lx: ["balanced diet", "junk food", "batch-cook"],
          model: "[A] It's not easy, but I manage most of the time. [R] The biggest problems for me are time and money. During exams, I'm very busy and tired, so fast food is tempting. Also, fresh food is more expensive than **junk food**. [E] For example, a burger near campus costs less than a salad, which is crazy. To solve this, I **batch-cook** on Sundays, so I always have healthy food ready. But during exam week, I still order pizza two or three times. [C] So planning helps me a lot, but it's still a challenge.",
          model5: "[A] I'd say it's manageable most of the time, though it's a constant balancing act. [R] For me, the two biggest obstacles are time and cost: during exam periods, convenience food is extremely tempting, and, frustratingly, fresh produce is often pricier than **junk food**. [E] Near my campus, for instance, a burger is actually cheaper than a decent salad, which says a lot about our food system. My solution is to **batch-cook** every Sunday, so healthy meals are always ready in the fridge. Even so, I'll admit that during exam weeks pizza deliveries creep back in two or three times. [C] So planning ahead makes a **balanced diet** realistic for me, but it would certainly be easier if healthy food were cheaper." },
        { q: "In recent years, there's been a lot of attention on food trends—things like plant-based diets, organic and local ingredients, low-carb eating, or intermittent fasting. Have you tried any of these food trends yourself? If so, what motivated you to try them, and how did they fit into your lifestyle?",
          lx: ["intermittent fasting", "plant-based", "take something with a pinch of salt"],
          model: "[A] Yes, I tried **intermittent fasting** last year, and now I eat **plant-based** meals a few times a week. [R] I tried fasting because many people online said it gives you more energy. Plant-based meals I started for health and for the environment. [E] For example, with fasting, I didn't eat until noon. It worked for two weeks, but then I felt tired and couldn't concentrate in morning classes, so I stopped. Plant-based meals were easier — now I eat lentil curry or bean tacos three times a week, and I really like them. [C] So some trends work for me, and some don't.",
          model5: "[A] I've experimented with two: **intermittent fasting**, which I abandoned, and **plant-based** eating, which has stuck. [R] I tried fasting after countless videos promised boundless energy, whereas I started eating more plant-based meals for both health and environmental reasons. [E] With fasting, I skipped food until noon; for about two weeks it felt fine, but then I found myself struggling to concentrate in morning lectures, so I gave it up. Plant-based meals, by contrast, fitted seamlessly into my routine: lentil curry and black bean tacos now appear on my menu three times a week, and they're cheaper than meat. [C] So my experience taught me to **take** food trends **with a pinch of salt** and keep only what actually works for me." },
        { q: "Many experts argue that healthy eating shouldn't just be a personal responsibility, but something supported by communities and public institutions. Do you believe schools, local governments, or communities should do more to promote healthy eating? And if so, what kinds of initiatives would you like to see?",
          lx: ["nutritious", "affordable", "cooking classes"],
          model: "[A] Yes, I think schools and local governments should do much more. [R] It's hard to eat healthily if healthy food is expensive and nobody teaches you how to cook. Institutions can make healthy choices easier for everyone, especially for children. [E] For example, I'd like schools to offer free, **nutritious** lunches and teach cooking classes, so kids learn to make simple healthy meals. Cities could also support farmers' markets and give discounts on fruit and vegetables. My university started cheap healthy lunches last year, and they're always sold out. [C] So it shouldn't only be a personal responsibility.",
          model5: "[A] I strongly believe they should. [R] Telling people to eat healthily is pointless if nutritious food is expensive and nobody has taught them to cook. Institutions can make the healthy choice the easy and **affordable** one, which matters especially for children and low-income families. [E] I'd love to see schools providing free, **nutritious** lunches and practical **cooking classes**, so children leave school able to prepare a few simple meals. Cities, meanwhile, could support farmers' markets and subsidize fruit and vegetables. My university, for instance, launched a low-cost healthy lunch option last year, and it sells out almost every day, which proves the demand is there. [C] So healthy eating should be a shared responsibility, not purely an individual one." }
      ]},
    { id: "spb", badge: "platform", title: "Plant-based Diets", src: "Практика платформы",
      scenario: "I'm doing a study on eating habits, especially around plant-based diets. I'd like to ask you a few questions about your experience.",
      questions: [
        { q: "Would you say you follow a fully plant-based diet, or do you simply try to include more plant-based meals in your routine? What motivated you to make that shift—was it for health, environmental reasons, animal welfare, or something else?",
          lx: ["plant-based", "carbon footprint", "cut back on"],
          model: "[A] I'm not fully plant-based, but I eat plant-based meals about three or four times a week. [R] I started mainly for the environment, after I learned how much meat production affects the climate. Health and money were also reasons — beans and lentils are cheaper than meat. [E] For example, last year I watched a documentary about the **carbon footprint** of beef, and it really shocked me. The next week I tried my first lentil curry, and I loved it. Now I eat meat only on weekends, usually with my family. [C] So I **cut back on** meat for the planet, and I'm happy with the change.",
          model5: "[A] I wouldn't call myself fully plant-based; I'd describe myself as a flexitarian, eating plant-based meals three or four times a week. [R] My main motivation was environmental, though health and, frankly, my student budget played a role too, since beans and lentils cost a fraction of the price of meat. [E] The turning point came last year, when I watched a documentary on the **carbon footprint** of beef production. The following week, I cooked my first lentil curry, and, to my surprise, I loved it. These days, I mostly eat meat only at weekends, typically at family lunches. [C] So I **cut back on** meat primarily for the planet, but I've ended up healthier and better off as well." },
        { q: "What are some of your go-to meals or favorite ingredients when you're eating plant-based? And do you find it easy to prepare satisfying meals, or does it take extra effort and planning?",
          lx: ["protein", "flavor", "batch-cook"],
          model: "[A] My go-to meals are lentil curry, bean tacos and pasta with roasted vegetables. [R] These dishes are easy, cheap and full of **flavor**, and they keep me full for a long time. [E] For example, my lentil curry takes only thirty minutes: lentils, tomatoes, coconut milk and spices. I make a big pot and eat it for three days. At first, it took more planning, because I had to learn new recipes and think about **protein**. But after a month, it became easy. [C] So plant-based cooking needed some effort at the start, but now it's simple.",
