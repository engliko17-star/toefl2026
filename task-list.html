<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Task — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="content-visibility.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-900 min-h-screen antialiased flex flex-col md:flex-row">

    <div id="app-sidebar"></div>
    <script src="nav.js"></script>

    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
    <div class="max-w-5xl mx-auto">
        <div class="flex items-center space-x-4 mb-6">
            <a href="writing.html" class="flex items-center justify-center w-10 h-10 rounded-xl border border-gray-200 bg-white text-gray-500 hover:bg-gray-50 hover:text-slate-800 transition shadow-sm shrink-0">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider" id="backBreadcrumb">← Back to Writing</span>
                <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 capitalize mt-0.5" id="pageTitle">Writing Practice</h1>
            </div>
        </div>

        <!-- Сводка по критериям (Email и Academic; появляется, когда есть оценки по критериям) -->
        <div id="criteriaSummary" class="hidden bg-white border border-gray-100 rounded-[1.5rem] shadow-sm p-5 mb-5"></div>

        <!-- Фильтр по темам (только Email и Academic Discussion; появляется, когда у заданий есть темы) -->
        <div id="topicFilter" class="hidden flex-wrap gap-2 mb-6" role="group" aria-label="Filter by topic"></div>

        <div id="tasksContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="h-44 bg-white border border-gray-100 rounded-3xl p-6 animate-pulse space-y-4">
                <div class="flex justify-between"><div class="h-4 w-16 bg-gray-200 rounded"></div><div class="h-8 w-8 bg-gray-200 rounded-full"></div></div>
                <div class="h-6 w-3/4 bg-gray-200 rounded"></div>
                <div class="h-10 w-full bg-gray-100 rounded-xl"></div>
            </div>
        </div>
    </div>
    </main>

    <script>
        // Один клиент на страницу (тот, что создал auth.js): второй клиент на том же
        // хранилище сессии иногда «зависал» на входе.
        const db = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        // Глазик преподавателя (content-visibility.js). Если файл не загрузился,
        // страница работает как раньше, а скрытое всё равно не попадает к ученикам.
        const CV = window.ContentVisibility || {
            init() {}, cardClass() { return ''; }, withEye(html) { return html; },
            visibleFor(rows) { return (rows || []).filter(r => r.is_hidden !== true); }
        };
        const urlParams = new URLSearchParams(window.location.search);
        // Только известные типы: значение из адреса попадает в ссылки и разметку
        const TASK_TYPES = ['sentence', 'email', 'academic'];
        const rawType = String(urlParams.get('type') || 'sentence').toLowerCase();
        const taskType = TASK_TYPES.includes(rawType) ? rawType : 'sentence';
        
        document.getElementById('pageTitle').innerText = taskType === 'sentence' ? 'Build a Sentence' : taskType === 'email' ? 'Write an Email' : 'Academic Discussion';

        document.addEventListener('DOMContentLoaded', loadTasksAndProgress);

        // Хранилище сгруппированных ID для сброса прогресса
        let currentTestGroups = {};
        let currentGroupResponses = {};
        let currentUserId = null;

        // Балл эссе в базе бывает в двух видах: «4.5» и «4.5/6.0» (так сохранялись
        // оценки раньше). «0/6.0» — заглушка старой практики, а не оценка.
        function essayScoreOf(r) {
            if (!r || r.score === null || r.score === undefined) return null;
            const s = String(r.score).trim();
            if (!s || /^0\s*\/\s*6(\.0+)?$/.test(s)) return null;
            const m = s.match(/^(\d+(?:\.\d+)?)(?:\s*\/\s*6(?:\.0+)?)?$/);
            return m ? parseFloat(m[1]) : null;
        }
        // ---------- ПОПЫТКИ ЭССЕ ----------
        // До 3 попыток на эссе; следующая открывается после проверки предыдущей.
        // Каждая попытка — своя строка student_responses (номер — attempt_no).
        const MAX_ATTEMPTS = 3;
        const CRITERIA = [
            { key: 'purpose_score',    label: 'Communicative purpose', bar: 'bg-emerald-500' },
            { key: 'grammar_score',    label: 'Grammar',               bar: 'bg-indigo-500' },
            { key: 'vocabulary_score', label: 'Vocabulary',            bar: 'bg-sky-500' }
        ];
        let currentGroupAttempts = {};   // groupId → попытки эссе (для сброса)

        function critVal(r, key) {
            if (!r || r[key] === null || r[key] === undefined || r[key] === '') return null;
            const v = parseFloat(r[key]);
            return isNaN(v) ? null : v;
        }
        function fmtScore(v) {
            return Number.isInteger(v) ? String(v) : String(+v.toFixed(2));
        }
        function sortAttempts(list) {
            return [...list].sort((a, b) => {
                const an = Number(a.attempt_no), bn = Number(b.attempt_no);
                if (an && bn && an !== bn) return an - bn;
                const at = String(a.created_at || ''), bt = String(b.created_at || '');
                if (at !== bt) return at < bt ? -1 : 1;
                return Number(a.id) - Number(b.id);
            });
        }

        // Эссе считается проверенным, когда есть балл преподавателя, его правки
        // или оценка по критерию. Та же проверка стоит в базе: проверенное эссе
        // ученица не может удалить, а новую попытку начать — только после проверки.
        function isEssayGraded(r) {
            if (!r || taskType === 'sentence') return false;
            const filled = v => String(v || '').trim() !== '';
            return filled(r.correction) || filled(r.teacher_correction) || essayScoreOf(r) !== null
                || CRITERIA.some(c => critVal(r, c.key) !== null);
        }

        function resetButtonHTML(groupId, groupResponses, completedStyle) {
            // Работа проверена целиком — сбросить нельзя: замок с пояснением
            if (groupResponses.length && groupResponses.every(isEssayGraded)) {
                return `<button onclick="explainLockedReset()" class="w-12 flex items-center justify-center bg-gray-50 text-gray-400 hover:bg-gray-100 transition py-3 rounded-2xl shrink-0 border border-gray-200" title="Reviewed by your teacher — can't be reset">
                    <i data-lucide="lock" class="w-4 h-4"></i>
                </button>`;
            }
            return completedStyle
                ? `<button onclick="resetGroup('${groupId}')" class="w-12 flex items-center justify-center bg-rose-50 text-rose-600 hover:bg-rose-100 transition py-3 rounded-2xl shrink-0 border border-rose-100" title="Reset Entire Test">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>`
                : `<button onclick="resetGroup('${groupId}')" class="w-12 flex items-center justify-center bg-gray-50 text-gray-400 hover:bg-gray-100 transition py-3 rounded-2xl shrink-0 border border-gray-200" title="Reset Entire Test">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>`;
        }

        // Supabase отдаёт не больше 1000 строк за один запрос — всё, что дальше,
        // молча обрезается. Поэтому грузим порциями по 1000, пока не придёт неполная.
        // buildQuery должен возвращать новый запрос с .order(...) — без сортировки
        // порции могут пересекаться.
        const PAGE_SIZE = 1000;
        async function fetchAllRows(buildQuery) {
            const rows = [];
            for (let from = 0; ; from += PAGE_SIZE) {
                const { data, error } = await buildQuery().range(from, from + PAGE_SIZE - 1);
                if (error) throw error;
                rows.push(...(data || []));
                if (!data || data.length < PAGE_SIZE) break;
            }
            return rows;
        }

        // Номер набора реального TOEFL берём из названия («072», «069 16.06.2026»)
        function realSetNumber(task) {
            const n = parseInt(String(task.title || '').trim(), 10);
            return Number.isFinite(n) ? n : Number.MAX_SAFE_INTEGER;
        }

        function explainLockedReset(allAttemptsUsed) {
            if (allAttemptsUsed) {
                alert(`You have used all ${MAX_ATTEMPTS} attempts for this task.\n\nYour answers, scores and the teacher's feedback are kept — open Review Results to see them.`);
                return;
            }
            alert("Your teacher has already reviewed this work, so it can't be reset.\n\nYour answer, the score and the teacher's feedback are kept — open Review Results to see them.");
        }

        // Сводка по критериям над списком: среднее по последней оценённой попытке
        // каждого эссе этого раздела. Показывается, когда есть хоть одна оценка.
        function renderCriteriaSummary(attemptsByTask) {
            const box = document.getElementById('criteriaSummary');
            if (!box) return;
            const sums = {}, counts = {};
            let essays = 0;
            if (taskType !== 'sentence') {
                Object.values(attemptsByTask).forEach(list => {
                    const withCrit = [...list].reverse().find(r => CRITERIA.some(c => critVal(r, c.key) !== null));
                    if (!withCrit) return;
                    essays++;
                    CRITERIA.forEach(c => {
                        const v = critVal(withCrit, c.key);
                        if (v !== null) { sums[c.key] = (sums[c.key] || 0) + v; counts[c.key] = (counts[c.key] || 0) + 1; }
                    });
                });
            }
            if (!essays) { box.classList.add('hidden'); box.innerHTML = ''; return; }
            box.innerHTML = `
                <div class="flex items-baseline justify-between mb-3">
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Your criteria</h2>
                    <span class="text-[11px] font-semibold text-gray-400">${essays} reviewed ${essays === 1 ? 'essay' : 'essays'} · out of 6</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    ${CRITERIA.map(c => {
                        const avg = counts[c.key] ? sums[c.key] / counts[c.key] : null;
                        return `
                        <div data-criterion="${c.key}">
                            <div class="flex items-baseline justify-between mb-1.5">
                                <span class="text-xs font-bold text-slate-700">${c.label}</span>
                                <span class="text-sm font-black text-slate-900">${avg === null ? '—' : avg.toFixed(1)}</span>
                            </div>
                            <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                                <div class="h-full ${c.bar} rounded-full" style="width:${avg === null ? 0 : Math.min(100, avg / 6 * 100)}%"></div>
                            </div>
                        </div>`;
                    }).join('')}
                </div>`;
            box.classList.remove('hidden');
        }

        // Иконки — необязательная часть: если библиотека не загрузилась,
        // список заданий всё равно показывается (раньше падал целиком)
        function safeIcons() {
            try { if (window.lucide) lucide.createIcons(); } catch (e) { /* без иконок */ }
        }

        function tlEsc(s) {
            return String(s === null || s === undefined ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ---------- ФИЛЬТР ПО ТЕМАМ (Email и Academic Discussion) ----------
        // Тема хранится в writing_tasks.topic. Порядок кнопок — как здесь;
        // темы, которых нет в списке, идут следом по алфавиту, задания без темы — в «Other».
        const TOPIC_ORDER = {
            email: ['Reporting a Problem', 'Feedback', 'Suggestions', 'Requests and Inquiries',
                    'Invitations and Plans', 'Advice', 'Thanks'],
            academic: ['Education', 'Technology & Media', 'Environment', 'Business & Work',
                       'Government & Economy', 'Society & Culture', 'Psychology & Health']
        };
        const NO_TOPIC = '__other__';
        const TOPIC_KEY = 'taskListTopic:' + taskType;
        let allCards = [];          // { topic, html } — все карточки в порядке показа
        let activeTopic = 'all';

        function readSavedTopic() {
            try { return localStorage.getItem(TOPIC_KEY) || 'all'; } catch (e) { return 'all'; }
        }
        function saveTopic(t) {
            try { localStorage.setItem(TOPIC_KEY, t); } catch (e) { /* без запоминания */ }
        }

        function groupTopic(groupTasks) {
            const t = groupTasks.map(x => String(x.topic || '').trim()).find(Boolean);
            return t || NO_TOPIC;
        }

        function renderTopicFilter() {
            const bar = document.getElementById('topicFilter');
            const hasTopics = taskType !== 'sentence' && allCards.some(c => c.topic !== NO_TOPIC);
            if (!hasTopics) {
                bar.classList.add('hidden'); bar.classList.remove('flex');
                activeTopic = 'all';
                return;
            }
            const counts = {};
            allCards.forEach(c => { counts[c.topic] = (counts[c.topic] || 0) + 1; });
            const known = TOPIC_ORDER[taskType] || [];
            const topics = [
                ...known.filter(t => counts[t]),
                ...Object.keys(counts).filter(t => t !== NO_TOPIC && !known.includes(t)).sort(),
                ...(counts[NO_TOPIC] ? [NO_TOPIC] : [])
            ];
            if (activeTopic !== 'all' && !counts[activeTopic]) activeTopic = 'all';

            const chip = (value, label, n) => {
                const on = value === activeTopic;
                return `<button type="button" data-topic="${tlEsc(value)}" aria-pressed="${on}"
                    class="topic-chip inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-bold border transition
                           ${on ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-white text-slate-600 border-gray-200 hover:border-slate-400 hover:text-slate-900'}">
                    <span>${tlEsc(label)}</span>
                    <span class="${on ? 'text-slate-300' : 'text-gray-400'} font-semibold">${n}</span>
                </button>`;
            };
            bar.innerHTML = chip('all', 'All', allCards.length)
                + topics.map(t => chip(t, t === NO_TOPIC ? 'Other' : t, counts[t])).join('');
            bar.classList.remove('hidden'); bar.classList.add('flex');
            bar.querySelectorAll('.topic-chip').forEach(b => {
                b.addEventListener('click', () => selectTopic(b.getAttribute('data-topic')));
            });
        }

        function selectTopic(t) {
            activeTopic = t || 'all';
            saveTopic(activeTopic);
            renderTopicFilter();
            renderCards();
        }

        // Кружок с баллом в углу карточки (как у пройденных наборов)
        function scoreCircleHTML(hasScore, percent, label) {
            const strokeDash = 2 * Math.PI * 16;
            const offset = strokeDash - (percent / 100) * strokeDash;
            return `
                <div class="relative flex items-center justify-center w-11 h-11 shrink-0">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                        <circle cx="18" cy="18" r="16" fill="transparent" stroke="#f1f5f9" stroke-width="3.5"></circle>
                        <circle cx="18" cy="18" r="16" fill="transparent" stroke="${hasScore ? '#10b981' : '#cbd5e1'}" stroke-width="3.5"
                            stroke-dasharray="${strokeDash}" stroke-dashoffset="${hasScore ? offset : 0}" stroke-linecap="round"></circle>
                    </svg>
                    <div class="absolute text-[9px] font-extrabold text-slate-700 tracking-tight">
                        ${hasScore ? label : '<i data-lucide="check" class="w-4 h-4 text-emerald-500"></i>'}
                    </div>
                </div>`;
        }

        function renderCards() {
            const container = document.getElementById('tasksContainer');
            const shown = activeTopic === 'all' ? allCards : allCards.filter(c => c.topic === activeTopic);
            container.className = "grid grid-cols-1 md:grid-cols-2 gap-6";
            container.innerHTML = shown.map(c => c.html).join('');
            safeIcons();
        }

        async function loadTasksAndProgress() {
            const container = document.getElementById('tasksContainer');
            try {
                // requireAuth проверяет и вход, и доступ к Writing.
                // Раньше здесь проверялась только сессия.
                const user = await requireAuth();
                if (!user) return;
                const userId = user.id;
                currentUserId = userId;
                CV.init({ user, reload: loadTasksAndProgress });

                // Получаем все вопросы (исключая задания, помеченные только для моков)
                const allTasks = await fetchAllRows(() => db.from('writing_tasks')
                    .select('*')
                    .ilike('type', taskType)
                    .or('is_mock_only.eq.false,is_mock_only.is.null')
                    .order('id', { ascending: true }));

                // Скрытые глазиком задания видит только преподаватель
                const tasks = CV.visibleFor(allTasks, user);

                // Сначала новые: если на задание несколько ответов, берётся последний
                // Тоже порциями: у активной ученицы ответов на Build a Sentence бывает больше 1000
                const responses = await fetchAllRows(() => db.from('student_responses').select('*')
                    .eq('user_id', userId).ilike('task_type', taskType)
                    .order('created_at', { ascending: false })
                    .order('id', { ascending: false }));

                // Все попытки эссе по заданиям, от первой к последней
                const attemptsByTask = {};
                if (taskType !== 'sentence') {
                    responses.forEach(r => {
                        const k = String(r.task_id);
                        (attemptsByTask[k] = attemptsByTask[k] || []).push(r);
                    });
                    Object.keys(attemptsByTask).forEach(k => { attemptsByTask[k] = sortAttempts(attemptsByTask[k]); });
                }
                renderCriteriaSummary(attemptsByTask);

                if (!tasks || tasks.length === 0) {
                    allCards = [];
                    renderTopicFilter();
                    container.className = "flex justify-center items-center py-20 w-full col-span-full";
                    container.innerHTML = `<div class="text-center text-gray-400"><i data-lucide="file-x" class="w-12 h-12 mx-auto mb-2"></i><p class="font-medium">No tasks found.</p></div>`;
                    safeIcons();
                    return;
                }

                // Группируем вопросы по test_id
                const testGroups = {};
                tasks.forEach(task => {
                    const groupId = task.test_id ? `test_${task.test_id}` : `task_${task.id}`;
                    if (!testGroups[groupId]) testGroups[groupId] = [];
                    testGroups[groupId].push(task);
                });

                // Карточки сначала собираем все, потом показываем с учётом фильтра.
                // Номера наборов считаются по всему списку, поэтому при фильтре
                // у набора остаётся тот же номер.
                const cards = [];
                currentTestGroups = {};
                currentGroupResponses = {};
                currentGroupAttempts = {};

                let groupIndex = 1;
                // Номер считаем по порядку карточек, а не по test_id: у реальных наборов
                // TOEFL Build a Sentence, Email и Academic Discussion получают test_id подряд
                // (например, 193 и 194), поэтому номера по test_id шли с пропусками.
                // Считаем только видимые ученикам наборы, чтобы у вас и у учеников
                // один и тот же набор был под одним номером.
                let visibleIndex = 0;

                // Порядок: сначала обычные наборы (как раньше, по id),
                // потом реальные TOEFL по номеру набора (050, 051, …)
                const groupOrder = Object.keys(testGroups);
                const regularGroups = groupOrder.filter(g => !testGroups[g][0].is_real_toefl);
                const realGroups = groupOrder.filter(g => testGroups[g][0].is_real_toefl)
                    .sort((a, b) => realSetNumber(testGroups[a][0]) - realSetNumber(testGroups[b][0]));

                [...regularGroups, ...realGroups].forEach((groupId) => {
                    const groupTasks = testGroups[groupId];
                    const firstTask = groupTasks[0];
                    const totalQuestions = groupTasks.length;
                    // Набор скрыт, если скрыт хоть один его вопрос: глазик скрывает
                    // и открывает набор целиком
                    const isHiddenGroup = groupTasks.some(t => t.is_hidden === true);
                    if (!isHiddenGroup) visibleIndex++;
                    const testNumberLabel = isHiddenGroup ? 'Draft' : `Test #${visibleIndex}`;
                    
                    // Сохраняем все ID этой группы, чтобы кнопка Reset могла удалить их все разом
                    currentTestGroups[groupId] = groupTasks.map(t => t.id);

                    // Ищем ответы студента для текущей группы вопросов
                    const groupResponses = groupTasks.map(t => responses.find(r => String(r.task_id) === String(t.id))).filter(r => r);
                    currentGroupResponses[groupId] = groupResponses;
                    const completedCount = groupResponses.length;
                    
                    const isFullyCompleted = completedCount === totalQuestions;
                    const isPartiallyCompleted = completedCount > 0 && completedCount < totalQuestions;

                    let actionButton = '';
                    let progressCircleHTML = '';
                    let statusLabelHTML = '';
                    let attemptTrail = '';

                    // Эссе из одного задания: все его попытки (у Build a Sentence попыток нет)
                    const attempts = (taskType !== 'sentence' && totalQuestions === 1)
                        ? (attemptsByTask[String(firstTask.id)] || []) : null;
                    currentGroupAttempts[groupId] = attempts || [];

                    // У реальных TOEFL показываем название набора («072», «069 16.06.2026»),
                    // у обычных наборов с test_id — порядковый номер, у одиночных заданий — их название
                    const cardTitle = firstTask.is_real_toefl
                        ? (firstTask.title || `Practice Set ${visibleIndex}`)
                        : firstTask.test_id
                            ? (isHiddenGroup ? 'Practice Set (draft)' : `Practice Set ${visibleIndex}`)
                            : firstTask.title;

                    if (isFullyCompleted && attempts && attempts.length) {
                        // ---- Эссе с попытками ----
                        const used = attempts.length;
                        const last = attempts[used - 1];
                        const reviewed = isEssayGraded(last);
                        const allUsed = used >= MAX_ATTEMPTS;
                        const taskUrl = `writing-practice.html?type=${taskType}&id=${encodeURIComponent(firstTask.id)}`;

                        statusLabelHTML = !reviewed
                            ? `<span class="text-[11px] font-bold text-amber-600 flex items-center"><i data-lucide="clock" class="w-3.5 h-3.5 mr-1"></i> Waiting for review</span>`
                            : `<span class="text-[11px] font-bold text-emerald-600 flex items-center"><i data-lucide="check-circle" class="w-3.5 h-3.5 mr-1"></i> ${allUsed ? 'Completed' : 'Reviewed'}</span>`;

                        // В кружке — балл последней оценённой попытки
                        const scored = [...attempts].reverse().find(r => essayScoreOf(r) !== null);
                        const sv = scored ? essayScoreOf(scored) : null;
                        progressCircleHTML = scoreCircleHTML(sv !== null, sv !== null ? Math.round(sv / 6 * 100) : 0, sv !== null ? fmtScore(sv) : '');

                        // Баллы по попыткам: 3.5 → 4.5 → … (… — ждёт проверки)
                        if (used > 1) {
                            attemptTrail = attempts.map(r => {
                                const v = essayScoreOf(r);
                                return v !== null ? fmtScore(v) : (isEssayGraded(r) ? '✓' : '…');
                            }).join(' → ');
                        }

                        let second;
                        if (!reviewed) {
                            // Непроверенную попытку можно удалить и написать заново
                            second = `<button onclick="resetGroup('${groupId}')" class="w-12 flex items-center justify-center bg-rose-50 text-rose-600 hover:bg-rose-100 transition py-3 rounded-2xl shrink-0 border border-rose-100" title="Delete attempt ${used} (not reviewed yet)">
                                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                </button>`;
                        } else if (!allUsed) {
                            second = `<a href="${taskUrl}&rewrite=1" class="rewrite-btn flex items-center justify-center gap-1.5 px-4 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-100 transition py-3 rounded-2xl font-bold text-sm shrink-0" title="Write this task again: attempt ${used + 1} of ${MAX_ATTEMPTS}">
                                    <i data-lucide="pen-line" class="w-4 h-4"></i><span>Rewrite</span><span class="text-indigo-400 text-xs font-semibold">${used + 1}/${MAX_ATTEMPTS}</span>
                                </a>`;
                        } else {
                            second = `<button onclick="explainLockedReset(true)" class="w-12 flex items-center justify-center bg-gray-50 text-gray-400 hover:bg-gray-100 transition py-3 rounded-2xl shrink-0 border border-gray-200" title="All ${MAX_ATTEMPTS} attempts used">
                                    <i data-lucide="lock" class="w-4 h-4"></i>
                                </button>`;
                        }
                        actionButton = `
                            <div class="flex gap-2">
                                <a href="${taskUrl}" class="flex-1 flex items-center justify-center space-x-2 bg-[#edfdf4] text-emerald-700 hover:bg-[#dcfce7] transition py-3 rounded-2xl font-bold text-sm">
                                    <span>Review Results</span> <i data-lucide="eye" class="w-4 h-4"></i>
                                </a>
                                ${second}
                            </div>
                        `;
                    } else if (isFullyCompleted) {
                        statusLabelHTML = `<span class="text-[11px] font-bold text-emerald-600 flex items-center"><i data-lucide="check-circle" class="w-3.5 h-3.5 mr-1"></i> Completed</span>`;
                        
                        let totalEarned = 0;
                        let totalMax = 0;
                        let hasScore = false;

                        // Суммируем баллы за все вопросы в тесте.
                        // Build a Sentence: «верно/всего»; эссе — балл преподавателя 1–6.
                        groupResponses.forEach(resp => {
                            const scoreStr = resp.score === null || resp.score === undefined ? '' : String(resp.score);
                            if (taskType === 'sentence') {
                                if (scoreStr.includes('/')) {
                                    const [earned, max] = scoreStr.split('/').map(Number);
                                    if (!isNaN(earned) && !isNaN(max)) { totalEarned += earned; totalMax += max; hasScore = true; }
                                }
                            } else if (essayScoreOf(resp) !== null) {
                                totalEarned += essayScoreOf(resp);
                                totalMax += 6;
                                hasScore = true;
                            }
                        });

                        let percent = 0;
                        let displayScore = '';
                        if (hasScore && totalMax > 0) {
                            percent = Math.round((totalEarned / totalMax) * 100);
                            
                            if (taskType === 'sentence') {
                                displayScore = `${totalEarned}/${totalMax}`;
                            } else {
                                // Показываем только сам балл, скрывая .0 для целых чисел
                                displayScore = Number.isInteger(totalEarned) ? totalEarned.toString() : totalEarned.toFixed(1);
                            }
                        }

                        const strokeDash = 2 * Math.PI * 16;
                        const offset = strokeDash - (percent / 100) * strokeDash;

                        progressCircleHTML = `
                            <div class="relative flex items-center justify-center w-11 h-11 shrink-0">
                                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                    <circle cx="18" cy="18" r="16" fill="transparent" stroke="#f1f5f9" stroke-width="3.5"></circle>
                                    <circle cx="18" cy="18" r="16" fill="transparent" stroke="${hasScore ? '#10b981' : '#cbd5e1'}" stroke-width="3.5" 
                                        stroke-dasharray="${strokeDash}" stroke-dashoffset="${hasScore ? offset : 0}" stroke-linecap="round"></circle>
                                </svg>
                                <div class="absolute text-[9px] font-extrabold text-slate-700 tracking-tight">
                                    ${hasScore ? displayScore : '<i data-lucide="check" class="w-4 h-4 text-emerald-500"></i>'}
                                </div>
                            </div>
                        `;

                        actionButton = `
                            <div class="flex gap-2">
                                <a href="writing-practice.html?type=${taskType}&id=${encodeURIComponent(firstTask.id)}" class="flex-1 flex items-center justify-center space-x-2 bg-[#edfdf4] text-emerald-700 hover:bg-[#dcfce7] transition py-3 rounded-2xl font-bold text-sm">
                                    <span>Review Results</span> <i data-lucide="eye" class="w-4 h-4"></i>
                                </a>
                                ${resetButtonHTML(groupId, groupResponses, true)}
                            </div>
                        `;
                    } else if (isPartiallyCompleted) {
                        statusLabelHTML = `<span class="text-[11px] font-bold text-blue-600 flex items-center"><i data-lucide="loader" class="w-3.5 h-3.5 mr-1"></i> In Progress</span>`;
                        
                        // Ищем первый нерешённый вопрос в этом тесте
                        const firstUncompletedTask = groupTasks.find(t => !groupResponses.some(r => String(r.task_id) === String(t.id)));

                        let percent = Math.round((completedCount / totalQuestions) * 100);
                        const strokeDash = 2 * Math.PI * 16;
                        const offset = strokeDash - (percent / 100) * strokeDash;

                        progressCircleHTML = `
                            <div class="relative flex items-center justify-center w-11 h-11 shrink-0" title="${completedCount} of ${totalQuestions} done">
                                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                    <circle cx="18" cy="18" r="16" fill="transparent" stroke="#f1f5f9" stroke-width="3.5"></circle>
                                    <circle cx="18" cy="18" r="16" fill="transparent" stroke="#3b82f6" stroke-width="3.5" 
                                        stroke-dasharray="${strokeDash}" stroke-dashoffset="${offset}" stroke-linecap="round"></circle>
                                </svg>
                                <div class="absolute text-[9px] font-extrabold text-slate-700 tracking-tight">
                                    ${completedCount}/${totalQuestions}
                                </div>
                            </div>
                        `;

                        actionButton = `
                            <div class="flex gap-2">
                                <a href="writing-practice.html?type=${taskType}&id=${encodeURIComponent(firstUncompletedTask.id)}" class="flex-1 flex items-center justify-center space-x-2 bg-blue-50 text-blue-700 hover:bg-blue-100 transition py-3 rounded-2xl font-bold text-sm">
                                    <span>Resume Test</span> <i data-lucide="play" class="w-4 h-4"></i>
                                </a>
                                ${resetButtonHTML(groupId, groupResponses, false)}
                            </div>
                        `;
                    } else {
                        // Номер теста теперь стоит под названием во всех состояниях
                        // (раньше был только здесь и пропадал после начала теста)
                        progressCircleHTML = '';
                        actionButton = `
                            <a href="writing-practice.html?type=${taskType}&id=${encodeURIComponent(firstTask.id)}" class="w-full flex items-center justify-center space-x-2 bg-[#121629] text-white hover:bg-slate-800 transition py-3.5 rounded-2xl font-bold text-sm shadow-sm">
                                <span>Start Test</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </a>
                        `;
                    }

                    // Плашка-этикетка в углу карточки для заданий, реально встречавшихся на настоящем TOEFL
                    const realToeflRibbon = firstTask.is_real_toefl
                        ? `<div class="absolute top-[15px] right-[-38px] w-[150px] rotate-45 bg-violet-600 text-white text-[9px] font-extrabold tracking-[0.15em] text-center py-1 shadow-sm z-10">TOEFL</div>`
                        : '';
                    // Когда есть лента — сдвигаем "Test #X" левее, чтобы она не перекрывалась лентой в углу
                    const headerRightPadding = firstTask.is_real_toefl ? 'pr-12' : '';

                    // Строка под названием: номер теста (всегда), тема, число вопросов
                    const topic = groupTopic(groupTasks);
                    const metaParts = [`<span class="font-bold text-slate-500">${testNumberLabel}</span>`];
                    if (taskType !== 'sentence' && topic !== NO_TOPIC) metaParts.push(tlEsc(topic));
                    if (taskType === 'sentence' || totalQuestions > 1) metaParts.push(`${totalQuestions} Question${totalQuestions > 1 ? 's' : ''}`);
                    if (attemptTrail) metaParts.push(`<span class="font-bold text-slate-600" title="Score of each attempt">${attemptTrail}</span>`);

                    cards.push({ topic, html: `
                        <div class="relative overflow-hidden bg-white p-6 rounded-[1.5rem] border border-gray-100 shadow-sm hover:shadow-md transition-all flex flex-col justify-between min-h-[190px] ${CV.cardClass(isHiddenGroup)}">
                            ${realToeflRibbon}
                            <div>
                                <div class="flex justify-between items-center mb-4 ${headerRightPadding}">
                                    <div class="flex items-center space-x-2">
                                        <span class="px-2.5 py-1 text-[9px] font-extrabold rounded-md tracking-wider uppercase ${isFullyCompleted ? 'text-emerald-700 bg-emerald-50' : 'text-slate-500 bg-slate-100'}">
                                            ${taskType === 'academic' ? 'ACADEMIC' : taskType.toUpperCase()}
                                        </span>
                                        ${statusLabelHTML}
                                    </div>
                                    ${progressCircleHTML}
                                </div>
                                <h2 class="text-base font-extrabold text-slate-900 mb-1 leading-tight line-clamp-1">${cardTitle}</h2>
                                <p class="text-xs text-gray-400 font-medium mb-5">${metaParts.join(' <span class="text-gray-300">·</span> ')}</p>
                            </div>
                            ${CV.withEye(actionButton, 'writing_tasks', groupTasks.map(t => t.id), isHiddenGroup)}
                        </div>
                    ` });
                    groupIndex++;
                });

                allCards = cards;
                if (activeTopic === 'all') activeTopic = readSavedTopic();
                renderTopicFilter();
                renderCards();
            } catch (err) {
                console.error(err);
                allCards = [];
                renderTopicFilter();
                renderCriteriaSummary({});
                container.className = "flex justify-center items-center py-20 w-full col-span-full";
                container.innerHTML = `<div class="text-center text-rose-500 text-sm font-bold">Failed to load tasks. Check your connection and refresh the page.</div>`;
            }
        }

        let resetBusy = false;
        async function resetGroup(groupId) {
            const taskIds = currentTestGroups[groupId];
            if (!taskIds || taskIds.length === 0 || !currentUserId || resetBusy) return;

            // Проверенные преподавателем ответы не удаляются (это правило базы):
            // сбрасываются только непроверенные
            const responses = currentGroupResponses[groupId] || [];
            const graded = responses.filter(isEssayGraded);
            if (responses.length && graded.length === responses.length) { explainLockedReset(); return; }
            const attempts = currentGroupAttempts[groupId] || [];
            const msg = attempts.length > 1
                ? `Delete attempt ${attempts.length} (not reviewed yet) and write it again?\nYour reviewed attempts are kept.`
                : graded.length
                    ? "Answers your teacher has already reviewed will be kept.\nOnly the answers that haven't been reviewed yet will be reset. Continue?"
                    : "Are you sure you want to reset your progress for this entire test?";
            if (!confirm(msg)) return;

            resetBusy = true;
            try {
                document.body.style.cursor = 'wait';
                // .select() обязателен: без него запрет на удаление выглядит как успех
                const { data, error } = await db.from('student_responses')
                    .delete()
                    .in('task_id', taskIds)
                    .eq('user_id', currentUserId)
                    .select('id');
                if (error) throw error;
                if (!data || data.length === 0) {
                    alert('Nothing was reset: the database did not allow deleting these answers. Please tell your teacher.');
                }
                await loadTasksAndProgress();
            } catch (err) {
                alert("Error resetting test: " + (err.message || err));
            } finally {
                resetBusy = false;
                document.body.style.cursor = 'default';
            }
        }
    </script>
</body>
</html>
