<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Task — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-900 min-h-screen antialiased p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex items-center space-x-4 mb-8">
            <a href="writing.html" class="flex items-center justify-center w-10 h-10 rounded-xl border border-gray-200 bg-white text-gray-500 hover:bg-gray-50 hover:text-slate-800 transition shadow-sm">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 capitalize" id="pageTitle">Loading Tasks...</h1>
                <p class="text-sm text-gray-500 font-medium">Select a module to practice</p>
            </div>
        </div>

        <div id="tasksContainer" class="space-y-4">
            <div class="animate-pulse flex space-x-4">
                <div class="flex-1 space-y-4 py-1">
                    <div class="h-24 bg-gray-200 rounded-2xl"></div>
                    <div class="h-24 bg-gray-200 rounded-2xl"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Supabase напрямую для гарантированной загрузки данных
        const SUPABASE_URL = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const taskType = urlParams.get('type') || 'sentence';
        
        const pageTitle = document.getElementById('pageTitle');
        if (pageTitle) {
            pageTitle.innerText = taskType.charAt(0).toUpperCase() + taskType.slice(1) + ' Practice';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            await loadTasksAndProgress();
        });

        async function loadTasksAndProgress() {
            const container = document.getElementById('tasksContainer');
            if (!container) return;

            try {
                // 1. Проверяем авторизацию
                const { data: { session }, error: authError } = await supabase.auth.getSession();
                
                if (authError || !session) {
                    console.warn("User not logged in, redirecting...");
                    window.location.replace('index.html');
                    return;
                }
                const userId = session.user.id;

                // 2. Получаем все задания этого типа
                const { data: tasks, error: tasksError } = await supabase
                    .from('writing_tasks')
                    .select('id, title, progress')
                    .eq('type', taskType)
                    .order('id', { ascending: true });

                if (tasksError) throw tasksError;

                // 3. Получаем ответы этого студента для этих заданий
                const { data: responses, error: respError } = await supabase
                    .from('student_responses')
                    .select('id, task_id, response_content')
                    .eq('user_id', userId)
                    .eq('task_type', taskType);

                if (respError) throw respError;

                // Рендер пустого состояния, если заданий нет
                if (!tasks || tasks.length === 0) {
                    container.className = "flex justify-center items-center py-20 w-full";
                    container.innerHTML = `
                        <div class="text-center">
                            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400">
                                <i data-lucide="file-x" class="w-8 h-8"></i>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800 mb-1">No tasks found</h3>
                            <p class="text-sm text-gray-500">There are no ${taskType} tasks available yet.</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                // 4. Переключаем контейнер в режим сетки и рендерим карточки
                container.className = "grid grid-cols-1 md:grid-cols-2 gap-5";
                container.innerHTML = '';

                tasks.forEach(task => {
                    const studentResponse = responses.find(r => String(r.task_id) === String(task.id));
                    const isCompleted = !!studentResponse;
                    let cardContent = '';

                    if (isCompleted) {
                        cardContent = `
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <span class="text-[10px] font-bold text-emerald-700 tracking-wider uppercase bg-emerald-50 px-2 py-1 rounded-md">${taskType}</span>
                                    <div class="flex items-center space-x-2 mt-4">
                                        <i data-lucide="check" class="w-4 h-4 text-emerald-500"></i>
                                        <span class="text-sm font-bold text-emerald-600">Completed</span>
                                        <button onclick="resetTask('${studentResponse.id}')" class="text-gray-400 hover:text-slate-800 transition ml-2 flex items-center justify-center w-6 h-6 rounded-full hover:bg-gray-100" title="Reset Task">
                                            <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="w-10 h-10 rounded-full border-4 border-emerald-500 border-l-emerald-100 flex items-center justify-center shrink-0">
                                    <span class="text-[10px] font-bold text-slate-700">100%</span>
                                </div>
                            </div>
                            
                            <h2 class="text-lg font-bold text-slate-900 mb-1">${task.title}</h2>
                            <p class="text-xs text-gray-500 font-medium mb-6">${task.progress || '1 Task • Writing'}</p>
                            
                            <button onclick="togglePreview('${task.id}')" class="w-full flex items-center justify-center space-x-2 bg-[#f0fdf4] text-emerald-700 hover:bg-[#dcfce7] transition py-3 rounded-xl font-bold text-sm">
                                <span>Review Results</span>
                                <i data-lucide="eye" class="w-4 h-4"></i>
                            </button>

                            <div class="mt-4 p-4 bg-gray-50 rounded-xl border border-gray-100 text-sm text-slate-700 hidden" id="preview-${task.id}">
                                <span class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Your Answer:</span>
                                ${studentResponse.response_content}
                            </div>
                        `;
                    } else {
                        cardContent = `
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <span class="text-[10px] font-bold text-slate-500 tracking-wider uppercase bg-gray-100 px-2 py-1 rounded-md">${taskType}</span>
                                </div>
                            </div>
                            
                            <h2 class="text-lg font-bold text-slate-900 mb-1 mt-9">${task.title}</h2>
                            <p class="text-xs text-gray-500 font-medium mb-6">${task.progress || '1 Task • Writing'}</p>
                            
                            <a href="writing-practice.html?type=${taskType}&id=${task.id}" class="w-full flex items-center justify-center space-x-2 bg-slate-900 text-white hover:bg-slate-800 transition py-3 rounded-xl font-bold text-sm shadow-sm">
                                <span>Start Task</span>
                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </a>
                        `;
                    }

                    container.innerHTML += `
                        <div class="bg-white p-6 rounded-[1.5rem] border border-gray-100 shadow-sm hover:shadow-md transition-shadow relative flex flex-col justify-between">
                            ${cardContent}
                        </div>
                    `;
                });

                lucide.createIcons();

            } catch (err) {
                console.error("Critical error loading tasks:", err);
                container.className = "w-full";
                container.innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl relative" role="alert">
                        <strong class="font-bold">Error loading tasks!</strong>
                        <span class="block sm:inline"> ${err.message}</span>
                        <p class="text-xs mt-2 opacity-70">Check DevTools Console (F12) for more details.</p>
                    </div>
                `;
            }
        }

        function togglePreview(taskId) {
            const previewDiv = document.getElementById(`preview-${taskId}`);
            if (previewDiv) previewDiv.classList.toggle('hidden');
        }

        async function resetTask(responseId) {
            if (!confirm("Are you sure you want to reset your progress? This will delete your current answer.")) return;

            try {
                const { error } = await supabase
                    .from('student_responses')
                    .delete()
                    .eq('id', responseId);

                if (error) throw error;
                
                await loadTasksAndProgress();
            } catch (err) {
                alert("Error resetting task: " + err.message);
            }
        }
    </script>
</body>
</html>
