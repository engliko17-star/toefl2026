<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Task — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-900 min-h-screen antialiased p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex items-center space-x-4 mb-8">
            <a href="writing.html" class="flex items-center justify-center w-10 h-10 rounded-xl border border-gray-200 bg-white text-gray-500 hover:bg-gray-50 hover:text-slate-800 transition shadow-sm">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 capitalize" id="pageTitle">Loading Tasks...</h1>
                <p class="text-sm text-gray-500 font-medium">Select a module to practice</p>
            </div>
        </div>

        <div id="tasksContainer" class="space-y-4">
            <div class="animate-pulse flex space-x-4">
                <div class="flex-1 space-y-4 py-1">
                    <div class="h-24 bg-gray-200 rounded-2xl"></div>
                    <div class="h-24 bg-gray-200 rounded-2xl"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализируем клиент под уникальным именем 'db'. 
        // SUPABASE_URL и SUPABASE_ANON_KEY автоматически берутся из подключенного выше auth.js
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const urlParams = new URLSearchParams(window.location.search);
        const taskType = urlParams.get('type') || 'sentence';
        
        const pageTitle = document.getElementById('pageTitle');
        if (pageTitle) {
            pageTitle.innerText = taskType.charAt(0).toUpperCase() + taskType.slice(1) + ' Practice';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            setTimeout(async () => {
                await loadTasksAndProgress();
            }, 100);
        });

        async function loadTasksAndProgress() {
            const container = document.getElementById('tasksContainer');
            if (!container) return;

            try {
                // 1. Проверяем авторизацию через наш клиент db
                const { data: { session }, error: authError } = await db.auth.getSession();
                
                if (authError || !session) {
                    console.warn("User not logged in, redirecting...");
                    window.location.replace('index.html');
                    return;
                }
                const userId = session.user.id;

                // 2. Получаем все задания этого типа
                const { data: tasks, error: tasksError } = await db
                    .from('writing_tasks')
                    .select('id, title, progress')
                    .eq('type', taskType)
                    .order('id', { ascending: true });

                if (tasksError) throw tasksError;

                // 3. Получаем ответы этого студента
                const { data: responses, error: respError } = await db
                    .from('student_responses')
                    .select('id, task_id, response_content')
                    .eq('user_id', userId)
                    .eq('task_type', taskType);

                if (respError) throw respError;

                if (!tasks || tasks.length === 0) {
                    container.className = "flex justify-center items-center py-20 w-full";
                    container.innerHTML = `<div class="text-center text-gray-500 font-medium">No tasks available yet.</div>`;
                    return;
                }

                container.className = "grid grid-cols-1 md:grid-cols-2 gap-5";
                container.innerHTML = '';

                tasks.forEach(task => {
                    const studentResponse = responses.find(r => String(r.task_id) === String(task.id));
                    const isCompleted = !!studentResponse;

                    container.innerHTML += `
                        <div class="bg-white p-6 rounded-[1.5rem] border border-gray-100 shadow-sm hover:shadow-md transition-shadow relative flex flex-col justify-between">
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-[10px] font-bold ${isCompleted ? 'text-emerald-700 bg-emerald-50' : 'text-slate-500 bg-gray-100'} tracking-wider uppercase px-2 py-1 rounded-md">
                                    ${isCompleted ? 'Completed' : taskType}
                                </span>
                                ${isCompleted ? '<div class="w-10 h-10 rounded-full border-4 border-emerald-500 border-l-emerald-100 flex items-center justify-center shrink-0 text-[10px] font-bold">100%</div>' : ''}
                            </div>
                            
                            <h2 class="text-lg font-bold text-slate-900 mb-1 ${!isCompleted ? 'mt-9' : ''}">${task.title}</h2>
                            <p class="text-xs text-gray-500 font-medium mb-6">${task.progress || '1 Task • Writing'}</p>
                            
                            ${isCompleted ? `
                                <button onclick="togglePreview('${task.id}')" class="w-full flex items-center justify-center space-x-2 bg-[#f0fdf4] text-emerald-700 hover:bg-[#dcfce7] transition py-3 rounded-xl font-bold text-sm">
                                    <span>Review Results</span> <i data-lucide="eye" class="w-4 h-4"></i>
                                </button>
                                <div class="mt-4 p-4 bg-gray-50 rounded-xl border border-gray-100 text-sm text-slate-700 hidden" id="preview-${task.id}">
                                    <span class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Your Answer:</span>
                                    ${studentResponse.response_content}
                                </div>
                                <button onclick="resetTask('${studentResponse.id}')" class="mt-3 w-full text-center text-[10px] font-bold text-gray-400 hover:text-rose-500 uppercase transition">Reset Progress</button>
                            ` : `
                                <a href="writing-practice.html?type=${taskType}&id=${task.id}" class="w-full flex items-center justify-center space-x-2 bg-slate-900 text-white hover:bg-slate-800 transition py-3 rounded-xl font-bold text-sm shadow-sm">
                                    <span>Start Task</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                </a>
                            `}
                        </div>
                    `;
                });
                lucide.createIcons();
            } catch (err) {
                console.error("Error:", err);
                container.innerHTML = `
                    <div class="col-span-full bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl">
                        <strong>Error:</strong> ${err.message}
                    </div>
                `;
            }
        }

        function togglePreview(taskId) {
            document.getElementById(`preview-${taskId}`).classList.toggle('hidden');
        }

        async function resetTask(responseId) {
            if (!confirm("Are you sure you want to reset this task? Your answer will be deleted.")) return;
            
            // Используем наш клиент db для удаления
            const { error } = await db.from('student_responses').delete().eq('id', responseId);
            
            if (error) {
                alert("Error resetting task: " + error.message);
            } else {
                // Снова вызываем загрузку, чтобы обновить интерфейс
                document.getElementById('tasksContainer').innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">Refreshing...</div>';
                await loadTasksAndProgress();
            }
        }
    </script>
</body>
</html>
