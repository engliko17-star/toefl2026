<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Mock Tests — TOEFL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</head>
<body class="bg-[#f8f9fa] text-slate-800 font-sans">
    
    <div class="flex min-h-screen">
        <main class="flex-1 p-8">
            <header class="mb-10">
                <h1 class="text-2xl font-bold text-slate-900">Mini Mock Tests</h1>
                <p class="text-slate-500 text-sm">Select a test to simulate the real exam experience.</p>
            </header>

            <div id="testGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </main>
    </div>

    <script>
        const db = window.supabase.createClient('URL', 'KEY'); // Вставь свои данные
        
        // Функция расчета баллов
        function calculateBandScore(correct, total) {
            if (total === 0) return "1.0";
            const score = 1.0 + ((correct / total) * 5.0);
            return (Math.round(score * 2) / 2).toFixed(1);
        }

        async function loadTests() {
            const { data: tests } = await db.from('mock_tests').select('*');
            const grid = document.getElementById('testGrid');
            
            tests.forEach(test => {
                const score = test.completed ? calculateBandScore(test.correct, test.total) : null;
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm flex flex-col">
                        ${test.completed ? '<div class="self-end bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-1 rounded-md uppercase">Completed</div>' : ''}
                        <div class="w-12 h-12 rounded-xl bg-indigo-500 text-white flex items-center justify-center font-black mb-5">#${test.id}</div>
                        <h3 class="text-lg font-bold mb-2">${test.title}</h3>
                        <div class="text-xs text-slate-500 mb-8">${test.passages} Passages • ${test.minutes} mins</div>
                        
                        <div class="mt-auto pt-4 border-t border-gray-50 flex items-end justify-between">
                            ${score ? `<div><span class="text-[10px] text-slate-400 uppercase">Band Score</span><div class="text-emerald-500 font-black text-xl">${score} <span class="text-slate-300 text-sm">/ 6.0</span></div></div>` : '<span class="text-xs text-slate-400">Not started</span>'}
                            <a href="take-mock-test.html?id=${test.id}" class="text-xs font-bold ${test.completed ? 'text-indigo-600 bg-indigo-50' : 'text-white bg-indigo-600'} px-5 py-2.5 rounded-lg">
                                ${test.completed ? 'Review' : 'Start Test'}
                            </a>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }
        loadTests();
    </script>
</body>
</html>
