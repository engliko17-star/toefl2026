        <nav class="flex-1 flex flex-col justify-between">

                <a href="index.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span class="text-sm font-medium">Dashboard</span>
                </a>
                <a href="vocabulary.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">

                </a>
                
                <div class="pt-6 pb-2 px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider">Practice</div>
                <a href="reading.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                    <i data-lucide="book-text" class="w-5 h-5"></i>

                </a>
                <a href="listening.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                    <i data-lucide="headphones" class="w-5 h-5"></i>
                    <span class="text-sm font-medium">Listening</span>
                </a>
                <a href="writing.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                    <i data-lucide="pen-tool" class="w-5 h-5"></i>
                    <span class="text-sm font-medium">Writing</span>
                </a>
                <a href="speaking.html" class="flex items-center space-x-3 p-3 rounded-xl text-gray-400 hover:bg-gray-50 hover:text-slate-700 transition">
                    <i data-lucide="mic" class="w-5 h-5"></i>
                    <span class="text-sm font-medium">Speaking</span>

                <a href="mini-mock-test.html" class="flex items-center space-x-3 p-3 rounded-xl bg-slate-900 text-white font-medium shadow-sm">
                    <i data-lucide="file-check" class="w-5 h-5"></i>
                    <span class="text-sm">Mock Tests</span>

            </div>

            <button onclick="logoutUser()" class="flex items-center space-x-3 p-3 rounded-xl text-rose-500 hover:bg-rose-50/50 transition cursor-pointer mt-auto border border-dashed border-transparent hover:border-rose-100">
                <i data-lucide="log-out" class="w-5 h-5"></i>
                <span class="text-sm font-medium">Log Out</span>
            </button>
        </nav>
    </aside>

    <main class="flex-1 p-6 overflow-y-auto bg-[#f8f9fa] pb-24 md:pb-6 max-w-7xl mx-auto w-full">
        <header class="mb-8 md:mb-10">
            <h1 class="text-2xl font-bold text-slate-900">Mini Mock Tests</h1>
            <p class="text-slate-500 text-sm mt-1">Select a test to simulate the real exam experience.</p>
        </header>

        <div id="testGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 py-2 z-50">
        <div class="flex justify-start gap-6 px-4 overflow-x-auto mobile-nav-scroll pb-1">
            <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-slate-900 transition min-w-10">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1 font-medium">Home</span>
            </a>
            <a href="vocabulary.html" class="flex flex-col items-center text-gray-400 hover:text-slate-900 transition min-w-10">
                <i data-lucide="book-open" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1 font-medium">Vocab</span>
            </a>
            <a href="reading.html" class="flex flex-col items-center text-gray-400 hover:text-slate-900 transition min-w-10">
                <i data-lucide="book-text" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1 font-medium">Reading</span>
            </a>
            <a href="listening.html" class="flex flex-col items-center text-gray-400 hover:text-slate-900 transition min-w-10">
                <i data-lucide="headphones" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1 font-medium">Listen</span>
            </a>
            <a href="writing.html" class="flex flex-col items-center text-gray-400 hover:text-slate-900 transition min-w-10">
                <i data-lucide="pen-tool" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1 font-medium">Writing</span>
            </a>
            <a href="speaking.html" class="flex flex-col items-center text-gray-400 hover:text-slate-900 transition min-w-10">
                <i data-lucide="mic" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1 font-medium">Speak</span>
            </a>
            
            <a href="mini-mock-test.html" class="flex flex-col items-center text-slate-900 min-w-10">
                <i data-lucide="file-check" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1 font-bold">Tests</span>
            </a>
            
            <button onclick="logoutUser()" class="flex flex-col items-center text-rose-400 hover:text-rose-600 transition min-w-10 cursor-pointer">
                <i data-lucide="log-out" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1 font-bold">Exit</span>
            </button>
        </div>
    </nav>

    <script>
        function getAnimalInitial(title) {
            if (!title) return 'T';
            const parts = title.toUpperCase().trim().split(' ');
            if (parts.length > 1) return parts[1].charAt(0);
            return parts[0].charAt(0);
        }

        async function loadTests() {
            try {
                const user = await requireAuth();
                if (!user) return; 

                const { data: tests, error: testsError } = await _supabase
                    .from('mock_tests')
                    .select('*')
                    .order('created_at', { ascending: true }); 
                
                if (testsError) throw testsError;

                const { data: results, error: resultsError } = await _supabase
                    .from('mock_test_results')
                    .select('*')
                    .eq('user_id', user.id);

                if (resultsError) throw resultsError;

                const resultsMap = {};
                if (results) {
                    results.forEach(res => {
                        if (!resultsMap[res.test_id] || new Date(res.created_at) > new Date(resultsMap[res.test_id].created_at)) {
                            resultsMap[res.test_id] = res;
                        }
                    });
                }

                const grid = document.getElementById('testGrid');
                if (!tests || tests.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-10 bg-white rounded-2xl border border-gray-100 shadow-sm">Tests have not been added yet.</div>';
                    return;
                }

                grid.innerHTML = '';
                tests.forEach(test => {
                    const result = resultsMap[test.id];
                    const isCompleted = !!result; 
                    const bandScore = isCompleted ? parseFloat(result.band_score).toFixed(1) : null;
                    const initial = getAnimalInitial(test.title);
                    
                    grid.innerHTML += `
                        <div class="relative bg-white rounded-2xl p-6 border border-gray-100 shadow-sm flex flex-col transition hover:shadow-md">
                            ${isCompleted ? '<div class="absolute top-5 right-5 bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wider">Completed</div>' : ''}
                            <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-black text-2xl mb-5 shadow-sm border border-indigo-100">
                                ${initial}
                            </div>
                            <h3 class="text-lg font-bold text-slate-900 mb-2">${test.title || 'Practice Test'}</h3>
                            <div class="flex items-center text-xs text-slate-500 font-medium space-x-4 mb-8">
                                <span class="flex items-center"><i data-lucide="paw-print" class="w-4 h-4 mr-1.5 opacity-70"></i> ${test.passages || 3} Passages</span>
                                <span class="flex items-center"><i data-lucide="clock" class="w-4 h-4 mr-1.5 opacity-70"></i> ${test.minutes || 36} mins</span>
                            </div>
                            <div class="mt-auto flex items-end justify-between pt-4 border-t border-gray-50">
                                ${isCompleted 
                                    ? `<div><span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-0.5">Band Score</span><div class="text-emerald-500 font-black text-xl tracking-tight">${bandScore} <span class="text-slate-300 text-sm font-semibold">/ 6.0</span></div></div>` 
                                    : '<span class="text-xs font-medium text-slate-400">Not started</span>'}
                                <a href="take-mock-test.html?id=${test.id}${isCompleted ? '&mode=review' : ''}" class="text-xs font-bold ${isCompleted ? 'text-indigo-600 bg-indigo-50 hover:bg-indigo-100' : 'text-white bg-slate-900 hover:bg-indigo-600'} px-5 py-2.5 rounded-lg transition flex items-center shadow-xs cursor-pointer">
                                    ${isCompleted ? 'Review Answers' : 'Start Test'} <i data-lucide="${isCompleted ? 'arrow-right' : 'play'}" class="w-3.5 h-3.5 ml-1.5 ${!isCompleted ? 'fill-current' : ''}"></i>
                                </a>
                            </div>
                        </div>
                    `;
                });
                lucide.createIcons();
            } catch (err) {
                console.error("Ошибка при загрузке тестов:", err);
            }
        }
        document.addEventListener('DOMContentLoaded', loadTests);
    </script>
</body>
</html>
