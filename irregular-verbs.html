<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three Verb Forms - TOEFL.ai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Жесткая и стабильная сетка для табличной структуры */
    .table-layout {
      display: grid;
      grid-template-columns: minmax(160px, 1.5fr) 1fr 1fr 1fr;
      min-width: 700px; /* Предотвращает сжатие на мобильных экранах */
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased overflow-y-scroll">

  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    
    <div class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-6">
      <div>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-100/50 text-indigo-700 text-[11px] font-bold tracking-wide uppercase mb-4 border border-indigo-100">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
          Grammar Reference
        </div>
        
        <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-2">Three Verb Forms</h1>
        <p class="text-sm text-slate-500">Listen and memorize the most common irregular verbs.</p>
      </div>

      <div class="w-full md:w-80 relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
          <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <input 
          type="text" 
          id="verbSearch" 
          placeholder="Search verb or translation..." 
          class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl shadow-sm focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all text-sm font-medium placeholder-slate-400"
        >
      </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-x-auto">
      <div class="min-w-full">
        
        <div class="table-layout bg-slate-50 border-b border-slate-200 text-[10px] font-bold uppercase tracking-widest text-slate-500">
          <div class="px-6 py-4 border-r border-slate-200">Infinitive (V1)</div>
          <div class="px-6 py-4 border-r border-slate-200">Past Simple (V2)</div>
          <div class="px-6 py-4 border-r border-slate-200">Past Participle (V3)</div>
          <div class="px-6 py-4 text-right">Translation</div>
        </div>

        <div id="verbsContainer" class="divide-y divide-slate-100">
          </div>

      </div>
    </div>
    
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // Инициализация клиента Supabase
    // Замени эти значения на фактические параметры из Settings -> API твоего проекта
    const supabaseUrl = 'https://gmsdixqjhlycovsgwbzq.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdtc2RpeHFqaGx5Y292c2d3YnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTEwODIsImV4cCI6MjA5NTAyNzA4Mn0.gPEOviqSGTuczqoSHvb_BX4mBSdxjh8Bg6BV13l58LQ';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    // Глобальное хранилище данных для поиска
    let irregularVerbs = [];

    // Функция последовательной озвучки всех трех форм с паузами
    function playAudio(v1, v2, v3) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Остановка текущей речи
        
        // Корректная замена слэша на союз "or" для естественного звучания (was/were -> was or were)
        const cleanV2 = v2.replace('/', ' or ');
        
        // Точки обеспечивают паузы между произнесением форм
        const textToRead = `${v1}. ${cleanV2}. ${v3}.`;
        
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'en-US';
        utterance.rate = 0.85; // Оптимальный темп для восприятия речи на слух
        window.speechSynthesis.speak(utterance);
      }
    }

    // Отрисовка строк таблицы
    function render(data) {
      const container = document.getElementById('verbsContainer');
      container.innerHTML = '';
      
      if (data.length === 0) {
        container.innerHTML = `<div class="p-10 text-center text-slate-400 text-sm font-medium">No verbs found matching your search.</div>`;
        return;
      }
      
      data.forEach(verb => {
        const row = document.createElement('div');
        row.className = 'table-layout bg-white hover:bg-indigo-50/30 transition-colors duration-200 group';
        row.innerHTML = `
          <div class="px-6 py-4 border-r border-slate-100 flex items-center gap-3">
            <button 
              onclick="playAudio('${verb.v1}', '${verb.v2}', '${verb.v3}')" 
              class="text-slate-300 group-hover:text-indigo-500 transition-colors focus:outline-none"
              title="Listen to all forms"
            >
              <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M13.5 4.06c0-1.336-1.546-2.076-2.58-1.235L6.152 6.75H4.5A2.25 2.25 0 002.25 9v6a2.25 2.25 0 002.25 2.25h1.652l4.768 3.925c1.034.84 2.58.1 2.58-1.235V4.06zM17.55 7.643a.75.75 0 011.06-.051 7.498 7.498 0 010 8.816.75.75 0 11-1.164-1.014 5.999 5.999 0 000-6.79.75.75 0 01.104-1.061zM20.203 4.99a.75.75 0 011.06-.05 11.248 11.248 0 010 14.12.75.75 0 11-1.164-1.015 9.748 9.748 0 000-12.09.75.75 0 01.104-1.06z" />
              </svg>
            </button>
            <span class="font-bold text-slate-900">${verb.v1}</span>
          </div>

          <div class="px-6 py-4 border-r border-slate-100 flex items-center text-slate-600 font-medium group-hover:text-slate-900 transition-colors">
            ${verb.v2}
          </div>

          <div class="px-6 py-4 border-r border-slate-100 flex items-center text-slate-600 font-medium group-hover:text-slate-900 transition-colors">
            ${verb.v3}
          </div>

          <div class="px-6 py-4 flex items-center justify-end text-sm text-slate-400 group-hover:text-slate-600 transition-colors">
            ${verb.tr}
          </div>
        `;
        container.appendChild(row);
      });
    }

    // Асинхронное получение данных из Supabase
    async function loadVerbs() {
      const container = document.getElementById('verbsContainer');
      container.innerHTML = `<div class="p-10 text-center text-slate-400 text-sm animate-pulse">Loading verbs from database...</div>`;

      try {
        const { data, error } = await supabase
          .from('irregular_verbs')
          .select('*')
          .order('v1', { ascending: true }); // Алфавитная сортировка по V1

        if (error) throw error;

        irregularVerbs = data;
        render(irregularVerbs);
      } catch (error) {
        console.error('Error fetching data:', error);
        container.innerHTML = `<div class="p-10 text-center text-red-400 text-sm font-medium">Failed to load data from Supabase. Check console.</div>`;
      }
    }

    // Реализация живого поиска по всем колонкам
    document.getElementById('verbSearch').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = irregularVerbs.filter(v => 
        v.v1.toLowerCase().includes(q) || 
        v.v2.toLowerCase().includes(q) || 
        v.v3.toLowerCase().includes(q) || 
        v.tr.toLowerCase().includes(q)
      );
      render(filtered);
    });

    // Инициализация загрузки при старте страницы
    loadVerbs();
  </script>
</body>
</html>
