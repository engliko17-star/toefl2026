<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three Verb Forms - TOEFL Prep</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    /* 16px — иначе iPhone увеличивает страницу при вводе в поиск */
    #verbSearch { font-size: 16px; }
    
    /* Скрываем скроллбар для мобильного меню */
    .mobile-nav-scroll::-webkit-scrollbar { display: none; }
    .mobile-nav-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* Сетка для таблицы глаголов */
    .table-layout {
      display: grid;
      grid-template-columns: 80px minmax(160px, 1.5fr) 1fr 1fr 1fr;
      min-width: 750px;
    }
  </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row invisible" id="pageBody">

    <div id="app-sidebar"></div>
    <script src="nav.js"></script>

  <main class="flex-1 p-6 overflow-y-auto bg-[#f8f9fa] pb-24 md:pb-6">
    <div class="max-w-5xl mx-auto">
      
      <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div>
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-100/50 text-indigo-700 text-[11px] font-bold tracking-wide uppercase mb-4 border border-indigo-100">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
            Grammar Reference
          </div>
          <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-2">Three Verb Forms</h1>
          <p class="text-sm text-slate-500">Bookmark verbs to create your personal study list.</p>
        </div>

        <div class="w-full md:w-auto flex flex-col sm:flex-row gap-3">
          <div class="relative w-full sm:w-72">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
            </div>
            <input 
              type="text" 
              id="verbSearch" 
              placeholder="Search verb..." 
              class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl shadow-sm focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all text-sm font-medium placeholder-slate-400"
            >
          </div>
          <button 
            onclick="startPractice()" 
            class="flex items-center justify-center gap-2 px-6 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-bold hover:bg-indigo-700 transition shadow-sm whitespace-nowrap cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Practice Saved
          </button>
        </div>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-x-auto">
        <div class="min-w-full">
          <div class="table-layout bg-slate-50 border-b border-slate-200 text-[10px] font-bold uppercase tracking-widest text-slate-500 rounded-t-2xl">
            <div class="px-6 py-4 border-r border-slate-200 text-center">SAVE</div>
            <div class="px-6 py-4 border-r border-slate-200">Infinitive (V1)</div>
            <div class="px-6 py-4 border-r border-slate-200">Past Simple (V2)</div>
            <div class="px-6 py-4 border-r border-slate-200">Past Participle (V3)</div>
            <div class="px-6 py-4 text-right">Translation</div>
          </div>
          <div id="verbsContainer" class="divide-y divide-slate-100">
            </div>
        </div>
      </div>
      
    </div>
  </main>

  
  <script>
    // --- НАВИГАЦИОННЫЕ СКРИПТЫ ---
    function toggleVocabMenu() {
        const submenu = document.getElementById('vocab-submenu');
        const arrow = document.getElementById('vocab-arrow');
        if (!submenu || !arrow) return;
        submenu.classList.toggle('hidden');
        arrow.classList.toggle('rotate-180');
    }

    function toggleMobileVocab() {
        const mobileMenu = document.getElementById('mobile-vocab-menu');
        if (mobileMenu) mobileMenu.classList.toggle('hidden');
    }

    // Закрытие мобильного меню при клике в любое другое место
    window.onclick = function(e) {
        const mobileMenu = document.getElementById('mobile-vocab-menu');
        const vocabButton = e.target.closest('button[onclick="toggleMobileVocab()"]');
        if (mobileMenu && !mobileMenu.classList.contains('hidden') && !vocabButton) {
            mobileMenu.classList.add('hidden');
        }
    }
    // ----------------------------

    function ivEsc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    // Иконки: если библиотека не загрузилась, страница всё равно работает
    function ivIcons() { try { if (window.lucide) lucide.createIcons(); } catch (e) {} }

    document.addEventListener('DOMContentLoaded', async () => {
      ivIcons();

      const container = document.getElementById('verbsContainer');
      const body = document.getElementById('pageBody');

      // Общий клиент и проверка доступа из auth.js: раньше страница проверяла
      // только «есть ли вход», поэтому её открывали и гость, и ученица,
      // которую ещё не подтвердил преподаватель.
      const supabase = window.supabaseClient;
      if (!supabase || typeof requireAuth !== 'function') {
        body.classList.remove('invisible');
        container.innerHTML = `<div class="p-10 text-center text-red-500 font-bold">Ошибка сети. Обновите страницу.</div>`;
        return;
      }
      const currentUser = await requireAuth();
      body.classList.remove('invisible');
      if (!currentUser) return;   // auth.js уже показал нужный экран или увёл на вход

      let irregularVerbs = [];
      let savedVerbs = new Set();
      const busy = new Set();     // глаголы, по которым запрос ещё идёт

      // Озвучка
      window.playAudio = function(v1, v2, v3) {
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const or = s => String(s || '').replace(/\s*[\/,;]\s*/g, ' or ');
          const utterance = new SpeechSynthesisUtterance(`${v1 || ''}. ${or(v2)}. ${or(v3)}.`);
          utterance.lang = 'en-US';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        } catch (e) {}
      };

      // Добавление/удаление из закладок. Сначала меняем значок, потом ждём базу;
      // не получилось — возвращаем как было и говорим об этом.
      async function toggleBookmark(v1) {
        if (busy.has(v1)) return;          // двойное касание — второй запрос не шлём
        busy.add(v1);
        const wasSaved = savedVerbs.has(v1);
        if (wasSaved) savedVerbs.delete(v1); else savedVerbs.add(v1);
        render();
        let err = null;
        try {
          const q = wasSaved
            ? supabase.from('user_saved_verbs').delete().eq('user_id', currentUser.id).eq('v1', v1).select('v1')
            : supabase.from('user_saved_verbs').insert([{ user_id: currentUser.id, v1: v1 }]).select('v1');
          const { data, error } = await q;
          if (error && !(error.code === '23505' && !wasSaved)) err = error.message || error.code;   // 23505 — закладка уже есть
          else if (!error && (!data || !data.length) && wasSaved) err = 'база не удалила закладку';
        } catch (e) { err = e.message || 'нет связи'; }
        busy.delete(v1);
        if (err) {
          if (wasSaved) savedVerbs.add(v1); else savedVerbs.delete(v1);
          render();
          alert('Не удалось ' + (wasSaved ? 'убрать' : 'сохранить') + ' закладку: ' + err + '\nПроверьте интернет и попробуйте ещё раз.');
        }
      }

      // Переход к практике
      window.startPractice = function() {
        if (savedVerbs.size === 0) {
            alert("Сначала добавьте глаголы в закладки (нажав на иконку флажка)!");
            return;
        }
        window.location.href = 'verbs-review.html';
      };

      // Один и тот же поиск и при вводе, и после нажатия на закладку.
      // Раньше после закладки работал другой фильтр: он падал на глаголе без
      // перевода — и закладка молча не сохранялась.
      function filtered() {
        const q = document.getElementById('verbSearch').value.toLowerCase().trim();
        if (!q) return irregularVerbs;
        return irregularVerbs.filter(v => ['v1', 'v2', 'v3', 'tr'].some(f => String(v[f] || '').toLowerCase().includes(q)));
      }

      function render() {
        const dataToRender = filtered();
        if (dataToRender.length === 0) {
          container.innerHTML = `<div class="p-10 text-center text-slate-400 text-sm font-medium">Ничего не найдено.</div>`;
          return;
        }
        container.innerHTML = dataToRender.map((verb, i) => {
          const isSaved = savedVerbs.has(verb.v1);
          const bookmarkIcon = isSaved
            ? `<svg class="w-5 h-5 text-indigo-600 fill-indigo-600 drop-shadow-sm transition-transform hover:scale-110" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>`
            : `<svg class="w-5 h-5 text-slate-300 hover:text-indigo-400 transition-all hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>`;
          return `<div class="table-layout bg-white hover:bg-indigo-50/30 transition-colors duration-200 group items-center">
            <div class="px-6 py-4 border-r border-slate-100 flex justify-center">
              <button data-act="bookmark" data-v1="${ivEsc(verb.v1)}" class="focus:outline-none cursor-pointer ${busy.has(verb.v1) ? 'opacity-50' : ''}" title="${isSaved ? 'Remove from saved' : 'Save for practice'}" aria-pressed="${isSaved}">
                ${bookmarkIcon}
              </button>
            </div>
            <div class="px-6 py-4 border-r border-slate-100 flex items-center gap-3">
              <button data-act="say" data-i="${i}" class="text-slate-300 group-hover:text-indigo-500 transition-colors focus:outline-none cursor-pointer" title="Listen">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.546-2.076-2.58-1.235L6.152 6.75H4.5A2.25 2.25 0 002.25 9v6a2.25 2.25 0 002.25 2.25h1.652l4.768 3.925c1.034.84 2.58.1 2.58-1.235V4.06zM17.55 7.643a.75.75 0 011.06-.051 7.498 7.498 0 010 8.816.75.75 0 11-1.164-1.014 5.999 5.999 0 000-6.79.75.75 0 01.104-1.061zM20.203 4.99a.75.75 0 011.06-.05 11.248 11.248 0 010 14.12.75.75 0 11-1.164-1.015 9.748 9.748 0 000-12.09.75.75 0 01.104-1.06z" /></svg>
              </button>
              <span class="font-bold text-slate-900">${ivEsc(verb.v1)}</span>
            </div>
            <div class="px-6 py-4 border-r border-slate-100 text-slate-600 font-medium group-hover:text-slate-900 transition-colors">${ivEsc(verb.v2)}</div>
            <div class="px-6 py-4 border-r border-slate-100 text-slate-600 font-medium group-hover:text-slate-900 transition-colors">${ivEsc(verb.v3)}</div>
            <div class="px-6 py-4 text-right text-sm text-slate-400 group-hover:text-slate-600 transition-colors">${ivEsc(verb.tr)}</div>
          </div>`;
        }).join('');
      }

      // Кнопки строк — через data-атрибуты, а не onclick="...'глагол'..." в тексте
      container.addEventListener('click', e => {
        const b = e.target.closest('[data-act]');
        if (!b) return;
        if (b.dataset.act === 'bookmark') toggleBookmark(b.dataset.v1);
        else if (b.dataset.act === 'say') { const v = filtered()[Number(b.dataset.i)]; if (v) playAudio(v.v1, v.v2, v.v3); }
      });

      // Загрузка данных
      async function loadVerbs() {
        container.innerHTML = `<div class="p-10 text-center text-slate-400 text-sm animate-pulse">Loading secure database...</div>`;
        try {
          const [{ data: verbsData, error: verbsError }, { data: savedData, error: savedError }] = await Promise.all([
            supabase.from('irregular_verbs').select('*').order('v1', { ascending: true }),
            supabase.from('user_saved_verbs').select('v1').eq('user_id', currentUser.id)
          ]);
          if (verbsError) throw verbsError;
          if (savedError) throw savedError;

          irregularVerbs = (verbsData || []).filter(v => v.v1 && String(v.v1).trim());
          savedVerbs = new Set((savedData || []).map(row => row.v1));
          render();
        } catch (error) {
          container.innerHTML = `<div class="p-10 text-center text-red-500 text-sm font-medium">Не удалось загрузить глаголы: ${ivEsc(error.message || error)}<br><button onclick="location.reload()" class="mt-4 px-5 py-2 bg-slate-900 text-white rounded-xl text-sm font-bold">Обновить</button></div>`;
        }
      }

      // Живой поиск
      document.getElementById('verbSearch').addEventListener('input', render);

      loadVerbs();
    });
  </script>
</body>
</html>
