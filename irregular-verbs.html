<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three Verb Forms</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Фиксированная сетка для стабильности верстки */
    .verb-table-grid {
      display: grid;
      grid-template-columns: 200px 1fr 1fr 1fr;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f9f9f9;
    }
  </style>
</head>
<body class="bg-white text-black font-sans antialiased">

  <div class="max-w-5xl mx-auto px-8 py-12">
    
    <h1 class="text-3xl font-bold mb-1">Three Verb Forms</h1>
    <p class="text-sm text-slate-400 mb-10">100 Most Common Irregular Verbs</p>

    <div class="mb-8">
      <input 
        type="text" 
        id="verbSearch" 
        placeholder="Search verb or translation..." 
        class="w-full max-w-sm border-b border-slate-200 py-2 focus:outline-none focus:border-black transition-colors"
      >
    </div>

    <div class="grid grid-cols-4 pb-4 border-b border-slate-200 text-[10px] font-bold uppercase tracking-widest text-slate-400">
      <div>Infinitive (V1)</div>
      <div>Past Simple (V2)</div>
      <div>Past Participle (V3)</div>
      <div class="text-right">Translation</div>
    </div>

    <div id="verbsContainer"></div>
  </div>

  <script>
    const irregularVerbs = [
      { v1: 'be', v2: 'was/were', v3: 'been', tr: 'быть' },
      { v1: 'have', v2: 'had', v3: 'had', tr: 'иметь' },
      { v1: 'say', v2: 'said', v3: 'said', tr: 'сказать' },
      { v1: 'do', v2: 'did', v3: 'done', tr: 'делать' },
      { v1: 'know', v2: 'knew', v3: 'known', tr: 'знать' },
      { v1: 'get', v2: 'got', v3: 'gotten', tr: 'получать' }
    ];

    function playAudio(word) {
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }

    function render(data) {
      const container = document.getElementById('verbsContainer');
      container.innerHTML = '';
      
      data.forEach(verb => {
        const row = document.createElement('div');
        row.className = 'verb-table-grid hover:bg-slate-50 transition-colors';
        row.innerHTML = `
          <div class="flex items-center gap-3">
            <button onclick="playAudio('${verb.v1}')" class="w-5 h-5 opacity-40 hover:opacity-100 transition-opacity">
              <img src="7229.jpg" alt="listen" class="w-full h-full object-contain">
            </button>
            <span class="font-bold">${verb.v1}</span>
          </div>
          <div class="text-slate-600">${verb.v2}</div>
          <div class="text-slate-600">${verb.v3}</div>
          <div class="text-right text-slate-500">${verb.tr}</div>
        `;
        container.appendChild(row);
      });
    }

    document.getElementById('verbSearch').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = irregularVerbs.filter(v => 
        v.v1.includes(q) || v.tr.includes(q)
      );
      render(filtered);
    });

    render(irregularVerbs);
  </script>
</body>
</html>
