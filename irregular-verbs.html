<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEFL.ai - Irregular Verbs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen font-sans text-slate-800 antialiased">

  <div class="max-w-6xl mx-auto px-6 py-12">
    
    <div class="flex flex-col md:flex-row md:justify-between md:items-end mb-10 gap-4">
      <div>
        <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">
          Three Verb Forms
        </h1>
        <p class="mt-2 text-sm text-slate-500">
          100 Most Common Irregular Verbs
        </p>
      </div>

      <div class="relative w-full md:w-80">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-4 w-4 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <input 
          type="text" 
          id="verbSearch" 
          placeholder="Search verb or translation..." 
          class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-100 focus:border-purple-300 transition-all text-sm text-slate-700 placeholder-slate-400"
        >
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden border-t border-slate-100">
      
      <div class="hidden md:grid grid-cols-4 gap-4 px-8 py-4 bg-slate-50/50 border-b border-slate-100 text-xs font-bold text-slate-400 uppercase tracking-wider">
        <div>Infinitive (V1)</div>
        <div>Past Simple (V2)</div>
        <div>Past Participle (V3)</div>
        <div class="text-right">Translation</div>
      </div>

      <div id="verbsContainer" class="divide-y divide-slate-50">
        </div>

      <div id="noResults" class="hidden text-center py-12 text-slate-400 text-sm">
        No verbs found. Try another search.
      </div>
    </div>

  </div>

  <script>
    // Массив данных
    const irregularVerbs = [
      { v1: 'be', v2: 'was/were', v3: 'been', translation: 'быть' },
      { v1: 'have', v2: 'had', v3: 'had', translation: 'иметь' },
      { v1: 'say', v2: 'said', v3: 'said', translation: 'сказать' },
      { v1: 'do', v2: 'did', v3: 'done', translation: 'делать' },
      { v1: 'know', v2: 'knew', v3: 'known', translation: 'знать' },
      { v1: 'get', v2: 'got', v3: 'gotten', translation: 'получать' }
    ];

    const container = document.getElementById('verbsContainer');
    const searchInput = document.getElementById('verbSearch');
    const noResults = document.getElementById('noResults');

    // Функция озвучки слова
    function playAudio(word) {
      if ('speechSynthesis' in window) {
        // Отменяем предыдущую озвучку, если она еще идет
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.9; // Чуть замедляем для четкости
        window.speechSynthesis.speak(utterance);
      } else {
        alert("Твой браузер не поддерживает Text-to-Speech :(");
      }
    }

    // Рендер таблицы
    function renderVerbs(verbs) {
      container.innerHTML = '';
      
      if (verbs.length === 0) {
        noResults.classList.remove('hidden');
        return;
      }
      noResults.classList.add('hidden');

      verbs.forEach(verb => {
        const row = document.createElement('div');
        // Используем Grid для ровных колонок, стилизуем под макет
        row.className = 'grid grid-cols-1 md:grid-cols-4 gap-4 px-8 py-5 items-center hover:bg-slate-50/50 transition-colors duration-150';
        
        row.innerHTML = `
          <div class="flex items-center gap-3">
            <button 
              onclick="playAudio('${verb.v1}')" 
              class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-50 text-slate-400 hover:bg-purple-100 hover:text-purple-600 transition-colors"
              title="Listen pronunciation"
            >
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"></path>
              </svg>
            </button>
            <span class="text-base font-bold text-purple-600">${verb.v1}</span>
          </div>

          <div class="text-base font-bold text-purple-600">
            ${verb.v2}
          </div>

          <div class="text-base font-bold text-purple-600">
            ${verb.v3}
          </div>

          <div class="text-sm font-medium text-slate-500 md:text-right">
            ${verb.translation}
          </div>
        `;
        container.appendChild(row);
      });
    }

    // Логика живого поиска
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      
      const filtered = irregularVerbs.filter(verb => 
        verb.v1.toLowerCase().includes(query) ||
        verb.v2.toLowerCase().includes(query) ||
        verb.v3.toLowerCase().includes(query) ||
        verb.translation.toLowerCase().includes(query)
      );
      
      renderVerbs(filtered);
    });

    // Первичный запуск
    renderVerbs(irregularVerbs);
  </script>
</body>
</html>
