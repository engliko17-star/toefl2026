<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEFL Irregular Verbs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 antialiased">

  <div class="max-w-4xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
    
    <div class="mb-8 text-center sm:text-left">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight sm:text-4xl">
        Irregular Verbs Library
      </h1>
      <p class="mt-2 text-sm sm:text-base text-slate-500">
        Учи формы глаголов и проверяй себя для идеального TOEFL Writing.
      </p>
    </div>

    <div class="mb-6 relative">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input 
        type="text" 
        id="verbSearch" 
        placeholder="Поиск глагола (на английском или русском)..." 
        class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-base text-slate-900 placeholder-slate-400"
      >
    </div>

    <div id="verbsContainer" class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-2">
      </div>

    <div id="noResults" class="hidden text-center py-12 text-slate-500">
      Глагол не найден. Попробуй изменить запрос!
    </div>

  </div>

  <script>
    // Временный массив данных (позже подключим к Supabase)
    const irregularVerbs = [
      { v1: 'arise', v2: 'arose', v3: 'arisen', translation: 'возникать, появляться', note: 'Часто нужен в TOEFL Writing при описании проблем.' },
      { v1: 'break', v2: 'broke', v3: 'broken', translation: 'ломать, прерывать', note: 'Break the rules / break records.' },
      { v1: 'choose', v2: 'chose', v3: 'chosen', translation: 'выбирать', note: 'Обрати внимание на написание Chose (V2) с одной "о".' },
      { v1: 'undertake', v2: 'undertook', v3: 'undertaken', translation: 'предпринимать, совершать', note: 'Академическое слово, отлично для эссе.' },
      { v1: 'write', v2: 'wrote', v3: 'written', translation: 'писать', note: 'База для TOEFL Writing section.' }
    ];

    const container = document.getElementById('verbsContainer');
    const searchInput = document.getElementById('verbSearch');
    const noResults = document.getElementById('noResults');

    // Функция отрисовки карточек
    function renderVerbs(verbs) {
      container.innerHTML = '';
      
      if (verbs.length === 0) {
        noResults.classList.remove('hidden');
        return;
      }
      
      noResults.classList.add('hidden');

      verbs.forEach(verb => {
        const card = document.createElement('div');
        card.className = 'bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between';
        
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-3">
              <span class="text-xl font-bold text-indigo-600">${verb.v1}</span>
              <span class="text-xs font-medium bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">${verb.translation}</span>
            </div>
            
            <div class="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-xl text-center text-sm font-semibold mb-3">
              <div><span class="block text-[10px] uppercase tracking-wider text-slate-400 font-normal">Infinitive</span>${verb.v1}</div>
              <div><span class="block text-[10px] uppercase tracking-wider text-slate-400 font-normal">Past Simple</span>${verb.v2}</div>
              <div><span class="block text-[10px] uppercase tracking-wider text-slate-400 font-normal">Past Part.</span>${verb.v3}</div>
            </div>
          </div>
          
          ${verb.note ? `<p class="text-xs text-slate-400 italic mt-2 border-t border-slate-100 pt-2">💡 ${verb.note}</p>` : ''}
        `;
        container.appendChild(card);
      });
    }

    // Логика живого поиска
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      
      const filtered = irregularVerbs.filter(verb => 
        verb.v1.toLowerCase().includes(query) ||
        verb.v2.toLowerCase().includes(query) ||
        verb.v3.toLowerCase().includes(query) ||
        verb.translation.toLowerCase().includes(query)
      );
      
      renderVerbs(filtered);
    });

    // Первичный запуск
    renderVerbs(irregularVerbs);
  </script>
</body>
</html>
