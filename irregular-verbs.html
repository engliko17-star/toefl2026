<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three Verb Forms</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Жесткая сетка для таблицы: 1.5 доли на первую колонку, по 1 доле на остальные */
    .table-layout {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
    }
  </style>
</head>
<body class="bg-white text-slate-900 font-sans antialiased">

  <div class="max-w-5xl mx-auto px-6 py-12">
    
    <h1 class="text-3xl font-bold mb-1">Three Verb Forms</h1>
    <p class="text-sm text-slate-400 mb-8">100 Most Common Irregular Verbs</p>

    <div class="mb-8 relative max-w-sm">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <input 
        type="text" 
        id="verbSearch" 
        placeholder="Search verb or translation..." 
        class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800 transition-colors text-sm"
      >
    </div>

    <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
      
      <div class="table-layout bg-slate-50 border-b border-slate-200 text-[10px] font-bold uppercase tracking-widest text-slate-500">
        <div class="px-5 py-3 border-r border-slate-200">Infinitive (V1)</div>
        <div class="px-5 py-3 border-r border-slate-200">Past Simple (V2)</div>
        <div class="px-5 py-3 border-r border-slate-200">Past Participle (V3)</div>
        <div class="px-5 py-3 text-right">Translation</div>
      </div>

      <div id="verbsContainer" class="divide-y divide-slate-200">
        </div>
    </div>
    
  </div>

  <script>
    // Массив глаголов
    const irregularVerbs = [
      { v1: 'be', v2: 'was/were', v3: 'been', tr: 'быть' },
      { v1: 'have', v2: 'had', v3: 'had', tr: 'иметь' },
      { v1: 'say', v2: 'said', v3: 'said', tr: 'сказать' },
      { v1: 'do', v2: 'did', v3: 'done', tr: 'делать' },
      { v1: 'know', v2: 'knew', v3: 'known', tr: 'знать' },
      { v1: 'get', v2: 'got', v3: 'gotten', tr: 'получать' },
      { v1: 'write', v2: 'wrote', v3: 'written', tr: 'писать' },
      { v1: 'think', v2: 'thought', v3: 'thought', tr: 'думать' }
    ];

    // Функция озвучки
    function playAudio(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Остановка предыдущей озвучки
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Рендер таблицы
    function render(data) {
      const container = document.getElementById('verbsContainer');
      container.innerHTML = '';
      
      if (data.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">No verbs found.</div>`;
        return;
      }
      
      data.forEach(verb => {
        const row = document.createElement('div');
        // Используем тот же класс table-layout, что и в заголовках!
        row.className = 'table-layout bg-white hover:bg-slate-50 transition-colors duration-150';
        row.innerHTML = `
          <div class="px-5 py-3 border-r border-slate-200 flex items-center gap-3">
            <button 
              onclick="playAudio('${verb.v1}')" 
              class="text-slate-300 hover:text-slate-800 transition-colors focus:outline-none"
              title="Listen pronunciation"
            >
              <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M13.5 4.06c0-1.336-1.546-2.076-2.58-1.235L6.152 6.75H4.5A2.25 2.25 0 002.25 9v6a2.25 2.25 0 002.25 2.25h1.652l4.768 3.925c1.034.84 2.58.1 2.58-1.235V4.06zM17.55 7.643a.75.75 0 011.06-.051 7.498 7.498 0 010 8.816.75.75 0 11-1.164-1.014 5.999 5.999 0 000-6.79.75.75 0 01.104-1.061zM20.203 4.99a.75.75 0 011.06-.05 11.248 11.248 0 010 14.12.75.75 0 11-1.164-1.015 9.748 9.748 0 000-12.09.75.75 0 01.104-1.06z" />
              </svg>
            </button>
            <span class="font-bold text-slate-900">${verb.v1}</span>
          </div>

          <div class="px-5 py-3 border-r border-slate-200 flex items-center text-slate-700 font-medium">
            ${verb.v2}
          </div>

          <div class="px-5 py-3 border-r border-slate-200 flex items-center text-slate-700 font-medium">
            ${verb.v3}
          </div>

          <div class="px-5 py-3 flex items-center justify-end text-sm text-slate-500">
            ${verb.tr}
          </div>
        `;
        container.appendChild(row);
      });
    }

    // Живой поиск
    document.getElementById('verbSearch').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = irregularVerbs.filter(v => 
        v.v1.includes(q) || v.v2.includes(q) || v.v3.includes(q) || v.tr.includes(q)
      );
      render(filtered);
    });

    // Запуск
    render(irregularVerbs);
  </script>
</body>
</html>
