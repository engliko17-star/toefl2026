<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Настройка шрифта для более чистого вида */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* Стили таблицы */
    .verb-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      padding: 1rem 0;
      border-bottom: 1px solid #f3f4f6;
    }
  </style>
</head>
<body class="bg-white text-slate-900">

  <div class="max-w-5xl mx-auto px-8 py-12">
    
    <h1 class="text-3xl font-bold tracking-tight mb-8">Three Verb Forms</h1>

    <div class="grid grid-cols-4 pb-4 border-b border-black text-[10px] font-bold uppercase tracking-widest text-slate-400">
      <div>Infinitive (V1)</div>
      <div>Past Simple (V2)</div>
      <div>Past Participle (V3)</div>
      <div class="text-right">Translation</div>
    </div>

    <div id="verbsContainer"></div>

  </div>

  <script>
    const verbs = [
      { v1: 'be', v2: 'was/were', v3: 'been', tr: 'быть' },
      { v1: 'have', v2: 'had', v3: 'had', tr: 'иметь' },
      { v1: 'say', v2: 'said', v3: 'said', tr: 'сказать' },
      { v1: 'do', v2: 'did', v3: 'done', tr: 'делать' }
    ];

    const container = document.getElementById('verbsContainer');

    verbs.forEach(verb => {
      const row = document.createElement('div');
      row.className = 'verb-row items-center hover:bg-slate-50 transition-colors cursor-pointer';
      row.innerHTML = `
        <div class="flex items-center gap-3">
          <span class="text-slate-200">🔊</span> <span class="font-bold text-black">${verb.v1}</span>
        </div>
        <div class="text-slate-600 font-medium">${verb.v2}</div>
        <div class="text-slate-600 font-medium">${verb.v3}</div>
        <div class="text-right text-slate-500">${verb.tr}</div>
      `;
      container.appendChild(row);
    });
  </script>
</body>
</html>
