        { q: "And now can you tell me, how do you usually feel while you're outdoors compared to when you're indoors?",
          lx: ["fresh air", "a breath of fresh air", "switch off"],
          model: "[A] I usually feel much calmer and more energetic outdoors than indoors. [R] Inside, I'm surrounded by screens, deadlines and notifications, so my mind never really stops. Outside, I notice the sky, the trees and the **fresh air**, and my head becomes clear. [E] For example, after a day of lectures, I often feel tired and a bit grumpy. But when I go for a run in the park next to my dorm, after ten minutes I feel like a different person. Indoors, I feel the opposite — after a whole day in the library, I get a headache. [C] So for me, being outdoors is like pressing a reset button.",
          model5: "[A] Outdoors, I feel noticeably calmer and more alive than I do indoors. [R] Indoors, I'm surrounded by screens, deadlines and constant notifications, so my mind rarely switches off, whereas outside my attention shifts to the sky, the trees and the **fresh air**, and my thoughts gradually settle. [E] After a long day of lectures, for instance, I'm often drained and a little irritable, yet ten minutes into a run in the park beside my dorm, I feel like a completely different person. By contrast, a full day in the library almost always leaves me with a headache and a strange restlessness. [C] So for me, time outdoors works like a reset button, and it's **a breath of fresh air** in the most literal sense.",
          },
        { q: "And in your view, do you think avoiding spending time outdoors in nature makes a difference in people's health and well-being? Why or why not?",
          lx: ["well-being", "fresh air", "green space"],
          model: "[A] Yes, I think it makes a big difference. [R] When people stay inside all the time, they get less sunlight and fresh air, move less and feel more stressed. Nature helps us relax and forget our problems for a while. [E] For example, during my exam period last winter, I stayed inside for almost two weeks, and I felt tired and sad. Then a friend took me for a walk in the forest, and after one hour, I felt like a new person. Now I try to go to the park every day, even for fifteen minutes. [C] So nature is like free medicine.", model5: "[A] I'm convinced it makes a significant difference. [R] People who rarely go outdoors miss out on sunlight, fresh air and movement, all of which affect mood and sleep. Nature also has a unique ability to quiet our thoughts, which no indoor activity quite replicates. [E] During last winter's exam period, for instance, I barely left my room for two weeks and became increasingly drained and low. Then a friend dragged me out for a walk in the forest, and within an hour I felt completely transformed. Since then, I've made a point of **spending time in nature** daily, even if it's just fifteen minutes in the park. [C] So nature is essentially free medicine, and we're foolish not to use it." },
        { q: "Okay, last question. Do you think outdoor spaces should be free for everyone to use, or is it acceptable to charge fees? Why?",
          lx: ["green space", "conservation", "protect the environment"],
          model: "[A] I think most outdoor spaces should be free, but small fees are acceptable for national parks. [R] Nature is good for everyone's health, so city parks and beaches must be free, especially for people with little money. But national parks need money for rangers, trails and protecting animals. [E] For example, in Portugal last summer, we paid three euros to enter a natural park. The trails were clean, there were maps and toilets, and a ranger told us about the wildlife. That's a fair price. But I'd be angry if my local park started charging money. [C] So everyday green spaces should be free, and special places can ask for a small fee.",
          model5: "[A] I'd distinguish between everyday green spaces, which should be free, and protected areas, where modest fees are justified. [R] Access to nature is fundamental to public health, so urban parks and beaches ought to remain free, particularly for low-income families. National parks, however, require substantial funding for rangers, trail maintenance and **conservation**, and fees help cover those costs. [E] In Portugal last summer, for instance, we paid three euros to enter a natural park, and the difference was obvious: well-marked trails, clean facilities and a ranger who explained the local wildlife. I'd be outraged, by contrast, if my local park suddenly introduced an entrance fee. [C] So I'd keep daily green spaces free while accepting small, transparent fees for protecting fragile places." }
      ]
    },
    { id: "s054", badge: "official", title: "Public Parks and Recreation", src: "Official TOEFL · 054 / 117",
      scenario: "You have signed up for a study run by a university research group that is investigating public parks and recreation. You will have a short video interview with one of the researchers. The researcher will ask you some questions.",
      questions: [
        { q: "First, can you tell me about a memorable visit you or a friend made to a park or recreational space, and what made it special?",
          lx: ["green space", "enjoy the scenery", "bring people together"],
          model: "[A] A memorable visit was a picnic with my hiking club in the big park near my dorm last spring. [R] It was special because it was the first warm day after a long winter, and it was the day I really felt part of a group at university. [E] For example, about twenty of us brought food from our home countries, and we spent the whole afternoon on the grass by the lake. Someone brought a guitar, so I played a few songs, and later we played frisbee until it got dark. [C] So it was special because of the people, the sun and the feeling that spring had finally come.",
          model5: "[A] One visit that stands out was a picnic with my hiking club in the large park beside my dorm last spring. [R] It was the first genuinely warm day after a long, gray winter, and, more importantly, it was the day I truly felt I belonged to a group at university. [E] About twenty of us brought dishes from our home regions, for instance, and we spent the entire afternoon sprawled on the grass by the lake. Someone had brought a guitar, so I ended up playing a few songs, and we played frisbee until it was too dark to see. [C] So what made it special wasn't the park itself, but the combination of sunshine, good company and that sense that spring had finally arrived." },
        { q: "I see. Do you think public parks and recreational spaces are more important for adults or for children? Why?",
          lx: ["green space", "fresh air", "well-being"],
          model: "[A] I think parks are important for both, but maybe a bit more for children. [R] Children need space to run, play and make friends, and many city families live in small apartments without a garden. Parks also help kids develop physically and stay away from screens. [E] For example, my little cousin lives in a small flat, and the playground in their local park is his favorite place. He goes every day after school, and that's where he made most of his friends. But adults need parks too — I go running there to deal with stress. [C] So parks are essential for everyone, but especially for children in cities.",
          model5: "[A] They're vital for both, though I'd argue slightly more so for children. [R] Children need room to run, explore and socialize, and many urban families live in cramped apartments without any outdoor space. Parks also support children's physical development and offer a healthy alternative to screens. [E] My younger cousin, for instance, lives in a small flat, and the playground in their local park is effectively his second home; he goes there every day after school, and it's where he's made most of his friends. That said, adults benefit hugely as well — I rely on runs in the park to manage stress during exams. [C] So parks matter for everyone, but for city children, they're close to irreplaceable." },
        { q: "Some people believe that public parks play a crucial role in promoting community health and well-being by offering outdoor areas for relaxing and exercising or playing. And therefore, local governments should spend more money on such places. What are your thoughts on this? Do you agree or disagree? Why?",
          lx: ["green space", "well-being", "invest in"],
          model: "[A] Yes, I agree that local governments should spend more money on parks. [R] Parks are free, so everyone can use them — rich or poor, young or old. They help people exercise, relax and meet neighbors, which makes the whole community healthier. [E] For example, the park near my dorm has a running track, an outdoor gym and a basketball court. Every evening it's full of students, families and older people doing exercise. Without it, many of them would just stay at home. [C] So parks are one of the best investments a city can make.", model5: "[A] I wholeheartedly agree. [R] Parks are one of the few truly free and inclusive spaces in a city: anyone, regardless of age or income, can use them to exercise, unwind or socialize. As a result, they benefit both physical and mental health across the entire community. [E] The park next to my dorm, for instance, has a running track, an open-air gym and a basketball court, and every evening it's buzzing with students, families and pensioners alike. For many of them, I suspect, it's the only exercise they get, since gyms are simply too expensive. [C] So investing in parks is one of the most cost-effective ways a city can improve public health." },
        { q: "Finally, in many large cities, there is a tension between building more public parks for residents to relax and play versus using the space to build more housing. Do you think the need for more housing is more or less important than the need for public parks and recreational spaces? Why?",
          lx: ["urban sprawl", "green space", "affordable housing"],
          model: "[A] I think housing is a little more important, but cities shouldn't build on existing parks. [R] People need a place to live first — without affordable housing, young people and families can't stay in the city. But parks are not a luxury, so cities should find other space, like old factories or empty parking lots. [E] For example, in my city, rents are so high that many students share tiny rooms. At the same time, there's an old industrial area by the river that is empty. It could become apartments and a new park at the same time. [C] So we need both, and smart planning can give us both.",
          model5: "[A] Housing is arguably the more urgent need, but I don't think it should come at the expense of existing parks. [R] A home is a basic necessity, and without affordable housing, young people and families are simply priced out of cities. Green spaces, however, aren't a luxury either, so the solution lies in redeveloping underused land rather than sacrificing parks. [E] In my city, for instance, rents are so high that many students squeeze into tiny shared rooms, yet a vast abandoned industrial zone by the river has sat empty for years. It could easily accommodate both new apartments and a riverside park. [C] So I'd reject the either-or framing: with smart planning, cities can build homes without destroying the **green spaces** that make them livable." }
      ]
    },
    { id: "swl", badge: "platform", title: "Weather in Our Lives", src: "Практика платформы",
      scenario: "I'm conducting a study about how people experience and respond to different kinds of weather. I'd like to ask you a few questions.",
      questions: [
        { q: "First, what type of weather do you enjoy the most, and why? How does it typically influence your mood, your energy, or your activities?",
          lx: ["the weather affects my mood", "fresh air", "come rain or shine"],
          model: "[A] I like sunny, cool weather the most, like a bright autumn day. [R] Sunshine gives me energy and puts me in a good mood, but I don't like heat because it makes me tired. In dark winter months, I often feel sleepy and less motivated. [E] For example, on sunny autumn days, I run longer, study better and want to meet friends. But in December, when it's dark at four p.m., I just want to stay at home under a blanket. To feel better, I try to go outside at lunchtime when it's light. [C] So the weather really affects my mood and energy.", model5: "[A] My favorite is crisp, sunny weather, like a bright autumn morning. [R] Sunshine noticeably lifts my mood and energy levels, while cool temperatures keep me alert, unlike summer heat, which leaves me sluggish. Dark winter months, by contrast, tend to drain my motivation. [E] On clear autumn days, for instance, I run further, concentrate better and actively want to see people. In December, however, when it's dark by four, I'm tempted to hibernate under a blanket. To counter that, I make a point of getting outside during the brightest part of the day, which genuinely helps. [C] So weather has a much bigger influence on my mood than I'd like to admit." },
        { q: "People often say their productivity or outlook changes depending on the weather. Can you describe a specific day or event when the weather really had an impact on how you felt or what you were able to do?",
          lx: ["heavy rain", "be stuck indoors", "the weather affects my mood"],
          model: "[A] I remember a day last autumn when **heavy rain** ruined a hiking trip I'd planned for weeks. [R] I was really looking forward to it, so when it was cancelled, I felt disappointed and lazy for the whole weekend. [E] For example, we had to cancel the trip at six in the morning because of a storm warning. I stayed in my room, it was dark and gray all day, and I couldn't make myself study. But on Sunday afternoon the sun came out, I went for a run, and suddenly I had energy again and finished my essay in two hours. [C] So that day showed me how much the weather affects my mood.",
          model5: "[A] I clearly remember a weekend last autumn when a storm wrecked a hiking trip I'd been planning for weeks. [R] I'd been looking forward to it so much that the cancellation left me disappointed and strangely unmotivated for the entire weekend. [E] We called the trip off at six in the morning, for instance, after a storm warning, and I spent Saturday stuck in my room under a dark, gray sky, completely unable to focus on studying. On Sunday afternoon, however, the sun broke through, I went for a quick run, and my energy came flooding back; I finished an essay in two hours that I'd been avoiding all week. [C] So that weekend proved to me how strongly the weather shapes both my mood and my productivity." },
        { q: "In many places around the world, people are noticing more extreme weather—such as heatwaves, storms, or sudden changes in temperature. Have you observed anything like that where you live? If so, how has it affected your lifestyle, your commute, or even your health?",
          lx: ["heatwave", "extreme weather", "a heatwave hits"],
          model: "[A] Yes, I've definitely noticed more extreme weather where I live, especially hotter summers. [R] When I was a child, summer was warm and pleasant, but now we have heatwaves almost every year, and winters have less snow. [E] For example, last July, the temperature was over thirty-five degrees for two weeks. My dorm room has no air conditioning, so I couldn't sleep well, and I had to change my running time to six in the morning. The buses were also so hot that I started cycling to class instead. [C] So extreme weather is already changing my daily habits.",
          model5: "[A] Absolutely; the most obvious change where I live is the increasingly brutal summers. [R] As a child, I remember summers being warm and pleasant, whereas now **heatwaves** have become almost annual, while winters bring noticeably less snow. [E] Last July, for instance, temperatures stayed above thirty-five degrees for two weeks straight. My dorm room has no air conditioning, so I barely slept, and I had to move my runs to six in the morning to avoid the worst of the heat. The buses became so stifling that I switched to cycling to campus altogether. [C] So **extreme weather** isn't an abstract future threat for me; it's already reshaping my daily routine." },
        { q: "As climate patterns shift, some believe that governments and local communities need to do more—whether that's building infrastructure to handle storms, planting trees to cool cities, or providing better public information. Do you think enough is being done? Why or why not?",
          lx: ["take action on climate change", "green space", "extreme weather"],
          model: "[A] No, I don't think enough is being done, although things are slowly improving. [R] Governments often react only after a disaster happens, instead of preparing in advance. Simple solutions, like planting trees or improving drainage, are cheap compared to the cost of damage. [E] For example, two years ago heavy rain flooded the main streets of my city because the drains were old. Only after that, the city started to repair them. On the positive side, my neighborhood has started planting trees along the streets to give shade in summer. [C] So there is some progress, but cities need to act before disasters, not after.",
          model5: "[A] Not yet, in my view, though there are encouraging signs. [R] Authorities still tend to respond to disasters rather than prevent them, even though preventive measures, such as planting trees or upgrading drainage, cost a fraction of the damage they avoid. [E] Two years ago, for instance, heavy rain flooded the main streets of my city because the drainage system was decades old, and only after that did the council start replacing it. On a more positive note, my neighborhood recently began lining streets with trees to provide shade during heatwaves. [C] So progress is happening, but far too slowly; cities need to plan ahead rather than learning to **weather the storm** after it has already hit." }
      ]
    },
    { id: "s087", badge: "official", title: "Environmental Practices", src: "Official TOEFL · 087",
      scenario: "You are participating in a research study conducted by your university's Department of Environmental Science about environmental practices. You will meet online with a researcher who will ask you some questions.",
      questions: [
        { q: "First, do you take any specific actions to reduce your environmental impact, such as recycling or conserving energy? Give details in your answer.",
          lx: ["recycle", "save energy", "carry a reusable bottle"],
          model: "[A] Yes, I take a few simple actions every day to reduce my environmental impact. [R] I know one person can't save the planet, but I think small habits are important, and they're easy if you make them a routine. [E] For example, I recycle paper, plastic and glass in my dorm, and I always **carry a reusable bottle** and a cloth bag. I walk or cycle to class instead of taking the bus, and I turn off my laptop and lights when I leave the room. I've also started eating meat only two or three times a week. [C] So my actions are small, but they add up.",
          model5: "[A] Yes, I've built several small but consistent habits into my daily routine. [R] I'm realistic that one person can't solve environmental problems single-handedly, but I believe habits matter, and once they become automatic, they require almost no effort. [E] I **recycle** paper, plastic and glass in my dorm, for instance, and I never leave without a **reusable** bottle and a cloth bag. I walk or cycle to campus rather than taking the bus, and I make a point of switching off my laptop and lights whenever I leave my room. More recently, I've also cut my meat consumption to two or three times a week. [C] So none of these actions is dramatic on its own, but together they make a real dent in my footprint." },
        { q: "Can you describe one or two steps your community or neighborhood takes to be environmentally friendly? For example, are there solar panels on buildings or rainwater barrels available where you live?",
          lx: ["environmentally friendly", "renewable energy", "sort the rubbish"],
          model: "[A] My university campus, where I live, takes a few environmentally friendly steps. [R] The university wants to be greener, and many students care about the environment, so they pushed for changes. [E] For example, last year solar panels were installed on the roof of the main library, and now they produce part of the electricity for the campus. Also, every floor of my dorm has bins for paper, plastic, glass and food waste, with clear signs. In the cafeteria, you get a discount if you bring your own cup. [C] So my community is not perfect, but it's moving in the right direction.",
          model5: "[A] My university campus, which is effectively my neighborhood, has taken a couple of notable steps. [R] The administration has committed to becoming carbon neutral, and student pressure has helped turn that commitment into concrete action. [E] Last year, for instance, solar panels were installed across the roof of the main library, and they now supply a significant share of the campus's electricity. Every floor of my dorm also has clearly labeled bins for paper, plastic, glass and food waste, and the cafeteria offers a discount to anyone who brings their own cup. [C] So the campus is far from perfect, but it's moving steadily in a more **sustainable** direction." },
        { q: "If you had the chance to participate in an ecological or nature-based activity, such as a community cleanup effort or tree planting event, what would you do and why?",
          lx: ["take part in", "protect the environment", "make a difference"],
          model: "[A] I'd like to take part in a river cleanup. [R] There's a river near my city where people often go for walks and picnics, but it's full of plastic bottles and bags. A cleanup would make a visible difference, and it's also a nice way to meet people. [E] For example, I've already joined one park cleanup with my hiking club, and in two hours we collected over thirty bags of trash. It felt great to see the park clean afterwards. A river cleanup would be even better, because the plastic there goes into the sea and hurts fish and birds. [C] So I'd choose a river cleanup because the result is immediate.",
          model5: "[A] I'd sign up for a river cleanup without hesitation. [R] There's a river on the edge of my city that's popular for walks and picnics, yet its banks are littered with plastic bottles and bags. A cleanup produces visible results immediately, and it's also a great way to meet like-minded people. [E] I've already joined a park cleanup with my hiking club, for instance, and in just two hours we filled more than thirty bags with rubbish; seeing the park spotless afterwards was incredibly satisfying. Rivers matter even more, though, because plastic there eventually reaches the sea, where it harms fish and seabirds. [C] So I'd choose a river cleanup because it delivers an instant, tangible impact while tackling a much larger problem at its source." },
        { q: "Some people believe that individual actions are not enough to address conservation issues and that significant changes must come from government policies. Do you agree or disagree with this viewpoint? Why or why not?",
          lx: ["a drop in the ocean", "take action on", "hold accountable"],
          model: "[A] I mostly agree that the biggest changes must come from government policies. [R] Governments can make rules for whole industries, build public transport and invest in clean energy, which individuals can't do. But individual actions are still important because they show governments what people want. [E] For example, I can stop using plastic bags, but when my country banned free plastic bags in shops, their use dropped by more than eighty percent in one year. That's a huge change no individual could achieve. [C] So governments have the most power, but people must also do their part.",
          model5: "[A] I largely agree, although I wouldn't dismiss individual action entirely. [R] Only governments can regulate entire industries, fund public transport and redirect investment toward clean energy; by comparison, one person's efforts can feel like **a drop in the ocean**. Individual behavior does matter, however, because it signals to politicians what voters actually want. [E] I can personally refuse plastic bags, for instance, but when my country banned free plastic bags in shops, their use fell by more than eighty percent within a year, a shift no individual campaign could have achieved. [C] So meaningful change requires policy, but it's often public pressure and changing habits that persuade governments to act in the first place." }
      ]
    },
    { id: "s071", badge: "official", title: "Recycling and Waste Management", src: "Official TOEFL · 071",
      scenario: "You have agreed to participate in a research study about people's experiences with recycling and waste management. You will have a short online interview with a researcher. The researcher will ask you some questions.",
      questions: [
        { q: "First, do you regularly recycle items such as paper, plastic, and glass? Why or why not?",
          lx: ["recycle", "sort the rubbish", "landfill"],
          model: "[A] Yes, I recycle paper, plastic and glass regularly. [R] It's easy in my dorm because there are separate bins on every floor, and I know that recycling saves resources and reduces the amount of trash in landfills. Also, my parents taught me to do it from childhood. [E] For example, I keep a small box for paper and a bag for plastic bottles in my room, and every two days I empty them into the big bins downstairs. It takes me maybe two minutes. At home, my family even rinses jars before recycling them. [C] So recycling is just a normal habit for me.",
          model5: "[A] Yes, I recycle paper, plastic and glass as a matter of routine. [R] My dorm makes it effortless, with separate bins on every floor, and I'm aware that recycling conserves resources and keeps waste out of **landfills**. It's also something my parents instilled in me from early childhood. [E] I keep a small box for paper and a bag for plastic bottles in my room, for instance, and every couple of days I empty them into the larger bins downstairs, which takes about two minutes. My family at home is even more meticulous; they rinse every jar before it goes in the glass bin. [C] So for me, recycling isn't a conscious choice anymore; it's simply part of daily life." },
        { q: "Can you describe the recycling practices in your household or community?",
          lx: ["sort the rubbish", "reduce waste", "food waste"],
          model: "[A] In my family's home, we sort our rubbish into four different bins. [R] My mom is very serious about recycling, and our town gives a discount on waste bills to families who sort their trash. [E] For example, in our kitchen, we have bins for paper, plastic, glass and food waste. The food waste goes into compost for my grandmother's vegetable garden. Every two weeks, a special truck collects the recycling, and there's also a center where you can bring old electronics and batteries. [C] So recycling is well organized in my community, and everyone takes part.",
          model5: "[A] At my family's home, we **sort the rubbish** into four separate streams. [R] My mother is passionate about recycling, and our town also offers lower waste fees to households that separate their rubbish, which gives everyone an extra incentive. [E] In our kitchen, for instance, there are bins for paper, plastic, glass and food scraps, and the food waste is turned into compost for my grandmother's vegetable garden. Recycling is collected every two weeks, and there's also a drop-off center for old electronics and batteries. [C] So recycling in my community is well organized and, crucially, convenient, which I think is the main reason almost everyone participates." },
        { q: "What challenges or difficulties do you face when trying to recycle? And how do you overcome them?",
          lx: ["a walk in the park", "sort the rubbish", "single-use"],
          model: "[A] The main challenge for me is that the recycling rules are confusing. [R] Some plastics can be recycled and some can't, and the rules are different in my hometown and in the city where I study. Also, a lot of packaging is made of mixed materials, so I don't know where to put it. [E] For example, I didn't know that pizza boxes with grease can't go in the paper bin. To solve this, I downloaded my city's recycling app, where you can type the name of an item and see which bin it goes in. I also try to buy products with less packaging. [C] So recycling isn't a walk in the park, but a little research helps.",
          model5: "[A] My biggest challenge is honestly just how confusing the rules are. [R] Some plastics are recyclable while others aren't, the rules differ between my hometown and the city where I study, and a lot of packaging combines several materials, which makes sorting almost impossible. [E] I had no idea, for instance, that greasy pizza boxes can't go in the paper bin. To deal with this, I downloaded my city's recycling app, which tells you exactly which bin an item belongs in, and I increasingly avoid products with excessive or **single-use** packaging altogether. [C] So recycling properly is no **walk in the park**, but a bit of research and smarter shopping solve most of the problems." },
        { q: "Some people believe that effective recycling programs are crucial for reducing pollution and conserving natural resources and therefore should be mandatory. Do you agree or disagree with this belief? Why or why not?",
          lx: ["mandatory", "conservation", "reduce waste"],
          model: "[A] I agree that recycling should be mandatory, especially for businesses. [R] When recycling is voluntary, many people don't do it because they're busy or lazy. Rules make everyone take part, and the results are much bigger. But the system must also be simple and convenient. [E] For example, in Germany, people pay a small deposit for bottles and get the money back when they return them. Because of this, almost all bottles are recycled. In my city, recycling is voluntary, and I often see bottles in normal trash bins. [C] So mandatory recycling works, if the system is easy for people.",
          model5: "[A] I agree, particularly when it comes to businesses, which produce enormous volumes of waste. [R] Voluntary schemes rely on goodwill, and busy people inevitably cut corners, whereas mandatory rules create universal participation and therefore far greater impact. Crucially, though, the system must also be simple and convenient, or compliance will remain low. [E] In Germany, for instance, customers pay a small deposit on bottles that's refunded on return, and as a result, nearly all bottles are recycled. In my city, by contrast, recycling is voluntary, and bottles routinely end up in ordinary bins. [C] So I'd support **mandatory** recycling, combined with incentives that make doing the right thing the easiest option." }
      ]
    },
    { id: "scc", badge: "platform", title: "Climate Change Awareness", src: "Практика платформы",
      scenario: "We're studying how aware people are of climate change and what actions they're taking in response. I'd like to ask you a few questions to learn more about your views and experiences.",
      questions: [
        { q: "To begin, how informed do you feel about the causes and effects of climate change? Would you say this is something you actively follow in the news or think about in your daily life?",
          lx: ["climate change", "raise awareness of", "extreme weather"],
          model: "[A] I'd say I'm fairly well informed about climate change, although I'm not an expert. [R] I learned the basics at school, and now I see it in the news almost every day. It's also something I notice personally, because summers in my city are getting hotter. [E] For example, I follow a few science channels on social media that explain new research in simple language. Last semester, I also took an elective course on sustainability, where we studied how carbon emissions cause global warming. [C] So I think about it quite often, but I try not to let it make me anxious.",
          model5: "[A] I'd describe myself as reasonably well informed, though certainly not an expert. [R] I covered the basic science at school, and now it's almost impossible to avoid in the news. More personally, I can see it in my own city, where summers have become noticeably harsher. [E] I follow a couple of science communicators online, for instance, who break down new research in accessible language, and last semester I took an elective course on sustainability, where we examined how carbon emissions drive global warming in considerable depth. [C] So it's very much part of my daily thinking, although I make a conscious effort to stay informed without letting it turn into constant anxiety." },
        { q: "Some people are making small changes in their lifestyles—like reducing energy use, recycling more, or cutting back on meat—to reduce their environmental impact. Have you taken any specific actions to reduce your own carbon footprint? If so, what motivated you to do that?",
          lx: ["carbon footprint", "cut down on", "switch to"],
          model: "[A] Yes, I've taken a few small actions, and eating less meat is the biggest one. [R] I learned that producing meat, especially beef, creates a lot of greenhouse gases, and I wanted to do something simple that I can do every day. [E] For example, I now eat meat only on weekends. I also try not to waste food, I bring my own bag to the supermarket and I cycle instead of taking the bus. My motivation came from a documentary about climate change that showed how much our food choices matter. [C] So I can't save the planet alone, but I can make small changes.", model5: "[A] I have taken several small steps, the most significant being **cutting back on** meat. [R] When I learned how much greenhouse gas beef production generates, changing my diet seemed like one of the most impactful things an individual can do every single day. [E] These days, for instance, I eat meat mainly at weekends, plan my shopping carefully to avoid **food waste**, carry reusable bags and cycle to campus. What first motivated me was a documentary showing that food systems account for a substantial share of global emissions, which made me realize my plate was part of the problem — and potentially part of the solution. [C] So while no individual can fix the climate alone, small daily choices do add up." },
        { q: "Climate change can feel like a massive global issue, and many people feel their individual efforts are just a drop in the bucket. In your opinion, do small personal actions really make a meaningful difference? Or do you think real change has to come from larger systems? Why?",
