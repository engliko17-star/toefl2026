<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Topics — TOEFL Prep</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        body.dyslexia-mode { font-family: 'Lexend', sans-serif; background: #FBF8F1; letter-spacing: .02em; }
        body.dyslexia-mode p { line-height: 1.9; }

        .mobile-nav-scroll::-webkit-scrollbar { display: none; }
        .mobile-nav-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .unit-card { transition: border-color .15s, box-shadow .15s; }
        .cat-chip.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col md:flex-row">

    <div id="app-sidebar"></div>
    <script src="nav.js"></script>

    <main class="flex-1 p-6 overflow-y-auto bg-[#f8f9fa] pb-24 md:pb-6">

        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 mb-6">
            <div class="max-w-xl">
                <span class="text-xs font-semibold text-gray-400">Speaking по темам</span>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight mt-0.5">Говорим на темы TOEFL</h1>
                <p class="text-sm text-gray-500 mt-2">
                    В каждой теме — лексика для ответов, опоры для построения фраз и вопросы в формате Interview
                    от простых к сложным. Таймер и запись встроены прямо в страницу.
                </p>
            </div>
            <button id="dyslexiaToggle" class="flex items-center gap-2 text-xs font-medium text-gray-500 bg-white border border-gray-200 rounded-xl px-3 py-2 hover:bg-gray-50 transition shrink-0">
                <i data-lucide="type" class="w-4 h-4"></i><span>Режим чтения</span>
            </button>
        </div>

        <div id="categories" class="flex flex-wrap gap-2 mb-6"></div>

        <div id="state" class="text-gray-500 text-sm py-16 text-center">Загрузка…</div>
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </main>


<script>
// Находит клиент Supabase, который создаёт auth.js, как бы он там ни назывался.
// auth.js создаёт клиент как `const _supabase`. Объявленные через const
// переменные не попадают в window, поэтому берём голое имя, а не window._supabase.
function getDb() {
    try {
        if (typeof _supabase !== 'undefined' && _supabase && typeof _supabase.from === 'function') {
            return _supabase;
        }
    } catch (e) {}
    const named = [window.supabaseClient, window.supabaseInstance, window.supabaseDB, window.sb, window.db];
    for (const c of named) if (c && typeof c.from === 'function') return c;
    return null;
}

const CATEGORY_LABELS = { society: 'Общество', personal: 'Личное', work_study: 'Работа и учёба' };
const SKILL_STYLES = {
    vocabulary: 'bg-sky-50 text-sky-700', speaking: 'bg-rose-50 text-rose-700',
    listening: 'bg-teal-50 text-teal-700', writing: 'bg-indigo-50 text-indigo-700',
    assessment: 'bg-amber-50 text-amber-700'
};
const SKILL_LABELS = {
    vocabulary: 'Лексика', speaking: 'Speaking', listening: 'Listening',
    writing: 'Writing', assessment: 'Замер'
};

let db = null, allUnits = [], activeCategory = 'all';

function safeCreateIcons() {
    try { if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons(); }
    catch (e) { console.warn('lucide:', e); }
}
function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function initDyslexia() {
    const btn = document.getElementById('dyslexiaToggle');
    let on = false;
    try { on = localStorage.getItem('dyslexia-mode') === '1'; } catch (e) {}
    if (on) document.body.classList.add('dyslexia-mode');
    btn.addEventListener('click', () => {
        const now = document.body.classList.toggle('dyslexia-mode');
        try { localStorage.setItem('dyslexia-mode', now ? '1' : '0'); } catch (e) {}
    });
}

function renderCategories() {
    const cats = ['all', ...new Set(allUnits.map(u => u.category).filter(Boolean))];
    document.getElementById('categories').innerHTML = cats.map(c => `
        <button data-cat="${esc(c)}"
                class="cat-chip text-xs font-medium px-3 py-1.5 rounded-xl border border-gray-200 bg-white text-gray-500 hover:border-gray-400 transition ${c === activeCategory ? 'active' : ''}">
            ${c === 'all' ? 'Все' : esc(CATEGORY_LABELS[c] || c)}
        </button>`).join('');
    document.querySelectorAll('.cat-chip').forEach(b => {
        b.addEventListener('click', () => { activeCategory = b.dataset.cat; renderCategories(); renderGrid(); });
    });
}

function unitCard(u) {
    const total = u.stepCount || 0;
    const done = u.doneCount || 0;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const skills = [...new Set(u.skills || [])];

    return `
    <a href="lesson-unit.html?unit=${encodeURIComponent(u.slug)}"
       class="unit-card block bg-white p-5 rounded-2xl border border-gray-100 shadow-xs hover:border-indigo-100 hover:shadow-md">
        <div class="flex items-start justify-between gap-3 mb-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
                <i data-lucide="${esc(u.cover_icon || 'book-open')}" class="w-5 h-5"></i>
            </div>
            ${u.category ? `<span class="text-[11px] font-medium text-gray-400 bg-gray-50 rounded-lg px-2 py-1">${esc(CATEGORY_LABELS[u.category] || u.category)}</span>` : ''}
        </div>

        <h2 class="font-bold text-slate-900">${esc(u.title_en)}</h2>
        ${u.title_ru ? `<p class="text-xs text-gray-400 mb-2">${esc(u.title_ru)}</p>` : ''}
        ${u.description ? `<p class="text-sm text-gray-500 mb-4">${esc(u.description)}</p>` : '<div class="mb-4"></div>'}

        <div class="flex flex-wrap gap-1.5 mb-4">
            ${skills.map(s => `<span class="text-[11px] font-medium px-2 py-0.5 rounded-lg ${SKILL_STYLES[s] || 'bg-gray-50 text-gray-500'}">${esc(SKILL_LABELS[s] || s)}</span>`).join('')}
        </div>

        <div class="flex items-center gap-3">
            <div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                <div class="h-full bg-indigo-500 rounded-full" style="width:${pct}%"></div>
            </div>
            <span class="text-[11px] font-bold ${done ? 'text-indigo-600' : 'text-gray-300'} shrink-0">${done}/${total}</span>
        </div>
    </a>`;
}

function renderGrid() {
    const list = activeCategory === 'all' ? allUnits : allUnits.filter(u => u.category === activeCategory);
    document.getElementById('grid').innerHTML = list.map(unitCard).join('');
    safeCreateIcons();
}

async function load() {
    const state = document.getElementById('state');
    try {
        const user = await requireAuth();
        if (!user) return;
        window.currentUser = user;

        if (user.role === 'teacher') {
            ['teacherLinkDesktop', 'teacherLinkMobile'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.classList.remove('hidden'); el.classList.add('flex'); }
            });
            safeCreateIcons();
        }

        db = getDb();
        if (!db) throw new Error('Не найден клиент Supabase. Посмотри, как он называется в auth.js, и добавь это имя в getDb().');

        const { data: units, error: uErr } = await db
            .from('lesson_units').select('*').eq('is_published', true).order('order_num');
        if (uErr) throw uErr;

        if (!units || !units.length) {
            state.innerHTML = '<p class="mb-1">Здесь пока пусто.</p><p class="text-xs text-gray-400">Первая тема появится, как только её опубликует преподаватель.</p>';
            return;
        }

        const ids = units.map(u => u.id);
        const [{ data: steps }, { data: progress }] = await Promise.all([
            db.from('lesson_steps').select('id, unit_id, skill').in('unit_id', ids),
            db.from('lesson_progress').select('unit_id, step_id').eq('user_id', user.id).in('unit_id', ids)
        ]);

        allUnits = units.map(u => {
            const mine = (steps || []).filter(s => s.unit_id === u.id);
            return {
                ...u,
                stepCount: mine.length,
                skills: mine.map(s => s.skill),
                doneCount: (progress || []).filter(p => p.unit_id === u.id).length
            };
        });

        state.classList.add('hidden');
        renderCategories();
        renderGrid();
    } catch (e) {
        console.error(e);
        state.innerHTML = `<p class="text-rose-600 font-medium">Не удалось загрузить уроки.</p>
                           <p class="text-xs text-gray-400 mt-1">${esc(e.message || e)}</p>`;
    }
}

safeCreateIcons();
initDyslexia();
window.addEventListener('load', load);
</script>
</body>
</html>
