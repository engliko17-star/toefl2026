<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Уроки — TOEFL</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  body.dyslexia-mode { font-family: 'Lexend', sans-serif; background: #FBF8F1; letter-spacing: .02em; }
  body.dyslexia-mode .unit-card p { line-height: 1.9; }
  body.dyslexia-mode .text-xs { font-size: .875rem; }
  .unit-card { transition: border-color .15s, transform .15s; }
  .unit-card:hover { border-color: #6366f1; transform: translateY(-2px); }
  .cat-chip.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }
</style>
</head>
<body class="bg-slate-50 text-slate-900">

<header class="bg-white border-b border-slate-200 sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3 min-w-0">
      <a href="dashboard.html" class="text-slate-400 hover:text-slate-700 shrink-0" aria-label="Назад">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <h1 class="text-lg font-semibold truncate">Уроки</h1>
    </div>
    <button id="dyslexiaToggle"
            class="flex items-center gap-2 text-sm text-slate-600 border border-slate-200 rounded-lg px-3 py-1.5 hover:bg-slate-50">
      <i data-lucide="type" class="w-4 h-4"></i><span class="hidden sm:inline">Режим чтения</span>
    </button>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">

  <p class="text-slate-600 max-w-2xl mb-6">
    Каждый юнит — одна ситуация, разобранная от слов до задания в формате экзамена.
    Уровень поддержки внутри юнита подстраивается под твой последний результат.
  </p>

  <div id="categories" class="flex flex-wrap gap-2 mb-6"></div>

  <div id="state" class="text-slate-500 py-16 text-center">Загрузка…</div>
  <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</main>

<script>
// ─── настройка ───────────────────────────────────────────────
// Если auth.js уже создаёт клиент, эти две строки можно удалить.
const SUPABASE_URL = window.SUPABASE_URL || 'ВСТАВЬ_URL';
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'ВСТАВЬ_КЛЮЧ';

const db = window.supabaseClient || supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
window.supabaseClient = db;

const CATEGORY_LABELS = {
  campus: 'Кампус', daily_life: 'Быт', services: 'Услуги', academic: 'Учёба'
};
const SKILL_STYLES = {
  vocabulary: 'bg-sky-50 text-sky-700',
  speaking:   'bg-rose-50 text-rose-700',
  listening:  'bg-teal-50 text-teal-700',
  writing:    'bg-indigo-50 text-indigo-700',
  assessment: 'bg-amber-50 text-amber-700'
};

let allUnits = [], activeCategory = 'all';

function safeCreateIcons() {
  try { if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons(); }
  catch (e) { console.warn('lucide:', e); }
}

function initDyslexia() {
  const btn = document.getElementById('dyslexiaToggle');
  let on = false;
  try { on = localStorage.getItem('dyslexia-mode') === '1'; } catch (e) {}
  if (on) document.body.classList.add('dyslexia-mode');
  btn.addEventListener('click', () => {
    const now = document.body.classList.toggle('dyslexia-mode');
    try { localStorage.setItem('dyslexia-mode', now ? '1' : '0'); } catch (e) {}
  });
}

async function getUser() {
  if (window.currentUser) return window.currentUser;
  const { data } = await db.auth.getUser();
  window.currentUser = data && data.user ? data.user : null;
  return window.currentUser;
}

function renderCategories() {
  const cats = ['all', ...new Set(allUnits.map(u => u.category).filter(Boolean))];
  document.getElementById('categories').innerHTML = cats.map(c => `
    <button data-cat="${c}"
            class="cat-chip text-sm px-3 py-1.5 rounded-full border border-slate-200 bg-white text-slate-600 hover:border-slate-400 ${c === activeCategory ? 'active' : ''}">
      ${c === 'all' ? 'Все' : (CATEGORY_LABELS[c] || c)}
    </button>`).join('');
  document.querySelectorAll('.cat-chip').forEach(b => {
    b.addEventListener('click', () => { activeCategory = b.dataset.cat; renderCategories(); renderGrid(); });
  });
}

function unitCard(u) {
  const total = u.stepCount || 0;
  const done = u.doneCount || 0;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const started = done > 0;
  const skills = [...new Set((u.skills || []))];

  return `
  <a href="lesson-unit.html?unit=${encodeURIComponent(u.slug)}"
     class="unit-card block bg-white border border-slate-200 rounded-xl p-5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    <div class="flex items-start justify-between gap-3 mb-3">
      <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
        <i data-lucide="${u.cover_icon || 'book-open'}" class="w-5 h-5"></i>
      </div>
      ${u.category ? `<span class="text-xs text-slate-500 bg-slate-100 rounded-full px-2.5 py-1">${CATEGORY_LABELS[u.category] || u.category}</span>` : ''}
    </div>

    <h2 class="font-semibold text-slate-900">${u.title_en}</h2>
    ${u.title_ru ? `<p class="text-sm text-slate-500 mb-2">${u.title_ru}</p>` : ''}
    ${u.description ? `<p class="text-sm text-slate-600 mb-4">${u.description}</p>` : '<div class="mb-4"></div>'}

    <div class="flex flex-wrap gap-1.5 mb-4">
      ${skills.map(s => `<span class="text-xs px-2 py-0.5 rounded ${SKILL_STYLES[s] || 'bg-slate-100 text-slate-600'}">${s}</span>`).join('')}
    </div>

    <div class="flex items-center gap-3">
      <div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
        <div class="h-full bg-indigo-500 rounded-full" style="width:${pct}%"></div>
      </div>
      <span class="text-xs ${started ? 'text-indigo-600 font-medium' : 'text-slate-400'} shrink-0">${done}/${total}</span>
    </div>
  </a>`;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const list = activeCategory === 'all' ? allUnits : allUnits.filter(u => u.category === activeCategory);
  grid.innerHTML = list.map(unitCard).join('');
  safeCreateIcons();
}

async function load() {
  const state = document.getElementById('state');
  try {
    const user = await getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const { data: units, error: uErr } = await db
      .from('lesson_units').select('*').eq('is_published', true).order('order_num');
    if (uErr) throw uErr;

    if (!units || !units.length) {
      state.innerHTML = '<p class="mb-2">Здесь пока пусто.</p><p class="text-sm">Первый юнит появится, как только его опубликует преподаватель.</p>';
      return;
    }

    const ids = units.map(u => u.id);
    const [{ data: steps }, { data: progress }] = await Promise.all([
      db.from('lesson_steps').select('id, unit_id, skill').in('unit_id', ids),
      db.from('lesson_progress').select('unit_id, step_id').eq('user_id', user.id).in('unit_id', ids)
    ]);

    allUnits = units.map(u => {
      const mine = (steps || []).filter(s => s.unit_id === u.id);
      return {
        ...u,
        stepCount: mine.length,
        skills: mine.map(s => s.skill),
        doneCount: (progress || []).filter(p => p.unit_id === u.id).length
      };
    });

    state.classList.add('hidden');
    renderCategories();
    renderGrid();
  } catch (e) {
    console.error(e);
    state.innerHTML = `<p class="text-red-600">Не удалось загрузить уроки.</p>
                       <p class="text-sm text-slate-500 mt-1">${e.message || e}</p>`;
  }
}

initDyslexia();
safeCreateIcons();
load();
</script>
</body>
</html>
