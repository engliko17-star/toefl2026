          model5: "[A] Yes, I'd say I'm fairly active: I **go running** three times a week and **work out** at the gym twice. [R] Since I spend most of my day sitting in lectures or in the library, regular exercise is what keeps both my body and my mind in balance. [E] Every Monday, Wednesday and Friday, for instance, I run about five kilometers in the park next to my dorm before breakfast, which sets me up for the whole day. On weekends, I also play the occasional football match with old school friends — mostly for fun, although things do get competitive. [C] So exercise has become such a fixed part of my routine that I genuinely miss it when I skip a session." },
        { q: "If you were able to, what sport that you do not currently play would you like to be really good at? Why that particular sport?",
          lx: ["take up a sport", "physically demanding", "adrenaline"],
          model: "[A] I'd love to be really good at surfing. [R] It looks exciting and free, and it's a sport where you're in nature, not in a gym. It's also very difficult, so being good at it would make me proud. [E] For example, last summer I tried a surfing lesson in Portugal. I fell off the board about fifty times and stood up only once, for two seconds — but that moment was amazing. I watched the instructor and thought, \"I want to do that.\" [C] So if I had more time and lived near the sea, I'd definitely **take up** surfing.",
          model5: "[A] If I could master any sport, I'd choose surfing. [R] It combines everything I love — the ocean, freedom and a fair amount of **adrenaline** — and it's so **physically demanding** that being genuinely good at it would feel like a real achievement. [E] Last summer, for example, I took a beginner's lesson in Portugal. I fell off the board about fifty times and managed to stand up just once, for roughly two seconds, yet that brief moment was exhilarating. Watching the instructor glide effortlessly across the waves, I remember thinking that's exactly what I want to be able to do. [C] So if I ever live near the coast, surfing is the first sport I'll **take up**." },
        { q: "Tell me about an experience you had while playing a sport or engaging in a physical activity that you remember well. What made it memorable?",
          lx: ["go the distance", "take part in", "sense of accomplishment"],
          model: "[A] The experience I remember best is running my first half marathon last spring. [R] It was memorable because it was very hard and I almost gave up, but I finished. [E] Around kilometer fifteen, my legs hurt so much that I wanted to stop and walk. But then I saw my friends at the side of the road with a funny poster with my name on it. They shouted and cheered, and I found new energy. I crossed the finish line in two hours and five minutes. [C] So it was special because of the pain, my friends and the proud feeling at the end.",
          model5: "[A] The experience I remember most vividly is **taking part in** my first half marathon last spring. [R] What made it so memorable was the contrast between how close I came to giving up and how incredible finishing felt. [E] Around the fifteenth kilometer, my legs were burning and I was seriously tempted to start walking. Just then, I spotted my friends by the roadside, holding a ridiculous homemade poster with my face on it and cheering at the top of their lungs. Somehow, that gave me the energy I needed to **go the distance**, and I crossed the line in just over two hours. [C] It taught me how much support from others can matter." },
        { q: "Some people believe that children should not participate in contact sports like rugby or hockey, because they could get hurt, while others believe that these sports teach awareness and teamwork. What do you think, and why?",
          lx: ["injury", "a team player", "safety rules"],
          model: "[A] I think children should be allowed to play contact sports, but with good rules and coaches. [R] These sports teach teamwork, discipline and how to deal with difficult moments. Of course, **injuries** can happen, but kids can also get hurt riding a bike. [E] For example, my cousin played hockey from the age of eight. He broke his wrist once, but he says hockey made him confident and taught him to be **a team player**. His coach always taught safe techniques first. [C] So the benefits are bigger than the risks, if adults make the sport safe.",
          model5: "[A] I believe children should be allowed to play contact sports, provided they're properly supervised. [R] Sports like rugby or hockey teach teamwork, discipline and resilience in a way few other activities can. Admittedly, the risk of **injury** is real, but children also get hurt climbing trees or riding bikes, and we don't ban those. [E] My cousin, for instance, has played hockey since he was eight. He did break his wrist once, but he insists the sport made him confident and taught him to be **a team player**, partly because his coach drilled safe techniques long before allowing any physical contact. [C] So with qualified coaches and strict rules, the benefits clearly outweigh the risks." }
      ]},
    { id: "s101", badge: "official", title: "Exercise Habits", src: "Official TOEFL · 101",
      scenario: "You have agreed to participate in a research study about exercise habits. You will have a short online interview with a researcher.",
      questions: [
        { q: "What kind of exercise do you or your friends like? For example, do you like running, swimming, yoga, or other types?",
          lx: ["go running", "do yoga", "lift weights"],
          model: "[A] I like running the most, and my friends like different things — yoga, swimming and the gym. [R] Running is simple and cheap. You just need shoes, and you can do it anywhere. It also helps me think and relax. [E] For example, my best friend **does yoga** every evening because it helps her with back pain from sitting all day. My roommate prefers to **lift weights** at the gym, and another friend swims twice a week. Sometimes we try each other's sports, which is fun. [C] So we all like different activities, but we all try to stay active.",
          model5: "[A] My own favorite is running, whereas my friends are into a real mix of activities — yoga, swimming and weightlifting. [R] What I love about running is its simplicity: all you need is a pair of shoes, and you can do it anywhere, at any time. It's also when I do my best thinking. [E] My best friend, by contrast, **does yoga** every evening, mainly to ease the back pain she gets from sitting at a desk all day. My roommate is devoted to **lifting weights**, and another friend swims twice a week. Every so often, we swap and try each other's activities, usually with hilarious results. [C] So our tastes differ, but we all make staying active a priority." },
        { q: "When you exercise, do you prefer to do it alone, or do you like to exercise with other people? Why?",
          lx: ["clear my head", "a workout buddy", "motivation"],
          model: "[A] It depends. I usually run alone, but I prefer the gym with a friend. [R] When I run alone, I can listen to music or podcasts and **clear my head**. But at the gym, a friend helps me stay motivated and try harder. [E] For example, when I go to the gym alone, I often leave after thirty minutes. When my roommate comes with me, we stay for an hour, push each other and even have fun. Also, it's harder to skip a workout when someone is waiting for you. [C] So running is my \"me time\", and the gym is better with a buddy.",
          model5: "[A] It really depends on the activity: I run alone, but I much prefer the gym with **a workout buddy**. [R] Running on my own is my time to switch off — I listen to podcasts or simply let my mind wander, which **clears my head** like nothing else. At the gym, however, company makes a huge difference to my **motivation**. [E] When I go alone, for instance, I often call it a day after thirty minutes, whereas with my roommate we easily stay an hour, pushing each other to lift a little more. Crucially, it's far harder to skip a session when someone is counting on you. [C] So running is my personal therapy, while the gym is definitely better as a team effort." },
        { q: "In the past, most people exercised outdoors, but now many people prefer indoor gyms and fitness centers. Do you think that in the future, indoor gyms will become even more popular? Why or why not?",
          lx: ["gym membership", "convenient", "outdoor activities"],
          model: "[A] I think gyms will stay popular, but they won't grow very much more. [R] Gyms are convenient — you can exercise in any weather and use good equipment. But now many people work out at home with online videos, and outdoor activities like hiking and running clubs are becoming trendy again. [E] For example, during the pandemic, my parents canceled their **gym membership** and started doing online workouts at home. They never went back. At the same time, my city has three new running clubs that meet in parks. [C] So I think people will mix gyms, home and outdoor exercise.",
          model5: "[A] I suspect gyms will remain popular, but I doubt they'll keep growing as fast as before. [R] They're undeniably convenient, offering professional equipment regardless of the weather. However, they now face strong competition from home workouts streamed online and from a revival of **outdoor activities** such as hiking and social running clubs. [E] My parents, for instance, canceled their **gym membership** during the pandemic, switched to online classes at home and never returned. Meanwhile, three new running clubs have sprung up in my city, all of which meet in local parks. [C] So rather than gyms dominating, I think the future belongs to people who mix gym, home and outdoor training." },
        { q: "Some people believe that exercising regularly is essential for developing self-discipline. Do you agree with this idea? Or do you think there are other activities that can also help build discipline? Explain your answer.",
          lx: ["self-discipline", "consistency", "routine"],
          model: "[A] I agree that regular exercise builds **self-discipline**, but it's not the only way. [R] When you exercise regularly, you have to do it even when you're tired or lazy, and that habit helps in other parts of life too. But learning a musical instrument or a language also needs daily effort. [E] For example, since I started running three times a week, I've become better at studying regularly, because I'm used to doing hard things on a schedule. My friend developed the same discipline by practicing the piano every day for ten years. [C] So exercise is a great way, but any regular challenge can build discipline.",
          model5: "[A] I'd agree that regular exercise is one of the best ways to build **self-discipline**, although it's certainly not the only one. [R] Training consistently means turning up even when you're tired or unmotivated, and that habit inevitably spills over into other areas of life. **That said**, anything that requires daily effort — learning an instrument or a language, for example — can have the same effect. [E] Since I started running three times a week, I've noticed I'm far more consistent with my studies, simply because I'm used to doing difficult things on schedule. A friend of mine, meanwhile, developed exactly the same discipline through ten years of daily piano practice. [C] Ultimately, it's **consistency**, not sport itself, that builds discipline." }
      ]},
    { id: "s109", badge: "official", title: "Exercise Habits", src: "Official TOEFL · 109",
      scenario: "You have volunteered for a research study about exercise habits. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, can you describe the type of exercise you or someone you know typically does regularly, such as running, yoga, or weightlifting? Why?",
          lx: ["lift weights", "build strength", "be in shape"],
          model: "[A] My father **lifts weights** at the gym four times a week. [R] He's fifty, and his doctor told him that strength training is important at his age to keep his bones and back healthy. He also says it gives him energy for work. [E] For example, he goes to the gym every morning before work, at six a.m. He started two years ago, and now he's much stronger and his back doesn't hurt anymore. He even beats me at arm wrestling! [C] So he started for his health, but now he really enjoys it.",
          model5: "[A] My father, at fifty, **lifts weights** at the gym four mornings a week. [R] He started on his doctor's advice, as strength training becomes increasingly important with age for protecting the bones and the back, but he's since discovered that it also gives him far more energy at work. [E] He's at the gym by six a.m. every weekday, before most people are even awake. In the two years since he began, he's **built** remarkable **strength**, his chronic back pain has disappeared and, somewhat embarrassingly for me, he now beats me at arm wrestling. [C] So what began as medical advice has turned into a genuine passion — proof that it's never too late to get **in shape**." },
        { q: "Some exercise programs are done alone, and some are designed to be done with others. Would you prefer to exercise alone, or would you prefer to exercise with others? Why?",
          lx: ["camaraderie", "motivation", "a team player"],
          model: "[A] I prefer exercising with others. [R] With other people, exercise feels like fun, not like work. People also motivate each other, and it's harder to skip a training session. [E] For example, I used to play football on my school team, and those were the best years of my sports life. Even in cold, rainy weather, everyone came to training because we didn't want to let the team down. When I exercise alone now, I miss that feeling. [C] So for me, exercise is much better with other people.",
          model5: "[A] Given the choice, I'd much rather exercise with others. [R] Exercising in a group turns a workout into a social occasion rather than a chore, and the sense of shared effort keeps everyone's **motivation** high. Besides, skipping a session is far harder when people are expecting you. [E] At school, for instance, I played on the football team, and those remain the best years of my sporting life. Even on freezing, rainy evenings, the whole team turned up, simply because nobody wanted to let the others down. What I miss most now isn't the football itself but the **camaraderie**. [C] So for me, exercise is always more rewarding when it's shared." },
        { q: "Some people believe that exercising outdoors is both more beneficial and more enjoyable than exercising indoors. Do you agree or disagree and why?",
          lx: ["fresh air", "clear my head", "boost your mood"],
          model: "[A] I agree. For me, exercising outdoors is better in almost every way. [R] You get fresh air and sunlight, and the views make exercise more interesting, so you don't feel bored. It also **boosts my mood** much more than the gym. [E] For example, when I run on a treadmill, thirty minutes feel like two hours, and I keep looking at the clock. But when I run in the park, I watch the trees, the dogs and the people, and an hour passes very quickly. Of course, in heavy rain or snow, the gym is a good option. [C] So outdoors is my first choice whenever the weather allows.",
          model5: "[A] I largely agree; in my experience, exercising outdoors is both more pleasant and more beneficial. [R] Fresh air and natural light **boost your mood** far more than a crowded gym, and changing scenery makes the time pass so quickly that you hardly notice the effort. [E] On a treadmill, for instance, thirty minutes feels like an eternity, and I can't stop checking the clock. Running through the park, by contrast, I'm distracted by the trees, the dogs and the other runners, and an hour simply flies by. **That said**, indoor gyms are invaluable in heavy rain or freezing temperatures. [C] So whenever the weather permits, I'll always choose the outdoors." },
        { q: "Some people like to use fitness apps on smartphones to organize their fitness schedules. Do you agree this is a good way to keep track of your exercising goals? Why or why not?",
          lx: ["keep track of", "track your progress", "self-discipline"],
          model: "[A] Yes, I think fitness apps are a good way to **keep track of** exercise goals. [R] They show your progress clearly, remind you to train and make you feel proud when you see your results. But they don't work if you only download them and never open them. [E] For example, I used a running app to prepare for my half marathon. It gave me a plan for every week and showed my distance and speed. Seeing my progress kept me motivated on lazy days. [C] So apps are helpful, but you still need **self-discipline**.", model5: "[A] I think fitness apps are an excellent way to **keep track of** exercise goals, as long as they're actually used. [R] They make progress visible, send timely reminders and provide a structured plan, which removes a lot of the guesswork. They can't, however, replace **self-discipline**; plenty of people download them with great enthusiasm and never open them again. [E] When I trained for my half marathon, for instance, my running app gave me a week-by-week plan and recorded every run. On days when I felt lazy, seeing how far I'd already come was often what got me out the door. [C] So apps are a powerful support tool, but the motivation still has to come from you." }
      ]},
    { id: "s098", badge: "official", title: "Exercise Programs", src: "Official TOEFL · 098",
      scenario: "You have volunteered for a research study at your university about exercise programs. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, do you think exercising daily is important for good health? Why or why not?",
          lx: ["stay active", "recovery", "sedentary"],
          model: "[A] I think moving every day is important, but hard training every day isn't necessary. [R] Our bodies need rest to recover. But many people have a very **sedentary** lifestyle, so even a short walk every day makes a big difference for the heart, the back and the mood. [E] For example, I run three times a week and go to the gym twice, but on rest days I still walk for thirty minutes. My doctor said this is perfect. My friend tried to train hard every day and got an injury after a month. [C] So daily activity, yes — daily intense exercise, no.",
          model5: "[A] I'd say staying active every day is essential, whereas intense training every day isn't. [R] With so many of us leading **sedentary** lives, even a brisk daily walk does wonders for the heart, the back and our mood. Hard workouts, however, require **recovery** days, because that's when the body actually gets stronger. [E] I run three times a week and lift weights twice, for instance, but on rest days I still walk for at least half an hour, which my doctor described as an ideal balance. A friend of mine, by contrast, insisted on training hard every single day and ended up injured within a month. [C] So the key is daily movement, not daily exhaustion." },
        { q: "Imagine you are going to recommend or create an exercise program for a friend or family member who does not currently exercise. What kind of exercise or fitness routine would you recommend? Why?",
          lx: ["take it one step at a time", "warm up", "build a habit"],
          model: "[A] For my mom, who doesn't exercise, I'd recommend walking and simple home exercises. [R] When you start, it's important to choose something easy and pleasant, so you don't give up. Walking is free, safe and doesn't need any equipment. [E] For example, in the first month, she would walk for twenty minutes three times a week. Then I'd add ten minutes of easy exercises at home, like squats and stretching, with a video. After two or three months, she could try a yoga class or swimming. [C] So my program would start very small and slowly get harder.",
          model5: "[A] For my mother, who's never really exercised, I'd design a program based on walking and simple home exercises. [R] For a beginner, the priority isn't intensity but enjoyment; if the first weeks feel miserable, people quit. Walking is free, low-risk and requires no equipment, which removes most excuses. [E] In the first month, she'd walk briskly for twenty minutes three times a week. In month two, I'd add ten minutes of gentle home exercises, such as squats and stretching, following a beginner video. By month three, once she'd **built the habit**, she might be ready for a yoga class or swimming. [C] In short, I'd **take it one step at a time**, so that exercise becomes a routine rather than a punishment." },
        { q: "For that same friend or family member, what do you think might challenge them the most about a regular exercise program? How would you help them through this challenge?",
          lx: ["run out of steam", "motivation", "accountability"],
          model: "[A] I think the biggest challenge for my mom would be staying motivated after the first few weeks. [R] At the beginning, everyone is excited, but then work, tiredness and bad weather appear, and people find excuses. [E] To help her, I'd walk with her on Sundays and call her on other days to ask how her walk went. I'd also suggest she listen to her favorite podcasts while walking, so it becomes \"her time\". And I'd remind her of her progress — for example, how much less tired she feels on the stairs. [C] So support and small rewards would help her not give up.",
          model5: "[A] The biggest challenge, I suspect, would be sustaining her **motivation** once the initial excitement wore off. [R] Most beginners start enthusiastically, but after a few weeks, work, fatigue and bad weather provide endless excuses, and they gradually **run out of steam**. [E] To help her through that stage, I'd join her for walks on Sundays and check in by phone on the other days, giving her a bit of friendly **accountability**. I'd also encourage her to save her favorite podcasts for her walks, so the exercise becomes something she looks forward to. Above all, I'd regularly point out her progress, such as how much easier the stairs have become. [C] Support and visible progress, I think, are what keep beginners going." },
        { q: "Some people believe that it is important to have some sort of reward after a good week of exercising. What do you think would be a good reward for the program you created, and why?",
          lx: ["reward", "sense of accomplishment", "treat yourself"],
          model: "[A] I think a good reward for my mom would be a nice experience, like a trip to a spa or a new book. [R] Rewards help people stay motivated, especially at the beginning. But the reward shouldn't be unhealthy, like a big cake, because that goes against the goal. [E] For example, after each good week, she could buy herself a new audiobook to listen to on her walks. After a whole month, we could go to the spa together. This way, the rewards are connected to her new healthy lifestyle. [C] So the best rewards are pleasant and support the habit.",
          model5: "[A] The ideal reward, in my view, would be something enjoyable that reinforces the habit rather than undermines it. [R] Rewards are particularly useful for beginners, before exercise becomes rewarding in itself. A huge slice of cake, however, would send exactly the wrong message. [E] For my mother, for instance, every successful week could earn her a new audiobook, which she'd then listen to on her next walks, so the reward literally feeds the routine. After a full month, we could **treat ourselves** to a day at a spa together. [C] So I'd choose rewards that feel like a celebration, but that also make her look forward to the next workout." }
      ]},
    { id: "s105", badge: "official", title: "Outdoor Activities", src: "Official TOEFL · 105",
      scenario: "You have volunteered for a research study about outdoor activities. You will have a short online interview with a researcher.",
      questions: [
        { q: "First, what kind of outdoor sports do you or your friends generally like to do? For example, do you like hiking, cycling, tennis, or other types of sport?",
          lx: ["go hiking", "outdoor activities", "fresh air"],
          model: "[A] My friends and I love hiking, and in summer we also play beach volleyball. [R] We spend all week inside — at lectures and in front of laptops — so on weekends we want to be in nature and get some fresh air. [E] For example, once a month we take a train to the mountains outside the city and **go hiking** for the whole day. Last month we walked twenty kilometers and had a picnic at a lake. In summer, we play volleyball on the beach almost every Saturday. [C] So **outdoor activities** are our favorite way to relax together.",
          model5: "[A] My friends and I are really into hiking, and in summer, beach volleyball becomes our weekend obsession. [R] After spending the entire week indoors, staring at screens in lectures and libraries, we crave **fresh air** and open space. [E] Roughly once a month, for instance, we catch an early train to the mountains and **go hiking** for the whole day. Last month we covered twenty kilometers and finished with a picnic beside a glacier lake, which more than made up for our aching legs. During the summer, meanwhile, we play volleyball on the beach almost every Saturday, mostly badly but always enthusiastically. [C] So **outdoor activities** are, above all, how we recharge together." },
        { q: "When you participate in your favorite outdoor activity, do you prefer to do it alone, or do you like to do it together with your family or friends? Why?",
          lx: ["safety", "share the experience", "camaraderie"],
          model: "[A] For hiking, I definitely prefer going with friends. [R] First, it's safer — if someone gets hurt or lost in the mountains, others can help. Second, it's much more fun to share beautiful views and talk on the way. [E] For example, last year on a hike, my friend twisted her ankle far from the town. Because we were a group, two of us helped her walk while another person called for help. If she had been alone, it could have been dangerous. Also, our best conversations happen on long walks. [C] So for hiking, a group is both safer and more enjoyable.",
          model5: "[A] When it comes to hiking, I'd always choose to go with friends. [R] For one thing, it's considerably safer: if someone gets injured or lost in the mountains, others are there to help. For another, a stunning view is somehow twice as rewarding when you **share the experience**. [E] Last year, for instance, a friend twisted her ankle badly several kilometers from the nearest village. Because we were a group, two of us supported her while a third called the mountain rescue service. Had she been alone, the situation could have turned serious. Besides, some of our best conversations have taken place on long trails. [C] So company makes hiking both safer and far more memorable." },
        { q: "Where I live, outdoor activities are becoming increasingly popular. Do you think that in the place you live, the popularity of outdoor activities will increase in the future? Why or why not?",
          lx: ["outdoor activities", "jump on the bandwagon", "sedentary"],
          model: "[A] Yes, I think outdoor activities will become more popular in my city. [R] People work and study in front of screens all day, so they want to spend free time in nature. Also, social media makes hiking and cycling look cool and trendy. [E] For example, three years ago, there was only one running club in my city. Now there are five, and every weekend I see big groups of young people cycling along the river. The city also built new bike lanes and an outdoor gym in the park. [C] So I'm sure this trend will continue.",
          model5: "[A] I'm fairly confident they will. [R] As our lives become ever more **sedentary** and screen-based, people increasingly crave time outdoors. Social media has played a role too, making hiking and cycling look trendy, so many people are **jumping on the bandwagon**. [E] Three years ago, for example, my city had a single running club; today there are five, and every weekend the riverside is packed with groups of young cyclists. The local government has also built new bike lanes and an open-air gym in the central park, which suggests it expects demand to keep growing. [C] So, whether driven by health or by fashion, outdoor activities look set to become even more popular." },
        { q: "Some people believe that outdoor activities are essential for children's physical and mental health. Do you agree with this idea or do you think indoor activities can be just as beneficial for children? Explain why you think so.",
          lx: ["screen time", "physical and mental health", "well-rounded"],
          model: "[A] I agree that outdoor activities are essential for children. [R] Kids today spend a lot of time with phones and tablets inside. Playing outside helps them move, get fresh air, take small risks and make friends. Indoor activities like chess or music are useful too, but they can't replace running around outside. [E] For example, my little cousin used to play video games all day and was often grumpy. Since his parents started taking him to the park every day after school, he sleeps better and has made new friends. [C] So indoor activities are good, but outdoor play is necessary.",
          model5: "[A] I'd agree that outdoor activities are essential, although indoor ones have their own value. [R] With children's **screen time** at record levels, outdoor play offers something nothing else can: physical movement, fresh air and the chance to take small, healthy risks while learning to get along with others. Indoor activities like chess or music certainly develop the mind, but they can't replace that. [E] My younger cousin, for instance, used to spend entire afternoons gaming and was constantly irritable. Since his parents started taking him to the park after school, he sleeps better, seems calmer and has made several new friends. [C] So a **well-rounded** childhood needs both, but outdoor play is non-negotiable." }
      ]}
  ],
